on: the practitioner learns established facts, procedures, and patterns until they become second nature.","line":143,"cut":false}},{"id":"t2-4-5","tier":"t2-4","no":"4.5","title":"The rate-limiting shift: an analytic consequence","intro":false,"line_start":145,"line_end":165,"paras":6,"size":349,"first":{"text":"Table 1 summarizes the decomposition; Fig. 2 provides a visual representation of the rate-limiting shift.","line":147,"cut":false}},{"id":"t2-5","tier":"t2-5","no":"5","title":"Convergent evidence","intro":true,"line_start":166,"line_end":169,"paras":1,"size":49,"first":{"text":"The assay proposed in this article is a conceptual-operational contribution, not an empirical study.","line":168,"cut":false}},{"id":"t2-5-1","tier":"t2-5","no":"5.1","title":"Predictive validity","intro":false,"line_start":170,"line_end":173,"paras":1,"size":166,"first":{"text":"The assay predicts that specification quality determines output quality independently of externalization-cost quality.","line":172,"cut":false}},{"id":"t2-5-2","tier":"t2-5","no":"5.2","title":"Discriminant validity","intro":false,"line_start":174,"line_end":177,"paras":1,"size":151,"first":{"text":"The assay predicts that Sein-type and Sollen-type components vary independently — that improving one does not automatically improve the other.","line":176,"cut":false}},{"id":"t2-5-3","tier":"t2-5","no":"5.3","title":"Convergent and ecological validity","intro":false,"line_start":178,"line_end":183,"paras":2,"size":389,"first":{"text":"Two further studies provide convergent support from different disciplinary angles.","line":180,"cut":false}},{"id":"t2-5-4","tier":"t2-5","no":"5.4","title":"Failure modes","intro":false,"line_start":184,"line_end":187,"paras":1,"size":203,"first":{"text":"The assay's practical utility depends on acknowledging where it fails.","line":186,"cut":false}},{"id":"t2-6","tier":"t2-6","no":"6","title":"Discussion","intro":true,"line_start":188,"line_end":191,"paras":1,"size":84,"first":{"text":"Having specified the scoring protocol, this discussion turns to what the framework clarifies about legitimate delegation in AI-assisted knowledge work.","line":190,"cut":false}},{"id":"t2-6-1","tier":"t2-6","no":"6.1","title":"The assay structure in practice: convergent implementation and convergent failure","intro":false,"line_start":192,"line_end":201,"paras":4,"size":339,"first":{"text":"The scoring structure proposed in Section 3 — Sein-row evaluation by AI, Sollen-row evaluation by domain expert — is not merely a theoretical construct.","line":194,"cut":false}},{"id":"t2-6-2","tier":"t2-6","no":"6.2","title":"Implications for AGI discourse","intro":false,"line_start":202,"line_end":205,"paras":1,"size":112,"first":{"text":"Current large language models, viewed through the assay's lens, function as domain-general cognitive catalysts: they accelerate externalization-cost processing across all domains but depend on the user for specification — for the judgments about what matters, ","line":204,"cut":true}},{"id":"t2-6-3","tier":"t2-6","no":"6.3","title":"Agent-relative residues in LLM output","intro":false,"line_start":206,"line_end":209,"paras":1,"size":304,"first":{"text":"The delegation legitimacy boundary was derived for human judgment, but its structural logic extends to a governance question about LLM output itself.","line":208,"cut":false}},{"id":"t2-6-4","tier":"t2-6","no":"6.4","title":"Scope, limitations, and safeguards","intro":false,"line_start":210,"line_end":223,"paras":6,"size":469,"first":{"text":"The assay's scope is delimited by the SECI processes it re-describes.","line":212,"cut":false}},{"id":"t2-6-5","tier":"t2-6","no":"6.5","title":"Do-type as a heuristic extension","intro":false,"line_start":224,"line_end":227,"paras":1,"size":150,"first":{"text":"A final, more heuristic implication concerns the label Do-type introduced for practice-sustained Sollen-type specification.","line":226,"cut":false}},{"id":"t2-7","tier":"t2-7","no":"7","title":"Conclusion","intro":false,"line_start":228,"line_end":241,"paras":5,"size":430,"first":{"text":"This article derived a decomposition within the specification concept introduced by the Mekiki framework (Tomita 2026), grounding the distinction in the is–ought separation (Hume 1739; Kant 1781, 1785) and operationalizing it as the axes of a cognitive assay.","line":230,"cut":false}},{"id":"t2-postscript","tier":"t2-postscript","no":"","title":"Postscript","intro":false,"line_start":242,"line_end":247,"paras":1,"size":94,"first":{"text":"Mekiki — the Japanese term for expert discernment — names the vernacular practice that the present article operationalizes through philosophical decomposition and a measurement protocol.","line":244,"cut":false}}],"refs":[{"from":"t2-2-2","to":"t2-3-1","to_no":"3","line":47,"text":"The scoring protocol introduced in Section 3 operationalizes this question as a ratio profile rather than a binary classification.","cut":false,"dir":"fwd"},{"from":"t2-2-3","to":"t2-3-1","to_no":"3","line":53,"text":"This irreducibility provides the deepest philosophical justification for the scoring asymmetry introduced in Section 3: Sollen-type components require evaluation by an agent whose perspective is constitutively relevant to the judgment, not by a system that operates from a view from nowhere.","cut":false,"dir":"fwd"},{"from":"t2-2-3","to":"t2-1","to_no":"1","line":55,"text":"The delegation legitimacy boundary, introduced in Section 1, runs along this distinction.","cut":false,"dir":"back"},{"from":"t2-2-4","to":"t2-4","to_no":"4","line":69,"text":"Section 4 carries out this analysis.","cut":false,"dir":"fwd"},{"from":"t2-3-2","to":"t2-2-2","to_no":"2.2","line":81,"text":"The Mekiki case study contains approximately thirty such decisions; Section 2.2 showed that they contain separable Sein-type and Sollen-type components.","cut":false,"dir":"back"},{"from":"t2-3-2","to":"t2-2-1","to_no":"2","line":97,"text":"First, the scorer asymmetry — AI for Sein rows, domain expert for Sollen rows — is not a design preference but a consequence of the decomposition derived in Section 2.","cut":false,"dir":"back"},{"from":"t2-3-2","to":"t2-3-3","to_no":"3.3","line":103,"text":"Discriminant validity requires that Sein-type and Sollen-type scores vary independently; the domain-ablation experiment (Section 3.3 below) and Kusumegi et al.'s population-level data both confirm this independence.","cut":false,"dir":"fwd"},{"from":"t2-3-3","to":"t2-4","to_no":"4","line":113,"text":"Section 4 applies the assay at a larger scale, re-describing the full SECI model through the Sein/Sollen decomposition.","cut":false,"dir":"fwd"},{"from":"t2-3-4","to":"t2-6-5","to_no":"6.5","line":123,"text":"At the level relevant to delegation, agent-relative evaluative commitments sustained through practice and oriented toward ideals of excellence constitute a Do-type state of Sollen-type specification (from Japanese *dō*, practice-sustained engagement; elaborated in Section 6.5).","cut":false,"dir":"fwd"},{"from":"t2-4","to":"t2-2-1","to_no":"2","line":127,"text":"The cognitive assay developed in Sections 2 and 3 was derived from the Externalization process.","cut":false,"dir":"back"},{"from":"t2-4","to":"t2-3-1","to_no":"3","line":127,"text":"The cognitive assay developed in Sections 2 and 3 was derived from the Externalization process.","cut":false,"dir":"back"},{"from":"t2-4","to":"t2-2-4","to_no":"2.4","line":127,"text":"But as Section 2.4 established, the Sein/Sollen distinction is orthogonal to the SECI process distinction: it applies within any process, not between them.","cut":false,"dir":"back"},{"from":"t2-5-3","to":"t2-4-3","to_no":"4.3","line":180,"text":"Scharfmann, Marx, and Fleming (2025), whose cross-domain co-location findings were discussed in Section 4.3, provide ecological support from the opposite direction: the pattern they documented is","cut":true,"dir":"back"},{"from":"t2-5-4","to":"t2-5-1","to_no":"5.1","line":186,"text":"The same dataset that supports predictive validity (Section 5.1) also bears on failure-mode detection: Thorgeirsson et al.'s finding that LLM usage","cut":true,"dir":"back"},{"from":"t2-6","to":"t2-3-4","to_no":"3.4","line":190,"text":"As noted in Section 3.4, Sein-type components and Sin-type material can often be reproduced as textual regularities, whereas Do-type commitments and other agent-relative residues require renewed human evaluation.","cut":false,"dir":"back"},{"from":"t2-6-1","to":"t2-3-1","to_no":"3","line":194,"text":"The scoring structure proposed in Section 3 — Sein-row evaluation by AI, Sollen-row evaluation by domain expert — is not merely a theoretical construct.","cut":false,"dir":"back"},{"from":"t2-6-3","to":"t2-5-3","to_no":"5.3","line":208,"text":"The Klowden and Tao (2026) observation discussed in Section 5.3 points to the same structural tension from the user's side.","cut":false,"dir":"back"},{"from":"t2-6-4","to":"t2-6-3","to_no":"6.3","line":222,"text":"The agent-relative residues discussed in Section 6.3 suggest that the cognitive assay's analytical vocabulary may eventually find application","cut":true,"dir":"back"}],"figs":[{"kind":"table","no":1,"label":"Table 1","caption":"Table 1. SECI processes decomposed by the cognitive assay's three components.","line":149,"anchor":"t2-4-5","unit":"t2-4-5","omitted":false,"match":"exact"},{"kind":"figure","no":1,"label":"Fig. 1","caption":"Fig. 1. Positioning of the present article.","line":370,"anchor":"t2-figure-legends-images-omitted","unit":"t2-2-3","omitted":true,"match":"exact"},{"kind":"figure","no":2,"label":"Fig. 2","caption":"Fig. 2. First application of the cognitive assay to the SECI spiral.","line":372,"anchor":"t2-figure-legends-images-omitted","unit":"t2-4-5","omitted":true,"match":"exact"}],"parts":[{"id":"t2-abstract-p1","unit":"t2-abstract","k":1,"lines":[13,15],"label":"Abstract","does":"summary","says":"The paper makes the delegation legitimacy boundary (the line between where human judgment can legitimately be delegated to AI and where it cannot) measurable, and sets out a five-step scoring protocol for locating it within a task. It divides the inside of specification into a factual component (Sein-type) and a value-laden component (Sollen-type). Applying this to SECI yields, as an analytic consequence, that when AI accelerates externalization and combination the rate-limiting stage shifts to socialization and internalization.","quote":{"paper":"T2","text":"proposes a minimal scoring protocol for locating it within any knowledge-work task","line":13,"anchor":"t2-abstract","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-1-p1","unit":"t2-1","k":1,"lines":[21,21],"label":"Judgment made visible","does":"frame","says":"As AI compressed the cost of giving expertise a form, the judgments that expertise carries (what to build, what to exclude, by what to assess quality) came to the surface. The earlier framework separated specification from externalization cost, but did not examine the inside of specification.","quote":{"paper":"T2","text":"What the framework left unexamined was the internal structure of specification itself.","line":21,"anchor":"t2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-1-p2","unit":"t2-1","k":2,"lines":[23,23],"label":"Approach from legitimacy","does":"positioning","says":"The standard for decisions that use AI has moved from whether they can be explained to whether they can be justified and contested. Part of a decision cannot be delegated not because AI lacks computational power, but because the output’s warrant must be traceable to a source whose legitimacy is socially recognized.","quote":{"paper":"T2","text":"the output's warrant must be traceable to a source whose legitimacy is socially recognized","line":23,"anchor":"t2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-1-p3","unit":"t2-1","k":3,"lines":[25,25],"label":"Tacit knowledge at risk","does":"positioning","says":"The debate on tacit knowledge (Gill, Collins, Ferdman) converges on one concern: that AI, in accelerating what can be put into words, may at the same time be eroding the conditions that sustain the hard-to-verbalize part on which quality depends.","quote":{"paper":"T2","text":"These contributions converge on a shared concern","line":25,"anchor":"t2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-1-p4","unit":"t2-1","k":4,"lines":[27,27],"label":"The missing middle layer","does":"claim","says":"The argument that human judgment matters has been made in full. What is missing is a means of measurement: a way to divide a judgment into components, decide which component carries which kind of weight, and assign each to the appropriate scorer. The paper does not claim untrodden ground; it presents this middle layer as a whole.","quote":{"paper":"T2","text":"What is missing is not another argument for the importance of human judgment","line":27,"anchor":"t2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-1-p5","unit":"t2-1","k":5,"lines":[29,29],"label":"The cognitive assay","does":"frame","says":"Specification is divided into Sein-type and Sollen-type, and the philosophical distinction is used not as a normative prescription but as a coordinate of measurement. The scoring asymmetry is not a design choice; it follows structurally from the delegation legitimacy boundary. The boundary is a legitimacy claim, not a capability claim, and it holds as long as the authority to make value judgments remains institutionally attributed to human agents.","quote":{"paper":"T2","text":"The boundary is not a capability claim; it is a legitimacy claim, and it holds as long as the authority to make value judgments remains institutionally attributed to human agents.","line":29,"anchor":"t2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-1-p6","unit":"t2-1","k":6,"lines":[31,31],"label":"Applied to SECI","does":"implication","says":"As a first application, the four SECI processes are re-described with the assay. The analytic consequence is that AI’s acceleration of externalization and combination shifts the rate-limiting stage to socialization and internalization. Both remain human-limited processes.","quote":{"paper":"T2","text":"Both remain human-limited processes.","line":31,"anchor":"t2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-1-p1","unit":"t2-2-1","k":1,"lines":[37,37],"label":"Three concepts","does":"definition","says":"Expertise is a resource the practitioner possesses. Specification cost is a property of the task: the degree to which the task demands that resource. Specification is the concrete judgments that result when expertise is invested in a task. What this paper asks about is the internal structure of specification.","quote":{"paper":"T2","text":"is a property of the task: the degree to which the task demands that resource","line":37,"anchor":"t2-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-2-p1","unit":"t2-2-2","k":1,"lines":[41,43],"label":"Factual judgments","does":"grounds","says":"Re-examining the record of the earlier paper’s case, two kinds of judgment can be told apart. One is factual: it concerns how a data structure behaves or what users perceive. Given sufficient data and training, an AI could in principle arrive at the same determinations.","quote":{"paper":"T2","text":"Given sufficient data and domain-relevant training, an AI system could in principle arrive at the same determinations.","line":43,"anchor":"t2-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-2-p2","unit":"t2-2-2","k":2,"lines":[45,45],"label":"Value-laden judgments","does":"grounds","says":"The other is value-laden: it concerns how things ought to be, like the decision not to display charger availability. An AI can generate such outputs, but it cannot supply the warrant that makes the judgment legitimate.","quote":{"paper":"T2","text":"An AI system can generate such outputs, but it cannot supply the warrant","line":45,"anchor":"t2-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-2-p3","unit":"t2-2-2","k":3,"lines":[47,47],"label":"A minimal decomposition","does":"limit","says":"This two-way division is a minimal decomposition, not a claim that every judgment falls cleanly on one side. Most judgments in practice are hybrid, and the scoring protocol treats this as a ratio profile rather than a binary.","quote":{"paper":"T2","text":"Most judgments in practice are hybrid","line":47,"anchor":"t2-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-3-p1","unit":"t2-2-3","k":1,"lines":[51,51],"label":"Hume and Kant","does":"positioning","says":"The distinction is not new. Hume observed that premises about what is the case cannot, by themselves, yield a conclusion about what ought to be the case, and Kant systematized this as Sein and Sollen. The paper adopts Kant’s terms.","quote":{"paper":"T2","text":"It is, in fact, among the oldest in Western philosophy.","line":51,"anchor":"t2-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-3-p2","unit":"t2-2-3","k":2,"lines":[53,53],"label":"Irreducible values","does":"grounds","says":"Williams showed that a clean division into pure Sein and pure Sollen is not always possible. Nagel argued that values cannot be reduced to a single scale, and that agent-relative reasons cannot be reduced to reasons available from any standpoint. The paper takes this as the deepest philosophical ground for the scoring asymmetry.","quote":{"paper":"T2","text":"This irreducibility provides the deepest philosophical justification for the scoring asymmetry introduced in Section 3","line":53,"anchor":"t2-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-3-p3","unit":"t2-2-3","k":3,"lines":[55,55],"label":"Where the boundary runs","does":"claim","says":"The delegation legitimacy boundary runs along this distinction. Sein-type specification can in principle be absorbed, little by little, into AI processing. Sollen-type specification is not, not because AI cannot generate the output but because the legitimacy of that output cannot be grounded in the system itself. The claim is about warrant, not capability.","quote":{"paper":"T2","text":"The claim is not about capability but about warrant.","line":55,"anchor":"t2-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-3-p4","unit":"t2-2-3","k":4,"lines":[57,61],"label":"A three-layer description","does":"frame","says":"Together with the earlier two conditions, this gives three layers: externalization cost (which AI removes or greatly compresses), Sein-type specification (which AI can learn little by little), and Sollen-type specification (where the boundary lies).","quote":{"paper":"T2","text":"yields a three-layer description of knowledge work under AI assistance","line":57,"anchor":"t2-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-3-p5","unit":"t2-2-3","k":5,"lines":[63,63],"label":"Distinct from Sollen","does":"limit","says":"Sollen-type specification is a practitioner’s capacity to make value judgments. It is distinct from Sollen as normative pressure from the environment, such as institutional norms and regulation. Confusing the two leads to misreading it as an external burden to be removed.","quote":{"paper":"T2","text":"should not be confused with Sollen as an environmental normative pressure","line":63,"anchor":"t2-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-4-p1","unit":"t2-2-4","k":1,"lines":[67,67],"label":"Across four processes","does":"claim","says":"Neither the distinction between specification and externalization cost nor the Sein/Sollen decomposition is peculiar to the externalization process; both cut across all four SECI processes. The distinction applies within a process, not between processes.","quote":{"paper":"T2","text":"The Sein/Sollen distinction is orthogonal to the SECI process distinction","line":67,"anchor":"t2-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-4-p2","unit":"t2-2-4","k":2,"lines":[69,69],"label":"Orthogonal, so usable","does":"grounds","says":"Because Sein and Sollen are orthogonal to the distinction between processes, a matrix analysis that divides each process by kind of judgment becomes possible, and asymmetries invisible to either framework alone come into view.","quote":{"paper":"T2","text":"This orthogonality is what makes the distinction usable as an assay axis.","line":69,"anchor":"t2-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-4-p3","unit":"t2-2-4","k":3,"lines":[71,71],"label":"Level of analysis","does":"limit","says":"The level of analysis is the structure of knowledge activity (the level of processes). No claims are made about individual cognition, organizational design or regulatory policy.","quote":{"paper":"T2","text":"The framework does not make claims about individual cognition","line":71,"anchor":"t2-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-1-p1","unit":"t2-3-1","k":1,"lines":[77,77],"label":"The noise has dropped","does":"grounds","says":"Measurement becomes possible only once background noise has fallen far enough. Formerly, specification and externalization cost were entangled. AI compressed externalization cost, the noise floor dropped, and specification could be isolated as a variable.","quote":{"paper":"T2","text":"AI's compression of externalization cost has substantially lowered this noise floor.","line":77,"anchor":"t2-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p1","unit":"t2-3-2","k":1,"lines":[81,83],"label":"Unit of scoring","does":"definition","says":"The unit of analysis is each judgment recorded in the design process (a feature decision). The protocol proceeds in five steps.","quote":{"paper":"T2","text":"a single judgment recorded in the design process","line":81,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p2","unit":"t2-3-2","k":2,"lines":[85,87],"label":"Extraction and gaps","does":"procedure","says":"In step 1, AI extracts individual judgments from the design record. In step 1b, an expert adds the judgments the AI could not pick up. Where absence from the record is itself the judgment, as with a feature that was not built, AI cannot extract it.","quote":{"paper":"T2","text":"its absence from the record was itself the judgment","line":87,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p3","unit":"t2-3-2","k":3,"lines":[89,89],"label":"Types of operation","does":"procedure","says":"In step 2, each judgment is tagged with a type of operation (detection, prioritization, exclusion, justification). This description is independent of scoring; all four can appear in both the Sein row and the Sollen row.","quote":{"paper":"T2","text":"All four types can appear in both the Sein and Sollen rows","line":89,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p4","unit":"t2-3-2","k":4,"lines":[91,93],"label":"Scoring the two rows","does":"procedure","says":"In step 3 AI scores the factual component, and in step 4 an expert scores the value-laden component, on the same three-point scale. Because Sollen-type judgments have no natural ground truth, several experts score independently and disagreements are adjudicated to check reliability.","quote":{"paper":"T2","text":"Because Sollen-type judgments lack natural ground truth","line":93,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p5","unit":"t2-3-2","k":5,"lines":[95,95],"label":"No summing","does":"claim","says":"In step 5 the scores are not summed into a single index. Sein-type quality and Sollen-type quality are dimensions that cannot be measured on the same scale, so the mean and spread of each row and the distribution of hybrid judgments are reported as a ratio profile.","quote":{"paper":"T2","text":"Scores are not summed into a single index.","line":95,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p6","unit":"t2-3-2","k":6,"lines":[97,97],"label":"Two structural features","does":"claim","says":"The asymmetry between scorers is not a design preference but a consequence of the decomposition. The protocol itself embodies the asymmetry: the expert’s decisive interventions are at steps 1b and 4. A protocol for measuring the boundary that could itself be fully delegated would be self-defeating.","quote":{"paper":"T2","text":"A protocol for measuring the delegation legitimacy boundary that was itself fully delegable would be self-defeating.","line":97,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p7","unit":"t2-3-2","k":7,"lines":[99,99],"label":"Institutional function","does":"implication","says":"Scoring of the Sein row by AI is not neutral in any absolute sense, but it can act as a procedural check on distortions that enter evaluation between people, such as status defense, face and motivated reasoning. AI is used not as an authority but as a provisional scorer that can be audited and contested.","quote":{"paper":"T2","text":"The point is not to treat AI as an authority","line":99,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p8","unit":"t2-3-2","k":8,"lines":[101,101],"label":"Choosing the experts","does":"procedure","says":"Criteria for each domain are left to that domain. Scorers should hold accountability for the kind of judgment in question, be in an evaluating role, and, where possible, score independently, with adjudication.","quote":{"paper":"T2","text":"scorers should hold accountability for the relevant judgment type","line":101,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p9","unit":"t2-3-2","k":9,"lines":[103,103],"label":"Validity, failure modes","does":"limit","says":"Validity rests on evidence that the quality of specification predicts output quality independently of the quality of externalization. There are two failure modes: false positives, in which high externalization quality hides the absence of specification, and false negatives, in which friction in externalization obscures genuine specification.","quote":{"paper":"T2","text":"The assay admits two principal failure modes.","line":103,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-3-p1","unit":"t2-3-3","k":1,"lines":[107,111],"label":"Scoring two judgments","does":"example","says":"One Sein-dominant and one Sollen-dominant judgment from the case are scored as a demonstration. The decision on a current-based data structure scores 2 on the Sein row and 0 on the Sollen row. The decision not to display availability scores 1 on the Sein row and 2 on the Sollen row.","quote":{"paper":"T2","text":"one Sein-dominant, one Sollen-dominant","line":107,"anchor":"t2-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-3-p2","unit":"t2-3-3","k":2,"lines":[113,113],"label":"With expertise removed","does":"grounds","says":"In the condition where the same app was built without expertise, part of the Sein row remained, while the Sollen row dropped systematically toward zero. The two components come apart on the score sheet.","quote":{"paper":"T2","text":"the Sollen row dropped systematically toward zero","line":113,"anchor":"t2-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-3-p3","unit":"t2-3-3","k":3,"lines":[115,115],"label":"Criterion contamination","does":"limit","says":"This example is taken from the theory-builder’s own case. Blind scoring by experts who do not know the framework is needed as a test of external validity. What has been shown here is only that the protocol can be applied and separates the two components as predicted.","quote":{"paper":"T2","text":"This worked example is drawn from the theory-builder's own case study.","line":115,"anchor":"t2-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-4-p1","unit":"t2-3-4","k":1,"lines":[119,119],"label":"Other candidate axes","does":"positioning","says":"Sein and Sollen are a minimal axis, not the only one. Aristotle’s practical wisdom, and Kant’s determining and reflective judgment, are also candidates for coordinates of measurement.","quote":{"paper":"T2","text":"it is not the only philosophical distinction that could serve as a measurement coordinate","line":119,"anchor":"t2-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-4-p2","unit":"t2-3-4","k":2,"lines":[121,121],"label":"Subclasses of Sollen","does":"limit","says":"Nagel’s classification suggests that the Sollen-type component can be divided further. The paper’s protocol treats Sollen-type as undivided and defers sub-classification. However finely it is divided, it cannot be reduced to Sein-type evaluation.","quote":{"paper":"T2","text":"sub-classification is deferred","line":121,"anchor":"t2-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-4-p3","unit":"t2-3-4","k":3,"lines":[123,123],"label":"Do-type and Sin-type","does":"implication","says":"When a standard of evaluation takes hold in social practice, that is a change of state within Sollen-type specification, not a conversion into Sein-type. A state maintained in practice (Do-type) becomes Sin-type once it is codified as rules or standards, and AI can then more easily reproduce it as regularities of text. AI does not, however, inherit the legitimacy by which that arrangement gained its authority. This is an interpretive extension, not a scoring dimension.","quote":{"paper":"T2","text":"This dynamic distinction is introduced as an interpretive extension, not as an additional scoring dimension in the present protocol.","line":123,"anchor":"t2-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-p1","unit":"t2-4","k":1,"lines":[127,127],"label":"To a matrix analysis","does":"frame","says":"Using the orthogonality of the distinction to the processes, the four SECI processes are divided into the components of externalization cost, Sein-type specification and Sollen-type specification. This is not an exegesis of the original model but a constructive refinement.","quote":{"paper":"T2","text":"The re-description is not an exegesis of the original model but a constructive refinement","line":127,"anchor":"t2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-1-p1","unit":"t2-4-1","k":1,"lines":[131,131],"label":"Externalization: cost","does":"claim","says":"Externalization is the process dominated by externalization cost, and AI compresses it greatly. Sollen-type specification, what should be put out and what withheld, does not change merely because the conversion has become easier.","quote":{"paper":"T2","text":"does not change merely because the conversion has become easier","line":131,"anchor":"t2-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-2-p1","unit":"t2-4-2","k":1,"lines":[135,135],"label":"Combination: AI’s forte","does":"claim","says":"Combination is an operation on knowledge already given form; it carries the most externalization cost, and AI can accelerate it most. Judgment about which combinations are meaningful enters only at the stage of evaluation and is not automated.","quote":{"paper":"T2","text":"The Combination process itself is largely automatable","line":135,"anchor":"t2-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-3-p1","unit":"t2-4-3","k":1,"lines":[139,139],"label":"Socialization: Sollen","does":"claim","says":"Socialization is the process in which Sollen-type specification is most concentrated: value judgments are formed, contested and revised there. AI can take part by offering other views, but it cannot be the source of legitimacy for the normative commitments that arise. This is where the boundary is most visible.","quote":{"paper":"T2","text":"The delegation legitimacy boundary is most visible here.","line":139,"anchor":"t2-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-4-p1","unit":"t2-4-4","k":1,"lines":[143,143],"label":"Internalization: catalyst","does":"claim","says":"Internalization weighs toward Sein-type specification, and AI can be a catalyst that speeds the absorption of codified knowledge. But internalization has a side in which an evaluative orientation, a sense of what matters, grows through practice, and AI cannot substitute for that formation.","quote":{"paper":"T2","text":"it cannot substitute for the experiential formation of evaluative judgment","line":143,"anchor":"t2-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-5-p1","unit":"t2-4-5","k":1,"lines":[147,158],"label":"Table: four processes","does":"summary","says":"Table 1 summarizes the decomposition. The effect of AI is greatest in externalization and combination, where externalization cost dominates, and least in socialization, where Sollen-type dominates. Internalization lies in between.","quote":{"paper":"T2","text":"The pattern is structural.","line":158,"anchor":"t2-4-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-5-p2","unit":"t2-4-5","k":2,"lines":[160,160],"label":"The rate-limiting shift","does":"claim","says":"When only two processes in a sequential cycle are greatly accelerated, the stage that sets the pace of the whole shifts to the processes that were not accelerated: in SECI, socialization and internalization. This is not an empirical finding but an analytic consequence of the matrix.","quote":{"paper":"T2","text":"AI acceleration of E and C shifts the effective bottleneck to S and I","line":160,"anchor":"t2-4-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-5-p3","unit":"t2-4-5","k":3,"lines":[162,162],"label":"Values are theoretical","does":"limit","says":"The values in the table are theoretical assignments, not measured quantities. What the matrix provides is not measurement but a way to see in which cells there is specification that AI cannot supply.","quote":{"paper":"T2","text":"The matrix values in Table 1 are theoretical assignments","line":162,"anchor":"t2-4-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-5-p4","unit":"t2-4-5","k":4,"lines":[164,164],"label":"Only Sein moves","does":"claim","says":"Sein-type specification is codified over repeated cycles and absorbed into fixed procedures. Sollen-type specification is not; it stays institutionally tied to human evaluative authority.","quote":{"paper":"T2","text":"Sollen-type specification does not undergo this transition.","line":164,"anchor":"t2-4-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-5-p1","unit":"t2-5","k":1,"lines":[168,168],"label":"Status of the evidence","does":"limit","says":"The paper is a conceptual and operational proposal, not an empirical study. The decomposition nonetheless generates structural predictions, and independent evidence not designed to test this framework shows patterns consistent with them.","quote":{"paper":"T2","text":"is a conceptual-operational contribution, not an empirical study","line":168,"anchor":"t2-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-5-1-p1","unit":"t2-5-1","k":1,"lines":[172,172],"label":"Predictive validity","does":"grounds","says":"Three observations are cited that are consistent with the prediction that the quality of specification determines output quality independently of the quality of externalization: the earlier paper’s case, an experiment with a hundred students, and an industrial-scale example in which, once vulnerability discovery had saturated, triage and prioritization became the bottleneck.","quote":{"paper":"T2","text":"The resulting bottleneck was not further vulnerability discovery but triage, remediation priority, and coordination among partner organizations","line":172,"anchor":"t2-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-5-2-p1","unit":"t2-5-2","k":1,"lines":[176,176],"label":"Discriminant validity","does":"grounds","says":"Observations are cited that are consistent with the prediction that the components move independently. Across two million manuscripts, writing quality rose while acceptance rates did not change; and in the condition with expertise removed, the Sollen row fell to zero while part of the Sein row remained.","quote":{"paper":"T2","text":"a counterfactual demonstration that the two components can be dissociated","line":176,"anchor":"t2-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-5-3-p1","unit":"t2-5-3","k":1,"lines":[180,180],"label":"Support from elsewhere","does":"grounds","says":"A replication study, cross-domain co-location, content moderation and an analysis of mathematical output point to the same decomposition from different angles. What Tao informally calls a smell test for mathematical argument is, in this framework’s terms, a Sollen-type specification judgment. The tension between formal correctness and mathematical insight is an independent observation of the same decomposition in a distant domain.","quote":{"paper":"T2","text":"unprecedented separation of form and thought","line":180,"anchor":"t2-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-5-3-p2","unit":"t2-5-3","k":2,"lines":[182,182],"label":"Neighboring vocabularies","does":"grounds","says":"Three studies, from organizational science, machine learning and evaluation theory, do not test the assay directly, but each registers the same asymmetry in a neighboring vocabulary.","quote":{"paper":"T2","text":"none tests the assay directly, but each registers the same asymmetry in a neighboring vocabulary","line":182,"anchor":"t2-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-5-4-p1","unit":"t2-5-4","k":1,"lines":[186,186],"label":"Two failure modes","does":"limit","says":"False positives arise when high externalization quality hides the absence of specification. Sycophantic AI output can reinforce a user’s normative commitments without independent warrant. False negatives arise when friction in externalization obscures genuine specification.","quote":{"paper":"T2","text":"In the assay's terms, sycophancy inflates the Sollen row without grounding it.","line":186,"anchor":"t2-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-p1","unit":"t2-6","k":1,"lines":[190,190],"label":"Measurement to boundary","does":"frame","says":"The central implication is not that AI cannot contribute to judgment, but that components of specification differ in how readily they can be externalized. From here the discussion moves to the practical boundary of legitimate delegation.","quote":{"paper":"T2","text":"different components of specification differ in their susceptibility to externalization","line":190,"anchor":"t2-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-1-p1","unit":"t2-6-1","k":1,"lines":[194,196],"label":"Antibiotic prescribing","does":"example","says":"A structurally equivalent arrangement has been implemented in an independent domain. In a trial of antibiotic prescribing, AI predicted pathogen susceptibility and clinicians weighted treatment preferences. The paper’s reading is that, because AI removed factual uncertainty, value preferences the clinicians had always held could reach the prescription.","quote":{"paper":"T2","text":"AI removed Sein-type uncertainty from the prescribing decision","line":196,"anchor":"t2-6-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-1-p2","unit":"t2-6-1","k":2,"lines":[198,198],"label":"The COMPAS example","does":"example","says":"In criminal-justice risk assessment the opposite pattern was documented. A factual output, the probability of reoffending, was treated as a warrant justifying sentences, and technical rationales were laundered into normative warrants.","quote":{"paper":"T2","text":"technical rationales were laundered into normative warrants","line":198,"anchor":"t2-6-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-1-p3","unit":"t2-6-1","k":3,"lines":[200,200],"label":"Reading the two examples","does":"limit","says":"The framework makes both examples readable as structure, but does not claim that the Sein/Sollen separation was the sole cause of success or failure. It offers a vocabulary for saying where things worked and where they broke down.","quote":{"paper":"T2","text":"without claiming that the Sein/Sollen separation was the sole cause of success or failure","line":200,"anchor":"t2-6-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-2-p1","unit":"t2-6-2","k":1,"lines":[204,204],"label":"On the AGI debate","does":"implication","says":"Current large language models work as a domain-general catalyst. Their processing of externalization cost has generalized, but the specification judgment of what matters still depends on the user. Conflating these two generalizations confuses the debate.","quote":{"paper":"T2","text":"LLM externalization-cost processing has generalized; specification judgment has not.","line":204,"anchor":"t2-6-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-3-p1","unit":"t2-6-3","k":1,"lines":[208,208],"label":"What remains in output","does":"implication","says":"The logic of the boundary extends to governing the outputs of language models themselves. Outputs may retain agent-relative components, such as evaluative weightings and implicit priorities. These are to be labeled rather than removed. The design and validation of such applications lie outside the scope of the paper.","quote":{"paper":"T2","text":"components whose presence requires labeling rather than elimination","line":208,"anchor":"t2-6-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-4-p1","unit":"t2-6-4","k":1,"lines":[212,212],"label":"Scope","does":"limit","says":"The scope extends as far as the re-described SECI processes. Bodily facts that are shared in advance, such as hunger and pain, lie outside the framework. The values in the table are theoretical assignments, and extensions to individual cognition, organizational design and policy belong to the experts of each field.","quote":{"paper":"T2","text":"The assay's scope is delimited by the SECI processes it re-describes.","line":212,"anchor":"t2-6-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-4-p2","unit":"t2-6-4","k":2,"lines":[214,214],"label":"Differences among users","does":"limit","says":"The effect of removing externalization cost is not uniform; it depends on the strength of the user’s internal standards of evaluation. Where those standards have developed, it works as a release of expression; where they are fragile, AI output may become a substitute standard.","quote":{"paper":"T2","text":"The effect of externalization-cost removal is not uniform across users.","line":214,"anchor":"t2-6-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-4-p3","unit":"t2-6-4","k":3,"lines":[216,216],"label":"Not rule by experts","does":"limit","says":"The boundary does not license expert authoritarianism. The source of legitimacy can be contested and must be open to audit. Nor is the boundary a boundary of responsibility: placing normative authority in people does not automatically move technical or institutional accountability. If the score sheet turns into a thin checklist, it defeats the purpose of the instrument.","quote":{"paper":"T2","text":"The delegation legitimacy boundary is not a warrant for expert authoritarianism.","line":216,"anchor":"t2-6-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-4-p4","unit":"t2-6-4","k":4,"lines":[218,220],"label":"Proxy collapse","does":"implication","says":"As AI lowers externalization cost, proxies for intellectual work such as fluency, length and polish become less reliable as indicators of the quality of specification. The assay is one response to this. The protocol itself must also stay open to contestation of its categories and criteria.","quote":{"paper":"T2","text":"The assay is one response to this proxy collapse","line":218,"anchor":"t2-6-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-4-p5","unit":"t2-6-4","k":5,"lines":[222,222],"label":"A speculative implication","does":"implication","says":"An implication stated explicitly as speculative: the vocabulary of the assay might serve not only to measure human judgment but also to describe the internal structure of AI. It is left outside the scope of the paper.","quote":{"paper":"T2","text":"A final, explicitly speculative implication remains outside the present article","line":222,"anchor":"t2-6-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-5-p1","unit":"t2-6-5","k":1,"lines":[226,226],"label":"The name Do-type","does":"positioning","says":"Calling Sollen-type specification that is maintained in practice Do-type is a heuristic use, not a statement about the essence of a culture. The scoring protocol is not derived from Japanese culture; a name is given to a form that is maintained in practice even when neighboring norms are institutionalized.","quote":{"paper":"T2","text":"This use is heuristic, not essentialist","line":226,"anchor":"t2-6-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-7-p1","unit":"t2-7","k":1,"lines":[230,230],"label":"What was done","does":"summary","says":"The paper derived a decomposition of the inside of specification, grounded it in the distinction between is and ought, and operationalized it as the axes of a cognitive assay. It did not add one more argument that human judgment matters; it produced an instrument for decomposing judgment.","quote":{"paper":"T2","text":"but an instrument for decomposing it","line":230,"anchor":"t2-7","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-7-p2","unit":"t2-7","k":2,"lines":[232,232],"label":"The bottleneck is human","does":"summary","says":"In AI-saturated knowledge creation, the bottleneck is no longer giving expertise a form but forming and renewing the evaluative commitments that give output its direction. Investment in AI alone cannot accelerate this; investment in the human processes is needed as its structural complement.","quote":{"paper":"T2","text":"AI investment alone cannot accelerate this bottleneck.","line":232,"anchor":"t2-7","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-7-p3","unit":"t2-7","k":3,"lines":[234,234],"label":"Cognitive reproduction","does":"implication","says":"The danger concerns not only accuracy but also cognitive reproduction. If delegation takes the place of the learning and evaluation that maintain legitimacy, more people may reach codified knowledge while the practices that develop situated judgment weaken. The scoring protocol works as a practical safeguard.","quote":{"paper":"T2","text":"as a problem not only of accuracy but of cognitive reproduction","line":234,"anchor":"t2-7","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-7-p4","unit":"t2-7","k":4,"lines":[236,238],"label":"The next question","does":"summary","says":"What the assay has shown is the part of human judgment that ought not to be discarded. A structural description of what ought to be discarded is the next question. What the assay helps protect is the region in which people keep the authority to set the ends that guide their own work.","quote":{"paper":"T2","text":"The assay has shown which parts of human judgment ought not to be discarded.","line":236,"anchor":"t2-7","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-postscript-p1","unit":"t2-postscript","k":1,"lines":[244,244],"label":"Postscript: the garden","does":"positioning","says":"Mekiki is the everyday name of the practice that the paper operationalized through a philosophical decomposition and a measurement protocol. The region of evaluative authority is not settled by drawing a line once; it is something to be tended continuously, and is likened to a garden. The metaphor is not developed in the main text.","quote":{"paper":"T2","text":"a region of evaluative authority that requires continuous cultivation rather than one-time demarcation","line":244,"anchor":"t2-postscript","match":"exact"},"basis":"reading","vis":"public"}],"links":[{"id":"k-t2-1-p1--t2-2-1-p1","from":"t2-1-p1","to":"t2-2-1-p1","rel":"takes up","note":"The question the introduction left open (the inside of specification) is posed again after the three concepts have been separated.","basis":"reading","vis":"public"},{"id":"k-t2-1-p2--t2-2-3-p3","from":"t2-1-p2","to":"t2-2-3-p3","rel":"restates","note":"The point that a warrant must be traceable to a legitimate source is restated as the way the boundary is described.","basis":"reading","vis":"public"},{"id":"k-t2-1-p3--t2-7-p3","from":"t2-1-p3","to":"t2-7-p3","rel":"takes up","note":"The concern about tacit knowledge cited in the introduction is taken up again as a problem of cognitive reproduction.","basis":"reading","vis":"public"},{"id":"k-t2-1-p4--t2-3-2-p1","from":"t2-1-p4","to":"t2-3-2-p1","rel":"takes up","note":"The means of measurement said to be missing is presented as a five-step protocol.","basis":"reading","vis":"public"},{"id":"k-t2-1-p5--t2-6-2-p1","from":"t2-1-p5","to":"t2-6-2-p1","rel":"uses","note":"The point that the boundary is not a capability claim is used to separate generalization of processing from generalization of judgment.","basis":"reading","vis":"public"},{"id":"k-t2-2-2-p1--t2-3-3-p1","from":"t2-2-2-p1","to":"t2-3-3-p1","rel":"uses","note":"The two kinds of judgment drawn from the case are actually scored.","basis":"reading","vis":"public"},{"id":"k-t2-2-2-p2--t2-3-2-p2","from":"t2-2-2-p2","to":"t2-3-2-p2","rel":"uses","note":"The decision not to display is used as an example of a judgment AI cannot extract.","basis":"reading","vis":"public"},{"id":"k-t2-2-2-p3--t2-3-2-p5","from":"t2-2-2-p3","to":"t2-3-2-p5","rel":"uses","note":"The limit that hybrids are not made binary is built into the protocol as the reporting of a ratio profile.","basis":"reading","vis":"public"},{"id":"k-t2-2-3-p2--t2-3-2-p6","from":"t2-2-3-p2","to":"t2-3-2-p6","rel":"uses","note":"The argument that agent-relative reasons are irreducible is used to make the asymmetry between scorers a consequence of structure.","basis":"reading","vis":"public"},{"id":"k-t2-2-3-p3--t2-4-5-p4","from":"t2-2-3-p3","to":"t2-4-5-p4","rel":"restates","note":"The point that only the Sein side can be absorbed into processing is restated as a transition within the SECI cycle.","basis":"reading","vis":"public"},{"id":"k-t2-2-3-p5--t2-3-4-p3","from":"t2-2-3-p5","to":"t2-3-4-p3","rel":"takes up","note":"Having separated the practitioner’s capacity from the norms of the environment, it describes the change of state when norms on the capacity side take hold in institutions.","basis":"reading","vis":"public"},{"id":"k-t2-2-4-p1--t2-4-p1","from":"t2-2-4-p1","to":"t2-4-p1","rel":"uses","note":"The claim of orthogonality to the processes is used to divide the four processes into components.","basis":"reading","vis":"public"},{"id":"k-t2-2-4-p3--t2-6-4-p1","from":"t2-2-4-p3","to":"t2-6-4-p1","rel":"restates","note":"The limit on the level of analysis is stated again as scope.","basis":"reading","vis":"public"},{"id":"k-t2-3-1-p1--t2-5-2-p1","from":"t2-3-1-p1","to":"t2-5-2-p1","rel":"supports","note":"The premise that the two components move independently is supported by large-scale observation.","basis":"reading","vis":"public"},{"id":"k-t2-3-2-p6--t2-6-1-p1","from":"t2-3-2-p6","to":"t2-6-1-p1","rel":"supports","note":"It shows an example in which the same arrangement as the scorer asymmetry has been implemented in an independent domain.","basis":"reading","vis":"public"},{"id":"k-t2-3-2-p9--t2-5-4-p1","from":"t2-3-2-p9","to":"t2-5-4-p1","rel":"restates","note":"The two failure modes named in the protocol section are described in detail together with evidence.","basis":"reading","vis":"public"},{"id":"k-t2-3-3-p3--t2-5-p1","from":"t2-3-3-p3","to":"t2-5-p1","rel":"takes up","note":"Taking up the limit of relying on its own case, it sets out independent evidence by kind of validity.","basis":"reading","vis":"public"},{"id":"k-t2-3-4-p3--t2-6-p1","from":"t2-3-4-p3","to":"t2-6-p1","rel":"uses","note":"The distinction between Do-type and Sin-type is used to say which components are readily externalized.","basis":"reading","vis":"public"},{"id":"k-t2-3-4-p3--t2-6-5-p1","from":"t2-3-4-p3","to":"t2-6-5-p1","rel":"limits","note":"It notes that the name Do-type is a heuristic use.","basis":"reading","vis":"public"},{"id":"k-t2-4-1-p1--t2-4-5-p1","from":"t2-4-1-p1","to":"t2-4-5-p1","rel":"sums up","note":"The decomposition of the four processes is gathered into a table.","basis":"reading","vis":"public"},{"id":"k-t2-4-5-p2--t2-5-1-p1","from":"t2-4-5-p2","to":"t2-5-1-p1","rel":"supports","note":"An example in which triage and coordination became the bottleneck once externalization had saturated is consistent with the consequence that the rate-limiting stage shifts.","basis":"reading","vis":"public"},{"id":"k-t2-4-5-p2--t2-7-p2","from":"t2-4-5-p2","to":"t2-7-p2","rel":"sums up","note":"The shift of the rate-limiting stage is concluded as an implication for where to invest.","basis":"reading","vis":"public"},{"id":"k-t2-4-5-p3--t2-6-4-p1","from":"t2-4-5-p3","to":"t2-6-4-p1","rel":"restates","note":"It states again, as a limitation, that the values in the table are theoretical assignments.","basis":"reading","vis":"public"},{"id":"k-t2-5-3-p1--t2-6-3-p1","from":"t2-5-3-p1","to":"t2-6-3-p1","rel":"uses","note":"The observation of a separation of form and thought is used in discussing the components that remain in outputs.","basis":"reading","vis":"public"},{"id":"k-t2-5-4-p1--t2-6-4-p2","from":"t2-5-4-p1","to":"t2-6-4-p2","rel":"takes up","note":"Taking up false positives caused by sycophancy, it says that the effect divides according to the strength of the user’s internal standards.","basis":"reading","vis":"public"}],"ok":1},"T3":{"tiers":[{"id":"t3-abstract","no":"","title":"Abstract","line":9,"units":["t3-abstract"]},{"id":"t3-1","no":"1","title":"Introduction","line":13,"units":["t3-1"]},{"id":"t3-2","no":"2","title":"Decomposing learner agency by delegability","line":31,"units":["t3-2-1","t3-2-2","t3-2-3","t3-2-4","t3-2-5"]},{"id":"t3-3","no":"3","title":"A design conjecture: encounter, crystallization, conversion","line":76,"units":["t3-3"]},{"id":"t3-4","no":"4","title":"What the decomposition isolates","line":86,"units":["t3-4-1","t3-4-2","t3-4-3","t3-4-4"]},{"id":"t3-5","no":"5","title":"The two-layer prescription","line":118,"units":["t3-5","t3-5-1","t3-5-2","t3-5-3","t3-5-4"]},{"id":"t3-6","no":"6","title":"Boundary conditions and research agenda","line":156,"units":["t3-6"]},{"id":"t3-7","no":"7","title":"Conclusion","line":160,"units":["t3-7"]},{"id":"t3-practitioner-notes","no":"","title":"Practitioner Notes","line":164,"units":["t3-practitioner-notes"]}],"units":[{"id":"t3-abstract","tier":"t3-abstract","no":"","title":"Abstract","intro":false,"line_start":9,"line_end":12,"paras":1,"size":222,"first":{"text":"When AI can plan, draft, and revise, what remains for the learner? This article argues that the question cannot be answered while *agency* is treated as monolithic, and decomposes learner agency by delegability — jointly with its educational companions, traina","line":11,"cut":true}},{"id":"t3-1","tier":"t3-1","no":"1","title":"Introduction","intro":false,"line_start":13,"line_end":30,"paras":8,"size":1199,"first":{"text":"Generative AI has made learner agency the contested center of educational technology.","line":15,"cut":false}},{"id":"t3-2-1","tier":"t3-2","no":"2.1","title":"The choice of axis","intro":false,"line_start":33,"line_end":38,"paras":2,"size":199,"first":{"text":"Decompositions serve questions.","line":35,"cut":false}},{"id":"t3-2-2","tier":"t3-2","no":"2.2","title":"Three components","intro":false,"line_start":39,"line_end":42,"paras":1,"size":282,"first":{"text":"Cut this way, learner agency can be provisionally distinguished into three analytic dimensions — a working schema warranted by intervention divergence rather than claimed as a psychologically exhaustive taxonomy. *Direction* is what the learner is oriented tow","line":41,"cut":true}},{"id":"t3-2-3","tier":"t3-2","no":"2.3","title":"Two forms of magnitude","intro":false,"line_start":43,"line_end":46,"paras":1,"size":190,"first":{"text":"Magnitude is not a single quantity.","line":45,"cut":false}},{"id":"t3-2-4","tier":"t3-2","no":"2.4","title":"The sort","intro":false,"line_start":47,"line_end":71,"paras":6,"size":439,"first":{"text":"Delegability is applied here jointly with its educational companions — trainability (can deliberate practice develop it?) and measurability (can its current state be observed?).","line":49,"cut":false}},{"id":"t3-2-5","tier":"t3-2","no":"2.5","title":"What the sort shows about distribution","intro":false,"line_start":72,"line_end":75,"paras":1,"size":192,"first":{"text":"Set this result against the distribution account of agency.","line":74,"cut":false}},{"id":"t3-3","tier":"t3-3","no":"3","title":"A design conjecture: encounter, crystallization, conversion","intro":false,"line_start":76,"line_end":85,"paras":4,"size":547,"first":{"text":"If direction cannot be installed, where does it come from? We propose a design conjecture in three movements: embodied encounter with a problem-holder may contribute to the crystallization of evaluative commitment, and an endorsed direction may then anchor ava","line":78,"cut":true}},{"id":"t3-4-1","tier":"t3-4","no":"4.1","title":"A different kind of remainder","intro":false,"line_start":88,"line_end":93,"paras":2,"size":298,"first":{"text":"Direction resisted distribution, but it remained a component — something a learner comes to have.","line":90,"cut":false}},{"id":"t3-4-2","tier":"t3-4","no":"4.2","title":"Not an artifact of the axis","intro":false,"line_start":94,"line_end":97,"paras":1,"size":228,"first":{"text":"An objection should be met before anything is built on the claim: that the delegability axis was constructed to exclude answerability, so its isolation is trivial — true by definition.","line":96,"cut":false}},{"id":"t3-4-3","tier":"t3-4","no":"4.3","title":"The second-personal ground","intro":false,"line_start":98,"line_end":105,"paras":3,"size":507,"first":{"text":"What kind of fact is answerability, if not a capacity? Here the paper borrows, and the borrowing must be marked precisely.","line":100,"cut":false}},{"id":"t3-4-4","tier":"t3-4","no":"4.4","title":"What the relation grounds","intro":false,"line_start":106,"line_end":117,"paras":5,"size":643,"first":{"text":"Three matters must not be conflated: answerability as a relational standing; answer-giving competence as a developable capacity; and answerable practice as the observable enactment of that standing.","line":108,"cut":false}},{"id":"t3-5","tier":"t3-5","no":"5","title":"The two-layer prescription","intro":true,"line_start":118,"line_end":121,"paras":1,"size":108,"first":{"text":"The two-layer structure yields a two-layer prescription, and the layers — though pedagogically concurrent — must not be conflated.","line":120,"cut":false}},{"id":"t3-5-1","tier":"t3-5","no":"5.1","title":"Layer one: an analytic compass","intro":false,"line_start":122,"line_end":129,"paras":3,"size":394,"first":{"text":"*Principle.* The OECD's Learning Compass 2030 placed agency at the center of a framework for how learners navigate an uncertain world, but it is a compass that points a direction to travel, not one that resolves that direction into components an educator can r","line":124,"cut":true}},{"id":"t3-5-2","tier":"t3-5","no":"5.2","title":"Layer one: encounter engineering","intro":false,"line_start":130,"line_end":139,"paras":4,"size":413,"first":{"text":"*Principle.* If encounter can contribute to direction formation (Section 3), then curricula can be designed for encounter density: structured contact with problem-holders, early and embodied, before competence would conventionally \"justify\" it.","line":132,"cut":false}},{"id":"t3-5-3","tier":"t3-5","no":"5.3","title":"Layer one: AI guardrails","intro":false,"line_start":140,"line_end":147,"paras":3,"size":268,"first":{"text":"*A prior distinction.* Performance delegation and developmental delegation are different objects: offloading production can raise artifact quality while leaving knowledge and transfer unchanged (Fan et al., 2025).","line":142,"cut":false}},{"id":"t3-5-4","tier":"t3-5","no":"5.4","title":"Layer two: the second person","intro":false,"line_start":148,"line_end":155,"paras":3,"size":459,"first":{"text":"*Principle.* The standing of answerability is conferred by the relation itself; what grows is the learner's competence to answer well, and that competence, however rehearsed, is normatively tested and sustained only in second-personal exchange: being questione","line":150,"cut":true}},{"id":"t3-6","tier":"t3-6","no":"6","title":"Boundary conditions and research agenda","intro":false,"line_start":156,"line_end":159,"paras":1,"size":359,"first":{"text":"What this article leaves to others is collected here as testable commitments rather than scattered disclaimers.","line":158,"cut":false}},{"id":"t3-7","tier":"t3-7","no":"7","title":"Conclusion","intro":false,"line_start":160,"line_end":163,"paras":1,"size":206,"first":{"text":"What remains for the learner when AI can do the work? The question dissolves once agency is decomposed along the axis the question itself supplies.","line":162,"cut":false}},{"id":"t3-practitioner-notes","tier":"t3-practitioner-notes","no":"","title":"Practitioner Notes","intro":false,"line_start":164,"line_end":181,"paras":10,"size":210,"first":{"text":"- Generative AI systems now plan, draft, and revise, making learner agency a central contested concept in educational technology.","line":167,"cut":false}}],"refs":[{"from":"t3-1","to":"t3-4-1","to_no":"4","line":19,"text":"What it does not ask is whether everything gathered under agency migrates — and, as Section 4 argues, what appears at the summit of that account (whose judgment it remains, who must answer for it) is what a finer distribution analysis isolates rather than distributes.","cut":false,"dir":"fwd"},{"from":"t3-1","to":"t3-2-1","to_no":"2","line":25,"text":"Section 2 performs the decomposition and the sort.","cut":false,"dir":"fwd"},{"from":"t3-1","to":"t3-3","to_no":"3","line":25,"text":"Section 3 proposes a design conjecture for the component that resists installation.","cut":false,"dir":"fwd"},{"from":"t3-1","to":"t3-4-1","to_no":"4","line":25,"text":"Section 4 establishes what the decomposition isolates, and grounds it second-personally.","cut":false,"dir":"fwd"},{"from":"t3-1","to":"t3-5","to_no":"5","line":25,"text":"Section 5 derives a prescription across two pedagogically concurrent layers, stating in each case what is deliberately left to those who must answer for it.","cut":false,"dir":"fwd"},{"from":"t3-1","to":"t3-2-1","to_no":"2","line":29,"text":"The decomposition in §2 works entirely on the first layer; §4 shows what it exposes on the second.","cut":false,"dir":"fwd"},{"from":"t3-1","to":"t3-4-1","to_no":"4","line":29,"text":"The decomposition in §2 works entirely on the first layer; §4 shows what it exposes on the second.","cut":false,"dir":"fwd"},{"from":"t3-2-3","to":"t3-3","to_no":"3","line":45,"text":"How that capture happens is the subject of Section 3.","cut":false,"dir":"fwd"},{"from":"t3-2-4","to":"t3-3","to_no":"3","line":55,"text":"The conditions under which this conversion may occur are addressed by the design conjecture in Section 3.","cut":false,"dir":"fwd"},{"from":"t3-2-4","to":"t3-5","to_no":"5","line":57,"text":"become integrated, rather than merely complied with, only under conditions that are relational as much as informational (Ryan & Deci, 2000) — a finding whose second-personal undertone Section 5 returns to.","cut":true,"dir":"fwd"},{"from":"t3-2-4","to":"t3-4-1","to_no":"4","line":70,"text":"Section 4 establishes this standing.","cut":false,"dir":"fwd"},{"from":"t3-3","to":"t3-2-1","to_no":"2","line":80,"text":"Crystallization needs a supersaturated solution and a nucleation site: the available activation of Section 2 is the supersaturation — energy without an object — and the embodied encounter supplies the site.","cut":false,"dir":"back"},{"from":"t3-3","to":"t3-5","to_no":"5","line":84,"text":"What such design looks like in practice, and what it deliberately leaves alone, is the work of Section 5.","cut":false,"dir":"fwd"},{"from":"t3-4-4","to":"t3-2-1","to_no":"2","line":110,"text":"The difference is not one of degree along any of Section 2's dimensions; it is the difference between refusing a relation and being unable to stand in one.","cut":false,"dir":"back"},{"from":"t3-5","to":"t3-6","to_no":"6","line":120,"text":"For each prescription we state a principle and one worked example, and we say explicitly what is left to others (these residues are collected as a research agenda in Section 6); the restraint is not modesty for its own sake but the framework's own discipline — a","cut":true,"dir":"fwd"},{"from":"t3-5-2","to":"t3-3","to_no":"3","line":132,"text":"If encounter can contribute to direction formation (Section 3), then curricula can be designed for encounter density: structured contact with problem-holders, early and embodied, before competence would conventionally \"justify\" it.","cut":false,"dir":"back"},{"from":"t3-7","to":"t3-2-1","to_no":"2","line":162,"text":"Many functions gathered under agency may be supported or partially offloaded when the design preserves development, transfer, error detection, and independent judgment — the sort in Section 2 says where, and layer one of the prescription says how.","cut":false,"dir":"back"}],"figs":[{"kind":"table","no":1,"label":"Table 1","caption":"Table 1. Learner agency under the delegability axis.","line":61,"anchor":"t3-2-4","unit":"t3-2-4","omitted":false,"match":"normalized"},{"kind":"figure","no":1,"label":"Figure 1","caption":"Figure 1 (image omitted). Direction, drive (available activation and motivational drive), and mode are properties the learner has, shown as boxes within the dashed component region.","line":92,"anchor":"t3-4-1","unit":"t3-4-1","omitted":true,"match":"normalized"}],"parts":[{"id":"t3-abstract-p1","unit":"t3-abstract","k":1,"lines":[11,11],"label":"Abstract","does":"summary","says":"Learner agency is decomposed not by psychological function but by delegability. Many components can be supported, trained or converted. The decomposition exposes a question that an analysis of capacities cannot answer: who must answer for the judgment. What that question isolates is answerability.","quote":{"paper":"T3","text":"decomposes learner agency by delegability","line":11,"anchor":"t3-abstract","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-1-p1","unit":"t3-1","k":1,"lines":[15,15],"label":"Agency as one quantity","does":"frame","says":"Both prohibition and laissez-faire treat agency as a single quantity that AI either threatens or does not. This premise is what the article examines.","quote":{"paper":"T3","text":"Both responses treat agency as a single quantity that AI either threatens or does not.","line":15,"anchor":"t3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-1-p2","unit":"t3-1","k":2,"lines":[17,21],"label":"Three streams","does":"positioning","says":"There are three streams that divide agency (the agency of machines, distribution across human–AI configurations, and an individual capacity to be fostered). Each divides for its own question, and education’s own stream too does not say what may be handed over.","quote":{"paper":"T3","text":"They say what agency is made of, not what may be handed over.","line":21,"anchor":"t3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-1-p3","unit":"t3-1","k":3,"lines":[23,23],"label":"The question not asked","does":"claim","says":"None of the three streams asks which components can be delegated, trained or supported, and what cannot. On the relational side too, what is under-theorized is the normative structure of the relation itself.","quote":{"paper":"T3","text":"What is under-theorized is not that something relational matters, but the normative structure of the relation itself.","line":23,"anchor":"t3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-1-p4","unit":"t3-1","k":4,"lines":[25,25],"label":"The contribution","does":"frame","says":"The article decomposes agency by delegability and shows that the decomposition isolates a question an inventory of capacities cannot answer. The answer is answerability, a relation rather than a component. The operation is the same as in the two earlier papers; the target concept changes.","quote":{"paper":"T3","text":"whose answer is answerability, a relation rather than a component","line":25,"anchor":"t3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-1-p5","unit":"t3-1","k":5,"lines":[27,27],"label":"Neighboring research","does":"positioning","says":"It states how its axis differs from self-determination theory, interest development, self-regulated learning and knowledge building. The contribution is not the discovery that the educational relation matters, but showing within it a distinction of delegability.","quote":{"paper":"T3","text":"between distributed performance and the identifiable bearer of a judgment's warrant","line":27,"anchor":"t3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-1-p6","unit":"t3-1","k":6,"lines":[29,29],"label":"Two layers","does":"frame","says":"The argument proceeds on two layers that must not be conflated: a capacity layer, in which components can be supported, trained, or transformed under specified conditions (and in which AI can legitimately take part), and a relational layer, in which the learner answers to particular others.","quote":{"paper":"T3","text":"The argument proceeds on two layers that must not be conflated","line":29,"anchor":"t3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-1-p1","unit":"t3-2-1","k":1,"lines":[35,35],"label":"Serving a question","does":"positioning","says":"Existing decompositions (by psychological function, by temporal orientation) answer their own questions well, but were not built for the question of what can and cannot be handed over.","quote":{"paper":"T3","text":"Decompositions serve questions.","line":35,"anchor":"t3-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-1-p2","unit":"t3-2-1","k":2,"lines":[37,37],"label":"Cutting by delegability","does":"frame","says":"The cut is made along the axis of delegability (together with trainability and measurability). Overlap with existing constructs is expected and is not the contribution; the contribution lies in what the new plane separates.","quote":{"paper":"T3","text":"We decompose learner agency by delegability","line":37,"anchor":"t3-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-2-p1","unit":"t3-2-2","k":1,"lines":[41,41],"label":"Three components","does":"definition","says":"Agency is provisionally divided into three: direction (a candidate state and an endorsed state), magnitude (drive) and mode. These are coarse sorting bins, with no claim to psychological exhaustiveness. The warrant for the division is that the ways of intervening diverge.","quote":{"paper":"T3","text":"The warrant for the triad is not psychological exhaustiveness but intervention divergence","line":41,"anchor":"t3-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-3-p1","unit":"t3-2-3","k":1,"lines":[45,45],"label":"Two forms of drive","does":"definition","says":"Magnitude is not a single quantity. The article separates the degree to which force can be mobilized now (available activation, not treated as a fixed trait) from the propulsion that exists only once anchored to a particular direction (motivational drive). The former can be protected, but cannot be lectured into existence.","quote":{"paper":"T3","text":"Available activation can be protected, provisioned, and depleted, but not lectured into existence.","line":45,"anchor":"t3-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-4-p1","unit":"t3-2-4","k":1,"lines":[49,49],"label":"Three sorting operations","does":"procedure","says":"Delegability is applied together with trainability and measurability. The three are distinct operations, not values on a single scale.","quote":{"paper":"T3","text":"These are distinct operations, not values on a single scale","line":49,"anchor":"t3-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-4-p2","unit":"t3-2-4","k":2,"lines":[51,55],"label":"Support, train, convert","does":"claim","says":"Available activation can be supported and protected. Mode can be trained. Motivational drive is converted from available activation when a direction settles. This analysis is not offered as a basis for admissions, selection or deficit classification.","quote":{"paper":"T3","text":"this analysis is not proposed as a basis for admissions, selection, or deficit classification","line":51,"anchor":"t3-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-4-p3","unit":"t3-2-4","k":3,"lines":[57,57],"label":"Only direction resists","does":"claim","says":"What resists is not the supply of candidate directions; a teacher or an AI can propose them. What cannot be handed over is making a direction one’s own. Direction is not installed.","quote":{"paper":"T3","text":"Direction is not installed.","line":57,"anchor":"t3-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-4-p4","unit":"t3-2-4","k":4,"lines":[59,70],"label":"Table: the sort","does":"summary","says":"Table 1 summarizes the sort. Answerability is not in the table, because it is not a learner component but a relational status. While the judgment is the learner’s, no substitute can answer for it.","quote":{"paper":"T3","text":"Answerability is omitted because it is a relational status rather than a learner component.","line":70,"anchor":"t3-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-5-p1","unit":"t3-2-5","k":1,"lines":[74,74],"label":"Scope of distribution","does":"limit","says":"The account that reads agency as a property of the human–AI system is right about most of the table. What the sort adds is the place where that account is silent. The article is not a denial of distributed agency but a limit at the level of components.","quote":{"paper":"T3","text":"silent about what does not","line":74,"anchor":"t3-2-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-3-p1","unit":"t3-3","k":1,"lines":[78,78],"label":"A design conjecture","does":"prediction","says":"A design conjecture is set out. Direct encounter with a problem-holder may support the crystallization of evaluative commitment. An endorsed direction may anchor available activation as motivational drive. Each movement names a condition, not a guarantee.","quote":{"paper":"T3","text":"each movement names a condition, not a guarantee","line":78,"anchor":"t3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-3-p2","unit":"t3-3","k":2,"lines":[80,80],"label":"The crystal analogy","does":"implication","says":"A crystal needs a supersaturated solution and a nucleation site. Available activation is the supersaturation; encounter is the nucleus. Exhortation without encounter fails, and so does encounter that is not protected afterwards, but neither is a motivation deficit.","quote":{"paper":"T3","text":"Neither failure is a motivation deficit","line":80,"anchor":"t3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-3-p3","unit":"t3-3","k":3,"lines":[82,82],"label":"Three illustrations","does":"example","says":"Three sources are cited that show sequences compatible with the conjecture. They are illustrative and hypothesis-generating, not confirmatory. The third is the author’s own research and cannot be counted as independent convergence.","quote":{"paper":"T3","text":"These sources are illustrative and hypothesis-generating rather than confirmatory","line":82,"anchor":"t3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-3-p4","unit":"t3-3","k":4,"lines":[84,84],"label":"Status of the conjecture","does":"limit","says":"It is a design conjecture, not a demonstrated mechanism. No controlled study in the article isolates encounter as a cause. What education can guarantee is exposure to encounters, never crystallization.","quote":{"paper":"T3","text":"it can guarantee exposure, never crystallization","line":84,"anchor":"t3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-1-p1","unit":"t3-4-1","k":1,"lines":[90,92],"label":"A different remainder","does":"claim","says":"What appears when the sort is carried through is not one more component but a relation that was never on the component list: answerability. Direction is something one has; answerability is something one stands in.","quote":{"paper":"T3","text":"It is a relation between the learner and those entitled to ask","line":90,"anchor":"t3-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-2-p1","unit":"t3-4-2","k":1,"lines":[96,96],"label":"No artifact of the axis","does":"grounds","says":"It answers the objection that the axis was built to exclude answerability. The sorting rule was applied only to capacities ordinarily counted as agency. One detailed account of machine agency does not contain the term, but that is a gap in that account, not an absence across the field.","quote":{"paper":"T3","text":"answerability nowhere figures in the rule","line":96,"anchor":"t3-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-3-p1","unit":"t3-4-3","k":1,"lines":[100,100],"label":"Second-personal ground","does":"grounds","says":"What is borrowed from Darwall is the structure of second-personal address. The extension, that not only actions but also the warrant of a judgment needs a bearer who is asked and answers, is this article’s own; it is consonant with Darwall’s text but not stated in it.","quote":{"paper":"T3","text":"consonant with his text, but not stated in it","line":100,"anchor":"t3-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-3-p2","unit":"t3-4-3","k":2,"lines":[102,102],"label":"No answering by proxy","does":"claim","says":"Darwall allows a proxy on the demanding side, but the answering side does not appear by proxy. Accountability can be reallocated within institutions; answerability cannot be transferred. Granting an AI more authority produces no standing.","quote":{"paper":"T3","text":"what cannot be done on one's behalf is precisely to answer","line":102,"anchor":"t3-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-3-p3","unit":"t3-4-3","k":3,"lines":[104,104],"label":"Arguments from AI’s side","does":"positioning","says":"There is a division of labor with research that argues from the cognitive limits of AI. An argument from present limits must be re-made each time capability moves; an argument from the structure of address does not.","quote":{"paper":"T3","text":"an argument from the structure of address does not","line":104,"anchor":"t3-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-4-p1","unit":"t3-4-4","k":1,"lines":[108,108],"label":"Three not to conflate","does":"definition","says":"Three matters must not be conflated: answerability as a relational standing; answer-giving competence as a capacity that can be developed; and answerable practice as the conduct that actually enacts that standing.","quote":{
