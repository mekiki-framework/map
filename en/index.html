"paper":"T3","text":"Three matters must not be conflated","line":108,"anchor":"t3-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-4-p2","unit":"t3-4-4","k":2,"lines":[110,110],"label":"Layer two supports","does":"claim","says":"Layer two keeps layer one from collapsing into capability education. A human fraud can be made to answer; a current AI cannot be made to answer in this sense. The difference is not one of degree: it is the difference between refusing a relation and being unable to stand in one.","quote":{"paper":"T3","text":"it is the difference between refusing a relation and being unable to stand in one","line":110,"anchor":"t3-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-4-p3","unit":"t3-4-4","k":3,"lines":[112,112],"label":"No metaphysical verdict","does":"limit","says":"This boundary does not rest on a metaphysical verdict about machines; it concerns the criteria that educational institutions now use for standing. A learner’s feeling that an AI is an addressee is distinct from the AI’s being a legitimate addressee of answerability.","quote":{"paper":"T3","text":"The boundary this draws does not turn on a metaphysical verdict about machines.","line":112,"anchor":"t3-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-4-p4","unit":"t3-4-4","k":4,"lines":[114,114],"label":"A circle with no way in","does":"grounds","says":"On the article’s extension, the argument draws on Darwall’s structural point: the second-personal concepts form an interdefinable circle that cannot be entered from outside. So however many layer-one capacities are listed, that does not amount to entering the circle.","quote":{"paper":"T3","text":"form an interdefinable circle that cannot be entered from outside it","line":114,"anchor":"t3-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-4-p5","unit":"t3-4-4","k":5,"lines":[116,116],"label":"Grounding the condition","does":"claim","says":"It gives structural backing to the boundary that the earlier paper stated in conditional form. Standing is assigned through relations and institutions, and enacting it requires second-personal competence. The possibility that future systems acquire the competence is not closed; shortcutting the assignment by capability alone is.","quote":{"paper":"T3","text":"what the argument forecloses is shortcutting that assignment by capability alone","line":116,"anchor":"t3-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-p1","unit":"t3-5","k":1,"lines":[120,120],"label":"Two-layer prescription","does":"frame","says":"From the two layers comes a two-layer prescription. For each prescription the article gives a principle and one example, and says explicitly what is left to others, because a paper about non-delegable judgment should not deliver judgments that belong to institutions.","quote":{"paper":"T3","text":"a paper about non-delegable judgment should not deliver judgments that belong to institutions","line":120,"anchor":"t3-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-1-p1","unit":"t3-5-1","k":1,"lines":[124,124],"label":"An analytic compass","does":"claim","says":"A learner’s components are read separately rather than guessed at as a single quantity. Answerability should not be represented as an individual trait score. Assignment and actual conduct can be examined, but sincere endorsement cannot be measured directly.","quote":{"paper":"T3","text":"Answerability should not be represented as an individual trait score","line":124,"anchor":"t3-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-1-p2","unit":"t3-5-1","k":2,"lines":[126,126],"label":"Example: “unmotivated”","does":"example","says":"Read by components, a learner who presents as unmotivated has high available activation and no direction. This is not a motivation deficit but a pre-crystallization state, and the indicated lever is encounter, not exhortation.","quote":{"paper":"T3","text":"The reading is not a motivation deficit but a pre-crystallization state","line":126,"anchor":"t3-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-1-p3","unit":"t3-5-1","k":3,"lines":[128,128],"label":"Left: choice of measures","does":"limit","says":"Which instruments to use and with what weights is left to each institution. How it reads its own learners is itself a judgment someone must answer for.","quote":{"paper":"T3","text":"whose reading of its own learners is itself a judgment someone must answer for","line":128,"anchor":"t3-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-2-p1","unit":"t3-5-2","k":1,"lines":[132,132],"label":"Encounter engineering","does":"claim","says":"If encounter may support the formation of direction, curricula can be designed by density of encounter (encounter engineering). Clinical clerkship has the same pattern, but its premise is institutionalized by practice, not causally verified in this article’s terms.","quote":{"paper":"T3","text":"a premise institutionalized by practice, not causally verified in this article's terms","line":132,"anchor":"t3-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-2-p2","unit":"t3-5-2","k":2,"lines":[134,134],"label":"Discomfort inventory","does":"example","says":"For disciplines without wards, the learner delegates a task wholly to an AI system and inventories every discomfort with the output. Where the learner feels the gap between fluent output and right output, unarticulated evaluative commitments surface. The proposition remains untested.","quote":{"paper":"T3","text":"the proposition remains untested","line":134,"anchor":"t3-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-2-p3","unit":"t3-5-2","k":3,"lines":[136,136],"label":"Ethical boundary","does":"limit","says":"The people encountered must not be instrumentalized. Consent, reciprocity of benefit, protection from repeated emotional labor, and debriefing are requirements of the design.","quote":{"paper":"T3","text":"Problem-holders are not teaching materials","line":136,"anchor":"t3-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-2-p4","unit":"t3-5-2","k":4,"lines":[138,138],"label":"Left: whom and where","does":"limit","says":"With whom, in what setting and under what protections encounters take place is left to those who know the field. The design guarantees exposure, never crystallization.","quote":{"paper":"T3","text":"The design guarantees exposure, never crystallization, and an honest program says so.","line":138,"anchor":"t3-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-3-p1","unit":"t3-5-3","k":1,"lines":[142,142],"label":"AI guardrails","does":"claim","says":"What guardrails protect is not the artifact but the episodes in which the learner answers for their own judgments. A request that contains the learner’s specification is told apart from a specification-empty one, and the empty one is routed back into dialogue. Even for a request that contains the learner’s specification, whether completing it is educationally legitimate still depends on the learning objective, the learner’s developmental stage, the plan for fading support, and the criterion for unaided transfer.","quote":{"paper":"T3","text":"Performance delegation and developmental delegation are different objects","line":142,"anchor":"t3-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-3-p2","unit":"t3-5-3","k":2,"lines":[144,144],"label":"Example: essay help","does":"example","says":"Asked for an essay, the assistant does not produce prose; it asks, for instance, what the learner finds wrong with the received view, and drafts from the answers. The same model, the same capability, a different default.","quote":{"paper":"T3","text":"The same model, the same capability, a different default.","line":144,"anchor":"t3-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-3-p3","unit":"t3-5-3","k":3,"lines":[146,146],"label":"Left: two limits","does":"limit","says":"Detection can be gamed with borrowed opinions, and guardrails do not guarantee the outcome. And dialogue with AI does not cultivate answerability: an AI can elicit commitments, but it cannot be the one to whom the learner answers.","quote":{"paper":"T3","text":"They do not substitute for layer two.","line":146,"anchor":"t3-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-4-p1","unit":"t3-5-4","k":1,"lines":[150,150],"label":"The second person","does":"claim","says":"The standing of answerability is conferred by the relation itself; what grows is the competence to answer well. That competence, however rehearsed, is normatively tested and sustained only in second-personal exchange: being questioned, answering, and owning the answer. The educator’s non-substitutable function lies in being the one who asks and holds the learner to the answer. AI can help learners rehearse this competence and can mediate the exchange, but it cannot occupy the position of final addressee. The one who asks must also be answerable, for the questions, the criteria and the decisions. Answering is not tied to rapid oral fluency.","quote":{"paper":"T3","text":"The educator who asks must also be answerable","line":150,"anchor":"t3-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-4-p2","unit":"t3-5-4","k":2,"lines":[152,152],"label":"Not nostalgia","does":"grounds","says":"This prescription rests on structure, not nostalgia. When AI accelerates externalization and combination, the rate-limiting processes shift to socialization and internalization. Within any configuration, the answerable party is the human in it, not the configuration.","quote":{"paper":"T3","text":"the answerable party is the human in it, not the configuration","line":152,"anchor":"t3-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-4-p3","unit":"t3-5-4","k":3,"lines":[154,154],"label":"Left: the institutions","does":"limit","says":"The arrangements for teacher development and evaluation that would institutionalize this exchange are stated only as an implication; their design is left to those who will answer for them.","quote":{"paper":"T3","text":"designed by those who will answer for them","line":154,"anchor":"t3-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-6-p1","unit":"t3-6","k":1,"lines":[158,158],"label":"Testable commitments","does":"prediction","says":"What was left to others is collected as four testable propositions (the gap between supported performance and unsupported transfer, the effect of encounter-rich curricula, the effect of occasions of actual answering, and observation of assignment and enactment). Boundary conditions are set in the same paragraph: the framework is developed for formal education with identifiable educators; its extension to informal, massive or fully automated settings, the accessibility of reason-giving formats across languages and neurotypes, and the ethics of encounter designs involving real problem-holders are left open.","quote":{"paper":"T3","text":"collected here as testable commitments rather than scattered disclaimers","line":158,"anchor":"t3-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-7-p1","unit":"t3-7","k":1,"lines":[162,162],"label":"Conclusion","does":"summary","says":"What cannot be handed over is of two kinds: direction, a component whose endorsement cannot be done in one’s place, and answerability, which is not a component. AI changes the surrounding costs, but not the relation of who answers to whom.","quote":{"paper":"T3","text":"It is the cultivation of what was never a task.","line":162,"anchor":"t3-7","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-practitioner-notes-p1","unit":"t3-practitioner-notes","k":1,"lines":[167,168],"label":"What is already known","does":"positioning","says":"Learner agency is contested. An account that distributes it and an account that treats it as an individual capacity run in parallel.","quote":{"paper":"T3","text":"The two run in parallel.","line":168,"anchor":"t3-practitioner-notes","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-practitioner-notes-p2","unit":"t3-practitioner-notes","k":2,"lines":[171,174],"label":"What this paper adds","does":"summary","says":"Four things: a decomposition by delegability, a conjecture about the formation of direction, answerability as the relation the decomposition isolates, and prescriptions matched to the two layers.","quote":{"paper":"T3","text":"Answerability identified as a relation isolated, not contained, by the decomposition","line":173,"anchor":"t3-practitioner-notes","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-practitioner-notes-p3","unit":"t3-practitioner-notes","k":3,"lines":[177,180],"label":"For practice","does":"implication","says":"Read components separately (as an analytic map, not a high-stakes diagnostic classification). Build in ethically safeguarded encounters. Route specification-empty requests back into dialogue. Protect the exchanges in which one is asked, answers and takes up the answer.","quote":{"paper":"T3","text":"as an analytic map rather than a high-stakes diagnostic classification","line":177,"anchor":"t3-practitioner-notes","match":"exact"},"basis":"reading","vis":"public"}],"links":[{"id":"k-t3-1-p2--t3-2-5-p1","from":"t3-1-p2","to":"t3-2-5-p1","rel":"limits","note":"The range over which the distributed account holds is limited at the level of components.","basis":"reading","vis":"public"},{"id":"k-t3-1-p2--t3-4-2-p1","from":"t3-1-p2","to":"t3-4-2-p1","rel":"uses","note":"The absence of the term answerability from the account of machine agency seen in the introduction is used in answering the objection.","basis":"reading","vis":"public"},{"id":"k-t3-1-p3--t3-2-1-p2","from":"t3-1-p3","to":"t3-2-1-p2","rel":"takes up","note":"The question no one asks is adopted as the axis of the cut.","basis":"reading","vis":"public"},{"id":"k-t3-1-p4--t3-7-p1","from":"t3-1-p4","to":"t3-7-p1","rel":"sums up","note":"The two things announced as contributions (sorting the components and isolating the relation) are concluded as the two kinds of what cannot be handed over.","basis":"reading","vis":"public"},{"id":"k-t3-1-p6--t3-5-p1","from":"t3-1-p6","to":"t3-5-p1","rel":"uses","note":"The two layers announced in the introduction are used as the two layers of the prescription.","basis":"reading","vis":"public"},{"id":"k-t3-2-2-p1--t3-5-1-p1","from":"t3-2-2-p1","to":"t3-5-1-p1","rel":"uses","note":"The three components are used as a frame for reading learners.","basis":"reading","vis":"public"},{"id":"k-t3-2-3-p1--t3-3-p2","from":"t3-2-3-p1","to":"t3-3-p2","rel":"uses","note":"Available activation is matched to the supersaturation of the crystal analogy.","basis":"reading","vis":"public"},{"id":"k-t3-2-4-p2--t3-practitioner-notes-p3","from":"t3-2-4-p2","to":"t3-practitioner-notes-p3","rel":"restates","note":"The caution that this is not to be used for selection or deficit classification is stated again among the implications for practice.","basis":"reading","vis":"public"},{"id":"k-t3-2-4-p3--t3-3-p1","from":"t3-2-4-p3","to":"t3-3-p1","rel":"takes up","note":"It takes up the question of where a direction that cannot be installed comes from.","basis":"reading","vis":"public"},{"id":"k-t3-2-4-p4--t3-4-1-p1","from":"t3-2-4-p4","to":"t3-4-1-p1","rel":"takes up","note":"Answerability, which was not in the table, is isolated as a relation rather than a component.","basis":"reading","vis":"public"},{"id":"k-t3-2-4-p4--t3-4-3-p2","from":"t3-2-4-p4","to":"t3-4-3-p2","rel":"supports","note":"The point in the table’s note, that no substitute can answer, is supported by Darwall’s asymmetry.","basis":"reading","vis":"public"},{"id":"k-t3-2-5-p1--t3-5-4-p2","from":"t3-2-5-p1","to":"t3-5-4-p2","rel":"restates","note":"The limit that something is not distributed is restated: within a configuration, the one who answers is the human.","basis":"reading","vis":"public"},{"id":"k-t3-3-p2--t3-5-1-p2","from":"t3-3-p2","to":"t3-5-1-p2","rel":"uses","note":"The reading of a pre-crystallization state is used in the example.","basis":"reading","vis":"public"},{"id":"k-t3-3-p4--t3-5-2-p1","from":"t3-3-p4","to":"t3-5-2-p1","rel":"uses","note":"Under the limit that only exposure can be guaranteed, it is used in designing curricula.","basis":"reading","vis":"public"},{"id":"k-t3-3-p4--t3-6-p1","from":"t3-3-p4","to":"t3-6-p1","rel":"takes up","note":"The conjecture is turned into testable propositions.","basis":"reading","vis":"public"},{"id":"k-t3-4-3-p1--t3-4-4-p4","from":"t3-4-3-p1","to":"t3-4-4-p4","rel":"uses","note":"On the premise of the extension to the warrant of judgments, Darwall’s structural point is used.","basis":"reading","vis":"public"},{"id":"k-t3-4-4-p1--t3-5-4-p1","from":"t3-4-4-p1","to":"t3-5-4-p1","rel":"uses","note":"The distinction between standing and competence is used to say that what is conferred is the standing and what grows is the competence.","basis":"reading","vis":"public"},{"id":"k-t3-4-4-p2--t3-4-4-p4","from":"t3-4-4-p2","to":"t3-4-4-p4","rel":"supports","note":"That the second-personal concepts form a closed circle supports the claim that the difference is not one of degree.","basis":"reading","vis":"public"},{"id":"k-t3-4-4-p2--t3-5-3-p1","from":"t3-4-4-p2","to":"t3-5-3-p1","rel":"takes up","note":"Taking up the concern about uncritical delegation, it describes guardrails that shape delegation.","basis":"reading","vis":"public"},{"id":"k-t3-4-4-p3--t3-5-3-p3","from":"t3-4-4-p3","to":"t3-5-3-p3","rel":"uses","note":"The distinction between feeling that an AI is an addressee and its being a legitimate one is used to state the limits of guardrails.","basis":"reading","vis":"public"},{"id":"k-t3-5-4-p1--t3-6-p1","from":"t3-5-4-p1","to":"t3-6-p1","rel":"takes up","note":"The effect of occasions of answering is made into a testable proposition (P3).","basis":"reading","vis":"public"}],"ok":1},"T4":{"tiers":[{"id":"t4-1","no":"1","title":"The problem","line":25,"units":["t4-1-1","t4-1-2","t4-1-3","t4-1-4","t4-1-5"],"anchor":"t4en-u025"},{"id":"t4-2","no":"2","title":"Conceptual framework: adherence and the structure of undertaking","line":47,"units":["t4-2-1","t4-2-2","t4-2-3","t4-2-4"],"anchor":"t4en-u047"},{"id":"t4-3","no":"3","title":"Case analysis","line":98,"units":["t4-3"],"anchor":"t4en-u098"},{"id":"t4-4","no":"4","title":"Discussion: the path dependence of asymmetry and the two-pathway model","line":110,"units":["t4-4-1","t4-4-2","t4-4-3","t4-4-4"],"anchor":"t4en-u110"},{"id":"t4-5","no":"5","title":"Modes of failure and success: hollowing-out and 3M","line":152,"units":["t4-5","t4-5-1","t4-5-2","t4-5-3"],"anchor":"t4en-u152"},{"id":"t4-6","no":"6","title":"Conclusion","line":203,"units":["t4-6"],"anchor":"t4en-u203"}],"units":[{"id":"t4-1-1","tier":"t4-1","no":"1.1","title":"An underdeveloped demand: “jibungoto-ka”","intro":false,"line_start":27,"line_end":30,"paras":1,"size":550,"first":{"text":"In Japanese organizations, jibungoto-ka is demanded across domains.","line":29,"cut":false},"anchor":"t4en-u027"},{"id":"t4-1-2","tier":"t4-1","no":"1.2","title":"An analogous problem through which medicine has already passed","intro":false,"line_start":31,"line_end":34,"paras":1,"size":377,"first":{"text":"The point of reference for this article is a transition that medicine has already undergone.","line":33,"cut":false},"anchor":"t4en-u031"},{"id":"t4-1-3","tier":"t4-1","no":"1.3","title":"A cross-domain structure: the absence of explanatory language","intro":false,"line_start":35,"line_end":38,"paras":1,"size":313,"first":{"text":"The structure in which an absence of explanatory language obstructs uptake has been identified separately in individual domains.","line":37,"cut":false},"anchor":"t4en-u035"},{"id":"t4-1-4","tier":"t4-1","no":"1.4","title":"Why this redescription is needed now","intro":false,"line_start":39,"line_end":42,"paras":1,"size":329,"first":{"text":"The difficulty of jibungoto-ka is longstanding.","line":41,"cut":false},"anchor":"t4en-u039"},{"id":"t4-1-5","tier":"t4-1","no":"1.5","title":"Contributions of this article","intro":false,"line_start":43,"line_end":46,"paras":1,"size":286,"first":{"text":"This article makes five contributions.","line":45,"cut":false},"anchor":"t4en-u043"},{"id":"t4-2-1","tier":"t4-2","no":"2.1","title":"The core of medical adherence: the locus of legitimacy","intro":false,"line_start":49,"line_end":56,"paras":3,"size":968,"first":{"text":"The shift from “compliance” to “adherence” in medicine has not been a question of the degree of obedience—how faithfully the patient follows instructions.","line":51,"cut":false},"anchor":"t4en-u049"},{"id":"t4-2-2","tier":"t4-2","no":"2.2","title":"Translation through Mekiki: importing two distinctions","intro":false,"line_start":57,"line_end":64,"paras":3,"size":631,"first":{"text":"There have been scattered attempts to bring medical adherence theory into organizations, but without a common vocabulary the analogy has remained a superficial metaphor.","line":59,"cut":false},"anchor":"t4en-u057"},{"id":"t4-2-3","tier":"t4-2","no":"2.3","title":"The central proposition: what is jibungoto-ka?","intro":false,"line_start":65,"line_end":72,"paras":3,"size":574,"first":{"text":"The central proposition of this article can now be stated.","line":67,"cut":false},"anchor":"t4en-u065"},{"id":"t4-2-4","tier":"t4-2","no":"2.4","title":"The core of undertaking: answerability","intro":false,"line_start":73,"line_end":97,"paras":4,"size":1052,"first":{"text":"At the center of undertaking sits a relation independent of ability: answerability, the standing in which one must answer for a judgment to others entitled to question it.","line":75,"cut":false},"anchor":"t4en-u073"},{"id":"t4-3","tier":"t4-3","no":"3","title":"Case analysis","intro":false,"line_start":98,"line_end":109,"paras":4,"size":758,"first":{"text":"The framework developed so far will now be applied in depth to a single case.","line":100,"cut":false},"anchor":"t4en-u098"},{"id":"t4-4-1","tier":"t4-4","no":"4.1","title":"Why is adherence more readily established in medicine and difficult in organizations?","intro":false,"line_start":112,"line_end":117,"paras":2,"size":387,"first":{"text":"The preceding case illustrated the coexistence of repeated manual measurement and embodied learning, together with the possibility of intending the effect at the design stage if an explanatory language had been available.","line":114,"cut":false},"anchor":"t4en-u112"},{"id":"t4-4-2","tier":"t4-4","no":"4.2","title":"The asymmetry lies in the pathway","intro":false,"line_start":118,"line_end":127,"paras":4,"size":1214,"first":{"text":"This explanation still treats medicine as special, however.","line":120,"cut":false},"anchor":"t4en-u118"},{"id":"t4-4-3","tier":"t4-4","no":"4.3","title":"A two-pathway model of organizational adherence","intro":false,"line_start":128,"line_end":145,"paras":7,"size":2052,"first":{"text":"Pathway 1 runs forward.","line":132,"cut":false},"anchor":"t4en-u128"},{"id":"t4-4-4","tier":"t4-4","no":"4.4","title":"A limitation of scope and its reversal","intro":false,"line_start":146,"line_end":151,"paras":2,"size":634,"first":{"text":"An important limitation must be introduced here.","line":148,"cut":false},"anchor":"t4en-u146"},{"id":"t4-5","tier":"t4-5","no":"5","title":"Modes of failure and success: hollowing-out and 3M","intro":true,"line_start":152,"line_end":155,"paras":1,"size":69,"first":{"text":"Undertaking has paired modes of failure and success.","line":154,"cut":false},"anchor":"t4en-u152"},{"id":"t4-5-1","tier":"t4-5","no":"5.1","title":"Modes of failure: hollowing-out and self-conceit","intro":false,"line_start":156,"line_end":165,"paras":4,"size":947,"first":{"text":"Under certain conditions, the demand for jibungoto-ka may become dysfunctional.","line":158,"cut":false},"anchor":"t4en-u156"},{"id":"t4-5-2","tier":"t4-5","no":"5.2","title":"A mode of success: three operations at 3M","intro":false,"line_start":166,"line_end":181,"paras":7,"size":2471,"first":{"text":"At the opposite pole are designs that have succeeded in fostering undertaking.","line":168,"cut":false},"anchor":"t4en-u166"},{"id":"t4-5-3","tier":"t4-5","no":"5.3","title":"Observation through leading indicators","intro":false,"line_start":182,"line_end":202,"paras":4,"size":710,"first":{"text":"Having distinguished modes of failure and success, organizations can shift innovation management from lagging indicators—sales—to leading ones.","line":184,"cut":false},"anchor":"t4en-u182"},{"id":"t4-6","tier":"t4-6","no":"6","title":"Conclusion","intro":false,"line_start":203,"line_end":214,"paras":4,"size":905,"first":{"text":"Jibungoto-ka cannot be produced directly by command or implanted directly through training.","line":205,"cut":false},"anchor":"t4en-u203"}],"refs":[{"from":"t4-2-1","to":"t4-4-1","to_no":"4.1","line":55,"text":"This difference itself is addressed directly in Sections 4.1 and 4.2.","cut":false,"dir":"fwd"},{"from":"t4-2-1","to":"t4-4-2","to_no":"4.2","line":55,"text":"This difference itself is addressed directly in Sections 4.1 and 4.2.","cut":false,"dir":"fwd"},{"from":"t4-2-3","to":"t4-1-4","to_no":"1.4","line":69,"text":"In the terms of the previous section, it is the process in which the person crosses the innermost conversion barrier, the barrier to integration into practice; in the terms of Section 1.4, it corresponds to internalization.","cut":false,"dir":"back"},{"from":"t4-2-4","to":"t4-2-3","to_no":"2.3","line":77,"text":"The relation between the internal change described in Section 2.3—endorsing an intention as one's own value judgment—and this answerability should now be made explicit.","cut":false,"dir":"back"},{"from":"t4-2-4","to":"t4-5-1","to_no":"5.1","line":77,"text":"An obligation to respond without internal change is an entry into the hollowing-out discussed in Section 5.1; internal change without anyone to answer to remains a private resolve.","cut":false,"dir":"fwd"},{"from":"t4-2-4","to":"t4-4-1","to_no":"4","line":79,"text":"What this reciprocity requires of organizational design is developed in Sections 4 and 5.","cut":false,"dir":"fwd"},{"from":"t4-2-4","to":"t4-5","to_no":"5","line":79,"text":"What this reciprocity requires of organizational design is developed in Sections 4 and 5.","cut":false,"dir":"fwd"},{"from":"t4-3","to":"t4-5","to_no":"5","line":100,"text":"The leading indicators in Section 5 (Table 2) open a route to verification; this section provides a demonstration of application.","cut":false,"dir":"fwd"},{"from":"t4-4-2","to":"t4-4-1","to_no":"4.1","line":122,"text":"Section 4.1 described the arrangement at the start of treatment, not the prior history from which the purpose arose.","cut":false,"dir":"back"},{"from":"t4-4-3","to":"t4-2-3","to_no":"2.3","line":132,"text":"This is the standard image of jibungoto-ka described in Section 2.3 and the pathway implicitly assumed by many initiatives intended to secure uptake.","cut":false,"dir":"back"},{"from":"t4-4-3","to":"t4-4-1","to_no":"4.1","line":132,"text":"Yet it is structurally difficult for the reason described in Section 4.1: the purpose is not intrinsic to the employee.","cut":false,"dir":"back"},{"from":"t4-4-3","to":"t4-5","to_no":"5","line":132,"text":"That design is addressed in Section 5.","cut":false,"dir":"fwd"},{"from":"t4-4-3","to":"t4-1-2","to_no":"1.2","line":134,"text":"The notification discussed in Section 1.2 is the typical institutional form taken by this kind of initiative.","cut":false,"dir":"back"},{"from":"t4-4-3","to":"t4-4-2","to_no":"4.2","line":136,"text":"Like the hobbies mentioned at the end of Section 4.2, orientations crystallized through encounters outside the organization are among the resources Pathway 2 brings into formal consideration and response.","cut":false,"dir":"back"},{"from":"t4-4-3","to":"t4-2-4","to_no":"2.4","line":138,"text":"The pair of pathways also translates the reciprocity established in Section 2.4 to the scale of an organization.","cut":false,"dir":"back"},{"from":"t4-4-3","to":"t4-5","to_no":"5","line":138,"text":"This is the organizational-scale manifestation of the distortion discussed as self-conceit in Section 5.","cut":false,"dir":"fwd"},{"from":"t4-4-3","to":"t4-5","to_no":"5","line":140,"text":"The operational principles addressed in Section 5 attempt to shift this mediation from individuals to design.","cut":false,"dir":"fwd"},{"from":"t4-4-3","to":"t4-1-4","to_no":"1.4","line":142,"text":"Restating the shift in the rate-limiting step from Section 1.4 on the management side, a structure that could be run on experiential knowledge alone becomes something that will not function unless it is consciously designed.","cut":false,"dir":"back"},{"from":"t4-5-1","to":"t4-2-4","to_no":"2.4","line":162,"text":"The decisive point here is the distinction made in Section 2.4.","cut":false,"dir":"back"},{"from":"t4-5-1","to":"t4-2-4","to_no":"2.4","line":162,"text":"This is why Section 2.4's definition of answerability as a relational fact rather than an individual ability provides a basis for identifying the failure.","cut":false,"dir":"back"},{"from":"t4-5-1","to":"t4-2-4","to_no":"2.4","line":164,"text":"When a leader demands jibungoto-ka from subordinates but does not receive their judgments as judgments made by equals, the reciprocity described in Section 2.4 is absent.","cut":false,"dir":"back"},{"from":"t4-5-2","to":"t4-4-3","to_no":"4.3","line":168,"text":"If Nonaka's middle manager, considered in Section 4.3, is a mediator who deeply amplifies a few orientations through personal qualities, 3M's institutionalized practices are an apparatus that protects crystallization through a wide aperture without privileging particular people.","cut":false,"dir":"back"},{"from":"t4-5-2","to":"t4-4-2","to_no":"4.2","line":168,"text":"As Section 4.2 showed, that cannot be done.","cut":false,"dir":"back"},{"from":"t4-5-2","to":"t4-2-4","to_no":"2.4","line":172,"text":"This second operation translates Section 2.4's reciprocity into institutional form.","cut":false,"dir":"back"},{"from":"t4-5-2","to":"t4-2-4","to_no":"2.4","line":172,"text":"In the distinction of Section 2.4, accountability here is an allocation at the institutional layer.","cut":false,"dir":"back"},{"from":"t4-5-3","to":"t4-2-4","to_no":"2.4","line":188,"text":"Holding the quality or safety of existing work as one's own reason for judgment and continuing day by day to stand answerable for those judgments—in other words, undertaking maintenance—also satisfies Section 2.4's definition.","cut":false,"dir":"back"}],"figs":[{"kind":"table","no":1,"label":"Table 1","caption":"Table 1. Correspondences between medical adherence and organizational jibungoto-ka","line":83,"anchor":"t4-2-4","unit":"t4-2-4","omitted":false,"target":"t4en-u083","match":"exact"},{"kind":"table","no":2,"label":"Table 2","caption":"Table 2. Leading indicators of undertaking: candidates","line":190,"anchor":"t4-5-3","unit":"t4-5-3","omitted":false,"target":"t4en-u190","match":"exact"}],"parts":[{"id":"t4-1-1-p1","unit":"t4-1-1","k":1,"lines":[29,29],"label":"An underdeveloped demand","does":"frame","says":"Jibungoto-ka is demanded across domains, but the concept is underdeveloped. A framework that places four things together (endorsing a purpose, the standing to answer to specific others, embodiment in practice, and a pathway by which the organization returns reasons to employees’ orientations) has not been presented in a sufficiently developed form.","quote":{"paper":"T4","text":"The demand is strong, but what is being demanded remains unclear.","line":29,"anchor":"t4-1-1","match":"exact","target":"t4en-u029"},"basis":"reading","vis":"public"},{"id":"t4-1-2-p1","unit":"t4-1-2","k":1,"lines":[33,33],"label":"Medicine’s transition","does":"positioning","says":"Medicine shifted its concept from obedience to instructions (compliance) to active participation grounded in an understanding of their meaning (adherence). Jibungoto-ka in organizations implicitly asks for an analogous transition, but the instruments at hand mostly go no further than notification.","quote":{"paper":"T4","text":"Initiatives confined to notification remain on the pre-transition side, using the instruments of compliance to seek obedience.","line":33,"anchor":"t4-1-2","match":"exact","target":"t4en-u033"},"basis":"reading","vis":"public"},{"id":"t4-1-3-p1","unit":"t4-1-3","k":1,"lines":[37,37],"label":"No explanatory language","does":"claim","says":"Several fields have pointed out that the absence of an explanatory language hinders uptake. Absence here does not mean that there is no explanation at all; it means that a language for handing over, as a structure, why something is done has not been sufficiently systematized as an institution.","quote":{"paper":"T4","text":"uptake fails because a language for explaining why has not been systematized","line":37,"anchor":"t4-1-3","match":"exact","target":"t4en-u037"},"basis":"reading","vis":"public"},{"id":"t4-1-4-p1","unit":"t4-1-4","k":1,"lines":[41,41],"label":"Why now","does":"claim","says":"What generative AI accelerates is externalization and combination. The rate-limiting step moves toward socialization and internalization, and organizations that cannot sustain undertaking and embodiment are blocked there. Poor adherence was there before; in the AI era it comes to the foreground.","quote":{"paper":"T4","text":"Poor adherence has long existed in organizations, but in the AI era it comes to the foreground as the rate-limiting step determining organizational speed.","line":41,"anchor":"t4-1-4","match":"exact","target":"t4en-u041"},"basis":"reading","vis":"public"},{"id":"t4-1-5-p1","unit":"t4-1-5","k":1,"lines":[45,45],"label":"Five contributions","does":"frame","says":"There are five contributions: the transfer of medical adherence, the redefinition through undertaking and embodiment, reciprocity as a condition, the pathway of encounter and the two-pathway model, and operating principles (designing enabling conditions, accountability for decisions to stop, and observation by leading indicators).","quote":{"paper":"T4","text":"This article makes five contributions.","line":45,"anchor":"t4-1-5","match":"exact","target":"t4en-u045"},"basis":"reading","vis":"public"},{"id":"t4-2-1-p1","unit":"t4-2-1","k":1,"lines":[51,51],"label":"Locus of legitimacy moves","does":"claim","says":"The core of the transition is not the degree of obedience but a movement in the locus of legitimacy: from the physician’s authority to agreement between the patient and healthcare professionals. The key is not the rate of concordance but the agreement that precedes it.","quote":{"paper":"T4","text":"Its core lies in a movement in the locus of legitimacy.","line":51,"anchor":"t4-2-1","match":"exact","target":"t4en-u051"},"basis":"reading","vis":"public"},{"id":"t4-2-1-p2","unit":"t4-2-1","k":2,"lines":[53,53],"label":"Counseling and DOTS","does":"example","says":"Medication counseling is not a command but an act of handing over the why. From a design for situations where explanation alone is not enough (DOTS), the article abstracts three features: no proxy is possible, confirmation happens on the spot, and several elements are bundled. This three-part division is the article’s own abstraction.","quote":{"paper":"T4","text":"This three-part division is not the World Health Organization's official classification; it is an abstraction made by this article for transfer to organizations.","line":53,"anchor":"t4-2-1","match":"exact","target":"t4en-u053"},"basis":"reading","vis":"public"},{"id":"t4-2-1-p3","unit":"t4-2-1","k":3,"lines":[55,55],"label":"Scope of the transfer","does":"limit","says":"What is transferred to organizations is three structures (the movement of the locus of legitimacy, explanation that hands over the why, and design that protects processes that cannot be done by proxy); the conditions of the parties are not analogous. Medicine is taken as a precedent not for its level of achievement but for its change of conception and its circuit of research.","quote":{"paper":"T4","text":"What is analogous is the structure of the transition, not the conditions in which the parties find themselves.","line":55,"anchor":"t4-2-1","match":"exact","target":"t4en-u055"},"basis":"reading","vis":"public"},{"id":"t4-2-2-p1","unit":"t4-2-2","k":1,"lines":[59,61],"label":"Two distinctions","does":"definition","says":"Two distinctions are imported from the two earlier papers: the separation of the substrate of expertise (the person’s own judgment that determines how procedures are applied) from the barriers to converting it into artifacts, and the separation of factual recognition (Sein) from value judgment (Sollen). What generative AI has reduced is mainly the barriers on the conversion side, not the substrate itself.","quote":{"paper":"T4","text":"What generative AI has dramatically reduced is mainly these barriers on the conversion side, not the substrate itself","line":61,"anchor":"t4-2-2","match":"exact","target":"t4en-u061"},"basis":"reading","vis":"public"},{"id":"t4-2-2-p2","unit":"t4-2-2","k":2,"lines":[63,63],"label":"Counseling rewritten","does":"implication","says":"Medication counseling is an explanation that puts into words and hands to the patient the substrate and the locus of judgment. An organization’s explanation of why a task is needed can have the same structure, but that language has not been sufficiently systematized.","quote":{"paper":"T4","text":"Medication counseling is an explanation that articulates and hands to the patient the substrate and the locus of judgment.","line":63,"anchor":"t4-2-2","match":"exact","target":"t4en-u063"},"basis":"reading","vis":"public"},{"id":"t4-2-3-p1","unit":"t4-2-3","k":1,"lines":[67,67],"label":"Core proposition","does":"claim","says":"Jibungoto-ka is neither the state of knowing management’s intention nor the state of complying with it. It is a combination of undertaking and embodiment.","quote":{"paper":"T4","text":"It is a combination of undertaking and embodiment.","line":67,"anchor":"t4-2-3","match":"exact","target":"t4en-u067"},"basis":"reading","vis":"public"},{"id":"t4-2-3-p2","unit":"t4-2-3","k":2,"lines":[69,69],"label":"Undertaking, embodiment","does":"definition","says":"The internal side of undertaking is to endorse an intention that came from outside as one’s own reason for judgment (the direction of this value judgment is called an orientation). Even a goal that was given, once undertaken, is something one answers for oneself. Embodiment occurs only through the person’s actually doing it.","quote":{"paper":"T4","text":"Its external origin has no bearing on my becoming answerable through undertaking.","line":69,"anchor":"t4-2-3","match":"exact","target":"t4en-u069"},"basis":"reading","vis":"public"},{"id":"t4-2-3-p3","unit":"t4-2-3","k":3,"lines":[71,71],"label":"Neither alone","does":"limit","says":"Undertaking an orientation without bodily action ends in words alone; bodily action without undertaking the orientation is simply acting because one was told to.","quote":{"paper":"T4","text":"Undertaking and embodiment do not constitute jibungoto-ka if either is present alone.","line":71,"anchor":"t4-2-3","match":"normalized","target":"t4en-u071"},"basis":"reading","vis":"public"},{"id":"t4-2-4-p1","unit":"t4-2-4","k":1,"lines":[75,75],"label":"Answerability","does":"definition","says":"At the center of undertaking is a relation independent of ability: the standing of having to answer for a judgment to others entitled to ask (answerability). It cannot be transferred to someone else in the way an ability can.","quote":{"paper":"T4","text":"it cannot be transferred to someone else in the way an ability can","line":75,"anchor":"t4-2-4","match":"exact","target":"t4en-u075"},"basis":"reading","vis":"public"},{"id":"t4-2-4-p2","unit":"t4-2-4","k":2,"lines":[77,77],"label":"Institution and relation","does":"definition","says":"The institutional layer, which can be reallocated, is called accountability and is separated from the non-transferable standing of undertaking. Undertaking means the state in which the internal side, endorsing a purpose as one’s own reason for judgment, is held within a relation of giving reasons to specific others.","quote":{"paper":"T4","text":"Undertaking, as used in this article, means the state in which the former is held within the relation of the latter.","line":77,"anchor":"t4-2-4","match":"exact","target":"t4en-u077"},"basis":"reading","vis":"public"},{"id":"t4-2-4-p3","unit":"t4-2-4","k":3,"lines":[79,79],"label":"Reciprocity","does":"claim","says":"This standing requires a reciprocal structure. Unless the one who asks treats the other as an equal subject of judgment and also stands on the answering side, it is merely a one-sided demand. If management asks for undertaking, management too must stand answerable to employees’ judgments.","quote":{"paper":"T4","text":"The setting in which answerability can stand is established only on reciprocity.","line":79,"anchor":"t4-2-4","match":"exact","target":"t4en-u079"},"basis":"reading","vis":"public"},{"id":"t4-2-4-p4","unit":"t4-2-4","k":4,"lines":[81,96],"label":"Table: correspondence","does":"summary","says":"Table 1 sets out the correspondence between medicine and organizations. The distinction between the institutional layer and the relational layer is not one item alongside the other perspectives; it is an analytical axis running through the whole table.","quote":{"paper":"T4","text":"this distinction is not simply one item alongside the other perspectives. It is an analytical axis running through the entire table.","line":96,"anchor":"t4-2-4","match":"exact","target":"t4en-u096"},"basis":"reading","vis":"public"},{"id":"t4-3-p1","unit":"t4-3","k":1,"lines":[100,100],"label":"Role of the case","does":"limit","says":"The framework is applied to one case. The aim is to show the procedure for mapping a phenomenon into the article’s vocabulary. What the example shows is mainly the embodiment side; it does not empirically establish undertaking or the two-pathway model as a whole.","quote":{"paper":"T4","text":"does not empirically establish undertaking or the two-pathway model as a whole","line":100,"anchor":"t4-3","match":"exact","target":"t4en-u100"},"basis":"reading","vis":"public"},{"id":"t4-3-p2","unit":"t4-3","k":2,"lines":[102,104],"label":"Manual detector tubes","does":"example","says":"At one site, a young staff member was asked to measure ammonia concentration once a week with manual detector tubes. With repetition, the correspondence among color, number and bodily perception became established in the body. The educational effect was recognized afterwards.","quote":{"paper":"T4","text":"the correspondence among color, number, and bodily perception became established in the staff member’s body","line":104,"anchor":"t4-3","match":"exact","target":"t4en-u104"},"basis":"reading","vis":"public"},{"id":"t4-3-p3","unit":"t4-3","k":3,"lines":[106,106],"label":"A barrier left in place","does":"implication","says":"Had the measurements been replaced by automatic sensors, the same learning would likely have been less readily produced. Leaving in place, unintentionally, the barrier of ingraining something in practice turned measurement into a pathway for accumulating the substrate. With the framework, this could have been intended at the design stage.","quote":{"paper":"T4","text":"turned the act of measurement itself into a pathway for accumulating the substrate","line":106,"anchor":"t4-3","match":"exact","target":"t4en-u106"},"basis":"reading","vis":"public"},{"id":"t4-3-p4","unit":"t4-3","k":4,"lines":[108,108],"label":"Possessed as a design?","does":"claim","says":"The absence of an explanatory language does not mean that no effect occurs. What it means is that the organization cannot possess the effect as a reproducible design. The way to use the framework is for readers to repeat this mapping on their own experience.","quote":{"paper":"T4","text":"It means, however, that the organization cannot possess the effect as a reproducible design.","line":108,"anchor":"t4-3","match":"exact","target":"t4en-u108"},"basis":"reading","vis":"public"},{"id":"t4-4-1-p1","unit":"t4-4-1","k":1,"lines":[114,116],"label":"Purposes from outside","does":"claim","says":"The first explanation is a difference in where the purpose lies at the point when treatment or a job begins. In medicine, in many cases, the intention to get well already exists in the patient at that point. In a company, goals come down from the upper levels of the hierarchy. The choice that they should be pursued is a value judgment of management, and a corresponding intention does not automatically exist in employees.","quote":{"paper":"T4","text":"At root, jibungoto-ka is difficult in organizations because purposes come from outside.","line":116,"anchor":"t4-4-1","match":"normalized","target":"t4en-u116"},"basis":"reading","vis":"public"},{"id":"t4-4-2-p1","unit":"t4-4-2","k":1,"lines":[120,122],"label":"Pathway, not domain","does":"claim","says":"The asymmetry is not domain-specific but pathway-specific. The structure of medicine connects both patients and healthcare professionals to bodily encounter with the problem. The purpose was not intrinsic from the start; it was internalized through encounter.","quote":{"paper":"T4","text":"The asymmetry is not domain-specific but pathway-specific.","line":120,"anchor":"t4-4-2","match":"exact","target":"t4en-u120"},"basis":"reading","vis":"public"},{"id":"t4-4-2-p2","unit":"t4-4-2","k":2,"lines":[124,124],"label":"Four observations","does":"grounds","says":"Four observations of differing character share the form of an order in which encounter comes first and orientation after. They are not causal proof, but heterogeneous observations consistent with the hypothesis.","quote":{"paper":"T4","text":"They are not causal proof of this mechanism, but heterogeneous observations consistent with the hypothesis.","line":124,"anchor":"t4-4-2","match":"exact","target":"t4en-u124"},"basis":"reading","vis":"public"},{"id":"t4-4-2-p3","unit":"t4-4-2","k":3,"lines":[126,126],"label":"Conditions, not injection","does":"implication","says":"Purposes themselves cannot be injected. What employees encounter bodily, however, can be designed. What organizations can do is design enabling conditions, including encounters. Hobbies are a store of energy not yet connected to problems inside the company.","quote":{"paper":"T4","text":"What organizations can do is not inject purposes but design enabling conditions, including encounters.","line":126,"anchor":"t4-4-2","match":"exact","target":"t4en-u126"},"basis":"reading","vis":"public"},{"id":"t4-4-3-p1","unit":"t4-4-3","k":1,"lines":[130,132],"label":"Two pathways","does":"definition","says":"Pathway 1 is the forward one: management communicates an intention and employees undertake it. Pathway 2 is the reverse one: an orientation crystallized by an employee through encounter enters formal consideration, and a specific authorized party gives reasons for adoption, deferral or termination alike. What the organization necessarily undertakes is not the orientation itself but its own judgment about how to treat it.","quote":{"paper":"T4","text":"What the organization necessarily undertakes here is not the orientation itself but its own judgment about how to treat that orientation.","line":132,"anchor":"t4-4-3","match":"exact","target":"t4en-u132"},"basis":"reading","vis":"public"},{"id":"t4-4-3-p2","unit":"t4-4-3","k":2,"lines":[134,134],"label":"Why failure is chronic","does":"claim","says":"Many unsuccessful initiatives press Pathway 1 strongly. The binding constraint, however, often lies in the absence of Pathway 2. The pathway being pushed is not the pathway that is blocked.","quote":{"paper":"T4","text":"The pathway being pushed is not the pathway that is blocked.","line":134,"anchor":"t4-4-3","match":"exact","target":"t4en-u134"},"basis":"reading","vis":"public"},{"id":"t4-4-3-p3","unit":"t4-4-3","k":3,"lines":[136,136],"label":"Encounters outside","does":"definition","says":"The encounters from which Pathway 2 begins are not limited to the inside of the organization. Orientations crystallized from encounters outside it are also among the things given formal consideration and response.","quote":{"paper":"T4","text":"The encounters from which Pathway 2 begins are not limited to the organization.","line":136,"anchor":"t4-4-3","match":"exact","target":"t4en-u136"},"basis":"reading","vis":"public"},{"id":"t4-4-3-p4","unit":"t4-4-3","k":4,"lines":[138,138],"label":"Reciprocity at scale","does":"implication","says":"The pair of pathways is also reciprocity carried to the scale of the organization. An initiative that lacks Pathway 2 and presses only the forward one takes the form of a one-sided relationship: asking without responding.","quote":{"paper":"T4","text":"take the form of a one-sided relationship: asking without responding","line":138,"anchor":"t4-4-3","match":"exact","target":"t4en-u138"},"basis":"reading","vis":"public"},{"id":"t4-4-3-p5","unit":"t4-4-3","k":5,"lines":[140,140],"label":"The middle as precedent","does":"positioning","says":"The middle-up-down management of Nonaka and colleagues is a precedent in which the two pathways were mediated by people in a position. The article does not attempt to replace Nonaka’s theory; it divides the mediating function into two pathways and maps it into a vocabulary of design and observation.","quote":{"paper":"T4","text":"This article does not attempt to replace Nonaka's theory.","line":140,"anchor":"t4-4-3","match":"exact","target":"t4en-u140"},"basis":"reading","vis":"public"},{"id":"t4-4-3-p6","unit":"t4-4-3","k":6,"lines":[142,142],"label":"From tacit to designed","does":"claim","says":"The two pathways have been kept running by experienced managers without being given a name. The more AI absorbs externalization and combination, the more they become something that will not function unless consciously designed.","quote":{"paper":"T4","text":"becomes something that will not function unless it is consciously designed","line":142,"anchor":"t4-4-3","match":"exact","target":"t4en-u142"},"basis":"reading","vis":"public"},{"id":"t4-4-3-p7","unit":"t4-4-3","k":7,"lines":[144,144],"label":"The reversal hypothesis","does":"prediction","says":"Against the classical diagnosis that organizations and AI diffuse the locus of judgment, the article indicates a possibility in the reverse direction. Delegation that makes the Sein/Sollen decomposition explicit calls for a record of where the line was drawn. The reversal holds only where this is made explicit, and is a hypothesis to be put to observation.","quote":{"paper":"T4","text":"This reversal is not a claim about AI adoption in general.","line":144,"anchor":"t4-4-3","match":"exact","target":"t4en-u144"},"basis":"reading","vis":"public"},{"id":"t4-4-4-p1","unit":"t4-4-4","k":1,"lines":[148,148],"label":"Limit of scope","does":"limit","says":"The problem may not be universal. It is likely to become particularly salient in the Japanese-style structure, which asks for undertaking beyond the scope of a job without delimiting that scope by contract.","quote":{"paper":"T4","text":"This article's problem is likely to become particularly salient within that Japanese-style structure, which asks for jibungoto-ka without contractually delimiting its scope.","line":148,"anchor":"t4-4-4","match":"normalized","target":"t4en-u148"},"basis":"reading","vis":"public"},{"id":"t4-4-4-p2","unit":"t4-4-4","k":2,"lines":[150,150],"label":"The limit reversed","does":"prediction","says":"The limit can also be read the other way. What generative AI absorbs is the part of a job that can be written into a contract. As the weight of judgment and undertaking that cannot be written into contracts grows, this problem will converge on contract-based employment as well.","quote":{"paper":"T4","text":"the avoidance strategy of drawing boundaries by contract itself becomes less effective","line":150,"anchor":"t4-4-4","match":"exact","target":"t4en-u150"},"basis":"reading","vis":"public"},{"id":"t4-5-p1","unit":"t4-5","k":1,"lines":[154,154],"label":"Two modes","does":"frame","says":"The mode of failure and the mode of success are the same process of undertaking turning in opposite directions under different conditions.","quote":{"paper":"T4","text":"the same process of undertaking turning in opposite directions under different conditions","line":154,"anchor":"t4-5","match":"exact","target":"t4en-u154"},"basis":"reading","vis":"public"},{"id":"t4-5-1-p1","unit":"t4-5-1","k":1,"lines":[158,160],"label":"Hollowing-out","does":"claim","says":"The state in which the substance of undertaking falls away while the form of the demand continues to circulate is called hollowing-out. When jibungoto-ka is treated as a value that must not be questioned, people compete not over the soundness of the content but in displays of loyalty, and learning stops.","quote":{"paper":"T4","text":"the substance of undertaking falls away while the form of the demand continues to circulate","line":158,"anchor":"t4-5-1","match":"exact","target":"t4en-u158"},"basis":"reading","vis":"public"},{"id":"t4-5-1-p2","unit":"t4-5-1","k":2,"lines":[162,162],"label":"A surrogate in the seat","does":"implication","says":"In a hollowed-out organization, a surrogate, an expression of loyalty, occupies the place of answerability. The stipulation that answerability is not an individual ability but a fact of relation provides a foothold for seeing through this failure.","quote":{"paper":"T4","text":"a surrogate—an expression of loyalty—occupies the place of answerability","line":162,"anchor":"t4-5-1","match":"exact","target":"t4en-u162"},"basis":"reading","vis":"public"},{"id":"t4-5-1-p3","unit":"t4-5-1","k":3,"lines":[164,164],"label":"Self-conceit","does":"claim","says":"The other failure is self-conceit: demanding answers from others while not standing on the answering side oneself. Hollowing-out replaces undertaking with a surrogate as a group dynamic; self-conceit, as a structure of the relationship, first destroys the conditions under which undertaking can be established.","quote":{"paper":"T4","text":"self-conceit first destroys the conditions under which undertaking can be established through the structure of the relationship","line":164,"anchor":"t4-5-1","match":"exact","target":"t4en-u164"},"basis":"reading","vis":"public"},{"id":"t4-5-2-p1","unit":"t4-5-2","k":1,"lines":[168,168],"label":"Rereading 3M","does":"positioning","says":"3M’s system is read as a design that has the organization take over the dependence on individuals’ power to break through. This is not a historical claim about the designers’ intentions but a redescription of how the system functions. What 3M does is not manufacture intentions but perform three operations that arrange the conditions for their expression.","quote":{"paper":"T4","text":"3M does not manufacture intentions themselves","line":168,"anchor":"t4-5-2","match":"exact","target":"t4en-u168"},"basis":"reading","vis":"public"},{"id":"t4-5-2-p2","unit":"t4-5-2","k":2,"lines":[170,170],"label":"Whoever stops it answers","does":"claim","says":"The first operation is removing what inhibits expression. The second changes the allocation of accountability: continuation is placed on the default side, and the demand for explanation is moved to the stopping side. This is not laissez-faire but an allocation: whoever stops it must answer.","quote":{"paper":"T4","text":"The design on the stopping side is not laissez-faire—“do not stop”—but an allocation: “whoever stops it must answer.”","line":170,"anchor":"t4-5-2","match":"exact","target":"t4en-u170"},"basis":"reading","vis":"public"},{"id":"t4-5-2-p3","unit":"t4-5-2","k":3,"lines":[172,172],"label":"Reciprocity instituted","does":"implication","says":"The second operation is reciprocity carried into an institution. What is protected is not the privilege of individuals with a track record but crystallization that has no track record yet. Nor is it immunity from answering. Institutions cannot create non-transferable answerability, but they can provide the setting in which it stands.","quote":{"paper":"T4","text":"Institutions cannot create non-transferable answerability, but they can provide the setting in which it stands.","line":172,"anchor":"t4-5-2","match":"exact","target":"t4en-u172"},"basis":"reading","vis":"public"},{"id":"t4-5-2-p4","unit":"t4-5-2","k":4,"lines":[174,174],"label":"Duties to ask and answer","does":"grounds","says":"Medicine has an earlier analogue in which statutory provisions fix, as a pair, the obligation to ask and the obligation to answer. From this the article posits a hypothesis: an obligation repeated institutionally may eventually support the formation of a practical stance. The 3M case suggests that such an institution need not be law: an institutionalized internal practice can suffice.","quote":{"paper":"T4","text":"this article posits a hypothesis: an obligation repeated institutionally may eventually support the formation of a practical stance","line":174,"anchor":"t4-5-2","match":"exact","target":"t4en-u174"},"basis":"reading","vis":"public"},{"id":"t4-5-2-p5","unit":"t4-5-2","k":5,"lines":[176,176],"label":"Aligned incentives","does":"example","says":"The third operation is aligning incentives. Allowing trials along the way aligns with the organization’s self-interest rather than depending on managers’ virtue.","quote":{"paper":"T4","text":"aligns with organizational self-interest rather than depending on managers' virtue","line":176,"anchor":"t4-5-2","match":"exact","target":"t4en-u176"},"basis":"reading","vis":"public"},{"id":"t4-5-2-p6","unit":"t4-5-2","k":6,"lines":[178,178],"label":"What the design ensures","does":"limit","says":"What the design that bundles the three ensures extends to the volume of trials and to crystallized orientations not being killed; it does not extend to the success of individual trials.","quote":{"paper":"T4","text":"not to the success of individual trials","line":178,"anchor":"t4-5-2","match":"exact","target":"t4en-u178"},"basis":"reading","vis":"public"},{"id":"t4-5-2-p7","unit":"t4-5-2","k":7,"lines":[180,180],"label":"Why an institution","does":"grounds","says":"Verbal encouragement is no substitute for an institution. Initiative does not ride on forward communication. Verbal permission alone does not fix who answers. Protecting a trial with words consumes the virtue and courage of those who protect. Explanatory language and institutions are complementary, not substitutes.","quote":{"paper":"T4","text":"language and institutions are complementary, not substitutes","line":180,"anchor":"t4-5-2","match":"exact","target":"t4en-u180"},"basis":"reading","vis":"public"},{"id":"t4-5-3-p1","unit":"t4-5-3","k":1,"lines":[184,184],"label":"To leading indicators","does":"claim","says":"Management can be shifted from lagging indicators (sales) to leading ones. The objects of observation are whose orientation is crystallizing where, and whether that orientation is actually in motion.","quote":{"paper":"T4","text":"organizations can shift innovation management from lagging indicators—sales—to leading ones","line":184,"anchor":"t4-5-3","match":"exact","target":"t4en-u184"},"basis":"reading","vis":"public"},{"id":"t4-5-3-p2","unit":"t4-5-3","k":2,"lines":[186,186],"label":"What may be measured","does":"limit","says":"The objects of measurement are not the contents of values but the conditions of their expression and their behavioral correlates. Whether a change of intention has really occurred cannot be measured directly. The arrangement of relations, who asked whom for reasons and who answered, can be observed.","quote":{"paper":"T4","text":"The objects of measurement are not the contents of values but the conditions of their expression and their behavioral correlates.","line":186,"anchor":"t4-5-3","match":"exact","target":"t4en-u186"},"basis":"reading","vis":"public"},{"id":"t4-5-3-p3","unit":"t4-5-3","k":3,"lines":[188,188],"label":"Bias in observation","does":"limit","says":"The indicators in Table 2 capture undertaking on the side of crystallization and challenge. Maintenance, which keeps the quality and safety of existing work and continues to stand answerable day by day, is undertaking too. The absence of an indicator must not be read as the absence of undertaking.","quote":{"paper":"T4","text":"The absence of an indicator in Table 2 must therefore not be read as the absence of undertaking.","line":188,"anchor":"t4-5-3","match":"exact","target":"t4en-u188"},"basis":"reading","vis":"public"},{"id":"t4-5-3-p4","unit":"t4-5-3","k":4,"lines":[190,201],"label":"Table: indicators","does":"summary","says":"Table 2 lists candidate leading indicators. No row measures the change of intention itself. The arrangement of relations of answerability is observed in the rows on the quality of stopping and on making the locus of judgment explicit.","quote":{"paper":"T4","text":"No row in this table measures the change of intention itself—the internal side of undertaking.","line":201,"anchor":"t4-5-3","match":"exact","target":"t4en-u201"},"basis":"reading","vis":"public"},{"id":"t4-6-p1","unit":"t4-6","k":1,"lines":[205,205],"label":"Operating principles","does":"summary","says":"Organizations cannot inject intentions, but they can design encounters. An orientation that is beginning to crystallize is not stopped without reasons; if it is stopped, the stopping side answers. Knowing that the internal side cannot be measured directly, they observe the arrangement of relations and the conditions of expression.","quote":{"paper":"T4","text":"if they do stop it, the stopping side answers","line":205,"anchor":"t4-6","match":"exact","target":"t4en-u205"},"basis":"reading","vis":"public"},{"id":"t4-6-p2","unit":"t4-6","k":2,"lines":[207,207],"label":"In the AI era","does":"implication","says":"Generative AI accelerates externalization and combination, but the subjects who undertake and the settings in which undertaking grows are not accelerated in the same way. The ability to sustain undertaking and embodiment comes to determine organizational speed.","quote":{"paper":"T4","text":"the ability to sustain undertaking and embodiment comes to determine organizational speed","line":207,"anchor":"t4-6","match":"exact","target":"t4en-u207"},"basis":"reading","vis":"public"},{"id":"t4-6-p3","unit":"t4-6","k":3,"lines":[209,209],"label":"The limit turned around","does":"limit","says":"The limit of scope is once more placed the other way around. That Japanese-style organizations have long carried this problem is a weakness, but it also means that they have already experienced a problem many organizations will come to face.","quote":{"paper":"T4","text":"is a weakness, but also means that they have already experienced a problem that many organizations will come to face","line":209,"anchor":"t4-6","match":"exact","target":"t4en-u209"},"basis":"reading","vis":"public"},{"id":"t4-6-p4","unit":"t4-6","k":4,"lines":[211,211],"label":"Know, love, delight","does":"positioning","says":"The article quotes the Analects (those who know it are not equal to those who love it; those who love it are not equal to those who delight in it). What notification can convey extends only as far as knowing. The two-pathway model resonates with these words. What was missing was not the teaching but a vocabulary for translating it into organizational design.","quote":{"paper":"T4","text":"What was missing was not the teaching but a vocabulary for translating it into organizational design.","line":211,"anchor":"t4-6","match":"exact","target":"t4en-u211"},"basis":"reading","vis":"public"}],"links":[{"id":"k-t4-1-2-p1--t4-2-1-p1","from":"t4-1-2-p1","to":"t4-2-1-p1","rel":"takes up","note":"Medicine’s transition is reconceived as a movement in the locus of legitimacy.","basis":"reading","vis":"public"},{"id":"k-t4-1-3-p1--t4-3-p4","from":"t4-1-3-p1","to":"t4-3-p4","rel":"uses","note":"What the absence of an explanatory language means is stated through the case (not that no effect occurs, but that it cannot be possessed as a design).","basis":"reading","vis":"public"},{"id":"k-t4-1-4-p1--t4-4-3-p6","from":"t4-1-4-p1","to":"t4-4-3-p6","rel":"restates","note":"The shift of the rate-limiting step is restated from the side of management.","basis":"reading","vis":"public"},{"id":"k-t4-1-5-p1--t4-6-p1","from":"t4-1-5-p1","to":"t4-6-p1","rel":"sums up","note":"The contributions announced are concluded as operating principles and the two-pathway model.","basis":"reading","vis":"public"},{"id":"k-t4-2-1-p3--t4-4-1-p1","from":"t4-2-1-p3","to":"t4-4-1-p1","rel":"takes up","note":"The difference between the conditions of patients and of employees is addressed directly.","basis":"reading","vis":"public"},{"id":"k-t4-2-2-p1--t4-3-p3","from":"t4-2-2-p1","to":"t4-3-p3","rel":"uses","note":"The innermost of the conversion barriers (ingraining in practice) is used in reading the case.","basis":"reading","vis":"public"},{"id":"k-t4-2-2-p1--t4-4-3-p7","from":"t4-2-2-p1","to":"t4-4-3-p7","rel":"uses","note":"The separation of Sein and Sollen is used for recording where the line of delegation is drawn.","basis":"reading","vis":"public"},{"id":"k-t4-2-4-p1--t4-5-1-p2","from":"t4-2-4-p1","to":"t4-5-1-p2","rel":"uses","note":"The stipulation that answerability is a fact of relation, not an ability, is used as a foothold for seeing through hollowing-out.","basis":"reading","vis":"public"},{"id":"k-t4-2-4-p2--t4-5-1-p1","from":"t4-2-4-p2","to":"t4-5-1-p1","rel":"takes up","note":"The state in which only an obligation to respond exists, without internal change (the entrance to hollowing-out), is taken up in the section on hollowing-out.","basis":"reading","vis":"public"},{"id":"k-t4-2-4-p3--t4-4-3-p4","from":"t4-2-4-p3","to":"t4-4-3-p4","rel":"uses","note":"Reciprocity is carried to the scale of the organization.","basis":"reading","vis":"public"},{"id":"k-t4-2-4-p3--t4-5-1-p3","from":"t4-2-4-p3","to":"t4-5-1-p3","rel":"uses","note":"Self-conceit is described as the form in which reciprocity is missing.","basis":"reading","vis":"public"},{"id":"k-t4-2-4-p3--t4-5-2-p3","from":"t4-2-4-p3","to":"t4-5-2-p3","rel":"uses","note":"Reciprocity is carried into an institution.","basis":"reading","vis":"public"},{"id":"k-t4-3-p1--t4-5-3-p4","from":"t4-3-p1","to":"t4-5-3-p4","rel":"tests","note":"The text says that the case is a demonstration of application, and that the route to testing is opened by the table of leading indicators.","basis":"reading","vis":"public"},{"id":"k-t4-4-1-p1--t4-4-2-p1","from":"t4-4-1-p1","to":"t4-4-2-p1","rel":"limits","note":"The explanation by where purposes reside is re-placed as a difference of pathway, not of domain.","basis":"reading","vis":"public"},{"id":"k-t4-4-2-p1--t4-4-2-p2","from":"t4-4-2-p1","to":"t4-4-2-p2","rel":"supports","note":"The four observations are consistent with the reading that purposes were internalized through encounter (they are not a causal proof).","basis":"reading","vis":"public"},{"id":"k-t4-4-2-p3--t4-4-3-p3","from":"t4-4-2-p3","to":"t4-4-3-p3","rel":"uses","note":"Like hobbies, encounters outside the organization are counted among its resources.","basis":"reading","vis":"public"},{"id":"k-t4-4-2-p3--t4-5-2-p1","from":"t4-4-2-p3","to":"t4-5-2-p1","rel":"uses","note":"The point that intentions cannot be manufactured is used in reading 3M.","basis":"reading","vis":"public"},{"id":"k-t4-4-3-p1--t4-5-2-p2","from":"t4-4-3-p1","to":"t4-5-2-p2","rel":"takes up","note":"The design problem left in Pathway 2 (who answers if something is stopped) is treated as accountability on the stopping side.","basis":"reading","vis":"public"},{"id":"k-t4-4-3-p3--t4-5-3-p4","from":"t4-4-3-p3","to":"t4-5-3-p4","rel":"uses","note":"The domain of encounters (inside and outside work) is carried into the categories of the indicators.","basis":"reading","vis":"public"},{"id":"k-t4-4-3-p4--t4-5-1-p3","from":"t4-4-3-p4","to":"t4-5-1-p3","rel":"takes up","note":"The relationship of asking without responding is taken up as self-conceit.","basis":"reading","vis":"public"},{"id":"k-t4-4-3-p5--t4-5-2-p1","from":"t4-4-3-p5","to":"t4-5-2-p1","rel":"takes up","note":"Mediation by people (the middle) and protection by an institution (3M) are read as complementing each other.","basis":"reading","vis":"public"},{"id":"k-t4-4-3-p7--t4-5-3-p4","from":"t4-4-3-p7","to":"t4-5-3-p4","rel":"tests","note":"The reversal hypothesis is put into observable form in the row on making the locus of judgment explicit.","basis":"reading","vis":"public"},{"id":"k-t4-4-4-p2--t4-6-p3","from":"t4-4-4-p2","to":"t4-6-p3","rel":"restates","note":"The reversal of the limit is placed once more in the conclusion.","basis":"reading","vis":"public"},{"id":"k-t4-5-3-p2--t4-6-p1","from":"t4-5-3-p2","to":"t4-6-p1","rel":"sums up","note":"The line between what can and cannot be measured is concluded in the operating principles.","basis":"reading","vis":"public"}],"ok":1},"T5":{"tiers":[{"id":"t5-abstract","no":"","title":"Abstract","line":11,"units":["t5-abstract"]},{"id":"t5-1","no":"1","title":"Introduction","line":21,"units":["t5-1"]},{"id":"t5-2","no":"2","title":"The Separation: Achieved State and Participation","line":47,"units":["t5-2-1","t5-2-2","t5-2-3"]},{"id":"t5-3","no":"3","title":"The Non-Transferability Theorem","line":75,"units":["t5-3-1","t5-3-2","t5-3-3","t5-3-4","t5-3-5"]},{"id":"t5-4","no":"4","title":"The Conditions of Acceptance","line":127,"units":["t5-4-1","t5-4-2","t5-4-3","t5-4-4","t5-4-5","t5-4-6"]},{"id":"t5-5","no":"5","title":"A Completed Historical Case","line":195,"units":["t5-5-1","t5-5-2","t5-5-3","t5-5-4"]},{"id":"t5-postscript","no":"","title":"Postscript","line":225,"units":["t5-postscript"]}],"units":[{"id":"t5-abstract","tier":"t5-abstract","no":"","title":"Abstract","intro":false,"line_start":11,"line_end":14,"paras":1,"size":227,"first":{"text":"Knowledge work is learning to hand itself over.","line":13,"cut":false}},{"id":"t5-1","tier":"t5-1","no":"1","title":"Introduction","intro":false,"line_start":21,"line_end":46,"paras":12,"size":2287,"first":{"text":"In November 2019, Lee Sedol retired from professional Go.","line":23,"cut":false}},{"id":"t5-2-1","tier":"t5-2","no":"2.1","title":"The apparatus","intro":false,"line_start":49,"line_end":58,"paras":4,"size":510,"first":{"text":"Two traditions have tried to say what play is.","line":51,"cut":false}},{"id":"t5-2-2","tier":"t5-2","no":"2.2","title":"What delegation delivers, and what it dissolves","intro":false,"line_start":59,"line_end":68,"paras":4,"size":369,"first":{"text":"With the apparatus in hand, delegation can be defined without leaving Suits's vocabulary.","line":61,"cut":false}},{"id":"t5-2-3","tier":"t5-2","no":"2.3","title":"Two clarifications","intro":false,"line_start":69,"line_end":74,"paras":2,"size":410,"first":{"text":"*Professionals.* An objection arises at the definitional stage and, if sound, would wreck Section 5 before it begins: professional players play for money, and an activity pursued for money is not pursued for its own sake, so on this definition professionals ar","line":71,"cut":true}},{"id":"t5-3-1","tier":"t5-3","no":"3.1","title":"Statement and scope","intro":false,"line_start":77,"line_end":88,"paras":5,"size":496,"first":{"text":"The theorem can now be stated.","line":79,"cut":false}},{"id":"t5-3-2","tier":"t5-3","no":"3.2","title":"The criterion: undertaking, not provenance","intro":false,"line_start":89,"line_end":96,"paras":3,"size":473,"first":{"text":"What separates the player from the agent that merely realises p? A tempting first answer is the causal provenance of the goal: the machine's objective was written by its designers, whereas the player's is his own.","line":91,"cut":false}},{"id":"t5-3-3","tier":"t5-3","no":"3.3","title":"Independence from the status of AI","intro":false,"line_start":97,"line_end":106,"paras":4,"size":439,"first":{"text":"Behavioural indiscernibility invites a behaviourist reply, and the strongest version belongs to Danaher (2020): if an entity is behaviourally equivalent to one that merits a given treatment, it merits that treatment — no inspection of inner lives required.","line":99,"cut":false}},{"id":"t5-3-4","tier":"t5-3","no":"3.4","title":"Two roots and two world-images","intro":false,"line_start":107,"line_end":120,"paras":6,"size":884,"first":{"text":"The theorem, so defended, has a deeper basis, and stating it pays two debts at once: it connects this paper to the series it closes, and it gives Kawatani (2012) the theoretical seat promised in Section 1.","line":109,"cut":false}},{"id":"t5-3-5","tier":"t5-3","no":"3.5","title":"A first-person corollary","intro":false,"line_start":121,"line_end":126,"paras":2,"size":264,"first":{"text":"The theorem has an operational form that any reader can apply without instruments, and it is worth stating because it translates the lusory attitude into the vocabulary of delegation.","line":123,"cut":false}},{"id":"t5-4-1","tier":"t5-4","no":"4.1","title":"The vision of collapse and its heirs","intro":false,"line_start":129,"line_end":140,"paras":5,"size":923,"first":{"text":"The strongest objection to everything so far is Suits's own.","line":131,"cut":false}},{"id":"t5-4-2","tier":"t5-4","no":"4.2","title":"Diagnosis and the third response","intro":false,"line_start":141,"line_end":148,"paras":3,"size":535,"first":{"text":"The dropping-out mechanism has a hidden premise, and the premise is false.","line":143,"cut":false}},{"id":"t5-4-3","tier":"t5-4","no":"4.3","title":"Dignity apparatuses","intro":false,"line_start":149,"line_end":164,"paras":7,"size":560,"first":{"text":"A dignity apparatus is a cultural form that makes autotelic activity socially recognisable as worth taking seriously — that blocks the default downgrade of such activity to \"mere\" play.","line":151,"cut":false}},{"id":"t5-4-4","tier":"t5-4","no":"4.4","title":"Price and dignity: what the apparatus protects","intro":false,"line_start":165,"line_end":182,"paras":8,"size":1560,"first":{"text":"It remains to say, in one vocabulary, what the apparatus protects.","line":167,"cut":false}},{"id":"t5-4-5","tier":"t5-4","no":"4.5","title":"Two further pillars","intro":false,"line_start":183,"line_end":190,"paras":3,"size":439,"first":{"text":"Two further observations bear on the vision's empirical weight; neither is a proof, and the first is offered explicitly as an analogue rather than a counterexample.","line":185,"cut":false}},{"id":"t5-4-6","tier":"t5-4","no":"4.6","title":"What this account does not license","intro":false,"line_start":191,"line_end":194,"paras":1,"size":260,"first":{"text":"Two prohibitions bound the account, and they belong to it rather than qualify it.","line":193,"cut":false}},{"id":"t5-5-1","tier":"t5-5","no":"5.1","title":"The case","intro":false,"line_start":197,"line_end":202,"paras":2,"size":339,"first":{"text":"Section 1 introduced the match; here is the case in full.","line":199,"cut":false}},{"id":"t5-5-2","tier":"t5-5","no":"5.2","title":"The assay: three axes","intro":false,"line_start":203,"line_end":208,"paras":2,"size":355,"first":{"text":"What exactly was lost that day, and what was not? The event decomposes along three axes, and the decomposition is an assay executed at the scale of an entire field.","line":205,"cut":false}},{"id":"t5-5-3","tier":"t5-5","no":"5.3","title":"What survived, and the record","intro":false,"line_start":209,"line_end":216,"paras":3,"size":374,"first":{"text":"Suits distinguishes, within the attitude of contest, the parties' agreement to make a contest of it at all from each party's desire that its own side prevail (Suits [1978] 2014, ch. 7).","line":211,"cut":false}},{"id":"t5-5-4","tier":"t5-5","no":"5.4","title":"Conclusion","intro":false,"line_start":217,"line_end":224,"paras":2,"size":217,"first":{"text":"The case yields a model, and the model has three parts.","line":219,"cut":false}},{"id":"t5-postscript","tier":"t5-postscript","no":"","title":"Postscript","intro":false,"line_start":225,"line_end":230,"paras":2,"size":276,"first":{"text":"In the spring of 1951, Ludwig Wittgenstein was dying of cancer and knew it (Malcolm 1984).","line":227,"cut":false}}],"refs":[{"from":"t5-1","to":"t5-5-1","to_no":"5","line":25,"text":"public went on watching, and the game's public stature in Japan did not collapse — by several ordinary measures it flourished (the evidence, and the causal hedges it requires, are given in Section 5).","cut":true,"dir":"fwd"},{"from":"t5-1","to":"t5-5-1","to_no":"5","line":25,"text":"The units are deliberately asymmetric — one player's exit against one institution's absorption — and the Go world itself did not follow its champion out the door: professional play continued, and by one population-level measure improved (Section 5 returns to the evidence).","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-4-4","to_no":"4.4","line":27,"text":"Play is chosen here not as the paper's scope but as its purest specimen: the activity in which the participant-relative, non-substitutable dimension of participation is least obscured by additional ends (Section 4.4 says why its recognition matters).","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-2-1","to_no":"2","line":29,"text":"That discourse conceded more than it needed to: it treated machine victory in games as machine entry into play, a misrecognition for which Sections 2 and 3 supply the diagnosis, using a concept that is Suits's own.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-3-1","to_no":"3","line":29,"text":"That discourse conceded more than it needed to: it treated machine victory in games as machine entry into play, a misrecognition for which Sections 2 and 3 supply the diagnosis, using a concept that is Suits's own.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-4-1","to_no":"4","line":29,"text":"Beneath both waves, Section 4 will argue, lies a third and older layer, named by Suits before either wave existed: the suspicion that most people cannot regard a life without necessity as worth living — so that the deepest resistance to AI may be a defence not of employment but of meaning.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-3-1","to_no":"3","line":31,"text":"I return to this exchange in Section 3, where the theorem defended here proves independent of its outcome.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-4-1","to_no":"4","line":33,"text":"The deep engagements come later: O'Brien, and Knell and Rüther, in Section 4.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-3-1","to_no":"3","line":35,"text":"The contribution is accordingly threefold: an agent-relative theorem of non-transferability (Section 3); a condition analysis of its acceptance (Section 4); a completed historical case (Section 5).","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-4-1","to_no":"4","line":35,"text":"The contribution is accordingly threefold: an agent-relative theorem of non-transferability (Section 3); a condition analysis of its acceptance (Section 4); a completed historical case (Section 5).","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-5-1","to_no":"5","line":35,"text":"The contribution is accordingly threefold: an agent-relative theorem of non-transferability (Section 3); a condition analysis of its acceptance (Section 4); a completed historical case (Section 5).","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-4-4","to_no":"4.4","line":35,"text":"Within the condition analysis, Section 4.4 proposes that AI's production of functional equivalents makes n
