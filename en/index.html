ewly visible the distinction between exchangeable outcomes and non-equivalent participation.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-2-1","to_no":"2","line":45,"text":"Section 2 introduces the Suitsian apparatus and separates two things that the current debates run together: the achieved state of an activity and the value of participating in it.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-3-1","to_no":"3","line":45,"text":"Section 3 states the non-transferability theorem, specifies the criterion it runs on, and shows its independence from every live question about the status of AI, including the question of whether machines might one day play.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-4-1","to_no":"4","line":45,"text":"Section 4 turns from the theorem to its reception: it takes Suits's own vision of collapse as the","cut":true,"dir":"fwd"},{"from":"t5-1","to":"t5-4-4","to_no":"4.4","line":45,"text":"engages the critics of the ludic future, develops the condition analysis — dignity apparatuses — that an affirmative answer to the title question requires, and relates the apparatus (Section 4.4) to the distinction between price and dignity.","cut":true,"dir":"fwd"},{"from":"t5-1","to":"t5-5-1","to_no":"5","line":45,"text":"Section 5 presents professional shogi as a completed historical case: a domain that staged its own public encounter with machine superiority and kept its play.","cut":false,"dir":"fwd"},{"from":"t5-2-1","to":"t5-3-1","to_no":"3","line":55,"text":"The importance of that relocation for an argument conducted in the age of artificial agents will become clear in Section 3.","cut":false,"dir":"fwd"},{"from":"t5-2-3","to":"t5-5-1","to_no":"5","line":71,"text":"An objection arises at the definitional stage and, if sound, would wreck Section 5 before it begins: professional players play for money, and an activity pursued for money is not pursued for its own sake, so on this definition professionals are not playing at all.","cut":false,"dir":"fwd"},{"from":"t5-2-3","to":"t5-5-1","to_no":"5","line":71,"text":"The professional is playing, in the full Suitsian sense, and Section 5 may proceed.","cut":false,"dir":"fwd"},{"from":"t5-3-1","to":"t5-2-1","to_no":"2","line":83,"text":"The sentence that seems to say otherwise — \"the machine could play it for me\" — owes its air of sense, as promised, to a slide between the two objects separated in Section 2.","cut":false,"dir":"back"},{"from":"t5-3-1","to":"t5-1","to_no":"1","line":87,"text":"What is new is that this grammatical fact has not been treated as an independent value variable in the current debates over achievement, meaning, and substitution — and Section 1 gave the historical reason: a property that bears no load gets no name.","cut":false,"dir":"back"},{"from":"t5-3-3","to":"t5-1","to_no":"1","line":103,"text":"The same bracket closes the achievement dispute flagged in Section 1: grant Kieval (2024) entirely — let systems like AlphaGo satisfy the conditions of achievement — and those achievements are the system's; nothing in anyone else's ledger changes.","cut":false,"dir":"back"},{"from":"t5-3-4","to":"t5-1","to_no":"1","line":109,"text":"The theorem, so defended, has a deeper basis, and stating it pays two debts at once: it connects this paper to the series it closes, and it gives Kawatani (2012) the theoretical seat promised in Section 1.","cut":false,"dir":"back"},{"from":"t5-3-4","to":"t5-5-1","to_no":"5","line":111,"text":"has quietly gone missing — an explanation can be owned after the fact, polished and presented as one's path — and it is summoned verification, the sustained follow-up questioning that Section 5 will show institutionalised in shogi, that peels an owned explanation off an unwalked","cut":true,"dir":"fwd"},{"from":"t5-3-4","to":"t5-1","to_no":"1","line":115,"text":"That is why the concession of Section 1 was structural rather than diplomatic: the achievement gap is real, and real exactly there; participation lives in the second image, where the gap's variables do not apply.","cut":false,"dir":"back"},{"from":"t5-3-4","to":"t5-5-1","to_no":"5","line":115,"text":"Their anchor case, finally, is Lee Sedol, and a diagnosis anchored in one exit invites a contrasting case; Section 5 supplies it.","cut":false,"dir":"fwd"},{"from":"t5-4-1","to":"t5-1","to_no":"1","line":131,"text":"Section 1 promised a third layer beneath the two waves of public reaction to AI; this is it.","cut":false,"dir":"back"},{"from":"t5-4-1","to":"t5-1","to_no":"1","line":133,"text":"Section 1 called AI a forced mass distribution of exactly this recognition.","cut":false,"dir":"back"},{"from":"t5-4-1","to":"t5-3-1","to_no":"3","line":135,"text":"Fourth, his case leans at one point on machines having no goods of their own, and he concedes in a footnote that sentience would change the calculus (O'Brien 2025, fn. 23); the locks of Section 3 hold after that concession exactly as before it.","cut":false,"dir":"back"},{"from":"t5-4-2","to":"t5-5-1","to_no":"5","line":147,"text":"Yonenaga, whom Section 5 treats at length, challenged the machine in earnest, lost in public, and accepted what the loss did and did not touch.","cut":false,"dir":"fwd"},{"from":"t5-4-3","to":"t5-4-2","to_no":"4.2","line":153,"text":"Its third term also names what Section 4.2 observed: delight, in the triad, is lucid absorption — being inside the activity with open eyes.","cut":false,"dir":"back"},{"from":"t5-4-3","to":"t5-5-1","to_no":"5","line":157,"text":"Section 5 examines this candidate mechanism under pressure.","cut":false,"dir":"fwd"},{"from":"t5-4-3","to":"t5-5-1","to_no":"5","line":159,"text":"Section 5 returns to it.","cut":false,"dir":"fwd"},{"from":"t5-4-4","to":"t5-4-3","to_no":"4.3","line":167,"text":"For the present argument, I use the ideal-bearing aspect of Shibusawa's shumi (Section 4.3) as an analogue of undertaking, rather than treating the term as mere taste.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-3-1","to_no":"3","line":169,"text":"The theorem of Section 3 is a theorem about (iii); the abstract's compression of it into one sentence places the state of affairs under (i) and the fact of participation under (iii).","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-3-2","to_no":"3.2","line":171,"text":"The further normative claim is that, once an agent's undertaking is treated as reason-bearing — the criterion of Section 3.2 — functionally equivalent outcomes cannot exhaust what is owed in recognising that agent.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-3-3","to_no":"3.3","line":171,"text":"Neither asks what the substituted agent is; the status of AI stays where Section 3.3 left it.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-4-3","to_no":"4.3","line":175,"text":"The apparatus institutionalises practices of recognition without displacing appraisal: Section 4.3 itself contains appraisal — honour that scales with the stake, a brake against hollow play.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-4-6","to_no":"4.6","line":175,"text":"It also fixes what Section 4.6 prohibits.","cut":false,"dir":"fwd"},{"from":"t5-4-4","to":"t5-3-1","to_no":"3.1","line":179,"text":"The formal theorem in Section 3.1 concerns games.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-3-5","to_no":"3.5","line":179,"text":"Section 3.5 states a first-person corollary that generalises its structure to activities in which the agent's end includes the agent's own performance.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-2-3","to_no":"2.3","line":179,"text":"Professional play may still carry income and institutional duties, as Section 2.3 established; play is simply the activity in which participation itself is least obscured by additional ends.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-4-6","to_no":"4.6","line":179,"text":"Nothing here places play above other activities; and the corollary's conceptual scope is broader than the practical scope of the application proposed here, which remains limited by the boundary conditions stated in Section 4.6.","cut":false,"dir":"fwd"},{"from":"t5-4-4","to":"t5-1","to_no":"1","line":181,"text":"The two waves described in Section 1 may be read as one trace of that salience.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-5-1","to_no":"5","line":181,"text":"Section 5 stands to both as follows: the historical case demonstrates compatibility and offers a candidate mechanism; it does not establish the apparatus's necessity, sufficiency, or causal effect.","cut":false,"dir":"fwd"},{"from":"t5-4-5","to":"t5-5-1","to_no":"5","line":189,"text":"Shibusawa attempted such an extension in 1916; Section 5 examines a case compatible with its institutional realisation under maximal pressure.","cut":false,"dir":"fwd"},{"from":"t5-4-6","to":"t5-4-4","to_no":"4.4","line":193,"text":"To use a performance score as a measure of a person's standing — or to score the authenticity of undertaking, delight, or participation — is to answer a recognition question with an appraisal metric (Section 4.4).","cut":false,"dir":"back"},{"from":"t5-4-6","to":"t5-4-5","to_no":"4.5","line":193,"text":"— measures delight, audits undertaking — it has rebuilt, inside this paper's vocabulary, exactly the instrumental capture the vocabulary was built to diagnose; the diagnostic questions of Section 4.5 are first-person instruments, and turned outward as metrics they self-destruct.","cut":true,"dir":"back"},{"from":"t5-4-6","to":"t5-5-1","to_no":"5","line":193,"text":"What Section 5 shows is a culture in which the proposed conditions and continued play coexisted under maximal pressure.","cut":false,"dir":"fwd"},{"from":"t5-5-1","to":"t5-1","to_no":"1","line":199,"text":"Section 1 introduced the match; here is the case in full.","cut":false,"dir":"back"},{"from":"t5-5-1","to":"t5-1","to_no":"1","line":199,"text":"Within a month, as Section 1 recorded, the loss was answered in print, by the loser, under his own name (Yonenaga 2012).","cut":false,"dir":"back"},{"from":"t5-5-2","to":"t5-3-1","to_no":"3","line":205,"text":"On the play axis there was nothing to lose, because no contest of play occurred there: the machine stood to the game as Section 3's quasi-game player — realising the goal state, unmatched on the board, and not treated,","cut":true,"dir":"back"},{"from":"t5-5-3","to":"t5-1","to_no":"1","line":213,"text":"The wider record must be stated with the hedges Section 1 promised.","cut":false,"dir":"back"},{"from":"t5-postscript","to":"t5-4-1","to_no":"4","line":227,"text":"But the scene can be read, and I read it so: as work from which everything instrumental had drained away and which continued because the activity itself remained — the third response of Section 4, lived to the end of a life.","cut":false,"dir":"back"},{"from":"t5-postscript","to":"t5-3-1","to_no":"3","line":227,"text":"That too can be read — not as a verdict on achievements, for there was no one left to outrank and nothing left to win, but as the view from inside delight: the completion report of what Section 3 could only leave open, a life crystallised as one's own.","cut":false,"dir":"back"}],"parts":[{"id":"t5-abstract-p1","unit":"t5-abstract","k":1,"lines":[13,13],"label":"Abstract","does":"summary","says":"From Suits’s analysis of games, the paper separates an achieved state from participation in the activity that produces it. Even if another agent realizes the goal state in my place, it does not thereby become true that I pursued it with the constraints accepted as reasons. What remains is the question of under what cultural conditions people can continue activities they know machines can perform better.","quote":{"paper":"T5","text":"AI can deliver the state of affairs; it cannot deliver the fact of participation.","line":13,"anchor":"t5-abstract","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p1","unit":"t5-1","k":1,"lines":[23,25],"label":"Two responses","does":"example","says":"To the same event (machine superiority), in Go one player withdrew, and in shogi the institution absorbed the loss and continued. The units compared are deliberately asymmetric; the contrast is not between the fates of two cultures but between two responses that the same event made available.","quote":{"paper":"T5","text":"The contrast this paper needs is therefore not between the fates of two cultures but between two responses that the same event made available.","line":25,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p2","unit":"t5-1","k":2,"lines":[27,27],"label":"What is to be named","does":"claim","says":"The difference lies in the nature of play, not in the nature of machines, so the central claim is not a claim about AI. Play is chosen not as a scope but as the purest specimen. The value of participating in a game is agent-relative and does not transfer.","quote":{"paper":"T5","text":"the central claim of the paper is not a claim about AI","line":27,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p3","unit":"t5-1","k":3,"lines":[29,29],"label":"Two waves, an older layer","does":"positioning","says":"The first wave (2016–18) mistook machines winning at games for machines entering play. In the second wave the question returned from the opposite side: if machines can do the work, what remains is play. Beneath them lies an older layer, named by Suits: the suspicion that most people cannot regard a life without necessity as worth living.","quote":{"paper":"T5","text":"the deepest resistance to AI may be a defence not of employment but of meaning","line":29,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p4","unit":"t5-1","k":4,"lines":[31,33],"label":"Two lines of literature","does":"positioning","says":"The literature of the second wave has consolidated along two lines: one on whether AI undermines achievement, and one on whether games can carry the meaning that work has carried.","quote":{"paper":"T5","text":"Within the second wave, the literature has consolidated along two lines.","line":31,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p5","unit":"t5-1","k":5,"lines":[35,35],"label":"Position and contribution","does":"frame","says":"Granting that achievement is undermined by AI, the paper argues that the value of participation was never on that axis. It does not claim that games can replace work. The contributions are three: a theorem, an analysis of the conditions of its acceptance, and a completed historical case.","quote":{"paper":"T5","text":"an agent-relative theorem of non-transferability (Section 3); a condition analysis of its acceptance (Section 4); a completed historical case (Section 5)","line":35,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p6","unit":"t5-1","k":6,"lines":[37,37],"label":"A broken lineage","does":"positioning","says":"The negative side of the question Suits raised was stated most sharply by Kawatani (2012). What remains unwritten is the affirmative side: an account of the conditions under which one can see the game as a game and still keep playing in earnest. The paper tries to supply it.","quote":{"paper":"T5","text":"an account of the conditions under which one can see the game as a game and keep playing — awake, and in earnest","line":37,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p7","unit":"t5-1","k":7,"lines":[39,39],"label":"Visible under load","does":"grounds","says":"The theorem has gone unstated because it had no work to do. While there was no one to whom intellectual participation could be delegated, its non-transferability was a wall that nothing pressed against. A property becomes visible when it begins to bear load.","quote":{"paper":"T5","text":"A property becomes visible when it begins to bear load.","line":39,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p8","unit":"t5-1","k":8,"lines":[41,41],"label":"Suits’s scenario","does":"positioning","says":"Suits did not state the theorem, but he ran the scenario of a utopia in which all instrumental activity has been mechanized. The paper does not apply Suits to AI; it sees AI as having caught up with Suits.","quote":{"paper":"T5","text":"It observes that artificial intelligence has caught up with Suits","line":41,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p9","unit":"t5-1","k":9,"lines":[43,43],"label":"A mass distribution","does":"claim","says":"AI distributes to everyone at once the recognition that one’s own activity is a game, because it shows that the result does not need that person. Whether the response of continuing is possible, the paper argues, depends on specifiable conditions in how a community treats those who play.","quote":{"paper":"T5","text":"it depends on specifiable conditions in how a community treats those who play","line":43,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p10","unit":"t5-1","k":10,"lines":[45,45],"label":"Structure of the paper","does":"frame","says":"Section 2 separates achieved state and participation; Section 3 states the theorem and the criterion; Section 4 analyzes the conditions of acceptance (dignity apparatuses); Section 5 presents shogi as a completed historical case.","quote":{"paper":"T5","text":"The paper proceeds as follows.","line":45,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-1-p1","unit":"t5-2-1","k":1,"lines":[51,53],"label":"Suits’s four elements","does":"definition","says":"The paper relies on Suits’s structural definition. A game has four elements: a goal state describable independently of the game, the means the rules permit, constitutive rules that prohibit more efficient means, and the attitude of accepting those rules because they make the activity possible.","quote":{"paper":"T5","text":"to play a game is voluntarily to attempt to overcome unnecessary obstacles","line":53,"anchor":"t5-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-1-p2","unit":"t5-2-1","k":2,"lines":[55,55],"label":"A structure of reasons","does":"claim","says":"The fourth element relocates the autotelic character of play from an inner quality to a structure of reasons: the prohibition of the efficient route works for the agent not as a hindrance but as a reason. Nothing here requires inspecting anyone’s inner life.","quote":{"paper":"T5","text":"Nothing in this requires inspecting anyone's inner life; it is a matter of what stands as a reason for what.","line":55,"anchor":"t5-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-1-p3","unit":"t5-2-1","k":3,"lines":[57,57],"label":"A note on usage","does":"limit","says":"“Play” in the broad sense is used as a convention, and no definition of play in general is given. The apparatus of games is used as description, and the argument proceeds only over that limited kind of activity.","quote":{"paper":"T5","text":"Nothing below requires that all play be games, that all valuable activity be play","line":57,"anchor":"t5-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-2-p1","unit":"t5-2-2","k":1,"lines":[61,61],"label":"Delegation defined","does":"definition","says":"Instrumental delegation is assigning the realization of a describable state to another agent in order to reduce one’s own expenditure. Delegation in order to teach, to share fairly, or to place a matter with those it properly concerns is not the subject of this paper.","quote":{"paper":"T5","text":"is not this paper's subject","line":61,"anchor":"t5-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-2-p2","unit":"t5-2-2","k":2,"lines":[63,63],"label":"Two opposite operations","does":"claim","says":"To play a game is to prohibit oneself the most efficient means and to undertake that prohibition as a reason. Delegation and games are operations that work in opposite directions on the same variable.","quote":{"paper":"T5","text":"Delegation minimises precisely the inefficiency that play institutes.","line":63,"anchor":"t5-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-2-p3","unit":"t5-2-2","k":3,"lines":[65,65],"label":"Delivered and dissolved","does":"claim","says":"When the realization of the goal state is delegated whole, the achieved state arrives and the game disappears. A winning position can be handed over; having played cannot, because it is a feature not of the position but of the pursuit.","quote":{"paper":"T5","text":"it delivers the achieved state while dissolving the game","line":65,"anchor":"t5-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-2-p4","unit":"t5-2-2","k":4,"lines":[67,67],"label":"Two objects of desire","does":"definition","says":"Every game has two objects of desire. The achieved state can be delivered by anyone capable. Participation is not delivered; it is enacted.","quote":{"paper":"T5","text":"The second is not delivered at all, by anyone, ever; it is enacted.","line":67,"anchor":"t5-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-3-p1","unit":"t5-2-3","k":1,"lines":[71,71],"label":"Do professionals play?","does":"grounds","says":"It answers the objection that a professional plays for money and so is not playing. Prize money and a livelihood are compatible with the attitude of the game as long as they are ends attainable only through playing. The professional is playing in Suits’s sense.","quote":{"paper":"T5","text":"The professional is playing, in the full Suitsian sense","line":71,"anchor":"t5-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-3-p2","unit":"t5-2-3","k":2,"lines":[73,73],"label":"Two kinds of obstacle","does":"definition","says":"There are obstacles nobody chose, and chosen obstacles that constitute the activity. Generative AI is removing the former. What is new is not a loss of skill but the need to determine, obstacle by obstacle, which kind one is facing.","quote":{"paper":"T5","text":"for the first time, one must determine, obstacle by obstacle, which kind one is facing","line":73,"anchor":"t5-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-1-p1","unit":"t5-3-1","k":1,"lines":[79,79],"label":"The theorem","does":"claim","says":"If an agent other than A realizes the goal state p, p obtains. But the fact that A pursued p with the constraints accepted as reasons does not thereby obtain. Preparation, analysis, record-keeping, the opponent’s seat, even collaboration in mid-game can be delegated; participation itself has no substitute.","quote":{"paper":"T5","text":"Participation, in short, does not transfer.","line":79,"anchor":"t5-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-1-p2","unit":"t5-3-1","k":2,"lines":[81,81],"label":"The term agent-relative","does":"definition","says":"The term agent-relative is taken from Nagel’s usage (the general form of a reason includes an essential reference to the person who has it) and used derivatively for the non-substitutability the theorem states. Replace A with B and it is a different fact.","quote":{"paper":"T5","text":"derivatively for the theorem's non-substitutability","line":81,"anchor":"t5-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-1-p3","unit":"t5-3-1","k":3,"lines":[83,83],"label":"Three readings","does":"grounds","says":"“The machine could play it for me” can be read as the machine could bring about p (delegation), or as the machine could win for me (a proxy player). Read as the machine could play in such a way that I will have played, it describes nothing.","quote":{"paper":"T5","text":"There is no third task, between the first two, for a better machine to perform.","line":83,"anchor":"t5-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-1-p4","unit":"t5-3-1","k":4,"lines":[85,85],"label":"No mention of machines","does":"limit","says":"The theorem never mentions machines. What AI has changed is not the theorem but its address: the offer of delegation now arrives at every desk, very cheaply.","quote":{"paper":"T5","text":"What AI has changed is not the theorem but its address","line":85,"anchor":"t5-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-1-p5","unit":"t5-3-1","k":5,"lines":[87,87],"label":"Reply on obviousness","does":"grounds","says":"It answers the objection that the theorem is unsurprising. What is new is that this grammatical fact has not been treated as an independent variable of value in the current debate. Being obvious and being theoretically dispensable are not the same thing.","quote":{"paper":"T5","text":"Being obvious and being theoretically dispensable are not the same thing.","line":87,"anchor":"t5-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-2-p1","unit":"t5-3-2","k":1,"lines":[91,91],"label":"Not by provenance","does":"grounds","says":"The provenance of the goal does not separate a player from an agent that merely realizes a goal. A professional player too receives the winning conditions and the rules from outside.","quote":{"paper":"T5","text":"If external provenance disqualified, no one would ever have played anything.","line":91,"anchor":"t5-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-2-p2","unit":"t5-3-2","k":2,"lines":[93,93],"label":"Criterion: undertaking","does":"definition","says":"The dividing line is whether the agent undertakes the goal and constraints as the agent’s own reasons, and whether the practice treats the agent as a participant who has so undertaken them. The criterion is a fact about reasons and treatment and requires no inspection of inner life.","quote":{"paper":"T5","text":"It is, throughout, a fact about reasons and treatment.","line":93,"anchor":"t5-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-2-p3","unit":"t5-3-2","k":3,"lines":[95,95],"label":"The quasi-game player","does":"positioning","says":"Suits’s quasi-game player achieves the goal and moves within the rules but does not undertake them as its own reasons. The contribution is the observation that this category has been realized at scale. At the level of moves, it cannot be told apart from a player.","quote":{"paper":"T5","text":"Nothing on the board distinguishes them; everything in the structure of reasons and treatment does.","line":95,"anchor":"t5-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-3-p1","unit":"t5-3-3","k":1,"lines":[99,101],"label":"Separating the questions","does":"grounds","says":"Behaviorism, which holds that the same behavior deserves the same treatment, answers the question of how to treat the other party. This paper’s question is different: whether another’s playing can amount to my having played.","quote":{"paper":"T5","text":"This paper's question is whether participation transfers","line":101,"anchor":"t5-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-3-p2","unit":"t5-3-3","k":2,"lines":[103,103],"label":"The strongest case","does":"grounds","says":"Even if a future system is a genuine player with full moral status, its play is its own. Not even the strongest player can play my game in my place. The theorem does not depend on the outcome of the dispute over status.","quote":{"paper":"T5","text":"even if AI has achievements and play of its own, that does not make my playing done","line":103,"anchor":"t5-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-3-p3","unit":"t5-3-3","k":3,"lines":[105,105],"label":"Machine against machine","does":"implication","says":"It does not deny shogi between machines. The human seat is kept without belittling the machines’ game, because that seat was never held by superior ability in the first place.","quote":{"paper":"T5","text":"the seat was never held by superior ability in the first place","line":105,"anchor":"t5-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-4-p1","unit":"t5-3-4","k":1,"lines":[109,111],"label":"Two roots","does":"claim","says":"What remains on the human side has two independent roots: a normative root (the answering seat) and a grammatical root (the playing seat). An executive who signs a decision answers but is not playing. Someone solving a crossword alone is playing but answers to no one.","quote":{"paper":"T5","text":"Each seat can be occupied without the other.","line":111,"anchor":"t5-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-4-p2","unit":"t5-3-4","k":2,"lines":[113,113],"label":"Two images of the world","does":"grounds","says":"Kawatani’s two images are the basis. In the first image players stand side by side in a space of comparison; in the second, my life is the only stage. Being overtaken is true in the first image; not being deprived of participation is true in the second. The first image can be conceded to AI entirely.","quote":{"paper":"T5","text":"the entire first image can be conceded to AI without remainder","line":113,"anchor":"t5-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-4-p3","unit":"t5-3-4","k":3,"lines":[115,115],"label":"Achievement: first image","does":"positioning","says":"The four conditions of achievement are all conditions inside the first image. The achievement gap is real, and real there. Participation lies in the second image, where the variable of the gap does not apply.","quote":{"paper":"T5","text":"the achievement gap is real, and real exactly there","line":115,"anchor":"t5-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-4-p4","unit":"t5-3-4","k":4,"lines":[117,117],"label":"Two locks","does":"limit","says":"There are two locks. The first (current systems lack a death that comes only once) belongs only to the limiting level at which life itself is seen as a game. The second lock is the theorem itself. In ordinary games only the second lock is engaged, and the opponent’s seat is open to machines.","quote":{"paper":"T5","text":"the paper claims at each level only what that level's lock secures","line":117,"anchor":"t5-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-4-p5","unit":"t5-3-4","k":5,"lines":[119,119],"label":"A question left open","does":"limit","says":"What absolute victory in the second image would be is deliberately left undecided. One candidate (locating it in the way a life crystallizes as one’s own) lies beyond the scope of the paper.","quote":{"paper":"T5","text":"What absolute victory would consist in remains an open question.","line":119,"anchor":"t5-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-5-p1","unit":"t5-3-5","k":1,"lines":[123,123],"label":"A first-person question","does":"procedure","says":"It can be asked of any activity: if only the result were delivered, would I be satisfied? If yes, delegation is what delegation is for. If no, the offer of substitution is a category mistake. The question reads not the desire of the moment but the desire that constitutes the activity.","quote":{"paper":"T5","text":"The test reads the constitutive desire, not the momentary one","line":123,"anchor":"t5-3-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-5-p2","unit":"t5-3-5","k":2,"lines":[125,125],"label":"What the theorem removes","does":"implication","says":"What the theorem removes is the anxiety in which being told that an activity is substitutable sounds like a denial of the person. What cannot be transferred cannot be taken. A truth of this kind, however, does not automatically console.","quote":{"paper":"T5","text":"what cannot be transferred cannot be taken","line":125,"anchor":"t5-3-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-1-p1","unit":"t5-4-1","k":1,"lines":[131,131],"label":"The vision of collapse","does":"frame","says":"The strongest objection is Suits’s own: most people would not see a life spent on games as worth living, and would fabricate necessity. The objection does not touch the theorem; it says that the theorem’s consolation cannot be received.","quote":{"paper":"T5","text":"it does not touch the theorem","line":131,"anchor":"t5-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-1-p2","unit":"t5-4-1","k":2,"lines":[133,133],"label":"Kawatani’s mechanism","does":"grounds","says":"Kawatani gave this vision a mechanism: playing absorbedly and lucidly recognizing the game as a game are close to incompatible. If the mechanism is right, the vision is not a mood but a forecast.","quote":{"paper":"T5","text":"If the mechanism is right, the vision is not a mood but a forecast.","line":133,"anchor":"t5-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-1-p3","unit":"t5-4-1","k":3,"lines":[135,135],"label":"From the side of despair","does":"positioning","says":"It takes as correct O’Brien’s sentence that once work becomes a game it is impossible not to play, and parts from him on four points. One of them: to pass off a chosen constraint as necessity is pretense, but to undertake it knowing it was chosen is to play.","quote":{"paper":"T5","text":"The difference lies not in the moves but in the lucidity of the undertaking.","line":135,"anchor":"t5-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-1-p4","unit":"t5-4-1","k":4,"lines":[137,137],"label":"A missing mechanism","does":"positioning","says":"Danaher’s utopia of games specifies no mechanism that holds the lucid player at the board. The dignity apparatus names what that utopia left institutionally unspecified.","quote":{"paper":"T5","text":"the dignity apparatus names what Danaher's utopia leaves institutionally unspecified","line":137,"anchor":"t5-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-1-p5","unit":"t5-4-1","k":5,"lines":[139,139],"label":"Not a substitution claim","does":"limit","says":"The criticism that a life of games is an insufficient substitute for meaning is aimed at the claim that games can replace work as the source of meaning. The paper does not make that claim.","quote":{"paper":"T5","text":"this paper does not hold the substitution thesis","line":139,"anchor":"t5-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-2-p1","unit":"t5-4-2","k":1,"lines":[143,143],"label":"The hidden premise","does":"claim","says":"The premise of the dropping-out mechanism is false. Being awake and being absorbed contradict each other only if recognizing the game as a game means recognizing it as trivial. The impossibility is not structural but conditional, and may reflect a deficit of institutions.","quote":{"paper":"T5","text":"Lucid absorption is not a paradox.","line":143,"anchor":"t5-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-2-p2","unit":"t5-4-2","k":2,"lines":[145,145],"label":"The third response","does":"positioning","says":"Besides fabricating necessity, or admitting the truth and withering, there is a third path: to understand the truth correctly and accept it. Schlick supplies the claim that play is not meaning’s opposite but its address.","quote":{"paper":"T5","text":"Schlick supplies the established claim that play is not meaning's opposite but its address","line":145,"anchor":"t5-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-2-p3","unit":"t5-4-2","k":3,"lines":[147,147],"label":"Undertaking as condition","does":"claim","says":"The condition under which the third response actually operates appears to be undertaking. Those who have made the problem their own and passed through it as pain accept the conclusion with something like naturalness. The examples given are not data but specimens; they show only that the response exists.","quote":{"paper":"T5","text":"These are not data; they are specimens","line":147,"anchor":"t5-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-3-p1","unit":"t5-4-3","k":1,"lines":[151,151],"label":"The dignity apparatus","does":"definition","says":"A dignity apparatus is a cultural form that makes autotelic activity socially recognizable as worth taking seriously. It stops the demotion to “mere” play. Four candidate mechanisms are listed.","quote":{"paper":"T5","text":"A dignity apparatus is a cultural form that makes autotelic activity socially recognisable as worth taking seriously","line":151,"anchor":"t5-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-3-p2","unit":"t5-4-3","k":2,"lines":[153,155],"label":"Ordering and bridge","does":"example","says":"The first is an ordering of value (the Analects: knowing, loving, delighting). The second is a bridge into working life: in 1916 Shibusawa Eiichi carried this ordering into the world of work.","quote":{"paper":"T5","text":"the ordering is carried across the boundary into the world of work by someone whose status in that world is beyond question","line":155,"anchor":"t5-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-3-p3","unit":"t5-4-3","k":3,"lines":[157,159],"label":"Role and practice form","does":"example","says":"The third is a role with the highest respect (the professional player who has staked a life on a game). The fourth is a practice form: the kansōsen attaches an answering seat directly to the playing seat.","quote":{"paper":"T5","text":"attaches an answering seat directly to the playing seat","line":159,"anchor":"t5-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-3-p4","unit":"t5-4-3","k":4,"lines":[161,161],"label":"Where shame can work","does":"implication","says":"Shame works only where there is face to lose. The order of design is not to strengthen punishment but to give, first, something worth losing. Failure may cost face, but the recognition floor is not cancelled.","quote":{"paper":"T5","text":"not stronger punishment, but the prior issuance of something worth losing","line":161,"anchor":"t5-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-3-p5","unit":"t5-4-3","k":5,"lines":[163,163],"label":"Not a refutation","does":"limit","says":"None of this refutes Suits’s scenario. The East Asian material shows concretely the forms of social recognition that the scenario lacks.","quote":{"paper":"T5","text":"None of this refutes Suits's scenario, and none of it is offered as refutation.","line":163,"anchor":"t5-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p1","unit":"t5-4-4","k":1,"lines":[167,167],"label":"Borrowing Kant’s terms","does":"limit","says":"What is borrowed from Kant is a single formal feature: the contrast between exchangeability and having no equivalent. It is a constructive use of vocabulary, not an interpretation of Kant’s account of what has dignity.","quote":{"paper":"T5","text":"This is a constructive use of Kant's vocabulary, not an interpretation of Kant's own account of what has dignity","line":167,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p2","unit":"t5-4-4","k":2,"lines":[169,169],"label":"The subject-swap test","does":"procedure","says":"Replace the subject of the sentence with another agent and ask whether the same fact remains. The resulting state can be realized by another agent, and authority can be reallocated. The fact of having participated becomes a different fact when the subject is replaced. The test is for exposition; it is not an independent criterion.","quote":{"paper":"T5","text":"replacing A with B changes the participation fact","line":169,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p3","unit":"t5-4-4","k":3,"lines":[171,171],"label":"One more step to dignity","does":"limit","says":"The theorem does not by itself establish dignity. The normative claim that is added: if undertaking is treated as carrying reasons, functionally equivalent results cannot exhaust what is owed in recognizing that agent.","quote":{"paper":"T5","text":"It does not by itself establish dignity.","line":171,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p4","unit":"t5-4-4","k":4,"lines":[173,173],"label":"Four terms fixed","does":"definition","says":"Four terms are fixed: dignity, standing, face and appraisal respect. A dignity apparatus neither confers nor revokes Kantian dignity; it makes recognition of a participant’s standing socially operative. The distinction between appraisal and recognition follows Darwall.","quote":{"paper":"T5","text":"A dignity apparatus does not confer or revoke Kantian dignity; it makes recognition of a participant's standing socially operative.","line":173,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p5","unit":"t5-4-4","k":5,"lines":[175,175],"label":"Floor and appraisal","does":"claim","says":"The apparatus secures a recognition floor and leaves performance open to appraisal. From comparison of performance alone it does not follow that the recognition owed to a person or participant is lost. To use performance scores as a yardstick of a person’s standing is to answer a question of recognition with a yardstick of appraisal.","quote":{"paper":"T5","text":"repricing performance does not by itself determine a person's or participant's standing","line":175,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p6","unit":"t5-4-4","k":6,"lines":[177,177],"label":"Face as a medium","does":"claim","says":"Face is proposed as the medium of interaction in which recognition becomes socially legible. In the kansōsen, after the result is settled, the loser’s good moves are acknowledged. The apparatus is treated as the institutionalization of an effort toward reciprocity.","quote":{"paper":"T5","text":"a dignity apparatus operates in the third register and protects the second","line":177,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p7","unit":"t5-4-4","k":7,"lines":[179,179],"label":"Why play","does":"limit","says":"The formal theorem concerns games. The first-person corollary generalizes its structure to activities in which the agent’s end includes the agent’s own performance. Play is chosen because participation is conceptually constitutive there, not to place play above other activities. Delegability is examined task by task.","quote":{"paper":"T5","text":"Nothing here places play above other activities","line":179,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p8","unit":"t5-4-4","k":8,"lines":[181,181],"label":"Status of the two theses","does":"limit","says":"The two theses do not follow from the theorem. The visibility thesis is an interpretive claim; the apparatus thesis is a sociological hypothesis. The case demonstrates compatibility and offers a candidate mechanism. It does not establish the apparatus’s necessity, sufficiency or causal effect.","quote":{"paper":"T5","text":"it does not establish the apparatus's necessity, sufficiency, or causal effect","line":181,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-5-p1","unit":"t5-4-5","k":1,"lines":[185,187],"label":"Language-games","does":"example","says":"The spread of the recognition that talk has the structure of language-games did not make confession or testimony lose weight. Language-games are not Suits’s games, however, so the case refutes nothing. It suggests only that recognizing an activity as constituted by rules does not, by itself, make the activity light.","quote":{"paper":"T5","text":"the recognition that an activity is constituted by rules does not, by itself, make the activity light","line":187,"anchor":"t5-4-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-5-p2","unit":"t5-4-5","k":2,"lines":[189,189],"label":"Everyday acceptance","does":"example","says":"Close to home, as with crosswords, autotelic activity is widely accepted. The question is whether the practices of recognition that sustain it can be extended to the domain of work. The two questions are diagnostic instruments, not measures.","quote":{"paper":"T5","text":"they are diagnostic instruments, not measures","line":189,"anchor":"t5-4-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-6-p1","unit":"t5-4-6","k":1,"lines":[193,193],"label":"Two prohibitions","does":"limit","says":"Two prohibitions bound the account. The apparatus is an analysis of cultural conditions, not a management technique, and it permits no scoring of standing or undertaking (scoring outcomes or performances is not prohibited). And it does not prescribe play: undertaking itself cannot be commanded. A footnote sets a boundary condition on application: in phases of work where obstacles have no constitutive role (replication, safety assessment, clinical judgment), nothing in the paper counsels retaining them. The analysis applies to exploration, mastery, expression, problem-setting and refinement.","quote":{"paper":"T5","text":"nothing here prescribes play","line":193,"anchor":"t5-4-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-1-p1","unit":"t5-5-1","k":1,"lines":[199,199],"label":"The match","does":"example","says":"In 2012 Yonenaga, then president of the Japan Shogi Association, lost to a machine in a match of his own design. In preparation he studied the machine with the machine. The analysis was delegated everywhere, the participation nowhere. The loss was answered by the loser, in a book, under his own name.","quote":{"paper":"T5","text":"the analysis was delegated everywhere, the participation nowhere","line":199,"anchor":"t5-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-1-p2","unit":"t5-5-1","k":2,"lines":[201,201],"label":"“Mere play”?","does":"example","says":"Five years earlier, when Yonenaga called a man–machine match mere play, Satō Yasumitsu asked whether play at a professional board could be called mere. What was being defended was play in the autotelic sense, in which everything is at stake.","quote":{"paper":"T5","text":"it is because it is play that everything is at stake","line":201,"anchor":"t5-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-2-p1","unit":"t5-5-2","k":1,"lines":[205,205],"label":"Three axes","does":"claim","says":"The event decomposes along three axes. On the capability axis the loss was real, total and permanent. On the play axis and the seat axis there was nothing to lose. The defeat happened on one axis and can be read as rendering the other two newly visible.","quote":{"paper":"T5","text":"The defeat happened on one axis and can be read as rendering the other two newly visible within the practice","line":205,"anchor":"t5-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-2-p2","unit":"t5-5-2","k":2,"lines":[207,207],"label":"Two instruments","does":"grounds","says":"According to Suits, losing leaves intact the achievement of having carried the attempt through. The evaluation number lets spectators read where a player departed from the best line. The machine settled into the instrument layer; the playing seat and the answering seat remain human.","quote":{"paper":"T5","text":"The machine settled into the instrument layer","line":207,"anchor":"t5-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-3-p1","unit":"t5-5-3","k":1,"lines":[211,211],"label":"What the kansōsen kept","does":"grounds","says":"The kansōsen is the seat where, once the question of prevailing has been settled, the agreement to make a contest of it is reopened. It never measured itself against third-party strength, and so had nothing to lose to the machine.","quote":{"paper":"T5","text":"nothing in it had anything to lose to the machine","line":211,"anchor":"t5-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-3-p2","unit":"t5-5-3","k":2,"lines":[213,213],"label":"Record and hedges","does":"limit","says":"In the decade after machine superiority, the public stature of professional shogi did not fall but rose. No causal claim is made about that rise. What the paper asserts is coexistence, not mechanism. Coexistence, however, is what the vision of collapse said was impossible.","quote":{"paper":"T5","text":"this paper asserts coexistence, not mechanism","line":213,"anchor":"t5-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-3-p3","unit":"t5-5-3","k":3,"lines":[215,215],"label":"Suits’s assignment","does":"implication","says":"The Den’ō-sen can be read as an execution of Suits’s assignment: begin now to devise the games a life without necessity will need. Before the crisis peaked, an institution designed that game.","quote":{"paper":"T5","text":"reads, in retrospect, as an execution of that assignment","line":215,"anchor":"t5-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-4-p1","unit":"t5-5-4","k":1,"lines":[219,219],"label":"The model from the case","does":"summary","says":"The case yields a model with three parts: staking everything, answering in public, and remaking the setting. The rest of knowledge work has arrived at the same board a decade later.","quote":{"paper":"T5","text":"The case yields a model, and the model has three parts.","line":219,"anchor":"t5-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-4-p2","unit":"t5-5-4","k":2,"lines":[221,223],"label":"Closing","does":"summary","says":"The world of shogi kept its seat without retreating from reality. The achieved state moved to the machine; participation did not move. AI can assist play. It cannot take one’s place in it.","quote":{"paper":"T5","text":"AI can assist play. It cannot take one's place in it.","line":223,"anchor":"t5-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-postscript-p1","unit":"t5-postscript","k":1,"lines":[227,227],"label":"The last spring","does":"example","says":"Wittgenstein’s last spring, in which he kept writing until two days before his death, is read as work in which the activity itself remained after everything instrumental had fallen away. The paper notes that it does not claim to know what the work was to him.","quote":{"paper":"T5","text":"I do not claim to know what the work was to him","line":227,"anchor":"t5-postscript","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-postscript-p2","unit":"t5-postscript","k":2,"lines":[229,229],"label":"Addressees","does":"positioning","says":"Wittgenstein addressed his book to the few it might reach. This paper too was written in the hope of reaching some of them.","quote":{"paper":"T5","text":"This paper, too, was written in the hope of reaching a few of them.","line":229,"anchor":"t5-postscript","match":"exact"},"basis":"reading","vis":"public"}],"links":[{"id":"k-t5-1-p1--t5-5-1-p1","from":"t5-1-p1","to":"t5-5-1-p1","rel":"takes up","note":"The match touched on in the introduction is told in full as the case.","basis":"reading","vis":"public"},{"id":"k-t5-1-p1--t5-5-3-p2","from":"t5-1-p1","to":"t5-5-3-p2","rel":"takes up","note":"The evidence announced in the introduction is stated with its hedges.","basis":"reading","vis":"public"},{"id":"k-t5-1-p2--t5-4-4-p7","from":"t5-1-p2","to":"t5-4-4-p7","rel":"takes up","note":"It gives the reason for choosing play as the specimen.","basis":"reading","vis":"public"},{"id":"k-t5-1-p3--t5-3-2-p3","from":"t5-1-p3","to":"t5-3-2-p3","rel":"takes up","note":"The first wave’s mistake is given a diagnosis: the quasi-game player.","basis":"reading","vis":"public"},{"id":"k-t5-1-p3--t5-4-1-p1","from":"t5-1-p3","to":"t5-4-1-p1","rel":"takes up","note":"The older layer beneath the two waves is taken up as the strongest objection.","basis":"reading","vis":"public"},{"id":"k-t5-1-p4--t5-3-3-p2","from":"t5-1-p4","to":"t5-3-3-p2","rel":"takes up","note":"The dispute over whether machines achieve is bracketed: the theorem does not depend on its outcome.","basis":"reading","vis":"public"},{"id":"k-t5-1-p5--t5-3-4-p3","from":"t5-1-p5","to":"t5-3-4-p3","rel":"supports","note":"It shows that the concession that achievement is undermined rests on structure.","basis":"reading","vis":"public"},{"id":"k-t5-1-p6--t5-3-4-p2","from":"t5-1-p6","to":"t5-3-4-p2","rel":"takes up","note":"Kawatani is given the theoretical seat that was promised.","basis":"reading","vis":"public"},{"id":"k-t5-1-p7--t5-3-1-p5","from":"t5-1-p7","to":"t5-3-1-p5","rel":"uses","note":"The reason that a property bearing no load goes unnamed is used in the reply on obviousness.","basis":"reading","vis":"public"},{"id":"k-t5-1-p9--t5-4-1-p2","from":"t5-1-p9","to":"t5-4-1-p2","rel":"uses","note":"The point that AI distributes the recognition to everyone at once is applied to Kawatani’s mechanism.","basis":"reading","vis":"public"},{"id":"k-t5-2-1-p2--t5-3-2-p2","from":"t5-2-1-p2","to":"t5-3-2-p2","rel":"uses","note":"The relocation, looking at the structure of reasons without inspecting inner life, is used for the criterion.","basis":"reading","vis":"public"},{"id":"k-t5-2-2-p4--t5-3-1-p3","from":"t5-2-2-p4","to":"t5-3-1-p3","rel":"takes up","note":"That the sentence’s sense slides between the two objects is shown through three readings.","basis":"reading","vis":"public"},{"id":"k-t5-2-3-p2--t5-3-1-p1","from":"t5-2-3-p2","to":"t5-3-1-p1","rel":"takes up","note":"What happens when delegation is attempted on a chosen obstacle is stated as the theorem.","basis":"reading","vis":"public"},{"id":"k-t5-3-1-p1--t5-5-4-p2","from":"t5-3-1-p1","to":"t5-5-4-p2","rel":"sums up","note":"What the theorem said (the achieved state moves, participation does not) is concluded after the case.","basis":"reading","vis":"public"},{"id":"k-t5-3-2-p2--t5-4-4-p3","from":"t5-3-2-p2","to":"t5-4-4-p3","rel":"uses","note":"The criterion that undertaking is treated as carrying reasons is used as the premise of the normative claim.","basis":"reading","vis":"public"},{"id":"k-t5-3-2-p3--t5-5-2-p1","from":"t5-3-2-p3","to":"t5-5-2-p1","rel":"uses","note":"The concept of the quasi-game player is used in reading the play axis.","basis":"reading","vis":"public"},{"id":"k-t5-3-4-p1--t5-4-3-p3","from":"t5-3-4-p1","to":"t5-4-3-p3","rel":"uses","note":"The answering seat and the playing seat are used in reading the kansōsen.","basis":"reading","vis":"public"},{"id":"k-t5-3-4-p4--t5-4-1-p3","from":"t5-3-4-p4","to":"t5-4-1-p3","rel":"uses","note":"The two locks are used also for the case in which the machine is supposed sentient.","basis":"reading","vis":"public"},{"id":"k-t5-3-4-p5--t5-postscript-p1","from":"t5-3-4-p5","to":"t5-postscript-p1","rel":"takes up","note":"To the question left undecided (a life crystallizing as one’s own) it adds a reading of one scene.","basis":"reading","vis":"public"},{"id":"k-t5-3-5-p1--t5-4-4-p7","from":"t5-3-5-p1","to":"t5-4-4-p7","rel":"uses","note":"The first-person corollary is positioned as what generalizes the structure of the theorem to activities in which the agent’s end includes the agent’s own performance.","basis":"reading","vis":"public"},{"id":"k-t5-3-5-p2--t5-4-1-p1","from":"t5-3-5-p2","to":"t5-4-1-p1","rel":"takes up","note":"The difficulty that a truth does not necessarily console is taken up as the vision of collapse.","basis":"reading","vis":"public"},{"id":"k-t5-4-1-p2--t5-4-2-p1","from":"t5-4-1-p2","to":"t5-4-2-p1","rel":"limits","note":"It brings out the hidden premise of the dropping-out mechanism and limits the impossibility to a conditional one.","basis":"reading","vis":"public"},{"id":"k-t5-4-2-p2--t5-5-1-p2","from":"t5-4-2-p2","to":"t5-5-1-p2","rel":"uses","note":"Schlick’s vocabulary, play as the address of meaning, is used in reading the exchange.","basis":"reading","vis":"public"},{"id":"k-t5-4-2-p2--t5-postscript-p1","from":"t5-4-2-p2","to":"t5-postscript-p1","rel":"takes up","note":"The third response is read in a scene lived to the end of a life.","basis":"reading","vis":"public"},{"id":"k-t5-4-2-p3--t5-5-1-p1","from":"t5-4-2-p3","to":"t5-5-1-p1","rel":"takes up","note":"Yonenaga, cited as a specimen, is described in detail as the case.","basis":"reading","vis":"public"},{"id":"k-t5-4-3-p2--t5-4-4-p1","from":"t5-4-3-p2","to":"t5-4-4-p1","rel":"uses","note":"The ideal-bearing aspect of Shibusawa’s shumi is used as an analogy for undertaking.","basis":"reading","vis":"public"},{"id":"k-t5-4-3-p3--t5-5-3-p1","from":"t5-4-3-p3","to":"t5-5-3-p1","rel":"takes up","note":"The kansōsen is read within the case.","basis":"reading","vis":"public"},{"id":"k-t5-4-4-p5--t5-4-6-p1","from":"t5-4-4-p5","to":"t5-4-6-p1","rel":"restates","note":"The prohibition on scoring standing is stated again as a bound of the account.","basis":"reading","vis":"public"},{"id":"k-t5-4-4-p8--t5-5-3-p2","from":"t5-4-4-p8","to":"t5-5-3-p2","rel":"tests","note":"Against the two theses, the case goes no further than showing coexistence.","basis":"reading","vis":"public"},{"id":"k-t5-4-5-p2--t5-4-6-p1","from":"t5-4-5-p2","to":"t5-4-6-p1","rel":"limits","note":"It limits the two questions to first-person instruments, which break when turned outward as a yardstick.","basis":"reading","vis":"public"}],"ok":1}},"routes":{"codes":{"t1-ext":"T1a","t1-speccost":"T1b","t1-visibility":"T1c","t1-spec":"T1d","t1-ablation":"T1e","t2-ratelimit":"T2a","t2-seinsollen":"T2b","t2-boundary":"T2c","t2-assay":"T2d","t3-direction":"T3a","t3-drive":"T3b","t3-mode":"T3c","t3-answer":"T3d","t3-distinct":"T3e","t3-twolayer":"T3f","t4-adherence":"T4a","t4-undertake":"T4b","t4-embody":"T4c","t4-twopath":"T4d","t4-ratelimit":"T4e","t5-objects":"T5a","t5-theorem":"T5b","t5-criterion":"T5c","t5-roots":"T5d","t5-norm":"T5e","t5-visibility":"T5f","t5-apparatus":"T5g","t5-shogi":"T5h"},"routes":[{"id":"denshou","label":"Handing down skills","title":"Handing down skills: passing a veteran’s judgment to the next person","lede":"One example of a reading that applies the distinctions of the five papers, in turn, to the situation of wanting to pass a veteran’s judgment on to the next person. At each step, choose the answer closest to yours, and you move on to the next question or to a remaining question. A remaining question is not an evaluation; it marks where to think next. Judgments about a particular case are left to the person following the path.","start_label":"Situation: handing down skills","start_sub":"passing on a veteran’s judgment","basis":"reading","vis":"public","start":"1","steps":[{"id":"1","node":"t1-ext","ask":"Is what you want to pass on a procedure that can be conveyed by writing it down, or the judgment that determines how procedures are applied?","why":"T1 divides what it costs to turn knowledge into an artifact into two. One is the effort of giving it a form such as text or code (externalization cost). The other is the degree to which the task demands domain expertise in order to decide what to build and what to exclude (specification cost). In T1’s case study, AI assistance lowered the former greatly, and the latter did not change.","quotes":[{"paper":"T1","text":"When experienced professionals retire, organisations lose not their documented procedures but the accumulated judgement that determines how those procedures are applied.","line":14,"anchor":"t1-abstract","match":"exact"}],"options":[{"key":"a","short":"Procedure","label":"Procedures and facts. They can be conveyed by writing them out","to":"A"},{"key":"b","short":"Judgment","label":"The judgment that decides when to apply a procedure and when to set it aside","to":"2"}],"keeps":["c03"]},{"id":"2","node":"t1-spec","ask":"Can you talk now with the person who holds that judgment?","why":"T1 writes that a record of dialogue with AI keeps not only the options adopted but also the options rejected and the reasons for rejecting them. This is a kind of knowledge that rarely survives in manuals or reports. Such a record can be made only while the person who holds the judgment is still there.","quotes":[{"paper":"T1","text":"Rejection rationale is a category of knowledge that typically survives in neither technical manuals nor project reports.","line":155,"anchor":"t1-4-1","match":"exact"},{"paper":"T1","text":"The window during which retiring domain experts can externalise their specification capacity through AI-mediated dialogue is finite and closing.","line":42,"anchor":"t1-1","match":"exact"}],"options":[{"key":"a","short":"Can talk","label":"Yes. A record of the dialogue can be kept","to":"3"},{"key":"b","short":"No setting","label":"The person is there, but is unlikely to end up in dialogue with an AI","to":"B"},{"key":"c","short":"Already gone","label":"Not any more. Only documents remain","to":"5"}],"keeps":["c02"]},{"id":"3","node":"t2-ratelimit","ask":"Once it is on record, does the next person have the time and the setting to make it their own?","why":"T2 compares the four processes of knowledge conversion. What AI greatly accelerates is putting knowledge into external form and combining it (externalization and combination). Sharing between people and learning by doing (socialization and internalization) are processes on the human side, and investment in AI alone does not speed them up. The stage that sets the pace of the whole then shifts to these two. T2 states this not as an empirical finding but as an analytic consequence drawn from its matrix.","quotes":[{"paper":"T2","text":"Applied to SECI: AI acceleration of E and C shifts the effective bottleneck to S and I.","line":160,"anchor":"t2-4-5","match":"exact"}],"options":[{"key":"a","short":"Handed over only","label":"It stops at handing over the record","to":"C"},{"key":"b","short":"Yes","label":"Yes. There is a setting for working together and a chance to try it oneself","to":"4"}],"keeps":[]},{"id":"4","node":"t2-seinsollen","ask":"Does the judgment you want to pass on weigh more toward a reading of the facts or toward a choice of values?","why":"T2 divides the content of a judgment into two components: a reading of how things are (Sein-type), and a choice about what ought to be done and what to leave out (Sollen-type). Most judgments in practice contain both, and are viewed as a ratio rather than a binary. In T2’s matrix (theoretical assignments, not measured values), the Sollen-type component is concentrated most in the process of sharing between people, while the process of learning by doing weighs toward the Sein-type. Sein-type readings are gradually absorbed into routine processing as externalization and combination are repeated. Sollen-type specification, T2 writes, does not undergo this transition. This is not a claim that AI cannot produce value-laden outputs. It can; what cannot be done is to ground the legitimacy of such outputs in the system itself. T2 states that the claim is not about capability but about warrant.","quotes":[{"paper":"T2","text":"Most judgments in practice are hybrid: they carry both factual and value-laden components in varying proportions.","line":47,"anchor":"t2-2-2","match":"exact"},{"paper":"T2","text":"AI's domain expands along the Sein axis but encounters a structural boundary along the Sollen axis.","line":164,"anchor":"t2-4-5","match":"exact"},{"paper":"T2","text":"The claim is not about capability but about warrant.","line":55,"anchor":"t2-2-3","match":"exact"}],"options":[{"key":"a","short":"Reading of facts","label":"It weighs toward a reading of the facts (what this value means, and the like)","to":"6"},{"key":"b","short":"Choice of values","label":"It weighs toward a choice of values (what to put first, what to leave out, and the like)","to":"6"},{"key":"c","short":"Mixed","label":"The two are mixed and hard to separate","to":"6"}],"keeps":["c04","c05"]},{"id":"5","node":"t3-direction","ask":"Has the next person directly encountered the people who hold the problem this work addresses, or the site where it arises?","why":"For the case where the person who held the judgment is already gone, T1 writes that judgment lost through generational transition cannot be regenerated from data alone. The next person will have to develop a judgment of their own. T3 holds that direction, what one is oriented toward, cannot be installed from outside, and then sets out a design conjecture: direct encounter with a problem-holder may support its formation. T3 itself states that this is not a demonstrated mechanism.","quotes":[{"paper":"T1","text":"specification cost, once lost through generational transition, cannot be regenerated from data alone","line":319,"anchor":"t1-urgency","match":"exact"},{"paper":"T3","text":"it can guarantee exposure, never crystallization","line":84,"anchor":"t3-3","match":"exact"}],"options":[{"key":"a","short":"No encounter","label":"No. There are only documents and tools","to":"D"},{"key":"b","short":"Has encountered","label":"Yes","to":"6"}],"keeps":["c09"]},{"id":"6","node":"t3-answer","ask":"Does the next person give judgments under their own name, and stand where they are asked and must answer?","why":"T3 isolates answerability, the standing of having to answer for a judgment, as a relation rather than as one capability among others. The standing is conferred by the relation; what grows is the competence to answer well. That competence, however rehearsed, is normatively tested and sustained only in exchanges in which one is asked, answers, and takes the answer up as one’s own. T3 writes that an AI can be a partner for practicing answers, but not the final party who receives the answer.","quotes":[{"paper":"T3","text":"The standing of answerability is conferred by the relation itself; what grows is the learner's competence to answer well","line":150,"anchor":"t3-5-4","match":"exact"},{"paper":"T3","text":"apprenticeship's core, with its drudgery finally delegable, returned to the center","line":152,"anchor":"t3-5-4","match":"exact"}],"options":[{"key":"a","short":"Does not","label":"No. Only the finished artifact is looked at","to":"E"},{"key":"b","short":"Does","label":"Yes. Someone asks, and takes in the answer","to":"7"}],"keeps":["c13","c11"]},{"id":"7","node":"t4-undertake","ask":"Has the next person made the purpose of the work their own reason for judgment, and are they actually doing the work with their own hands?","why":"T4 redefines jibungoto-ka (treating matters as one’s own) as the state in which undertaking and embodiment are both present. Undertaking is endorsing a purpose as one’s own reason for judgment and holding it within a relation of giving reasons to specific others; at its core is answerability for one’s judgment. Embodiment is the undertaken orientation becoming ingrained in practice; it does not occur by listening to an explanation, only through the person’s actually doing it.","quotes":[{"paper":"T4","text":"Undertaking an orientation without bodily action remains merely verbal; bodily action without undertaking the orientation is simply acting because one was told to.","line":71,"anchor":"t4-2-3","match":"exact","target":"t4en-u071"}],"options":[{"key":"a","short":"No chance to do it","label":"The purpose is understood, but there is no chance to do the work oneself","to":"F"},{"key":"b","short":"Because told to","label":"They are doing it, but because they were told to","to":"G"},{"key":"c","short":"Both present","label":"They have made the purpose their own reason and are doing the work themselves","to":"8"}],"keeps":["c16","c15"]},{"id":"8","node":"t5-theorem","ask":"For the next person themselves, is this work something for which the result alone, once delivered, would be enough?","why":"T5 separates an achieved state from pursuing that state oneself (participation). The state can be realized by another agent, a person or a machine; the fact that one pursued it oneself cannot be produced by another agent. T5 offers a question for applying this distinction to oneself: if only the result were delivered, would I be satisfied? The formal theorem concerns games, and T5 does not redescribe work as a whole as play. The question is put in a form one addresses to oneself. Having others score whether someone’s participation or undertaking is authentic is something T5 itself excludes.","quotes":[{"paper":"T5","text":"Ask, of any activity: if only the result were delivered, would I be satisfied?","line":123,"anchor":"t5-3-5","match":"exact"}],"options":[{"key":"a","short":"Enough","label":"Yes. If the result is there, it does not matter who did it","to":"H"},{"key":"b","short":"Not enough","label":"No. Doing it oneself is itself a reason","to":"I"}],"keeps":["c19","c17"]}],"ends":[{"id":"A","after":"1","name":"Effort of writing out","ask":"Beyond the effort of writing it out, is there nothing left to pass on?","note":"If it can be conveyed by writing, the barrier is externalization cost: the part that T1 predicts will change greatly with AI assistance. T1 also writes, however, that what is lost at retirement is not the procedures that can be documented but the judgment that determines how they are applied.","quotes":[{"paper":"T1","text":"What disappears is not procedural knowledge—which can be documented in manuals and standard operating procedures—but the accumulated judgement that determines how procedures are applied, when they should be overridden, and what problems they fail to anticipate.","line":26,"anchor":"t1-1","match":"exact"}]},{"id":"B","after":"2","name":"Who sets up the dialogue","ask":"Who will arrange the dialogue in which the veteran’s judgment comes out?","note":"T1 writes that the instruction “teach the veteran to use AI” misidentifies the bottleneck. The veteran already has the judgment. What is needed, T1 says, is a designer who selects the questions and arranges the sequence of the dialogue so that this judgment comes out in the dialogue with AI.","quotes":[{"paper":"T1","text":"The instruction \"teach the veteran to use AI\" misidentifies the bottleneck.","line":275,"anchor":"t1-5-5","match":"exact"}]},{"id":"C","after":"3","name":"Human-speed stages","ask":"Whose time will be given to sharing between people and to learning by doing?","note":"T2 writes that even when records can be made quickly, socialization and internalization cannot be accelerated by AI investment alone. Once the record has been handed over, it is these two stages that set the pace of the whole.","quotes":[{"paper":"T2","text":"both human-limited cognitive and social processes that cannot be accelerated by AI investment alone","line":13,"anchor":"t2-abstract","match":"exact"}]},{"id":"D","after":"5","name":"Arranging encounters","ask":"Where will you provide the next person with chances to encounter the people who hold the problem and the site where it arises?","note":"T3 writes that design can guarantee exposure to encounters, never the crystallization of a direction. T4 likewise writes that an organization cannot inject purposes themselves, but what employees encounter bodily can be designed. That encounter supports the formation of direction is put as a design conjecture in T3 and as a hypothesis in T4.","quotes":[{"paper":"T4","text":"What employees encounter bodily can nevertheless be designed","line":126,"anchor":"t4-4-2","match":"exact","target":"t4en-u126"}]},{"id":"E","after":"6","name":"The one who asks","ask":"Who asks the next person “What is your reading?” and takes in the answer?","note":"T3 separates performance delegation and developmental delegation as different objects. Offloading production to AI can raise the quality of the artifact while leaving knowledge and transfer unchanged. What is to be protected, T3 says, is not the artifact but the episodes in which the next person answers for their own judgments. The one who asks must also be answerable, for the questions, the criteria and the decisions.","quotes":[{"paper":"T3","text":"What guardrails protect, therefore, is not the artifact but the episodes in which the learner answers for judgments.","line":142,"anchor":"t3-5-3","match":"exact"}]},{"id":"F","after":"7","name":"Keeping chances to do","ask":"Of the tasks that would disappear with automation, which should be kept so that the skill can be acquired?","note":"In T4’s case, as the staff member repeatedly measured ammonia concentration with manual detector tubes, the correspondence among color, number and bodily perception became established in the staff member’s body. T4 reads that, had the measurements been replaced by automatic sensors, the same learning would likely have been less readily produced. It is a single case, placed as a demonstration of application that shows the embodiment side.","quotes":[{"paper":"T4","text":"Had the measurements been replaced by automatic sensors, the data would have been obtained in the same way, but the same sensory and embodied learning would likely have been less readily produced.","line":106,"anchor":"t4-3","match":"exact","target":"t4en-u106"}]},{"id":"G","after":"7","name":"Askers answer too","ask":"Does the side that asks for undertaking stand answerable in turn to the next person’s judgments?","note":"T4 places reciprocity among the conditions under which undertaking holds. In a relation that demands answers only from the other side and gives none itself, the very setting in which the next person could stand answerable disappears. T4 also writes that undertaking cannot be forced through explanation or command.","quotes":[{"paper":"T4","text":"If management requires undertaking from employees, management must also take the answering position in relation to employees' judgments.","line":79,"anchor":"t4-2-4","match":"exact","target":"t4en-u079"}]},{"id":"H","after":"8","name":"Hardships to let go","ask":"Of the hardships so far, which can be let go without loss?","note":"T5 divides obstacles into two kinds: those that merely sat there because time, skill and attention were scarce, and those chosen as constraints that constitute the activity. That the former disappear is delegation working as intended, and T5 writes that to take this as a loss is a mistake. Which kind one is facing has to be determined obstacle by obstacle.","quotes":[{"paper":"T5","text":"for the first time, one must determine, obstacle by obstacle, which kind one is facing","line":73,"anchor":"t5-2-3","match":"exact"}]},{"id":"I","after":"8","name":"Conditions to continue","ask":"Knowing that a machine can do it better, under what conditions can one continue the work?","note":"T5 states that participation, being non-transferable, cannot be taken away either, and then treats as a separate question the cultural conditions under which people can accept this and continue. It proposes, as a sociological hypothesis, cultural forms that keep recognition of standing as a participant from being exhausted by comparative performance (dignity apparatuses).","quotes":[{"paper":"T5","text":"under what cultural conditions can people continue activities they know machines can perform better?","line":13,"anchor":"t5-abstract","match":"exact"}]}]},{"id":"makaseru","label":"Delegating to AI","title":"Delegating to AI: how far to delegate, and what to decide yourself","lede":"One example of a reading that applies the distinctions of the five papers, in turn, to the situation of wanting to hand work or everyday tasks over to AI. At each step, choose the answer closest to yours, and you move on to the next question or to a remaining question. A remaining question is not an evaluation; it marks where to think next. Judgments about a particular case are left to the person following the path.","start_label":"Situation: delegating to AI","start_sub":"what to delegate, what to decide","basis":"reading","vis":"public","start":"1","steps":[{"id":"1","node":"t1-ext","ask":"Is what you want to delegate the effort of giving something a form, or deciding what to make?","why":"T1 divides what it costs to turn knowledge into a formal artifact into two. One is the effort of giving it a form such as text or code (externalization cost). The other is the degree to which the task demands domain expertise in order to decide what to build and what to exclude (specification cost). In T1’s case study, AI assistance lowered the former greatly, and the latter did not change.","quotes":[{"paper":"T1","text":"denotes the technical barriers to converting tacit knowledge into explicit, formal representations","line":52,"anchor":"t1-2-1","match":"exact"},{"paper":"T1","text":"specification cost is the degree to which a task demands domain expertise","line":54,"anchor":"t1-2-1","match":"exact"}],"options":[{"key":"a","short":"Giving it form","label":"The effort of giving it a form. What to make I have already decided myself","to":"A"},{"key":"b","short":"Deciding too","label":"I also want to delegate what to make and what counts as good","to":"2"}],"keeps":["c03","c02"]},{"id":"2","node":"t1-ablation","ask":"Can you tell good output from bad with knowledge of the domain?","why":"T1 had two AI models build the same application without being given domain knowledge. Both quickly produced something that ran, but showed deficiencies of the same pattern in data interpretation, interface and information structure: artifacts that were technically competent but domain-inappropriate. The experiment concerns a single case.","quotes":[{"paper":"T1","text":"it asks what happens when externalisation capability is present but specification is absent","line":163,"anchor":"t1-4-2","match":"exact"},{"paper":"T1","text":"Both models independently exhibited structurally convergent deficiency patterns across all three layers","line":191,"anchor":"t1-4-2","match":"exact"}],"options":[{"key":"a","short":"Cannot tell","label":"No. I do not know the domain","to":"B"},{"key":"b","short":"Can tell","label":"Yes. I can say what is wrong with it","to":"3"}],"keeps":["c03"]},{"id":"3","node":"t2-boundary","ask":"Is the judgment you want to delegate a matter of establishing facts, or of choosing what is to count as good?","why":"T2 divides the content of a judgment into two. For factual judgments (Sein-type), an AI given sufficient data and domain-relevant training could in principle arrive at the same determinations. For value-laden judgments (Sollen-type), T2 writes, an AI can generate outputs but cannot supply the warrant that makes the judgment legitimate. This is a claim about legitimacy, not about capability, and T2 writes that it holds as long as the authority to make value judgments remains institutionally attributed to human agents. Most judgments in practice are a mixture of the two.","quotes":[{"paper":"T2","text":"An AI system can generate such outputs, but it cannot supply the warrant","line":45,"anchor":"t2-2-2","match":"exact"},{"paper":"T2","text":"The boundary is not a capability claim; it is a legitimacy claim, and it holds as long as the authority to make value judgments remains institutionally attributed to human agents.","line":29,"anchor":"t2-1","match":"exact"},{"paper":"T2","text":"Most judgments in practice are hybrid","line":47,"anchor":"t2-2-2","match":"exact"}],"options":[{"key":"a","short":"Establishing facts","label":"Establishing facts. Looking into it settles the matter","to":"C"},{"key":"b","short":"Choice of values","label":"It involves choosing what is to count as good","to":"4"},{"key":"c","short":"Mixed","label":"The two are mixed, and I have never separated them","to":"D"}],"keeps":["c07","c06","c04"]},{"id":"4","node":"t3-answer","ask":"If you are asked about that judgment after adopting it, who answers?","why":"T2 places the reason why part of a decision cannot be delegated not in any inability of AI to generate outputs, but in the requirement that an output’s warrant be traceable to a source whose legitimacy is socially recognized. T3 isolates answerability for a judgment as a relation distinct from capability. Accountability can be reallocated within institutions; answerability cannot be transferred. T3 writes that granting an AI more authority gives it no such standing.","quotes":[{"paper":"T2","text":"the output
