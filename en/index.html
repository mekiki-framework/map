's warrant must be traceable to a source whose legitimacy is socially recognized","line":23,"anchor":"t2-1","match":"exact"},{"paper":"T3","text":"The agent can be granted more authority without acquiring any standing.","line":102,"anchor":"t3-4-3","match":"exact"}],"options":[{"key":"a","short":"Not decided","label":"Not decided. It would probably come down to “because the AI said so”","to":"E"},{"key":"b","short":"I answer","label":"I do, under my own name","to":"5"}],"keeps":["c11","c14"]},{"id":"5","node":"t5-objects","ask":"For you, is this a task for which having the result would be enough?","why":"T5 divides the objects of desire into two: an achieved state (the result) and participation in the activity that produces it. The result can be delivered by anyone capable. Participation, T5 writes, is not delivered at all; it is enacted. The formal theorem concerns games; it extends to other activities as a first-person question, where one’s own end includes doing the thing oneself. It is a question one puts to oneself, not a yardstick for measuring people.","quotes":[{"paper":"T5","text":"The second is not delivered at all, by anyone, ever; it is enacted.","line":67,"anchor":"t5-2-2","match":"exact"},{"paper":"T5","text":"The test reads the constitutive desire, not the momentary one","line":123,"anchor":"t5-3-5","match":"exact"}],"options":[{"key":"a","short":"Result is enough","label":"The result is enough. Having it will do","to":"F"},{"key":"b","short":"Want to do it myself","label":"Not enough. Doing it myself has meaning in itself","to":"G"}],"keeps":["c17","c37"]}],"ends":[{"id":"A","after":"1","name":"Specification given","ask":"Is what you have decided written in a form that reaches the other side?","note":"In T1’s case, the fall in externalization cost was not automatic; it depended on the quality of the specification provided. Where a specification document and a prototype had been prepared beforehand, implementation was finished in a short time. It is a single case.","quotes":[{"paper":"T1","text":"it depends on the quality of specification provided","line":125,"anchor":"t1-3-2","match":"exact"}]},{"id":"B","after":"2","name":"Who can tell","ask":"Who will look at the output with the judgment of the domain?","note":"T1 predicts that in domains where specification cost is high, AI deployment without domain expert involvement will fail to produce domain-appropriate outputs. The prediction is derived from the framework; T1’s evidence is one case and one experiment.","quotes":[{"paper":"T1","text":"AI deployment without domain expert involvement will fail to produce domain-appropriate outputs","line":87,"anchor":"t1-2-3","match":"exact"}]},{"id":"C","after":"3","name":"Checking again","ask":"Who can check again later the facts the AI produced, and how?","note":"In T2’s scoring protocol, the factual components are scored by AI and the value-laden components by experts. T2 writes that factual judgments are codified over repeated cycles and absorbed into fixed procedures. T2 also writes that the point is not to treat AI as an authority but to use it as a provisional factual scorer whose outputs remain auditable and contestable.","quotes":[{"paper":"T2","text":"Given sufficient data and domain-relevant training, an AI system could in principle arrive at the same determinations.","line":43,"anchor":"t2-2-2","match":"exact"},{"paper":"T2","text":"The point is not to treat AI as an authority, but to use it as a provisional factual scorer whose outputs remain auditable and contestable.","line":99,"anchor":"t2-3-2","match":"exact"}]},{"id":"D","after":"3","name":"Into components","ask":"How much of that judgment is fact, and where does choice begin?","note":"T2 proposes a protocol that divides one judgment into components, scores the factual and the value-laden components on separate rows, and does not sum the scores into a single index. It records a ratio, not a binary. The protocol is a proposal; what T2 shows is an illustration on a case of the theory’s own author. T2 notes that scoring by experts who do not know the framework is needed.","quotes":[{"paper":"T2","text":"Scores are not summed into a single index.","line":95,"anchor":"t2-3-2","match":"exact"}]},{"id":"E","after":"4","name":"Who answers","ask":"For that judgment, who answers, and to whom?","note":"T3 states that answerability is assigned through relations and institutions, and that the assignment cannot be shortcut by capability alone. Who answers is decided by the people and institutions of the setting.","quotes":[{"paper":"T3","text":"what the argument forecloses is shortcutting that assignment by capability alone","line":116,"anchor":"t3-4-4","match":"exact"}]},{"id":"F","after":"5","name":"After delegating","ask":"What work remains on your side after delegating?","note":"T5 writes that when obstacles nobody chose, which were there only because time, skill and attention were scarce, disappear, that is delegation working as intended. T2 states that once AI has accelerated the work of giving form, the bottleneck is forming and renewing the evaluative commitments that give output its direction.","quotes":[{"paper":"T2","text":"AI investment alone cannot accelerate this bottleneck.","line":232,"anchor":"t2-7","match":"exact"}]},{"id":"G","after":"5","name":"Assist and substitute","ask":"How far will you have it assist you, and from where will you not have it take your place?","note":"T5 writes that preparation, analysis, record-keeping and the role of opponent can be delegated, but participation itself has no substitute. In the shogi case, preparation that studied the machine with the machine was delegated everywhere, and playing the match was delegated nowhere. It is a single case, and what T5 shows goes no further than compatibility.","quotes":[{"paper":"T5","text":"the analysis was delegated everywhere, the participation nowhere","line":199,"anchor":"t5-5-1","match":"exact"}]}]},{"id":"manabu","label":"Learning and teaching","title":"Learning and teaching: what to learn oneself when AI can do the assignment","lede":"One example of a reading that applies the distinctions of the five papers, in turn, to the situation in which a learner (yourself, or someone you teach) has at hand an AI that can do the assignment. T3’s framework is developed for formal education with identifiable educators; applying it to self-study, the home or the workplace is the reading of the person following the path. At each step, choose the answer closest to yours, and you move on to the next question or to a remaining question. A remaining question is not an evaluation; it marks where to think next. Judgments about a particular case are left to the person following the path.","start_label":"Situation: learning and teaching","start_sub":"when AI can do the assignment","basis":"reading","vis":"public","start":"1","steps":[{"id":"1","node":"t2-ratelimit","ask":"Is the aim of the assignment to obtain the finished thing, or to become able to do it?","why":"T2 re-describes the creation of knowledge as four processes. What AI greatly accelerates is the process of putting knowledge into words and form (externalization) and the process of combining knowledge that has been given form (combination). The process of learning from person to person (socialization) and the process of making knowledge one’s own (internalization) are not accelerated in the same way. This is not an empirical finding but a structural prediction that follows from T2’s assignments. T3 separates performance delegation and developmental delegation as different objects.","quotes":[{"paper":"T2","text":"AI acceleration of E and C shifts the effective bottleneck to S and I","line":160,"anchor":"t2-4-5","match":"exact"},{"paper":"T3","text":"Performance delegation and developmental delegation are different objects","line":142,"anchor":"t3-5-3","match":"exact"}],"options":[{"key":"a","short":"Finished thing","label":"The finished thing is what is needed. It is not an assignment for learning","to":"A"},{"key":"b","short":"Becoming able","label":"The aim is to become able to do it","to":"2"},{"key":"c","short":"Both","label":"Both. The finished thing is needed, and becoming able is also the aim","to":"2"},{"key":"d","short":"Not sure","label":"Not sure yet. I will read on first","to":"2"}],"keeps":[],"topic":"The aim","plain":"That the finished thing is good and that the person who made it has become able to do it are two things to check separately. A good result alone does not show that learning took place.","got":"“how good the finished thing is” and “whether the person who made it has become able”","not":"This does not mean that delegating to AI rules out learning. T3 writes that even when a request carries the learner’s own judgments and reasons, whether completion by AI is educationally legitimate still depends on the learning objective, the developmental stage, the plan for fading support and the criterion for unaided transfer (T3 §5.3).","example":{"text":"When production is handed to AI, the quality of the artifact can rise while knowledge and transfer to other tasks stay unchanged. This is a finding of a study that T3 cites (Fan et al., 2025).","quote":{"paper":"T3","text":"offloading production can raise artifact quality while leaving knowledge and transfer unchanged","line":142,"anchor":"t3-5-3","match":"exact"}}},{"id":"2","node":"t3-direction","ask":"Is what is being learned something the learner is oriented toward themselves?","why":"T3 divides direction, what one is oriented toward, into a candidate state and a state endorsed as one’s own. A teacher or an AI can supply candidates, T3 writes, but making one’s own cannot be handed over. As to where direction comes from, T3 sets out a design conjecture: direct encounter with a problem-holder may support it. T3 itself notes that this is not a demonstrated mechanism.","quotes":[{"paper":"T3","text":"Direction is not installed.","line":57,"anchor":"t3-2-4","match":"exact"},{"paper":"T3","text":"it can guarantee exposure, never crystallization","line":84,"anchor":"t3-3","match":"exact"}],"options":[{"key":"a","short":"Because assigned","label":"No. It is being done because it was assigned","to":"B"},{"key":"b","short":"Oriented toward it","label":"Yes","to":"3"},{"key":"c","short":"Both","label":"Both. It was assigned, but I also want to go there","to":"3"},{"key":"d","short":"Not sure","label":"Not sure yet. I will read on first","to":"3"}],"keeps":["c09"],"topic":"Direction","plain":"Candidates for what to head toward can come from a teacher or from an AI. Making one of them your own direction is something nobody else can do for you.","got":"“offering a candidate direction” and “making it one’s own”","not":"A candidate supplied from outside and a direction taken up as one’s own are not the same thing. Nor does this mean that arranging contact with people who hold the problem settles direction: T3 writes that design can guarantee exposure, never crystallization (T3 §3).","example":{"text":"T3 gives an example of reading, component by component, a learner who looks unmotivated: animated elsewhere, with direction absent. T3 reads this not as a motivation deficit but as a state before direction has crystallized.","quote":{"paper":"T3","text":"The reading is not a motivation deficit but a pre-crystallization state with a strong engine and no object","line":126,"anchor":"t3-5-1","match":"exact"}}},{"id":"3","node":"t3-answer","ask":"Are there occasions on which the learner presents what was learned to someone as their own judgment, is asked about it, and answers?","why":"Apart from the components of agency, T3 isolates a relation: answerability. T3 writes that the competence to answer well, however rehearsed, is normatively tested and sustained only in exchanges in which one is asked, answers, and takes the answer up as one’s own. An AI can help with rehearsing answers, but it cannot be the final one to whom the answer is addressed. The one who asks must also be answerable, for the questions, the criteria and the decisions. Answering is not tied to rapid oral exchange: T3 writes that reasons can be given in writing, multimodally, or with preparation.","quotes":[{"paper":"T3","text":"it cannot be the one to whom the learner answers","line":146,"anchor":"t3-5-3","match":"exact"},{"paper":"T3","text":"The educator who asks must also be answerable","line":150,"anchor":"t3-5-4","match":"exact"}],"options":[{"key":"a","short":"With AI only","label":"No. The learning proceeds through exchanges with AI alone","to":"C"},{"key":"b","short":"Yes","label":"Yes. A person asks, and the learner answers","to":"4"},{"key":"c","short":"Both","label":"Both. I work with AI, and people also ask me","to":"4"},{"key":"d","short":"Not sure","label":"Not sure yet. I will read on first","to":"4"}],"keeps":["c13","c33"],"topic":"The addressee","plain":"An AI can help you rehearse answering. It cannot stand in for the final addressee of your answer for your own judgment, that is, a person entitled to ask.","got":"“helping to rehearse answers” and “being the one the answer is owed to”","not":"Who must answer, and how well that person can answer, are different questions. Nor does this mean that practice with an AI is useless: T3 writes that AI can help learners rehearse. Nor is answering tied to rapid oral exchange: reasons can be given in writing, multimodally, or with preparation (T3 §5.4).","example":{"text":"Clinical supervision is given as an example. Once responsibility for a patient-facing judgment is institutionally assigned, the trainee stands answerable for it; what training builds is the competence to answer well.","quote":{"paper":"T3","text":"the trainee stands answerable for it; what training builds is the competence to answer well","line":150,"anchor":"t3-5-4","match":"exact"}}},{"id":"4","node":"t4-embody","ask":"Among the tasks delegated to AI, are there some that would be made one’s own only by doing them oneself?","why":"T4 defines embodiment as the undertaken orientation becoming ingrained in practice, and writes that it occurs not by listening to an explanation but only through the person’s actually doing it. In T4’s case, repeated manual measurement established the correspondence among color, number and bodily perception. T4 reads that, had the measurements been replaced by automatic ones, the same learning would likely have been less readily produced. It is a single case. T4 is a paper about organizations; here its definition and its single case are applied, as a reading, to a learning situation.","quotes":[{"paper":"T4","text":"This does not occur by listening to an explanation; it occurs only through the person's actually doing it.","line":69,"anchor":"t4-2-3","match":"exact","target":"t4en-u069"},{"paper":"T4","text":"turned the act of measurement itself into a pathway for accumulating the substrate","line":106,"anchor":"t4-3","match":"exact","target":"t4en-u106"}],"options":[{"key":"a","short":"None","label":"No. What is delegated is only work that this learning objective does not aim to build","to":"D"},{"key":"b","short":"Some","label":"Yes. Tasks that would be learned by doing are delegated too","to":"E"},{"key":"c","short":"Both","label":"Both. Some of it is not what I aim to build, and some would ingrain by doing","to":"E"},{"key":"d","short":"Not sure","label":"Not sure yet. I want to look at the tasks one by one","to":"D"}],"keeps":[],"topic":"What ingrains","plain":"Understanding something from an explanation and having it ingrained by doing it yourself are different. If work that ingrains by doing is handed over as well, the occasions for it may be lost.","got":"“understanding from an explanation” and “having it ingrained by doing”","not":"This does not mean that such work must never be delegated. T4 is a paper about organizations, and the case is a single one; here it is applied, as a reading, to a learning situation.","example":{"text":"T4’s case: as a weekly measurement with a manual detector tube was repeated, the correspondence among color, number and bodily sense became ingrained. T4 reads that, had it been replaced by automatic measurement, the same learning would likely have been less readily produced.","quote":{"paper":"T4","text":"turned the act of measurement itself into a pathway for accumulating the substrate","line":106,"anchor":"t4-3","match":"exact","target":"t4en-u106"}}}],"ends":[{"id":"A","after":"1","name":"A task to get done","ask":"Is this then not a situation of learning but one of getting a task done?","note":"If only the finished thing is needed, the questions become those of the situation “Delegating to AI”. T3 writes, however, that even for a request that contains the learner’s own specification, whether completing it is educationally legitimate still depends on the learning objective, the developmental stage, the plan for fading support and the criterion for unaided transfer.","quotes":[{"paper":"T3","text":"whether it is educationally legitimate still depends on the learning objective","line":142,"anchor":"t3-5-3","match":"exact"}],"cant":"Whether it is right to have AI complete that assignment cannot be decided from here. For learning situations, T3 writes that even when a request carries the learner’s own judgments and reasons, this still depends on the learning objective, the developmental stage, the plan for fading support and the criterion for unaided transfer."},{"id":"B","after":"2","name":"Direct encounters","ask":"Are there chances for direct contact with the people who hold the problem in that field, or with the site?","note":"T3 gives an example in which a learner who presents as unmotivated is read not as having a motivation deficit but as being in a pre-crystallization state, and writes that the indicated lever is exposure to encounters, not exhortation. Design can guarantee exposure to encounters, never that a direction will settle. T3 also lists, as a design requirement, that the people encountered are not treated as teaching materials.","quotes":[{"paper":"T3","text":"The reading is not a motivation deficit but a pre-crystallization state","line":126,"anchor":"t3-5-1","match":"exact"},{"paper":"T3","text":"Problem-holders are not teaching materials","line":136,"anchor":"t3-5-2","match":"exact"}],"cant":"Arranging an encounter does not ensure that direction will settle. That meeting a person who holds the problem may contribute is T3’s design conjecture, not a demonstrated mechanism. What design can guarantee, T3 writes, is the opportunity. Even then, T3 writes, the people encountered must not be treated as teaching materials: consent and reciprocity of benefit, among others, are design requirements."},{"id":"C","after":"3","name":"Someone who asks","ask":"Where will you look for someone who asks about your judgment?","note":"T3 places the educator’s non-substitutable function not in handing over knowledge but in being the one who asks and has the learner take up the answer as their own. T3 writes that this addressee need not be a teacher: it may be anyone entitled to ask, such as a peer, a professional body or a represented community. The framework is developed for formal education with identifiable educators, and T3 leaves its extension beyond that as future work.","quotes":[{"paper":"T3","text":"the final normative addressee remains a legitimate human addressee","line":11,"anchor":"t3-abstract","match":"exact"},{"paper":"T3","text":"the framework is developed for formal education with identifiable educators","line":158,"anchor":"t3-6","match":"exact"}],"cant":"Who will be that addressee cannot be decided from here. T3 writes that the addressee need not be a teacher: it may be anyone entitled to ask. T3’s framework, however, is developed for formal education with identifiable educators, and T3 leaves its extension beyond that open, as a research agenda."},{"id":"D","after":"4","name":"Chores to let go","ask":"Which chores can be let go without loss?","note":"T5 divides obstacles into two kinds: those that merely sat there because time, skill and attention were scarce, and those chosen as constraints that constitute the activity. That the former disappear, T5 writes, is delegation working as intended. Which kind one is facing has to be determined obstacle by obstacle.","quotes":[{"paper":"T5","text":"for the first time, one must determine, obstacle by obstacle, which kind one is facing","line":73,"anchor":"t5-2-3","match":"exact"}],"cant":"Which chores merely sat there and which constitute the activity cannot be decided from here. T5 writes that this has to be determined obstacle by obstacle."},{"id":"E","after":"4","name":"Tasks to keep","ask":"Which tasks will you keep in your own hands until they are learned?","note":"T4 reads one case as showing that unintentionally retaining the barrier to integration into practice turned the act of measurement itself into a pathway for accumulating the substrate of judgment. T3 offers, as a miniature encounter for disciplines without wards, an exercise in which the learner delegates a task wholly to an AI system and then inventories every discomfort with the output. T3 notes that the effect of this exercise remains untested.","quotes":[{"paper":"T4","text":"does not empirically establish undertaking or the two-pathway model as a whole","line":100,"anchor":"t4-3","match":"exact","target":"t4en-u100"},{"paper":"T3","text":"the proposition remains untested","line":134,"anchor":"t3-5-2","match":"exact"}],"cant":"Which tasks to keep in your own hands, and for how long, cannot be decided from here. T4’s case is a single one; T4 itself states that it mainly shows the side of ingraining by doing and does not demonstrate the framework as a whole."}],"read":true,"headline":"AI produced something good. Does that mean learning took place?"},{"id":"shokuba","label":"At work","title":"At work: taking up as one’s own the work that comes down from above","lede":"One example of a reading that applies the distinctions of the five papers, in turn, to the situation of whether a policy or a piece of work that comes down from above can be taken up as one’s own (or, if you are the one asking, whether others can take it up that way). T4 notes that this problem is likely to become particularly salient in Japanese-style employment. At each step, choose the answer closest to yours, and you move on to the next question or to a remaining question. A remaining question is not an evaluation; it marks where to think next. Judgments about a particular case are left to the person following the path.","start_label":"Situation: at work","start_sub":"work from above, as one’s own","basis":"reading","vis":"public","start":"1","steps":[{"id":"1","node":"t1-spec","ask":"Has the “why” of the work been handed over in words?","why":"T4 writes that when medicine changed its concept from obedience to active participation, one of the things that supported the change was a practice of explanation: medication counseling. Medication counseling is not a command; it is an act of handing over the why. Using the terms of the earlier papers, T4 re-reads it as an explanation that puts into words and hands over the substrate of judgment (the judgment that determines how procedures are applied) and the locus of judgment. In organizations, T4 states, this language of explanation has not been sufficiently systematized.","quotes":[{"paper":"T4","text":"Medication counseling is an explanation that articulates and hands to the patient the substrate and the locus of judgment.","line":63,"anchor":"t4-2-2","match":"exact","target":"t4en-u063"},{"paper":"T4","text":"Initiatives confined to notification remain on the pre-transition side, using the instruments of compliance to seek obedience.","line":33,"anchor":"t4-1-2","match":"exact","target":"t4en-u033"}],"options":[{"key":"a","short":"Notification only","label":"No. Only notification of what has been decided","to":"A"},{"key":"b","short":"Handed over","label":"Yes","to":"2"}],"keeps":["c16"]},{"id":"2","node":"t3-direction","ask":"Have you ever been in direct contact with the people or the site that the work helps?","why":"T4 reads the ease with which purposes are shared in medicine not as a property of the domain but as arising because both patients and healthcare professionals are connected to bodily encounter with the problem. The purpose was not inside from the start; it came inside through encounter. T4 puts this as a hypothesis and notes that it is consistent with heterogeneous observations but is not causal proof. T4’s conclusion is that purposes themselves cannot be injected, but what people encounter can be designed.","quotes":[{"paper":"T4","text":"The asymmetry is not domain-specific but pathway-specific.","line":120,"anchor":"t4-4-2","match":"exact","target":"t4en-u120"},{"paper":"T4","text":"What organizations can do is not inject purposes but design enabling conditions, including encounters.","line":126,"anchor":"t4-4-2","match":"exact","target":"t4en-u126"}],"options":[{"key":"a","short":"No contact","label":"No. I know it only through documents and figures","to":"B"},{"key":"b","short":"In contact","label":"Yes","to":"3"}],"keeps":["c09"]},{"id":"3","node":"t4-undertake","ask":"Have you made the purpose of the work your own reason for judgment?","why":"T4 defines jibungoto-ka as a combination of undertaking and embodiment. Undertaking is the state in which the endorsement of an intention that came from outside, as one’s own reason for judgment, is held within a relation of giving reasons to specific others. With the obligation to answer but without that endorsement, it is the entrance to hollowing-out; an endorsement with no one to answer to remains a private resolve (T4 §2.4). Even a goal that was given, once undertaken, becomes something one is answerable for oneself. T4 writes that this differs both from knowing and from complying. Undertaking cannot be forced through explanation or command.","quotes":[{"paper":"T4","text":"It is a combination of undertaking and embodiment.","line":67,"anchor":"t4-2-3","match":"exact","target":"t4en-u067"},{"paper":"T4","text":"Undertaking, as used in this article, means the state in which the former is held within the relation of the latter.","line":77,"anchor":"t4-2-4","match":"exact","target":"t4en-u077"},{"paper":"T4","text":"Its external origin has no bearing on my becoming answerable through undertaking.","line":69,"anchor":"t4-2-3","match":"exact","target":"t4en-u069"}],"options":[{"key":"a","short":"Because told to","label":"No. I act because I was told to","to":"C"},{"key":"b","short":"Declaration only","label":"I am required to say that I have","to":"D"},{"key":"c","short":"Yes","label":"Yes","to":"4"}],"keeps":["c16","c15","c29"]},{"id":"4","node":"t4-twopath","ask":"When you raise a proposal or a concern from your side, does a reply with reasons come back?","why":"T4 distinguishes two pathways: one in which an intention is communicated from above, and one in which an orientation that employees have formed through encounter enters formal consideration, and a specific authorized person or body gives reasons whether it is adopted, deferred or stopped. What is returned is reasons, not guaranteed adoption. T4 writes that this carries to the scale of the organization the reciprocity by which the side that asks for undertaking also stands on the answering side.","quotes":[{"paper":"T4","text":"What the organization necessarily undertakes here is not the orientation itself but its own judgment about how to treat that orientation.","line":132,"anchor":"t4-4-3","match":"exact","target":"t4en-u132"},{"paper":"T4","text":"The setting in which answerability can stand is established only on reciprocity.","line":79,"anchor":"t4-2-4","match":"exact","target":"t4en-u079"}],"options":[{"key":"a","short":"No reply","label":"No. Even when I raise it, I cannot tell why it was stopped","to":"E"},{"key":"b","short":"Reply comes","label":"Yes","to":"F"}],"keeps":["c34","c33"]}],"ends":[{"id":"A","after":"1","name":"Asking why","ask":"Whom can you ask why the work is done?","note":"T4 defines the absence of an explanatory language not as the absence of all explanation but as the fact that a language for handing over, as a structure, why something is done has not been sufficiently systematized as an institution. The absence does not mean that no effect occurs. What it means, T4 writes, is that the organization cannot possess the effect as a reproducible design.","quotes":[{"paper":"T4","text":"It means, however, that the organization cannot possess the effect as a reproducible design.","line":108,"anchor":"t4-3","match":"exact","target":"t4en-u108"}]},{"id":"B","after":"2","name":"Direct encounters","ask":"Who can provide chances for direct contact with those people or that site, and how?","note":"Under its conjecture that encounter may support the formation of direction, T3 writes that what can be guaranteed is exposure to encounters, never that a direction will settle. T4 also includes orientations born of encounters outside the organization among the things the organization considers and responds to.","quotes":[{"paper":"T3","text":"it can guarantee exposure, never crystallization","line":84,"anchor":"t3-3","match":"exact"},{"paper":"T4","text":"The encounters from which Pathway 2 begins are not limited to the organization.","line":136,"anchor":"t4-4-3","match":"exact","target":"t4en-u136"}]},{"id":"C","after":"3","name":"Where it is blocked","ask":"What is lacking now: an explanation of why, chances for direct contact, or replies with reasons?","note":"T4 writes that many unsuccessful initiatives press strongly on the pathway that communicates intentions from above. What is actually blocked is often the pathway by which the organization returns reasons to orientations arising from employees. T4’s reading is that the pathway being pushed is not the pathway that is blocked.","quotes":[{"paper":"T4","text":"The pathway being pushed is not the pathway that is blocked.","line":134,"anchor":"t4-4-3","match":"exact","target":"t4en-u134"}]},{"id":"D","after":"3","name":"Empty declaration","ask":"Is what is demanded undertaking, or declaring that one has undertaken?","note":"T4 calls hollowing-out the state in which the substance of undertaking falls away while the form of the demand continues to circulate. When jibungoto-ka is treated as a value that must not be questioned, people compete not over the soundness of the content but in displays of loyalty. T4 writes that the stipulation that answerability is not an individual ability but a fact of relation provides a foothold for seeing through this failure.","quotes":[{"paper":"T4","text":"the substance of undertaking falls away while the form of the demand continues to circulate","line":158,"anchor":"t4-5-1","match":"exact","target":"t4en-u158"}]},{"id":"E","after":"4","name":"The stopper’s answer","ask":"When something is stopped, whom can you ask for the reason?","note":"T4 reads 3M’s system as an allocation in which the place of the duty to answer is moved from the side that starts something to the side that stops it: not laissez-faire, but an allocation in which whoever stops it must answer. Institutions cannot create non-transferable answerability itself, T4 writes, but they can provide the setting in which it stands. T4 notes that this is a reading of how the system functions, not a historical claim about its designers’ intentions.","quotes":[{"paper":"T4","text":"The design on the stopping side is not laissez-faire—“do not stop”—but an allocation: “whoever stops it must answer.”","line":170,"anchor":"t4-5-2","match":"exact","target":"t4en-u170"}]},{"id":"F","after":"4","name":"Answering in turn","ask":"When you ask someone to do work, do you stand on the answering side yourself?","note":"T4 lists as one form of failure the stance of demanding answers from others while not standing on the answering side oneself. Unless the one who asks treats the other as an equal subject of judgment and also stands on the answering side, T4 writes, it is merely a one-sided demand. The author’s record (THEORY_MAP) cautions that reciprocity here means giving reasons to each other, not having identical powers or identical questions.","quotes":[{"paper":"T4","text":"self-conceit first destroys the conditions under which undertaking can be established through the structure of the relationship","line":164,"anchor":"t4-5-1","match":"exact","target":"t4en-u164"}]}]},{"id":"aete","label":"Doing it yourself anyway","title":"Doing it yourself anyway: whether to keep doing what AI does better","lede":"One example of a reading that applies the distinctions of the five papers, in turn, to the situation of whether to do something yourself even though AI can do it better. T5’s theorem concerns games; it extends to other activities, where one’s end includes one’s own performance, as a question one puts to oneself. The questions here are not a yardstick for measuring people. At each step, choose the answer closest to yours, and you move on to the next question or to a remaining question. A remaining question is not an evaluation; it marks where to think next. Judgments about a particular case are left to the person following the path.","start_label":"Situation: doing it yourself anyway","start_sub":"keeping at what AI does better","basis":"reading","vis":"public","start":"1","steps":[{"id":"1","node":"t4-embody","ask":"Is your reason for doing it yourself that you need the result, that you want to make it your own, or the doing itself?","why":"There is more than one reason for doing something oneself. If only the result is needed, the question becomes how to delegate. If it is to make it one’s own, this corresponds to what T4 calls embodiment, which occurs only through the person’s actually doing it. If it is for the doing itself, this corresponds to what T5 calls participation, which is not delivered but enacted. Setting the three side by side is the reading of this path.","quotes":[{"paper":"T4","text":"This does not occur by listening to an explanation; it occurs only through the person's actually doing it.","line":69,"anchor":"t4-2-3","match":"exact","target":"t4en-u069"},{"paper":"T5","text":"The second is not delivered at all, by anyone, ever; it is enacted.","line":67,"anchor":"t5-2-2","match":"exact"}],"options":[{"key":"a","short":"Need the result","label":"Because I need the result. Having it is enough","to":"A"},{"key":"b","short":"Want to learn it","label":"Because I want to make it my own","to":"B"},{"key":"c","short":"The doing itself","label":"For the doing itself","to":"2"}],"keeps":["c37","c19"]},{"id":"2","node":"t5-objects","ask":"Do you separate where AI assists you from where you do it yourself?","why":"T5 writes that preparation, analysis, record-keeping and the role of opponent can be delegated, but participation itself has no substitute. A machine producing the result in one’s place and a machine becoming one’s opponent or one’s tool are different things. T5 concludes that AI can assist play; it cannot take one’s place in it. T5 does not claim that AI cannot play.","quotes":[{"paper":"T5","text":"Participation, in short, does not transfer.","line":79,"anchor":"t5-3-1","match":"exact"},{"paper":"T5","text":"AI can assist play. It cannot take one's place in it.","line":223,"anchor":"t5-5-4","match":"exact"}],"options":[{"key":"a","short":"Not separated","label":"No. It is either delegating everything or doing everything myself","to":"C"},{"key":"b","short":"Separated","label":"Yes","to":"3"}],"keeps":["c17"]},{"id":"3","node":"t5-apparatus","ask":"Do those around you treat doing it in earnest as something worth taking seriously?","why":"T5 writes that understanding alone may not be enough to continue. Where continuing in earnest, knowing it is a game, costs one’s standing, people tend to step down. T5 calls a dignity apparatus a cultural form that makes autotelic activity socially recognizable as worth taking seriously. This is a sociological hypothesis, and what the case shows goes no further than compatibility. T5 notes that the apparatus is an analysis of cultural conditions, not an instrument for scoring how earnest a person is.","quotes":[{"paper":"T5","text":"A dignity apparatus is a cultural form that makes autotelic activity socially recognisable as worth taking seriously","line":151,"anchor":"t5-4-3","match":"exact"},{"paper":"T5","text":"nothing here prescribes play","line":193,"anchor":"t5-4-6","match":"exact"}],"options":[{"key":"a","short":"Just play","label":"No. It is seen as mere play","to":"D"},{"key":"b","short":"They do","label":"Yes","to":"E"}],"keeps":["c30","c27","c28"]}],"ends":[{"id":"A","after":"1","name":"Hardships to let go","ask":"Of the hardships so far, which can be let go without loss?","note":"T5 divides obstacles into two kinds: those that merely sat there because time, skill and attention were scarce, and those chosen as constraints that constitute the activity. That the former disappear is delegation working as intended, and T5 writes that to take this as a loss is a mistake. Which kind one is facing has to be determined obstacle by obstacle.","quotes":[{"paper":"T5","text":"for the first time, one must determine, obstacle by obstacle, which kind one is facing","line":73,"anchor":"t5-2-3","match":"exact"}]},{"id":"B","after":"1","name":"Tasks learned by doing","ask":"Which tasks, if delegated, would leave no chance to make them your own?","note":"In T4’s case, the reading is that, had the manual measurements been replaced by automatic ones, the data would have been obtained in the same way, but the same learning would likely have been less readily produced. Leaving in place, unintentionally, the barrier of ingraining something in practice turned the act of measurement itself into a pathway for accumulating the substrate of judgment. It is a single case, and what it shows is mainly the embodiment side.","quotes":[{"paper":"T4","text":"turned the act of measurement itself into a pathway for accumulating the substrate","line":106,"anchor":"t4-3","match":"exact","target":"t4en-u106"}]},{"id":"C","after":"2","name":"Assist and substitute","ask":"Where does assisting end, and where does taking your place begin?","note":"T5 distinguishes three readings of the sentence “the machine could play it for me”: the machine could bring about the result for me (delegation); the machine could win for me (a proxy player); the machine could play in such a way that I will have played (which describes nothing). In the shogi case, preparation that studied the machine with the machine was delegated, and playing the match was not.","quotes":[{"paper":"T5","text":"There is no third task, between the first two, for a better machine to perform.","line":83,"anchor":"t5-3-1","match":"exact"}]},{"id":"D","after":"3","name":"Where it is recognized","ask":"Where is there a place in which you are treated as someone who does it in earnest?","note":"T5 writes that being awake and being absorbed do not contradict each other. The tendency to step down, T5 reads, is not a structural impossibility but a conditional one, arising where playing seriously costs standing, and may reflect a deficit of institutions. It lists four candidates: an ordering of value, a bridge into working life, a role with the highest respect, and a practice form.","quotes":[{"paper":"T5","text":"Lucid absorption is not a paradox.","line":143,"anchor":"t5-4-2","match":"exact"}]},{"id":"E","after":"3","name":"A place to answer","ask":"Is there a place where you are asked about what you did, and answer?","note":"T5 reads the kansōsen of shogi, the post-game review, as a place where players answer for their choices after the game, and writes that it is a practice form that attaches an answering seat to the playing seat. It draws three patterns from the case: staking everything, answering in public, and remaking the setting. It is a single case, and what T5 asserts goes no further than the coexistence of machine superiority and human practice.","quotes":[{"paper":"T5","text":"attaches an answering seat directly to the playing seat","line":159,"anchor":"t5-4-3","match":"exact"},{"paper":"T5","text":"this paper asserts coexistence, not mechanism","line":213,"anchor":"t5-5-3","match":"exact"}]}]}],"ai":{"walk":["Please walk with me through the Mekiki Map path “{title}”, applying it to my situation.","","How to proceed","- Ask me the questions below one at a time, following where each answer leads. Take the choice closest to my answer and move to its destination. When it is hard to tell which is closest, show me the candidates and let me choose.","- At each step, check the place in the papers that the question rests on with the Mekiki Reader ({reader}) and quote the source text briefly. If you cannot use the Reader, say so.","- Keep apart the source text, the positioning recorded by the author, and your own interpretation. The wording of the questions and choices is one example of a reading, not text from the papers.","- Leave judgments about my situation to me. A “remaining question” is not an evaluation; it is where to think next. When we arrive at one, stop there.","- At the end, give the choices we took as a one-line path code. Write only numbers and letters; do not include names of people, companies or projects.","","Form of the path code (example): {example}"],"free":["Using the nodes of the Mekiki Map, please help me put together a path that fits my situation (which distinctions to think through, and in what order).","","How to proceed","- First, ask me about my situation.","- For each node you propose, check its place in the papers with the Mekiki Reader ({reader}) and quote the source text briefly. If you cannot use the Reader, say so.","- Keep apart the source text, the positioning recorded by the author, and your own interpretation. Node names are for indexing; the definitions of terms are read in the source text.","- Narrow the nodes down to between three and eight and set them in the order to think them through. Add one line of reasoning for each step of the order. Leave judgments about my situation to me.","- At the end, give the chosen nodes as a one-line path code. Write only the codes; do not include names of people, companies or projects.","","Form of the path code (example): {example}"]},"free":{"id":"map","label":"Arrange your own","title":"Arrange your own: set the nodes in the order you would think them through","lede":"Select a node and press “Add to path”, and it is numbered in the order you would think things through. Entering a path code gives the same arrangement. The arrangement belongs to the person following it.","vis":"public"}},"guide":{"steps":[{"id":"whole","title":"The overview map","go":"chain","look":"#mapwrap","top":true,"text":"This map sets the five papers from top to bottom in reading order. Each box is a concept, and the box filled with color is the core concept of its paper. Lines are relations between concepts, and the kind of line shows the basis: solid for source text, dotted for the author’s record, dashed for interpretation."},{"id":"node","title":"Select a concept","go":"chain--t3-answer","look":"#detail","top":true,"text":"Press a box, and the details panel shows quotations from the source text for that concept. Each quotation carries its line in the paper, and “Verify” lets you check it against the source text. Press the box again, or press “Deselect”, to clear the selection."},{"id":"views","title":"View and basis","go":"slide","look":"#g-views","top":true,"text":"“View” lays another layer over the same map. “Easy to misread” adds the misreadings each paper blocks. “Prior work” adds the research the papers cite and the people who drew the same distinctions earlier. Set “Basis” to “Source text only”, and the author’s record and the interpretation disappear."},{"id":"inside","title":"Go down into a paper","go":"T3--t3-4-1-p1","look":"#map .node.sel","needs":"parts","text":"Switch “Map” to T1–T5 to get the map inside that paper. Each box is a subsection; press it and it opens in place to show the parts inside. Each part has a name, a one-line summary and its source text. Use “Next →” in the row just above the map, or the right arrow key, to move one step at a time in reading order."},{"id":"route","title":"Start from a situation","go":"route--makaseru","look":"#g-route","needs":"routes","top":true,"text":"From the situations lined up at the top of the overview, or the buttons under “Start from a situation”, choose the one closest to your own. Questions appear in turn on the same map. Choose the answer closest to yours to move to the next question; at the end you arrive at a “remaining question”. A remaining question is not an evaluation; it is where to think next. With “Copy prompt for AI” you can follow the same sequence of questions together with an AI."},{"id":"limits","title":"Follow the limits","go":"limits","look":"#g-cross","needs":"cross","top":true,"text":"This view sets out only the places where the five papers mark the edge of their own claims. You can follow, in reading order from T1 to T5, what they do not show and how far they can go."},{"id":"more","title":"Other things","go":"chain","look":"#q","top":true,"text":"Type a word into “Find”, and the boxes that match stay dark while the rest fade. Your visited marks and display choices stay on this device only. You can open this guide at any time from “How to use” at the top."}],"vis":"public"}}</script>

/* ---- from the storyline into a paper, and back ----

   says stands with its passage). The two ways have one form and one place at every exit, and the same two stand
   short in the bar of the step buttons, so that the choice is met where the eye already is. A walk through a paper
   ends with the way back out to that exit. */

   reading layer); otherwise the subsections */

function walkCount(P){
  var ord = walkAll(P), fine = ord === P.order.part, done = ord.filter(function(n){ return seen(P.p.id, n.id); }).length;
  return done ? fmt(fine ? 'Parts visited {0} / {1}' : 'Subsections visited {0} / {1}', done, ord.length) : fmt(fine ? '{0} part{0s}' : '{0} subsection{0s}', ord.length);
}
function exitIndex(pid){ return CHAP[pid] ? CHAP[pid] + STEPS[CHAP[pid] - 1].n - 1 : 0; }

}
function miniOff(){

  var d = $('#detail'), b = d.previousSibling;      /* back to the very place: before the white space that stood between the map and the panel */

    var s = R.step[s0.id], k = st.done[s.id], o = k !== undefined ? optOf(s, k) : null, on = cur && cur.id === s.id;

  h += '<p class="rd-acts"><button type="button" class="tool sm" data-rform="map">View on the map</button><button type="button" class="tool sm" data-rproxy="#rreset">Start over</button></p>';

/* the walk as a row of places: the questions answered and the place one stands at, or the nodes set out */

function rstep(d){
  var R = RB[state.rid]; if (!R) return;
  var st = R.free ? null : walkState(R), seq = rseq(R, st), i = state.sel && state.sel.t === 'n' ? seq.indexOf(state.sel.id) : -1;
  var j = i < 0 ? (d > 0 ? 0 : seq.length - 1) : i + d;
  if (j < 0 || j >= seq.length) return;
  state.sel = {t: 'n', id: seq[j]}; render(); revealNode(rnode(R, seq[j]));

function choose(R, sid, key){
  var s = R.step[sid], o = s && optOf(s, key), i = -1; if (!o) return;
  state.walk.forEach(function(w, k){ if (w.s === sid) i = k; });
  if (i < 0 || state.walk[i].o !== key) {
    if (i >= 0) state.walk = state.walk.slice(0, i);              /* answered before: what came after is dropped */
    else if (walkState(R).cur !== sid) state.walk = [];           /* not where the walk stands: it starts over from here */
    state.walk.push({s: sid, o: key});
    remember(R);
  }
  var to = R.step[o.to] ? R.step[o.to].node : R.endNode[o.to].id;
  state.sel = {t: 'n', id: to}; render();
  if (stacked()) $('#detail').scrollIntoView({block: 'start', behavior: REDUCED ? 'auto' : 'smooth'}); else revealNode(rnode(R, to));
}
function applyCode(text){
  var p = parseCode(text);
  if (p.err) { RMSG = p.err; $('#rmsg').textContent = p.err; return false; }
  state.scene = 'route'; state.rid = p.R.id; state.walk = p.walk || []; state.free = p.free || [];
  if (state.level < TOP) state.level = TOP;
  remember(p.R);
  var here = p.R.free ? (state.free.length ? byId[state.free[state.free.length - 1]] : null) : (state.walk.length ? hereNode(p.R, walkState(p.R)) : null);
  state.sel = here ? {t: 'n', id: here.id} : null;
  render(); if (here) revealNode(here);
  return true;
}
/* the text to hand to an assistant: how to walk the route together, the questions with their answers and where
   their quotations stand, and the form of the code to give back. Explanations are left out on purpose: the
   assistant is asked to read the passages itself. */
function aiText(R){
  var out = (RT.ai[R.free ? 'free' : 'walk'] || []).map(function(x){ return x.replace('{title}', R.r.title).replace('{reader}', META.reader).replace('{example}', exampleCode(R)); });
  function src(qs){ return qs.map(function(q){ return q.paper + ' ' + secLabel(q.anchor, q.paper) + ' L' + q.line; }).join(', '); }
  out.push('');
  if (R.free) {
    out.push('Table of nodes (code, name, paper and section)');
    D.nodes.forEach(function(n){ if (n.kind === 'concept' && CODE[n.id]) out.push(CODE[n.id] + ' ' + n.label + (n.sub ? ' (' + n.sub + ')' : '') + ' ' + src((n.quotes || []).slice(0, 1))); });
  } else {
    out.push('Questions and choices (in parentheses: the node where the question stands, and the place in the source text)');
    R.r.steps.forEach(function(s){
      var n = byId[s.node];
      out.push(s.id + ' ' + s.ask + ' (' + n.paper + ' “' + n.label + '”. ' + src(s.quotes) + ')');
      s.options.forEach(function(o){ out.push('  ' + o.key + ' ' + o.label + ' → ' + (R.step[o.to] ? fmt('Question {0}', o.to) : fmt('Remaining question {0}', o.to))); });
    });
    out.push('', 'Remaining questions');
    R.r.ends.forEach(function(z){ out.push(z.id + ' ' + z.ask + ' (' + src(z.quotes) + ')'); });
  }
  return out.join('\n');
}
function copyText(text, done){

}

document.addEventListener('click', function(ev){
  var into = ev.target.closest('[data-route]');
  if (into) { enterRoute(into.dataset.route); if (state.scene === 'route' && into.dataset.at) { state.sel = {t: 'n', id: into.dataset.at}; render(); revealNode(byId[into.dataset.at]); } return; }
  var b = ev.target.closest('[data-opt],[data-rgo],[data-ract]'), R = RB[state.rid];
  if (!b || state.scene !== 'route' || !R) return;

  if (b.dataset.opt) { var p = b.dataset.opt.split(':'); choose(R, p[0], p[1]); return; }
  if (b.dataset.rgo !== undefined) {
    var id = b.dataset.rgo; state.sel = id ? {t: 'n', id: id} : null; render();
    if (id) revealNode(rnode(R, id)); else if (!b.closest('#rtrail') && !readOn()) $('#mapwrap').scrollIntoView({block: 'nearest'});
    return;

/* ---------- narrow screens ----------
   What changes on a phone, beyond the style sheet: the details become a sheet (sheetOn, sheetSync), what was chosen
   is kept in the part of the screen the sheet leaves free (sheetReveal, and the branch in revealNode), and the words
   above the map are cut to three lines (capFix). None of this runs in a wide window: each begins by asking narrow(). */
var SHEET_KEY = '';

/* the words above the map are kept to three lines on a narrow screen, with a way to read the rest */
var CAP_FULL = false, CAP_KEY = '';
function capFix(){
  var c = $('#caption'), old = c.querySelector('.cap-more'); if (old) old.remove();

  var t = c.firstChild;

  var sp = c.querySelector('.cap-t'); if (!sp) return;
  var key = sp.textContent.slice(0, 48); if (key !== CAP_KEY) { CAP_KEY = key; CAP_FULL = false; }
  var lh = parseFloat(getComputedStyle(sp).lineHeight) || 21.5;

  c.appendChild(b);

function sheetSync(){
  var on = sheetOn(), b = document.body, box = $('#detail'), t = $('#sheet-tgl');
  capFix();

  var key = selKey();
  if (key !== SHEET_KEY) b.classList.remove('low');      /* a new choice opens the sheet again */
  b.classList.add('sheet');
  if (!t) { t = document.createElement('button'); t.type = 'button'; t.id = 'sheet-tgl'; t.className = 'sheet-tgl'; t.innerHTML = '<i></i><span></span>'; }
  if (box.firstChild !== t) box.insertBefore(t, box.firstChild);
  var low = b.classList.contains('low'), h2 = box.querySelector('h2');
  t.setAttribute('aria-expanded', low ? 'false' : 'true');
  t.lastChild.textContent = low ? 'Show details' + (h2 ? ': ' + h2.textContent.slice(0, LANG === 'ja' ? 22 : 34) : '') : 'Hide details';
  if (key !== SHEET_KEY) {

/* The step buttons stand above the map, and go out of sight when the map is scrolled down. The details stay in sight

  try { navigator.clipboard.writeText(text).then(function(){ toast('SVG copied'); }, fallback); } catch (e) { fallback(); }

function routeKey(){ return state.scene === 'route' ? state.rid + ':' + walkCode(RB[state.rid]) : ''; }

window.addEventListener('hashchange', function(){

  if (!state.story && /^#story(--|$)/.test(location.hash)) writeHash();      /* a stop was asked for where the storyline is not shown: the address says what is in sight */
});

$('#badge').hidden = BUILD === 'public' || (BUILD === 'release' && !META.preview);
$('#pubwrap').hidden = BUILD !== 'internal';
$('#ver').innerHTML = esc('v' + META.version + ' · ' + META.stage) + '<span class="v-corpus">' + esc(' · corpus ' + META.corpus_version) + '</span>';

readHash(); if (!location.hash.replace(/^#/, '') && frontOK()) state.front = true;
