<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mekiki Map (English)</title><meta name="description" content="How much to hand over to AI, and what to do yourself: a framework for rethinking this in situations at work and in learning (the Mekiki Framework), and a guide map to it."><meta property="og:type" content="website"><meta property="og:site_name" content="Mekiki Map"><meta property="og:title" content="Mekiki Map (English)"><meta property="og:description" content="How much to hand over to AI, and what to do yourself: a framework for rethinking this in situations at work and in learning (the Mekiki Framework), and a guide map to it."><meta name="twitter:card" content="summary"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a pathway figure with two arrangements of the same nodes and lines. Vertical (default): the five
   papers are tiers stacked in reading order, like a signalling cascade drawn from membrane to nucleus, and
   the kinds of things a paper identifies are lines inside its tier. Horizontal: the six kinds are rows and
   the papers are columns. Controls above the figure, the selected item's sources beside it. */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#17202A; --ink-2:#4B5665; --ink-3:#7C8796; --line:#D6DCE4; --line-2:#B9C2CE;
  --band:#EEF1F5; --focus:#1F6FEB;
  --t1:#2C6CB4; --t1-bg:#E8F0FA; --t2:#148776; --t2-bg:#E2F3EF; --t3:#6F55C2; --t3-bg:#EEEAFA;
  --t4:#A85C1C; --t4-bg:#F8EDE1; --t5:#B13659; --t5-bg:#FAE8EE;
  --stop:#B3261E; --stop-bg:#FCEDEC; --route:#E8A600; --route-bg:#FFF2C2; --route-ink:#1C1500;
  --font:"IBM Plex Sans","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151B; --surface:#171E26; --ink:#E7ECF2; --ink-2:#AEB8C4; --ink-3:#7D8896; --line:#2B3541; --line-2:#3E4A58;
    --band:#121920; --focus:#6CA8FF;
    --t1:#7DB0EE; --t1-bg:#1A2A3D; --t2:#56C9B4; --t2-bg:#15302C; --t3:#B09CF3; --t3-bg:#292441;
    --t4:#E2A066; --t4-bg:#38291A; --t5:#EE88A6; --t5-bg:#3B1E2A;
    --stop:#F2857C; --stop-bg:#3A1E1C; --route:#F5C542; --route-bg:#3A3010; --route-ink:#1C1500; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151B; --surface:#171E26; --ink:#E7ECF2; --ink-2:#AEB8C4; --ink-3:#7D8896; --line:#2B3541; --line-2:#3E4A58;
  --band:#121920; --focus:#6CA8FF;
  --t1:#7DB0EE; --t1-bg:#1A2A3D; --t2:#56C9B4; --t2-bg:#15302C; --t3:#B09CF3; --t3-bg:#292441;
  --t4:#E2A066; --t4-bg:#38291A; --t5:#EE88A6; --t5-bg:#3B1E2A;
  --stop:#F2857C; --stop-bg:#3A1E1C; --route:#F5C542; --route-bg:#3A3010; --route-ink:#1C1500; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.65 var(--font);-webkit-text-size-adjust:100%}
.app{max-width:1760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
a{color:inherit;text-underline-offset:2px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.top h1{margin:0;font-size:21px;font-weight:600;letter-spacing:.01em}
.badge{font:500 11px var(--mono);padding:2px 8px;border:1px solid var(--stop);color:var(--stop);border-radius:999px}
.ver{font:400 11.5px var(--mono);color:var(--ink-3)}
/* the version, the way back to the cover and the link to the other language. On a wide window they are items of the
   heading's row like the rest; on a phone they make the second row together (below) */
.vrow{display:contents}
/* the way to the same page in the other language (shown only when the build names one), and the note on a passage
   read in an edition other than the original */
a.tool{display:inline-block;text-decoration:none;color:var(--ink)}
.ed{display:block;font-size:11px;color:var(--ink-3)}
.lede{margin:0;flex-basis:100%;color:var(--ink-2);font-size:13.5px;max-width:70em}

.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end}
.grp{display:flex;flex-direction:column;gap:4px;min-width:0}
.grp>span{font-size:11px;letter-spacing:.06em;color:var(--ink-3)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:hover:not([aria-pressed="true"]){background:var(--band)}
.grp input[type="search"]{border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:6px 10px;width:13em;max-width:100%}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;padding-bottom:6px;cursor:pointer}
.tool{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.tool:hover{background:var(--band)}

.caption{margin:0;padding:10px 14px;border-left:3px solid var(--ink-3);background:var(--surface);font-size:13.5px;max-width:86em;border-radius:0}
.caption small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}

.work{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}
.work.wide{grid-template-columns:minmax(0,1fr)}
.work.wide .detail{position:static;max-height:none}
.mapwrap{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
#map{display:block;width:100%;min-width:880px;height:auto;margin:0 auto}
.detail{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px 16px 20px;min-width:0}
/* the padding above the bar belongs to the details; the shadow keeps scrolled text from showing through it */
.dnav{position:sticky;top:0;z-index:1;display:flex;gap:6px;margin:0 -16px 10px;padding:0 16px 8px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 -17px 0 var(--surface)}
.dnav .tool{flex:0 0 auto}
.rfline{margin:0 0 10px}
.enter.go{border-color:var(--ink);font-weight:600;padding:7px 14px;margin:2px 0 4px}
/* a way on, as a button of two lines (where it leads; what is found there). The ways of an exit stand one under the other */
.ways{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.enter.way{display:block;width:100%;margin:0;padding:7px 12px 8px;border-left-width:4px;text-align:left;font-family:inherit}
.enter.way b{display:block;font-size:13.5px;font-weight:600;line-height:1.45}
.enter.way span{display:block;margin-top:1px;font-size:11.5px;line-height:1.45;color:var(--ink-2)}
.dnav .way{border-color:var(--c,var(--line-2));background:var(--cbg,var(--surface));font-weight:600}
.kinds{list-style:none;margin:0 0 10px;padding:0;font-size:13.5px}
.kinds li{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;padding:3px 0 3px 10px;border-left:2px solid var(--line-2)}
.detail .kinds .en{margin:0}
.detail .hand{margin-top:14px}
.detail h2{margin:0 0 2px;font-size:16.5px;font-weight:600;line-height:1.4;text-wrap:balance}
.detail .en{font:400 12px var(--mono);color:var(--ink-3);margin:0 0 8px;overflow-wrap:anywhere}
.detail h3{margin:16px 0 6px;font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:8px}
.detail h3::after{content:"";flex:1;border-top:1px solid var(--line)}
.detail p{margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.b-text{border-style:solid;border-color:var(--ink)}
.chip.b-record{border-style:dotted;border-width:1.5px;border-color:var(--ink-2)}
.chip.b-reading{border-style:dashed;border-color:var(--ink-3)}
.chip.pp{border-color:var(--c);color:var(--c);font-family:var(--mono)}
.chip.int{border-color:var(--stop);color:var(--stop)}
blockquote{margin:0 0 4px;padding:8px 10px;border-left:2px solid var(--ink);background:var(--bg);font-size:13px;line-height:1.6;overflow-wrap:anywhere}
blockquote.rec{border-left:2px dotted var(--ink-2)}
.src{margin:0 0 10px;font:400 11px var(--mono);color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 10px}
.src a{color:var(--ink-2)}
.read{border-left:2px dashed var(--ink-3);padding:6px 10px;margin:0 0 8px;font-size:13.5px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px;margin:0 0 8px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.rows{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.rows li{padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.rows .wrong{color:var(--stop);text-decoration:line-through;text-decoration-thickness:1px}
.rows button{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.empty{color:var(--ink-2);font-size:13.5px}
.x{float:right;border:1px solid var(--line-2);background:transparent;border-radius:6px;padding:0 8px;cursor:pointer;font-size:13px;line-height:1.7}

.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px 24px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;font-size:13px}
.legend h2,.list h2,.notes h2{grid-column:1/-1;margin:0 0 4px;font-size:12px;letter-spacing:.06em;color:var(--ink-3);font-weight:500}
.legend div{display:flex;align-items:center;gap:10px;min-width:0}
.legend svg{flex:none}
.legend p{grid-column:1/-1;margin:6px 0 0;color:var(--ink-2);font-size:12.5px}

.list{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;min-width:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--ink-3);font-size:11.5px;letter-spacing:.04em;white-space:nowrap}
td button{border:0;background:transparent;padding:0;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:2px}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.notes{font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.notes p{margin:0;max-width:92em}
.notes h3{margin:6px 0 0;font-size:12px;letter-spacing:.06em;color:var(--ink-3);font-weight:500}
.notes .rows{max-width:92em;margin:2px 0 6px;font-size:12.5px}
.notes .rows a{font:400 12px var(--mono);overflow-wrap:anywhere}
.notes code{font:400 11.5px var(--mono)}
.notes .rd-more{margin:6px 0 0;max-width:92em}
.notes .rd-more>summary{font-size:12.5px}
.notes .rd-more[open]>summary{margin-bottom:6px}
.notes .rd-more p{margin:0 0 4px}
.notes .cks{margin:4px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:2px}
.guide{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));margin-inline:auto;max-width:700px;bottom:calc(14px + env(safe-area-inset-bottom,0px));box-sizing:border-box;background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:12px;padding:12px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.22);z-index:15}
.guide .g-head{display:flex;align-items:baseline;gap:10px}
.guide .g-no{font:500 12px var(--mono);color:var(--ink-3)}
.guide h2{margin:0;font-size:15.5px;font-weight:600}
.guide .x{float:none;margin-left:auto}
.guide p{margin:8px 0 10px;font-size:14px;line-height:1.8;max-width:none}
.guide .g-nav{display:flex;align-items:center;gap:8px}
.guide .g-dots{margin-left:auto;display:flex;gap:6px}
.guide .g-dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.guide .g-dots i.on{background:var(--ink)}
.guide-look{outline:3px solid var(--route);outline-offset:4px;border-radius:8px}
body.guiding .app{padding-bottom:230px}
@media (max-width:640px){body.guiding .app{padding-bottom:300px}}
#map .node.guide-look{outline-offset:6px}
#guide-open{align-self:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
textarea.fallback{width:100%;height:120px;font:11px var(--mono);margin-top:8px}

@media (max-width:1120px){
  .work{grid-template-columns:minmax(0,1fr)}
  .detail{position:static;max-height:none}
}
/* Narrow screens: a phone held upright (told by the width alone), or lying on its side (told by a low screen that
   is touched with a finger, so that no window on a desk is taken for one). Nothing here applies to a wide window.
   Three things change. The switches fold away behind one button, and only the ways in stay on the first screen.
   The details come up from the bottom of the screen (from the side, when the phone lies on its side) instead of
   lying under the map. The map is drawn at one size on every phone, the size at which its words can be read, and
   is moved sideways with a finger. Which things share a row is fixed by rule and not by what happens to fit, so
   the arrangement is the same on every model; only the lengths follow the width of the screen. */
#more,#zall,.sheet-tgl{display:none}
@media (max-width:720px), (pointer:coarse) and (max-height:480px){
  .app{gap:12px;padding-block:14px 40px}
  .top{gap:4px 10px}
  .top h1{font-size:19px;order:1}
  .badge{order:2}
  #guide-open{order:3;margin-left:auto}
  /* the second row: the version at the left; at the right the way back to the cover and the link to the other
     language. The row is one box, so what stands in it does not depend on how much the first row holds. When the
     way back to the cover is there, the version of the corpus is left to the foot of the page (it is said there). */
  .vrow{display:flex;order:4;flex:1 0 100%;min-width:0;gap:10px;align-items:baseline}
  .vrow .ver{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top.has-front .v-corpus{display:none}
  .lede{order:5;font-size:13px}
  .lede:not(.full){display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
  .controls{gap:8px 12px}
  .controls>.grp{flex:1 1 100%;align-items:flex-start}
  .controls>#g-cross{flex:1 1 0;min-width:0}      /* shares its row with "more" at any width: where its buttons are longer than the room, they move sideways */
  .controls>#g-cross .seg button{padding-left:9px;padding-right:9px}      /* three names in the room beside "more": a little closer, so that they fit on most phones */
  .controls>:not(.pri){order:3}
  .controls>#more{order:1;margin-left:auto}
  .controls>#g-zoom{order:2}
  .controls:not(.open)>:not(.pri):not(#more){display:none}
  .seg{flex-wrap:nowrap;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:0 0 auto;min-height:40px}
  .tool{min-height:40px}
  .tool.sm{min-height:36px}
  .grp input[type="search"]{width:100%;min-height:40px;font-size:16px}     /* under 16px, a phone enlarges the whole page when the field is entered */
  .rcode input{font-size:16px}
  .chk{flex:1 1 100%;min-height:36px;padding-bottom:0}
  #more{display:inline-flex;align-items:center}
  #panel{display:none}
  .caption{font-size:13px}
  .caption .cap-t{display:block}
  .caption:not(.full) .cap-t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
  .caption.long{cursor:pointer}
  .caption small{display:inline;margin-right:10px}
  .cap-more{border:0;background:none;padding:4px 0;margin:0;font-size:12px;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
  #map{min-width:1132px}
  .controls>.pri:first-child{position:relative}
  #zall{display:block;position:absolute;right:0;top:-9px;border:0;background:none;padding:7px 0 7px 14px;font-size:12px;line-height:1.5;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
  .navhint{margin:0;display:flex;align-items:center;gap:10px;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
  .navhint span{flex:1;min-width:0}
  .legend{grid-template-columns:minmax(0,1fr)}
  .x{min-height:32px;padding:0 12px}
  /* a finger leaves the last thing it pressed looking pressed: where nothing can hover, the hover tints are dropped */
  @media (hover:none){
    .tool:hover{background:var(--surface)}
    .seg button:hover:not([aria-pressed="true"]),.crumbs button:hover{background:transparent}
  }
  .src{gap:2px 14px}
  .src a{display:inline-block;padding:4px 0}
  body.sheet .app{padding-bottom:62vh;padding-bottom:calc(58dvh + 24px)}
  body.sheet.low .app{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  body.sheet #detail{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:15;max-height:56vh;max-height:56dvh;overflow:auto;overscroll-behavior:contain;
    border-radius:16px 16px 0 0;border-width:1px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.22);
    padding:0 max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  body.sheet.low #detail{max-height:calc(46px + env(safe-area-inset-bottom,0px));overflow:hidden}
  body.sheet .sheet-tgl{display:flex;position:sticky;top:0;z-index:2;width:100%;min-height:46px;margin:0 0 4px;padding:6px 0 4px;border:0;background:var(--surface);
    flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
  body.sheet .sheet-tgl i{display:block;width:38px;height:4px;border-radius:2px;background:var(--line-2)}
  /* the step buttons stay under the handle of the sheet while the sheet is scrolled */
  body.sheet .dnav{top:46px;margin:0 0 10px;padding:4px 0 8px;box-shadow:none}
  body.sheet .dnav .tool{flex:1 1 0;min-height:40px}
  /* three buttons (an exit of the storyline, the end of a walk): each as wide as its words ask */
  body.sheet .dnav.fork .tool{flex:1 1 auto;padding-left:8px;padding-right:8px}
}
/* a phone lying on its side: there is little height, so the heading takes one row and the details stand at the right */
@media (pointer:coarse) and (max-height:480px) and (min-width:560px){
  .vrow{display:contents}
  .vrow .ver{order:3;flex:0 1 auto}
  #front-open,#guide-open,#alt-lang{order:4}
  .controls>.pri{flex:0 1 auto}
  .controls>#g-cross{order:1;flex:1 1 0;min-width:0}
  .controls>#more{order:2}
  .controls>#g-route{order:3;flex:1 1 100%}
  .controls>:not(.pri):not(#more){order:5}
  .controls>#g-zoom:not(.pri){order:4}
  .controls>.grp:not(.pri),.controls>.chk{flex:0 0 calc(50% - 6px)}
  body.sheet:not(.low) .app{padding-bottom:40px;padding-right:calc(min(44vw,360px) + 12px)}
  body.sheet:not(.low) #detail{left:auto;top:0;width:min(44vw,360px);max-height:none;border-radius:16px 0 0 16px;border-width:0 0 0 1px;box-shadow:-8px 0 28px rgba(0,0,0,.22);padding-left:16px}
  body.sheet:not(.low) .sheet-tgl i{display:none}
  body.sheet.low #detail{left:auto;width:min(44vw,360px);border-radius:16px 0 0 0;border-width:1px 0 0 1px;padding-left:16px}
}

/* figure */
.p-T1{--c:var(--t1);--cbg:var(--t1-bg)} .p-T2{--c:var(--t2);--cbg:var(--t2-bg)} .p-T3{--c:var(--t3);--cbg:var(--t3-bg)}
.p-T4{--c:var(--t4);--cbg:var(--t4-bg)} .p-T5{--c:var(--t5);--cbg:var(--t5-bg)}
#map text{font-family:var(--font)}
.band-bg{fill:var(--band)} .band-bg.alt{fill:none}
.band-lbl{font-size:12.5px;font-weight:600;fill:var(--ink)}
.band-en{font-size:9.5px;fill:var(--ink-3)}
