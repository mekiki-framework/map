tand behind","papers":["T2"],"basis":"record","src":"THEORY_MAP"},{"id":"c08","wrong":"Sin = Sein","keep":"Institutionalized normativity versus factual judgment","papers":["T2"],"basis":"record","src":"THEORY_MAP"},{"id":"c09","wrong":"Direction proposal = direction ownership","keep":"Candidate supplied from outside versus commitment taken up as one's own","papers":["T3"],"basis":"record","src":"THEORY_MAP"},{"id":"c10","wrong":"Distributed agency = distributed answerability","keep":"Components may distribute; answerability does not","papers":["T3"],"basis":"record","src":"THEORY_MAP"},{"id":"c11","wrong":"Answerability = accountability","keep":"Non-transferable second-personal standing versus allocable institutional responsibility","papers":["T3"],"basis":"record","src":"THEORY_MAP"},{"id":"c12","wrong":"Answerability = agency","keep":"A relation of address and response versus a family of capacities or components","papers":["T3"],"basis":"record","src":"THEORY_MAP"},{"id":"c13","wrong":"Standing = competence","keep":"Who must answer versus how well that person can answer","papers":["T3"],"basis":"record","src":"THEORY_MAP"},{"id":"c14","wrong":"AI self-explanation = AI standing","keep":"Produced reasons or interpretability evidence do not establish a second-personal relation","papers":["T3"],"basis":"record","src":"THEORY_MAP"},{"id":"c15","wrong":"Jibungoto-ka = psychological ownership or engagement","keep":"A relational undertaking held in answerability versus a measured felt state","papers":["T4"],"basis":"record","src":"THEORY_MAP"},{"id":"c16","wrong":"Undertaking = compliance","keep":"Internal endorsement held toward specific others versus following instructions","papers":["T4"],"basis":"record","src":"THEORY_MAP"},{"id":"c17","wrong":"T5 claims AI cannot play","keep":"T5 makes no such claim; even a genuine AI player's play is its own play — another agent's participation is never mine","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c18","wrong":"Answerability (T3) = participation (T5)","keep":"Two distinct roots: one can answer for an output without having walked the path, and play without answering to anyone","papers":["T3","T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c19","wrong":"Undertaking (T4) = lusory attitude (T5)","keep":"Undertaking is the hinge concept, but T5 does not redescribe organizational undertaking as play","papers":["T4","T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c20","wrong":"Agent-relative fact = an inexpressibly first-person fact","keep":"T5 uses Nagel's terminology derivatively; A can be named in the third person, but substituting B changes the fact","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c21","wrong":"Moral-luck footnote = a solution to moral luck or a theory of desert","keep":"The footnote proposes limiting effects on recognition of standing, while leaving performance appraisal open","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c22","wrong":"Non-transferability theorem = dignity","keep":"The theorem establishes agent-relative non-substitutability; dignity requires a separate constructive normative argument","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c23","wrong":"Functional equivalence = Kantian equivalence in value","keep":"Outcome equivalence relative to a task differs from semantic non-substitutability and from equivalence in value","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c24","wrong":"Dignity = standing = face = appraisal respect","keep":"Basic normative status, relational position, interactional social value, and graded assessment of excellence","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c25","wrong":"Playing seat = answering seat","keep":"Participation and answerability are independent; a practice may connect them without making them identical","papers":["T3","T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c26","wrong":"Visibility thesis = theorem","keep":"The visibility thesis is an interpretive claim, not an analytic consequence","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c27","wrong":"Apparatus thesis = demonstrated causal mechanism","keep":"It is a sociological hypothesis; the historical case establishes compatibility and offers a candidate mechanism only","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c28","wrong":"Performance score = participant standing","keep":"Outcomes may be scored; such scores do not measure standing or authenticity of undertaking","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c29","wrong":"External constraint = absence of undertaking","keep":"External constraints may be undertaken; command alone cannot constitute uptake","papers":["T4","T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c30","wrong":"Dignity apparatus = management technique","keep":"Scoring the authenticity of individuals' play or commanding enjoyment is excluded by the framework's own criterion","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c31","wrong":"T5 = substitution theory (\"games replace work/care as meaning\")","keep":"T5 claims one value was never transferable, not that play should replace other goods","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c32","wrong":"The series = \"play is the last human stronghold\"","keep":"T1–T5 identify different kinds of non-transferables, not a residual domain where humans hide","papers":["T1","T2","T3","T4","T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c33","wrong":"T3 permits one-way interrogation; only T4 requires reciprocity","keep":"T3 §5.4 makes the educator answerable too; T4 develops an organizational two-pathway implementation. Reciprocal obligations do not require identical roles","papers":["T3","T4"],"basis":"record","src":"THEORY_MAP"},{"id":"c34","wrong":"Reverse pathway = suggestion box","keep":"Reasons must be returned for adoption, deferral, or termination; collection alone is not the pathway","papers":["T4"],"basis":"record","src":"THEORY_MAP"},{"id":"c35","wrong":"知好楽の「楽」 = pleasant mood = dignity","keep":"T5 reads lucid absorption; neither pleasure nor non-substitutability alone establishes dignity","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c36","wrong":"Shibusawa's shumi = hobby only","keep":"T5 selects the ideal-bearing aspect of a polysemous usage; no one-to-one Kantian classification","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c37","wrong":"Play as specimen = all activities are games","keep":"Formal theorem (§3.1), first-person corollary (§3.5), and application limits (§4.6) remain distinct","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c38","wrong":"AI-Assisted = AI-Accelerated","keep":"T1–T3 examine AI assisting individual work; T4 examines AI accelerating the organizational system","papers":["T4"],"basis":"record","src":"THEORY_MAP"}],"claims":[{"id":"T5-A1","status":"analytic theorem (paper's classification)","claim":"Another agent can realise the goal state without thereby making it true that A pursued that goal under constitutive constraints A accepted as reasons. The formal theorem concerns games.","section":"3.1","source_quote":"But the fact that A pursued p under R, with the constraints accepted as reasons, does not thereby obtain; and no further performance by the other agent can make it obtain, because A's having played is not a causal consequence of p that a sufficiently capable agent could also bring about.","not_claimed":["AI cannot play or have moral status.","The theorem alone establishes dignity.","Every contribution to an activity must be performed unaided."],"line":79},{"id":"T5-T1","status":"terminological attribution and derivative use (v3 clarification)","claim":"T5 attributes agent-relative reasons to Nagel following Parfit, then explicitly uses the term derivatively for the non-substitutability of a participation fact. The indispensable reference is to A, not to a first-person pronoun.","section":"3.1","source_quote":"Following Parfit's terminology (1984), Nagel (1986, pp. 152–153) calls a reason agent-relative when its general form includes an essential reference to the person who has it. The participation-based reason at issue here has that form: its content refers essentially to A's own participation, not merely to the realisation of p. I use *agent-relative* derivatively for the theorem's non-substitutability: the corresponding participation fact must identify A, because replacing A with B yields a different fact.","not_claimed":["Nagel directly theorises T5's participation facts.","Every reason to play is agent-relative.","The fact cannot be described in the third person."],"line":81},{"id":"T5-A2","status":"criterion proposed and used by the paper (not a separate proven theorem)","claim":"Undertaking concerns the agent taking the goal and constraints as reasons and being treated accordingly by the practice. Causal provenance and design documents are proxies in the current use-context, not the criterion.","section":"3.2","source_quote":"The dividing line is not where the goal came from but what happened to it on arrival: whether the goal and its constraints are undertaken by the agent as the agent's own reasons — and, on the side that can be observed, whether the agent is treated by the practice as a participant who has so undertaken them.","not_claimed":["External origin of rules rules out later uptake.","Private inner experience is the proposed test.","Any institutional label is by itself sufficient proof of undertaking."],"line":93},{"id":"T5-A3","status":"scope clarification","claim":"The theorem is independent of the status of AI. Another genuine player's participation is still not A's. The playing seat and answering seat are distinct.","section":"3.3","source_quote":"The theorem is agent-relative, and agent-relativity is untouched by every possible outcome of the status debate.","not_claimed":["Human biological status is the theorem's premise.","Task superiority makes someone's participation interchangeable."],"line":103},{"id":"T5-A4","status":"first-person corollary and scope limitation","claim":"Section 3.1 is formally about games; Section 3.5 generalises its structure where the agent's end includes their own performance. Application remains bounded by §4.6.","section":"4.4","source_quote":"The formal theorem in Section 3.1 concerns games. Section 3.5 states a first-person corollary that generalises its structure to activities in which the agent's end includes the agent's own performance.","not_claimed":["All activities are games.","All work should be treated as play.","Safety and reproducibility constraints should be removed to protect personal participation.","Play is merely the opposite domain to work, or selecting it as a specimen universalises the formal theorem."],"line":179},{"id":"T5-N1","status":"constructive normative extension","claim":"T5 distinguishes the theorem's agent-relative non-substitutability from Kantian equivalence in value. Using the latter vocabulary is a further normative step, not a result of the theorem alone.","section":"4.4","source_quote":"The theorem establishes that the participation fact is agent-relative and non-substitutable. It does not by itself establish dignity. The further normative claim is that, once an agent's undertaking is treated as reason-bearing — the criterion of Section 3.2 — functionally equivalent outcomes cannot exhaust what is owed in recognising that agent.","not_claimed":["Semantic non-identity is identical to Kant's criterion of value.","Kant himself classifies play or participation as dignity.","The theorem proves the separate normative extension.","Delight in the Analects triad is mere positive mood, or feeling pleasure establishes dignity.","Shibusawa's shumi means hobby alone, or its entire usage maps to one Kantian category."],"line":171},{"id":"T5-N2","status":"constructive recognition model","claim":"The apparatus makes recognition of standing socially operative while leaving performance open to appraisal. Dignity, standing, face, and appraisal respect remain distinct; participation alone does not entail answerability.","section":"4.4","source_quote":"The apparatus secures a recognition floor while leaving performance open to appraisal.","not_claimed":["The apparatus confers or revokes Kantian dignity.","Game scores or performance evaluation are prohibited.","Public stature and institutional standing are interchangeable.","Every player must answer to a questioner."],"line":175},{"id":"T5-N3","status":"bounded institutional analogy (v3 moral-luck footnote)","claim":"The moral-luck footnote concerns allowing uncontrolled outcomes or constitutive traits to alter the recognition floor. Kant AA 4:394 concerns good will retaining worth under adverse fortune; AA 4:434–435 concerns price/dignity. The note proposes limiting effects on standing, not solving moral luck or developing a theory of desert.","section":"4.4","source_quote":"The requirement that the recognition floor be insensitive to outcome is an institutional analogue of the problem of moral luck (Williams 1981; Nagel 1979). Allowing that floor to vary with outcomes beyond the participant's control would introduce luck in how things turn out, commonly termed resultant luck; allowing it to vary with constitutive traits such as temperament would introduce constitutive luck. The analogy with Kant is that a good will retains its full worth even when adverse fortune prevents it from achieving its end (AA 4:394). I do not attempt to resolve moral luck here; the apparatus thesis proposes one way practices can limit its effects on standing, not a theory of desert.","not_claimed":["Nagel coined the phrase resultant luck.","T5 solves moral luck.","Results may never be appraised.","Kant defines price versus dignity at AA 4:394."],"line":175},{"id":"T5-I1","status":"interpretive thesis","claim":"AI making functionally equivalent outputs available at scale can be read as making outcome-equivalence versus participant-relative history salient. This is not entailed by the theorem.","section":"4.4","source_quote":"The visibility thesis is an interpretive thesis: where AI makes functionally equivalent outputs newly available at scale, the distinction between outcome-equivalence and participant-relative history becomes salient.","not_claimed":["The theorem proves public reaction to AI.","Visibility is a measured universal causal effect."],"line":181},{"id":"T5-S1","status":"sociological hypothesis","claim":"Where standing has been tied to scarce excellence, public exposure of output substitutability may be experienced as humiliation unless recognition is not exhausted by comparative performance.","section":"4.4","source_quote":"The apparatus thesis is a sociological hypothesis: where standing has been strongly tied to scarce excellence, the resulting public exposure of one's output as substitutable may be experienced as humiliation unless institutions provide forms of recognition not exhausted by comparative performance.","not_claimed":["The hypothesis has been demonstrated causally.","A dignity apparatus is necessary or sufficient for social stability.","The framework prescribes engagement scoring or forced enjoyment."],"line":181},{"id":"T5-H1","status":"historical case with limited evidential role","claim":"The shogi case illustrates compatibility and offers a candidate mechanism; it does not establish necessity, sufficiency, or causal effect. Lee Sedol's individual exit is not Go culture's exit.","section":"4.4","source_quote":"the historical case demonstrates compatibility and offers a candidate mechanism; it does not establish the apparatus's necessity, sufficiency, or causal effect.","not_claimed":["The apparatus caused shogi's commercial success.","Go culture ceased to exist.","The case is a controlled comparison between matched populations."],"line":181}],"views":[{"id":"chain","label":"Chain","groups":["core"],"caption":"When AI lowers externalization cost, specification (the substrate of judgment) becomes visible (T1). Dividing the inside of specification into Sein-type and Sollen-type components brings out a boundary of legitimacy that is distinct from capability (T2). The root of that boundary lies not in a component but in a relation: answerability (T3). When this relation is carried into organizations, undertaking and embodiment become the rate-limiting steps as generative AI accelerates externalization and combination (T4). Finally the question is reversed, to show that even where delegation is possible and legitimate, the fact of participation does not transfer (T5). The dotted arrows show the reading order; they do not claim that a later paper is logically entailed by the earlier ones.","ok":1},{"id":"slide","label":"Easy to misread","groups":["core","slide"],"caption":"One misreading that each paper’s distinction blocks is placed here. Each is a row chosen from the table of “incorrect compressions” in THEORY_MAP, and a T-bar line points to the row that the distinction blocks. Four of the five recast the point along the capability axis, as a matter of “who does it better”; the T4 example is of another type, which replaces a relation with a surrogate that can be checked. Which rows are chosen and how their destinations are grouped is the map’s interpretation.","ok":1},{"id":"lineage","label":"Prior work","groups":["core","lineage"],"caption":"The distinctions (cuts) the five papers draw had been drawn earlier, for other purposes. Earlier research and earlier thinkers are set out in four groups. The first is the ground and the interlocutors of each field that the papers name in their text (material they rearrange, distinctions they borrow, positions they answer). The other three are strands that drew the same cut earlier: a thin strand on machines, thick systems from person to person, and research on the roles of people and machines. A solid box is a precursor the papers cite; a dashed box is one they do not cite but that drew the same cut earlier. A dashed line means “resonates”; it does not mean that the five papers can be explained by it. The grouping is interpretation.","ok":1}],"inside":{"T1":{"tiers":[{"id":"t1-abstract","no":"","title":"Abstract","line":12,"units":["t1-abstract"]},{"id":"t1-1","no":"1","title":"Introduction","line":24,"units":["t1-1"]},{"id":"t1-2","no":"2","title":"Conceptual Framework","line":46,"units":["t1-2-1","t1-2-2","t1-2-3","t1-2-4"]},{"id":"t1-3","no":"3","title":"Case Study","line":97,"units":["t1-3","t1-3-1","t1-3-2","t1-3-3","t1-3-4"]},{"id":"t1-4","no":"4","title":"Methods","line":149,"units":["t1-4","t1-4-1","t1-4-2","t1-4-3","t1-4-4"]},{"id":"t1-5","no":"5","title":"Discussion","line":207,"units":["t1-5-1","t1-5-2","t1-5-3","t1-5-4","t1-5-5","t1-5-6"]},{"id":"t1-6","no":"6","title":"Conclusion","line":299,"units":["t1-6","t1-the-phd-as-specification-training","t1-observed-diffusion-and-framework-derived-conjectures","t1-urgency","t1-closing"]},{"id":"t1-postscript-a-general-form-of-domain-native-development","no":"","title":"Postscript: A general form of domain-native development","line":333,"units":["t1-postscript-a-general-form-of-domain-native-development"]}],"units":[{"id":"t1-abstract","tier":"t1-abstract","no":"","title":"Abstract","intro":false,"line_start":12,"line_end":17,"paras":1,"size":226,"first":{"text":"When experienced professionals retire, organisations lose not their documented procedures but the accumulated judgement that determines how those procedures are applied.","line":14,"cut":false}},{"id":"t1-1","tier":"t1-1","no":"1","title":"Introduction","intro":false,"line_start":24,"line_end":45,"paras":9,"size":709,"first":{"text":"In knowledge-intensive industries, the retirement of senior practitioners creates a distinctive form of organisational loss.","line":26,"cut":false}},{"id":"t1-2-1","tier":"t1-2","no":"2.1","title":"Two-component decomposition","intro":false,"line_start":48,"line_end":63,"paras":7,"size":651,"first":{"text":"When domain knowledge is converted into a formal artefact—a software application, a technical document, an analytical tool—two categories of cost are incurred.","line":50,"cut":false}},{"id":"t1-2-2","tier":"t1-2","no":"2.2","title":"The distillation model of authorship","intro":false,"line_start":64,"line_end":71,"paras":3,"size":263,"first":{"text":"The relationship between human expertise and AI processing can be modelled as a distillation process.","line":66,"cut":false}},{"id":"t1-2-3","tier":"t1-2","no":"2.3","title":"Positioning among existing frameworks","intro":false,"line_start":72,"line_end":88,"paras":4,"size":250,"first":{"text":"The externalisation cost / specification cost distinction is not the first two-component decomposition proposed for AI-era knowledge work.","line":74,"cut":false}},{"id":"t1-2-4","tier":"t1-2","no":"2.4","title":"Applicability conditions","intro":false,"line_start":89,"line_end":96,"paras":2,"size":182,"first":{"text":"The substantial reduction in externalisation cost observed in domain-native development applies primarily to individual or small-team production in exploratory phases.","line":91,"cut":false}},{"id":"t1-3","tier":"t1-3","no":"3","title":"Case Study","intro":true,"line_start":97,"line_end":104,"paras":3,"size":228,"first":{"text":"The following case is positioned as a revelatory case study (Yin, 2018)—selected not for prevalence but for its capacity to make observable a phenomenon that the framework predicts but that has not been empirically documented at the level of individual design ","line":99,"cut":true}},{"id":"t1-3-1","tier":"t1-3","no":"3.1","title":"Specification cost as the determinant of design","intro":false,"line_start":105,"line_end":118,"paras":6,"size":483,"first":{"text":"Four categories of design decisions illustrate how domain knowledge, rather than prompt engineering skill, governed application quality.","line":107,"cut":false}},{"id":"t1-3-2","tier":"t1-3","no":"3.2","title":"Reversal of the translation direction","intro":false,"line_start":119,"line_end":126,"paras":3,"size":190,"first":{"text":"Conventional knowledge-to-product workflows follow a linear path: the domain expert writes natural-language requirements, which a software engineer interprets and implements.","line":121,"cut":false}},{"id":"t1-3-3","tier":"t1-3","no":"3.3","title":"Exploratory value of reduced externalisation cost","intro":false,"line_start":127,"line_end":138,"paras":5,"size":303,"first":{"text":"The primary value of reduced externalisation cost may not be the efficiency of producing finished products, but the increased number of exploratory attempts that become feasible when creation cost is low.","line":129,"cut":false}},{"id":"t1-3-4","tier":"t1-3","no":"3.4","title":"Two identification points","intro":false,"line_start":139,"line_end":148,"paras":3,"size":78,"first":{"text":"The case study yields two observations that the Discussion will generalise:","line":141,"cut":false}},{"id":"t1-4","tier":"t1-4","no":"4","title":"Methods","intro":true,"line_start":149,"line_end":152,"paras":1,"size":36,"first":{"text":"The preceding case narrative and the Discussion that follows draw on three categories of evidence: the dialogue logs generated during AI-assisted development, the outputs of a domain-ablation experiment, and the published dataset.","line":151,"cut":false}},{"id":"t1-4-1","tier":"t1-4","no":"4.1","title":"Dialogue logs as cognitive records","intro":false,"line_start":153,"line_end":160,"paras":3,"size":238,"first":{"text":"The methodological contribution of this study lies not in the application itself but in the dialogue logs generated during its development.","line":155,"cut":false}},{"id":"t1-4-2","tier":"t1-4","no":"4.2","title":"Domain-ablation experiment","intro":false,"line_start":161,"line_end":194,"paras":8,"size":606,"first":{"text":"To illustrate the framework's prediction that specification cost cannot be substituted by externalisation cost alone, a domain-ablation experiment was conducted.","line":163,"cut":false}},{"id":"t1-4-3","tier":"t1-4","no":"4.3","title":"Data availability","intro":false,"line_start":195,"line_end":198,"paras":1,"size":127,"first":{"text":"Three data layers are deposited on figshare (Nature Portfolio's recommended repository): the charging infrastructure dataset (583 × 21 CSV; one field—installation date, collected through independent research—is withheld from the public release), the ablation e","line":197,"cut":true}},{"id":"t1-4-4","tier":"t1-4","no":"4.4","title":"AI use disclosure","intro":false,"line_start":199,"line_end":206,"paras":2,"size":165,"first":{"text":"In accordance with Springer Nature's policy on AI-assisted writing, the following disclosure is provided.","line":201,"cut":false}},{"id":"t1-5-1","tier":"t1-5","no":"5.1","title":"Theoretical positioning: the visibility thesis","intro":false,"line_start":209,"line_end":226,"paras":8,"size":658,"first":{"text":"Section 3 demonstrated two identification points: that prototype-as-specification constitutes a structural mechanism for reducing externalisation cost (identification point 1), and that reduced externalisation cost increases the rate of exploratory attempts wh","line":211,"cut":true}},{"id":"t1-5-2","tier":"t1-5","no":"5.2","title":"Domain knowledge as the substance of specification cost","intro":false,"line_start":227,"line_end":238,"paras":5,"size":303,"first":{"text":"If externalisation cost is what AI reduces, specification cost is what determines output quality under the new cost structure.","line":229,"cut":false}},{"id":"t1-5-3","tier":"t1-5","no":"5.3","title":"Non-functional requirements and the responsibility boundary","intro":false,"line_start":239,"line_end":250,"paras":5,"size":402,"first":{"text":"Domain-native development reduces externalisation cost for domain-aligned functionality—the features and design decisions that directly reflect the expert's knowledge.","line":241,"cut":false}},{"id":"t1-5-4","tier":"t1-5","no":"5.4","title":"Methodological contribution of dialogue logs","intro":false,"line_start":251,"line_end":260,"paras":4,"size":215,"first":{"text":"The dialogue logs generated through AI-assisted development constitute a methodological contribution independent of the present framework.","line":253,"cut":false}},{"id":"t1-5-5","tier":"t1-5","no":"5.5","title":"Cumulative optimisation risk and educational implications","intro":false,"line_start":261,"line_end":280,"paras":10,"size":518,"first":{"text":"**Risk.** Extended use of a single AI system creates a risk of cognitive lock-in.","line":263,"cut":false}},{"id":"t1-5-6","tier":"t1-5","no":"5.6","title":"Safety considerations and limitations","intro":false,"line_start":281,"line_end":298,"paras":7,"size":876,"first":{"text":"The effectiveness of AI as a cognitive environment carries direct safety implications.","line":283,"cut":false}},{"id":"t1-6","tier":"t1-6","no":"6","title":"Conclusion","intro":true,"line_start":299,"line_end":302,"paras":1,"size":108,"first":{"text":"This paper introduced the mekiki framework, which identifies two conditions governing whether tacit knowledge can be successfully converted into formal artefacts: externalisation cost (the technical barriers to articulating and implementing knowledge, correspo","line":301,"cut":true}},{"id":"t1-the-phd-as-specification-training","tier":"t1-6","no":"","title":"The PhD as specification training","intro":false,"line_start":303,"line_end":310,"paras":3,"size":189,"first":{"text":"The framework permits a structural redescription of doctoral training.","line":305,"cut":false}},{"id":"t1-observed-diffusion-and-framework-derived-conjectures","tier":"t1-6","no":"","title":"Observed diffusion and framework-derived conjectures","intro":false,"line_start":311,"line_end":316,"paras":2,"size":247,"first":{"text":"The specification/externalisation dynamic is observable across domains at varying stages of AI integration.","line":313,"cut":false}},{"id":"t1-urgency","tier":"t1-6","no":"","title":"Urgency","intro":false,"line_start":317,"line_end":322,"paras":2,"size":186,"first":{"text":"The framework's practical value is proportional to the speed at which it reaches practitioners.","line":319,"cut":false}},{"id":"t1-closing","tier":"t1-6","no":"","title":"Closing","intro":false,"line_start":323,"line_end":332,"paras":3,"size":197,"first":{"text":"Naming a phenomenon is the precondition for managing it.","line":325,"cut":false}},{"id":"t1-postscript-a-general-form-of-domain-native-development","tier":"t1-postscript-a-general-form-of-domain-native-development","no":"","title":"Postscript: A general form of domain-native development","intro":false,"line_start":333,"line_end":344,"paras":4,"size":230,"first":{"text":"The case study presented in this paper documents a *special form* of domain-native development: one in which specification cost was not pre-existing but was acquired and refined through AI dialogue itself.","line":335,"cut":false}}],"refs":[{"from":"t1-2-1","to":"t1-5-6","to_no":"5.6","line":62,"text":"life experience, and the finite embodied perspective of the knower—structurally correspond to the dimension Polanyi bracketed and to what Nonaka and Takeuchi later termed Wisdom (see Section 5.6, Future directions).","cut":true,"dir":"fwd"},{"from":"t1-2-2","to":"t1-4","to_no":"4","line":68,"text":"Conversely, identical distillation conditions applied through different apparatus (different AI models) produce outputs that converge on the same structural features, as the ablation experiment in Section 4 demonstrates.","cut":false,"dir":"fwd"},{"from":"t1-2-3","to":"t1-4","to_no":"4","line":85,"text":"existing model, (b) connects to an established knowledge management tradition via Nonaka's SECI, and (c) generates directional predictions illustrated through domain-ablation experiment (Section 4).","cut":true,"dir":"fwd"},{"from":"t1-2-3","to":"t1-4","to_no":"4","line":87,"text":"Section 4 provides supporting evidence for this prediction.^[The pattern of independent discovery across disciplines is itself informative.","cut":false,"dir":"fwd"},{"from":"t1-2-4","to":"t1-5-1","to_no":"5.1","line":91,"text":"Social and psychological barriers to knowledge sharing (cf. Edmondson, 1999), while relevant to organisational knowledge flows, constitute a distinct phenomenon outside the present framework's scope—though their role as an identification condition is examined in Section 5.1.","cut":false,"dir":"fwd"},{"from":"t1-3-1","to":"t1-4","to_no":"4","line":109,"text":"In the domain-ablation experiment (Section 4), neither AI model operating without this domain knowledge included current-based fields.","cut":false,"dir":"fwd"},{"from":"t1-3-1","to":"t1-2-1","to_no":"2","line":117,"text":"They instantiate specification cost as defined in Section 2.","cut":false,"dir":"back"},{"from":"t1-3-3","to":"t1-5-3","to_no":"5.3","line":137,"text":"This asymmetry is examined in Section 5.3.","cut":false,"dir":"fwd"},{"from":"t1-5-1","to":"t1-3","to_no":"3","line":211,"text":"Section 3 demonstrated two identification points: that prototype-as-specification constitutes a","cut":true,"dir":"back"},{"from":"t1-5-1","to":"t1-3","to_no":"3","line":219,"text":"cost drops dramatically (eight-minute implementation episodes, zero-iteration specification transfer), while specification cost persists unchanged (the design decisions catalogued in Section 3 required the same domain knowledge regardless of the implementation medium).","cut":true,"dir":"back"},{"from":"t1-5-1","to":"t1-4-2","to_no":"4.2","line":221,"text":"The domain-ablation experiment (Section 4.2) provides the identification step.","cut":false,"dir":"back"},{"from":"t1-5-1","to":"t1-2-1","to_no":"2","line":223,"text":"economics (Agrawal et al., 2018), cognitive science (Subramonyam et al., 2024), interaction design (Terry et al., 2023), and knowledge management (Böhm & Durst, 2026), as documented in Section 2, constitutes convergent evidence for the universality of the underlying structure.","cut":true,"dir":"back"},{"from":"t1-5-1","to":"t1-5-6","to_no":"5.6","line":225,"text":"In the present case, both subcomponents were simultaneously reduced: technical conversion barriers by AI-mediated dialogue, and interpersonal risk perception by the author's low emotional responsiveness profile (Section 5.6).","cut":false,"dir":"fwd"},{"from":"t1-5-2","to":"t1-3-1","to_no":"3.1","line":229,"text":"The case study's design decisions (Section 3.1) provide direct evidence: each reflects domain knowledge that could not have been generated by prompt engineering technique, however sophisticated.","cut":false,"dir":"back"},{"from":"t1-5-3","to":"t1-3-3","to_no":"3.3","line":247,"text":"The asymmetry identified in Section 3.3 is structural.","cut":false,"dir":"back"},{"from":"t1-urgency","to":"t1-1","to_no":"1","line":319,"text":"The three researchers introduced in Section 1 exemplify this asymmetry: the retiring specialist's specification capacity is irreversibly depleting, while the junior researcher's externalisation cost reduction tools await specification that only the specialist can provide.","cut":false,"dir":"back"}],"figs":[{"kind":"table","no":1,"label":"Table 1","caption":"Table 1: Existing two-component frameworks and their relationship to the present model","line":76,"anchor":"t1-2-3","unit":"t1-2-3","omitted":false,"match":"exact"},{"kind":"table","no":2,"label":"Table 2","caption":"Table 2: Convergent deficiency patterns in domain-ablation experiment","line":170,"anchor":"t1-4-2","unit":"t1-4-2","omitted":false,"match":"exact"},{"kind":"figure","no":1,"label":"Figure 1","caption":"Figure 1. The mekiki framework as a pathway model within the SECI model.","line":421,"anchor":"t1-figure-1","unit":"t1-2-1","omitted":true,"match":"normalized"},{"kind":"figure","no":2,"label":"Figure 2","caption":"Figure 2. The distillation model of authorship under the mekiki framework.","line":427,"anchor":"t1-figure-2","unit":"t1-2-2","omitted":true,"match":"normalized"}],"parts":[{"id":"t1-abstract-p1","unit":"t1-abstract","k":1,"lines":[14,14],"label":"Abstract","does":"summary","says":"What is lost at retirement is not procedures but the judgment that determines how procedures are applied. The paper sets out two conditions that govern whether tacit knowledge can be given form (externalization cost and specification cost), and shows with one case study that under AI the former falls greatly while the latter remains unchanged. An experiment is offered as supporting evidence that the two components are separable.","quote":{"paper":"T1","text":"organisations lose not their documented procedures but the accumulated judgement that determines how those procedures are applied","line":14,"anchor":"t1-abstract","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-1-p1","unit":"t1-1","k":1,"lines":[26,26],"label":"What is lost is judgment","does":"frame","says":"In knowledge-intensive industries, what retirement takes away is not procedures that can be documented but accumulated judgment.","quote":{"paper":"T1","text":"What disappears is not procedural knowledge","line":26,"anchor":"t1-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-1-p2","unit":"t1-1","k":2,"lines":[28,36],"label":"Three researchers","does":"example","says":"Three people at the same institute are set side by side. Their conditions were the same; what differed was the relationship between their domain expertise and the task.","quote":{"paper":"T1","text":"What differed was the relationship between their domain expertise and the task at hand.","line":36,"anchor":"t1-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-1-p3","unit":"t1-1","k":3,"lines":[38,38],"label":"A pattern not yet named","does":"positioning","says":"The pattern in which the constraint is domain knowledge rather than implementation skill has been observed across fields, but has not been characterized as a whole.","quote":{"paper":"T1","text":"has been observed across multiple fields but has not been systematically characterised","line":38,"anchor":"t1-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-1-p4","unit":"t1-1","k":4,"lines":[40,40],"label":"What this paper does","does":"frame","says":"It defines Domain-Native Development (DND), in which domain experts build directly using AI as a translation medium, and illustrates a two-component framework with one case and an experiment.","quote":{"paper":"T1","text":"as the direct production of functional artefacts by domain experts using AI as a translation medium","line":40,"anchor":"t1-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-1-p5","unit":"t1-1","k":5,"lines":[42,42],"label":"The window is closing","does":"implication","says":"The period during which retiring experts can externalize their judgment through dialogue with AI is finite, and a vocabulary for doing so is needed first.","quote":{"paper":"T1","text":"is finite and closing","line":42,"anchor":"t1-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-1-p1","unit":"t1-2-1","k":1,"lines":[50,50],"label":"Two costs","does":"frame","says":"Turning domain knowledge into a formal artifact incurs two kinds of cost.","quote":{"paper":"T1","text":"two categories of cost are incurred","line":50,"anchor":"t1-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-1-p2","unit":"t1-2-1","k":2,"lines":[52,52],"label":"Externalization cost","does":"definition","says":"Externalization cost is the technical barrier to converting tacit knowledge into explicit form.","quote":{"paper":"T1","text":"denotes the technical barriers to converting tacit knowledge into explicit, formal representations","line":52,"anchor":"t1-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-1-p3","unit":"t1-2-1","k":3,"lines":[54,54],"label":"Specification cost","does":"definition","says":"Specification cost is the barrier arising from the expertise needed to decide what should be built. Expertise is a resource the practitioner possesses; the cost is the degree to which the task demands it.","quote":{"paper":"T1","text":"specification cost is the degree to which a task demands domain expertise","line":54,"anchor":"t1-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-1-p4","unit":"t1-2-1","k":4,"lines":[56,60],"label":"Formerly inseparable","does":"claim","says":"Under conventional conditions the two costs are entangled and inseparable. The paper names this decomposition the Mekiki framework.","quote":{"paper":"T1","text":"these two cost components are entangled and inseparable","line":56,"anchor":"t1-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-1-p5","unit":"t1-2-1","k":5,"lines":[62,62],"label":"Lineage","does":"positioning","says":"The paper places itself in a lineage that runs from Polanyi to Nonaka, and distinguishes two conditions within Nonaka’s externalization.","quote":{"paper":"T1","text":"The framework operates within a lineage that runs from Polanyi through Nonaka to the present analysis.","line":62,"anchor":"t1-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-2-p1","unit":"t1-2-2","k":1,"lines":[66,66],"label":"The distillation model","does":"definition","says":"The relation between person and AI is likened to distillation: the raw material is collective knowledge, the apparatus is AI, and the expert sets the conditions of distillation.","quote":{"paper":"T1","text":"can be modelled as a distillation process","line":66,"anchor":"t1-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-2-p2","unit":"t1-2-2","k":2,"lines":[68,70],"label":"Where authorship lies","does":"claim","says":"Under this model, authorship lies not in operating the apparatus but in setting the conditions of distillation. Distillation is rarely a single pass; it is repeated while the conditions are revised.","quote":{"paper":"T1","text":"authorship resides in the setting of distillation conditions, not in the operation of the apparatus","line":68,"anchor":"t1-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-3-p1","unit":"t1-2-3","k":1,"lines":[74,85],"label":"Four decompositions","does":"positioning","says":"This is not the first two-component decomposition. The paper sets it beside four others, from economics, cognitive science, interaction design and knowledge management, and shows where it stands.","quote":{"paper":"T1","text":"is not the first two-component decomposition proposed for AI-era knowledge work","line":74,"anchor":"t1-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-3-p2","unit":"t1-2-3","k":2,"lines":[87,87],"label":"A directional prediction","does":"prediction","says":"The framework predicts that, in domains where specification cost is high, AI deployment without domain expert involvement will fail to produce domain-appropriate outputs, regardless of the AI system’s externalization capabilities.","quote":{"paper":"T1","text":"AI deployment without domain expert involvement will fail to produce domain-appropriate outputs","line":87,"anchor":"t1-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-4-p1","unit":"t1-2-4","k":1,"lines":[91,91],"label":"Scope of application","does":"limit","says":"The large fall in externalization cost applies mainly to individuals and small teams in exploratory phases. The cost of organizational coordination remains separately.","quote":{"paper":"T1","text":"applies primarily to individual or small-team production in exploratory phases","line":91,"anchor":"t1-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-4-p2","unit":"t1-2-4","k":2,"lines":[93,93],"label":"The unit is a ratio","does":"definition","says":"The unit of analysis is not the task itself but the ratio of the two components within a single task.","quote":{"paper":"T1","text":"The appropriate unit of analysis is not the task but the","line":93,"anchor":"t1-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-p1","unit":"t1-3","k":1,"lines":[99,101],"label":"One revelatory case","does":"procedure","says":"A single case, chosen not for prevalence but because it lets the phenomenon be observed at the level of design decisions. A researcher with no programming experience built and released an app for finding EV charging stations.","quote":{"paper":"T1","text":"selected not for prevalence but for its capacity to make observable a phenomenon that the framework predicts","line":99,"anchor":"t1-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-p2","unit":"t1-3","k":2,"lines":[103,103],"label":"Allocation of time","does":"grounds","says":"AI code generation took about 5% of the total time. Design discussion and consideration of the specification took about 40%.","quote":{"paper":"T1","text":"Actual AI code generation accounted for approximately 5% of total working time.","line":103,"anchor":"t1-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-1-p1","unit":"t1-3-1","k":1,"lines":[107,113],"label":"Design set by knowledge","does":"grounds","says":"A data design based on current, conditional suppression of display, the distinction between operators. What governed quality was not prompt technique but domain knowledge.","quote":{"paper":"T1","text":"illustrate how domain knowledge, rather than prompt engineering skill, governed application quality","line":107,"anchor":"t1-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-1-p2","unit":"t1-3-1","k":2,"lines":[115,115],"label":"What was left out","does":"grounds","says":"Perhaps the strongest evidence lies on the side of what was deliberately not included.","quote":{"paper":"T1","text":"lies in what the application deliberately excludes","line":115,"anchor":"t1-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-1-p3","unit":"t1-3-1","k":3,"lines":[117,117],"label":"The definition at work","does":"summary","says":"These decisions come from the author’s domain knowledge. They instantiate specification cost as defined in Section 2.","quote":{"paper":"T1","text":"They instantiate specification cost as defined in Section 2.","line":117,"anchor":"t1-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-2-p1","unit":"t1-3-2","k":1,"lines":[121,123],"label":"Prototype as the spec","does":"claim","says":"Conventionally, an expert wrote requirements in prose and an engineer interpreted and implemented them. In this case the order was reversed: the working prototype itself became the specification.","quote":{"paper":"T1","text":"producing functional code that served as the specification itself","line":123,"anchor":"t1-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-2-p2","unit":"t1-3-2","k":2,"lines":[125,125],"label":"Specification first","does":"grounds","says":"Where a specification document and a prototype had been prepared beforehand, implementation was finished in a short time. The fall in externalization cost is not automatic, however; it depends on the quality of the specification provided.","quote":{"paper":"T1","text":"it depends on the quality of specification provided","line":125,"anchor":"t1-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-3-p1","unit":"t1-3-3","k":1,"lines":[129,129],"label":"More attempts possible","does":"claim","says":"The value of lower externalization cost may lie less in producing a finished product quickly than in the greater number of attempts that become feasible.","quote":{"paper":"T1","text":"the increased number of exploratory attempts that become feasible when creation cost is low","line":129,"anchor":"t1-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-3-p2","unit":"t1-3-3","k":2,"lines":[131,133],"label":"Rejected and discarded","does":"grounds","says":"Twelve features were proposed and rejected, and two design drafts were made and discarded. With outsourcing, making and discarding drafts is itself expensive.","quote":{"paper":"T1","text":"records twelve features that were explicitly proposed and rejected during development","line":131,"anchor":"t1-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-3-p3","unit":"t1-3-3","k":3,"lines":[135,135],"label":"Rejection is expertise","does":"claim","says":"Each rejection was an exercise of expertise: a judgment about what not to build.","quote":{"paper":"T1","text":"each rejection was itself an exercise of domain expertise","line":135,"anchor":"t1-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-3-p4","unit":"t1-3-3","k":4,"lines":[137,137],"label":"Reverses in organizations","does":"limit","says":"In individual exploration the cost of failure is small. In organizational automation, failure spreads through systems and users, so the same reduction works the other way.","quote":{"paper":"T1","text":"This dynamic reverses when externalisation cost reduction is applied to organisational automation rather than individual exploration.","line":137,"anchor":"t1-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-4-p1","unit":"t1-3-4","k":1,"lines":[141,145],"label":"Two points identified","does":"summary","says":"The prototype becoming the specification is a structural mechanism that lowers externalization cost. The greater number of attempts is its second-order effect, and the constraint shifts to the expert’s judgment.","quote":{"paper":"T1","text":"The case study yields two observations that the Discussion will generalise","line":141,"anchor":"t1-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-p1","unit":"t1-4","k":1,"lines":[151,151],"label":"Three kinds of evidence","does":"procedure","says":"Three are used: dialogue logs, the outputs of the domain-ablation experiment, and data to be released.","quote":{"paper":"T1","text":"draw on three categories of evidence","line":151,"anchor":"t1-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-1-p1","unit":"t1-4-1","k":1,"lines":[155,157],"label":"Logs record judgment","does":"claim","says":"A dialogue log keeps what was considered, what was adopted, and what was rejected and for what reason. Unlike methods that ask for verbalization, the work itself becomes the verbalization.","quote":{"paper":"T1","text":"Rejection rationale is a category of knowledge that typically survives in neither technical manuals nor project reports.","line":155,"anchor":"t1-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-1-p2","unit":"t1-4-1","k":2,"lines":[159,159],"label":"Condition for replication","does":"limit","says":"The method presupposes a context capacity that can hold a long dialogue. This is noted as a reproducibility condition.","quote":{"paper":"T1","text":"This technical parameter should be noted as a reproducibility condition.","line":159,"anchor":"t1-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-2-p1","unit":"t1-4-2","k":1,"lines":[163,165],"label":"Design of the experiment","does":"procedure","says":"It creates the condition in which externalization capability is present but specification is absent. The same raw data were given once to two AI models, so that the author’s specification could not mix in.","quote":{"paper":"T1","text":"it asks what happens when externalisation capability is present but specification is absent","line":163,"anchor":"t1-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-2-p2","unit":"t1-4-2","k":2,"lines":[167,191],"label":"Convergent deficiencies","does":"grounds","says":"Both models quickly built an app that ran. But in three layers (data interpretation, interface, information structure) they showed deficiencies of the same pattern.","quote":{"paper":"T1","text":"Both models independently exhibited structurally convergent deficiency patterns across all three layers","line":191,"anchor":"t1-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-2-p3","unit":"t1-4-2","k":3,"lines":[193,193],"label":"Fits the prediction","does":"claim","says":"Each row of the table is a design decision that requires domain knowledge and cannot be replaced by prompt technique. The result is consistent with the framework’s prediction.","quote":{"paper":"T1","text":"is consistent with the framework's prediction","line":193,"anchor":"t1-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-3-p1","unit":"t1-4-3","k":1,"lines":[197,197],"label":"Data release","does":"procedure","says":"Three layers are deposited on figshare: charging-station data, the inputs and outputs of the experiment, and dialogue logs.","quote":{"paper":"T1","text":"Three data layers are deposited on figshare","line":197,"anchor":"t1-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-4-p1","unit":"t1-4-4","k":1,"lines":[201,203],"label":"Disclosure of AI use","does":"procedure","says":"Three AI systems were used. Providing knowledge, design and analytic decisions, and setting evaluation criteria were done by the author, who bears sole responsibility for the content.","quote":{"paper":"T1","text":"bears sole responsibility for the content","line":203,"anchor":"t1-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-1-p1","unit":"t1-5-1","k":1,"lines":[211,211],"label":"Taking up the two points","does":"summary","says":"Taking up the two identification points of Section 3, the paper examines their theoretical implications.","quote":{"paper":"T1","text":"Section 3 demonstrated two identification points","line":211,"anchor":"t1-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-1-p2","unit":"t1-5-1","k":2,"lines":[213,213],"label":"Visibility thesis","does":"claim","says":"The distinction between the two costs is not a structure created by AI but a structure made visible by AI.","quote":{"paper":"T1","text":"The central claim of this paper is that the distinction between externalisation cost and specification cost is not a structure created by AI","line":213,"anchor":"t1-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-1-p3","unit":"t1-5-1","k":3,"lines":[215,219],"label":"Quasi-experimental logic","does":"grounds","says":"In transfer from person to person, hierarchy, evaluation anxiety and the like overlap, and the two costs cannot be observed separately. In dialogue with AI these weaken, and externalization cost alone can be seen to fall.","quote":{"paper":"T1","text":"Under these conditions, the two cost components cannot be independently observed.","line":215,"anchor":"t1-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-1-p4","unit":"t1-5-1","k":4,"lines":[221,221],"label":"The identification step","does":"grounds","says":"In the condition without specification, externalization capability alone produced artifacts that were technically competent but domain-inappropriate. The convergent failure pattern across two independent AI models suggests that the two components are separable and respond differently to AI assistance. The paper positions this pattern as consistent with the framework’s defining prediction.","quote":{"paper":"T1","text":"The domain-ablation experiment (Section 4.2) provides the identification step.","line":221,"anchor":"t1-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-1-p5","unit":"t1-5-1","k":5,"lines":[223,223],"label":"Decompositions converge","does":"grounds","says":"Similar decompositions appeared independently in economics, cognitive science, interaction design and knowledge management. The paper cites this as evidence that the structure holds widely.","quote":{"paper":"T1","text":"constitutes convergent evidence for the universality of the underlying structure","line":223,"anchor":"t1-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-1-p6","unit":"t1-5-1","k":6,"lines":[225,225],"label":"Existence vs. observation","does":"limit","says":"The two-component structure is a claim about existence. The simultaneous weakening of confounds is a condition that enabled observation, not a condition of existence.","quote":{"paper":"T1","text":"it enabled observation, not existence","line":225,"anchor":"t1-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-2-p1","unit":"t1-5-2","k":1,"lines":[229,231],"label":"What determines quality","does":"claim","says":"If what AI lowers is externalization cost, then under the new cost structure it is specification cost that determines output quality.","quote":{"paper":"T1","text":"specification cost is what determines output quality under the new cost structure","line":229,"anchor":"t1-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-2-p2","unit":"t1-5-2","k":2,"lines":[233,233],"label":"Portable","does":"grounds","says":"With a handoff document recording the design decisions, externalization cost in a new session fell to nearly zero. This suggests that specification lies not in a particular AI system but in the expert’s judgment.","quote":{"paper":"T1","text":"suggests that it resides in the human domain expert's judgement rather than in any particular AI system's learned representations","line":233,"anchor":"t1-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-2-p3","unit":"t1-5-2","k":3,"lines":[235,237],"label":"Not specific to AI","does":"claim","says":"The same account holds for an automobile example that does not involve AI. The framework predicts that this expertise can operate across domains once the externalization barrier is removed.","quote":{"paper":"T1","text":"The framework is not AI-specific.","line":235,"anchor":"t1-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-3-p1","unit":"t1-5-3","k":1,"lines":[241,243],"label":"The lost checkpoint","does":"limit","says":"Non-functional requirements are a separate axis of expertise, which DND does not address. The translation layer that disappeared was a place where information was lost and, at the same time, a quality gate.","quote":{"paper":"T1","text":"The translation layer that DND eliminates served a dual function.","line":243,"anchor":"t1-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-3-p2","unit":"t1-5-3","k":2,"lines":[245,247],"label":"Rebuilding the boundary","does":"claim","says":"Individual exploration can proceed safely. For deployment in an organization, the responsibility boundary must be explicitly reconstructed, through code review, audit and the like.","quote":{"paper":"T1","text":"requires that the responsibility boundary be explicitly reconstructed","line":247,"anchor":"t1-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-3-p3","unit":"t1-5-3","k":3,"lines":[249,249],"label":"Not always a benefit","does":"limit","says":"Not every reduction in externalization cost is beneficial.","quote":{"paper":"T1","text":"Not all externalisation cost reduction is beneficial.","line":249,"anchor":"t1-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-4-p1","unit":"t1-5-4","k":1,"lines":[253,255],"label":"Dialogue logs as method","does":"claim","says":"Dialogue logs are a methodological contribution independent of the framework. They keep design rationale, reasons for rejection and evaluation criteria, and become a new kind of organizational memory.","quote":{"paper":"T1","text":"constitute a methodological contribution independent of the present framework","line":253,"anchor":"t1-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-4-p2","unit":"t1-5-4","k":2,"lines":[257,259],"label":"Accumulation and handoff","does":"grounds","says":"As context accumulates, the explanation needed to convey intent becomes shorter. Made into a handoff document, it can be carried into a new session.","quote":{"paper":"T1","text":"confirming that the valuable knowledge resided in the specification structure rather than in any particular dialogue history","line":259,"anchor":"t1-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-5-p1","unit":"t1-5-5","k":1,"lines":[263,265],"label":"Fitting to one AI","does":"limit","says":"Continued use of a single AI system risks bending one’s way of specifying toward that system’s habits. The countermeasure is to understand the distinction between the two costs as a concept.","quote":{"paper":"T1","text":"Extended use of a single AI system creates a risk of cognitive lock-in.","line":263,"anchor":"t1-5-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-5-p2","unit":"t1-5-5","k":2,"lines":[267,273],"label":"Three layers of learning","does":"claim","says":"Three layers are proposed: knowing it as a concept, telling it apart through experience, and using it in an integrated way. Training corresponds to the first layer and raises sensitivity to later experience.","quote":{"paper":"T1","text":"a three-layer model is proposed","line":267,"anchor":"t1-5-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-5-p3","unit":"t1-5-5","k":3,"lines":[275,275],"label":"Bottleneck misidentified","does":"implication","says":"“Teach the veteran to use AI” misidentifies where the constraint is. What is needed is someone who designs a dialogue into which the veteran’s judgment flows naturally.","quote":{"paper":"T1","text":"misidentifies the bottleneck","line":275,"anchor":"t1-5-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-5-p4","unit":"t1-5-5","k":4,"lines":[277,279],"label":"Learning and mastery","does":"claim","says":"Those still developing judgment, and those who already have it and need only lower externalization cost. Separating the two is the foundation of educational design.","quote":{"paper":"T1","text":"is foundational to educational design","line":279,"anchor":"t1-5-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-6-p1","unit":"t1-5-6","k":1,"lines":[283,285],"label":"Side effects","does":"claim","says":"An environment that works on cognition may have side effects. The response is not prohibition but usage design. The same property that weakens the confounds also shortens the distance between users and their own knowledge.","quote":{"paper":"T1","text":"the appropriate response is not prohibition but usage design","line":283,"anchor":"t1-5-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-6-p2","unit":"t1-5-6","k":2,"lines":[287,289],"label":"Experience and a case","does":"grounds","says":"The author observed a graduated increase in emotional engagement as externalization deepened. As an outside example, the paper cites a study in which asking AI to recommend a statistical method led to inappropriate results.","quote":{"paper":"T1","text":"Empirical grounding for this concern emerged from the author's own experience.","line":287,"anchor":"t1-5-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-6-p3","unit":"t1-5-6","k":3,"lines":[291,291],"label":"No contraindications","does":"implication","says":"A drug’s package insert lists contraindications. For AI-assisted development tools, no equivalent disclosure framework yet exists.","quote":{"paper":"T1","text":"No equivalent disclosure framework currently exists for AI-assisted development tools.","line":291,"anchor":"t1-5-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-6-p4","unit":"t1-5-6","k":4,"lines":[293,293],"label":"Limitations","does":"limit","says":"Seven limitations are listed. There is one case, positioned to demonstrate the existence and structure of a phenomenon, not to establish its prevalence. The author is both researcher and subject. Non-functional requirements were not systematically evaluated. Long-term maintainability is untested. The reduction in externalization cost was observed in a single-developer setting, and coordination costs in organizations are not addressed. The framework’s scope is bounded to domains where specification originates from human expertise. Cognitive and emotional load was assessed through retrospective self-report.","quote":{"paper":"T1","text":"valuable for demonstrating the existence and structure of a phenomenon rather than for establishing prevalence","line":293,"anchor":"t1-5-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-6-p5","unit":"t1-5-6","k":5,"lines":[295,295],"label":"Future directions","does":"prediction","says":"Six directions are listed, including replication by experts in other domains and the internal structure of specification cost.","quote":{"paper":"T1","text":"Six avenues merit investigation","line":295,"anchor":"t1-5-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-6-p1","unit":"t1-6","k":1,"lines":[301,301],"label":"Conclusion","does":"summary","says":"The paper set out two conditions that govern whether tacit knowledge can be turned into a formal artifact. Authorship is reconceived as the exercise of specification.","quote":{"paper":"T1","text":"the framework redefines authorship in AI-assisted knowledge work as the exercise of specification","line":301,"anchor":"t1-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-the-phd-as-specification-training-p1","unit":"t1-the-phd-as-specification-training","k":1,"lines":[305,309],"label":"PhD as spec training","does":"implication","says":"Under this analysis, doctoral training is an apparatus for training the capacity to specify, and AI is an apparatus for lowering externalization cost. Having both is the condition for DND.","quote":{"paper":"T1","text":"Doctoral training is, under this analysis, a specification training apparatus.","line":307,"anchor":"t1-the-phd-as-specification-training","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-observed-diffusion-and-framework-derived-conjectures-p1","unit":"t1-observed-diffusion-and-framework-derived-conjectures","k":1,"lines":[313,313],"label":"Observed diffusion","does":"grounds","says":"The same dynamic can be observed in domains at different stages of AI integration, such as strategy games and translation.","quote":{"paper":"T1","text":"is observable across domains at varying stages of AI integration","line":313,"anchor":"t1-observed-diffusion-and-framework-derived-conjectures","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-observed-diffusion-and-framework-derived-conjectures-p2","unit":"t1-observed-diffusion-and-framework-derived-conjectures","k":2,"lines":[315,315],"label":"Two conjectures","does":"prediction","says":"Two conjectures are offered that follow from the framework but go beyond the evidence of this study.","quote":{"paper":"T1","text":"Two conjectures follow from the framework but exceed the present study's evidence.","line":315,"anchor":"t1-observed-diffusion-and-framework-derived-conjectures","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-urgency-p1","unit":"t1-urgency","k":1,"lines":[319,321],"label":"Why it is urgent","does":"implication","says":"Externalization cost keeps falling, but judgment lost through generational transition cannot be regenerated from data alone. A framework for deciding what to delegate to AI is also needed before adoption spreads.","quote":{"paper":"T1","text":"cannot be regenerated from data alone","line":319,"anchor":"t1-urgency","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-closing-p1","unit":"t1-closing","k":1,"lines":[325,329],"label":"Naming comes first","does":"summary","says":"The distinction was there all along. What was missing was a vocabulary that lets it be discussed in organizations, measured in research and taught in education.","quote":{"paper":"T1","text":"Naming a phenomenon is the precondition for managing it.","line":325,"anchor":"t1-closing","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-postscript-a-general-form-of-domain-native-development-p1","unit":"t1-postscript-a-general-form-of-domain-native-development","k":1,"lines":[335,335],"label":"A special form","does":"limit","says":"The case in the main text is a special form. The specification side did not exist beforehand; it was built in dialogue with AI, which is why it took time.","quote":{"paper":"T1","text":"one in which specification cost was not pre-existing but was acquired and refined through AI dialogue itself","line":335,"anchor":"t1-postscript-a-general-form-of-domain-native-development","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-postscript-a-general-form-of-domain-native-development-p2","unit":"t1-postscript-a-general-form-of-domain-native-development","k":2,"lines":[337,339],"label":"Done in a day","does":"grounds","says":"Documents in three fields backed by about ten years of accumulation were each finished within a single day. Same author, same AI, same period; that was the only difference.","quote":{"paper":"T1","text":"All three documents were completed within a single day.","line":337,"anchor":"t1-postscript-a-general-form-of-domain-native-development","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-postscript-a-general-form-of-domain-native-development-p3","unit":"t1-postscript-a-general-form-of-domain-native-development","k":3,"lines":[341,341],"label":"Difficulty reversed","does":"claim","says":"This reversal too is evidence for the central claim that the two costs are separable and respond differently to AI.","quote":{"paper":"T1","text":"The bottleneck was never the tool.","line":341,"anchor":"t1-postscript-a-general-form-of-domain-native-development","match":"exact"},"basis":"reading","vis":"public"}],"links":[{"id":"k-t1-1-p3--t1-2-3-p1","from":"t1-1-p3","to":"t1-2-3-p1","rel":"takes up","note":"The independent decompositions mentioned in the introduction are placed one by one in a table.","basis":"reading","vis":"public"},{"id":"k-t1-2-1-p4--t1-5-1-p3","from":"t1-2-1-p4","to":"t1-5-1-p3","rel":"supports","note":"The discussion gives the reason they could not be separated (overlapping confounds).","basis":"reading","vis":"public"},{"id":"k-t1-2-3-p2--t1-4-2-p3","from":"t1-2-3-p2","to":"t1-4-2-p3","rel":"tests","note":"The directional prediction is set against the result of the experiment.","basis":"reading","vis":"public"},{"id":"k-t1-2-4-p2--t1-5-2-p1","from":"t1-2-4-p2","to":"t1-5-2-p1","rel":"restates","note":"It states again that the unit of analysis is the ratio of components.","basis":"reading","vis":"public"},{"id":"k-t1-3-1-p1--t1-4-2-p2","from":"t1-3-1-p1","to":"t1-4-2-p2","rel":"uses","note":"The author’s design serves as the control column of Table 2.","basis":"reading","vis":"public"},{"id":"k-t1-3-1-p2--t1-3-3-p3","from":"t1-3-1-p2","to":"t1-3-3-p3","rel":"takes up","note":"What was left out is reconceived as expertise at work on the side of evaluation.","basis":"reading","vis":"public"},{"id":"k-t1-3-2-p1--t1-3-4-p1","from":"t1-3-2-p1","to":"t1-3-4-p1","rel":"sums up","note":"It becomes the first identification point.","basis":"reading","vis":"public"},{"id":"k-t1-3-3-p1--t1-3-4-p1","from":"t1-3-3-p1","to":"t1-3-4-p1","rel":"sums up","note":"It becomes the second identification point.","basis":"reading","vis":"public"},{"id":"k-t1-3-4-p1--t1-5-1-p1","from":"t1-3-4-p1","to":"t1-5-1-p1","rel":"takes up","note":"The two identification points become the starting point of the discussion.","basis":"reading","vis":"public"},{"id":"k-t1-3-2-p1--t1-5-3-p1","from":"t1-3-2-p1","to":"t1-5-3-p1","rel":"limits","note":"To the benefit of losing the translation layer it adds the limit that a gate is lost too.","basis":"reading","vis":"public"},{"id":"k-t1-3-3-p4--t1-5-3-p2","from":"t1-3-3-p4","to":"t1-5-3-p2","rel":"takes up","note":"The asymmetry between individual and organization is developed as a matter of the responsibility boundary.","basis":"reading","vis":"public"},{"id":"k-t1-3-3-p2--t1-4-1-p1","from":"t1-3-3-p2","to":"t1-4-1-p1","rel":"takes up","note":"The reasons for rejection become the content of the record kept in the dialogue logs.","basis":"reading","vis":"public"},{"id":"k-t1-4-1-p1--t1-5-4-p1","from":"t1-4-1-p1","to":"t1-5-4-p1","rel":"takes up","note":"The description of the method is restated as a methodological contribution.","basis":"reading","vis":"public"},{"id":"k-t1-5-2-p2--t1-5-4-p2","from":"t1-5-2-p2","to":"t1-5-4-p2","rel":"restates","note":"The same observation about the handoff document is stated from the side of method.","basis":"reading","vis":"public"},{"id":"k-t1-2-3-p1--t1-5-1-p5","from":"t1-2-3-p1","to":"t1-5-1-p5","rel":"uses","note":"The four decompositions of Table 1 are used as evidence of convergence.","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p2--t1-5-1-p3","from":"t1-5-1-p2","to":"t1-5-1-p3","rel":"supports","note":"The central claim is supported by quasi-experimental logic.","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p2--t1-5-1-p4","from":"t1-5-1-p2","to":"t1-5-1-p4","rel":"supports","note":"The central claim is supported by identification through the experiment.","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p2--t1-5-1-p5","from":"t1-5-1-p2","to":"t1-5-1-p5","rel":"supports","note":"The central claim is supported by the convergence of independent decompositions.","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p2--t1-5-1-p6","from":"t1-5-1-p2","to":"t1-5-1-p6","rel":"limits","note":"It separates the kind of claim (existence) from the conditions of observation, to prevent overstatement.","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p3--t1-5-6-p1","from":"t1-5-1-p3","to":"t1-5-6-p1","rel":"takes up","note":"It states the hazardous side of the same property that weakens the confounds.","basis":"reading","vis":"public"},{"id":"k-t1-4-2-p2--t1-5-6-p2","from":"t1-4-2-p2","to":"t1-5-6-p2","rel":"supports","note":"An outside example of AI lacking specification is set beside the result of the experiment.","basis":"reading","vis":"public"},{"id":"k-t1-2-1-p5--t1-5-6-p5","from":"t1-2-1-p5","to":"t1-5-6-p5","rel":"takes up","note":"The deeper layer touched on in the lineage is set as future work.","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p6--t1-5-6-p5","from":"t1-5-1-p6","to":"t1-5-6-p5","rel":"takes up","note":"The breakdown of externalization cost is set as future work.","basis":"reading","vis":"public"},{"id":"k-t1-5-5-p4--t1-the-phd-as-specification-training-p1","from":"t1-5-5-p4","to":"t1-the-phd-as-specification-training-p1","rel":"takes up","note":"The conclusion takes up the question of what mechanism develops judgment. The text names “the Conclusion” rather than a section number.","basis":"reading","vis":"public"},{"id":"k-t1-1-p2--t1-urgency-p1","from":"t1-1-p2","to":"t1-urgency-p1","rel":"takes up","note":"The three people of the introduction are used again as an example of the asymmetry.","basis":"reading","vis":"public"},{"id":"k-t1-2-2-p2--t1-6-p1","from":"t1-2-2-p2","to":"t1-6-p1","rel":"restates","note":"The claim about authorship is restated in the conclusion.","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p2--t1-closing-p1","from":"t1-5-1-p2","to":"t1-closing-p1","rel":"restates","note":"The paper closes on the claim of making visible.","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p4--t1-postscript-a-general-form-of-domain-native-development-p3","from":"t1-5-1-p4","to":"t1-postscript-a-general-form-of-domain-native-development-p3","rel":"supports","note":"To the claim that the components are separable and respond differently, it adds an observation made after submission.","basis":"reading","vis":"public"}],"ok":1},"T2":{"tiers":[{"id":"t2-abstract","no":"","title":"Abstract","line":11,"units":["t2-abstract"]},{"id":"t2-1","no":"1","title":"Introduction","line":19,"units":["t2-1"]},{"id":"t2-2","no":"2","title":"The internal structure of specification: deriving the Sein/Sollen decomposition","line":33,"units":["t2-2-1","t2-2-2","t2-2-3","t2-2-4"]},{"id":"t2-3","no":"3","title":"Philosophy as cognitive assay: operationalization","line":73,"units":["t2-3-1","t2-3-2","t2-3-3","t2-3-4"]},{"id":"t2-4","no":"4","title":"First application: re-describing SECI through the assay","line":125,"units":["t2-4","t2-4-1","t2-4-2","t2-4-3","t2-4-4","t2-4-5"]},{"id":"t2-5","no":"5","title":"Convergent evidence","line":166,"units":["t2-5","t2-5-1","t2-5-2","t2-5-3","t2-5-4"]},{"id":"t2-6","no":"6","title":"Discussion","line":188,"units":["t2-6","t2-6-1","t2-6-2","t2-6-3","t2-6-4","t2-6-5"]},{"id":"t2-7","no":"7","title":"Conclusion","line":228,"units":["t2-7"]},{"id":"t2-postscript","no":"","title":"Postscript","line":242,"units":["t2-postscript"]}],"units":[{"id":"t2-abstract","tier":"t2-abstract","no":"","title":"Abstract","intro":false,"line_start":11,"line_end":18,"paras":2,"size":298,"first":{"text":"This article operationalizes the concept of a *delegation legitimacy boundary* — the structural line along which human judgment can and cannot be legitimately delegated to artificial intelligence — and proposes a minimal scoring protocol for locating it within","line":13,"cut":true}},{"id":"t2-1","tier":"t2-1","no":"1","title":"Introduction","intro":false,"line_start":19,"line_end":32,"paras":6,"size":1134,"first":{"text":"Something that could not previously be measured is becoming measurable.","line":21,"cut":false}},{"id":"t2-2-1","tier":"t2-2","no":"2.1","title":"Three concepts, not two","intro":false,"line_start":35,"line_end":38,"paras":1,"size":150,"first":{"text":"The Mekiki framework (Tomita 2026) distinguished three concepts that are routinely conflated in discussions of AI-assisted knowledge work. *Domain expertise* is a resource that a practitioner possesses — accumulated through training, practice, and exposure to ","line":37,"cut":true}},{"id":"t2-2-2","tier":"t2-2","no":"2.2","title":"Derivation from the Mekiki case study","intro":false,"line_start":39,"line_end":48,"paras":4,"size":354,"first":{"text":"The Mekiki article recorded, in granular detail, the specification judgments that a domain expert made during the development of an EV charging application.","line":41,"cut":false}},{"id":"t2-2-3","tier":"t2-2","no":"2.3","title":"Philosophical foundations","intro":false,"line_start":49,"line_end":64,"paras":8,"size":712,"first":{"text":"The distinction just derived from case-study evidence is not new.","line":51,"cut":false}},{"id":"t2-2-4","tier":"t2-2","no":"2.4","title":"Generalization beyond Externalization","intro":false,"line_start":65,"line_end":72,"paras":3,"size":362,"first":{"text":"One further step is required before the decomposition can serve as the axis of an assay.","line":67,"cut":false}},{"id":"t2-3-1","tier":"t2-3","no":"3.1","title":"Why the assay conditions are now met","intro":false,"line_start":75,"line_end":78,"paras":1,"size":209,"first":{"text":"In pharmacological assay design, a compound's activity can only be measured when background noise is sufficiently attenuated.","line":77,"cut":false}},{"id":"t2-3-2","tier":"t2-3","no":"3.2","title":"The scoring protocol","intro":false,"line_start":79,"line_end":104,"paras":11,"size":910,"first":{"text":"The unit of analysis is the individual *feature decision*: a single judgment recorded in the design process — a data structure choice, a display condition, a filter rule, a non-adoption decision.","line":81,"cut":false}},{"id":"t2-3-3","tier":"t2-3","no":"3.3","title":"Worked example: a minimal demonstration","intro":false,"line_start":105,"line_end":116,"paras":5,"size":267,"first":{"text":"To illustrate the protocol's separating power, two judgments from the Mekiki case study are scored here, selected as analytically clean representatives — one Sein-dominant, one Sollen-dominant — from the case study's larger inventory of feature decisions; the ","line":107,"cut":true}},{"id":"t2-3-4","tier":"t2-3","no":"3.4","title":"Philosophical frameworks as candidate assay axes","intro":false,"line_start":117,"line_end":124,"paras":3,"size":539,"first":{"text":"The Sein/Sollen distinction is the minimal axis required for the present assay, but it is not the only philosophical distinction that could serve as a measurement coordinate.","line":119,"cut":false}},{"id":"t2-4","tier":"t2-4","no":"4","title":"First application: re-describing SECI through the assay","intro":true,"line_start":125,"line_end":128,"paras":1,"size":93,"first":{"text":"The cognitive assay developed in Sections 2 and 3 was derived from the Externalization process.","line":127,"cut":false}},{"id":"t2-4-1","tier":"t2-4","no":"4.1","title":"Externalization: the Mekiki framework's direct domain","intro":false,"line_start":129,"line_end":132,"paras":1,"size":142,"first":{"text":"Externalization — converting tacit knowledge into explicit form — is the process where AI's impact is most immediately visible and where the Mekiki framework was originally derived.","line":131,"cut":false}},{"id":"t2-4-2","tier":"t2-4","no":"4.2","title":"Combination: AI's strongest domain","intro":false,"line_start":133,"line_end":136,"paras":1,"size":109,"first":{"text":"Combination — integrating, sorting, and recategorizing explicit knowledge — is the process most saturated with externalization cost and correspondingly most amenable to AI acceleration.","line":135,"cut":false}},{"id":"t2-4-3","tier":"t2-4","no":"4.3","title":"Socialization: the domain of Sollen-type specification","intro":false,"line_start":137,"line_end":140,"paras":1,"size":269,"first":{"text":"Socialization — the sharing of tacit knowledge through shared experience, co-practice, and what Nonaka and Takeuchi called \"intellectual combat\" — is the process where Sollen-type specification is most concentrated.","line":139,"cut":false}},{"id":"t2-4-4","tier":"t2-4","no":"4.4","title":"Internalization: AI as catalyst, not substitute","intro":false,"line_start":141,"line_end":144,"paras":1,"size":130,"first":{"text":"Internalization — absorbing explicit knowledge into individual tacit practice — is weighted toward Sein-type specificati
