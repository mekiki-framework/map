e quotes, 6 cited elsewhere in the paper, 6 not cited: related prior work); the subsections where a citation appears (an author name, or a footnote mark pointing to that work) were determined mechanically from the line ranges of the skeleton; 1 decided by following footnote marks","Storyline by paper, 5 chapters and 43 steps: each chapter holds all the nodes of its paper (ordered by the lines of their quotations in 5 chapters, by the author in 0); 5 steps on a point that is easy to misread, each before the exit, from a row of the author’s record","DOIs of the 5 papers: DOI and version identical to the Reader’s list","Maps inside the papers: 117 units and 133 cross-references, identical to the lines of the text (the same text the Reader serves)","Parts: 311, with 128 links; quotations verified in the original language (exact 311 · normalized 0)","Figures and tables: 11 entries (5 figures · 6 tables), identical to a fresh mechanical extraction from the text; captions verified in the original language (exact 7 · normalized 4); no images are held","Sources of the cover and the introduction: 39 passages, all found where cited (author’s record 27, papers 10, front page of the public site 1, README 1); whether the new sentences keep to them is checked by the author’s reading","Paths: 5, with 24 questions and 32 remaining questions; quotations verified in the original language (exact 89 · normalized 0)","Addresses on record: 706, none gone (3 moved)","T4 is shown in its English access translation: 114 passages verified against that edition (exact 104 · normalized 10), each tied to its line in the original","English texts: 1356 entries, each paired with its Japanese source; none out of date"],"checked_at":"2026-11-23 01:06","divider_note":{"text":"Below this line are claims that do not follow from the theorem (constructive extension, interpretive thesis, hypothesis, case)","basis":"record","record":{"src":"THEORY_MAP","text":"Neither thesis is entailed by the analytic theorem. Do not report either as a demonstrated causal effect."},"lines":["not entailed by the theorem","(extension, thesis, hypothesis, case)"]},"default_orient":"v","inside":{"T1":{"units":28,"refs":16,"parts":69,"links":28},"T2":{"units":29,"refs":18,"parts":67,"links":25},"T3":{"units":20,"refs":17,"parts":49,"links":21},"T4":{"units":19,"refs":26,"parts":53,"links":24},"T5":{"units":21,"refs":56,"parts":73,"links":30}},"made_note":"Quotations from the source text have been checked against it character by character. Summaries, names and placement were made with AI, and the author confirmed them on the Japanese page. The English of this map is a translation of the Japanese page, made with AI; where the two differ, the Japanese governs.","routes":{"denshou":{"steps":8,"ends":9},"makaseru":{"steps":5,"ends":7},"manabu":{"steps":4,"ends":5},"shokuba":{"steps":4,"ends":6},"aete":{"steps":3,"ends":5}},"story":{"vis":"public","view":"chain","title":"Storyline of the five papers","lede":"T1–T4 ask what must remain on the human side when delegation occurs. T5 reverses the question and asks why an agent may rationally decline delegation even when it is technically possible and legitimate. This goes through the five papers one at a time, in reading order.","record":{"src":"THEORY_MAP","text":"T5 closes the series by reversing the question: where T1–T4 ask what must remain on the human side when delegation occurs, T5 asks why an agent may rationally decline delegation even when it is technically possible and legitimate."},"steps":[{"node":"ai"},{"paper":"T1"},{"paper":"T2"},{"paper":"T3"},{"paper":"T4"},{"paper":"T5"},{"end":true}],"end":{"title":"Closing","text":"The framework does not identify a residual list of tasks reserved for humans. It identifies different kinds of things: conversion costs, task-specific judgments, agency components, a non-transferable relation, a non-transferable participation fact, and distinct later claims about recognition and cultural conditions."},"chapters":[{"paper":"T1","abstract":"t1-abstract-p1","order":"lines","nodes":["t1-ext","t1-speccost","t1-spec","t1-ablation","t1-visibility"],"x":"x-t1"},{"paper":"T2","abstract":"t2-abstract-p1","order":"lines","nodes":["t2-seinsollen","t2-boundary","t2-assay","t2-ratelimit"],"x":"x-t2"},{"paper":"T3","abstract":"t3-abstract-p1","order":"lines","nodes":["t3-direction","t3-drive","t3-mode","t3-answer","t3-distinct","t3-twolayer"],"x":"x-t3"},{"paper":"T4","abstract":null,"order":"lines","nodes":["t4-ratelimit","t4-adherence","t4-undertake","t4-embody","t4-twopath"],"x":"x-t4"},{"paper":"T5","abstract":"t5-abstract-p1","order":"lines","nodes":["t5-objects","t5-theorem","t5-criterion","t5-roots","t5-apparatus","t5-norm","t5-visibility","t5-shogi"],"x":"x-t5"}],"old":{"T1":["t1-ext","t1-speccost","t1-spec","t1-ablation","t1-visibility"],"T2":["t2-seinsollen","t2-boundary","t2-assay","t2-ratelimit"],"T3":["t3-direction","t3-drive","t3-mode","t3-answer","t3-distinct","t3-twolayer"],"T4":["t4-ratelimit","t4-adherence","t4-undertake","t4-embody","t4-twopath"],"T5":["t5-objects","t5-theorem","t5-criterion","t5-roots","t5-apparatus","t5-norm","t5-visibility","t5-shogi"]},"ok":1},"front":{"vis":"public","headline":"How much to hand over to AI, and what to do yourself.","what":"The Mekiki Framework is a framework for isolating what cannot be delegated in knowledge work in the age of AI. Its name comes from mekiki, the Japanese term for expert discernment. There are five papers (preprints). The first four ask what must remain on the human side when delegation occurs; the fifth asks the converse: why an agent may rationally decline delegation even when it is technically possible and legitimate. This map is a guide for reading those five papers and does not replace them.","scenes":"Examples of reading the five papers against a familiar situation. Each situation has a few questions; choosing the closest answer leads to the next question or to a question that remains at the end. A remaining question is not an evaluation; it marks where to think next.","order":["makaseru","aete","manabu","denshou","shokuba"],"intro":{"vis":"public","papers":{"T1":"T1 distinguishes two things in knowledge work. One is the judgment about what to build, what to exclude, and what counts as quality; this is called specification. The other is the technical barrier to putting that judgment into a form such as text or code; this is called externalization cost. What AI lowers is externalization cost; specification does not become unnecessary. When that cost falls, specification becomes observable as a distinct substrate of output quality.","T2":"T2 divides the content of specification into two components: one concerned with factual adequacy (Sein-type) and one concerned with what ought to be prioritized and protected (Sollen-type). Most actual judgments are a mixture of the two. T2 then argues that whether AI can generate an output (capability) and whether AI can be the recognized source of the evaluative warrant carried by that output (legitimacy) are different questions. The line beyond which AI may generate outputs but cannot serve as the source of their legitimacy is the delegation legitimacy boundary. This boundary lies on the Sollen side. T2 writes that it holds as long as the authority to make value judgments remains institutionally attributed to human agents.","T3":"T3 asks, in the setting of learning, what this boundary is grounded in. When learner agency is provisionally distinguished into three components (direction, drive, and mode), something remains that is none of them: the standing to have to answer for a judgment to those entitled to ask. T3 calls this answerability and argues that it is not a component but a relation between the one who asks and the one who must answer. The asking side may be represented by another party; the answering side cannot answer by proxy.","T4":"T4 carries this relation into organizations. It redefines jibungoto-ka (treating matters as one’s own) as a combination of undertaking and embodiment. Undertaking is endorsing a purpose as one’s own reason for judgment and holding it within a relation of giving reasons to specific others; it is distinct from following instructions (obedience). Embodiment is the undertaken orientation becoming ingrained in practice through doing. T4 writes that unless the party asking also stands ready to answer, the setting for undertaking does not come into being. The more generative AI accelerates the externalization and combination of knowledge, the more undertaking and embodiment determine organizational speed.","T5":"T5 asks the converse: why an agent may rationally decline delegation even when it is technically possible and legitimate. T5’s theorem concerns games. The goal state of a game can be realized by someone else. But the fact that one pursued it oneself, with the constraints accepted (participation), does not thereby come to hold. This holds whether the substitute is a person or a machine, and does not depend on whether AI can play. The arguments about dignity and social recognition are written separately, as claims that do not follow directly from the theorem."},"close":"What the five papers identify is not a residual list of tasks reserved for humans but different kinds of things: conversion costs, task-specific judgments, agency components, a non-transferable relation, a non-transferable participation fact, and distinct later claims about recognition and cultural conditions. The recommended reading order is T1 to T5. This is an order of reading, not a claim that every later paper is logically entailed by its predecessors. The sentences here are summaries meant to lead to the papers; the papers’ own words, and the scope of their claims, are in each paper.","ok":1},"lede":"With AI you can do more, and it takes less effort, yet somewhere things stop fitting together. Is it a matter of the AI’s accuracy, of how it is used, or is something missing that ought to remain on the human side? Here you can check that third possibility against your own situation.","base":"The map draws on the five papers (preprints) of the Mekiki Framework, a framework for isolating what cannot be delegated in knowledge work in the age of AI. It is not a substitute for the papers.","about":{"title":"What the framework is for","sub":"A preface by the author: why it was made, who it is for, and how it can be used.","by":"Preface by the author","paras":["Reading all five papers at once is a considerable burden. Even I find it hard to move back and forth across the whole. The means for AI to refer to the papers accurately are already in place, on GitHub and in Mekiki Reader. What I wanted first was an entrance for people: a way to survey the whole and to come in from wherever is closest to their own interests. So I made this map.","I have in mind people who have started using AI at work or in their studies and who, while finding it convenient, are left with a nagging sense that “somehow it doesn’t fit” or “I can’t tell how much I can hand over.” I see it as a framework that can be used not only by researchers and specialists but also by people who work hands-on and by people who make things.","Its main use is to apply it to your own situation and find “where, in that situation, I need to think.” Beyond that, there are two further uses. Any passage that catches your attention can be checked against the original text of the papers. And when you think something through together with AI, it serves as a signpost that keeps the discussion from sliding onto a single axis: whether the AI is smart. I use it that way myself.","This map is not a substitute for the papers. Nor is the framework a collection of right answers or know-how for using AI. It can give clues for sorting out and reviewing your own situation, but it does not supply answers or make judgments on anyone’s behalf. What remains at the end is not an answer that evaluates anyone, but a place to stop and think next. Individual judgments stay in the hands of the person following it."]},"one_line":"How much to hand over to AI, and what to do yourself: a framework for rethinking this in situations at work and in learning (the Mekiki Framework), and a guide map to it.","ok":1},"ok":{"ui":1},"pre_marks":[" (unconfirmed)",", and unconfirmed"],"build":"release","lang":"en","alt":{"lang":"ja","label":"日本語","url":"../"}},"papers":[{"id":"T1","ja":"Judgment substrate","chain":"judgment substrate","lang":"en","version":"1","title":"Domain-Native Development: A Mekiki Framework for AI-Assisted Knowledge Work","doi":"https://doi.org/10.31235/osf.io/cwkav_v1","record":{"src":"THEORY_MAP","object":"Knowledge work and production of formal artifacts","operation":"Specification versus externalization cost (Ext.cost)","result":"AI selectively compresses Ext.cost, making specification observable as a distinct substrate of output quality","next":"T2 opens the internal structure of specification"},"url":"https://mekiki-framework.github.io/papers/T1.html","short":"Domain-Native Development","commentary":{"src":"THEORY_MAP","text":"T1 commentary: https://researchmap.jp/ketomy/others/53500468","url":"https://researchmap.jp/ketomy/others/53500468","lang":"ja"}},{"id":"T2","ja":"Delegation legitimacy","chain":"delegation legitimacy","lang":"en","version":"2","title":"Philosophy as Cognitive Assay: Measuring the Delegation Legitimacy Boundary in AI-Assisted Knowledge Work","doi":"https://doi.org/10.31235/osf.io/e9qw5_v2","record":{"src":"THEORY_MAP","object":"Individual specification judgments","operation":"Sein-type versus Sollen-type components; asymmetric scoring","result":"AI capability and delegation legitimacy are different questions; the boundary is located on the Sollen side","next":"T3 explains why legitimacy cannot be transferred merely by improving capability"},"url":"https://mekiki-framework.github.io/papers/T2.html","short":"Philosophy as Cognitive Assay","commentary":{"src":"THEORY_MAP","text":"T2 commentary: https://researchmap.jp/ketomy/others/53699246","url":"https://researchmap.jp/ketomy/others/53699246","lang":"ja"}},{"id":"T3","ja":"Answerability","chain":"answerability","lang":"en","version":"2","title":"Decomposing Agency, Isolating Answerability: Cultivating What Cannot Be Delegated in AI-Assisted Learning","doi":"https://doi.org/10.35542/osf.io/hvbfe_v2","record":{"src":"THEORY_MAP","object":"Learner agency and the bearer of judgment","operation":"Direction, two forms of drive, and mode examined through distinct delegation, support, training, and measurement questions; answerability is a separate relational layer","result":"T3 distinguishes non-substitutable endorsement from non-transferable answerability; support, training, and offloading remain different operations","next":"T4 carries the relation into organizations"},"url":"https://mekiki-framework.github.io/papers/T3.html","short":"Decomposing Agency, Isolating Answerability","commentary":{"src":"THEORY_MAP","text":"T3 commentary: https://researchmap.jp/ketomy/others/54141521","url":"https://researchmap.jp/ketomy/others/54141521","lang":"ja"}},{"id":"T4","ja":"Undertaking","chain":"undertaking","lang":"en","version":"1","title":"An Adherence-Based Redescription of \"Jibungoto-ka\" (Treating Matters as One's Own) in Organizations: What AI-Accelerated Knowledge Work Requires of Organizations","doi":"https://doi.org/10.31235/osf.io/495wg_v1","record":{"src":"THEORY_MAP","object":"Organizations and the field of undertaking (in Japanese)","operation":"Jibungoto-ka redefined as undertaking + embodiment; adherence transferred from medicine; two-pathway model (forward / reverse)","result":"Chronic failure of jibungoto-ka initiatives = pressing the forward pathway while the reverse pathway is absent; under AI acceleration, undertaking and embodiment become the rate-limiting steps","next":"T5 reverses the question: why decline delegation that is possible and legitimate"},"url":"https://mekiki-framework.github.io/papers/T4.en.html","short":"An Adherence-Based Redescription of Jibungoto-ka","title_orig":"組織における「自分ごと化」のアドヒアランス的再記述：知識労働がAIで加速された時に組織に求められるもの","ed":"en","ed_note":"English access translation, ed. 1.0.0 (2026-09-06); the Japanese original governs","ed_about":"T4 is written in Japanese. The passages, headings and opening sentences shown here are taken from the English access translation held in the corpus (edition 1.0.0, 2026-09-06). Line numbers (L) are those of the Japanese original, and “Verify” checks a passage against the translation and reports the original line. The edition describes itself as follows: “English access translation and translator notes prepared with ChatGPT; no separate author-review certification is asserted.” “Japanese original governs interpretation. This is a derivative access translation, not a new paper or preprint version.”"},{"id":"T5","ja":"Participation","chain":"participation","lang":"en","version":"3","title":"Why Play When AI Can Win: The Non-Transferability of Participation and the Visibility of Dignity","doi":"https://doi.org/10.31235/osf.io/593ah_v3","record":{"src":"THEORY_MAP","object":"Play, participation, dignity, and recognition under technological substitution","operation":"Achieved state versus participation; assist versus substitute; two locks; analytic theorem separated from normative extension, interpretive thesis, and sociological hypothesis","result":"Participation is agent-relative and non-transferable. The theorem does not itself establish dignity; T5 v3 constructively relates non-equivalence to recognition and distinguishes visibility from apparatus hypotheses","next":"The series terminates in a non-transferable participation value while preserving the logical status of later social claims"},"url":"https://mekiki-framework.github.io/papers/T5.html","short":"Why Play When AI Can Win"}],"bands":[{"id":"cost","ja":"conversion costs","en":"","lines":["conversion","costs"],"lines_v":["conversion costs"]},{"id":"judgment","ja":"task-specific judgments","en":"","lines":["task-specific","judgments"],"lines_v":["task-specific judgments"]},{"id":"component","ja":"agency components","en":"","lines":["agency","components"],"lines_v":["agency components"]},{"id":"relation","ja":"non-transferable relation","en":"","lines":["non-transferable","relation"],"lines_v":["non-transferable","relation"]},{"id":"participation","ja":"non-transferable participation fact","en":"","lines":["non-transferable","participation","fact"],"lines_v":["non-transferable","participation fact"]},{"id":"later","ja":"later claims about recognition and cultural conditions","en":"","lines":["later claims","about recognition","and cultural","conditions"],"lines_v":["later claims about","recognition and cultural","conditions"]}],"layers":[{"id":"ground","ja":"ground and interlocutors of each field","row":0,"lines":["ground and","interlocutors","of each field"]},{"id":"thin","ja":"thin strand on machines","row":1,"lines":["thin strand","on machines"]},{"id":"thick","ja":"thick systems, person to person","row":2,"lines":["thick systems,","person to person"]},{"id":"capability","ja":"roles of people and machines","row":3,"lines":["roles of people","and machines"]}],"nodes":[{"id":"ai","kind":"stimulus","label":"AI lowers Ext.cost","sub":"selective perturbation","paper":null,"band":null,"core":false,"basis":"text","vis":"public","gloss":"AI selectively lowers the technical barriers to giving specification a form (externalization cost). It does not abolish task-specific specification. The first three papers use AI as this selective perturbation.","quotes":[{"paper":"T1","text":"a component reducible by AI (externalisation cost)","line":62,"anchor":"t1-2-1","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"The first three papers use AI as a selective perturbation: T1 makes specification visible by reducing externalization cost"},{"src":"THEORY_MAP","text":"AI does not create the distinction between specification and Ext.cost. It selectively lowers Ext.cost and thereby makes the pre-existing distinction observable."}],"ok":1},{"id":"t1-ext","kind":"concept","label":"Externalization cost","sub":"Ext.cost","paper":"T1","band":"cost","core":false,"basis":"text","vis":"public","gloss":"The technical barriers to putting specification into a form such as text, code or a model. This is what AI lowers.","quotes":[{"paper":"T1","text":"denotes the technical barriers to converting tacit knowledge into explicit, formal representations","line":52,"anchor":"t1-2-1","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Externalization cost (Ext.cost) is the technical barrier to converting specification into a formal artifact such as text, code, a model, or a design."}],"ok":1},{"id":"t1-speccost","kind":"concept","label":"Specification cost","sub":"Spec.cost","paper":"T1","band":"cost","core":false,"basis":"text","vis":"public","gloss":"A property of the task: the degree to which the task demands domain expertise. It is not another name for specification (Spec.), nor the amount of judgment already there.","quotes":[{"paper":"T1","text":"specification cost is the degree to which a task demands domain expertise","line":54,"anchor":"t1-2-1","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Specification cost (Spec.cost) is a property of the task: the degree to which the task demands relevant domain expertise. It is not another name for specification and should not be described as a quantity of judgment already present."}],"ok":1},{"id":"t1-visibility","kind":"concept","label":"Visibility thesis","sub":"made visible by AI","paper":"T1","band":"cost","core":false,"basis":"text","vis":"public","gloss":"T1’s central claim: the distinction between the two costs is not a structure created by AI but a structure made visible by AI.","quotes":[{"paper":"T1","text":"The central claim of this paper is that the distinction between externalisation cost and specification cost is not a structure created by AI, but a structure made visible by AI.","line":213,"anchor":"t1-5-1","match":"normalized"}],"records":[{"src":"THEORY_MAP","text":"AI does not create the distinction between specification and Ext.cost. It selectively lowers Ext.cost and thereby makes the pre-existing distinction observable."}],"ok":1},{"id":"t1-spec","kind":"concept","label":"Specification (Spec.)","sub":"task-specific substrate","paper":"T1","band":"judgment","core":true,"basis":"text","vis":"public","gloss":"The task-specific judgments that result when domain expertise is invested in a task (what to build, what to exclude, what counts as quality): the substrate that underlies output quality. Domain expertise is a resource the practitioner possesses; it is a different term from specification cost (the demand on the task side).","quotes":[{"paper":"T2","text":"is what results when domain expertise is invested in a particular task: the concrete judgments about what should be built, what should be excluded, and by what criteria quality should be assessed","line":37,"anchor":"t2-2-1","match":"exact"},{"paper":"T1","text":"domain expertise is a resource that the practitioner possesses","line":54,"anchor":"t1-2-1","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Specification (Spec.) is the task-specific substrate produced when domain expertise is invested in a task: judgments about what to build, what to exclude, what matters, and how quality should be assessed."},{"src":"THEORY_MAP","text":"Do not turn T1 into the absolute claim that AI can never contribute to specification."}],"ok":1},{"id":"t1-ablation","kind":"concept","label":"Domain-ablation","sub":"experiment","paper":"T1","band":"judgment","core":false,"basis":"text","vis":"public","gloss":"An experiment to illustrate the prediction that, even when the quality of externalization is high, output may still be domain-inappropriate if specification is missing.","quotes":[{"paper":"T1","text":"To illustrate the framework's prediction that specification cost cannot be substituted by externalisation cost alone, a domain-ablation experiment was conducted.","line":163,"anchor":"t1-4-2","match":"exact"},{"paper":"T1","text":"technically competent but domain-inappropriate","line":14,"anchor":"t1-abstract","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"High-quality externalization cannot compensate for missing or inadequate specification: fluent or functional output may still be domain-inappropriate."}],"ok":1},{"id":"t2-ratelimit","kind":"concept","label":"Rate-limiting shift","sub":"SECI: E·C → S·I","paper":"T2","band":"cost","core":false,"basis":"text","vis":"public","gloss":"When AI accelerates externalization and combination while socialization and internalization remain at human speed, the stage that sets the pace of the whole shifts to those two. This is stated as an analytic consequence of the matrix, not as an empirical finding.","quotes":[{"paper":"T2","text":"When two processes in a sequential cycle are dramatically accelerated while the other two remain at human speed, the effective rate-limiting stage shifts to the unaccelerated processes.","line":160,"anchor":"t2-4-5","match":"exact"},{"paper":"T2","text":"This is not an empirical finding but an analytic consequence of the matrix above","line":160,"anchor":"t2-4-5","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"AI acceleration of Externalization and Combination shifts the effective bottleneck toward Socialization and Internalization, but each process remains internally mixed."}],"ok":1},{"id":"t2-seinsollen","kind":"concept","label":"Sein-type / Sollen-type","sub":"a ratio within Spec., not binary","paper":"T2","band":"judgment","core":false,"basis":"text","vis":"public","gloss":"The content of specification is divided into components concerned with factual adequacy (Sein-type) and components involving valuation (Sollen-type). Most actual judgments are mixed, and are viewed as a ratio rather than a binary. Sollen-type specification (a practitioner’s judgment) is distinct from Sollen (the norm itself).","quotes":[{"paper":"T2","text":"it derives a decomposition into Sein-type (factual) and Sollen-type (value-laden) components","line":29,"anchor":"t2-1","match":"normalized"},{"paper":"T2","text":"clean decomposition into pure Sein and pure Sollen is not always possible","line":53,"anchor":"t2-2-3","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Most real judgments are hybrid. Sein and Sollen are ratio dimensions, not mutually exclusive boxes."},{"src":"THEORY_MAP","text":"Sollen-type specification is the practitioner's capacity and task-specific judgment. Sollen may also refer to norms, requirements, or evaluative pressures present in the environment. The capacity to judge and the norm being judged under are not the same thing."}],"ok":1},{"id":"t2-boundary","kind":"concept","label":"Legitimacy boundary","sub":"delegation legitimacy boundary","paper":"T2","band":"judgment","core":true,"basis":"text","vis":"public","gloss":"Whether AI can generate an output and whether it can serve as the source of that output’s legitimacy are different questions. The boundary lies on the Sollen side. The Sein side moves as capability advances, but what moves is how far factual evaluation can be automated, not where normative authority lies. The claim is not about capability but about warrant: what stands behind a judgment. T2 writes that the boundary holds as long as the authority to make value judgments remains institutionally attributed to human agents.","quotes":[{"paper":"T2","text":"the line beyond which AI may generate outputs but cannot serve as the source of their legitimacy","line":29,"anchor":"t2-1","match":"exact"},{"paper":"T2","text":"The boundary is permeable on the Sein side","line":55,"anchor":"t2-2-3","match":"exact"},{"paper":"T2","text":"The claim is not about capability but about warrant.","line":55,"anchor":"t2-2-3","match":"exact"},{"paper":"T2","text":"The boundary is not a capability claim; it is a legitimacy claim, and it holds as long as the authority to make value judgments remains institutionally attributed to human agents.","line":29,"anchor":"t2-1","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"AI capability and delegation legitimacy are different questions; the boundary is located on the Sollen side"},{"src":"THEORY_MAP","text":"AI can generate Sollen-like language and may recommend the same action as an expert. That does not by itself transfer the warrant, authority, or standing behind the judgment."}],"ok":1},{"id":"t2-assay","kind":"concept","label":"Cognitive assay","sub":"asymmetric scoring","paper":"T2","band":"judgment","core":false,"basis":"text","vis":"public","gloss":"A scoring procedure that uses philosophical distinctions as coordinates of measurement. Sein rows are scored by AI and Sollen rows by domain experts, and the two are not added into a single index. The paper states that the values in the table applying the assay to SECI are theoretical assignments, not measured quantities.","quotes":[{"paper":"T2","text":"proposes a minimal scoring protocol for locating it within any knowledge-work task","line":13,"anchor":"t2-abstract","match":"exact"},{"paper":"T2","text":"These conditions — specification foregrounded, externalization cost attenuated, independent variation empirically documented — are the conditions under which an assay becomes viable.","line":77,"anchor":"t2-3-1","match":"exact"},{"paper":"T2","text":"The matrix values in Table 1 are theoretical assignments","line":162,"anchor":"t2-4-5","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"The cognitive assay assigns Sein-row scoring to AI and Sollen-row scoring to domain experts. The two rows must not be summed into one index because factual adequacy and normative warrant are not commensurable."}],"ok":1},{"id":"t3-direction","kind":"concept","label":"Direction","sub":"what the learner is oriented toward","paper":"T3","band":"component","core":false,"basis":"text","vis":"public","gloss":"What the learner is oriented toward. A candidate direction can be proposed from outside, but no one can endorse it in the learner’s place. Having come from outside does not prevent a direction from being endorsed later.","quotes":[{"paper":"T3","text":"Direction is what the learner is oriented toward.","line":41,"anchor":"t3-2-2","match":"normalized"},{"paper":"T3","text":"the evaluative commitment that makes some problems theirs rather than merely assigned","line":41,"anchor":"t3-2-2","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Direction has candidate and endorsed forms. Candidates may be proposed or jointly formed; each learner's endorsement cannot be supplied by a substitute. External origin does not rule out subsequent endorsement."}],"ok":1},{"id":"t3-drive","kind":"concept","label":"Drive (two forms)","sub":"activation → drive","paper":"T3","band":"component","core":false,"basis":"text","vis":"public","gloss":"The force behind the orientation. It has two forms: activation that has no target yet, and motivational drive tied to a particular direction. The conversion from the former to the latter is a design conjecture, not stated as a causal law.","quotes":[{"paper":"T3","text":"Magnitude is the drive behind the orientation: how much force the learner brings.","line":41,"anchor":"t3-2-2","match":"normalized"},{"paper":"T3","text":"embodied encounter with a problem-holder may contribute to the crystallization of evaluative commitment, and an endorsed direction may then anchor available activation as motivational drive","line":78,"anchor":"t3-3","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Motivational drive is propulsion anchored to a specific direction. The conversion from available activation is part of the design conjecture, not an established causal law."}],"ok":1},{"id":"t3-mode","kind":"concept","label":"Mode","sub":"repertoire of epistemic actions","paper":"T3","band":"component","core":false,"basis":"text","vis":"public","gloss":"The repertoire of epistemic actions, sensitive to the task. It is not a fixed learner type; it can be trained and supported.","quotes":[{"paper":"T3","text":"The learner who sharpens any draft put in front of them but originates none is not low in agency; they are operating in a single mode.","line":41,"anchor":"t3-2-2","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Mode denotes a task-sensitive repertoire of epistemic actions, not a fixed learning style; it is trainable and supportable."}],"ok":1},{"id":"t3-answer","kind":"concept","label":"Answerability","sub":"non-transferable standing","paper":"T3","band":"relation","core":true,"basis":"text","vis":"public","gloss":"A relation, not a component, that is left exposed once the components have been sorted. It is the standing of having to answer for a judgment to someone entitled to ask. The asking side can be done by proxy; the answering side cannot. Direction is something one has; answerability is something one stands in.","quotes":[{"paper":"T3","text":"what it leaves exposed is a relation that was never on the component list","line":90,"anchor":"t3-4-1","match":"exact"},{"paper":"T3","text":"what cannot be done on one's behalf is precisely to answer","line":102,"anchor":"t3-4-3","match":"exact"},{"paper":"T3","text":"A current AI system cannot be made to answer in this sense: nothing can be taken from it, no commitment of its own is at stake, and self-reproach, were it scripted, would idle.","line":110,"anchor":"t3-4-4","match":"exact"},{"paper":"T3","text":"an argument from present limits must be re-made each time capability moves; an argument from the structure of address does not","line":104,"anchor":"t3-4-3","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"It is the non-transferable standing to have to answer for a judgment to those entitled to ask. One has direction, drive, and mode; one stands in answerability."},{"src":"THEORY_MAP","text":"T3 does not establish a biological-human exceptionalism. The boundary tracks second-personal standing and competence, not substrate."}],"ok":1},{"id":"t3-distinct","kind":"concept","label":"Accountability, authority","sub":"distinct from answerability","paper":"T3","band":"relation","core":false,"basis":"text","vis":"public","gloss":"Separates accountability, which can be allocated, from answerability, a standing that does not transfer. The authority a learner grants an AI gives the AI no standing. Capability, authority, accountability and standing are four distinct variables.","quotes":[{"paper":"T3","text":"this article reserves accountability for institutionally allocatable duties — reportable, transferable, auditable — and answerability for the non-transferable standing","line":116,"anchor":"t3-4-4","match":"normalized"},{"paper":"T3","text":"The agent can be granted more authority without acquiring any standing.","line":102,"anchor":"t3-4-3","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Accountability is institutionally allocable. It can be assigned, audited, distributed, or reassigned through organizational design."},{"src":"THEORY_MAP","text":"Capability, perceived authority, accountability, and standing are four different variables."}],"ok":1},{"id":"t3-twolayer","kind":"concept","label":"Two-layer prescription","sub":"layer one / layer two","paper":"T3","band":"relation","core":false,"basis":"text","vis":"public","gloss":"Layer one works on what the decomposition can place: it maps components (an analytic compass), designs encounters, and sets guardrails on AI use. Layer two is second-personal exchange and addresses what layer one cannot reach. The encounter design guarantees exposure, never crystallization. Delegation for performance and delegation for development are different objects.","quotes":[{"paper":"T3","text":"Layer two addresses what layer one cannot reach.","line":120,"anchor":"t3-5","match":"exact"},{"paper":"T3","text":"The design guarantees exposure, never crystallization, and an honest program says so.","line":138,"anchor":"t3-5-2","match":"exact"},{"paper":"T3","text":"Performance delegation and developmental delegation are different objects","line":142,"anchor":"t3-5-3","match":"exact"},{"paper":"T3","text":"within any configuration, the answerable party is the human in it, not the configuration","line":152,"anchor":"t3-5-4","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Education develops answer-giving competence; AI can support rehearsal, while second-personal exchange tests and sustains its normative use."}],"ok":1},{"id":"t4-adherence","kind":"concept","label":"Locus of legitimacy moves","sub":"compliance → adherence","paper":"T4","band":"relation","core":false,"basis":"text","vis":"public","gloss":"A transition that medicine went through first: from an arrangement in which the authority to decide what treatment is right lies with the physician, to an arrangement locating legitimacy in agreement between the patient and healthcare professionals. T4 transfers this structure to organizations.","quotes":[{"paper":"T4","text":"Its core lies in a movement in the locus of legitimacy.","line":51,"anchor":"t4-2-1","match":"exact","target":"t4en-u051"},{"paper":"T4","text":"Adherence replaced this with an arrangement locating legitimacy in agreement between the patient and healthcare professionals.","line":51,"anchor":"t4-2-1","match":"exact","target":"t4en-u051"},{"paper":"T4","text":"This article transfers that structure to organizations.","line":19,"anchor":"paper-t4","match":"exact","target":"t4en-u019"}],"records":[{"src":"THEORY_MAP","text":"adherence transferred from medicine"}],"ok":1},{"id":"t4-undertake","kind":"concept","label":"Undertaking","sub":"endorsement within answerability","paper":"T4","band":"relation","core":true,"basis":"text","vis":"public","gloss":"Endorsing a purpose as one’s own reason for judgment, and holding it within a relation of giving reasons to specific others. This is distinct from following instructions (obedience). Even a goal given from outside, once undertaken, becomes something one is answerable for oneself. Unless the party asking also stands ready to answer, the setting for undertaking does not come into being.","quotes":[{"paper":"T4","text":"The internal side of undertaking is to endorse an externally given intention as one's own value judgment (Sollen), that is, as one's own reason for judgment.","line":69,"anchor":"t4-2-3","match":"normalized","target":"t4en-u069"},{"paper":"T4","text":"Undertaking, as used in this article, means the state in which the former is held within the relation of the latter.","line":77,"anchor":"t4-2-4","match":"exact","target":"t4en-u077"},{"paper":"T4","text":"The relational core of undertaking is non-transferable answerability, which requires reciprocity.","line":19,"anchor":"paper-t4","match":"exact","target":"t4en-u019"},{"paper":"T4","text":"Initiative begun on command is already no longer initiative.","line":180,"anchor":"t4-5-2","match":"exact","target":"t4en-u180"}],"records":[{"src":"THEORY_MAP","text":"Undertaking (引き受け) is the internal endorsement of a purpose, held within a relation of giving reasons to specific others. It is not compliance: following an instruction is not endorsing its purpose as one's own reason for judgment."}],"ok":1},{"id":"t4-embody","kind":"concept","label":"Embodiment","sub":"ingrained in practice","paper":"T4","band":"relation","core":false,"basis":"text","vis":"public","gloss":"The undertaken orientation becoming ingrained in practice. It occurs not by listening but through doing. Jibungoto-ka is a combination of undertaking and embodiment, and neither alone constitutes it.","quotes":[{"paper":"T4","text":"Embodiment means that the undertaken orientation becomes ingrained in practice and established in the body that carries out procedures.","line":69,"anchor":"t4-2-3","match":"exact","target":"t4en-u069"},{"paper":"T4","text":"Undertaking and embodiment do not constitute jibungoto-ka if either is present alone.","line":71,"anchor":"t4-2-3","match":"normalized","target":"t4en-u071"}],"records":[{"src":"THEORY_MAP","text":"Embodiment (身体化) is the integration of an undertaken orientation into practice. It occurs through doing, not through being told."}],"ok":1},{"id":"t4-twopath","kind":"concept","label":"Two-pathway model","sub":"whoever stops it must answer","paper":"T4","band":"relation","core":false,"basis":"text","vis":"public","gloss":"A forward pathway, in which an intention is communicated and undertaken, and a reverse pathway, in which an orientation arising from employees is formally considered and reasons are returned for adoption, deferral or termination alike. The reverse pathway is not a suggestion box. Accountability for a decision to stop is placed on the side that stops, not the side that starts.","quotes":[{"paper":"T4","text":"An orientation crystallized by an employee through encounter enters a formal process of consideration, and a specific authorized party gives reasons for adoption, deferral, or termination.","line":132,"anchor":"t4-4-3","match":"exact","target":"t4en-u132"},{"paper":"T4","text":"Many unsuccessful initiatives press Pathway 1 strongly","line":134,"anchor":"t4-4-3","match":"exact","target":"t4en-u134"},{"paper":"T4","text":"The design on the stopping side is not laissez-faire—“do not stop”—but an allocation: “whoever stops it must answer.”","line":170,"anchor":"t4-5-2","match":"exact","target":"t4en-u170"},{"paper":"T4","text":"The provisions establish both the obligation to ask and the obligation to answer","line":174,"anchor":"t4-5-2","match":"exact","target":"t4en-u174"}],"records":[{"src":"THEORY_MAP","text":"Chronic failure of jibungoto-ka initiatives is diagnosed as pressing the forward pathway while the reverse pathway is absent. The reverse pathway is not a suggestion box: collection without reasons returned does not constitute the pathway."},{"src":"THEORY_MAP","text":"T4's central placement: accountability for stopping decisions is assigned to the side that stops, not the side that starts."}],"ok":1},{"id":"t4-ratelimit","kind":"concept","label":"Becomes rate-limiting","sub":"AI-Accelerated","paper":"T4","band":"relation","core":false,"basis":"text","vis":"public","gloss":"The faster externalization and combination become, the more undertaking and embodiment determine organizational speed. Poor adherence was already there in organizations; in the AI era it comes to the foreground.","quotes":[{"paper":"T4","text":"The more generative AI accelerates the externalization and combination of knowledge, the more undertaking and embodiment become the rate-limiting steps.","line":19,"anchor":"paper-t4","match":"exact","target":"t4en-u019"},{"paper":"T4","text":"Poor adherence has long existed in organizations, but in the AI era it comes to the foreground as the rate-limiting step determining organizational speed.","line":41,"anchor":"t4-1-4","match":"exact","target":"t4en-u041"}],"records":[{"src":"THEORY_MAP","text":"T4 examines AI accelerating the organizational system: as externalization and combination speed up, undertaking and embodiment become the rate-limiting steps."}],"ok":1},{"id":"t5-objects","kind":"concept","label":"Achieved state, participation","sub":"two objects of desire","paper":"T5","band":"participation","core":false,"basis":"text","vis":"public","gloss":"A game presents two objects of desire: an achieved state (in principle producible without the game) and a participation (pursuing that state under self-accepted constraint). Delegating the whole delivers the former and dissolves the game.","quotes":[{"paper":"T5","text":"Every game presents two distinct objects of desire: (i) an achieved state — the prelusory goal, describable and in principle producible without the game — and (ii) a participation — the agent's pursuit of that state under self-accepted constraint.","line":67,"anchor":"t5-2-2","match":"exact"},{"paper":"T5","text":"it delivers the achieved state while dissolving the game","line":65,"anchor":"t5-2-2","match":"exact"},{"paper":"T5","text":"Some obstacles merely sat there: nobody chose them, they constitute nothing","line":73,"anchor":"t5-2-3","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Participation value is not achievement value. The achievement gap may be real without annulling participation."},{"src":"THEORY_MAP","text":"Chosen obstacles are not externalization cost. Constitutive constraints differ from technical barriers that AI properly removes."}],"ok":1},{"id":"t5-theorem","kind":"concept","label":"Non-transferability","sub":"analytic theorem on participation","paper":"T5","band":"participation","core":true,"basis":"text","vis":"public","gloss":"Even if another agent realizes the goal state, the fact that A pursued it, with the constraints accepted as reasons, does not thereby obtain. This holds whether the substitute is a person or a machine. The formal theorem concerns games and does not depend on whether AI can play.","quotes":[{"paper":"T5","text":"AI can deliver the state of affairs; it cannot deliver the fact of participation.","line":13,"anchor":"t5-abstract","match":"exact"},{"paper":"T5","text":"But the fact that A pursued p under R, with the constraints accepted as reasons, does not thereby obtain; and no further performance by the other agent can make it obtain, because A's having played is not a causal consequence of p that a sufficiently capable agent could also bring about.","line":79,"anchor":"t5-3-1","match":"exact"},{"paper":"T5","text":"There is no third task, between the first two, for a better machine to perform.","line":83,"anchor":"t5-3-1","match":"exact"},{"paper":"T5","text":"the seat was never held by superior ability in the first place","line":105,"anchor":"t5-3-3","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"The theorem is agent-relative and applies equally to human and artificial proxies. It is independent of whether artificial systems can achieve, play, or matter morally."},{"src":"THEORY_MAP","text":"Do not expand the formal theorem and the corollary into one unqualified universal claim."}],"claims":["T5-A1","T5-T1","T5-A3","T5-A4"],"ok":1},{"id":"t5-criterion","kind":"concept","label":"Criterion: undertaking","sub":"undertaking, not provenance","paper":"T5","band":"participation","core":false,"basis":"text","vis":"public","gloss":"What separates participation is not where the goal came from. It is whether the agent has undertaken it as the agent’s own reason, and whether the practice treats that agent as a participant. Command alone cannot constitute undertaking. This is a criterion the paper proposes and uses, not a separately proven theorem.","quotes":[{"paper":"T5","text":"The dividing line is not where the goal came from but what happened to it on arrival: whether the goal and its constraints are undertaken by the agent as the agent's own reasons — and, on the side that can be observed, whether the agent is treated by the practice as a participant who has so undertaken them.","line":93,"anchor":"t5-3-2","match":"exact"},{"paper":"T5","text":"Provenance is thereby demoted, not discarded","line":93,"anchor":"t5-3-2","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"An externally imposed constraint may later be undertaken. Command alone cannot constitute the uptake."}],"claims":["T5-A2"],"ok":1},{"id":"t5-roots","kind":"concept","label":"Two roots","sub":"normative / grammatical","paper":"T5","band":"participation","core":false,"basis":"text","vis":"public","gloss":"What remains on the human side of delegation has two independent roots: a normative root (the answering seat) and a grammatical root (the playing seat). Cases of answering without playing, and of playing without answering to anyone, show their independence.","quotes":[{"paper":"T5","text":"What remains on the human side of delegation has two independent roots.","line":111,"anchor":"t5-3-4","match":"exact"},{"paper":"T5","text":"The first is normative, and was isolated earlier in this series: the standing to answer for a judgement does not transfer without legitimate conferral — the answering seat (Tomita 2026a).","line":111,"anchor":"t5-3-4","match":"exact"},{"paper":"T5","text":"delegation presupposes an end external to the activity","line":111,"anchor":"t5-3-4","match":"exact"},{"paper":"T5","text":"the entire first image can be conceded to AI without remainder","line":113,"anchor":"t5-3-4","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"The playing seat and answering seat remain distinct. Where a practice includes an answering relation, reasons may be owed to and asked from participants; participation as such does not entail answerability."}],"ok":1},{"id":"t5-norm","kind":"concept","label":"Price and dignity","sub":"constructive extension","paper":"T5","band":"later","core":false,"basis":"text","vis":"public","gloss":"The theorem establishes agent-relative non-substitutability and no more. Dignity does not follow from it directly. That is a separate argument, which borrows Kant’s vocabulary constructively (what is exchangeable versus what has no equivalent).","quotes":[{"paper":"T5","text":"This is a constructive use of Kant's vocabulary, not an interpretation of Kant's own account of what has dignity","line":167,"anchor":"t5-4-4","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"The theorem establishes the second relation. It does not by itself establish dignity."}],"claims":["T5-N1","T5-N3"],"ok":1},{"id":"t5-visibility","kind":"concept","label":"Visibility thesis","sub":"interpretive thesis","paper":"T5","band":"later","core":false,"basis":"text","vis":"public","gloss":"An interpretive claim: where AI makes functionally equivalent outputs available at scale, the difference between outcome-equivalence and participant-relative history becomes salient. It is not a consequence of the theorem.","quotes":[{"paper":"T5","text":"The visibility thesis is an interpretive thesis: where AI makes functionally equivalent outputs newly available at scale, the distinction between outcome-equivalence and participant-relative history becomes salient.","line":181,"anchor":"t5-4-4","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Neither thesis is entailed by the analytic theorem. Do not report either as a demonstrated causal effect."}],"claims":["T5-I1"],"ok":1},{"id":"t5-apparatus","kind":"concept","label":"Dignity apparatus","sub":"sociological hypothesis","paper":"T5","band":"later","core":false,"basis":"text","vis":"public","gloss":"A cultural form that makes recognition of standing as a participant work in society. It leaves performance appraisal open while securing a floor of recognition. It is not a management technique, and it licenses neither scoring a person’s standing or the authenticity of play nor commanding enjoyment. The apparatus thesis is stated as a sociological hypothesis.","quotes":[{"paper":"T5","text":"A dignity apparatus is a cultural form that makes autotelic activity socially recognisable as worth taking seriously","line":151,"anchor":"t5-4-3","match":"exact"},{"paper":"T5","text":"The apparatus thesis is a sociological hypothesis: where standing has been strongly tied to scarce excellence, the resulting public exposure of one's output as substitutable may be experienced as humiliation unless institutions provide forms of recognition not exhausted by comparative performance.","line":181,"anchor":"t5-4-4","match":"exact"},{"paper":"T5","text":"nothing in this paper counsels retaining them","line":193,"anchor":"t5-4-6","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"A dignity apparatus does not confer or revoke Kantian dignity. It makes recognition of participant standing socially operative."},{"src":"THEORY_MAP","text":"The dignity apparatus is not a management technique. It does not license scoring the authenticity of play or commanding enjoyment."}],"claims":["T5-N2","T5-S1"],"ok":1},{"id":"t5-shogi","kind":"concept","label":"Shogi: a completed case","sub":"historical case","paper":"T5","band":"later","core":false,"basis":"text","vis":"public","gloss":"A completed historical case: shogi continued although, on the capability axis, the loss was real, total and permanent. The case is compatible with the proposed conditions and offers a candidate mechanism. It does not establish the apparatus’s necessity, sufficiency or causal effect.","quotes":[{"paper":"T5","text":"On the capability axis the loss was real, total and permanent","line":205,"anchor":"t5-5-2","match":"exact"},{"paper":"T5","text":"the historical case demonstrates compatibility and offers a candidate mechanism; it does not establish the apparatus's necessity, sufficiency, or causal effect","line":181,"anchor":"t5-4-4","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"It does not establish the necessity, sufficiency, or causal effect of a dignity apparatus."}],"claims":["T5-H1"],"ok":1},{"id":"x-t1","kind":"conflation","label":"Cheaper = no expertise","sub":"incorrect compression","paper":"T1","band":null,"core":false,"basis":"record","vis":"public","compression":"c03","stopper":"t1-spec","gloss":"","slip":"With AI, anyone can now build things.","quotes":[],"records":[{"src":"THEORY_MAP","text":"AI lowers Ext.cost = AI removes expertise requirements"},{"src":"THEORY_MAP","text":"Easier production does not abolish task-specific specification"}],"ok":1},{"id":"x-t2","kind":"conflation","label":"Capability = legitimacy","sub":"incorrect compression","paper":"T2","band":null,"core":false,"basis":"record","vis":"public","compression":"c07","stopper":"t2-boundary","gloss":"","slip":"Whatever AI can do may be handed over to AI.","quotes":[],"records":[{"src":"THEORY_MAP","text":"Capability frontier = delegation legitimacy boundary"},{"src":"THEORY_MAP","text":"What AI can do versus what it may legitimately stand behind"}],"ok":1},{"id":"x-t3","kind":"conflation","label":"Standing = competence","sub":"incorrect compression","paper":"T3","band":null,"core":false,"basis":"record","vis":"public","compression":"c13","stopper":"t3-answer","gloss":"","slip":"Whoever can answer well is the one who is answerable.","quotes":[],"records":[{"src":"THEORY_MAP","text":"Standing = competence"},{"src":"THEORY_MAP","text":"Who must answer versus how well that person can answer"}],"ok":1},{"id":"x-t4","kind":"conflation","label":"Undertaking = compliance","sub":"incorrect compression","paper":"T4","band":null,"core":false,"basis":"record","vis":"public","compression":"c16","stopper":"t4-undertake","gloss":"","slip":"It is enough to tell people to take it on as their own.","quotes":[],"records":[{"src":"THEORY_MAP","text":"Undertaking = compliance"},{"src":"THEORY_MAP","text":"Internal endorsement held toward specific others versus following instructions"}],"ok":1},{"id":"x-t5","kind":"conflation","label":"Read as “AI cannot play”","sub":"incorrect compression","paper":"T5","band":null,"core":false,"basis":"record","vis":"public","compression":"c17","stopper":"t5-theorem","gloss":"","slip":"T5 says that AI cannot play.","quotes":[],"records":[{"src":"THEORY_MAP","text":"T5 claims AI cannot play"},{"src":"THEORY_MAP","text":"T5 makes no such claim; even a genuine AI player's play is its own play — another agent's participation is never mine"}],"ok":1},{"id":"rail","kind":"rail","label":"Capability axis: who does it better","sub":"where the misreadings lead (interpretation)","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","gloss":"Reading different kinds of question as a matter of “who does it better” makes the distinctions disappear. Four of the five misreadings placed on the overview take this form. The T4 example is of a different type: it replaces the relation with a surrogate that can be checked (a signature, a record, an expression of loyalty). Gathering the destinations into this single axis is the map’s arrangement; it does not mean that this is the only type of misreading.","quotes":[{"paper":"T5","text":"On the capability axis the loss was real, total and permanent","line":205,"anchor":"t5-5-2","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"State capability and legitimacy separately."}],"ok":1},{"id":"p-seci","kind":"precursor","label":"Tacit knowledge · SECI","sub":"from Polanyi to Nonaka","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"ground","col":0,"row":0,"members":["Polanyi 1966","Nonaka 1994","Nonaka & Takeuchi (1995, 2019)"],"targets":["t1-ext","t2-ratelimit","t4-ratelimit"],"gloss":"The strand T1 names as the lineage of the framework. T1 takes the term externalization from Nonaka’s SECI model and distinguishes two conditions within it. T2 re-describes the four SECI processes through three components, and T4 carries the shift of the rate-limiting stage into organizations. T4 writes that it does not attempt to replace Nonaka’s theory. Neither Polanyi nor Nonaka is named in T5.","quotes":[{"paper":"T1","text":"The framework operates within a lineage that runs from Polanyi through Nonaka to the present analysis.","line":62,"anchor":"t1-2-1","match":"exact"},{"paper":"T1","text":"The present framework identifies, within Nonaka's Externalisation phase, two conditions that determine whether externalisation produces domain-appropriate outputs","line":62,"anchor":"t1-2-1","match":"exact"},{"paper":"T2","text":"The re-description is not an exegesis of the original model but a constructive refinement","line":127,"anchor":"t2-4","match":"exact"},{"paper":"T4","text":"This article does not attempt to replace Nonaka's theory.","line":140,"anchor":"t4-4-3","match":"exact","target":"t4en-u140"}],"records":[{"src":"THEORY_MAP","text":"Sein-type and Sollen-type components can occur within every SECI process. They must not be mapped one-to-one onto Socialization, Externalization, Combination, or Internalization."}],"cited":{"T1":25,"T2":15,"T3":3,"T4":5},"ok":1},{"id":"p-kant","kind":"precursor","label":"Hume · Kant · Nagel","sub":"is / ought; agent-relative reasons","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"ground","col":1,"row":0,"members":["Hume 1739","Kant (1781, 1785)","Nagel (1979, 1986)","Parfit 1984"],"targets":["t2-seinsollen","t2-assay","t5-norm","t5-theorem"],"gloss":"The strand T2 cites as the source of the Sein/Sollen distinction; T2 writes that the distinction is not new. As the ground for the scoring asymmetry it places Nagel’s argument that agent-relative reasons are irreducible. T5 also cites Kant and Nagel. From Kant’s price and dignity it borrows a single formal feature: exchangeability versus non-equivalence. It takes the term agent-relative from Parfit by way of Nagel’s account, and states that it uses the term derivatively for the theorem.","quotes":[{"paper":"T2","text":"It is, in fact, among the oldest in Western philosophy.","line":51,"anchor":"t2-2-3","match":"exact"},{"paper":"T2","text":"This irreducibility provides the deepest philosophical justification for the scoring asymmetry introduced in Section 3","line":53,"anchor":"t2-2-3","match":"exact"},{"paper":"T5","text":"I borrow one formal feature of his distinction — the contrast between exchangeability and non-equivalence — and extend it beyond that original application.","line":167,"anchor":"t5-4-4","match":"exact"},{"paper":"T5","text":"Nagel (1986, pp. 152–153) calls a reason agent-relative when its general form includes an essential reference to the person who has it.","line":81,"anchor":"t5-3-1","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"T5 uses *agent-relative* derivatively for the non-substitutability of that participation fact; it does not attribute a theory of facts to Nagel."},{"src":"THEORY_MAP","text":"The paper constructively borrows one formal feature of Kant's distinction — exchangeability versus non-equivalence — rather than claiming that Kant himself classified play or participation as dignity."}],"cited":{"T2":25,"T5":17},"ok":1},{"id":"p-agency","kind":"precursor","label":"Theories of agency","sub":"what agency is made of","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"ground","col":2,"row":0,"members":["Bandura 2001 (psychological function)","Emirbayer & Mische 1998 (temporal orientation)","Zimmerman 2000 (self-regulated learning)"],"targets":["t3-direction","t3-drive","t3-mode"],"gloss":"The earlier decompositions T3 lists as education’s own stream. T3 writes that they say what agency is made of, not what may be handed over. T3 does not add a fourth conception; it cuts the same material along a different plane, delegability.","quotes":[{"paper":"T3","text":"They say what agency is made of, not what may be handed over.","line":21,"anchor":"t3-1","match":"exact"},{"paper":"T3","text":"This article does not add a fourth conception alongside them but cuts on a different axis","line":23,"anchor":"t3-1","match":"exact"},{"paper":"T3","text":"The same material, cut along a different plane, yields different cross-sections","line":37,"anchor":"t3-2-1","match":"exact"}],"records":[],"cited":{"T3":11},"ok":1},{"id":"p-gap","kind":"precursor","label":"Many hands, responsibility gap","sub":"who answers becomes hard to see","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"ground","col":3,"row":0,"members":["Thompson 1980","van de Poel et al. 2015","Matthias 2004"],"targets":["t4-twopath"],"gloss":"A classical diagnosis: the more hands are involved, and the more judgment moves to machines, the harder it becomes to see who answers. T4 writes that, only for delegation that makes the Sein/Sollen decomposition explicit, the reverse may be possible (the locus of judgment becoming visible). T4 itself limits this: it is not a claim about AI adoption in general.","quotes":[{"paper":"T4","text":"This consequence also intersects, in the reverse direction, with a classical diagnosis of organizational responsibility.","line":144,"anchor":"t4-4-3","match":"exact","target":"t4en-u144"},{"paper":"T4","text":"This reversal is not a claim about AI adoption in general.","line":144,"anchor":"t4-4-3","match":"exact","target":"t4en-u144"}],"records":[],"cited":{"T4":5},"ok":1},{"id":"p-kawatani","kind":"precursor","label":"Kawatani 2012","sub":"the one who awakens steps down","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"ground","col":4,"row":0,"members":["Kawatani 2012 (“On the possibility that life is a game”, in Japanese)"],"targets":["t5-roots","t5-apparatus"],"gloss":"The negative side of the line T5 calls its lineage (Suits 1967, 1978). Kawatani gave the mechanism: playing absorbedly and seeing through the game as a game are close to incompatible. T5 writes that the deeper basis of the theorem (the two images of the world) is Kawatani’s, and answers the mechanism with its analysis of the conditions of acceptance.","quotes":[{"paper":"T5","text":"The deeper basis itself is Kawatani's.","line":113,"anchor":"t5-3-4","match":"exact"},{"paper":"T5","text":"Kawatani gave the vision its mechanism, and it is the sharpest on record","line":133,"anchor":"t5-4-1","match":"exact"},{"paper":"T5","text":"gives its author a seat at the table rather than a line in a bibliography","line":37,"anchor":"t5-1","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Kawatani's limiting case adds a qualification lock before agent-relativity."}],"cited":{"T5":16},"ok":1},{"id":"p-lovelace","kind":"precursor","label":"Lovelace 1843","sub":"machines, and who knows the domain","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"thin","col":0,"row":1,"members":["Lovelace 1843 (Note G)"],"targets":["t1-spec"],"gloss":"Cited in T1’s conclusion: the boundary between what machines can perform and what only those already acquainted with the domain can provide.","quotes":[{"paper":"T1","text":"the boundary between what machines can perform and what only those already acquainted with the domain can provide","line":327,"anchor":"t1-closing","match":"exact"}],"records":[],"cited":{"T1":1},"ok":1},{"id":"p-moor","kind":"precursor","label":"Weizenbaum · Moor","sub":"what machines may be left to decide","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"thin","col":1,"row":1,"members":["Weizenbaum 1976","Moor 1979","Johnson 2025 (rereads Moor and takes issue)"],"targets":["t2-boundary"],"gloss":"Moor’s final maxim, that computers should not be left to decide basic goals and values, resonates with T2’s boundary. T2 grants that AI can produce value-laden outputs and relocates the point to the source of legitimacy. Johnson (2025) takes issue with several of Moor’s arguments and suggests that, given the nature of values, the maxim cannot be carried out as stated (from the abstract).","quotes":[],"records":[],"cited":{},"ok":1},{"id":"p-kuflik","kind":"precursor","label":"Kuflik 1984, 1999","sub":"what cannot be handed over","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"thin","col":2,"row":1,"members":["Kuflik 1984 (the inalienability of autonomy)","Kuflik 1999 (transfer of authority to computers)"],"targets":["t3-answer","t5-theorem"],"gloss":"The outline: one may defer to greater expertise, but responsibility for oversight remains, and it also matters who did the thing. Not a lone precursor but one member of the strand that runs from Moor 1979.","quotes":[],"records":[],"cited":{},"ok":1},{"id":"p-suits","kind":"precursor","label":"Schlick · Suits","sub":"play and the meaning of life","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"thin","col":4,"row":1,"members":["Schlick 1927","Suits 1978"],"targets":["t5-objects"],"gloss":"Cited by T5 as the edge that joins the definitional apparatus (Suits) and the meaning of life (Schlick).","quotes":[{"paper":"T5","text":"the Schlick–Suits edge, the one that runs through the meaning of life, has to my knowledge not been drawn at all","line":145,"anchor":"t5-4-2","match":"exact"}],"records":[],"cited":{"T5":59},"ok":1},{"id":"p-law","kind":"precursor","label":"Law: agency, representation","sub":"who may act on whose behalf","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"thick","col":1,"row":2,"members":["Agency and mandate in the Japanese Civil Code","Hobbes, Leviathan, ch. 16","Pitkin, The Concept of Representation"],"targets":["t2-boundary","t5-roots"],"gloss":"A long-built body of distinctions, arranged around three parties (principal, agent and third party), about who may act on whose behalf and on whom the effects fall. The five papers do not cite it (T4 uses statutory provisions in its text, such as Article 24 of the Pharmacists Act).","quotes":[],"records":[],"cited":{},"ok":1},{"id":"p-darwall","kind":"precursor","label":"Darwall 2006","sub":"the second person one answers to","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"thick","col":2,"row":2,"members":["Darwall 2006"],"targets":["t3-answer","t4-undertake"],"gloss":"T3 borrows the structure of second-personal address. T3 itself writes that the claim that evaluative judgments stand in the same relation is T3’s own extension and is not in Darwall’s text.","quotes":[{"paper":"T3","text":"From Darwall (2006) we take the structure of second-personal address.","line":100,"anchor":"t3-4-3","match":"exact"}],"records":[],"cited":{"T3":9,"T4":3,"T5":8},"ok":1},{"id":"p-adherence","kind":"precursor","label":"Adherence in medicine","sub":"from compliance to participation","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"thick","col":3,"row":2,"members":["WHO 2003"],"targets":["t4-adherence"],"gloss":"T4’s starting point: the shift in medicine from obedience to instructions (compliance) to an arrangement that locates legitimacy in agreement between the patient and healthcare professionals (adherence). T4 transfers this structure to organizations.","quotes":[{"paper":"T4","text":"Adherence replaced this with an arrangement locating legitimacy in agreement between the patient and healthcare professionals.","line":51,"anchor":"t4-2-1","match":"exact","target":"t4en-u051"}],"records":[],"cited":{"T4":5},"ok":1},{"id":"p-bainbridge","kind":"precursor","label":"Function allocation","sub":"Bainbridge: unused skills fade","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"capability","col":2,"row":3,"members":["Fitts 1951","Bainbridge 1983","Parasuraman et al. 2000"],"targets":["t3-twolayer"],"gloss":"Research on the division of roles between people and machines. Bainbridge (1983) argued that automation can expand rather than eliminate problems with the human operator, and observed that it removes the opportunity to maintain skills. Parasuraman et al. (2000) classified automation by types of function and by levels, and proposed choosing among them with human performance consequences as the primary criterion (from the abstract). The point about opportunities to maintain skills is treated in the five papers only with respect to learners.","quotes":[],"records":[],"cited":{},"ok":1}],"edges":[{"id":"e-ai-ext","from":"ai","to":"t1-ext","type":"states","label":"lowers","basis":"text","vis":"public","note":"","quote":{"paper":"T1","text":"a component reducible by AI (externalisation cost)","line":62,"anchor":"t1-2-1","match":"exact"},"ok":1},{"id":"e-ai-vis","from":"ai","to":"t1-visibility","type":"states","label":"makes visible","basis":"text","vis":"public","note":"","quote":{"paper":"T1","text":"The central claim of this paper is that the distinction between externalisation cost and specification cost is not a structure created by AI, but a structure made visible by AI.","line":213,"anchor":"t1-5-1","match":"normalized"},"ok":1},{"id":"e-ai-rate","from":"ai","to":"t2-ratelimit","type":"states","label":"accelerates externalization and combination","basis":"text","vis":"public","note":"","quote":{"paper":"T2","text":"Applied to SECI: AI acceleration of E and C shifts the effective bottleneck to S and I.","line":160,"anchor":"t2-4-5","match":"exact"},"ok":1},{"id":"e-spec-ss","from":"t1-spec","to":"t2-seinsollen","type":"states","label":"decomposes specification","basis":"text","vis":"public","note":"","quote":{"paper":"T2","text":"the present article derives a further decomposition within specification itself","line":13,"anchor":"t2-abstract","match":"exact"},"ok":1},{"id":"e-ss-bd","from":"t2-seinsollen","to":"t2-boundary","type":"states","label":"runs along this distinction","basis":"text","vis":"public","note":"","quote":{"paper":"T2","text":"The delegation legitimacy boundary, introduced in Section 1, runs along this distinction.","line":55,"anchor":"t2-2-3","match":"exact"},"ok":1},{"id":"e-assay-bd","from":"t2-assay","to":"t2-boundary","type":"states","label":"locates it","basis":"text","vis":"public","note":"","quote":{"paper":"T2","text":"proposes a minimal scoring protocol for locating it within any knowledge-work task","line":13,"anchor":"t2-abstract","match":"exact"},"ok":1},{"id":"e-bd-ans","from":"t2-boundary","to":"t3-answer","type":"states","label":"takes up the relation T2 introduced","basis":"text","vis":"public","note":"","quote":{"paper":"T3","text":"introduced in prior work as the non-transferable relation in which the warrant of a judgment remains anchored in a particular agent (Tomita, 2026b)","line":90,"anchor":"t3-4-1","match":"exact"},"ok":1},{"id":"e-rate-two","from":"t2-ratelimit","to":"t3-twolayer","type":"states","label":"moves to the second-personal setting","basis":"text","vis":"public","note":"","quote":{"paper":"T3","text":"When AI accelerates the externalization and combination of knowledge, the rate-limiting processes shift to socialization and internalization (Nonaka & Takeuchi, 1995; Tomita, 2026b) — and socialization, where evaluative commitments are contested and revised between persons, is precisely the second-personal site.","line":152,"anchor":"t3-5-4","match":"exact"},"ok":1},{"id":"e-dir-drive","from":"t3-direction","to":"t3-drive","type":"states","label":"anchors (design conjecture)","basis":"text","vis":"public","note":"","quote":{"paper":"T3","text":"We propose a design conjecture in three movements: embodied encounter with a problem-holder may contribute to the crystallization of evaluative commitment, and an endorsed direction may then anchor available activation as motivational drive.","line":78,"anchor":"t3-3","match":"exact"},"ok":1},{"id":"e-ans-und","from":"t3-answer","to":"t4-undertake","type":"states","label":"becomes the core of undertaking","basis":"text","vis":"public","note":"","quote":{"paper":"T4","text":"The relational core of undertaking is non-transferable answerability, which requires reciprocity.","line":19,"anchor":"paper-t4","match":"exact","target":"t4en-u019"},"ok":1},{"id":"e-adh-und","from":"t4-adherence","to":"t4-undertake","type":"states","label":"transfers to organizations","basis":"text","vis":"public","note":"","quote":{"paper":"T4","text":"This article transfers that structure to organizations.","line":19,"anchor":"paper-t4","match":"exact","target":"t4en-u019"},"ok":1},{"id":"e-rate-rate","from":"t2-ratelimit","to":"t4-ratelimit","type":"states","label":"in organizations","basis":"text","vis":"public","note":"","quote":{"paper":"T4","text":"As externalization and combination become faster, the rate-limiting step—the slowest step that determines the speed of the whole—moves toward socialization and internalization. In this article's vocabulary, organizations unable to sustain undertaking and embodiment increasingly encounter their bottleneck at that very point.","line":41,"anchor":"t4-1-4","match":"exact","target":"t4en-u041"},"ok":1},{"id":"e-ans-roots","from":"t3-answer","to":"t5-roots","type":"states","label":"normative root","basis":"text","vis":"public","note":"","quote":{"paper":"T5","text":"The first is normative, and was isolated earlier in this series: the standing to answer for a judgement does not transfer without legitimate conferral — the answering seat (Tomita 2026a).","line":111,"anchor":"t5-3-4","match":"exact"},"ok":1},{"id":"e-thm-roots","from":"t5-theorem","to":"t5-roots","type":"states","label":"grammatical root","basis":"text","vis":"public","note":"","quote":{"paper":"T5","text":"The second is grammatical, and is isolated here: delegation presupposes an end external to the activity","line":111,"anchor":"t5-3-4","match":"exact"},"ok":1},{"id":"e-und-crit","from":"t4-undertake","to":"t5-criterion","type":"record","label":"hinge concept","basis":"record","vis":"public","note":"","record":{"src":"THEORY_MAP","text":"Undertaking is the hinge concept, but T5 does not redescribe organizational undertaking as play"},"ok":1},{"id":"e-shogi-app","from":"t5-shogi","to":"t5-apparatus","type":"states","label":"shows compatibility (not causation)","basis":"text","vis":"public","note":"","quote":{"paper":"T5","text":"the historical case demonstrates compatibility and offers a candidate mechanism; it does not establish the apparatus's necessity, sufficiency, or causal effect","line":181,"anchor":"t5-4-4","match":"exact"},"ok":1},{"id":"o-t1-t2","from":"h-T1","to":"h-T2","type":"order","label":"reading order","basis":"record","vis":"public","note":"","record":{"src":"THEORY_MAP","text":"For a whole-programme reading, use the order T1 → T2 → T3 → T4 → T5. This is a recommended reading sequence, not a claim that every later paper is logically entailed by its predecessors."},"ok":1},{"id":"o-t2-t3","from":"h-T2","to":"h-T3","type":"order","label":"reading order","basis":"record","vis":"public","note":"","record":{"src":"THEORY_MAP","text":"For a whole-programme reading, use the order T1 → T2 → T3 → T4 → T5. This is a recommended reading sequence, not a claim that every later paper is logically entailed by its predecessors."},"ok":1},{"id":"o-t3-t4","from":"h-T3","to":"h-T4","type":"order","label":"reading order","basis":"record","vis":"public","note":"","record":{"src":"THEORY_MAP","text":"For a whole-programme reading, use the order T1 → T2 → T3 → T4 → T5. This is a recommended reading sequence, not a claim that every later paper is logically entailed by its predecessors."},"ok":1},{"id":"o-t4-t5","from":"h-T4","to":"h-T5","type":"order","label":"reading order","basis":"record","vis":"public","note":"","record":{"src":"THEORY_MAP","text":"For a whole-programme reading, use the order T1 → T2 → T3 → T4 → T5. This is a recommended reading sequence, not a claim that every later paper is logically entailed by its predecessors."},"ok":1},{"id":"s-x-t1","from":"t1-spec","to":"x-t1","type":"stop","label":"blocks","basis":"record","vis":"public","note":"","record":{"src":"THEORY_MAP","text":"Easier production does not abolish task-specific specification"},"ok":1},{"id":"l-x-t1","from":"x-t1","to":"rail","type":"slide","label":"recast as a matter of capability","basis":"reading","vis":"public","note":"","ok":1},{"id":"s-x-t2","from":"t2-boundary","to":"x-t2","type":"stop","label":"blocks","basis":"record","vis":"public","note":"","record":{"src":"THEORY_MAP","text":"What AI can do versus what it may legitimately stand behind"},"ok":1},{"id":"l-x-t2","from":"x-t2","to":"rail","type":"slide","label":"recast as a matter of capability","basis":"reading","vis":"public","note":"","ok":1},{"id":"s-x-t3","from":"t3-answer","to":"x-t3","type":"stop","label":"blocks","basis":"record","vis":"public","note":"","record":{"src":"THEORY_MAP","text":"Who must answer versus how well that person can answer"},"ok":1},{"id":"l-x-t3","from":"x-t3","to":"rail","type":"slide","label":"recast as a matter of capability","basis":"reading","vis":"public","note":"","ok":1},{"id":"s-x-t4","from":"t4-undertake","to":"x-t4","type":"stop","label":"bloc y the paper","basis":"reading","vis":"public","note":"","cite":true,"cite_units":["t4-4-3"],"node_units":["t4-4-3","t4-5-2"],"cite_notes":["b18","b19","b20"],"cite_here":true,"ok":1},{"id":"g-p-kawatani-t5-roots","from":"p-kawatani","to":"t5-roots","type":"lineage","label":"cited by the paper","basis":"reading","vis":"public","note":"","cite":true,"cite_units":["t5-1","t5-3-4","t5-4-1"],"node_units":["t5-3-4"],"cite_here":true,"ok":1},{"id":"g-p-kawatani-t5-apparatus","from":"p-kawatani","to":"t5-apparatus","type":"lineage","label":"cited elsewhere in the paper","basis":"reading","vis":"public","note":"","cite":true,"cite_units":["t5-1","t5-3-4","t5-4-1"],"node_units":["t5-4-3","t5-4-4","t5-4-6"],"cite_here":false,"ok":1}],"compressions":[{"id":"c01","wrong":"Specification = specification cost","keep":"Substrate versus task demand for that substrate","papers":["T1"],"basis":"record","src":"THEORY_MAP"},{"id":"c02","wrong":"Specification = prompt quality","keep":"Domain-grounded judgment versus one possible medium of expression","papers":["T1"],"basis":"record","src":"THEORY_MAP"},{"id":"c03","wrong":"AI lowers Ext.cost = AI removes expertise requirements","keep":"Easier production does not abolish task-specific specification","papers":["T1"],"basis":"record","src":"THEORY_MAP"},{"id":"c04","wrong":"Sein = objective and Sollen = subjective","keep":"Factual warrant versus evaluative warrant; both may be contestable","papers":["T2"],"basis":"record","src":"THEORY_MAP"},{"id":"c05","wrong":"Sollen-type specification = external norms","keep":"A practitioner's evaluative judgment versus the normative environment","papers":["T2"],"basis":"record","src":"THEORY_MAP"},{"id":"c06","wrong":"Sollen output = legitimate Sollen judgment","keep":"Generated content versus recognized source of warrant","papers":["T2"],"basis":"record","src":"THEORY_MAP"},{"id":"c07","wrong":"Capability frontier = delegation legitimacy boundary","keep":"What AI can do versus what it may legitimately s
