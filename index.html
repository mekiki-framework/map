they belong to it rather than qualify it.","line":193,"cut":false}},{"id":"t5-5-1","tier":"t5-5","no":"5.1","title":"The case","intro":false,"line_start":197,"line_end":202,"paras":2,"size":339,"first":{"text":"Section 1 introduced the match; here is the case in full.","line":199,"cut":false}},{"id":"t5-5-2","tier":"t5-5","no":"5.2","title":"The assay: three axes","intro":false,"line_start":203,"line_end":208,"paras":2,"size":355,"first":{"text":"What exactly was lost that day, and what was not? The event decomposes along three axes, and the decomposition is an assay executed at the scale of an entire field.","line":205,"cut":false}},{"id":"t5-5-3","tier":"t5-5","no":"5.3","title":"What survived, and the record","intro":false,"line_start":209,"line_end":216,"paras":3,"size":374,"first":{"text":"Suits distinguishes, within the attitude of contest, the parties' agreement to make a contest of it at all from each party's desire that its own side prevail (Suits [1978] 2014, ch. 7).","line":211,"cut":false}},{"id":"t5-5-4","tier":"t5-5","no":"5.4","title":"Conclusion","intro":false,"line_start":217,"line_end":224,"paras":2,"size":217,"first":{"text":"The case yields a model, and the model has three parts.","line":219,"cut":false}},{"id":"t5-postscript","tier":"t5-postscript","no":"","title":"Postscript","intro":false,"line_start":225,"line_end":230,"paras":2,"size":276,"first":{"text":"In the spring of 1951, Ludwig Wittgenstein was dying of cancer and knew it (Malcolm 1984).","line":227,"cut":false}}],"refs":[{"from":"t5-1","to":"t5-5-1","to_no":"5","line":25,"text":"public went on watching, and the game's public stature in Japan did not collapse — by several ordinary measures it flourished (the evidence, and the causal hedges it requires, are given in Section 5).","cut":true,"dir":"fwd"},{"from":"t5-1","to":"t5-5-1","to_no":"5","line":25,"text":"The units are deliberately asymmetric — one player's exit against one institution's absorption — and the Go world itself did not follow its champion out the door: professional play continued, and by one population-level measure improved (Section 5 returns to the evidence).","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-4-4","to_no":"4.4","line":27,"text":"Play is chosen here not as the paper's scope but as its purest specimen: the activity in which the participant-relative, non-substitutable dimension of participation is least obscured by additional ends (Section 4.4 says why its recognition matters).","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-2-1","to_no":"2","line":29,"text":"That discourse conceded more than it needed to: it treated machine victory in games as machine entry into play, a misrecognition for which Sections 2 and 3 supply the diagnosis, using a concept that is Suits's own.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-3-1","to_no":"3","line":29,"text":"That discourse conceded more than it needed to: it treated machine victory in games as machine entry into play, a misrecognition for which Sections 2 and 3 supply the diagnosis, using a concept that is Suits's own.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-4-1","to_no":"4","line":29,"text":"Beneath both waves, Section 4 will argue, lies a third and older layer, named by Suits before either wave existed: the suspicion that most people cannot regard a life without necessity as worth living — so that the deepest resistance to AI may be a defence not of employment but of meaning.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-3-1","to_no":"3","line":31,"text":"I return to this exchange in Section 3, where the theorem defended here proves independent of its outcome.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-4-1","to_no":"4","line":33,"text":"The deep engagements come later: O'Brien, and Knell and Rüther, in Section 4.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-3-1","to_no":"3","line":35,"text":"The contribution is accordingly threefold: an agent-relative theorem of non-transferability (Section 3); a condition analysis of its acceptance (Section 4); a completed historical case (Section 5).","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-4-1","to_no":"4","line":35,"text":"The contribution is accordingly threefold: an agent-relative theorem of non-transferability (Section 3); a condition analysis of its acceptance (Section 4); a completed historical case (Section 5).","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-5-1","to_no":"5","line":35,"text":"The contribution is accordingly threefold: an agent-relative theorem of non-transferability (Section 3); a condition analysis of its acceptance (Section 4); a completed historical case (Section 5).","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-4-4","to_no":"4.4","line":35,"text":"Within the condition analysis, Section 4.4 proposes that AI's production of functional equivalents makes newly visible the distinction between exchangeable outcomes and non-equivalent participation.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-2-1","to_no":"2","line":45,"text":"Section 2 introduces the Suitsian apparatus and separates two things that the current debates run together: the achieved state of an activity and the value of participating in it.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-3-1","to_no":"3","line":45,"text":"Section 3 states the non-transferability theorem, specifies the criterion it runs on, and shows its independence from every live question about the status of AI, including the question of whether machines might one day play.","cut":false,"dir":"fwd"},{"from":"t5-1","to":"t5-4-1","to_no":"4","line":45,"text":"Section 4 turns from the theorem to its reception: it takes Suits's own vision of collapse as the","cut":true,"dir":"fwd"},{"from":"t5-1","to":"t5-4-4","to_no":"4.4","line":45,"text":"engages the critics of the ludic future, develops the condition analysis — dignity apparatuses — that an affirmative answer to the title question requires, and relates the apparatus (Section 4.4) to the distinction between price and dignity.","cut":true,"dir":"fwd"},{"from":"t5-1","to":"t5-5-1","to_no":"5","line":45,"text":"Section 5 presents professional shogi as a completed historical case: a domain that staged its own public encounter with machine superiority and kept its play.","cut":false,"dir":"fwd"},{"from":"t5-2-1","to":"t5-3-1","to_no":"3","line":55,"text":"The importance of that relocation for an argument conducted in the age of artificial agents will become clear in Section 3.","cut":false,"dir":"fwd"},{"from":"t5-2-3","to":"t5-5-1","to_no":"5","line":71,"text":"An objection arises at the definitional stage and, if sound, would wreck Section 5 before it begins: professional players play for money, and an activity pursued for money is not pursued for its own sake, so on this definition professionals are not playing at all.","cut":false,"dir":"fwd"},{"from":"t5-2-3","to":"t5-5-1","to_no":"5","line":71,"text":"The professional is playing, in the full Suitsian sense, and Section 5 may proceed.","cut":false,"dir":"fwd"},{"from":"t5-3-1","to":"t5-2-1","to_no":"2","line":83,"text":"The sentence that seems to say otherwise — \"the machine could play it for me\" — owes its air of sense, as promised, to a slide between the two objects separated in Section 2.","cut":false,"dir":"back"},{"from":"t5-3-1","to":"t5-1","to_no":"1","line":87,"text":"What is new is that this grammatical fact has not been treated as an independent value variable in the current debates over achievement, meaning, and substitution — and Section 1 gave the historical reason: a property that bears no load gets no name.","cut":false,"dir":"back"},{"from":"t5-3-3","to":"t5-1","to_no":"1","line":103,"text":"The same bracket closes the achievement dispute flagged in Section 1: grant Kieval (2024) entirely — let systems like AlphaGo satisfy the conditions of achievement — and those achievements are the system's; nothing in anyone else's ledger changes.","cut":false,"dir":"back"},{"from":"t5-3-4","to":"t5-1","to_no":"1","line":109,"text":"The theorem, so defended, has a deeper basis, and stating it pays two debts at once: it connects this paper to the series it closes, and it gives Kawatani (2012) the theoretical seat promised in Section 1.","cut":false,"dir":"back"},{"from":"t5-3-4","to":"t5-5-1","to_no":"5","line":111,"text":"has quietly gone missing — an explanation can be owned after the fact, polished and presented as one's path — and it is summoned verification, the sustained follow-up questioning that Section 5 will show institutionalised in shogi, that peels an owned explanation off an unwalked","cut":true,"dir":"fwd"},{"from":"t5-3-4","to":"t5-1","to_no":"1","line":115,"text":"That is why the concession of Section 1 was structural rather than diplomatic: the achievement gap is real, and real exactly there; participation lives in the second image, where the gap's variables do not apply.","cut":false,"dir":"back"},{"from":"t5-3-4","to":"t5-5-1","to_no":"5","line":115,"text":"Their anchor case, finally, is Lee Sedol, and a diagnosis anchored in one exit invites a contrasting case; Section 5 supplies it.","cut":false,"dir":"fwd"},{"from":"t5-4-1","to":"t5-1","to_no":"1","line":131,"text":"Section 1 promised a third layer beneath the two waves of public reaction to AI; this is it.","cut":false,"dir":"back"},{"from":"t5-4-1","to":"t5-1","to_no":"1","line":133,"text":"Section 1 called AI a forced mass distribution of exactly this recognition.","cut":false,"dir":"back"},{"from":"t5-4-1","to":"t5-3-1","to_no":"3","line":135,"text":"Fourth, his case leans at one point on machines having no goods of their own, and he concedes in a footnote that sentience would change the calculus (O'Brien 2025, fn. 23); the locks of Section 3 hold after that concession exactly as before it.","cut":false,"dir":"back"},{"from":"t5-4-2","to":"t5-5-1","to_no":"5","line":147,"text":"Yonenaga, whom Section 5 treats at length, challenged the machine in earnest, lost in public, and accepted what the loss did and did not touch.","cut":false,"dir":"fwd"},{"from":"t5-4-3","to":"t5-4-2","to_no":"4.2","line":153,"text":"Its third term also names what Section 4.2 observed: delight, in the triad, is lucid absorption — being inside the activity with open eyes.","cut":false,"dir":"back"},{"from":"t5-4-3","to":"t5-5-1","to_no":"5","line":157,"text":"Section 5 examines this candidate mechanism under pressure.","cut":false,"dir":"fwd"},{"from":"t5-4-3","to":"t5-5-1","to_no":"5","line":159,"text":"Section 5 returns to it.","cut":false,"dir":"fwd"},{"from":"t5-4-4","to":"t5-4-3","to_no":"4.3","line":167,"text":"For the present argument, I use the ideal-bearing aspect of Shibusawa's shumi (Section 4.3) as an analogue of undertaking, rather than treating the term as mere taste.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-3-1","to_no":"3","line":169,"text":"The theorem of Section 3 is a theorem about (iii); the abstract's compression of it into one sentence places the state of affairs under (i) and the fact of participation under (iii).","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-3-2","to_no":"3.2","line":171,"text":"The further normative claim is that, once an agent's undertaking is treated as reason-bearing — the criterion of Section 3.2 — functionally equivalent outcomes cannot exhaust what is owed in recognising that agent.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-3-3","to_no":"3.3","line":171,"text":"Neither asks what the substituted agent is; the status of AI stays where Section 3.3 left it.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-4-3","to_no":"4.3","line":175,"text":"The apparatus institutionalises practices of recognition without displacing appraisal: Section 4.3 itself contains appraisal — honour that scales with the stake, a brake against hollow play.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-4-6","to_no":"4.6","line":175,"text":"It also fixes what Section 4.6 prohibits.","cut":false,"dir":"fwd"},{"from":"t5-4-4","to":"t5-3-1","to_no":"3.1","line":179,"text":"The formal theorem in Section 3.1 concerns games.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-3-5","to_no":"3.5","line":179,"text":"Section 3.5 states a first-person corollary that generalises its structure to activities in which the agent's end includes the agent's own performance.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-2-3","to_no":"2.3","line":179,"text":"Professional play may still carry income and institutional duties, as Section 2.3 established; play is simply the activity in which participation itself is least obscured by additional ends.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-4-6","to_no":"4.6","line":179,"text":"Nothing here places play above other activities; and the corollary's conceptual scope is broader than the practical scope of the application proposed here, which remains limited by the boundary conditions stated in Section 4.6.","cut":false,"dir":"fwd"},{"from":"t5-4-4","to":"t5-1","to_no":"1","line":181,"text":"The two waves described in Section 1 may be read as one trace of that salience.","cut":false,"dir":"back"},{"from":"t5-4-4","to":"t5-5-1","to_no":"5","line":181,"text":"Section 5 stands to both as follows: the historical case demonstrates compatibility and offers a candidate mechanism; it does not establish the apparatus's necessity, sufficiency, or causal effect.","cut":false,"dir":"fwd"},{"from":"t5-4-5","to":"t5-5-1","to_no":"5","line":189,"text":"Shibusawa attempted such an extension in 1916; Section 5 examines a case compatible with its institutional realisation under maximal pressure.","cut":false,"dir":"fwd"},{"from":"t5-4-6","to":"t5-4-4","to_no":"4.4","line":193,"text":"To use a performance score as a measure of a person's standing — or to score the authenticity of undertaking, delight, or participation — is to answer a recognition question with an appraisal metric (Section 4.4).","cut":false,"dir":"back"},{"from":"t5-4-6","to":"t5-4-5","to_no":"4.5","line":193,"text":"— measures delight, audits undertaking — it has rebuilt, inside this paper's vocabulary, exactly the instrumental capture the vocabulary was built to diagnose; the diagnostic questions of Section 4.5 are first-person instruments, and turned outward as metrics they self-destruct.","cut":true,"dir":"back"},{"from":"t5-4-6","to":"t5-5-1","to_no":"5","line":193,"text":"What Section 5 shows is a culture in which the proposed conditions and continued play coexisted under maximal pressure.","cut":false,"dir":"fwd"},{"from":"t5-5-1","to":"t5-1","to_no":"1","line":199,"text":"Section 1 introduced the match; here is the case in full.","cut":false,"dir":"back"},{"from":"t5-5-1","to":"t5-1","to_no":"1","line":199,"text":"Within a month, as Section 1 recorded, the loss was answered in print, by the loser, under his own name (Yonenaga 2012).","cut":false,"dir":"back"},{"from":"t5-5-2","to":"t5-3-1","to_no":"3","line":205,"text":"On the play axis there was nothing to lose, because no contest of play occurred there: the machine stood to the game as Section 3's quasi-game player — realising the goal state, unmatched on the board, and not treated,","cut":true,"dir":"back"},{"from":"t5-5-3","to":"t5-1","to_no":"1","line":213,"text":"The wider record must be stated with the hedges Section 1 promised.","cut":false,"dir":"back"},{"from":"t5-postscript","to":"t5-4-1","to_no":"4","line":227,"text":"But the scene can be read, and I read it so: as work from which everything instrumental had drained away and which continued because the activity itself remained — the third response of Section 4, lived to the end of a life.","cut":false,"dir":"back"},{"from":"t5-postscript","to":"t5-3-1","to_no":"3","line":227,"text":"That too can be read — not as a verdict on achievements, for there was no one left to outrank and nothing left to win, but as the view from inside delight: the completion report of what Section 3 could only leave open, a life crystallised as one's own.","cut":false,"dir":"back"}],"parts":[{"id":"t5-abstract-p1","unit":"t5-abstract","k":1,"lines":[13,13],"label":"要旨","does":"まとめ","says":"Suits のゲームの分析から、達成された状態と、それを生む活動への参加を分ける。他の行為者が目標の状態を私の代わりに実現しても、私が制約を理由として受け入れてそれを追った、という事実が、それによって成り立つわけではない。残るのは、機械のほうがうまくできると分かっている活動を、人はどんな文化の条件のもとで続けられるか、という問いである。","quote":{"paper":"T5","text":"AI can deliver the state of affairs; it cannot deliver the fact of participation.","line":13,"anchor":"t5-abstract","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p1","unit":"t5-1","k":1,"lines":[23,25],"label":"二つの応答","does":"例","says":"同じ出来事（機械の優越）に対して、囲碁では一人の棋士が退き、将棋では制度が負けを吸収して続いた。比べる単位は意図して非対称で、対比は二つの文化の運命ではなく、同じ出来事が可能にした二つの応答の間にある。","quote":{"paper":"T5","text":"The contrast this paper needs is therefore not between the fates of two cultures but between two responses that the same event made available.","line":25,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p2","unit":"t5-1","k":2,"lines":[27,27],"label":"名づけたいもの","does":"主張","says":"違いは遊びの性質にあり、機械の性質にはないので、中心の主張は AI についての主張ではない。遊びは範囲としてではなく、最も純粋な標本として選ぶ。ゲームに参加することの価値は行為者相対的で、移らない。","quote":{"paper":"T5","text":"the central claim of the paper is not a claim about AI","line":27,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p3","unit":"t5-1","k":3,"lines":[29,29],"label":"二つの波と古い層","does":"位置づけ","says":"第一波（2016〜18 年）は、機械がゲームで勝ったことを、機械が遊びに入ったことと取り違えた。第二波では、機械が仕事をできるなら残るのは遊びだ、という形で、問いが逆の側から戻ってきた。その下に、Suits が名づけた古い層がある。多くの人は、必要のない生を生きるに値すると見なせないのではないか、という疑いである。","quote":{"paper":"T5","text":"the deepest resistance to AI may be a defence not of employment but of meaning","line":29,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p4","unit":"t5-1","k":4,"lines":[31,33],"label":"二つの文献の線","does":"位置づけ","says":"第二波の文献は二つの線にまとまる。AI が達成を損なうかをめぐる線と、ゲームが仕事の担ってきた意味を担えるかをめぐる線である。","quote":{"paper":"T5","text":"Within the second wave, the literature has consolidated along two lines.","line":31,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p5","unit":"t5-1","k":5,"lines":[35,35],"label":"本稿の位置と寄与","does":"枠","says":"達成は AI によって損なわれると認めたうえで、参加の価値はその軸にはなかったと論じる。ゲームが仕事に代われるとは主張しない。寄与は、定理、受け入れの条件の分析、完了した歴史事例の三つである。","quote":{"paper":"T5","text":"an agent-relative theorem of non-transferability (Section 3); a condition analysis of its acceptance (Section 4); a completed historical case (Section 5)","line":35,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p6","unit":"t5-1","k":6,"lines":[37,37],"label":"途切れた系譜","does":"位置づけ","says":"Suits が立てた問いの否定の側は、川谷（2012）が最も鋭く述べた。まだ書かれていないのは肯定の側、つまり、ゲームをゲームと見て、なお本気で遊び続けられる条件の説明で、本稿はそれを与えようとする。","quote":{"paper":"T5","text":"an account of the conditions under which one can see the game as a game and keep playing — awake, and in earnest","line":37,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p7","unit":"t5-1","k":7,"lines":[39,39],"label":"負荷がかかって見える","does":"根拠","says":"この定理がこれまで述べられなかったのは、果たす役目がなかったからである。知的な参加を委ねられる相手がいない間、参加が移らないことは、何も押してこない壁だった。性質は、負荷がかかり始めたときに見えるようになる。","quote":{"paper":"T5","text":"A property becomes visible when it begins to bear load.","line":39,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p8","unit":"t5-1","k":8,"lines":[41,41],"label":"Suits の筋書き","does":"位置づけ","says":"Suits は定理を述べなかったが、道具的な活動がすべて機械化された理想郷という筋書きを、たどってみせた。本稿は Suits を AI に当てはめるのではなく、AI が Suits に追いついたと見る。","quote":{"paper":"T5","text":"It observes that artificial intelligence has caught up with Suits","line":41,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p9","unit":"t5-1","k":9,"lines":[43,43],"label":"認識の一斉配布","does":"主張","says":"AI は、自分の活動をゲームと見る認識を一斉に配る。結果はその人を必要としない、と示すからである。続けるという応答ができるかは、共同体が遊ぶ人をどう扱うかという、特定できる条件による、と論じる。","quote":{"paper":"T5","text":"it depends on specifiable conditions in how a community treats those who play","line":43,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-1-p10","unit":"t5-1","k":10,"lines":[45,45],"label":"構成","does":"枠","says":"第 2 節で達成された状態と参加を分け、第 3 節で定理と基準を述べ、第 4 節で受け入れの条件（尊厳の装置）を分析し、第 5 節で将棋を完了した歴史事例として示す。","quote":{"paper":"T5","text":"The paper proceeds as follows.","line":45,"anchor":"t5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-1-p1","unit":"t5-2-1","k":1,"lines":[51,53],"label":"Suits の四つの要素","does":"定義","says":"Suits の構造による定義に拠る。ゲームには四つの要素がある。ゲームと独立に記述できる目標の状態、規則が許す手段、より効率のよい手段を禁じる構成的規則、その規則を、活動を可能にするからという理由で受け入れる態度である。","quote":{"paper":"T5","text":"to play a game is voluntarily to attempt to overcome unnecessary obstacles","line":53,"anchor":"t5-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-1-p2","unit":"t5-2-1","k":2,"lines":[55,55],"label":"理由の構造へ移す","does":"主張","says":"四つ目の要素は、遊びの自己目的性を、内面の質から理由の構造へ置き直す。効率のよい道の禁止が、行為者にとって妨げではなく理由として働いていること。ここに、誰かの内面を調べる必要はない。","quote":{"paper":"T5","text":"Nothing in this requires inspecting anyone's inner life; it is a matter of what stands as a reason for what.","line":55,"anchor":"t5-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-1-p3","unit":"t5-2-1","k":3,"lines":[57,57],"label":"語の使い方の断り","does":"限定","says":"広い意味の「遊び」は取り決めとして使い、遊び一般の定義は与えない。ゲームの道具立ては記述として使い、議論はその限られた種類の活動の上だけで進む。","quote":{"paper":"T5","text":"Nothing below requires that all play be games, that all valuable activity be play","line":57,"anchor":"t5-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-2-p1","unit":"t5-2-2","k":1,"lines":[61,61],"label":"委任の定義","does":"定義","says":"道具的な委任は、記述できる状態の実現を、自分の限られた資源の消費を減らすために、他の行為者に割り当てることである。教えるため、公平に分けるため、その事柄に本来関わる人に委ねるための委任は、本稿の対象ではない。","quote":{"paper":"T5","text":"is not this paper's subject","line":61,"anchor":"t5-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-2-p2","unit":"t5-2-2","k":2,"lines":[63,63],"label":"逆向きの二つの操作","does":"主張","says":"ゲームをすることは、最も効率のよい手段を自分から禁じ、その禁止を理由として引き受けることである。委任とゲームは、同じ変数に逆向きに働く操作である。","quote":{"paper":"T5","text":"Delegation minimises precisely the inefficiency that play institutes.","line":63,"anchor":"t5-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-2-p3","unit":"t5-2-2","k":3,"lines":[65,65],"label":"届くものと消えるもの","does":"主張","says":"目標の状態の実現を丸ごと委ねると、達成された状態は届き、ゲームは消える。勝ちの局面は渡せるが、遊んだということは渡せない。それは局面の特徴ではなく、追求の特徴だからである。","quote":{"paper":"T5","text":"it delivers the achieved state while dissolving the game","line":65,"anchor":"t5-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-2-p4","unit":"t5-2-2","k":4,"lines":[67,67],"label":"二つの欲する対象","does":"定義","says":"どのゲームにも、欲する対象が二つある。達成された状態は、力のある誰にでも届けられる。参加は届けられるものではなく、行われるものである。","quote":{"paper":"T5","text":"The second is not delivered at all, by anyone, ever; it is enacted.","line":67,"anchor":"t5-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-3-p1","unit":"t5-2-3","k":1,"lines":[71,71],"label":"プロは遊んでいるか","does":"根拠","says":"プロは金のためにやっているのだから遊んでいない、という反論に答える。賞金や生計は、遊ぶことを通してしか得られない目的であるかぎり、ゲームの態度と両立する。プロは、Suits の意味で遊んでいる。","quote":{"paper":"T5","text":"The professional is playing, in the full Suitsian sense","line":71,"anchor":"t5-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-2-3-p2","unit":"t5-2-3","k":2,"lines":[73,73],"label":"二種類の障害","does":"定義","says":"障害には、誰も選ばなかった障害と、選ばれて活動を成り立たせている障害がある。生成 AI は前者を取り除いている。新しいのは技の喪失ではなく、障害ごとにどちらの種類かを決めなければならなくなったことである。","quote":{"paper":"T5","text":"for the first time, one must determine, obstacle by obstacle, which kind one is facing","line":73,"anchor":"t5-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-1-p1","unit":"t5-3-1","k":1,"lines":[79,79],"label":"定理","does":"主張","says":"A 以外の行為者が目標の状態 p を実現すれば、p は成り立つ。しかし、A が制約を理由として受け入れて p を追った、という事実が、それによって成り立つわけではない。準備、分析、記録、相手の席、対局の途中での協働は委ねられるが、参加そのものには代わりがない。","quote":{"paper":"T5","text":"Participation, in short, does not transfer.","line":79,"anchor":"t5-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-1-p2","unit":"t5-3-1","k":2,"lines":[81,81],"label":"行為者相対的という語","does":"定義","says":"行為者相対的という語は、Nagel の用法（理由の一般形が、それを持つ人への本質的な言及を含む）から借りて、定理の言う代替できなさについて派生的に使う。A を B に替えると別の事実になる。","quote":{"paper":"T5","text":"derivatively for the theorem's non-substitutability","line":81,"anchor":"t5-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-1-p3","unit":"t5-3-1","k":3,"lines":[83,83],"label":"三つの読み","does":"根拠","says":"「機械が私の代わりに遊べる」は、機械が p を実現できる（委任）とも、機械が私のために勝てる（代理の遊び手）とも読める。私が遊んだことになるように機械が遊べる、と読むと、この文は何も述べていないことになる。","quote":{"paper":"T5","text":"There is no third task, between the first two, for a better machine to perform.","line":83,"anchor":"t5-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-1-p4","unit":"t5-3-1","k":4,"lines":[85,85],"label":"定理は機械に触れない","does":"限定","says":"定理は機械に一度も触れていない。AI が変えたのは定理ではなく、それが届く先である。委任の申し出が、すべての机に、ごく安く届くようになった。","quote":{"paper":"T5","text":"What AI has changed is not the theorem but its address","line":85,"anchor":"t5-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-1-p5","unit":"t5-3-1","k":5,"lines":[87,87],"label":"自明さへの答え","does":"根拠","says":"定理は驚くものではない、という反論に答える。新しいのは、この文法上の事実が、いまの議論で独立した価値の変数として扱われてこなかったことである。自明であることと、理論の上で省いてよいことは、同じではない。","quote":{"paper":"T5","text":"Being obvious and being theoretically dispensable are not the same thing.","line":87,"anchor":"t5-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-2-p1","unit":"t5-3-2","k":1,"lines":[91,91],"label":"出所では分けられない","does":"根拠","says":"目標の出所では、遊び手と、ただ目標を実現する行為者は分けられない。プロの棋士も、勝ちの条件と規則を外から受け取っている。","quote":{"paper":"T5","text":"If external provenance disqualified, no one would ever have played anything.","line":91,"anchor":"t5-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-2-p2","unit":"t5-3-2","k":2,"lines":[93,93],"label":"基準は引き受け","does":"定義","says":"分かれ目は、行為者が目標と制約を自分の理由として引き受けているか、実践がその行為者をそう引き受けた参加者として扱っているか、にある。基準は理由と扱いについての事実で、内面の検査を要しない。","quote":{"paper":"T5","text":"It is, throughout, a fact about reasons and treatment.","line":93,"anchor":"t5-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-2-p3","unit":"t5-3-2","k":3,"lines":[95,95],"label":"擬似的なゲームの遊び手","does":"位置づけ","says":"Suits の擬似的なゲームの遊び手（quasi-game player）は、目標を達成し規則の中で動くが、それを自分の理由として引き受けていない。寄与は、この範疇が大きな規模で実現したという観察である。盤の上の手を見ても、遊び手と見分けられない。","quote":{"paper":"T5","text":"Nothing on the board distinguishes them; everything in the structure of reasons and treatment does.","line":95,"anchor":"t5-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-3-p1","unit":"t5-3-3","k":1,"lines":[99,101],"label":"問いを分ける","does":"根拠","says":"行動が同じなら同じ扱いに値する、という行動主義は、相手をどう扱うかという問いに答える。本稿の問いは別で、他者が遊ぶことが、私が遊んだことになりうるか、である。","quote":{"paper":"T5","text":"This paper's question is whether participation transfers","line":101,"anchor":"t5-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-3-p2","unit":"t5-3-3","k":2,"lines":[103,103],"label":"最も強い場合を認める","does":"根拠","says":"将来のシステムが本物の遊び手で、完全な道徳的地位を持つとしても、その遊びはそのシステムのものである。最強の棋士も、私の対局を私の代わりに指すことはできない。定理は、地位をめぐる論争の結果に依らない。","quote":{"paper":"T5","text":"even if AI has achievements and play of its own, that does not make my playing done","line":103,"anchor":"t5-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-3-p3","unit":"t5-3-3","k":3,"lines":[105,105],"label":"機械同士の対局","does":"含意","says":"機械同士の将棋を否定しない。人の席は、機械のゲームをおとしめずに保たれる。その席は、初めから優れた能力によって占められていたのではないからである。","quote":{"paper":"T5","text":"the seat was never held by superior ability in the first place","line":105,"anchor":"t5-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-4-p1","unit":"t5-3-4","k":1,"lines":[109,111],"label":"二つの根","does":"主張","says":"人の側に残るものには、独立した二つの根がある。規範の根（答える席）と、文法の根（参加の席）。決定に署名する役員は答えるが遊んでいない。一人でクロスワードを解く人は遊んでいるが誰にも答えない。","quote":{"paper":"T5","text":"Each seat can be occupied without the other.","line":111,"anchor":"t5-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-4-p2","unit":"t5-3-4","k":2,"lines":[113,113],"label":"二つの世界像","does":"根拠","says":"川谷の二つの世界像が土台である。遊び手が比較の空間に並ぶ第一の像と、私の生が唯一の舞台である第二の像。追い越されることは第一の像で真で、参加を奪われないことは第二の像で真である。第一の像は丸ごと AI に譲ってよい。","quote":{"paper":"T5","text":"the entire first image can be conceded to AI without remainder","line":113,"anchor":"t5-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-4-p3","unit":"t5-3-4","k":3,"lines":[115,115],"label":"達成の議論は第一の像","does":"位置づけ","says":"達成の四つの条件は、どれも第一の像の内側の条件である。達成の隔たりは現実で、そこで現実である。参加は第二の像にあり、そこでは隔たりの変数は当てはまらない。","quote":{"paper":"T5","text":"the achievement gap is real, and real exactly there","line":115,"anchor":"t5-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-4-p4","unit":"t5-3-4","k":4,"lines":[117,117],"label":"二つの錠","does":"限定","says":"錠は二つある。第一の錠（いまのシステムは一度きりの死を欠く）は、生そのものをゲームと見る極限の水準にだけ属する。第二の錠は定理そのものである。ふつうのゲームでは第二の錠だけがかかり、相手の席には機械も座れる。","quote":{"paper":"T5","text":"the paper claims at each level only what that level's lock secures","line":117,"anchor":"t5-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-4-p5","unit":"t5-3-4","k":5,"lines":[119,119],"label":"残された問い","does":"限定","says":"第二の像での絶対の勝ちが何であるかは、意図して決めずに残す。一つの候補（生が自分のものとして結晶化する仕方に置く）は、本稿の範囲の外にある。","quote":{"paper":"T5","text":"What absolute victory would consist in remains an open question.","line":119,"anchor":"t5-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-5-p1","unit":"t5-3-5","k":1,"lines":[123,123],"label":"一人称の問い","does":"手続き","says":"どの活動についても問える。結果だけが届いたら、私は満足するか。満足するなら委任はそのためにある。しないなら、代わってもらう申し出は範疇の誤りである。問いが読むのは、その時々の欲求ではなく、活動を成り立たせる欲求である。","quote":{"paper":"T5","text":"The test reads the constitutive desire, not the momentary one","line":123,"anchor":"t5-3-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-3-5-p2","unit":"t5-3-5","k":2,"lines":[125,125],"label":"定理が取り除くもの","does":"含意","says":"定理が取り除くのは、活動が代替できると告げられることが人の否定として聞こえる、という不安である。移せないものは奪えない。ただし、この種の真理がそのまま慰めになるわけではない。","quote":{"paper":"T5","text":"what cannot be transferred cannot be taken","line":125,"anchor":"t5-3-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-1-p1","unit":"t5-4-1","k":1,"lines":[131,131],"label":"崩壊の見通し","does":"枠","says":"最も強い反論は Suits 自身のものである。多くの人は、ゲームに費やす生を生きるに値すると見られず、必要を作り上げるだろう。この反論は、定理そのものには手を付けない。定理の慰めは受け取れない、と言う。","quote":{"paper":"T5","text":"it does not touch the theorem","line":131,"anchor":"t5-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-1-p2","unit":"t5-4-1","k":2,"lines":[133,133],"label":"川谷の機構","does":"根拠","says":"川谷はこの見通しに機構を与えた。没頭して遊ぶことと、ゲームをゲームと醒めて認めることは、両立しがたい。機構が正しければ、見通しは気分ではなく予測である。","quote":{"paper":"T5","text":"If the mechanism is right, the vision is not a mood but a forecast.","line":133,"anchor":"t5-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-1-p3","unit":"t5-4-1","k":3,"lines":[135,135],"label":"絶望の側からの問い","does":"位置づけ","says":"仕事がゲームになれば遊ばないことはできない、という O'Brien の文を正しいと受け取る。食い違う点は四つある。その一つ：選んだ制約を必要と偽るのは演技だが、選んだと知って引き受けるのは遊ぶことである。","quote":{"paper":"T5","text":"The difference lies not in the moves but in the lucidity of the undertaking.","line":135,"anchor":"t5-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-1-p4","unit":"t5-4-1","k":4,"lines":[137,137],"label":"理想郷に欠ける機構","does":"位置づけ","says":"Danaher のゲームの理想郷は、醒めた遊び手を盤にとどめる機構を示していない。尊厳の装置は、その理想郷が制度として特定しなかったものの名である。","quote":{"paper":"T5","text":"the dignity apparatus names what Danaher's utopia leaves institutionally unspecified","line":137,"anchor":"t5-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-1-p5","unit":"t5-4-1","k":5,"lines":[139,139],"label":"代替の主張ではない","does":"限定","says":"ゲームの生は意味の代わりとしては足りない、という批判は、ゲームが意味の源として仕事に代われるという主張に向けられている。本稿はその主張をしていない。","quote":{"paper":"T5","text":"this paper does not hold the substitution thesis","line":139,"anchor":"t5-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-2-p1","unit":"t5-4-2","k":1,"lines":[143,143],"label":"隠れた前提","does":"主張","says":"降りる機構の前提は偽である。醒めていることと没頭していることが矛盾するのは、ゲームと認めることが、取るに足りないと認めることである場合だけである。不可能は構造上のものではなく条件つきで、制度の不足を映しているのかもしれない。","quote":{"paper":"T5","text":"Lucid absorption is not a paradox.","line":143,"anchor":"t5-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-2-p2","unit":"t5-4-2","k":2,"lines":[145,145],"label":"第三の応答","does":"位置づけ","says":"必要を作り上げるか、真実を認めて衰えていくか、のほかに、第三の道がある。真実を正しく理解し、受け入れることである。Schlick は、遊びは意味の反対ではなく、意味のある場所だ、という主張を与える。","quote":{"paper":"T5","text":"Schlick supplies the established claim that play is not meaning's opposite but its address","line":145,"anchor":"t5-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-2-p3","unit":"t5-4-2","k":3,"lines":[147,147],"label":"条件は引き受け","does":"主張","says":"第三の応答が実際に働く条件は、引き受けであるように見える。問題を自分のものにし、痛みとして通り抜けた人は、結論を、ほとんど自然なこととして受け入れる。挙げる例はデータではなく標本で、応答があることを示すだけである。","quote":{"paper":"T5","text":"These are not data; they are specimens","line":147,"anchor":"t5-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-3-p1","unit":"t5-4-3","k":1,"lines":[151,151],"label":"尊厳の装置","does":"定義","says":"尊厳の装置とは、自己目的的な活動を、本気で取り組むに値するものとして社会の中で認められるようにする文化の形である。「ただの」遊びへの格下げを止める。候補となる機構を四つ挙げる。","quote":{"paper":"T5","text":"A dignity apparatus is a cultural form that makes autotelic activity socially recognisable as worth taking seriously","line":151,"anchor":"t5-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-3-p2","unit":"t5-4-3","k":2,"lines":[153,155],"label":"価値の順序と橋","does":"例","says":"第一は価値の順序（論語の、知る、好む、楽しむ）。第二は、働く生活への橋渡しである。渋沢栄一が 1916 年、この順序を仕事の世界の中へ持ち込んだ。","quote":{"paper":"T5","text":"the ordering is carried across the boundary into the world of work by someone whose status in that world is beyond question","line":155,"anchor":"t5-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-3-p3","unit":"t5-4-3","k":3,"lines":[157,159],"label":"役割と実践の形","does":"例","says":"第三は、最も高い敬意を受ける役割（ゲームに一生を賭けた棋士）。第四は実践の形で、感想戦は、参加の席に答える席をじかに結び付ける。","quote":{"paper":"T5","text":"attaches an answering seat directly to the playing seat","line":159,"anchor":"t5-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-3-p4","unit":"t5-4-3","k":4,"lines":[161,161],"label":"恥が働く条件","does":"含意","says":"恥は、失う面目があるところでだけ働く。設計の順序は、罰を強めることではなく、失うに値するものを先に与えることである。失敗は面目を損なうことがあっても、承認の床は取り消されない。","quote":{"paper":"T5","text":"not stronger punishment, but the prior issuance of something worth losing","line":161,"anchor":"t5-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-3-p5","unit":"t5-4-3","k":5,"lines":[163,163],"label":"反駁ではない","does":"限定","says":"これらは Suits の筋書きを反駁しない。東アジアの材料は、その筋書きに欠けている社会的な承認の形を、具体的に示す。","quote":{"paper":"T5","text":"None of this refutes Suits's scenario, and none of it is offered as refutation.","line":163,"anchor":"t5-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p1","unit":"t5-4-4","k":1,"lines":[167,167],"label":"Kant の語彙の借り方","does":"限定","says":"Kant から借りるのは、交換できることと等価物のないことの対比という形式上の特徴一つである。語彙の構成的な使用で、何が尊厳を持つかについての Kant の説の解釈ではない。","quote":{"paper":"T5","text":"This is a constructive use of Kant's vocabulary, not an interpretation of Kant's own account of what has dignity","line":167,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p2","unit":"t5-4-4","k":2,"lines":[169,169],"label":"主語を替える試験","does":"手続き","says":"文の主語を別の行為者に替え、同じ事実が残るかを問う。結果の状態は別の行為者が実現でき、権限は割り当て直せる。参加した事実は、主語を替えると別の事実になる。この試験は説明のためのもので、独立した基準ではない。","quote":{"paper":"T5","text":"replacing A with B changes the participation fact","line":169,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p3","unit":"t5-4-4","k":3,"lines":[171,171],"label":"尊厳へはもう一歩","does":"限定","says":"定理は、それだけでは尊厳を確立しない。加える規範の主張は、引き受けが理由を担うものとして扱われるなら、機能的に等価な結果があっても、その行為者を認めるうえで負っているものは尽くされない、ということである。","quote":{"paper":"T5","text":"It does not by itself establish dignity.","line":171,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p4","unit":"t5-4-4","k":4,"lines":[173,173],"label":"四つの語を固定する","does":"定義","says":"尊厳、立場、面目、評価としての尊重の四つの語を固定する。装置は Kant の尊厳を与えも奪いもせず、参加者の立場の承認を、社会の中で働くものにする。評価と承認の区別は Darwall による。","quote":{"paper":"T5","text":"A dignity apparatus does not confer or revoke Kantian dignity; it makes recognition of a participant's standing socially operative.","line":173,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p5","unit":"t5-4-4","k":5,"lines":[175,175],"label":"承認の床と評価","does":"主張","says":"装置は承認の床を確保し、成績は評価の対象のままにする。成績の比較だけからは、人や参加者に対して負っている承認が失われる、という結論は出てこない。成績の点数を人の立場の物差しに使うことは、承認の問いに評価の物差しで答えることである。","quote":{"paper":"T5","text":"repricing performance does not by itself determine a person's or participant's standing","line":175,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p6","unit":"t5-4-4","k":6,"lines":[177,177],"label":"面目という媒体","does":"主張","says":"面目を、承認が社会の中で読み取れるようになるための、やりとりの媒体として提案する。感想戦では、結果が決まったあとで、敗者の良い手が認められる。装置を、相互性への努力の制度化として扱う。","quote":{"paper":"T5","text":"a dignity apparatus operates in the third register and protects the second","line":177,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p7","unit":"t5-4-4","k":7,"lines":[179,179],"label":"なぜ遊びか","does":"限定","says":"形式の定理はゲームについてのものである。一人称の系が、その構造を、行為者の目的に自分で行うことが含まれる活動へ広げる。遊びを選ぶのは、遊びでは参加が概念の上で活動を成り立たせているからで、遊びをほかの活動の上に置くものではない。委ねられるかは課題ごとに見る。","quote":{"paper":"T5","text":"Nothing here places play above other activities","line":179,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-4-p8","unit":"t5-4-4","k":8,"lines":[181,181],"label":"二つのテーゼの地位","does":"限定","says":"二つのテーゼは、定理からは導かれない。可視化テーゼは解釈上の主張、装置テーゼは社会学の仮説である。事例は両立を示し、候補の機構を示す。装置の必要性、十分性、因果は示さない。","quote":{"paper":"T5","text":"it does not establish the apparatus's necessity, sufficiency, or causal effect","line":181,"anchor":"t5-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-5-p1","unit":"t5-4-5","k":1,"lines":[185,187],"label":"言語ゲームという類比","does":"例","says":"言語ゲームという認識が広まっても、告白や証言は重みを失わなかった。ただし言語ゲームは Suits のゲームではないので、何も反駁しない。示唆するのは、規則で成り立つと認めることが、それだけでは活動を軽いものにはしない、ということまでである。","quote":{"paper":"T5","text":"the recognition that an activity is constituted by rules does not, by itself, make the activity light","line":187,"anchor":"t5-4-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-5-p2","unit":"t5-4-5","k":2,"lines":[189,189],"label":"身近な受け入れ","does":"例","says":"クロスワードのように、身近なところでは自己目的的な活動は広く受け入れられている。問題は、それを支える承認の実践を仕事の領域へ広げられるかである。二つの問いは診断の道具で、物差しではない。","quote":{"paper":"T5","text":"they are diagnostic instruments, not measures","line":189,"anchor":"t5-4-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-4-6-p1","unit":"t5-4-6","k":1,"lines":[193,193],"label":"二つの禁止","does":"限定","says":"二つの禁止が、この説明の範囲を区切る。装置は文化の条件の分析で、管理の技法ではなく、立場や引き受けの採点を許さない（成果や遂行の採点は禁じていない）。そして、遊ぶことを指図しない。引き受けそのものを命じることはできない。脚注は適用の境を置く。障害が構成的な役割を持たない仕事の局面（再現、安全性の評価、臨床の判断）では、障害を残すことを勧めない。分析が当てはまるのは、探索、熟達、表現、問題の設定、仕上げである。","quote":{"paper":"T5","text":"nothing here prescribes play","line":193,"anchor":"t5-4-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-1-p1","unit":"t5-5-1","k":1,"lines":[199,199],"label":"対局","does":"例","says":"2012 年、将棋連盟の会長だった米長は、自分で設けた対局で機械に敗れた。準備では機械を使って機械を調べた。分析は至る所で委ねられたが、参加は一度も委ねられなかった。負けについては、敗者が自分の名で本を書いて答えた。","quote":{"paper":"T5","text":"the analysis was delegated everywhere, the participation nowhere","line":199,"anchor":"t5-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-1-p2","unit":"t5-5-1","k":2,"lines":[201,201],"label":"「ただの遊び」か","does":"例","says":"五年前、米長が対機械戦をただの遊びと呼んだとき、佐藤康光は、プロの盤での遊びを「ただの」と呼べるのか、と問うた。守られていたのは、すべてを賭ける自己目的的な意味の遊びである。","quote":{"paper":"T5","text":"it is because it is play that everything is at stake","line":201,"anchor":"t5-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-2-p1","unit":"t5-5-2","k":1,"lines":[205,205],"label":"三つの軸","does":"主張","says":"出来事は三つの軸に分かれる。能力の軸では、負けは現実で、全面的で、恒久的だった。遊びの軸と席の軸では、失うものがなかった。負けは一つの軸で起き、ほかの二つを新しく見えるようにした、と読める。","quote":{"paper":"T5","text":"The defeat happened on one axis and can be read as rendering the other two newly visible within the practice","line":205,"anchor":"t5-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-2-p2","unit":"t5-5-2","k":2,"lines":[207,207],"label":"二つの道具","does":"根拠","says":"Suits によれば、負けても、試みをやり通したという達成は残る。評価値は、棋士が最善の筋からどこで離れたかを観る人に読めるようにした。機械は道具の層に収まり、参加の席と答える席は人のままである。","quote":{"paper":"T5","text":"The machine settled into the instrument layer","line":207,"anchor":"t5-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-3-p1","unit":"t5-5-3","k":1,"lines":[211,211],"label":"感想戦で残ったもの","does":"根拠","says":"感想戦は、どちらが勝つかが決まったあとで、勝負にするという合意を確かめ直す席である。第三者の強さと自分を比べたことがないので、機械に対して失うものを持たなかった。","quote":{"paper":"T5","text":"nothing in it had anything to lose to the machine","line":211,"anchor":"t5-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-3-p2","unit":"t5-5-3","k":2,"lines":[213,213],"label":"記録と留保","does":"限定","says":"機械の優越のあとの十年に、プロの将棋の公の地位は下がらず、上がった。その上昇について因果は主張しない。本稿が主張するのは共存で、機構ではない。ただし共存は、崩壊の見通しが不可能だとしていたことである。","quote":{"paper":"T5","text":"this paper asserts coexistence, not mechanism","line":213,"anchor":"t5-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-3-p3","unit":"t5-5-3","k":3,"lines":[215,215],"label":"Suits の宿題","does":"含意","says":"必要のない生に求められるゲームを、いまから考え始めよ、という Suits の宿題の実行として、電王戦を読める。危機が頂点に達する前に、制度がそのゲームを設計した。","quote":{"paper":"T5","text":"reads, in retrospect, as an execution of that assignment","line":215,"anchor":"t5-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-4-p1","unit":"t5-5-4","k":1,"lines":[219,219],"label":"事例が与える型","does":"まとめ","says":"事例は三つの部分からなる型を与える。すべてを賭けること、公に答えること、場を作り直すこと。知識労働のほかの部分は、十年遅れて同じ盤に着いた。","quote":{"paper":"T5","text":"The case yields a model, and the model has three parts.","line":219,"anchor":"t5-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-5-4-p2","unit":"t5-5-4","k":2,"lines":[221,223],"label":"結び","does":"まとめ","says":"将棋の世界は、現実から退かずに席を保った。達成された状態は機械に移り、参加は動かなかった。AI は遊びを助けられる。遊びの中で、その人に代わることはできない。","quote":{"paper":"T5","text":"AI can assist play. It cannot take one's place in it.","line":223,"anchor":"t5-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-postscript-p1","unit":"t5-postscript","k":1,"lines":[227,227],"label":"最後の春","does":"例","says":"死の二日前まで書き続けた Wittgenstein の最後の春を、道具的なものがすべて抜けたあとも活動そのものが残った仕事として読む。その仕事が彼にとって何だったかを知っているとは主張しない、と断っている。","quote":{"paper":"T5","text":"I do not claim to know what the work was to him","line":227,"anchor":"t5-postscript","match":"exact"},"basis":"reading","vis":"public"},{"id":"t5-postscript-p2","unit":"t5-postscript","k":2,"lines":[229,229],"label":"宛先","does":"位置づけ","says":"Wittgenstein は著書を、それが届くかもしれない少数の人に宛てた。本稿も、そのうちの何人かに届くことを願って書かれた。","quote":{"paper":"T5","text":"This paper, too, was written in the hope of reaching a few of them.","line":229,"anchor":"t5-postscript","match":"exact"},"basis":"reading","vis":"public"}],"links":[{"id":"k-t5-1-p1--t5-5-1-p1","from":"t5-1-p1","to":"t5-5-1-p1","rel":"受ける","note":"序論で触れた対局を、事例として全体を述べる。","basis":"reading","vis":"public"},{"id":"k-t5-1-p1--t5-5-3-p2","from":"t5-1-p1","to":"t5-5-3-p2","rel":"受ける","note":"序論で予告した証拠を、留保をつけて述べる。","basis":"reading","vis":"public"},{"id":"k-t5-1-p2--t5-4-4-p7","from":"t5-1-p2","to":"t5-4-4-p7","rel":"受ける","note":"遊びを標本として選んだ理由を述べる。","basis":"reading","vis":"public"},{"id":"k-t5-1-p3--t5-3-2-p3","from":"t5-1-p3","to":"t5-3-2-p3","rel":"受ける","note":"第一波の取り違えに、擬似的なゲームの遊び手という診断を与える。","basis":"reading","vis":"public"},{"id":"k-t5-1-p3--t5-4-1-p1","from":"t5-1-p3","to":"t5-4-1-p1","rel":"受ける","note":"二つの波の下にある古い層を、最も強い反論として取り上げる。","basis":"reading","vis":"public"},{"id":"k-t5-1-p4--t5-3-3-p2","from":"t5-1-p4","to":"t5-3-3-p2","rel":"受ける","note":"機械が達成するかという論争を、定理はその結果に依らない、として括弧に入れる。","basis":"reading","vis":"public"},{"id":"k-t5-1-p5--t5-3-4-p3","from":"t5-1-p5","to":"t5-3-4-p3","rel":"支える","note":"達成は損なわれる、という譲歩が、構造によるものだと示す。","basis":"reading","vis":"public"},{"id":"k-t5-1-p6--t5-3-4-p2","from":"t5-1-p6","to":"t5-3-4-p2","rel":"受ける","note":"川谷に、約束した理論上の席を与える。","basis":"reading","vis":"public"},{"id":"k-t5-1-p7--t5-3-1-p5","from":"t5-1-p7","to":"t5-3-1-p5","rel":"使う","note":"負荷のかからない性質には名前がつかない、という理由を、自明さへの答えに使う。","basis":"reading","vis":"public"},{"id":"k-t5-1-p9--t5-4-1-p2","from":"t5-1-p9","to":"t5-4-1-p2","rel":"使う","note":"AI は認識を一斉に配る、という点を、川谷の機構に当てる。","basis":"reading","vis":"public"},{"id":"k-t5-2-1-p2--t5-3-2-p2","from":"t5-2-1-p2","to":"t5-3-2-p2","rel":"使う","note":"内面を調べずに理由の構造で見る、という置き直しを、基準に使う。","basis":"reading","vis":"public"},{"id":"k-t5-2-2-p4--t5-3-1-p3","from":"t5-2-2-p4","to":"t5-3-1-p3","rel":"受ける","note":"文の意味が二つの対象のあいだですり替わることを、三つの読みで示す。","basis":"reading","vis":"public"},{"id":"k-t5-2-3-p2--t5-3-1-p1","from":"t5-2-3-p2","to":"t5-3-1-p1","rel":"受ける","note":"選ばれた障害で委任を試みると何が起きるかを、定理として述べる。","basis":"reading","vis":"public"},{"id":"k-t5-3-1-p1--t5-5-4-p2","from":"t5-3-1-p1","to":"t5-5-4-p2","rel":"まとめる","note":"定理が言ったこと（達成された状態は移り、参加は動かない）を、事例のあとで結ぶ。","basis":"reading","vis":"public"},{"id":"k-t5-3-2-p2--t5-4-4-p3","from":"t5-3-2-p2","to":"t5-4-4-p3","rel":"使う","note":"引き受けが理由を担うものとして扱われる、という基準を、規範の主張の前提に使う。","basis":"reading","vis":"public"},{"id":"k-t5-3-2-p3--t5-5-2-p1","from":"t5-3-2-p3","to":"t5-5-2-p1","rel":"使う","note":"擬似的なゲームの遊び手という概念を、遊びの軸の読みに使う。","basis":"reading","vis":"public"},{"id":"k-t5-3-4-p1--t5-4-3-p3","from":"t5-3-4-p1","to":"t5-4-3-p3","rel":"使う","note":"答える席と参加の席を、感想戦の読みに使う。","basis":"reading","vis":"public"},{"id":"k-t5-3-4-p4--t5-4-1-p3","from":"t5-3-4-p4","to":"t5-4-1-p3","rel":"使う","note":"二つの錠を、機械に感覚があるとした場合にも使う。","basis":"reading","vis":"public"},{"id":"k-t5-3-4-p5--t5-postscript-p1","from":"t5-3-4-p5","to":"t5-postscript-p1","rel":"受ける","note":"決めずに残した問い（生が自分のものとして結晶化する）に、一つの場面の読みを添える。","basis":"reading","vis":"public"},{"id":"k-t5-3-5-p1--t5-4-4-p7","from":"t5-3-5-p1","to":"t5-4-4-p7","rel":"使う","note":"一人称の系を、行為者の目的に自分で行うことが含まれる活動へ定理の構造を広げるものとして位置づける。","basis":"reading","vis":"public"},{"id":"k-t5-3-5-p2--t5-4-1-p1","from":"t5-3-5-p2","to":"t5-4-1-p1","rel":"受ける","note":"真理が慰めになるとは限らない、という困難を、崩壊の見通しとして受ける。","basis":"reading","vis":"public"},{"id":"k-t5-4-1-p2--t5-4-2-p1","from":"t5-4-1-p2","to":"t5-4-2-p1","rel":"限定する","note":"降りる機構の隠れた前提を取り出し、不可能を条件つきのものに限る。","basis":"reading","vis":"public"},{"id":"k-t5-4-2-p2--t5-5-1-p2","from":"t5-4-2-p2","to":"t5-5-1-p2","rel":"使う","note":"遊びは意味のある場所だ、という Schlick の語彙を、やりとりの読みに使う。","basis":"reading","vis":"public"},{"id":"k-t5-4-2-p2--t5-postscript-p1","from":"t5-4-2-p2","to":"t5-postscript-p1","rel":"受ける","note":"第三の応答を、生の終わりまで生きた場面として読む。","basis":"reading","vis":"public"},{"id":"k-t5-4-2-p3--t5-5-1-p1","from":"t5-4-2-p3","to":"t5-5-1-p1","rel":"受ける","note":"標本として挙げた米長を、事例として詳しく述べる。","basis":"reading","vis":"public"},{"id":"k-t5-4-3-p2--t5-4-4-p1","from":"t5-4-3-p2","to":"t5-4-4-p1","rel":"使う","note":"渋沢の趣味の、理想を担う面を、引き受けの類比として使う。","basis":"reading","vis":"public"},{"id":"k-t5-4-3-p3--t5-5-3-p1","from":"t5-4-3-p3","to":"t5-5-3-p1","rel":"受ける","note":"感想戦を、事例の中で読む。","basis":"reading","vis":"public"},{"id":"k-t5-4-4-p5--t5-4-6-p1","from":"t5-4-4-p5","to":"t5-4-6-p1","rel":"言い換える","note":"立場の採点の禁止を、説明の境としてもう一度述べる。","basis":"reading","vis":"public"},{"id":"k-t5-4-4-p8--t5-5-3-p2","from":"t5-4-4-p8","to":"t5-5-3-p2","rel":"確かめる","note":"二つのテーゼに対して、事例は共存を示すにとどまる。","basis":"reading","vis":"public"},{"id":"k-t5-4-5-p2--t5-4-6-p1","from":"t5-4-5-p2","to":"t5-4-6-p1","rel":"限定する","note":"二つの問いは一人称の道具で、外に向けて物差しにすると壊れる、と限る。","basis":"reading","vis":"public"}],"ok":1}},"routes":{"codes":{"t1-ext":"T1a","t1-speccost":"T1b","t1-visibility":"T1c","t1-spec":"T1d","t1-ablation":"T1e","t2-ratelimit":"T2a","t2-seinsollen":"T2b","t2-boundary":"T2c","t2-assay":"T2d","t3-direction":"T3a","t3-drive":"T3b","t3-mode":"T3c","t3-answer":"T3d","t3-distinct":"T3e","t3-twolayer":"T3f","t4-adherence":"T4a","t4-undertake":"T4b","t4-embody":"T4c","t4-twopath":"T4d","t4-ratelimit":"T4e","t5-objects":"T5a","t5-theorem":"T5b","t5-criterion":"T5c","t5-roots":"T5d","t5-norm":"T5e","t5-visibility":"T5f","t5-apparatus":"T5g","t5-shogi":"T5h"},"routes":[{"id":"denshou","label":"技術伝承","title":"技術伝承：ベテランの判断を次の人へ渡す","lede":"ベテランが持つ判断を次の人へ渡したい、という場面に、五本の論文の区別を順に当てる読み方の一例。それぞれの問いで、自分の場面にいちばん近い答えを選ぶと、次の問いか、残る問いに進む。残る問いは評価ではなく、次に考える場所を示す。個別の事例についての判断は、たどる人に残す。","start_label":"場面：技術伝承","start_sub":"ベテランの判断を次の人へ","basis":"reading","vis":"public","start":"1","steps":[{"id":"1","node":"t1-ext","ask":"渡したいのは、書けば伝わる手順か、手順の使い方を決める判断か。","why":"T1 は、知識を成果物にするときにかかるコストを二つに分ける。文章やコードの形にする手間（外化のコスト）と、何を作り何を除くかを決めるために、課題が分野の専門知を要求する度合い（仕様化のコスト）である。T1 の事例研究では、AI の支援で前者は大きく下がり、後者は変わらなかった。","quotes":[{"paper":"T1","text":"When experienced professionals retire, organisations lose not their documented procedures but the accumulated judgement that determines how those procedures are applied.","line":14,"anchor":"t1-abstract","match":"exact"}],"options":[{"key":"a","short":"手順","label":"手順や事実。書き出せば伝わる","to":"A"},{"key":"b","short":"判断","label":"手順をいつ使い、いつ外すかを決める判断","to":"2"}],"keeps":["c03"]},{"id":"2","node":"t1-spec","ask":"その判断を持つ人と、いま対話できるか。","why":"T1 は、AI との対話の記録に、採った案だけでなく、捨てた案とその理由が残ると書く。手引きや報告書には残りにくい種類の知識である。この記録を作れるのは、判断を持つ人がいるあいだに限られる。","quotes":[{"paper":"T1","text":"Rejection rationale is a category of knowledge that typically survives in neither technical manuals nor project reports.","line":155,"anchor":"t1-4-1","match":"exact"},{"paper":"T1","text":"The window during which retiring domain experts can externalise their specification capacity through AI-mediated dialogue is finite and closing.","line":42,"anchor":"t1-1","match":"exact"}],"options":[{"key":"a","short":"対話できる","label":"できる。対話の記録を残せる","to":"3"},{"key":"b","short":"場がない","label":"いるが、本人が AI と対話する形にはなりにくい","to":"B"},{"key":"c","short":"もういない","label":"もうできない。文書だけが残っている","to":"5"}],"keeps":["c02"]},{"id":"3","node":"t2-ratelimit","ask":"記録にしたあと、次の人が身につけるための時間と場はあるか。","why":"T2 は、知識の変換の四つの過程を見比べる。AI が大きく速めるのは、外に出すことと組み合わせること（外化と結合）で、人と人のあいだで分かち合うことと、やって身につけること（社会化と内面化）は人の側の過程で、AI への投資だけでは速くならない。そうなると、全体の速さを決める段階は後の二つに移る。T2 はこれを実測の結果ではなく、表から導いた分析的な帰結として述べている。","quotes":[{"paper":"T2","text":"Applied to SECI: AI acceleration of E and C shifts the effective bottleneck to S and I.","line":160,"anchor":"t2-4-5","match":"exact"}],"options":[{"key":"a","short":"渡して終わり","label":"記録を渡したところで止まっている","to":"C"},{"key":"b","short":"ある","label":"ある。一緒にやる場と、自分でやってみる機会がある","to":"4"}],"keeps":[]},{"id":"4","node":"t2-seinsollen","ask":"渡したい判断は、事実の見立てと価値の選択の、どちらに重みがあるか。","why":"T2 は、判断の中身を二つの成分に分ける。どうであるかの見立て（Sein 型）と、どうすべきか、何を除くかの選択（Sollen 型）である。実際の判断の多くは両方を含み、二分ではなく比率で見る。T2 の整理（測った値ではなく、理論上の割り当て）では、Sollen 型は人と人のあいだで分かち合う過程にいちばん集まり、やって身につける過程は Sein 型に重みがある。Sein 型の見立ては、外化と結合を繰り返すうちに、決まった処理に取り込まれていく。Sollen 型はその移り方をしない、と T2 は書く。これは、AI が価値を帯びた出力を作れない、という話ではない。出力は作れるが、その正統性をシステム自身に置けない、という話で、能力ではなく根拠（warrant）についての主張だと T2 は断っている。","quotes":[{"paper":"T2","text":"Most judgments in practice are hybrid: they carry both factual and value-laden components in varying proportions.","line":47,"anchor":"t2-2-2","match":"exact"},{"paper":"T2","text":"AI's domain expands along the Sein axis but encounters a structural boundary along the Sollen axis.","line":164,"anchor":"t2-4-5","match":"exact"},{"paper":"T2","text":"The claim is not about capability but about warrant.","line":55,"anchor":"t2-2-3","match":"exact"}],"options":[{"key":"a","short":"事実の見立て","label":"事実の見立てに重みがある（この値は何を意味するか、など）","to":"6"},{"key":"b","short":"価値の選択","label":"価値の選択に重みがある（何を優先し、何を除くか、など）","to":"6"},{"key":"c","short":"混ざる","label":"混ざっていて、分けにくい","to":"6"}],"keeps":["c04","c05"]},{"id":"5","node":"t3-direction","ask":"次の人は、その仕事で困っている人や現場に、じかに出会っているか。","why":"判断を持つ人がもういない場合について、T1 は、世代交代で失われた判断はデータだけからは作り直せないと書く。次の人は、自分の判断を育てることになる。T3 は、何に向かうかという方向は外から植え付けられないとしたうえで、問題を抱える人との直接の出会いがその形成を支えるかもしれない、という設計上の推測を置く。T3 自身が、実証された機構ではないと明記している。","quotes":[{"paper":"T1","text":"specification cost, once lost through generational transition, cannot be regenerated from data alone","line":319,"anchor":"t1-urgency","match":"exact"},{"paper":"T3","text":"it can guarantee exposure, never crystallization","line":84,"anchor":"t3-3","match":"exact"}],"options":[{"key":"a","short":"出会っていない","label":"出会っていない。資料と道具だけがある","to":"D"},{"key":"b","short":"出会っている","label":"出会っている","to":"6"}],"keeps":["c09"]},{"id":"6","node":"t3-answer","ask":"次の人は、自分の名前で判断を出し、問われて答える場に立っているか。","why":"T3 は、判断について答える立場（answerability）を、能力の一つではなく関係として取り出す。立場は関係によって与えられ、育つのは、うまく答える力のほうである。どれだけ稽古を積んでも、その力が規範の上で試され保たれるのは、問われ、答え、その答えを自分のものとして引き受けるやりとりの中だけである。AI は答える練習の相手にはなれるが、答えを受け取る最後の相手にはなれない、と T3 は書く。","quotes":[{"paper":"T3","text":"The standing of answerability is conferred by the relation itself; what grows is the learner's competence to answer well","line":150,"anchor":"t3-5-4","match":"exact"},{"paper":"T3","text":"apprenticeship's core, with its drudgery finally delegable, returned to the center","line":152,"anchor":"t3-5-4","match":"exact"}],"options":[{"key":"a","short":"立っていない","label":"立っていない。出来上がった成果物だけが見られている","to":"E"},{"key":"b","short":"立っている","label":"立っている。問う人がいて、答えを受け止めている","to":"7"}],"keeps":["c13","c11"]},{"id":"7","node":"t4-undertake","ask":"次の人は、その仕事の目的を自分の判断理由にしていて、実際に手を動かしているか。","why":"T4 は、自分ごと化を、引き受けと身体化の二つがそろった状態として定義し直す。引き受けは、目的を自分の判断理由として認め、それを特定の相手に理由を示す関係の中で保つことであり、その核には、判断について答える立場がある。身体化は、引き受けた向きが実践に染み込むことであり、説明を聞くことでは起こらず、本人がやることでしか起こらない。","quotes":[{"paper":"T4","text":"向きを引き受けても身体が動かなければ言葉だけに終わり，身体が動いても向きを引き受けていなければ言われたから動いているだけになる。","line":71,"anchor":"t4-2-3","match":"exact"}],"options":[{"key":"a","short":"やる機会がない","label":"目的は分かっているが、自分でやる機会がない","to":"F"},{"key":"b","short":"言われたから","label":"やってはいるが、言われたからやっている","to":"G"},{"key":"c","short":"どちらもある","label":"目的を自分の理由にしていて、自分でやっている","to":"8"}],"keeps":["c16","c15"]},{"id":"8","node":"t5-theorem","ask":"次の人自身にとって、その仕事は、結果だけが手に入れば足りるものか。","why":"T5 は、達成された状態と、それを自分で追うこと（参加）を分ける。状態は他の行為者（人でも機械でも）が実現できるが、自分がそれを追ったという事実は、他の行為者には作れない。T5 は、この区別を自分に当てる問いを置いている。結果だけが届けば満足か、という問いである。形式的な定理の対象はゲームで、T5 は仕事の全体を遊びとして描き直してはいない。この問いは、本人が自分に向ける形で置かれている。参加や引き受けが本物かどうかを他人が採点することは、T5 自身が退けている。","quotes":[{"paper":"T5","text":"Ask, of any activity: if only the result were delivered, would I be satisfied?","line":123,"anchor":"t5-3-5","match":"exact"}],"options":[{"key":"a","short":"足りる","label":"足りる。結果が出れば、誰がやってもよい","to":"H"},{"key":"b","short":"足りない","label":"足りない。自分でやること自体に理由がある","to":"I"}],"keeps":["c19","c17"]}],"ends":[{"id":"A","after":"1","name":"書き出す手間","ask":"書き出す手間のほかに、渡すものは残っていないか。","note":"書けば伝わるものなら、障壁は外化のコストで、AI の支援で大きく変わると T1 が予測する部分にあたる。一方で T1 は、退職で失われるのは文書にできる手順ではなく、手順の使い方を決める判断のほうだと書いている。","quotes":[{"paper":"T1","text":"What disappears is not procedural knowledge—which can be documented in manuals and standard operating procedures—but the accumulated judgement that determines how procedures are applied, when they should be overridden, and what problems they fail to anticipate.","line":26,"anchor":"t1-1","match":"exact"}]},{"id":"B","after":"2","name":"対話の場を組む人","ask":"ベテランの判断が出てくる対話の場を、誰が組むか。","note":"T1 は、「ベテランに AI の使い方を教える」という指示は、詰まっている箇所を取り違えていると書く。ベテランは判断をすでに持っている。要るのは、問いを選び、やりとりの順序を組んで、その判断が AI との対話の中に表れるようにする設計者だという。","quotes":[{"paper":"T1","text":"The instruction \"teach the veteran to use AI\" misidentifies the bottleneck.","line":275,"anchor":"t1-5-5","match":"exact"}]},{"id":"C","after":"3","name":"人の速さの段階","ask":"分かち合うことと、やって身につけることに、誰の時間を充てるか。","note":"記録が速く作れるようになっても、社会化と内面化は AI への投資だけでは速くならない、と T2 は書く。記録を渡したあとに全体の速さを決めるのは、この二つの段階になる。","quotes":[{"paper":"T2","text":"both human-limited cognitive and social processes that cannot be accelerated by AI investment alone","line":13,"anchor":"t2-abstract","match":"exact"}]},{"id":"D","after":"5","name":"出会いを設ける","ask":"次の人が、問題を抱える人や現場に出会う機会を、どこに設けるか。","note":"T3 は、設計で保証できるのは出会う機会までで、方向が固まること（結晶化）までは保証できないと書く。T4 も、組織は目的そのものを注入できないが、従業員が身体で何に出会うかは設計できると書く。出会いが方向の形成を支えるという部分は、T3 では設計上の推測、T4 では仮説として置かれている。","quotes":[{"paper":"T4","text":"従業員が身体で何に出会うかは設計できる","line":126,"anchor":"t4-4-2","match":"exact"}]},{"id":"E","after":"6","name":"問う人","ask":"次の人に「あなたの見立ては」と問い、その答えを受け止める人は誰か。","note":"T3 は、成果のための委任と、発達のための委任を別の対象として分ける。作る作業を AI に任せると成果物の質は上がりうるが、知識と、別の課題に生かす力（転移）は変わらないことがある。守る対象は成果物ではなく、次の人が自分の判断について答える場面だという。問う側も、問いと基準と決定について、答える立場に立たなければならない。","quotes":[{"paper":"T3","text":"What guardrails protect, therefore, is not the artifact but the episodes in which the learner answers for judgments.","line":142,"anchor":"t3-5-3","match":"exact"}]},{"id":"F","after":"7","name":"やる機会を残す","ask":"自動化するとなくなる作業のうち、身につけるために残すものはどれか。","note":"T4 の事例では、アンモニア濃度を手動の検知管で測る作業を繰り返すうちに、色と数値と体感の対応が係員の身体に定着した。自動センサーに置き換えていたら、同じ学習は生じにくかった可能性が高い、と T4 は見ている。事例は一つで、身体化の側を示す適用の実演として置かれている。","quotes":[{"paper":"T4","text":"仮にこの測定を自動センサーに置き換えていたら，データは同じように得られたが，同じ感覚的・身体的な学習は生じにくかった可能性が高い。","line":106,"anchor":"t4-3","match":"exact"}]},{"id":"G","after":"7","name":"問う側も答える","ask":"引き受けを求める側は、次の人の判断に答える立場に立っているか。","note":"T4 は、引き受けが成り立つ条件に相互性を置く。相手にだけ答えを求め、自分は答えない関係では、次の人が答える立場に立つ場そのものがなくなる。引き受けは説明や命令では強制できない、とも T4 は書く。","quotes":[{"paper":"T4","text":"経営が従業員に引き受けを求めるなら，経営の側もまた，従業員の判断に答える立場へ立たねばならない。","line":79,"anchor":"t4-2-4","match":"exact"}]},{"id":"H","after":"8","name":"手放してよい苦労","ask":"これまでの苦労のうち、手放して困らないものはどれか。","note":"T5 は障害を二種類に分ける。時間や技能や注意が足りなかったために、ただそこにあった障害と、その営みを成り立たせる制約として選ばれた障害である。前者が消えるのは委任が意図どおりに働いた結果で、それを損失と受け取るのは取り違えだと T5 は書く。どちらの種類かは、障害ごとに決めることになる。","quotes":[{"paper":"T5","text":"for the first time, one must determine, obstacle by obstacle, which kind one is facing","line":73,"anchor":"t5-2-3","match":"exact"}]},{"id":"I","after":"8","name":"続けられる条件","ask":"機械のほうがうまくできると分かったうえで、その仕事を続けられる条件は何か。","note":"T5 は、参加は移せないものなので奪われることもない、と述べたうえで、それを受け入れて続けられる文化的な条件を別の問いとして扱う。成績の比較だけで参加者の立場の承認が尽きないようにする文化的な形（尊厳の装置）を、社会学的な仮説として提案している。","quotes":[{"paper":"T5","text":"under what cultural conditions can people continue activities they know machines can perform better?","line":13,"anchor":"t5-abstract","match":"exact"}]}]},{"id":"makaseru","label":"AI に任せる","title":"AI に任せる：どこまで任せ、何を自分で決めるか","lede":"仕事や日々の用事を AI に任せたい、という場面に、五本の論文の区別を順に当てる読み方の一例。それぞれの問いで、自分の場面にいちばん近い答えを選ぶと、次の問いか、残る問いに進む。残る問いは評価ではなく、次に考える場所を示す。個別の事例についての判断は、たどる人に残す。","start_label":"場面：AI に任せる","start_sub":"どこまで任せ、何を自分で決めるか","basis":"reading","vis":"public","start":"1","steps":[{"id":"1","node":"t1-ext","ask":"任せたいのは、形にする手間か、何を作るかを決めることか。","why":"T1 は、知識を形のある成果物に変えるときにかかるコストを二つに分ける。文章やコードの形にする手間（外化のコスト）と、何を作り何を除くかを決めるために、課題が分野の専門知を要求する度合い（仕様化のコスト）である。T1 の事例研究では、AI の支援で前者は大きく下がり、後者は変わらなかった。","quotes":[{"paper":"T1","text":"denotes the technical barriers to converting tacit knowledge into explicit, formal representations","line":52,"anchor":"t1-2-1","match":"exact"},{"paper":"T1","text":"specification cost is the degree to which a task demands domain expertise","line":54,"anchor":"t1-2-1","match":"exact"}],"options":[{"key":"a","short":"形にする手間","label":"形にする手間。何を作るかは、もう自分で決めてある","to":"A"},{"key":"b","short":"決めることも","label":"何を作るか、何を良しとするかも任せたい","to":"2"}],"keeps":["c03","c02"]},{"id":"2","node":"t1-ablation","ask":"出てきたものの良し悪しを、その分野の知識で見分けられるか。","why":"T1 は、分野の知識を渡さずに、二つの AI に同じアプリを作らせた。どちらも動くものを速く作ったが、データの解釈、画面、情報の構成で、同じ型の欠落を示した。技術的には整っていて、分野としては不適切な成果物である。実験は一つの事例についてのものである。","quotes":[{"paper":"T1","text":"it asks what happens when externalisation capability is present but specification is absent","line":163,"anchor":"t1-4-2","match":"exact"},{"paper":"T1","text":"Both models independently exhibited structurally convergent deficiency patterns across all three layers","line":191,"anchor":"t1-4-2","match":"exact"}],"options":[{"key":"a","short":"見分けられない","label":"見分けられない。その分野のことは知らない","to":"B"},{"key":"b","short":"見分けられる","label":"見分けられる。どこがおかしいかを言える","to":"3"}],"keeps":["c03"]},{"id":"3","node":"t2-boundary","ask":"任せたい判断は、事実を確かめることか、何を良しとするかを選ぶことか。","why":"T2 は、判断の中身を二つに分ける。事実の判断（Sein 型）は、十分なデータと、その分野の訓練があれば、原理的には AI も同じ結論に達しうる。価値を含む判断（Sollen 型）は、AI も出力を作れるが、その判断を正統なものにする根拠は出せない、と T2 は書く。これは能力についての主張ではなく、正統性についての主張で、価値判断を下す権限が制度の上で人に帰されているあいだ成り立つ、と T2 は断っている。実際の判断の多くは、二つが混ざっている。","quotes":[{"paper":"T2","text":"An AI system can generate such outputs, but it cannot supply the warrant","line":45,"anchor":"t2-2-2","match":"exact"},{"paper":"T2","text":"The boundary is not a capability claim; it is a legitimacy claim, and it holds as long as the authority to make value judgments remains institutionally attributed to human agents.","line":29,"anchor":"t2-1","match":"exact"},{"paper":"T2","text":"Most judgments in practice are hybrid","line":47,"anchor":"t2-2-2","match":"exact"}],"options":[{"key":"a","short":"事実の確かめ","label":"事実を確かめること。調べれば決まる","to":"C"},{"key":"b","short":"価値の選択","label":"何を良しとするかの選択が入っている","to":"4"},{"key":"c","short":"混ざっている","label":"混ざっていて、分けたことがない","to":"D"}],"keeps":["c07","c06","c04"]},{"id":"4","node":"t3-answer","ask":"その判断を採ったあとで問われたら、答えるのは誰か。","why":"T2 は、決定の一部が委ねられない理由を、AI に出力を作る力がないことではなく、出力の根拠が、社会的に正統と認められた源までたどれなければならないことに置く。T3 は、判断について答える立場を、能力とは別の関係として取り出す。責務は制度の中で割り当て直せるが、答える立場は移せない。AI に大きな権威を与えても、この立場は AI の側に生じない、と T3 は書く。","quotes":[{"paper":"T2","text":"the output's warrant must be traceable to a source whose legitimacy is socially recognized","line":23,"anchor":"t2-1","match":"exact"},{"paper":"T3","text":"The agent can be granted more authority without acquiring any standing.","line":102,"anchor":"t3-4-3","match":"exact"}],"options":[{"key":"a","short":"決めていない","label":"決めていない。「AI がそう言ったから」になりそう","to":"E"},{"key":"b","short":"自分が答える","label":"自分が、自分の名前で答える","to":"5"}],"keeps":["c11","c14"]},{"id":"5","node":"t5-objects","ask":"自分にとって、その用事は、結果が手に入れば足りるものか。","why":"T5 は、欲する対象を二つに分ける。達成された状態（結果）と、それを生む活動への参加である。結果は、力のある誰にでも届けられる。参加は届けられるものではなく、行われるものだ、と T5 は書く。形式の定理はゲームについてのもので、ほかの活動へは、自分の目的に自分で行うことが含まれる場合に、一人称の問いとして広げられる。これは本人が自分に向ける問いで、人を測る物差しではない。","quotes":[{"paper":"T5","text":"The second is not delivered at all, by anyone, ever; it is enacted.","line":67,"anchor":"t5-2-2","match":"exact"},{"paper":"T5","text":"The test reads the constitutive desire, not the momentary one","line":123,"anchor":"t5-3-5","match":"exact"}],"options":[{"key":"a","short":"結果で足りる","label":"結果で足りる。手に入ればよい","to":"F"},{"key":"b","short":"自分でやりたい","label":"足りない。自分でやること自体に意味がある","to":"G"}],"keeps":["c17","c37"]}],"ends":[{"id":"A","after":"1","name":"渡す仕様","ask":"決めてあることは、相手に渡せる形で書けているか。","note":"T1 の事例では、外化のコストの低下は自動ではなく、与える仕様の質に依った。仕様の文書と試作を先に用意した場面では、実装は短い時間で終わっている。事例は一つである。","quotes":[{"paper":"T1","text":"it depends on the quality of specification provided","line":125,"anchor":"t1-3-2","match":"exact"}]},{"id":"B","after":"2","name":"見分ける人","ask":"出てきたものを、その分野の判断で見る人は誰か。","note":"T1 は、仕様化のコストが高い分野では、専門家が関わらない AI の導入は、分野に適した出力を作れない、と予測する。予測は枠組みから導いたもので、T1 の証拠は一つの事例と一つの実験である。","quotes":[{"paper":"T1","text":"AI deployment without domain expert involvement will fail to produce domain-appropriate outputs","line":87,"anchor":"t1-2-3","match":"exact"}]},{"id":"C","after":"3","name":"確かめ直し","ask":"AI が出した事実を、あとで誰が、どう確かめ直せるか。","note":"T2 の採点手順では、事実の成分は AI が採点し、価値を含む成分は専門家が採点する。事実の判断は、循環を重ねるうちに成文化され、決まった処理に取り込まれていく、と T2 は書く。AI は権威として扱うのではなく、出力をあとから監査でき、異議を唱えられる、事実についての暫定の採点者として使う、とも書いている。","quotes":[{"paper":"T2","text":"Given sufficient data and domain-relevant training, an AI system could in principle arrive at the same determinations.","line":43,"anchor":"t2-2-2","match":"exact"},{"paper":"T2","text":"The point is not to treat AI as an authority, but to use it as a provisional factual scorer whose outputs remain auditable and contestable.","line":99,"anchor":"t2-3-2","match":"exact"}]},{"id":"D","after":"3","name":"成分に分ける","ask":"その判断のどこまでが事実で、どこからが選択か。","note":"T2 は、一つの判断を成分に分け、事実の成分と価値を含む成分を別の行で採点し、点を一つに足し合わせない手順を提案する。二値ではなく、比率で記録する。この手順は提案で、T2 が示しているのは、理論を作った本人の事例での例示である。枠組みを知らない専門家による採点が要る、と T2 は断っている。","quotes":[{"paper":"T2","text":"Scores are not summed into a single index.","line":95,"anchor":"t2-3-2","match":"exact"}]},{"id":"E","after":"4","name":"答える人","ask":"その判断について、誰が、誰に答えるのか。","note":"T3 は、答える立場は関係と制度によって割り当てられるもので、能力だけでその割り当てを飛ばすことはできない、と述べる。誰が答えるかを決めるのは、その場の人と制度である。","quotes":[{"paper":"T3","text":"what the argument forecloses is shortcutting that assignment by capability alone","line":116,"anchor":"t3-4-4","match":"exact"}]},{"id":"F","after":"5","name":"任せたあと","ask":"任せたあとに残る、自分の側の仕事は何か。","note":"T5 は、誰も選ばず、時間や技能や注意が足りなかったためにあっただけの障害が消えるのは、委任が意図どおりに働いた結果だと書く。T2 は、AI が形にする作業を速めたあとに詰まる所は、出力に向きを与える評価的コミットメントを作り、更新することだ、と述べる。","quotes":[{"paper":"T2","text":"AI investment alone cannot accelerate this bottleneck.","line":232,"anchor":"t2-7","match":"exact"}]},{"id":"G","after":"5","name":"手伝いと代わり","ask":"どこまでを手伝ってもらい、どこからは代わってもらわないか。","note":"T5 は、準備、分析、記録、相手役は委ねられるが、参加そのものには代わりがない、と書く。将棋の事例では、機械を使って機械を調べる準備は至る所で委ねられたが、対局することは一度も委ねられなかった。事例は一つで、T5 が示すのは両立までである。","quotes":[{"paper":"T5","text":"the analysis was delegated everywhere, the participation nowhere","line":199,"anchor":"t5-5-1","match":"exact"}]}]},{"id":"manabu","label":"学ぶ・教える","title":"学ぶ・教える：AI が課題をこなせるとき、何を自分で学ぶか","lede":"学ぶ人（自分でも、教えている相手でもよい）の前に、課題をこなせる AI がある、という場面に、五本の論文の区別を順に当てる読み方の一例。T3 の枠組みは、教える人が特定できる正規の教育のために作られていて、独学や家庭や職場に当てるのは、たどる人の読みになる。それぞれの問いで、自分の場面にいちばん近い答えを選ぶと、次の問いか、残る問いに進む。残る問いは評価ではなく、次に考える場所を示す。個別の事例についての判断は、たどる人に残す。","start_label":"場面：学ぶ・教える","start_sub":"AI が課題をこなせるとき","basis":"reading","vis":"public","start":"1","steps":[{"id":"1","node":"t2-ratelimit","ask":"その課題のねらいは、出来上がったものを得ることか、できるようになることか。","why":"T2 は、知識が作られる過程を四つに分けて読み直す。AI が大きく速めるのは、言葉や形にする過程（外化）と、形になった知識を組み合わせる過程（結合）である。人から人へ学ぶ過程（社会化）と、身につける過程（内面化）は、同じ仕方では速まらない。これは測った結果ではなく、T2 の割り当てから導いた構造上の予測である。T3 は、成果のための委任と、発達のための委任を、別の対象として分ける。","quotes":[{"paper":"T2","text":"AI acceleration of E and C shifts the effective bottleneck to S and I","line":160,"anchor":"t2-4-5","match":"exact"},{"paper":"T3","text":"Performance delegation and developmental delegation are different objects","line":142,"anchor":"t3-5-3","match":"exact"}],"options":[{"key":"a","short":"出来上がり","label":"出来上がったものが要る。学ぶための課題ではない","to":"A"},{"key":"b","short":"できるように","label":"できるようになることがねらい","to":"2"},{"key":"c","short":"両方","label":"両方。出来上がったものも要るし、できるようになることもねらい","to":"2"},{"key":"d","short":"まだ分からない","label":"まだ分からない。先へ読んでから考える","to":"2"}],"keeps":[],"topic":"ねらい","plain":"出来上がったものが良いことと、作った人ができるようになったことは、別々に確かめる事柄である。良いものができたことだけでは、学べたとは言えない。","got":"「出来上がったものの良さ」と「作った人ができるようになること」","not":"AI に任せると学べない、という意味ではない。T3 は、学ぶ人自身の判断や理由が入った依頼であっても、AI に仕上げさせてよいかは、学習の目的、発達の段階、支援を外す計画、支援なしでの転移の基準による、と書く（T3 §5.3）。","example":{"text":"作ることを AI に任せると、成果物の質は上がっても、知識と、別の課題に生かす力（転移）は変わらないことがある。T3 が引く研究（Fan ほか 2025）の結果である。","quote":{"paper":"T3","text":"offloading production can raise artifact quality while leaving knowledge and transfer unchanged","line":142,"anchor":"t3-5-3","match":"exact"}}},{"id":"2","node":"t3-direction","ask":"学ぶ対象は、学ぶ人自身が向かいたいものになっているか。","why":"T3 は、何に向かうかという方向を、候補の状態と、自分のものとして是認した状態に分ける。候補は教師にも AI にも出せるが、自分のものにすること自体は外から手渡せない、と T3 は書く。方向がどこから来るかについて T3 は、問題を抱える人との直接の遭遇が支えになりうる、という設計上の推測を置く。実証された機構ではない、と T3 自身が断っている。","quotes":[{"paper":"T3","text":"Direction is not installed.","line":57,"anchor":"t3-2-4","match":"exact"},{"paper":"T3","text":"it can guarantee exposure, never crystallization","line":84,"anchor":"t3-3","match":"exact"}],"options":[{"key":"a","short":"課されたから","label":"なっていない。課されたからやっている","to":"B"},{"key":"b","short":"向かいたい","label":"なっている","to":"3"},{"key":"c","short":"両方","label":"両方。課されたものだが、向かいたい気持ちもある","to":"3"},{"key":"d","short":"まだ分からない","label":"まだ分からない。先へ読んでから考える","to":"3"}],"keeps":["c09"],"topic":"向かう先","plain":"何に向かうかの候補は、先生にも AI にも出せる。それを自分の向かう先にすることは、ほかの誰も代わりにできない。","got":"「向かう先の候補を出すこと」と「それを自分のものにすること」","not":"外から出された候補と、自分のものにした向かう先は、同じではない。困っている人や現場にじかに触れる機会を作れば向かう先が定まる、という意味でもない。設計が保証できるのは機会までである、と T3 は書く（T3 §3）。","example":{"text":"やる気がないように見える学習者を、成分に分けて読む例がある。その学習者は、ほかの場面では生き生きしているが、向かう先がない。T3 はこれを、動機の不足ではなく、方向が定まる前の状態と読む。","quote":{"paper":"T3","text":"The reading is not a motivation deficit but a pre-crystallization state with a strong engine and no object","line":126,"anchor":"t3-5-1","match":"exact"}}},{"id":"3","node":"t3-answer","ask":"学んだことを、自分の判断として人に示し、問われて答える場面があるか。","why":"T3 は、主体性の成分とは別に、答える立場という関係を取り出す。どれだけ稽古を積んでも、うまく答える力量が規範の上で試され保たれるのは、問われ、答え、その答えを引き受けるやりとりの中だけだ、と T3 は書く。AI は答える稽古を助けられるが、答えが向けられる最後の相手にはなれない。問う側も、問いと基準と決定について答えなければならない。答える形は、すばやい口頭のやりとりに限らない。書いても、いくつかの形を組み合わせても、準備してからでもよい、と T3 は書く。","quotes":[{"paper":"T3","text":"it cannot be the one to whom the learner answers","line":146,"anchor":"t3-5-3","match":"exact"},{"paper":"T3","text":"The educator who asks must also be answerable","line":150,"anchor":"t3-5-4","match":"exact"}],"options":[{"key":"a","short":"AI とだけ","label":"ない。AI とのやりとりだけで進めている","to":"C"},{"key":"b","short":"ある","label":"ある。人に問われて答えている","to":"4"},{"key":"c","short":"両方","label":"両方。AI とも進めていて、人にも問われている","to":"4"},{"key":"d","short":"まだ分からない","label":"まだ分からない。先へ読んでから考える","to":"4"}],"keeps":["c13","c33"],"topic":"答える相手","plain":"AI は、答える稽古を助けられる。自分の判断についての答えが最後に向けられる相手、つまり問う資格のある人の代わりにはなれない。","got":"「答える稽古を助けること」と「答えが向けられる相手であること」","not":"誰が答えなければならないか、と、その人がどれだけうまく答えられるか、は別の問いである。AI との稽古が役に立たない、という意味でもない。AI は答える稽古を助けられる、と T3 は書く。答える形も、すばやい口頭のやりとりに限らない。書いても、いくつかの形を組み合わせても、準備してからでもよい（T3 §5.4）。","example":{"text":"臨床の指導が例に挙がる。患者に関わる判断の責任が制度の上で割り当てられた時点で、研修医はその判断について答える立場に立つ。訓練が育てるのは、うまく答える力量のほうである。","quote":{"paper":"T3","text":"the trainee stands answerable for it; what training builds is the competence to answer well","line":150,"anchor":"t3-5-4","match":"exact"}}},{"id":"4","node":"t4-embody","ask":"AI に任せている作業の中に、自分でやることで身につくものが入っていないか。","why":"T4 は、身体化を、引き受けた向きが実践に染み込むことと定義し、説明を聞くことではなく、本人が実際にやることでしか起きない、と書く。T4 の事例では、手動の測定を繰り返すうちに、色と数値と体感の対応が身についた。自動の測定に替えていたら、同じ学びは生じにくかった可能性が高い、と T4 は見ている。事例は一つである。T4 は組織についての論文で、ここでは、その定義と一つの事例を、学ぶ場面に当てて読んでいる。","quotes":[{"paper":"T4","text":"これは説明を聞くことでは起こらず，本人が実際にやることでしか起こらない。","line":69,"anchor":"t4-2-3","match":"exact"},{"paper":"T4","text":"測定という行為そのものを基質の蓄積の経路に変えた","line":106,"anchor":"t4-3","match":"exact"}],"options":[{"key":"a","short":"入っていない","label":"入っていない。任せているのは、今回の学習の目標では身につける対象になっていない作業だけ","to":"D"},{"key":"b","short":"入っている","label":"入っている。やれば身につく作業も任せている","to":"E"},{"key":"c","short":"両方","label":"両方ある。身につける対象でない作業も、やれば身につく作業も任せている","to":"E"},{"key":"d","short":"まだ分からない","label":"まだ分からない。どの作業がどちらかを、一つずつ見たい","to":"D"}],"keeps":[],"topic":"身につくもの","plain":"説明を聞いて分かることと、自分でやって身につくことは別である。やって身につくものまで任せると、その機会が減るかもしれない。","got":"「聞いて分かること」と「やって身につくこと」","not":"任せてはいけない、という意味ではない。T4 は組織についての論文で、事例は一つである。ここでは、学ぶ場面に当てて読んでいる。","example":{"text":"T4 の事例。週に一度、手動の検知管で濃度を測る作業を繰り返すうちに、色と数値と体感の対応が身についた。自動の測定に替えていたら、同じ学びは生じにくかった可能性が高い、と T4 は見ている。","quote":{"paper":"T4","text":"測定という行為そのものを基質の蓄積の経路に変えた","line":106,"anchor":"t4-3","match":"exact"}}}],"ends":[{"id":"A","after":"1","name":"片づける用事","ask":"それは学ぶ場面ではなく、用事を片づける場面ではないか。","note":"出来上がったものだけが要るなら、問いは「AI に任せる」の場面のものになる。ただし T3 は、学習者の仕様を含む依頼であっても、完成させてよいかは、学習の目的、発達の段階、支援を外す計画、支援なしでの転移の基準による、と書いている。","quotes":[{"paper":"T3","text":"whether it is educationally legitimate still depends on the learning objective","line":142,"anchor":"t3-5-3","match":"exact"}],"cant":"その課題を AI に仕上げさせてよいかは、ここからは決まらない。学ぶ場面については、T3 が、学ぶ人自身の判断や理由が入った依頼であっても、学習の目的、発達の段階、支援を外す計画、支援なしでの転移の基準による、と書いている。"},{"id":"B","after":"2","name":"じかに触れる機会","ask":"その分野で困っている人や現場に、じかに触れる機会はあるか。","note":"T3 は、やる気がないように見える学習者を、動機の不足ではなく、方向が結晶化する前の状態として読む例を挙げ、示される手立ては励ましではなく遭遇だと書く。設計が保証できるのは遭遇に触れる機会までで、方向が定まることは保証できない。遭遇する相手を教材として扱わないことも、設計の要件として挙げている。","quotes":[{"paper":"T3","text":"The reading is not a motivation deficit but a pre-crystallization state","line":126,"anchor":"t3-5-1","match":"exact"},{"paper":"T3","text":"Problem-holders are not teaching materials","line":136,"anchor":"t3-5-2","match":"exact"}],"cant":"じかに触れる機会を作っても、向かう先が定まるとは限らない。困っている人とじかに会うことが支えになりうる、というのは T3 の設計上の推測で、実証された機構ではない。設計が保証できるのは機会までだ、と T3 は書く。機会を作るときも、会う相手を教材として扱ってはならない。同意や互恵は設計の要件だ、と T3 は書く。"},{"id":"C","after":"3","name":"問う相手","ask":"自分の判断を問うてくれる人を、どこに求めるか。","note":"T3 は、教える人の、代えのきかない働きを、知識を渡すことではなく、問い、答えを引き受けさせる相手であることに置く。その相手は、問う資格のある人であればよく、教師に限らない。仲間、職業団体、代表者を通じた共同体でもありうる、と T3 は書く。この枠組みは、教える人が特定できる正規の教育のために作られていて、それ以外への拡張は、T3 が今後の課題として残している。","quotes":[{"paper":"T3","text":"the final normative addressee remains a legitimate human addressee","line":11,"anchor":"t3-abstract","match":"exact"},{"paper":"T3","text":"the framework is developed for formal education with identifiable educators","line":158,"anchor":"t3-6","match":"exact"}],"cant":"誰がその相手になるかは、ここからは決まらない。相手は、問う資格のある人であればよく、教師に限らない、と T3 は書く。ただし T3 の枠組みは、教える人が特定できる正規の教育のためのもので、それ以外への拡張は、T3 が今後の課題として開いたままにしている。"},{"id":"D","after":"4","name":"手放す手間","ask":"手放して困らない手間は、どれか。","note":"T5 は、障害を二種類に分ける。時間や技能や注意が足りなかったために、ただそこにあった障害と、その営みを成り立たせる制約として選ばれた障害である。前者が消えるのは、委任が意図どおりに働いた結果だと T5 は書く。どちらの種類かは、障害ごとに決めることになる。","quotes":[{"paper":"T5","text":"for the first time, one must determine, obstacle by obstacle, which kind one is facing","line":73,"anchor":"t5-2-3","match":"exact"}],"cant":"どの手間が、ただそこにあっただけのもので、どれがその営みを成り立たせるものかは、ここからは決まらない。障害ごとに自分で決めることになる、と T5 は書く。"},{"id":"E","after":"4","name":"残す作業","ask":"身につくまで、自分の手に残しておく作業はどれか。","note":"T4 は、実践に染み込ませる障壁を意図せず残したことが、測る作業を、判断の基質が蓄積する経路に変えた、と一つの事例を読む。T3 は、病棟のない分野での小さな遭遇として、課題を丸ごと AI に任せ、出てきたものへの違和感をすべて書き出す演習を挙げる。この演習の効果は試されていない、と T3 は断っている。","quotes":[{"paper":"T4","text":"引き受けと二経路モデルの全体を実証するものではない","line":100,"anchor":"t4-3","match":"exact"},{"paper":"T3","text":"the proposition remains untested","line":134,"anchor":"t3-5-2","match":"exact"}],"cant":"どの作業を、いつまで手に残すかは、ここからは決まらない。T4 の事例は一つで、示すのは主に「やって身につく」側であり、枠組みの全体を実証するものではない、と T4 自身が断っている。"}],"read":true,"headline":"AI で良いものができた。それで学べたと言えるか。"},{"id":"shokuba","label":"職場で","title":"職場で：降りてきた仕事を、自分のこととして受け取れるか","lede":"上から降りてきた方針や仕事を、自分のこととして受け取れるか（人に頼む側なら、受け取ってもらえるか）、という場面に、五本の論文の区別を順に当てる読み方の一例。T4 は、この問題が日本型の雇用で特に表に出やすい、と断っている。それぞれの問いで、自分の場面にいちばん近い答えを選ぶと、次の問いか、残る問いに進む。残る問いは評価ではなく、次に考える場所を示す。個別の事例についての判断は、たどる人に残す。","start_label":"場面：職場で","start_sub":"降りてきた仕事を、自分のこととして","basis":"reading","vis":"public","start":"1","steps":[{"id":"1","node":"t1-spec","ask":"その仕事の「なぜ」は、言葉で渡されているか。","why":"T4 は、医療が服従から主体的な参加へ概念を変えたとき、それを支えたものの一つが、服薬指導という説明の実務だったと書く。服薬指導は命令ではなく、「なぜ」を渡す行為である。T4 はこれを、先行論文の語を使って、判断の基質（手順をどう使うかを定める判断）と、判断の所在を、言葉にして渡す説明と読み直す。組織では、この説明の言語が十分に体系化されていない、と T4 は述べる。","quotes":[{"paper":"T4","text":"服薬指導とは，基質と判断の所在を言語化して患者に手渡す説明にほかならない。","line":63,"anchor":"t4-2-2","match":"exact"},{"paper":"T4","text":"周知に閉じた施策は，転換前の側，すなわち服従を求めるコンプライアンスの道具立てにとどまる。","line":33,"anchor":"t4-1-2","match":"exact"}],"options":[{"key":"a","short":"周知だけ","label":"渡されていない。決まったことの周知だけ","to":"A"},{"key":"b","short":"渡されている","label":"渡されている","to":"2"}],"keeps":["c16"]},{"id":"2","node":"t3-direction","ask":"その仕事で助かる相手や現場に、じかに触れたことがあるか。","why":"T4 は、医療で目的が共有されやすいのは分野の性質ではなく、患者も医療者も、問題との身体的な遭遇へつながっているからだ、と見る。目的は初めから内にあったのではなく、遭遇を通じて内在化した。T4 はこれを仮説として置き、性質の違う観察と整合するが、因果の証明ではない、と断っている。目的そのものは注入できないが、何に出会うかは設計できる、というのが T4 の帰結である。","quotes":[{"paper":"T4","text":"非対称はドメインに固有なのではなく，経路に固有である。","line":120,"anchor":"t4-4-2","match":"exact"},{"paper":"T4","text":"組織にできるのは目的の注入ではなく，遭遇をはじめとする発現条件の設計である。","line":126,"anchor":"t4-4-2","match":"exact"}],"options":[{"key":"a","short":"触れていない","label":"触れていない。資料と数字で知っているだけ","to":"B"},{"key":"b","short":"触れている","label":"触れている","to":"3"}],"keeps":["c09"]},{"id":"3","node":"t4-undertake","ask":"その仕事の目的を、自分の判断の理由にしているか。","why":"T4 は、自分ごと化を、引き受けと身体化の複合と定義する。引き受けは、外から来た意図を自分の判断理由とする承認が、特定の相手に理由を示す関係の中で保たれている状態である。承認を欠いて答える義務だけがあれば形骸化の入口になり、答える相手を欠いた承認は私的な決意にとどまる（T4 §2.4）。与えられた目標でも、引き受ければ、それについて答えるのは自分になる。知っていることとも、従っていることとも違う、と T4 は書く。引き受けは、説明や命令で強制できない。","quotes":[{"paper":"T4","text":"それは，引き受けと身体化の複合である。","line":67,"anchor":"t4-2-3","match":"exact"},{"paper":"T4","text":"本稿でいう引き受けとは，前者が後者の関係の中で保持されている状態を指す。","line":77,"anchor":"t4-2-4","match":"exact"},{"paper":"T4","text":"由来が外にあることと，引き受けによって自分が答える立場になることは，無関係である。","line":69,"anchor":"t4-2-3","match":"exact"}],"options":[{"key":"a","short":"言われたから","label":"していない。言われたから動いている","to":"C"},{"key":"b","short":"表明だけ","label":"理由にしている、と言うことを求められている","to":"D"},{"key":"c","short":"している","label":"している","to":"4"}],"keeps":["c16","c15","c29"]},{"id":"4","node":"t4-twopath","ask":"自分の側から出した提案や懸念に、理由のある返事が返ってくるか。","why":"T4 は、経路を二つに分ける。上から意図を伝える経路と、従業員が遭遇から得た向きを正式な検討に入れ、権限を持つ特定の人や場が、採る、保留する、止めるのどれについても理由を返す経路である。返すのは理由で、必ず採ることではない。引き受けを求める側が、自分も答える側に立つ、という相互性を、組織の規模に写したものだと T4 は書く。","quotes":[{"paper":"T4","text":"組織がここで必ず引き受けるのは，向きそのものではなく，その向きをどう扱うかという自らの判断である。","line":132,"anchor":"t4-4-3","match":"exact"},{"paper":"T4","text":"応答可能性の立つ場は，相互性の上にしか成立しない。","line":79,"anchor":"t4-2-4","match":"exact"}],"options":[{"key":"a","short":"返ってこない","label":"返ってこない。出しても、止められた理由が分からない","to":"E"},{"key":"b","short":"返ってくる","label":"返ってくる","to":"F"}],"keeps":["c34","c33"]}],"ends":[{"id":"A","after":"1","name":"なぜを尋ねる","ask":"なぜやるのかを、誰に尋ねられるか。","note":"T4 は、説明言語の不在を、説明が皆無だということではなく、なぜやるのかを構造として渡す言語が、制度として十分に体系化されていないこと、と定義する。不在は、効果が生じないことを意味しない。意味するのは、効果を再現できる設計として組織が持てないことだ、と T4 は書く。","quotes":[{"paper":"T4","text":"だがそれは，効果を再現可能な設計として組織が持てないことを意味する。","line":108,"anchor":"t4-3","match":"exact"}]},{"id":"B","after":"2","name":"じかに触れる機会","ask":"相手や現場にじかに触れる機会を、誰が、どう設けられるか。","note":"T3 は、遭遇が方向の形成を支えうるという推測のもとで、保証できるのは遭遇に触れる機会までで、方向が定まることは保証できない、と書く。T4 は、組織の外の遭遇から生まれた向きも、組織が検討し応答する対象に含めている。","quotes":[{"paper":"T3","text":"it can guarantee exposure, never crystallization","line":84,"anchor":"t3-3","match":"exact"},{"paper":"T4","text":"経路2の起点となる遭遇は，組織の内部に限らない。","line":136,"anchor":"t4-4-3","match":"exact"}]},{"id":"C","after":"3","name":"詰まっている所","ask":"いま足りないのは、なぜの説明か、じかに触れる機会か、理由のある返事か。","note":"T4 は、失敗する施策の多くが、上から意図を伝える経路を強く押している、と書く。実際に詰まっているのは、従業員の側から出た向きに組織が理由を返す経路のほうであることが多い。押している経路と、詰まっている経路が違う、というのが T4 の読みである。","quotes":[{"paper":"T4","text":"押している経路と，詰まっている経路が違う。","line":134,"anchor":"t4-4-3","match":"exact"}]},{"id":"D","after":"3","name":"形だけの表明","ask":"求められているのは、引き受けることか、引き受けたと表明することか。","note":"T4 は、引き受けの中身が抜け、要請の形だけが回り続ける状態を形骸化と呼ぶ。自分ごと化が疑ってはならない価値として扱われると、人々は内容の妥当性ではなく、忠誠を表明する振る舞いを競う。答える立場は個人の能力ではなく関係の事実だ、という規定が、この失敗を見抜く足場になる、と T4 は書く。","quotes":[{"paper":"T4","text":"引き受けの中身が抜け落ち，要請の形だけが回り続ける状態である。","line":158,"anchor":"t4-5-1","match":"exact"}]},{"id":"E","after":"4","name":"止める側の答え","ask":"止められたとき、その理由を誰に尋ねられるか。","note":"T4 は、3M の制度を、答える義務の置き場所が、始める側から止める側へ移された配置として読む。放任ではなく、止める者が答える、という配置である。制度は、移せない答える立場そのものは作れないが、それが立つ場は用意できる、と T4 は書く。これは制度の働きの読みで、設計者の意図についての歴史の主張ではない、と断っている。","quotes":[{"paper":"T4","text":"この停止側の設計の正体は「止めるな」という放任ではなく，「止める者が答えよ」という配置である。","line":170,"anchor":"t4-5-2","match":"exact"}]},{"id":"F","after":"4","name":"自分も答える側","ask":"自分が人に仕事を頼むとき、自分も答える側に立っているか。","note":"T4 は、相手には答えることを求めながら、自分は答える側に立たない態度を、失敗の一つの形として挙げる。問う側が相手を対等な判断の主体として扱い、自分も答える側に立つのでなければ、一方的な要求にすぎない、と T4 は書く。著者の記録（THEORY_MAP）は、ここでの相互性について、理由を互いに示すことであって、同じ権限や同じ問いを持つことではない、と断っている。","quotes":[{"paper":"T4","text":"自惚れは関係の構造として，引き受けが成立する条件を先に壊す","line":164,"anchor":"t4-5-1","match":"exact"}]}]},{"id":"aete","label":"あえて自分でやる","title":"あえて自分でやる：AI のほうが上手いことを、自分で続けるか","lede":"AI のほうがうまくできることを、それでも自分でやるか、という場面に、五本の論文の区別を順に当てる読み方の一例。T5 の定理はゲームについてのもので、ほかの活動へは、自分の目的に自分で行うことが含まれる場合に、本人が自分に向ける問いとして広げられる。ここでの問いは、人を測る物差しではない。それぞれの問いで、自分の場面にいちばん近い答えを選ぶと、次の問いか、残る問いに進む。残る問いは評価ではなく、次に考える場所を示す。個別の事例についての判断は、たどる人に残す。","start_label":"場面：あえて自分でやる","start_sub":"AI のほうが上手いことを、続けるか","basis":"reading","vis":"public","start":"1","steps":[{"id":"1","node":"t4-embody","ask":"自分でやる理由は、結果が要るからか、身につけたいからか、やること自体のためか。","why":"自分でやる理由は一つではない。結果が要るだけなら、問いは任せ方になる。身につけるためなら、T4 が身体化と呼ぶものにあたり、本人が実際にやることでしか起きない。やること自体のためなら、T5 が参加と呼ぶものにあたり、届けられるものではなく、行われるものである。三つを並べて分けるのは、この道筋の読みである。","quotes":[{"paper":"T4","text":"これは説明を聞くことでは起こらず，本人が実際にやることでしか起こらない。","line":69,"anchor":"t4-2-3","match":"exact"},{"paper":"T5","text":"The second is not delivered at all, by anyone, ever; it is enacted.","line":67,"an
