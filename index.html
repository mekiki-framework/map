chor":"t5-2-2","match":"exact"}],"options":[{"key":"a","short":"結果が要る","label":"結果が要るから。手に入れば足りる","to":"A"},{"key":"b","short":"身につけたい","label":"身につけたいから","to":"B"},{"key":"c","short":"やること自体","label":"やること自体のため","to":"2"}],"keeps":["c37","c19"]},{"id":"2","node":"t5-objects","ask":"AI に手伝ってもらう所と、自分でやる所を、分けているか。","why":"T5 は、準備、分析、記録、相手役は委ねられるが、参加そのものには代わりがない、と書く。機械が自分の代わりに結果を出すことと、機械が自分の相手や道具になることは、別のことである。AI は遊びを助けられるが、遊びの中でその人に代わることはできない、というのが T5 の結びである。T5 は、AI は遊べないとは主張していない。","quotes":[{"paper":"T5","text":"Participation, in short, does not transfer.","line":79,"anchor":"t5-3-1","match":"exact"},{"paper":"T5","text":"AI can assist play. It cannot take one's place in it.","line":223,"anchor":"t5-5-4","match":"exact"}],"options":[{"key":"a","short":"分けていない","label":"分けていない。全部任せるか、全部自分でやるかになっている","to":"C"},{"key":"b","short":"分けている","label":"分けている","to":"3"}],"keeps":["c17"]},{"id":"3","node":"t5-apparatus","ask":"それを、まわりは、本気で取り組むに値するものとして扱っているか。","why":"T5 は、理解しただけでは続けられないことがある、と書く。ゲームだと知ったうえで本気で続けることが立場を損なう所では、人は降りやすい。T5 は、自己目的的な活動を、本気で取り組むに値するものとして社会の中で認められるようにする文化の形を、尊厳の装置と呼ぶ。これは社会学の仮説で、事例が示すのは両立までである。装置は文化の条件の分析で、人の本気さを採点する道具ではない、と T5 は断っている。","quotes":[{"paper":"T5","text":"A dignity apparatus is a cultural form that makes autotelic activity socially recognisable as worth taking seriously","line":151,"anchor":"t5-4-3","match":"exact"},{"paper":"T5","text":"nothing here prescribes play","line":193,"anchor":"t5-4-6","match":"exact"}],"options":[{"key":"a","short":"ただの遊び","label":"扱っていない。ただの遊び、と見られる","to":"D"},{"key":"b","short":"扱っている","label":"扱っている","to":"E"}],"keeps":["c30","c27","c28"]}],"ends":[{"id":"A","after":"1","name":"手放す苦労","ask":"これまでの苦労のうち、手放して困らないものはどれか。","note":"T5 は、障害を二種類に分ける。時間や技能や注意が足りなかったために、ただそこにあった障害と、その営みを成り立たせる制約として選ばれた障害である。前者が消えるのは、委任が意図どおりに働いた結果で、それを損失と受け取るのは取り違えだと T5 は書く。どちらの種類かは、障害ごとに決めることになる。","quotes":[{"paper":"T5","text":"for the first time, one must determine, obstacle by obstacle, which kind one is facing","line":73,"anchor":"t5-2-3","match":"exact"}]},{"id":"B","after":"1","name":"身につく作業","ask":"任せると、身につく機会がなくなる作業はどれか。","note":"T4 は、その事例について、手動の測定を自動に替えていたら、データは同じように得られたが、同じ学びは生じにくかった可能性が高い、と見ている。実践に染み込ませる障壁を、意図せず残したことが、測る作業を、判断の基質が蓄積する経路に変えた。事例は一つで、示しているのは主に身体化の側である。","quotes":[{"paper":"T4","text":"測定という行為そのものを基質の蓄積の経路に変えた","line":106,"anchor":"t4-3","match":"exact"}]},{"id":"C","after":"2","name":"手伝いと代わり","ask":"どこまでが手伝いで、どこからが代わりにやってもらうことか。","note":"T5 は、「機械が私の代わりにできる」という言い方を三通りに読み分ける。機械が結果を出せる（委任）、機械が私のために勝てる（代理）、私がやったことになるように機械がやれる（この読みは何も述べていない）。将棋の事例では、機械を使って機械を調べる準備は委ねられ、対局することは委ねられなかった。","quotes":[{"paper":"T5","text":"There is no third task, between the first two, for a better machine to perform.","line":83,"anchor":"t5-3-1","match":"exact"}]},{"id":"D","after":"3","name":"認める場","ask":"本気でやる人として扱われる場は、どこにあるか。","note":"T5 は、醒めていることと没頭していることは矛盾しない、と書く。降りやすさは、構造上の不可能ではなく、本気で遊ぶことが立場を損なう所で起きる条件つきのもので、制度の不足を映しているのかもしれない、と T5 は見ている。価値の順序、仕事の世界への橋、敬意を受ける役割、実践の形の四つを、候補として挙げている。","quotes":[{"paper":"T5","text":"Lucid absorption is not a paradox.","line":143,"anchor":"t5-4-2","match":"exact"}]},{"id":"E","after":"3","name":"答える場","ask":"自分のやったことについて、問われて答える場はあるか。","note":"T5 は、将棋の感想戦を、対局のあとで自分の選択について答える場として読み、参加の席に答える席を付ける実践の形だと書く。事例から取り出す型は三つで、すべてを賭けること、公に答えること、場を作り直すことである。事例は一つで、T5 が主張するのは、機械の優越と人の実践の共存までである。","quotes":[{"paper":"T5","text":"attaches an answering seat directly to the playing seat","line":159,"anchor":"t5-4-3","match":"exact"},{"paper":"T5","text":"this paper asserts coexistence, not mechanism","line":213,"anchor":"t5-5-3","match":"exact"}]}]}],"ai":{"walk":["Mekiki Map の道筋「{title}」を、私の場面に当てて一緒にたどってください。","","進め方","・下の問いを、行き先の順に一つずつ聞いてください。私の答えにいちばん近い分かれ道を選び、その行き先へ進んでください。どれに近いか決めにくいときは、候補を示して私に選ばせてください。","・各段で、問いが拠っている論文の箇所を Mekiki Reader（{reader}）で確かめ、原文を短く引いてください。Reader を使えないときは、そう書いてください。","・原文、著者が記録した位置づけ、あなたの解釈は分けて書いてください。問いと分かれ道の言い方は読み方の一例で、論文の文ではありません。","・私の場面についての判断は私に残してください。「残る問い」は評価ではなく、次に考える場所です。着いたら、そこで止めてください。","・最後に、たどった分かれ道を一行の記号列で出してください。番号と記号だけを書き、人名、社名、案件名は入れないでください。","","記号列の形（例）：{example}"],"free":["Mekiki Map の節点を使って、私の場面に合う道筋（どの区別を、どの順に考えるか）を一緒に組んでください。","","進め方","・はじめに、私の場面を聞いてください。","・候補にする節点ごとに、その論文の箇所を Mekiki Reader（{reader}）で確かめ、原文を短く引いてください。Reader を使えないときは、そう書いてください。","・原文、著者が記録した位置づけ、あなたの解釈は分けて書いてください。節点の名前は索引用の和訳で、語の定義は原文で確かめてください。","・使う節点は三つから八つに絞り、考える順に並べてください。順序の理由を一行ずつ添えてください。私の場面についての判断は私に残してください。","・最後に、選んだ節点を一行の記号列で出してください。記号だけを書き、人名、社名、案件名は入れないでください。","","記号列の形（例）：{example}"]},"free":{"id":"map","label":"自分で並べる","title":"自分で並べる：節点を、考える順に並べる","lede":"節点を選んで「道筋に足す」を押すと、考える順に番号が付く。記号列を入れても同じ並びになる。並べ方は、たどる人のもの。","vis":"public"}},"guide":{"steps":[{"id":"whole","title":"全体の地図","go":"chain","look":"#mapwrap","top":true,"text":"五本の論文を、読む順に上から下へ並べた地図です。四角が概念で、色で塗ってある四角が、その論文の核になる概念です。線は概念どうしの関係で、線の種類が根拠を表します。実線は原文、点線は著者の記録、破線は解釈です。"},{"id":"node","title":"概念を選ぶ","go":"chain--t3-answer","look":"#detail","top":true,"text":"四角を押すと、詳細の欄に、その概念の原文の引用が出ます。引用には論文の行番号が付いていて、「照合ページ」から原文と照らし合わせられます。もう一度押すか、「外す」を押すと、選択が外れます。"},{"id":"views","title":"読み方と根拠","go":"slide","look":"#g-views","top":true,"text":"「読み方」で、同じ地図に別の層を重ねられます。「取り違えやすい所」は、各論文が止めている取り違えを足します。「先行研究」は、論文が引用している研究と、同じ区別を先に示した人たちを足します。「根拠」を「原文だけ」にすると、著者の記録と解釈が消えます。"},{"id":"inside","title":"論文の中へ降りる","go":"T3--t3-4-1-p1","look":"#map .node.sel","needs":"parts","text":"「地図」を T1〜T5 に替えると、その論文の中の地図になります。四角は小節で、押すとその場に開いて、中の部分が出ます。部分には、名前と一行の要約と原文が付いています。地図のすぐ上の行にある「次 →」か右矢印キーで、読む順に一つずつ進めます。"},{"id":"route","title":"場面からたどる","go":"route--makaseru","look":"#g-route","needs":"routes","top":true,"text":"全体図のいちばん上に並ぶ場面か、「場面からたどる」のボタンで、自分の場面に近いものを選びます。同じ地図の上に、問いが順に出ます。いちばん近い答えを選ぶと次の問いへ進み、最後は「残る問い」に着きます。残る問いは評価ではなく、次に考える場所です。「AI に渡す文面をコピー」で、同じ問いの順を、AI と一緒にたどれます。"},{"id":"limits","title":"限定をたどる","go":"limits","look":"#g-cross","needs":"cross","top":true,"text":"五本の論文が、それぞれの主張の範囲を区切っている箇所だけを並べた見方です。何を示していないか、どこまでしか言えないかを、T1 から T5 まで読む順にたどれます。"},{"id":"more","title":"そのほか","go":"chain","look":"#q","top":true,"text":"「探す」に語を入れると、当てはまる四角が濃く残り、ほかは薄くなります。たどった印と、選んだ表示は、この端末にだけ残ります。この案内は、上の「使い方」からいつでも開けます。"}],"vis":"public"}}</script>
<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('map-data').textContent);
var META = D.meta, BUILD = META.build || 'internal', TOP = BUILD === 'public' ? 2 : 3;
/* The page is built once for each language (build.py --lang; tools/i18n). When it is built for another language,
   the words written in this file are replaced by that language's words, and the data comes with its texts already
   in that language. A sentence that takes values in the middle is written whole, with places for the values (fmt),
   so that it can be replaced whole. Where the making of a line differs by script (a name stacked letter by letter,
   how many letters fit), the code asks LANG. */
var LANG = META.lang || 'ja', CUTW = LANG === 'ja' ? 12 : 22;
/* fmt('{0} の中の地図へ', 'T3'). "{0s}" stands for the plural ending of the value in place 0, for a language that
   marks it: nothing when the value is 1 */
function fmt(s){ var a = arguments; return s.replace(/\{(\d)(s?)\}/g, function(m, i, pl){ var v = a[+i + 1]; return pl ? (+v === 1 ? '' : 's') : v; }); }
/* A paper may be read here in an edition other than its original (T4 in English). Its links then lead to that
   edition, and every passage taken from it carries a note saying what the edition is (the note comes with the data) */
var PAPER = {}; D.papers.forEach(function(p){ PAPER[p.id] = p; });
function paperURL(pid){ var p = PAPER[pid] || {}; return META.corpus + '/papers/' + pid + (p.ed ? '.' + p.ed : '') + '.html'; }
function edTag(pid){ var p = PAPER[pid] || {}; return p.ed_note ? '<span class="ed">' + esc(p.ed_note) + '</span>' : ''; }
var NS = 'http://www.w3.org/2000/svg';
var RANK = {text:1, record:2, reading:3};
var BASIS_JA = {text:'原文', record:'著者の記録', reading:'解釈'};
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function el(tag, attrs, parent){ var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

/* ---------- model ---------- */
var colOf = {}; D.papers.forEach(function(p, i){ colOf[p.id] = i; });
var byId = {};
D.papers.forEach(function(p){ byId['h-' + p.id] = {id:'h-' + p.id, kind:'paper', paper:p.id, label:p.ja, sub:p.short, basis:'text', vis:'public', group:'core', p:p}; });
D.nodes.forEach(function(n){
  n.group = (n.kind === 'conflation' || n.kind === 'rail') ? 'slide' : (n.kind === 'precursor' ? 'lineage' : 'core');
  if (n.kind === 'precursor') n.basis = Object.keys(n.cited || {}).length ? 'text' : 'reading';
  byId[n.id] = n;
});
var NODES = D.papers.map(function(p){ return byId['h-' + p.id]; }).concat(D.nodes);
D.edges.forEach(function(e){
  e.group = (e.type === 'stop' || e.type === 'slide') ? 'slide' : (e.type === 'lineage' ? 'lineage' : 'core');
  if (e.type === 'lineage') e.basis = e.cite ? 'text' : 'reading';
});
var viewById = {}; D.views.forEach(function(v){ viewById[v.id] = v; });
var compById = {}; D.compressions.forEach(function(c){ compById[c.id] = c; });
var claimById = {}; D.claims.forEach(function(c){ claimById[c.id] = c; });
var bandIdx = {}; D.bands.forEach(function(b, i){ bandIdx[b.id] = i; });
/* ---- The storyline: the five papers in reading order, one stop at a time, on the overview ----
   Almost nothing is said here for the first time. The first stop shows the summary of the node "AI". Each paper's stop
   shows that paper's sentence of the caption of the view (the caption ends each paper's sentence with the paper's
   number, and the data check holds it to that), with the row of THEORY_MAP's table beside it. Only the cover and the
   closing have sentences of their own. A stop lights its part of the map and leaves the rest dim. Choosing a node
   in between shows that node as usual, and the stop comes back when the choice is let go. The storyline waits at
   its stop while a paper's own map is looked at, and a line in the panel leads back. It ends when it is closed, when
   the reading, the range or the level of the overview is changed, and when a situation, a walk across the papers,
   the tour or another address is entered.
   After the closing the stops go on through each paper (the chapters, added to STEPS further down, once the maps
   inside the papers are built). Every stop knows its number and the length of its run (i, n); a stop of a chapter
   also knows its paper (ch). state.story counts through all of them. */
var ST = META.story || null, STEPS = ST ? ST.steps.map(function(s, i, a){ return {node: s.node, paper: s.paper, end: s.end, i: i + 1, n: a.length}; }) : [], NMAIN = STEPS.length, CHAP = {}, CHORD = [], CAPS = null;
function storyOK(){ return !!(ST && STEPS.length && viewById[ST.view] && (ST.vis === 'public' || internalOK())); }
function storyOn(){ return state.scene === 'all' && state.story > 0 && storyOK(); }
function storyNow(){ return storyOn() && !state.sel ? STEPS[state.story - 1] : null; }
/* The name of a stop: main--ai, main--T1 … main--end up to the closing; inside a chapter the paper (its door),
   <paper>--<node>, <paper>--x (the point easily misread), <paper>--exit. */
function storyKey(sn){ return sn.ch ? sn.ch + (sn.door ? '' : '--' + (sn.node || (sn.slip ? 'x' : 'exit'))) : 'main--' + (sn.node || sn.paper || 'end'); }
function storyIndex(key){ for (var i = 0; i < STEPS.length; i++) if (storyKey(STEPS[i]) === key) return i + 1; return 0; }
/* the view a stop is shown in: the storyline's own, and for a point easily misread the view that draws it */
function storyView(k){ var sn = STEPS[k - 1]; return sn && sn.slip && viewById.slide ? 'slide' : ST.view; }
function capParts(){
  if (CAPS) return CAPS;
  var cap = viewById[ST.view].caption || '', re = /([\s\S]*?)\s*[\uFF08(](T\d)[\uFF09)][\u3002.]\s*/g, m, last = 0; CAPS = {};
  while ((m = re.exec(cap))) { CAPS[m[2]] = m[1].trim() + (LANG === 'ja' ? '。' : '.'); last = re.lastIndex; }
  CAPS.rest = cap.slice(last).trim();
  return CAPS;
}
var INSIDE = D.inside || {}, PM = {}, PCACHE = {};

/* The default direction is the author's decision and lives in the data (meta.default_orient). A remembered
   choice counts only if it was made under the current default, so a change of default resets it once. */
var DEF_ORIENT = META.default_orient === 'h' ? 'h' : 'v';
var state = {scene:'all', open:{}, view: D.views[0].id, orient:DEF_ORIENT, focus:'all', level:TOP, pub:false, sel:null, q:'', zoom:1, wide:false, rid:null, walk:[], free:[], read:false, story:0, front:false, intro:false, about:false};
try { var saved = JSON.parse(localStorage.getItem('mekiki-map') || '{}'); if (saved.level) state.level = Math.min(TOP, saved.level); if (saved.zoom) state.zoom = saved.zoom; if (saved.wide) state.wide = true; if (saved.base === DEF_ORIENT && (saved.orient === 'h' || saved.orient === 'v')) state.orient = saved.orient; } catch (e) {}
function save(){ try { localStorage.setItem('mekiki-map', JSON.stringify({level:state.level, zoom:state.zoom, wide:state.wide, orient:state.orient, base:DEF_ORIENT})); } catch (e) {} }
/* A narrow screen: a phone held upright (by the width), or lying on its side (low, and touched with a finger).
   The same two conditions stand in the style sheet. */
var NARROW = window.matchMedia ? window.matchMedia('(max-width:720px), (pointer:coarse) and (max-height:480px)') : {matches: false};
function narrow(){ return !!NARROW.matches; }
if (narrow() && state.zoom < 1) state.zoom = 1;     /* a narrow screen opens at the size that can be read */
/* The whole figure at a glance (narrow screens only). On a phone the figure is drawn at the size at which it reads,
   so only a part of it is on the screen. "全景を見る" draws it small enough to stand in the width of the screen.
   Nothing on it can be read then, so a press on it means a place, not a thing: the figure goes back to its size
   with that place in the middle. It ends as soon as something else is chosen or another map is opened. */
var NAV = false, NAV_KEY = '';
function selKey(){ return state.scene + '|' + (state.scene === 'route' ? state.rid : '') + '|' + (state.sel ? state.sel.t + ':' + state.sel.id : '') + (state.story ? '|s' + state.story : ''); }
function navSet(on){ NAV = !!on; NAV_KEY = NAV ? selKey() : ''; }
function readHash(){
  var h = (location.hash || '').replace(/^#/, ''); if (!h) return;
  try { h = decodeURIComponent(h); } catch (e) {}
  var parts = h.split('--');
  if (parts[0] === 'about') { if (aboutOK()) state.about = true; return; }      /* the author's preface: #about */
  if (parts[0] === 'intro') { if (introOK()) state.intro = true; return; }      /* the introduction; where the page does not carry it, the overview opens as usual */
  if (parts[0] === 'route' || parts[0] === 'read') {
    /* a route: #route--<route>, #route--<route>--<code>. Without a code, what was last walked here comes back.
       #read--… is the same walk in the reading form (the question first, the map as a locator), where the route has one. */
    var R0 = RB[parts[1]];
    if (R0 && routeOK(R0)) {
      state.scene = 'route'; state.rid = R0.id; state.sel = null; state.read = parts[0] === 'read' && readOK(R0);
      if (state.level < TOP) state.level = TOP;
      if (parts[2]) { var pc = parseCode(R0.id + ':' + parts[2]); state.walk = []; state.free = []; if (pc.err) RMSG = pc.err; else if (R0.free) state.free = pc.free; else state.walk = pc.walk; }
      else loadRoute(R0);
      state.sel = standAt(R0);
    }
    return;
  }
  if (PM[parts[0]]) {
    /* a paper's own map: #T1, #T1--<section>, #T1--<part>. The addressed section is opened where it stands. */
    var P0 = PM[parts[0]], n = parts[1] && P0.node[parts[1]];
    state.scene = parts[0]; state.sel = n ? {t:'n', id:n.id} : null;
    if (P0.cross && BUILD !== 'public' && state.level < 3) state.level = 3;
    if (n && n.kind === 'part') { if (BUILD !== 'public' && state.level < 3) state.level = 3; setOpen(P0, n.unit, true); }
    else if (n && n.kind === 'unit') setOpen(P0, n.id, true);
    return;
  }
  if (parts[0] === 'story') {
    /* the storyline: #story--<stop>. Where the page does not carry it, the overview opens as usual */
    state.scene = 'all'; state.sel = null;
    if (storyOK()) {
      /* #story--<name of the stop> (storyKey). The addresses of v0.6.5 and before are still read: a number up to the
         closing, <paper>-<number> inside a chapter, by the order the chapters had then (ST.old) */
      var k = storyIndex(parts.slice(1).join('--'));
      if (!k) {
        var cm = /^(T\d)-(\d+)$/.exec(parts[1] || ''), old = cm && ST.old && ST.old[cm[1]];
        if (old) k = storyIndex(cm[1] + (+cm[2] <= 1 ? '' : +cm[2] >= old.length + 2 ? '--exit' : '--' + old[+cm[2] - 2]));
        else if (/^\d+$/.test(parts[1] || '')) k = Math.max(1, Math.min(NMAIN, +parts[1]));
      }
      state.story = k || 1; state.view = storyView(state.story); if (state.level < TOP) state.level = TOP;
    }
    return;
  }
  if (viewById[parts[0]]) { state.view = parts[0]; state.scene = 'all'; }
  if (parts[1] && byId[parts[1]]) state.sel = {t:'n', id:parts[1]};
}
function hashName(){
  if (state.front) return '';

/* ---------- maps inside a paper ----------
   Each paper has a map of its own, reached from the same page. It is one map: the nodes are the paper's sections
   under their original headings, and a section can be opened where it stands to show its parts. Nothing moves
   sideways when that happens. The parts unfold in rows right under their section, and whatever comes later in
   the reading order slides down. A solid line is a sentence in which the text names another of its own sections
   (taken from the text by tools/skeleton.py). Parts, their names and one-line summaries, and the dashed lines
   between them are readings, not the text. Every line runs down the reading order; the arrowhead tells which end
   holds the sentence. */

D.papers.forEach(function(p){

  S.units.forEach(function(u, i){ var n = P.node[u.id] = {id: u.id, kind: 'unit', paper: p.id, u: u, no: u.no, label: u.title, basis: 'text', vis: 'public', idx: i, parts: [], places: []}; P.order.unit.push(n); });
  S.tiers.forEach(function(T){
    var paras = 0; T.units.forEach(function(u){ P.node[u].sec = 'sec-' + T.id; paras += P.node[u].u.paras; });
    P.node['sec-' + T.id] = {id: 'sec-' + T.id, kind: 'sec', paper: p.id, T: T, no: T.no, label: T.title, basis: 'text', vis: 'public', paras: paras};
  });
  (S.parts || []).forEach(function(x, i){ var n = P.node[x.id] = {id: x.id, kind: 'part', paper: p.id, pt: x, unit: x.unit, label: x.label, sub: x.does + '・L' + x.lines[0], basis: x.basis, vis: x.vis, idx: i, places: []}; P.order.part.push(n); P.node[x.unit].parts.push(x.id); });
  P.hasParts = P.order.part.length > 0;
  P.partsPublic = P.hasParts && P.order.part.every(function(n){ return n.vis === 'public'; });
  P.partAt = function(uid, line){ var ps = P.node[uid].parts; for (var i = 0; i < ps.length; i++) if (line <= P.node[ps[i]].pt.lines[1]) return P.node[ps[i]]; return P.node[ps[ps.length - 1]]; };
  /* the figures and tables of the paper, by the subsection where each stands */
  P.figs = (S.figs || []).filter(function(f){ return P.node[f.unit]; }); P.figAt = {};
  P.figs.forEach(function(f){ (P.figAt[f.unit] = P.figAt[f.unit] || []).push(f); });
  var su = {};
  S.refs.forEach(function(r){ var a = P.node[r.from], b = P.node[r.to], k = Math.min(a.idx, b.idx) + '>' + Math.max(a.idx, b.idx); (su[k] = su[k] || {from: a.idx < b.idx ? a.id : b.id, to: a.idx < b.idx ? b.id : a.id, cites: []}).cites.push(r); });

/* where the overview's quotations sit inside each paper: this ties a node of the overview to a section and part */
D.nodes.forEach(function(n){
  n.places = [];
  (n.quotes || []).forEach(function(q){
    var P = PM[q.paper]; if (!P || !q.line) return;
    var u = P.order.unit.filter(function(x){ return q.line >= x.u.line_start && q.line <= x.u.line_end; })[0]; if (!u) return;
    var pt = P.hasParts ? P.partAt(u.id, q.line) : null;
    if (u.places.indexOf(n.id) < 0) u.places.push(n.id);
    if (pt && pt.places.indexOf(n.id) < 0) pt.places.push(n.id);
    if (!n.places.some(function(z){ return z.unit === u.id && z.part === (pt ? pt.id : null); })) n.places.push({paper: q.paper, unit: u.id, part: pt ? pt.id : null, line: q.line});

   The parts of one kind of work, set out as one more map of the same make: a tier for each paper, and under it that

   places where a paper marks the edge of its own claim ("限定"). Each is built from the parts of the papers and holds
   nothing of its own. Which parts count as an example or a limit is a reading, like the parts are. The words of a
   map are whole sentences here (so that each can be put into another language whole). */

    if (hh) { hh.tabIndex = -1; try { hh.focus({ preventScroll: true }); } catch (e) { hh.focus(); } }
  }
}
/* out of the storyline by a button of its card: the panel is in sight again from its top (where it stands beside the
   map), and the focus goes to the button that starts the storyline, which stands where the pressed one was */
function storyHome(){
  var d0 = $('#detail'), gb = d0.querySelector('[data-story="1"]');
  if (!stacked() && d0.getBoundingClientRect().top < 0) d0.scrollIntoView({block: 'start'});
  if (gb) { try { gb.focus({preventScroll: true}); } catch (e) { gb.focus(); } }
}
document.addEventListener('click', function(ev){
  var rf = ev.target.closest && ev.target.closest('[data-rform]');
  if (rf) {      /* between the two forms of a situation: the question in sight stays in sight */
    var Rr = RB[state.rid]; if (!Rr || Rr.free) return;
    state.sel = {t: 'n', id: readHere(Rr, walkState(Rr)).id};
    state.read = rf.getAttribute('data-rform') === 'read'; READ_FOCUS = true; render();
    if (readOn()) readTop(); else revealNode(rnode(Rr, state.sel.id));
    return;
  }
  var fo = ev.target.closest && ev.target.closest('[data-front],[data-froute],[data-last],#front-open');
  if (fo) {
    if (fo.id === 'front-open') { ev.preventDefault(); state.intro = false; state.about = false; state.front = true; render(); window.scrollTo(0, 0); return; }      /* a link, as the one beside it: the cover is the address with nothing after it */
    if (fo.hasAttribute('data-last')) { if (LAST && LAST.h) location.hash = LAST.h; return; }      /* the address is read as any other */
    if (fo.getAttribute('data-front') === 'about') { if (!aboutOK()) return; if (pageOn()) PUSH = true; state.front = false; state.intro = false; state.about = true; render(); window.scrollTo(0, 0); return; }
    if (fo.getAttribute('data-front') === 'intro') { if (!introOK()) return; if (pageOn()) PUSH = true; state.front = false; state.about = false; state.intro = true; render(); window.scrollTo(0, 0); return; }
    leavePage();
    /* a situation entered from the cover opens in the reading form: the question first, the map out of sight */
    if (fo.hasAttribute('data-froute')) { state.read = true; READ_FOCUS = true; enterRoute(fo.getAttribute('data-froute')); window.scrollTo(0, 0); return; }
    state.scene = 'all'; state.sel = null; state.story = 0; state.view = D.views[0].id; render(); window.scrollTo(0, 0); return;      /* the map: the overview in its first view */
  }
  var px = ev.target.closest && ev.target.closest('[data-rproxy]');
  if (px) { $(px.getAttribute('data-rproxy')).click(); return; }
  var wk = ev.target.closest && ev.target.closest('[data-walk]');
  if (wk) { walkIn(wk.getAttribute('data-walk')); return; }
  var sb = ev.target.closest && ev.target.closest('[data-story]');
  if (sb) { var sv = sb.getAttribute('data-story'); if (sv !== '0') DNAV_FOCUS = 1;      /* the pressed button goes away: the focus moves on to "next" */
    /* a stop by its number, a paper's door by the paper, a paper's exit (exit:T1), or the stop the storyline waits at */
    leavePage();
    storyGo(sv === 'back' ? state.story : (sv.slice(0, 5) === 'exit:' ? exitIndex(sv.slice(5)) : (storyIndex(sv) || CHAP[sv] || +sv || 0))); if (!state.story) storyHome(); return; }
  var dn = ev.target.closest && ev.target.closest('[data-dnav]');
  if (dn) {
    var fwd = dn.getAttribute('data-dnav') === '1', rt = !$('#rtrail').hidden; DNAV_FOCUS = fwd ? 1 : -1;
    if (storyNow()) { storyGo(state.story + (fwd ? 1 : -1)); if (!state.story) storyHome(); return; }
    $((rt ? '#r' : '#') + (fwd ? 'next' : 'prev')).click(); return;
  }
  var t = ev.target.closest && ev.target.closest('#sheet-tgl');
  if (t) { document.body.classList.toggle('low'); sheetSync(); return; }
  var c = ev.target.closest && ev.target.closest('#caption');
  if (c && narrow() && c.classList.contains('long')) { CAP_FULL = !CAP_FULL; capFix(); return; }
  var ld = ev.target.closest && ev.target.closest('#lede');
  if (ld && narrow()) ld.classList.toggle('full');
});
$('#more').addEventListener('click', function(){ setMore(!$('#controls').classList.contains('open')); });
if (NARROW.addEventListener) NARROW.addEventListener('change', function(){ render(); });
/* a phone turned over: the words above the map are measured again, and what was chosen is kept in sight. A change of
   height alone (the bar of the browser coming and going) moves nothing */
var RZT = 0, RZW = window.innerWidth;
window.addEventListener('resize', function(){
  if (!narrow()) { RZW = window.innerWidth; return; }
  clearTimeout(RZT);
  RZT = setTimeout(function(){ capFix(); if (window.innerWidth !== RZW) { RZW = window.innerWidth; if (NAV) render(); else sheetReveal(); } }, 160);
});

/* ---------- a short tour of the page ----------
   Each step names one thing the page can do and puts the page into that state, so the words and the map are seen
   together. The steps come with the data (data/guide.json). A step that needs something this build does not hold
   (parts, situations, the map of limits) is left out. */
var GI = -1;
function guideHas(k){
  if (k === 'parts') return D.papers.some(function(p){ var P = PM[p.id]; return P && P.hasParts && (P.partsPublic || internalOK()); });
  if (k === 'routes') return routesNow().some(function(R){ return !R.free; });
  if (k === 'cross') return crossShown('limits');
  return true;
}
/* The guide is worked out from what the page shows at that moment. While the public page is being previewed, it
   carries only the steps and the wording that page would carry (text_public, which the author confirms). */
function guideSteps(){
  if (!D.guide || !(BUILD === 'public' || internalOK() || D.guide.vis === 'public')) return [];
  var pv = BUILD !== 'public' && state.pub;
  return D.guide.steps.filter(function(st){ return guideHas(st.needs) && (!pv || st.text_public); }).map(function(st){
    return pv ? {id: st.id, title: st.title_public || st.title, text: st.text_public, go: st.go, look: st.look, top: st.top} : st;
  });
}
function ledeText(){
  $('#lede').textContent = '五本の論文（T1〜T5）を、経路図の文法で一枚に置いた案内図。線の種類が、' + (internalOK() ? '原文・著者の記録・解釈の別' : '原文と著者の記録の別') + 'を表します。「地図」を T1〜T5 に切り替えると、その論文の中を節から節へたどれます。' + (routesNow().length ? '「場面からたどる」で場面を選ぶと、同じ地図を、その場面で立てる問いの順にたどれます。' : '') + (storyOK() ? '初めての方は、「あらすじ」で、五本の論文を読む順に一本ずつたどれます。' : '') + (guideSteps().length ? (storyOK() ? '操作は、「使い方」を押すと、順に案内します。' : '初めての方は、「使い方」を押すと、順に案内します。') : '');
}
function jump(name){
  state.sel = null; state.story = 0; state.q = ''; $('#q').value = '';
  var hp = name.split('--');
  if ((hp[0] === 'route' || hp[0] === 'read') && !(RB[hp[1]] && routeOK(RB[hp[1]]))) { var r0 = routesNow().filter(function(R){ return !R.free; })[0]; if (r0) name = 'route--' + r0.id; }
  try { history.replaceState(null, '', '#' + name); } catch (e) { location.hash = name; }
  readHash(); render();
}
function guideShow(i, quiet){
  var box = $('#guide'), old = document.querySelector('.guide-look'), GUIDE = guideSteps(), was = GI; if (old) old.classList.remove('guide-look');
  if (i < 0 || i >= GUIDE.length) {
    GI = -1; box.hidden = true; document.body.classList.remove('guiding');
    if (narrow()) { setMore(false); sheetSync(); }
    /* the keyboard goes back to where the guide was opened from */
    if (was >= 0 && !quiet && !$('#guide-open').hidden) $('#guide-open').focus({preventScroll: true});
    return;
  }
  GI = i; navSet(false);
  var st = GUIDE[i];
  jump(st.go);
  box.hidden = false; document.body.classList.add('guiding');
  if (narrow()) { var lk = st.look && document.querySelector(st.look); setMore(!!lk && $('#controls').contains(lk) && !lk.closest('.pri')); sheetSync(); }
  $('#g-no').textContent = (i + 1) + ' / ' + GUIDE.length;
  $('#g-title').textContent = st.title;
  $('#g-text').textContent = st.text;
  $('#g-prev').disabled = i === 0;
  $('#g-next').textContent = i === GUIDE.length - 1 ? '終わる' : '次へ →';
  $('#g-dots').innerHTML = GUIDE.map(function(x, k){ return '<i' + (k === i ? ' class="on"' : '') + '></i>'; }).join('');
  var look = st.look && document.querySelector(st.look); if (look && !look.hidden) look.classList.add('guide-look'); else look = null;
  if (st.top) {
    /* a step starts at the top of the page, unless what it points at would lie below the first screen or behind
       this panel (on a narrow screen the details come after the map, and the controls fill the first screen) */
    var y = 0;
    if (look) {
      var lr = look.getBoundingClientRect(), la = lr.top + window.scrollY, free = window.innerHeight - box.getBoundingClientRect().height - 28;
      if (Math.min(la + lr.height, la + 120) > free) y = Math.max(0, Math.round(la - Math.max(12, (free - lr.height) / 3)));
    }
    window.scrollTo({top: y, behavior: REDUCED ? 'auto' : 'smooth'});
  }
  else if (state.sel && state.sel.t === 'n' && PM[state.scene]) setTimeout(function(){ if (state.sel) reveal(state.sel.id); }, 80);
  if (was < 0) $('#g-next').focus({preventScroll: true});
}
$('#guide-open').addEventListener('click', function(){ guideShow(GI < 0 ? 0 : -1); });
$('#g-close').addEventListener('click', function(){ guideShow(-1); });
$('#g-prev').addEventListener('click', function(){ guideShow(GI - 1); });
$('#g-next').addEventListener('click', function(){ guideShow(GI + 1); });
document.addEventListener('click', function(ev){ if (ev.target.closest('[data-guide]')) guideShow(0); });

/* ---------- events ---------- */
function select(t, id){
  var same = state.sel && state.sel.t === t && state.sel.id === id, P = PM[state.scene];
  var u = t === 'n' && P && P.node[id] && P.node[id].kind === 'unit' ? P.node[id] : null;
  /* choosing a section of a paper opens it where it stands; choosing it again folds it, like a heading of a list */
  if (u && !same) unfold(P, u); else if (u && isOpen(P, u)) setOpen(P, u.id, false);
  state.sel = same ? null : {t: t, id: id}; render();
  if (u && !same && isOpen(P, u)) showParts(P, u);
}
function mapClick(ev){
  var tg = PM[state.scene] && ev.target.closest('.tgl');
  if (tg) { toggleUnit(PM[state.scene], PM[state.scene].node[tg.dataset.tgl]); return; }
  var n = ev.target.closest('.node'), e = ev.target.closest('.edge');
  if (n && gateOf(n)) { enterRoute(gateOf(n)); return; }
  if (n) select('n', n.dataset.id); else if (e) select('e', e.dataset.eid); else if (state.sel) { state.sel = null; render(); }
}
svg.addEventListener('click', function(ev){
  if (!NAV) { mapClick(ev); return; }
  /* the whole figure is on the screen and nothing on it can be read: a press means a place, not a thing. The figure
     goes back to its size with that place in the middle. What was chosen before is let go; a walk keeps where it
     stands, with its details folded so that the place can be seen */
  var r0 = svg.getBoundingClientRect(), k0 = r0.width / CUR.W, at = {x: (ev.clientX - r0.left) / k0, y: (ev.clientY - r0.top) / k0}, walk = state.scene === 'route';
  if (!walk) state.sel = null;
  navSet(false);
  if (walk) { SHEET_KEY = selKey(); document.body.classList.add('sheet', 'low'); }
  render(); navTo(at);
});
/* put a place of the figure (in its own units) in the middle of what the details leave free */
function navTo(at){
  var r = svg.getBoundingClientRect(), k = r.width / CUR.W, wrap = $('#mapwrap'), wr = wrap.getBoundingClientRect();
  var dr = $('#detail').getBoundingClientRect(), sheet = document.body.classList.contains('sheet'), beside = sheet && dr.left > 40 && dr.top < 40;
  var free = sheet && !beside ? dr.top : window.innerHeight, fr = beside ? Math.min(wr.right, dr.left) : wr.right;
  window.scrollBy({top: r.top + at.y * k - free / 2, behavior: 'auto'});
  wrap.scrollLeft += r.left + at.x * k - (wr.left + fr) / 2;
}
function navToggle(){
  if (!narrow()) return;
  navSet(!NAV);
  if (NAV) document.body.classList.remove('sheet', 'low');     /* the width the figure may take is measured without the details at its side */
  render();
  if (NAV || !document.body.classList.contains('sheet')) $('#work').scrollIntoView({block: 'start', behavior: 'auto'});
}
$('#zall').addEventListener('click', navToggle);
$('#navback').addEventListener('click', navToggle);
/* an entrance that is not the situation being walked: pressing it starts (or changes over to) that situation */
function gateOf(n){ var id = n.classList.contains('k-start') ? n.dataset.id.replace(/^rs-/, '') : ''; return id && RB[id] && !(state.scene === 'route' && state.rid === id) ? id : ''; }
svg.addEventListener('keydown', function(ev){
  var n = ev.target.closest && ev.target.closest('.node');
  if (n && (ev.key === 'Enter' || ev.key === ' ') && gateOf(n)) { ev.preventDefault(); var gid = n.dataset.id; enterRoute(gateOf(n)); var lit = svg.querySelector('.node[data-id="' + gid + '"]'); if (lit) lit.focus(); return; }
  if (n && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); var id = n.dataset.id; select('n', id); var again = svg.querySelector('.node[data-id="' + id + '"]'); if (again) again.focus(); }
});
svg.addEventListener('dblclick', function(ev){
  var n = ev.target.closest('.node.k-paper'), id = n && n.dataset.id.replace(/^h-/, '');
  if (id && PM[id]) { state.scene = id; state.sel = null; render(); }
});
document.addEventListener('keydown', function(ev){
  if (pageOn()) return;      /* on the cover and in the introduction the keys of the map (stepping, answering, closing) do nothing */
  if (ev.key === 'Escape' && GI >= 0) { guideShow(-1); return; }
  if (ev.key === 'Escape' && state.sel) { state.sel = null; render(); return; }
  if (ev.key === 'Escape' && storyNow()) { storyGo(0); return; }
  var plain = !ev.altKey && !ev.ctrlKey && !ev.metaKey && !ev.shiftKey && !(ev.target.closest && ev.target.closest('input,textarea,select,[contenteditable]'));
  if ((ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && PM[state.scene] && plain) { ev.preventDefault(); step(ev.key === 'ArrowRight' ? 1 : -1); }
  if ((ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && storyNow() && plain) { ev.preventDefault(); if (ev.key === 'ArrowLeft' || state.story < STEPS.length) storyGo(state.story + (ev.key === 'ArrowRight' ? 1 : -1)); return; }
  if (state.scene === 'route' && plain) {
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') { ev.preventDefault(); rstep(ev.key === 'ArrowRight' ? 1 : -1); return; }
    /* with a question in view, its answers can be chosen by their letters */
    var R = RB[state.rid], s = R && !R.free && state.sel && state.sel.t === 'n' ? R.at[state.sel.id] : null;
    if (s && /^[a-z]$/.test(ev.key) && optOf(s, ev.key)) { var w = walkState(R); if (w.cur === s.id || w.done[s.id] !== undefined) { ev.preventDefault(); choose(R, s.id, ev.key); } }
  }
});
document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-go],[data-scene]');
  if (b && b.dataset.scene !== undefined && b.dataset.scene !== 'all') {
    /* into a paper's map, or to a node inside it; whatever holds the node is opened on the way */
    var P = PM[b.dataset.scene], z = P && b.dataset.go ? P.node[b.dataset.go] : null;
    if (!P) return;
    if (P.cross) { enterCross(P.p.id); state.story = 0; }
    if (state.scene !== P.p.id || b.dataset.top) state.sel = null;
    state.scene = P.p.id;
    save();
    if (z) go(P, z); else { render(); if (b.closest('#detail')) $('#mapwrap').scrollIntoView({block: 'nearest'}); }
    return;
  }
  if (b && !b.dataset.go) { state.scene = 'all'; state.sel = null; render(); return; }
  if (b) {
    var n = byId[b.dataset.go];
    state.scene = 'all';
    if (!visible(n)) { if (RANK[n.basis] > state.level) state.level = RANK[n.basis]; if (viewById[state.view].groups.indexOf(n.group) < 0) { var v = D.views.filter(function(x){ return x.groups.indexOf(n.group) >= 0; })[0]; if (v) state.view = v.id; } }
    state.sel = {t: 'n', id: n.id}; render();
    if (b.closest('#table')) $('#mapwrap').scrollIntoView({block: 'nearest'});
    return;
  }
  if (ev.target.closest('[data-clear]')) { state.sel = null; render(); }
});
$('#q').addEventListener('input', function(){ state.q = this.value.trim(); render(); });
$('#pub').addEventListener('change', function(){ state.pub = this.checked; if (GI >= 0) guideShow(-1, true); render(); });
$('#zin').addEventListener('click', function(){ navSet(false); state.zoom = Math.min(2, +(Math.floor(zNow() * 5 + 1e-6) / 5 + .2).toFixed(1)); save(); render(); });
$('#zout').addEventListener('click', function(){ navSet(false); state.zoom = Math.max(zMin(), +(Math.ceil(zNow() * 5 - 1e-6) / 5 - .2).toFixed(1)); save(); render(); });
$('#zfit').addEventListener('click', function(){ navSet(false); state.zoom = 1; save(); render(); });
$('#panel').addEventListener('click', function(){ state.wide = !state.wide; save(); render(); });
function toast(msg){ var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2200); }
$('#copy').addEventListener('click', function(){
  var clone = svg.cloneNode(true), src = svg.querySelectorAll('*'), dst = clone.querySelectorAll('*');
  var props = ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap', 'opacity', 'font-family', 'font-size', 'font-weight'];
  for (var i = 0; i < src.length; i++) { var cs = getComputedStyle(src[i]), st = ''; props.forEach(function(p){ st += p + ':' + cs.getPropertyValue(p) + ';'; }); dst[i].setAttribute('style', st); dst[i].removeAttribute('class'); dst[i].removeAttribute('tabindex'); }
  clone.removeAttribute('style'); clone.setAttribute('width', CUR.W);
  var bg = document.createElementNS(NS, 'rect'); bg.setAttribute('width', '100%'); bg.setAttribute('height', '100%'); bg.setAttribute('fill', getComputedStyle(document.body).getPropertyValue('--surface').trim() || '#fff'); clone.insertBefore(bg, clone.firstChild);
  var text = new XMLSerializer().serializeToString(clone);
  function fallback(){ var ta = document.createElement('textarea'); ta.className = 'fallback'; ta.id = 'svg-source'; ta.value = text; var old = document.getElementById('svg-source'); if (old) old.remove(); $('#notes').appendChild(ta); ta.focus(); ta.select(); toast('下の欄に SVG を出しました。選択してコピーしてください'); }
  try { navigator.clipboard.writeText(text).then(function(){ toast('SVG をコピーしました'); }, fallback); } catch (e) { fallback(); }
});
function routeKey(){ return state.scene === 'route' ? state.rid + ':' + walkCode(RB[state.rid]) : ''; }
/* An address typed or followed while the page is open. An address that is not a stop of the storyline leaves the
   storyline; the page's own writing of the address (where it arrives here at all) changes nothing. */
window.addEventListener('hashchange', function(){
  if (location.hash.replace(/^#/, '') === hashName()) return;
  if (!location.hash.replace(/^#/, '') && frontOK()) { state.intro = false; state.about = false; state.front = true; render(); window.scrollTo(0, 0); return; }      /* no address: the cover */
  var c = state.scene, v = state.view, s = state.sel && state.sel.id, k = routeKey(), st = state.story, wasFront = pageOn();
  state.front = false; state.intro = false; state.about = false; state.story = 0; readHash();
  if (wasFront || state.intro || state.about || state.scene !== c || state.view !== v || (state.sel && state.sel.id) !== s || routeKey() !== k || state.story !== st) render();
  if (state.story && state.story !== st) storyReveal();
  if (!state.story && /^#story(--|$)/.test(location.hash)) writeHash();      /* a stop was asked for where the storyline is not shown: the address says what is in sight */
});

/* ---------- boot ---------- */
$('#badge').hidden = BUILD === 'public' || (BUILD === 'release' && !META.preview);
$('#pubwrap').hidden = BUILD !== 'internal';
$('#ver').innerHTML = esc('v' + META.version + '・' + META.stage) + '<span class="v-corpus">' + esc('・コーパス ' + META.corpus_version) + '</span>';
document.documentElement.lang = LANG;
readHash(); if (!location.hash.replace(/^#/, '') && frontOK()) state.front = true;
legend(); notes(); render(); altSync();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
if (state.scene !== 'all' && state.sel && state.sel.t === 'n') setTimeout(function(){ if (state.sel) reveal(state.sel.id); }, 60);
if (storyNow()) setTimeout(storyReveal, 60);
})();
