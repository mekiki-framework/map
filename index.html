<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mekiki Map</title><meta name="description" content="AI にどこまで任せ、何を自分でやるか。仕事や学びの場面に当てはめて考え直すための枠組み（Mekiki Framework）と、その案内図です。"><meta property="og:type" content="website"><meta property="og:site_name" content="Mekiki Map"><meta property="og:title" content="Mekiki Map"><meta property="og:description" content="AI にどこまで任せ、何を自分でやるか。仕事や学びの場面に当てはめて考え直すための枠組み（Mekiki Framework）と、その案内図です。"><meta name="twitter:card" content="summary"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a pathway figure with two arrangements of the same nodes and lines. Vertical (default): the five
   papers are tiers stacked in reading order, like a signalling cascade drawn from membrane to nucleus, and
   the kinds of things a paper identifies are lines inside its tier. Horizontal: the six kinds are rows and
   the papers are columns. Controls above the figure, the selected item's sources beside it. */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#17202A; --ink-2:#4B5665; --ink-3:#7C8796; --line:#D6DCE4; --line-2:#B9C2CE;
  --band:#EEF1F5; --focus:#1F6FEB;
  --t1:#2C6CB4; --t1-bg:#E8F0FA; --t2:#148776; --t2-bg:#E2F3EF; --t3:#6F55C2; --t3-bg:#EEEAFA;
  --t4:#A85C1C; --t4-bg:#F8EDE1; --t5:#B13659; --t5-bg:#FAE8EE;
  --stop:#B3261E; --stop-bg:#FCEDEC; --route:#E8A600; --route-bg:#FFF2C2; --route-ink:#1C1500;
  --font:"IBM Plex Sans","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151B; --surface:#171E26; --ink:#E7ECF2; --ink-2:#AEB8C4; --ink-3:#7D8896; --line:#2B3541; --line-2:#3E4A58;
    --band:#121920; --focus:#6CA8FF;
    --t1:#7DB0EE; --t1-bg:#1A2A3D; --t2:#56C9B4; --t2-bg:#15302C; --t3:#B09CF3; --t3-bg:#292441;
    --t4:#E2A066; --t4-bg:#38291A; --t5:#EE88A6; --t5-bg:#3B1E2A;
    --stop:#F2857C; --stop-bg:#3A1E1C; --route:#F5C542; --route-bg:#3A3010; --route-ink:#1C1500; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151B; --surface:#171E26; --ink:#E7ECF2; --ink-2:#AEB8C4; --ink-3:#7D8896; --line:#2B3541; --line-2:#3E4A58;
  --band:#121920; --focus:#6CA8FF;
  --t1:#7DB0EE; --t1-bg:#1A2A3D; --t2:#56C9B4; --t2-bg:#15302C; --t3:#B09CF3; --t3-bg:#292441;
  --t4:#E2A066; --t4-bg:#38291A; --t5:#EE88A6; --t5-bg:#3B1E2A;
  --stop:#F2857C; --stop-bg:#3A1E1C; --route:#F5C542; --route-bg:#3A3010; --route-ink:#1C1500; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.65 var(--font);-webkit-text-size-adjust:100%}
.app{max-width:1760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
a{color:inherit;text-underline-offset:2px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.top h1{margin:0;font-size:21px;font-weight:600;letter-spacing:.01em}
.badge{font:500 11px var(--mono);padding:2px 8px;border:1px solid var(--stop);color:var(--stop);border-radius:999px}
.ver{font:400 11.5px var(--mono);color:var(--ink-3)}
/* the version, the way back to the cover and the link to the other language. On a wide window they are items of the
   heading's row like the rest; on a phone they make the second row together (below) */
.vrow{display:contents}
/* the way to the same page in the other language (shown only when the build names one), and the note on a passage
   read in an edition other than the original */
a.tool{display:inline-block;text-decoration:none;color:var(--ink)}
.ed{display:block;font-size:11px;color:var(--ink-3)}
.lede{margin:0;flex-basis:100%;color:var(--ink-2);font-size:13.5px;max-width:70em}

.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end}
.grp{display:flex;flex-direction:column;gap:4px;min-width:0}
.grp>span{font-size:11px;letter-spacing:.06em;color:var(--ink-3)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:hover:not([aria-pressed="true"]){background:var(--band)}
.grp input[type="search"]{border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:6px 10px;width:13em;max-width:100%}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;padding-bottom:6px;cursor:pointer}
.tool{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.tool:hover{background:var(--band)}

.caption{margin:0;padding:10px 14px;border-left:3px solid var(--ink-3);background:var(--surface);font-size:13.5px;max-width:86em;border-radius:0}
.caption small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}

.work{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}
.work.wide{grid-template-columns:minmax(0,1fr)}
.work.wide .detail{position:static;max-height:none}
.mapwrap{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
#map{display:block;width:100%;min-width:880px;height:auto;margin:0 auto}
.detail{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px 16px 20px;min-width:0}
/* the padding above the bar belongs to the details; the shadow keeps scrolled text from showing through it */
.dnav{position:sticky;top:0;z-index:1;display:flex;gap:6px;margin:0 -16px 10px;padding:0 16px 8px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 -17px 0 var(--surface)}
.dnav .tool{flex:0 0 auto}
.rfline{margin:0 0 10px}
.enter.go{border-color:var(--ink);font-weight:600;padding:7px 14px;margin:2px 0 4px}
/* a way on, as a button of two lines (where it leads; what is found there). The ways of an exit stand one under the other */
.ways{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.enter.way{display:block;width:100%;margin:0;padding:7px 12px 8px;border-left-width:4px;text-align:left;font-family:inherit}
.enter.way b{display:block;font-size:13.5px;font-weight:600;line-height:1.45}
.enter.way span{display:block;margin-top:1px;font-size:11.5px;line-height:1.45;color:var(--ink-2)}
.dnav .way{border-color:var(--c,var(--line-2));background:var(--cbg,var(--surface));font-weight:600}
.kinds{list-style:none;margin:0 0 10px;padding:0;font-size:13.5px}
.kinds li{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;padding:3px 0 3px 10px;border-left:2px solid var(--line-2)}
.detail .kinds .en{margin:0}
.detail .hand{margin-top:14px}
.detail h2{margin:0 0 2px;font-size:16.5px;font-weight:600;line-height:1.4;text-wrap:balance}
.detail .en{font:400 12px var(--mono);color:var(--ink-3);margin:0 0 8px;overflow-wrap:anywhere}
.detail h3{margin:16px 0 6px;font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:8px}
.detail h3::after{content:"";flex:1;border-top:1px solid var(--line)}
.detail p{margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.b-text{border-style:solid;border-color:var(--ink)}
.chip.b-record{border-style:dotted;border-width:1.5px;border-color:var(--ink-2)}
.chip.b-reading{border-style:dashed;border-color:var(--ink-3)}
.chip.pp{border-color:var(--c);color:var(--c);font-family:var(--mono)}
.chip.int{border-color:var(--stop);color:var(--stop)}
blockquote{margin:0 0 4px;padding:8px 10px;border-left:2px solid var(--ink);background:var(--bg);font-size:13px;line-height:1.6;overflow-wrap:anywhere}
blockquote.rec{border-left:2px dotted var(--ink-2)}
.src{margin:0 0 10px;font:400 11px var(--mono);color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 10px}
.src a{color:var(--ink-2)}
.read{border-left:2px dashed var(--ink-3);padding:6px 10px;margin:0 0 8px;font-size:13.5px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px;margin:0 0 8px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.rows{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.rows li{padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.rows .wrong{color:var(--stop);text-decoration:line-through;text-decoration-thickness:1px}
.rows button{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.empty{color:var(--ink-2);font-size:13.5px}
.x{float:right;border:1px solid var(--line-2);background:transparent;border-radius:6px;padding:0 8px;cursor:pointer;font-size:13px;line-height:1.7}

.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px 24px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;font-size:13px}
.legend h2,.list h2,.notes h2{grid-column:1/-1;margin:0 0 4px;font-size:12px;letter-spacing:.06em;color:var(--ink-3);font-weight:500}
.legend div{display:flex;align-items:center;gap:10px;min-width:0}
.legend svg{flex:none}
.legend p{grid-column:1/-1;margin:6px 0 0;color:var(--ink-2);font-size:12.5px}

.list{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;min-width:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--ink-3);font-size:11.5px;letter-spacing:.04em;white-space:nowrap}
td button{border:0;background:transparent;padding:0;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:2px}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.notes{font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.notes p{margin:0;max-width:92em}
.notes h3{margin:6px 0 0;font-size:12px;letter-spacing:.06em;color:var(--ink-3);font-weight:500}
.notes .rows{max-width:92em;margin:2px 0 6px;font-size:12.5px}
.notes .rows a{font:400 12px var(--mono);overflow-wrap:anywhere}
.notes code{font:400 11.5px var(--mono)}
.notes .rd-more{margin:6px 0 0;max-width:92em}
.notes .rd-more>summary{font-size:12.5px}
.notes .rd-more[open]>summary{margin-bottom:6px}
.notes .rd-more p{margin:0 0 4px}
.notes .cks{margin:4px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:2px}
.guide{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));margin-inline:auto;max-width:700px;bottom:calc(14px + env(safe-area-inset-bottom,0px));box-sizing:border-box;background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:12px;padding:12px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.22);z-index:15}
.guide .g-head{display:flex;align-items:baseline;gap:10px}
.guide .g-no{font:500 12px var(--mono);color:var(--ink-3)}
.guide h2{margin:0;font-size:15.5px;font-weight:600}
.guide .x{float:none;margin-left:auto}
.guide p{margin:8px 0 10px;font-size:14px;line-height:1.8;max-width:none}
.guide .g-nav{display:flex;align-items:center;gap:8px}
.guide .g-dots{margin-left:auto;display:flex;gap:6px}
.guide .g-dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.guide .g-dots i.on{background:var(--ink)}
.guide-look{outline:3px solid var(--route);outline-offset:4px;border-radius:8px}
body.guiding .app{padding-bottom:230px}
@media (max-width:640px){body.guiding .app{padding-bottom:300px}}
#map .node.guide-look{outline-offset:6px}
#guide-open{align-self:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
textarea.fallback{width:100%;height:120px;font:11px var(--mono);margin-top:8px}

@media (max-width:1120px){
  .work{grid-template-columns:minmax(0,1fr)}
  .detail{position:static;max-height:none}
}
/* Narrow screens: a phone held upright (told by the width alone), or lying on its side (told by a low screen that
   is touched with a finger, so that no window on a desk is taken for one). Nothing here applies to a wide window.
   Three things change. The switches fold away behind one button, and only the ways in stay on the first screen.
   The details come up from the bottom of the screen (from the side, when the phone lies on its side) instead of
   lying under the map. The map is drawn at one size on every phone, the size at which its words can be read, and
   is moved sideways with a finger. Which things share a row is fixed by rule and not by what happens to fit, so
   the arrangement is the same on every model; only the lengths follow the width of the screen. */
#more,#zall,.sheet-tgl{display:none}
@media (max-width:720px), (pointer:coarse) and (max-height:480px){
  .app{gap:12px;padding-block:14px 40px}
  .top{gap:4px 10px}
  .top h1{font-size:19px;order:1}
  .badge{order:2}
  #guide-open{order:3;margin-left:auto}
  /* the second row: the version at the left; at the right the way back to the cover and the link to the other
     language. The row is one box, so what stands in it does not depend on how much the first row holds. When the
     way back to the cover is there, the version of the corpus is left to the foot of the page (it is said there). */
  .vrow{display:flex;order:4;flex:1 0 100%;min-width:0;gap:10px;align-items:baseline}
  .vrow .ver{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top.has-front .v-corpus{display:none}
  .lede{order:5;font-size:13px}
  .lede:not(.full){display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
  .controls{gap:8px 12px}
  .controls>.grp{flex:1 1 100%;align-items:flex-start}
  .controls>#g-cross{flex:1 1 0;min-width:0}      /* shares its row with "more" at any width: where its buttons are longer than the room, they move sideways */
  .controls>#g-cross .seg button{padding-left:9px;padding-right:9px}      /* three names in the room beside "more": a little closer, so that they fit on most phones */
  .controls>:not(.pri){order:3}
  .controls>#more{order:1;margin-left:auto}
  .controls>#g-zoom{order:2}
  .controls:not(.open)>:not(.pri):not(#more){display:none}
  .seg{flex-wrap:nowrap;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:0 0 auto;min-height:40px}
  .tool{min-height:40px}
  .tool.sm{min-height:36px}
  .grp input[type="search"]{width:100%;min-height:40px;font-size:16px}     /* under 16px, a phone enlarges the whole page when the field is entered */
  .rcode input{font-size:16px}
  .chk{flex:1 1 100%;min-height:36px;padding-bottom:0}
  #more{display:inline-flex;align-items:center}
  #panel{display:none}
  .caption{font-size:13px}
  .caption .cap-t{display:block}
  .caption:not(.full) .cap-t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
  .caption.long{cursor:pointer}
  .caption small{display:inline;margin-right:10px}
  .cap-more{border:0;background:none;padding:4px 0;margin:0;font-size:12px;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
  #map{min-width:1132px}
  .controls>.pri:first-child{position:relative}
  #zall{display:block;position:absolute;right:0;top:-9px;border:0;background:none;padding:7px 0 7px 14px;font-size:12px;line-height:1.5;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
  .navhint{margin:0;display:flex;align-items:center;gap:10px;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
  .navhint span{flex:1;min-width:0}
  .legend{grid-template-columns:minmax(0,1fr)}
  .x{min-height:32px;padding:0 12px}
  /* a finger leaves the last thing it pressed looking pressed: where nothing can hover, the hover tints are dropped */
  @media (hover:none){
    .tool:hover{background:var(--surface)}
    .seg button:hover:not([aria-pressed="true"]),.crumbs button:hover{background:transparent}
  }
  .src{gap:2px 14px}
  .src a{display:inline-block;padding:4px 0}
  body.sheet .app{padding-bottom:62vh;padding-bottom:calc(58dvh + 24px)}
  body.sheet.low .app{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  body.sheet #detail{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:15;max-height:56vh;max-height:56dvh;overflow:auto;overscroll-behavior:contain;
    border-radius:16px 16px 0 0;border-width:1px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.22);
    padding:0 max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  body.sheet.low #detail{max-height:calc(46px + env(safe-area-inset-bottom,0px));overflow:hidden}
  body.sheet .sheet-tgl{display:flex;position:sticky;top:0;z-index:2;width:100%;min-height:46px;margin:0 0 4px;padding:6px 0 4px;border:0;background:var(--surface);
    flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
  body.sheet .sheet-tgl i{display:block;width:38px;height:4px;border-radius:2px;background:var(--line-2)}
  /* the step buttons stay under the handle of the sheet while the sheet is scrolled */
  body.sheet .dnav{top:46px;margin:0 0 10px;padding:4px 0 8px;box-shadow:none}
  body.sheet .dnav .tool{flex:1 1 0;min-height:40px}
  /* three buttons (an exit of the storyline, the end of a walk): each as wide as its words ask */
  body.sheet .dnav.fork .tool{flex:1 1 auto;padding-left:8px;padding-right:8px}
}
/* a phone lying on its side: there is little height, so the heading takes one row and the details stand at the right */
@media (pointer:coarse) and (max-height:480px) and (min-width:560px){
  .vrow{display:contents}
  .vrow .ver{order:3;flex:0 1 auto}
  #front-open,#guide-open,#alt-lang{order:4}
  .controls>.pri{flex:0 1 auto}
  .controls>#g-cross{order:1;flex:1 1 0;min-width:0}
  .controls>#more{order:2}
  .controls>#g-route{order:3;flex:1 1 100%}
  .controls>:not(.pri):not(#more){order:5}
  .controls>#g-zoom:not(.pri){order:4}
  .controls>.grp:not(.pri),.controls>.chk{flex:0 0 calc(50% - 6px)}
  body.sheet:not(.low) .app{padding-bottom:40px;padding-right:calc(min(44vw,360px) + 12px)}
  body.sheet:not(.low) #detail{left:auto;top:0;width:min(44vw,360px);max-height:none;border-radius:16px 0 0 16px;border-width:0 0 0 1px;box-shadow:-8px 0 28px rgba(0,0,0,.22);padding-left:16px}
  body.sheet:not(.low) .sheet-tgl i{display:none}
  body.sheet.low #detail{left:auto;width:min(44vw,360px);border-radius:16px 0 0 0;border-width:1px 0 0 1px;padding-left:16px}
}

/* figure */
.p-T1{--c:var(--t1);--cbg:var(--t1-bg)} .p-T2{--c:var(--t2);--cbg:var(--t2-bg)} .p-T3{--c:var(--t3);--cbg:var(--t3-bg)}
.p-T4{--c:var(--t4);--cbg:var(--t4-bg)} .p-T5{--c:var(--t5);--cbg:var(--t5-bg)}
#map text{font-family:var(--font)}
.band-bg{fill:var(--band)} .band-bg.alt{fill:none}
.band-lbl{font-size:12.5px;font-weight:600;fill:var(--ink)}
.band-en{font-size:9.5px;fill:var(--ink-3)}

分でやる。引用は Reader で照合：exact 89・normalized 0）","番地の控え 706 件：消えた番地なし（付け替え 3 件）"],"checked_at":"2026-11-23 01:05","divider_note":{"text":"ここから下は、定理の帰結ではない主張（構成的な拡張・解釈的テーゼ・仮説・事例）","basis":"record","record":{"src":"THEORY_MAP","text":"Neither thesis is entailed by the analytic theorem. Do not report either as a demonstrated causal effect."},"lines":["定理の帰結ではない主張","（拡張・解釈的テーゼ・仮説・事例）"]},"default_orient":"v","inside":{"T1":{"units":28,"refs":16,"parts":69,"links":28},"T2":{"units":29,"refs":18,"parts":67,"links":25},"T3":{"units":20,"refs":17,"parts":49,"links":21},"T4":{"units":19,"refs":26,"parts":53,"links":24},"T5":{"units":21,"refs":56,"parts":73,"links":30}},"made_note":"原文の引用は、原文と一字ずつ照合してある。要約、名前、配置は、AI を使って作り、著者が確認した。","routes":{"denshou":{"steps":8,"ends":9},"makaseru":{"steps":5,"ends":7},"manabu":{"steps":4,"ends":5},"shokuba":{"steps":4,"ends":6},"aete":{"steps":3,"ends":5}},"story":{"vis":"public","view":"chain","title":"五本のあらすじ","lede":"T1〜T4 は、任せるときに、人の側に何が残らなければならないかを問う。T5 は逆の向きから、任せることが技術的に可能で、正統であっても、任せないことが理にかなう場合があるのはなぜかを問う。五本を、読む順に一本ずつたどる。","record":{"src":"THEORY_MAP","text":"T5 closes the series by reversing the question: where T1–T4 ask what must remain on the human side when delegation occurs, T5 asks why an agent may rationally decline delegation even when it is technically possible and legitimate."},"steps":[{"node":"ai"},{"paper":"T1"},{"paper":"T2"},{"paper":"T3"},{"paper":"T4"},{"paper":"T5"},{"end":true}],"end":{"title":"結び","text":"この枠組みが特定するのは、人に残る作業のリストではない。種類の違うものである。形にするときのコスト、課題ごとの判断、主体性の成分、移せない関係、移せない参加の事実、それに、承認と文化の条件についての別の主張である。"},"chapters":[{"paper":"T1","abstract":"t1-abstract-p1","order":"lines","nodes":["t1-ext","t1-speccost","t1-spec","t1-ablation","t1-visibility"],"x":"x-t1"},{"paper":"T2","abstract":"t2-abstract-p1","order":"lines","nodes":["t2-seinsollen","t2-boundary","t2-assay","t2-ratelimit"],"x":"x-t2"},{"paper":"T3","abstract":"t3-abstract-p1","order":"lines","nodes":["t3-direction","t3-drive","t3-mode","t3-answer","t3-distinct","t3-twolayer"],"x":"x-t3"},{"paper":"T4","abstract":null,"order":"lines","nodes":["t4-ratelimit","t4-adherence","t4-undertake","t4-embody","t4-twopath"],"x":"x-t4"},{"paper":"T5","abstract":"t5-abstract-p1","order":"lines","nodes":["t5-objects","t5-theorem","t5-criterion","t5-roots","t5-apparatus","t5-norm","t5-visibility","t5-shogi"],"x":"x-t5"}],"old":{"T1":["t1-ext","t1-speccost","t1-spec","t1-ablation","t1-visibility"],"T2":["t2-seinsollen","t2-boundary","t2-assay","t2-ratelimit"],"T3":["t3-direction","t3-drive","t3-mode","t3-answer","t3-distinct","t3-twolayer"],"T4":["t4-ratelimit","t4-adherence","t4-undertake","t4-embody","t4-twopath"],"T5":["t5-objects","t5-theorem","t5-criterion","t5-roots","t5-apparatus","t5-norm","t5-visibility","t5-shogi"]},"ok":1},"front":{"vis":"public","headline":"AI にどこまで任せ、何を自分でやるか。","what":"Mekiki Framework は、AI の時代の知識労働で、任せられないものを切り分けるための枠組みです。名前は、日本語の「目利き」から取られています。論文（プレプリント）は五本あり、はじめの四本は、任せるときに、人の側に何が残らなければならないかを問います。五本目は逆に、任せることができ、そうしてよいときでも、任せないことが理にかなう場合があるのはなぜかを問います。この地図は、その五本を読むための案内図で、論文の代わりにはなりません。","scenes":"五本の論文を、身近な場面に当てはめて読む例です。場面ごとに問いがいくつかあり、いちばん近い答えを選ぶと、次の問いか、最後に残る問いに進みます。残る問いは評価ではなく、次に考える場所を示します。","order":["makaseru","aete","manabu","denshou","shokuba"],"intro":{"vis":"public","papers":{"T1":"T1 は、知識労働の中で、二つのものを区別します。一つは、何を作り、何を除き、何を良しとするかについての判断で、これを仕様（Specification）と呼びます。もう一つは、その判断を文章やコードなどの形にするときの技術的な障壁で、これを外化のコスト（Externalization cost）と呼びます。AI が下げるのは外化のコストであり、仕様が要らなくなるわけではありません。このコストが下がると、仕様が、成果の質を支える別のもの（基質）として見えるようになります。","T2":"T2 は、仕様の中身を二つの成分に分けます。事実として適切かどうかに関わる成分（Sein 型）と、何を優先し、何を守るべきかに関わる成分（Sollen 型）です。実際の判断の多くは、二つが混ざっています。そのうえで T2 は、AI が出力を作れるかどうか（能力）と、その出力に含まれる価値判断の拠り所として AI が認められるかどうか（正統性）は、別の問いだと論じます。AI が出力を作れても、その先では出力の正統性の源にはなれない、という線が、委任の正統性の境界（delegation legitimacy boundary）です。この境界は Sollen の側にあります。T2 は、価値判断を下す権限が制度の上で人に帰されているあいだ、この境界が成り立つ、と書いています。","T3":"T3 は、学ぶ場面で、この境界が何に基づいているかを問います。学習者の主体性を、方向（direction）、駆動（drive）、様式（mode）の三つの成分に仮に分けていくと、どの成分でもないものが残ります。それは、ある判断について、問う資格のある相手に答えなければならない立場です。T3 はこれを答える立場（answerability）と呼び、成分ではなく、問う側と答える側のあいだの関係だと論じます。問う側は代わりの人が務められますが、答える側は、代わりを立てることができません。","T4":"T4 は、この関係を、組織の中で考えます。「自分ごと化」を、引き受け（undertaking）と身体化（embodiment）の組み合わせとして定義し直します。引き受けは、目的を自分の判断理由として承認し、特定の相手に理由を示す関係の中で保つことであり、指示に従うこと（服従）とは別です。身体化は、引き受けた向きが、実際にやることを通じて実践に染み込むことです。T4 は、問う側も答える立場に立たなければ、引き受けの場は成り立たない、と書いています。生成 AI が、知識を形にし、組み合わせる作業を速めるほど、組織の速さを決めるのは、引き受けと身体化になります。","T5":"T5 は逆に、任せることが技術的に可能で、正統でもあるときに、それでも任せないことが理にかなう場合があるのはなぜかを問います。T5 の定理は、ゲームについてのものです。ゲームの目標の状態は、ほかの誰かが代わりに実現できます。しかし、自分が制約を受け入れてそれを追ったという事実、つまり参加（participation）は、ほかの誰かがその状態を実現しても、それによって成り立つわけではありません。代わりが人でも機械でも同じで、AI が遊べるかどうかには依りません。尊厳や、社会の中での承認についての議論は、定理から直接は出ない別の主張として、分けて書かれています。"},"close":"五本が示しているのは、人のために取っておく仕事のリストではなく、種類の違ういくつかのものです。形にするときのコスト、課題ごとの判断、主体性の成分、移せない関係、移せない参加の事実、それに、承認と文化の条件についての別の主張です。著者は、五本を T1 から T5 の順に読むことを勧めています。これは読む順で、後の論文が前の論文から論理的に導かれるという主張ではありません。ここに書いた文は、論文へ案内するための要約です。論文の言葉と、主張の範囲は、それぞれの論文にあります。","ok":1},"lede":"AI でできることは増え、手間も減ったのに、どこかで噛み合わなくなる。AI の精度の問題か、使い方の問題か、それとも、人の側に残るはずの何かが抜けているのか。ここでは、その三つ目を自分の状況に照らし合わせて確かめられます。","base":"もとにしたのは、Mekiki Framework の五本の論文（プレプリント）です。AI の時代の知識労働で、任せられないものを切り分けるための枠組みです。この地図は、論文の代わりにはなりません。","about":{"title":"何のための枠組みか","sub":"著者の前書き。作ったわけ、読んでほしい人、使い道。","by":"著者の前書き","paras":["五本の論文を一気に読むのは、かなりの負担になります。私自身、全体のあちこちを行き来するのは大変です。AI が論文を正確に参照できる仕組みは GitHub と Mekiki Reader に整えてありますが、まずは人が全体を見渡して、自分の関心に近いところから入っていける入口がほしいと思い、この地図を作りました。","想定しているのは、仕事や学びの場で AI を使い始め、便利になった一方で「なんだか噛み合わない」「どこまで任せていいのか分からない」と引っかかりを覚えている人です。研究者や専門家だけでなく、現場で手を動かしている人や、ものを作っている人にも使える枠組みだと考えています。","一番の使い道は、自分の場面に当てはめて「その状況で、どこを考えればいいのか」を見つけることです。その先には、さらに二つの使い方があります。気になった箇所があれば、論文の原文で確かめられます。また、AI と一緒に何かを考えるときには、話が「AI が賢いかどうか」という一本の軸に流れてしまわないための、道標にもなります。私自身も、そう使っています。","なお、この地図は論文の代わりになるものではありません。また、この枠組みも、AI 活用の正解やノウハウを集めたものではありません。自身の状況を整理し、見直す手がかりにはなりますが、答えを出したり、判断を代行したりはしません。最後に残るのは、誰かを評価する答えではなく、次に立ち止まって考える場所です。個別の判断は、たどる人自身の手に残ります。"]},"one_line":"AI にどこまで任せ、何を自分でやるか。仕事や学びの場面に当てはめて考え直すための枠組み（Mekiki Framework）と、その案内図です。","ok":1} icipation; assist versus substitute; two locks; analytic theorem separated from normative extension, interpretive thesis, and sociological hypothesis","result":"Participation is agent-relative and non-transferable. The theorem does not itself establish dignity; T5 v3 constructively relates non-equivalence to recognition and distinguishes visibility from apparatus hypotheses","next":"The series terminates in a non-transferable participation value while preserving the logical status of later social claims"},"url":"https://mekiki-framework.github.io/papers/T5.html","short":"Why Play When AI Can Win"}],"bands":[{"id":"cost","ja":"変換のコスト","en":"conversion costs","lines":["変換のコスト"]},{"id":"judgment","ja":"課題ごとの判断","en":"task-specific judgments","lines":["課題ごとの判断"]},{"id":"component","ja":"主体性の成分","en":"agency components","lines":["主体性の成分"]},{"id":"relation","ja":"移らない関係","en":"a non-transferable relation","lines":["移らない関係"]},{"id":"participation","ja":"移らない参加の事実","en":"a non-transferable participation fact","lines":["移らない","参加の事実"]},{"id":"later","ja":"承認と文化条件についての後段の主張","en":"later claims about recognition and cultural conditions","lines":["承認と文化条件","についての","後段の主張"]}],"layers":[{"id":"ground","ja":"各分野の土台と相手","row":0,"lines":["各分野の","土台と相手"]},{"id":"thin","ja":"機械に対する細い筋","row":1,"lines":["機械に対する","細い筋"]},{"id":"thick","ja":"人から人への太い体系","row":2,"lines":["人から人への","太い体系"]},{"id":"capability","ja":"人と機械の役割分担","row":3,"lines":["人と機械の","役割分担"]}],"nodes":[{"id":"ai","kind":"stimulus","label":"AI：外化のコストが下がる","sub":"selective perturbation","paper":null,"band":null,"core":false,"basis":"text","vis":"public","gloss":"AI は、仕様を形にするときの技術的な障壁（外化のコスト）を選択的に下げる。仕様が要らなくなるのではない。最初の三本は、AI をこの選択的な摂動として使っている。","quotes":[{"paper":"T1","text":"a component reducible by AI (externalisation cost)","line":62,"anchor":"t1-2-1","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"The first three papers use AI as a selective perturbation: T1 makes specification visible by reducing externalization cost"},{"src":"THEORY_MAP","text":"AI does not create the distinction between specification and Ext.cost. It selectively lowers Ext.cost and thereby makes the pre-existing distinction observable."}],"ok":1},{"id":"t1-ext","kind":"concept","label":"外化のコスト","sub":"Ext.cost","paper":"T1","band":"cost","core":false,"basis":"text","vis":"public","gloss":"仕様を、文章・コード・モデルなどの形にするときの技術的な障壁。AI が下げるのはここ。","quotes":[{"paper":"T1","text":"denotes the technical barriers to converting tacit knowledge into explicit, formal representations","line":52,"anchor":"t1-2-1","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Externalization cost (Ext.cost) is the technical barrier to converting specification into a formal artifact such as text, code, a model, or a design."}],"ok":1},{"id":"t1-speccost","kind":"concept","label":"仕様化のコスト","sub":"Spec.cost","paper":"T1","band":"cost","core":false,"basis":"text","vis":"public","gloss":"課題の側の性質。その課題が分野の専門知をどれだけ要求するかの度合い。仕様（Spec.）の別名ではなく、すでにある判断の量でもない。","quotes":[{"paper":"T1","text":"specification cost is the degree to which a task demands domain expertise","line":54,"anchor":"t1-2-1","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Specification cost (Spec.cost) is a property of the task: the degree to which the task demands relevant domain expertise. It is not another name for specification and should not be described as a quantity of judgment already present."}],"ok":1},{"id":"t1-visibility","kind":"concept","label":"可視化テーゼ","sub":"made visible by AI","paper":"T1","band":"cost","core":false,"basis":"text","vis":"public","gloss":"二つのコストの区別は AI が作った構造ではなく、AI が見えるようにした構造だ、という T1 の中心主張。","quotes":[{"paper":"T1","text":"The central claim of this paper is that the distinction between externalisation cost and specification cost is not a structure created by AI, but a structure made visible by AI.","line":213,"anchor":"t1-5-1","match":"normalized"}],"records":[{"src":"THEORY_MAP","text":"AI does not create the distinction between specification and Ext.cost. It selectively lowers Ext.cost and thereby makes the pre-existing distinction observable."}],"ok":1},{"id":"t1-spec","kind":"concept","label":"仕様（判断の基質）","sub":"Spec.","paper":"T1","band":"judgment","core":true,"basis":"text","vis":"public","gloss":"分野の専門知をある課題に注いだときにできる、課題ごとの判断（何を作り、何を除き、何を質とみなすか）。出力の質を支える基質。専門知は実践者が持つ資源で、仕様化のコスト（課題側の要求度）とは別の語。","quotes":[{"paper":"T2","text":"is what results when domain expertise is invested in a particular task: the concrete judgments about what should be built, what should be excluded, and by what criteria quality should be assessed","line":37,"anchor":"t2-2-1","match":"exact"},{"paper":"T1","text":"domain expertise is a resource that the practitioner possesses","line":54,"anchor":"t1-2-1","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Specification (Spec.) is the task-specific substrate produced when domain expertise is invested in a task: judgments about what to build, what to exclude, what matters, and how quality should be assessed."},{"src":"THEORY_MAP","text":"Do not turn T1 into the absolute claim that AI can never contribute to specification."}],"ok":1},{"id":"t1-ablation","kind":"concept","label":"ドメイン・アブレーション","sub":"domain-ablation","paper":"T1","band":"judgment","core":false,"basis":"text","vis":"public","gloss":"外化の質が高くても、仕様が欠ければ出力は分野として不適切になりうる。この予測を例証するための実験。","quotes":[{"paper":"T1","text":"To illustrate the framework's prediction that specification cost cannot be substituted by externalisation cost alone, a domain-ablation experiment was conducted.","line":163,"anchor":"t1-4-2","match":"exact"},{"paper":"T1","text":"technically competent but domain-inappropriate","line":14,"anchor":"t1-abstract","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"High-quality externalization cannot compensate for missing or inadequate specification: fluent or functional output may still be domain-inappropriate."}],"ok":1},{"id":"t2-ratelimit","kind":"concept","label":"律速の移動","sub":"SECI: E・C → S・I","paper":"T2","band":"cost","core":false,"basis":"text","vis":"public","gloss":"AI が外化と結合を速め、社会化と内面化が人の速さのままなら、全体の速さを決める段階はこの二つの側に移る。実測の結果ではなく、表からの分析的な帰結として述べられている。","quotes":[{"paper":"T2","text":"When two processes in a sequential cycle are dramatically accelerated while the other two remain at human speed, the effective rate-limiting stage shifts to the unaccelerated processes.","line":160,"anchor":"t2-4-5","match":"exact"},{"paper":"T2","text":"This is not an empirical finding but an analytic consequence of the matrix above","line":160,"anchor":"t2-4-5","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"AI acceleration of Externalization and Combination shifts the effective bottleneck toward Socialization and Internalization, but each process remains internally mixed."}],"ok":1},{"id":"t2-seinsollen","kind":"concept","label":"Sein 型／Sollen 型の仕様","sub":"ratio, not binary","paper":"T2","band":"judgment","core":false,"basis":"text","vis":"public","gloss":"仕様の中身を、事実の適切さに関わる成分（Sein 型）と、価値づけに関わる成分（Sollen 型）に分ける。実際の判断の多くは混ざっていて、二分でなく比率で見る。Sollen 型の仕様（実践者の判断）は、Sollen（規範そのもの）とは別。","quotes":[{"paper":"T2","text":"it derives a decomposition into Sein-type (factual) and Sollen-type (value-laden) components","line":29,"anchor":"t2-1","match":"normalized"},{"paper":"T2","text":"clean decomposition into pure Sein and pure Sollen is not always possible","line":53,"anchor":"t2-2-3","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Most real judgments are hybrid. Sein and Sollen are ratio dimensions, not mutually exclusive boxes."},{"src":"THEORY_MAP","text":"Sollen-type specification is the practitioner's capacity and task-specific judgment. Sollen may also refer to norms, requirements, or evaluative pressures present in the environment. The capacity to judge and the norm being judged under are not the same thing."}],"ok":1},{"id":"t2-boundary","kind":"concept","label":"委任の正統性の境界","sub":"delegation legitimacy boundary","paper":"T2","band":"judgment","core":true,"basis":"text","vis":"public","gloss":"AI が出力を生成できることと、その出力の正統性の源になれることは別の問い。境界は Sollen の側にある。Sein の側は能力が進むと動くが、動くのは事実の評価をどこまで自動でできるかで、規範を決める権限が移るのではない。主張は能力についてではなく、判断を裏づける根拠についてのもの。T2 は、価値判断を下す権限が制度の上で人に帰されているあいだ、この境界が成り立つ、と書く。","quotes":[{"paper":"T2","text":"the line beyond which AI may generate outputs but cannot serve as the source of their legitimacy","line":29,"anchor":"t2-1","match":"exact"},{"paper":"T2","text":"The boundary is permeable on the Sein side","line":55,"anchor":"t2-2-3","match":"exact"},{"paper":"T2","text":"The claim is not about capability but about warrant.","line":55,"anchor":"t2-2-3","match":"exact"},{"paper":"T2","text":"The boundary is not a capability claim; it is a legitimacy claim, and it holds as long as the authority to make value judgments remains institutionally attributed to human agents.","line":29,"anchor":"t2-1","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"AI capability and delegation legitimacy are different questions; the boundary is located on the Sollen side"},{"src":"THEORY_MAP","text":"AI can generate Sollen-like language and may recommend the same action as an expert. That does not by itself transfer the warrant, authority, or standing behind the judgment."}],"ok":1},{"id":"t2-assay","kind":"concept","label":"認知アッセイ","sub":"asymmetric scoring","paper":"T2","band":"judgment","core":false,"basis":"text","vis":"public","gloss":"哲学の区別を、測定の座標として使う採点手順。Sein の行は AI が、Sollen の行は分野の専門家が採点し、二つを一つの指数に足さない。SECI に当てた表の値は、測った量ではなく理論上の割り当てだと明記されている。","quotes":[{"paper":"T2","text":"proposes a minimal scoring protocol for locating it within any knowledge-work task","line":13,"anchor":"t2-abstract","match":"exact"},{"paper":"T2","text":"These conditions — specification foregrounded, externalization cost attenuated, independent variation empirically documented — are the conditions under which an assay becomes viable.","line":77,"anchor":"t2-3-1","match":"exact"},{"paper":"T2","text":"The matrix values in Table 1 are theoretical assignments","line":162,"anchor":"t2-4-5","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"The cognitive assay assigns Sein-row scoring to AI and Sollen-row scoring to domain experts. The two rows must not be summed into one index because factual adequacy and normative warrant are not commensurable."}],"ok":1},{"id":"t3-direction","kind":"concept","label":"方向","sub":"direction","paper":"T3","band":"component","core":false,"basis":"text","vis":"public","gloss":"学習者が何に向かっているか。候補の方向は外から提案できるが、是認は本人に代われない。外から来たことは、あとで是認されることを妨げない。","quotes":[{"paper":"T3","text":"Direction is what the learner is oriented toward.","line":41,"anchor":"t3-2-2","match":"normalized"},{"paper":"T3","text":"the evaluative commitment that makes some problems theirs rather than merely assigned","line":41,"anchor":"t3-2-2","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Direction has candidate and endorsed forms. Candidates may be proposed or jointly formed; each learner's endorsement cannot be supplied by a substitute. External origin does not rule out subsequent endorsement."}],"ok":1},{"id":"t3-drive","kind":"concept","label":"駆動（二つの形）","sub":"activation → drive","paper":"T3","band":"component","core":false,"basis":"text","vis":"public","gloss":"向かう力。向け先のまだない活性と、特定の方向に結びついた動機づけの二つの形がある。前者から後者への転換は設計上の推測で、因果の法則としては述べられていない。","quotes":[{"paper":"T3","text":"Magnitude is the drive behind the orientation: how much force the learner brings.","line":41,"anchor":"t3-2-2","match":"normalized"},{"paper":"T3","text":"embodied encounter with a problem-holder may contribute to the crystallization of evaluative commitment, and an endorsed direction may then anchor available activation as motivational drive","line":78,"anchor":"t3-3","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Motivational drive is propulsion anchored to a specific direction. The conversion from available activation is part of the design conjecture, not an established causal law."}],"ok":1},{"id":"t3-mode","kind":"concept","label":"様式","sub":"mode","paper":"T3","band":"component","core":false,"basis":"text","vis":"public","gloss":"課題に応じて使い分ける、認識の動作の持ち札（レパートリー）。固定した学習スタイルではなく、訓練と支援ができる。","quotes":[{"paper":"T3","text":"The learner who sharpens any draft put in front of them but originates none is not low in agency; they are operating in a single mode.","line":41,"anchor":"t3-2-2","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Mode denotes a task-sensitive repertoire of epistemic actions, not a fixed learning style; it is trainable and supportable."}],"ok":1},{"id":"t3-answer","kind":"concept","label":"答える立場","sub":"answerability","paper":"T3","band":"relation","core":true,"basis":"text","vis":"public","gloss":"成分を仕分け切ったあとに現れる、成分ではない関係。ある判断について、問う資格のある相手に答えなければならない立場。問う側は代理できるが、答える側は代理できない。方向は「持つ」もので、答える立場は「その中に立つ」もの。","quotes":[{"paper":"T3","text":"what it leaves exposed is a relation that was never on the component list","line":90,"anchor":"t3-4-1","match":"exact"},{"paper":"T3","text":"what cannot be done on one's behalf is precisely to answer","line":102,"anchor":"t3-4-3","match":"exact"},{"paper":"T3","text":"A current AI system cannot be made to answer in this sense: nothing can be taken from it, no commitment of its own is at stake, and self-reproach, were it scripted, would idle.","line":110,"anchor":"t3-4-4","match":"exact"},{"paper":"T3","text":"an argument from present limits must be re-made each time capability moves; an argument from the structure of address does not","line":104,"anchor":"t3-4-3","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"It is the non-transferable standing to have to answer for a judgment to those entitled to ask. One has direction, drive, and mode; one stands in answerability."},{"src":"THEORY_MAP","text":"T3 does not establish a biological-human exceptionalism. The boundary tracks second-personal standing and competence, not substrate."}],"ok":1},{"id":"t3-distinct","kind":"concept","label":"責務・権威との区別","sub":"accountability / authority","paper":"T3","band":"relation","core":false,"basis":"text","vis":"public","gloss":"割り当てられる責務（accountability）と、移らない立場（answerability）を分ける。学習者が AI に与える権威（authority）は、AI に立場（standing）を与えない。能力・権威・責務・立場は、それぞれ別の四つの変数。","quotes":[{"paper":"T3","text":"this article reserves accountability for institutionally allocatable duties — reportable, transferable, auditable — and answerability for the non-transferable standing","line":116,"anchor":"t3-4-4","match":"normalized"},{"paper":"T3","text":"The agent can be granted more authority without acquiring any standing.","line":102,"anchor":"t3-4-3","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Accountability is institutionally allocable. It can be assigned, audited, distributed, or reassigned through organizational design."},{"src":"THEORY_MAP","text":"Capability, perceived authority, accountability, and standing are four different variables."}],"ok":1},{"id":"t3-twolayer","kind":"concept","label":"二層の処方","sub":"layer one / layer two","paper":"T3","band":"relation","core":false,"basis":"text","vis":"public","gloss":"第一層は成分への働きかけ（見取り図・遭遇の設計・AI の使い方のガードレール）。第二層は二人称のやりとりで、第一層が届かないところを扱う。遭遇の設計が保証するのは、遭遇に触れる機会までで、結晶化は保証しない。成果のための委任と、発達のための委任は別の対象。","quotes":[{"paper":"T3","text":"Layer two addresses what layer one cannot reach.","line":120,"anchor":"t3-5","match":"exact"},{"paper":"T3","text":"The design guarantees exposure, never crystallization, and an honest program says so.","line":138,"anchor":"t3-5-2","match":"exact"},{"paper":"T3","text":"Performance delegation and developmental delegation are different objects","line":142,"anchor":"t3-5-3","match":"exact"},{"paper":"T3","text":"within any configuration, the answerable party is the human in it, not the configuration","line":152,"anchor":"t3-5-4","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Education develops answer-giving competence; AI can support rehearsal, while second-personal exchange tests and sustains its normative use."}],"ok":1},{"id":"t4-adherence","kind":"concept","label":"正統性の所在が動く","sub":"compliance → adherence","paper":"T4","band":"relation","core":false,"basis":"text","vis":"public","gloss":"医療が先に通った転換。何が正しい治療かを決める権限が医師の側にある配置から、患者と医療者の合意に正統性を置く配置へ移った。T4 はこの構造を組織に移す。","quotes":[{"paper":"T4","text":"転換の核心は，正統性の所在が動いたことにある。","line":51,"anchor":"t4-2-1","match":"exact"},{"paper":"T4","text":"アドヒアランスはこれを，患者と医療者の合意に正統性を置く配置へと置き換えた。","line":51,"anchor":"t4-2-1","match":"exact"},{"paper":"T4","text":"本稿はこの構造を組織へ転用する。","line":19,"anchor":"paper-t4","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"adherence transferred from medicine"}],"ok":1},{"id":"t4-undertake","kind":"concept","label":"引き受け","sub":"undertaking","paper":"T4","band":"relation","core":true,"basis":"text","vis":"public","gloss":"目的を自分の判断理由として承認し、それを特定の相手に理由を示す関係の中で保っていること。指示に従うこと（服従）とは別。与えられた目標でも、引き受ければ、それについて答えるのは自分になる。問う側も答える立場に立たなければ、引き受けの場は成り立たない。","quotes":[{"paper":"T4","text":"引き受けの内的な側とは，外から降りてきた意図を，自らの価値判断（Sollen），すなわち自らの判断理由として承認することである。","line":69,"anchor":"t4-2-3","match":"exact"},{"paper":"T4","text":"本稿でいう引き受けとは，前者が後者の関係の中で保持されている状態を指す。","line":77,"anchor":"t4-2-4","match":"exact"},{"paper":"T4","text":"引き受けの関係的な核は，移転不能な応答可能性（answerability）であり，相互性を要求する。","line":19,"anchor":"paper-t4","match":"exact"},{"paper":"T4","text":"命じられて始めた自発はすでに自発ではない。","line":180,"anchor":"t4-5-2","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Undertaking (引き受け) is the internal endorsement of a purpose, held within a relation of giving reasons to specific others. It is not compliance: following an instruction is not endorsing its purpose as one's own reason for judgment."}],"ok":1},{"id":"t4-embody","kind":"concept","label":"身体化","sub":"embodiment","paper":"T4","band":"relation","core":false,"basis":"text","vis":"public","gloss":"引き受けた向きが実践に染み込むこと。聞くことでなく、やることで起きる。自分ごと化は引き受けと身体化の複合で、どちらか一方では成り立たない。","quotes":[{"paper":"T4","text":"身体化とは，その引き受けた向きが実践に染み込み，手順を実行する身体に定着することである。","line":69,"anchor":"t4-2-3","match":"exact"},{"paper":"T4","text":"引き受けと身体化は，どちらか一方では自分ごと化にならない。","line":71,"anchor":"t4-2-3","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Embodiment (身体化) is the integration of an undertaken orientation into practice. It occurs through doing, not through being told."}],"ok":1},{"id":"t4-twopath","kind":"concept","label":"二経路モデル","sub":"止める者が答える","paper":"T4","band":"relation","core":false,"basis":"text","vis":"public","gloss":"意図を伝えて引き受けてもらう順方向と、従業員から出た向きを正式に検討して、採択・保留・停止のどれにも理由を返す逆方向の、二つの経路からなる。逆方向は提案箱ではない。止める判断の説明責任は、始める側ではなく止める側に置く。","quotes":[{"paper":"T4","text":"従業員が遭遇から結晶化させた向きを，正式な検討の回路に入れ，権限を持つ特定の主体が，採択・保留・停止のいずれについても理由を返す。","line":132,"anchor":"t4-4-3","match":"exact"},{"paper":"T4","text":"失敗する施策の多くは，経路1を強く押している。","line":134,"anchor":"t4-4-3","match":"exact"},{"paper":"T4","text":"この停止側の設計の正体は「止めるな」という放任ではなく，「止める者が答えよ」という配置である。","line":170,"anchor":"t4-5-2","match":"exact"},{"paper":"T4","text":"問う義務と答える義務の両側を条文が固めており","line":174,"anchor":"t4-5-2","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Chronic failure of jibungoto-ka initiatives is diagnosed as pressing the forward pathway while the reverse pathway is absent. The reverse pathway is not a suggestion box: collection without reasons returned does not constitute the pathway."},{"src":"THEORY_MAP","text":"T4's central placement: accountability for stopping decisions is assigned to the side that stops, not the side that starts."}],"ok":1},{"id":"t4-ratelimit","kind":"concept","label":"律速段階になる","sub":"AI-Accelerated","paper":"T4","band":"relation","core":false,"basis":"text","vis":"public","gloss":"外化と結合が速くなるほど、組織の速さを決めるのは引き受けと身体化になる。アドヒアランスの不良は以前から組織にあり、AI の時代に前面に出る。","quotes":[{"paper":"T4","text":"生成AIが知識の外化と結合を加速するほど，引き受けと身体化は律速段階になる。","line":19,"anchor":"paper-t4","match":"exact"},{"paper":"T4","text":"アドヒアランスの不良は以前から組織にあったが，AIの時代には，それが組織の速さを決める律速段階として前面に出てくる。","line":41,"anchor":"t4-1-4","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"T4 examines AI accelerating the organizational system: as externalization and combination speed up, undertaking and embodiment become the rate-limiting steps."}],"ok":1},{"id":"t5-objects","kind":"concept","label":"達成された状態と参加","sub":"two objects of desire","paper":"T5","band":"participation","core":false,"basis":"text","vis":"public","gloss":"ゲームには欲する対象が二つある。達成された状態（原理的には、ゲームなしでも作れる）と、参加（自分で受け入れた制約のもとでそれを追うこと）。丸ごと任せると前者は届き、ゲームは消える。","quotes":[{"paper":"T5","text":"Every game presents two distinct objects of desire: (i) an achieved state — the prelusory goal, describable and in principle producible without the game — and (ii) a participation — the agent's pursuit of that state under self-accepted constraint.","line":67,"anchor":"t5-2-2","match":"exact"},{"paper":"T5","text":"it delivers the achieved state while dissolving the game","line":65,"anchor":"t5-2-2","match":"exact"},{"paper":"T5","text":"Some obstacles merely sat there: nobody chose them, they constitute nothing","line":73,"anchor":"t5-2-3","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"Participation value is not achievement value. The achievement gap may be real without annulling participation."},{"src":"THEORY_MAP","text":"Chosen obstacles are not externalization cost. Constitutive constraints differ from technical barriers that AI properly removes."}],"ok":1},{"id":"t5-theorem","kind":"concept","label":"参加は移らない","sub":"non-transferability theorem","paper":"T5","band":"participation","core":true,"basis":"text","vis":"public","gloss":"他の行為者が目標の状態を実現しても、A が制約を理由として受け入れてそれを追った、という事実が、それによって成り立つわけではない。代わりが人でも機械でも同じ。形式定理の対象はゲームで、AI が遊べるかどうかには依らない。","quotes":[{"paper":"T5","text":"AI can deliver the state of affairs; it cannot deliver the fact of participation.","line":13,"anchor":"t5-abstract","match":"exact"},{"paper":"T5","text":"But the fact that A pursued p under R, with the constraints accepted as reasons, does not thereby obtain; and no further performance by the other agent can make it obtain, because A's having played is not a causal consequence of p that a sufficiently capable agent could also bring about.","line":79,"anchor":"t5-3-1","match":"exact"},{"paper":"T5","text":"There is no third task, between the first two, for a better machine to perform.","line":83,"anchor":"t5-3-1","match":"exact"},{"paper":"T5","text":"the seat was never held by superior ability in the first place","line":105,"anchor":"t5-3-3","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"The theorem is agent-relative and applies equally to human and artificial proxies. It is independent of whether artificial systems can achieve, play, or matter morally."},{"src":"THEORY_MAP","text":"Do not expand the formal theorem and the corollary into one unqualified universal claim."}],"claims":["T5-A1","T5-T1","T5-A3","T5-A4"],"ok":1},{"id":"t5-criterion","kind":"concept","label":"基準は引き受け","sub":"undertaking, not provenance","paper":"T5","band":"participation","core":false,"basis":"text","vis":"public","gloss":"参加かどうかを分けるのは目標の出所ではない。行為者がそれを自分の理由として引き受けたか、実践がその行為者を参加者として扱うか。命令だけでは引き受けは成り立たない。T5 が提案して使う基準で、別に証明された定理ではない。","quotes":[{"paper":"T5","text":"The dividing line is not where the goal came from but what happened to it on arrival: whether the goal and its constraints are undertaken by the agent as the agent's own reasons — and, on the side that can be observed, whether the agent is treated by the practice as a participant who has so undertaken them.","line":93,"anchor":"t5-3-2","match":"exact"},{"paper":"T5","text":"Provenance is thereby demoted, not discarded","line":93,"anchor":"t5-3-2","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"An externally imposed constraint may later be undertaken. Command alone cannot constitute the uptake."}],"claims":["T5-A2"],"ok":1},{"id":"t5-roots","kind":"concept","label":"二つの根","sub":"normative / grammatical","paper":"T5","band":"participation","core":false,"basis":"text","vis":"public","gloss":"委任のあとに人の側に残るものには、独立した二つの根がある。規範の根（答える席）と、文法の根（参加の席）。答えるが遊んでいない例と、遊んでいるが誰にも答えない例が、独立を示す。","quotes":[{"paper":"T5","text":"What remains on the human side of delegation has two independent roots.","line":111,"anchor":"t5-3-4","match":"exact"},{"paper":"T5","text":"The first is normative, and was isolated earlier in this series: the standing to answer for a judgement does not transfer without legitimate conferral — the answering seat (Tomita 2026a).","line":111,"anchor":"t5-3-4","match":"exact"},{"paper":"T5","text":"delegation presupposes an end external to the activity","line":111,"anchor":"t5-3-4","match":"exact"},{"paper":"T5","text":"the entire first image can be conceded to AI without remainder","line":113,"anchor":"t5-3-4","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"The playing seat and answering seat remain distinct. Where a practice includes an answering relation, reasons may be owed to and asked from participants; participation as such does not entail answerability."}],"ok":1},{"id":"t5-norm","kind":"concept","label":"価格と尊厳","sub":"constructive extension","paper":"T5","band":"later","core":false,"basis":"text","vis":"public","gloss":"定理が示すのは行為者相対的な非代替性まで。尊厳は、そこから直接には導かれない。カントの語彙（交換できるもの／等価物のないもの）を構成的に借りる、別の議論。","quotes":[{"paper":"T5","text":"This is a constructive use of Kant's vocabulary, not an interpretation of Kant's own account of what has dignity","line":167,"anchor":"t5-4-4","match":"exact"}],"records":[{"src":"THEORY_MAP","text":"The theorem establishes the second relation. It does not by itself establish dignity."}],"claims":["T5-N1","T5-N3"],"ok":1},{"id":"t5-visibility","kind":"concept","label":"可視化テーゼ","sub":"interpretive thesis","paper":"T5","band":"later","core":false,"basis":"text","vis":"public","gloss":"AI が機能的に等価な出力を大量に出せるようにすると、結果の等価と、参加者ごとの来歴の違いが目立つようになる、という解釈上の主張。定理の帰結ではない。","quotes":[{"paper":"T5","text":"The visibility thesis is an interpretive thesis: where AI makes functionally equivalent outputs newly available at scale, the distinction between outcome-equivalence and participant-relative history b rmal feature of Kant's distinction — exchangeability versus non-equivalence — rather than claiming that Kant himself classified play or participation as dignity."}],"cited":{"T2":25,"T5":17},"ok":1},{"id":"p-agency","kind":"precursor","label":"主体性の理論","sub":"何でできているか、という問い","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"ground","col":2,"row":0,"members":["Bandura 2001（心理機能）","Emirbayer & Mische 1998（時間の向き）","Zimmerman 2000（自己調整学習）"],"targets":["t3-direction","t3-drive","t3-mode"],"gloss":"T3 が「教育自身の流れ」として挙げる先行の分解。主体性が何でできているかには答えるが、何を渡せるかには答えない、と T3 は書く。T3 は四つ目の捉え方を足すのではなく、同じ素材を、委任できるかという別の面で切り直す。","quotes":[{"paper":"T3","text":"They say what agency is made of, not what may be handed over.","line":21,"anchor":"t3-1","match":"exact"},{"paper":"T3","text":"This article does not add a fourth conception alongside them but cuts on a different axis","line":23,"anchor":"t3-1","match":"exact"},{"paper":"T3","text":"The same material, cut along a different plane, yields different cross-sections","line":37,"anchor":"t3-2-1","match":"exact"}],"records":[],"cited":{"T3":11},"ok":1},{"id":"p-gap","kind":"precursor","label":"多くの手・責任の空隙","sub":"誰が答えるのかが見えにくくなる","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"ground","col":3,"row":0,"members":["Thompson 1980","van de Poel ほか 2015","Matthias 2004"],"targets":["t4-twopath"],"gloss":"関わる手が増えるほど、判断が機械へ移るほど、誰が答えるのかが見えにくくなる、という古典的な診断。T4 は、Sein と Sollen の分解を明示した委譲に限って、逆向き（判断の所在が見える方向）の可能性があると書く。AI の導入一般についての主張ではない、と T4 自身が限定している。","quotes":[{"paper":"T4","text":"さらにこの帰結は，組織の責任をめぐる古典的な診断と逆向きに交差する。","line":144,"anchor":"t4-4-3","match":"exact"},{"paper":"T4","text":"ただし，この逆転はAIの導入一般に成り立つ主張ではない。","line":144,"anchor":"t4-4-3","match":"exact"}],"records":[],"cited":{"T4":5},"ok":1},{"id":"p-kawatani","kind":"precursor","label":"Kawatani 2012","sub":"目覚めた者は盤を降りる","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"ground","col":4,"row":0,"members":["川谷 ik 1984（自律の譲渡不能性）","Kuflik 1999（計算機への権限の移譲）"],"targets":["t3-answer","t5-theorem"],"gloss":"より高い専門性には従ってよいが監督の責任は残り、誰がやったかも大事だ、という骨格を持つ。単独の先行者ではなく、Moor 1979 から続く筋の一員。","quotes":[],"records":[],"cited":{},"ok":1},{"id":"p-suits","kind":"precursor","label":"Schlick・Suits","sub":"遊びと人生の意味","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"thin","col":4,"row":1,"members":["Schlick 1927","Suits 1978"],"targets":["t5-objects"],"gloss":"T5 が定義の装置（Suits）と人生の意味（Schlick）をつなぐ線として引用する。","quotes":[{"paper":"T5","text":"the Schlick–Suits edge, the one that runs through the meaning of life, has to my knowledge not been drawn at all","line":145,"anchor":"t5-4-2","match":"exact"}],"records":[],"cited":{"T5":59},"ok":1},{"id":"p-law","kind":"precursor","label":"法の代理・代表","sub":"誰が誰に代わって行為できるか","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"thick","col":1,"row":2,"members":["民法の代理・委任","Hobbes『リヴァイアサン』16 章","Pitkin『代表の概念』"],"targets":["t2-boundary","t5-roots"],"gloss":"本人・代理人・相手方の三者で、誰が誰に代わって行為でき、その効果が誰に及ぶかを分けてきた蓄積。五本は引用していない（T4 は薬剤師法 24 条などの条文を本文で使う）。","quotes":[],"records":[],"cited":{},"ok":1},{"id":"p-darwall","kind":"precursor","label":"Darwall 2006","sub":"答える相手（二人称）","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"thick","col":2,"row":2,"members":["Darwall 2006"],"targets":["t3-answer","t4-undertake"],"gloss":"二人称の宛先の構造を T3 が借りる。評価的な判断が同じ関係に立つという主張は T3 が加えた拡張で、Darwall の本文にはない、と T3 自身が書いている。","quotes":[{"paper":"T3","text":"From Darwall (2006) we take the structure of second-personal address.","line":100,"anchor":"t3-4-3","match":"exact"}],"records":[],"cited":{"T3":9,"T4":3,"T5":8},"ok":1},{"id":"p-adherence","kind":"precursor","label":"医療のアドヒアランス","sub":"服従から、意味を理解した参加へ","paper":null,"band":null,"core":false,"basis":"reading","vis":"public","layer":"thick","col":3,"row":2,"members":["WHO 2003"],"targets":["t4-adherence"],"gloss":"T4 の出発点。医療で、指示への服従（コンプライアンス）から、患者と医療者の合意に正統性を置く配置（アドヒアラン ,"to":"t2-boundary","type":"states","label":"この区別に沿って走る","basis":"text","vis":"public","note":"","quote":{"paper":"T2","text":"The delegation legitimacy boundary, introduced in Section 1, runs along this distinction.","line":55,"anchor":"t2-2-3","match":"exact"},"ok":1},{"id":"e-assay-bd","from":"t2-assay","to":"t2-boundary","type":"states","label":"位置を測る","basis":"text","vis":"public","note":"","quote":{"paper":"T2","text":"proposes a minimal scoring protocol for locating it within any knowledge-work task","line":13,"anchor":"t2-abstract","match":"exact"},"ok":1},{"id":"e-bd-ans","from":"t2-boundary","to":"t3-answer","type":"states","label":"T2 が導入した関係を受ける","basis":"text","vis":"public","note":"","quote":{"paper":"T3","text":"introduced in prior work as the non-transferable relation in which the warrant of a judgment remains anchored in a particular agent (Tomita, 2026b)","line":90,"anchor":"t3-4-1","match":"exact"},"ok":1},{"id":"e-rate-two","from":"t2-ratelimit","to":"t3-twolayer","type":"states","label":"二人称の場に移る","basis":"text","vis":"public","note":"","quote":{"paper":"T3","text":"When AI accelerates the externalization and combination of knowledge, the rate-limiting processes shift to socialization and internalization (Nonaka & Takeuchi, 1995; Tomita, 2026b) — and socialization, where evaluative commitments are contested and revised between persons, is precisely the second-personal site.","line":152,"anchor":"t3-5-4","match":"exact"},"ok":1},{"id":"e-dir-drive","from":"t3-direction","to":"t3-drive","type":"states","label":"結びつける（設計の推測）","basis":"text","vis":"public","note":"","quote":{"paper":"T3","text":"We propose a design conjecture in three movements: embodied encounter with a problem-holder may contribute to the crystallization of evaluative commitment, and an endorsed direction may then anchor available activation as motivational drive.","line":78,"anchor":"t3-3","match":"exact"},"ok":1},{"id":"e-ans-und","from":"t3-answer","to":"t4-undertake","type":"s does not establish the apparatus's necessity, sufficiency, or causal effect","line":181,"anchor":"t5-4-4","match":"exact"},"ok":1},{"id":"o-t1-t2","from":"h-T1","to":"h-T2","type":"order","label":"読む順","basis":"record","vis":"public","note":"","record":{"src":"THEORY_MAP","text":"For a whole-programme reading, use the order T1 → T2 → T3 → T4 → T5. This is a recommended reading sequence, not a claim that every later paper is logically entailed by its predecessors."},"ok":1},{"id":"o-t2-t3","from":"h-T2","to":"h-T3","type":"order","label":"読む順","basis":"record","vis":"public","note":"","record":{"src":"THEORY_MAP","text":"For a whole-programme reading, use the order T1 → T2 → T3 → T4 → T5. This is a recommended reading sequence, not a claim that every later paper is logically entailed by its predecessors."},"ok":1},{"id":"o-t3-t4","from":"h-T3","to":"h-T4","type":"order","label":"読む順","basis":"record","vis":"public","note":"","record":{"src":"THEORY_MAP","text":"For a whole-programme reading, use the order T1 → T2 → T3 → T4 → T5. This is a recommended reading sequence, not a claim that every later paper is logically entailed by its predecessors."},"ok":1},{"id":"o-t4-t5","from":"h-T4","to":"h-T5","type":"order","label":"読む順","basis":"record","vis":"public","note":"","record":{"src":"THEORY_MAP","text":"For a whole-programme reading, use the order T1 → T2 → T3 → T4 → T5. This is a recommended reading sequence, not a claim that every later paper is logically entailed by its predecessors."},"ok":1},{"id":"s-x-t1","from":"t1-spec","to":"x-t1","type":"stop","label":"止める","basis":"record","vis":"public","note":"","record":{"src":"THEORY_MAP","text":"Easier production does not abolish task-specific specification"},"ok":1},{"id":"l-x-t1","from":"x-t1","to":"rail","type":"slide","label":"能力の話に読み替える","basis":"reading","vis":"public","note":"","ok":1},{"id":"s-x-t2","from":"t2-boundary","to":"x-t2","type":"stop","label":"止める","basis":"record","vis":"public","note":"","record":{" ["t3-1","t3-2-1","t3-5-1"],"node_units":["t3-2-2","t3-3"],"cite_here":false,"ok":1},{"id":"g-p-agency-t3-mode","from":"p-agency","to":"t3-mode","type":"lineage","label":"論文の別の所で引用している","basis":"reading","vis":"public","note":"","cite":true,"cite_units":["t3-1","t3-2-1","t3-5-1"],"node_units":["t3-2-2"],"cite_here":false,"ok":1},{"id":"g-p-gap-t4-twopath","from":"p-gap","to":"t4-twopath","type":"lineage","label":"論文が引用している","basis":"reading","vis":"public","note":"","cite":true,"cite_units":["t4-4-3"],"node_units":["t4-4-3","t4-5-2"],"cite_notes":["b18","b19","b20"],"cite_here":true,"ok":1},{"id":"g-p-kawatani-t5-roots","from":"p-kawatani","to":"t5-roots","type":"lineage","label":"論文が引用している","basis":"reading","vis":"public","note":"","cite":true,"cite_units":["t5-1","t5-3-4","t5-4-1"],"node_units":["t5-3-4"],"cite_here":true,"ok":1},{"id":"g-p-kawatani-t5-apparatus","from":"p-kawatani","to":"t5-apparatus","type":"lineage","label":"論文の別の所で引用している","basis":"reading","vis":"public","note":"","cite":true,"cite_units":["t5-1","t5-3-4","t5-4-1"],"node_units":["t5-4-3","t5-4-4","t5-4-6"],"cite_here":false,"ok":1}],"compressions":[{"id":"c01","wrong":"Specification = specification cost","keep":"Substrate versus task demand for that substrate","papers":["T1"],"basis":"record","src":"THEORY_MAP"},{"id":"c02","wrong":"Specification = prompt quality","keep":"Domain-grounded judgment versus one possible medium of expression","papers":["T1"],"basis":"record","src":"THEORY_MAP"},{"id":"c03","wrong":"AI lowers Ext.cost = AI removes expertise requirements","keep":"Easier production does not abolish task-specific specification","papers":["T1"],"basis":"record","src":"THEORY_MAP"},{"id":"c04","wrong":"Sein = objective and Sollen = subjective","keep":"Factual warrant versus evaluative warrant; both may be contestable","papers":["T2"],"basis":"record","src":"THEORY_MAP"},{"id":"c05","wrong":"Sollen-type specification = external norms","keep":"A practitioner's evaluative judgment versus the normative environment","papers":["T2"],"basis":"record","src":"THEORY_MAP"},{"id":"c06","wrong":"Sollen output = legitimate Sollen judgment","keep":"Generated content versus recognized source of warrant","papers":["T2"],"basis":"record","src":"THEORY_MAP"},{"id":"c07","wrong":"Capability frontier = delegation legitimacy boundary","keep":"What AI can do versus what it may legitimately stand behind","papers":["T2"],"basis":"record","src":"THEORY_MAP"},{"id":"c08","wrong":"Sin = Sein","keep":"Institutionalized normativity versus factual judgment","papers":["T2"],"basis":"record","src":"THEORY_MAP"},{"id":"c09","wrong":"Direction proposal = direction ownership","keep":"Candidate supplied from outside versus commitment taken up as one's own","papers":["T3"],"basis":"record","src":"THEORY_MAP"},{"id":"c10","wrong":"Distributed agency = distributed answerability","keep":"Components may distribute; answerability does not","papers":["T3"],"basis":"record","src":"THEORY_MAP"},{"id":"c11","wrong":"Answerability = accountability","keep":"Non-transferable second-personal standing versus allocable institutional responsibility","papers":["T3"],"basis":"record","src":"THEORY_MAP"},{"id":"c12","wrong":"Answerability = agency","keep":"A relation of address and response versus a family of capacities or components","papers":["T3"],"basis":"record","src":"THEORY_MAP"},{"id":"c13","wrong":"Standing = competence","keep":"Who must answer versus how well that person can answer","papers":["T3"],"basis":"record","src":"THEORY_MAP"},{"id":"c14","wrong":"AI self-explanation = AI standing","keep":"Produced reasons or interpretability evidence do not establish a second-personal relation","papers":["T3"],"basis":"record","src":"THEORY_MAP"},{"id":"c15","wrong":"Jibungoto-ka = psychological ownership or engagement","keep":"A relational undertaking held in answerability versus a measured felt state","papers":["T4"],"basis":"record","src":"THEORY_MAP"},{"id":"c16","wrong":"Undertaking = compliance","keep":"Internal endorsement held toward specific others versus following instructions","papers":["T4"],"basis":"record","src":"THEORY_MAP"},{"id":"c17","wrong":"T5 claims AI cannot play","keep":"T5 makes no such claim; even a genuine AI player's play is its own play — another agent's participation is never mine","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c18","wrong":"Answerability (T3) = participation (T5)","keep":"Two distinct roots: one can answer for an output without having walked the path, and play without answering to anyone","papers":["T3","T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c19","wrong":"Undertaking (T4) = lusory attitude (T5)","keep":"Undertaking is the hinge concept, but T5 does not redescribe organizational undertaking as play","papers":["T4","T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c20","wrong":"Agent-relative fact = an inexpressibly first-person fact","keep":"T5 uses Nagel's terminology derivatively; A can be named in the third person, but substituting B changes the fact","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c21","wrong":"Moral-luck footnote = a solution to moral luck or a theory of desert","keep":"The footnote proposes limiting effects on recognition of standing, while leaving performance appraisal open","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c22","wrong":"Non-transferability theorem = dignity","keep":"The theorem establishes agent-relative non-substitutability; dignity requires a separate constructive normative argument","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c23","wrong":"Functional equivalence = Kantian equivalence in value","keep":"Outcome equivalence relative to a task differs from semantic non-substitutability and from equivalence in value","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c24","wrong":"Dignity = standing = face = appraisal respect","keep":"Basic normative status, relational position, interactional social value, and graded assessment of excellence","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c25","wrong":"Playing seat = answering seat","keep":"Participation and answerability are independent; a practice may connect them without making them identical","papers":["T3","T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c26","wrong":"Visibility thesis = theorem","keep":"The visibility thesis is an interpretive claim, not an analytic consequence","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c27","wrong":"Apparatus thesis = demonstrated causal mechanism","keep":"It is a sociological hypothesis; the historical case establishes compatibility and offers a candidate mechanism only","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c28","wrong":"Performance score = participant standing","keep":"Outcomes may be scored; such scores do not measure standing or authenticity of undertaking","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c29","wrong":"External constraint = absence of undertaking","keep":"External constraints may be undertaken; command alone cannot constitute uptake","papers":["T4","T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c30","wrong":"Dignity apparatus = management technique","keep":"Scoring the authenticity of individuals' play or commanding enjoyment is excluded by the framework's own criterion","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c31","wrong":"T5 = substitution theory (\"games replace work/care as meaning\")","keep":"T5 claims one value was never transferable, not that play should replace other goods","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c32","wrong":"The series = \"play is the last human stronghold\"","keep":"T1–T5 identify different kinds of non-transferables, not a residual domain where humans hide","papers":["T1","T2","T3","T4","T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c33","wrong":"T3 permits one-way interrogation; only T4 requires reciprocity","keep":"T3 §5.4 makes the educator answerable too; T4 develops an organizational two-pathway implementation. Reciprocal obligations do not require identical roles","papers":["T3","T4"],"basis":"record","src":"THEORY_MAP"},{"id":"c34","wrong":"Reverse pathway = suggestion box","keep":"Reasons must be returned for adoption, deferral, or termination; collection alone is not the pathway","papers":["T4"],"basis":"record","src":"THEORY_MAP"},{"id":"c35","wrong":"知好楽の「楽」 = pleasant mood = dignity","keep":"T5 reads lucid absorption; neither pleasure nor non-substitutability alone establishes dignity","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c36","wrong":"Shibusawa's shumi = hobby only","keep":"T5 selects the ideal-bearing aspect of a polysemous usage; no one-to-one Kantian classification","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c37","wrong":"Play as specimen = all activities are games","keep":"Formal theorem (§3.1), first-person corollary (§3.5), and application limits (§4.6) remain distinct","papers":["T5"],"basis":"record","src":"THEORY_MAP"},{"id":"c38","wrong":"AI-Assisted = AI-Accelerated","keep":"T1–T3 examine AI assisting individual work; T4 examines AI accelerating the organizational system","papers":["T4"],"basis":"record","src":"THEORY_MAP"}],"claims":[{"id":"T5-A1","status":"analytic theorem (paper's classification)","claim":"Another agent can realise the goal state without thereby making it true that A pursued that goal under constitutive constraints A accepted as reasons. The formal theorem concerns games.","section":"3.1","source_quote":"But the fact that A pursued p under R, with the constraints accepted as reasons, does not thereby obtain; and no further performance by the other agent can make it obtain, because A's having played is not a causal consequence of p that a sufficiently capable agent could also bring about.","not_claimed":["AI cannot play or have moral status.","The theorem alone establishes dignity.","Every contribution to an activity must be performed unaided."],"line":79},{"id":"T5-T1","status":"terminological attribution and derivative use (v3 clarification)","claim":"T5 attributes agent-relative reasons to Nagel following Parfit, then explicitly uses the term derivatively for the non-substitutability of a participation fact. The indispensable reference is to A, not to a first-person pronoun.","section":"3.1","source_quote":"Following Parfit's terminology (1984), Nagel (1986, pp. 152–153) calls a reason agent-relative when its general form includes an essential reference to the person who has it. The participation-based reason at issue here has that form: its content refers essentially to A's own participation, not merely to the realisation of p. I use *agent-relative* derivatively for the theorem's non-substitutability: the corresponding participation fact must identify A, because replacing A with B yields a different fact.","not_claimed":["Nagel directly theorises T5's participation facts.","Every reason to play is agent-relative.","The fact cannot be described in the third person."],"line":81},{"id":"T5-A2","status":"criterion proposed and used by the paper (not a separate proven theorem)","claim":"Undertaking concerns the agent taking the goal and constraints as reasons and being treated accordingly by the practice. Causal provenance and design documents are proxies in the current use-context, not the criterion.","section":"3.2","source_quote":"The dividing line is not where the goal came from but what happened to it on arrival: whether the goal and its constraints are undertaken by the agent as the agent's own reasons — and, on the side that can be observed, whether the agent is treated by the practice as a participant who has so undertaken them.","not_claimed":["External origin of rules rules out later uptake.","Private inner experience is the proposed test.","Any institutional label is by itself sufficient proof of undertaking."],"line":93},{"id":"T5-A3","status":"scope clarification","claim":"The theorem is independent of the status of AI. Another genuine player's participation is still not A's. The playing seat and answering seat are distinct.","section":"3.3","source_quote":"The theorem is agent-relative, and agent-relativity is untouched by every possible outcome of the status debate.","not_claimed":["Human biological status is the theorem's premise.","Task superiority makes someone's participation interchangeable."],"line":103},{"id":"T5-A4","status":"first-person corollary and scope limitation","claim":"Section 3.1 is formally about games; Section 3.5 generalises its structure where the agent's end includes their own performance. Application remains bounded by §4.6.","section":"4.4","source_quote":"The formal theorem in Section 3.1 concerns games. Section 3.5 states a first-person corollary that generalises its structure to activities in which the agent's end includes the agent's own performance.","not_claimed":["All activities are games.","All work should be treated as play.","Safety and reproducibility constraints should be removed to protect personal participation.","Play is merely the opposite domain to work, or selecting it as a specimen universalises the formal theorem."],"line":179},{"id":"T5-N1","status":"constructive normative extension","claim":"T5 distinguishes the theorem's agent-relative non-substitutability from Kantian equivalence in value. Using the latter vocabulary is a further normative step, not a result of the theorem alone.","section":"4.4","source_quote":"The theorem establishes that the participation fact is agent-relative and non-substitutable. It does not by itself establish dignity. The further normative claim is that, once an agent's undertaking is treated as reason-bearing — the criterion of Section 3.2 — functionally equivalent outcomes cannot exhaust what is owed in recognising that agent.","not_claimed":["Semantic non-identity is identical to Kant's criterion of value.","Kant himself classifies play or participation as dignity.","The theorem proves the separate normative extension.","Delight in the Analects triad is mere positive mood, or feeling pleasure establishes dignity.","Shibusawa's shumi means hobby alone, or its entire usage maps to one Kantian category."],"line":171},{"id":"T5-N2","status":"constructive recognition model","claim":"The apparatus makes recognition of standing socially operative while leaving performance open to appraisal. Dignity, standing, face, and appraisal respect remain distinct; participation alone does not entail answerability.","section":"4.4","source_quote":"The apparatus secures a recognition floor while leaving performance open to appraisal.","not_claimed":["The apparatus confers or revokes Kantian dignity.","Game scores or performance evaluation are prohibited.","Public stature and institutional standing are interchangeable.","Every player must answer to a questioner."],"line":175},{"id":"T5-N3","status":"bounded institutional analogy (v3 moral-luck footnote)","claim":"The moral-luck footnote concerns allowing uncontrolled outcomes or constitutive traits to alter the recognition floor. Kant AA 4:394 concerns good will retaining worth under adverse fortune; AA 4:434–435 concerns price/dignity. The note proposes limiting effects on standing, not solving moral luck or developing a theory of desert.","section":"4.4","source_quote":"The requirement that the recognition floor be insensitive to outcome is an institutional analogue of the problem of moral luck (Williams 1981; Nagel 1979). Allowing that floor to vary with outcomes beyond the participant's control would introduce luck in how things turn out, commonly termed resultant luck; allowing it to vary with constitutive traits such as temperament would introduce constitutive luck. The analogy with Kant is that a good will retains its full worth even when adverse fortune prevents it from achieving its end (AA 4:394). I do not attempt to resolve moral luck here; the apparatus thesis proposes one way practices can limit its effects on standing, not a theory of desert.","not_claimed":["Nagel coined the phrase resultant luck.","T5 solves moral luck.","Results may never be appraised.","Kant defines price versus dignity at AA 4:394."],"line":175},{"id":"T5-I1","status":"interpretive thesis","claim":"AI making functionally equivalent outputs available at scale can be read as making outcome-equivalence versus participant-relative history salient. This is not entailed by the theorem.","section":"4.4","source_quote":"The visibility thesis is an interpretive thesis: where AI makes functionally equivalent outputs newly available at scale, the distinction between outcome-equivalence and participant-relative history becomes salient.","not_claimed":["The theorem proves public reaction to AI.","Visibility is a measured universal causal effect."],"line":181},{"id":"T5-S1","status":"sociological hypothesis","claim":"Where standing has been tied to scarce excellence, public exposure of output substitutability may be experienced as humiliation unless recognition is not exhausted by comparative performance.","section":"4.4","source_quote":"The apparatus thesis is a sociological hypothesis: where standing has been strongly tied to scarce excellence, the resulting public exposure of one's output as substitutable may be experienced as humiliation unless institutions provide forms of recognition not exhausted by comparative performance.","not_claimed":["The hypothesis has been demonstrated causally.","A dignity apparatus is necessary or sufficient for social stability.","The framework prescribes engagement scoring or forced enjoyment."],"line":181},{"id":"T5-H1","status":"historical case with limited evidential role","claim":"The shogi case illustrates compatibility and offers a candidate mechanism; it does not establish necessity, sufficiency, or causal effect. Lee Sedol's individual exit is not Go culture's exit.","section":"4.4","source_quote":"the his
