torical case demonstrates compatibility and offers a candidate mechanism; it does not establish the apparatus's necessity, sufficiency, or causal effect.","not_claimed":["The apparatus caused shogi's commercial success.","Go culture ceased to exist.","The case is a controlled comparison between matched populations."],"line":181}],"views":[{"id":"chain","label":"連鎖","groups":["core"],"caption":"AI が外化のコストを下げると、仕様（判断の基質）が見えるようになる（T1）。仕様の内側を Sein 型と Sollen 型に分けると、能力とは別に、正統性の境界が現れる（T2）。その境界の根は、成分ではなく、答える立場という関係にある（T3）。この関係を組織に移すと、生成 AI が知識の外化と結合を加速するほど、引き受けと身体化が律速段階になる（T4）。最後に、逆の向きから問いを立て、任せることが可能で正統な場合でも、参加の事実は移らないことを示す（T5）。点線の矢印は読む順で、後の論文が前の論文から論理的に導かれるという主張ではない。","ok":1},{"id":"slide","label":"取り違えやすい所","groups":["core","slide"],"caption":"各論文の区別が止めている取り違えを、一つずつ置いた。THEORY_MAP の「誤った圧縮」の表から選んだ行で、T 字の線は、その区別が止めている行を指す。五つのうち四つは「どちらが上手いか」という能力の軸への読み替えで、T4 の例は、関係を、確認できる代わりの物に置き換える型。どの行を選び、行き先をどうまとめるかは、地図の解釈。","ok":1},{"id":"lineage","label":"先行研究","groups":["core","lineage"],"caption":"五本が立てた区別（切れ目）は、別々の目的で、先に立てられていた。先行する研究と先人を、四つに分けて置いている。一つ目は、各論文が本文で名指しする分野の土台と相手（組み替える素材、借りる区別、答える相手）。残りの三つは、同じ切れ目を先に示した筋で、機械に対する細い筋、人から人への太い体系、人と機械の役割分担を扱う研究。実線の枠は論文が引用している先行者、破線の枠は、引用していないが同じ切れ目を先に示した先行者。破線は「響き合う」ことを示し、五本がそれで説明できるという意味ではない。分け方は解釈。","ok":1}],"inside":{"T1":{"tiers":[{"id":"t1-abstract","no":"","title":"Abstract","line":12,"units":["t1-abstract"]},{"id":"t1-1","no":"1","title":"Introduction","line":24,"units":["t1-1"]},{"id":"t1-2","no":"2","title":"Conceptual Framework","line":46,"units":["t1-2-1","t1-2-2","t1-2-3","t1-2-4"]},{"id":"t1-3","no":"3","title":"Case Study","line":97,"units":["t1-3","t1-3-1","t1-3-2","t1-3-3","t1-3-4"]},{"id":"t1-4","no":"4","title":"Methods","line":149,"units":["t1-4","t1-4-1","t1-4-2","t1-4-3","t1-4-4"]},{"id":"t1-5","no":"5","title":"Discussion","line":207,"units":["t1-5-1","t1-5-2","t1-5-3","t1-5-4","t1-5-5","t1-5-6"]},{"id":"t1-6","no":"6","title":"Conclusion","line":299,"units":["t1-6","t1-the-phd-as-specification-training","t1-observed-diffusion-and-framework-derived-conjectures","t1-urgency","t1-closing"]},{"id":"t1-postscript-a-general-form-of-domain-native-development","no":"","title":"Postscript: A general form of domain-native development","line":333,"units":["t1-postscript-a-general-form-of-domain-native-development"]}],"units":[{"id":"t1-abstract","tier":"t1-abstract","no":"","title":"Abstract","intro":false,"line_start":12,"line_end":17,"paras":1,"size":226,"first":{"text":"When experienced professionals retire, organisations lose not their documented procedures but the accumulated judgement that determines how those procedures are applied.","line":14,"cut":false}},{"id":"t1-1","tier":"t1-1","no":"1","title":"Introduction","intro":false,"line_start":24,"line_end":45,"paras":9,"size":709,"first":{"text":"In knowledge-intensive industries, the retirement of senior practitioners creates a distinctive form of organisational loss.","line":26,"cut":false}},{"id":"t1-2-1","tier":"t1-2","no":"2.1","title":"Two-component decomposition","intro":false,"line_start":48,"line_end":63,"paras":7,"size":651,"first":{"text":"When domain knowledge is converted into a formal artefact—a software application, a technical document, an analytical tool—two categories of cost are incurred.","line":50,"cut":false}},{"id":"t1-2-2","tier":"t1-2","no":"2.2","title":"The distillation model of authorship","intro":false,"line_start":64,"line_end":71,"paras":3,"size":263,"first":{"text":"The relationship between human expertise and AI processing can be modelled as a distillation process.","line":66,"cut":false}},{"id":"t1-2-3","tier":"t1-2","no":"2.3","title":"Positioning among existing frameworks","intro":false,"line_start":72,"line_end":88,"paras":4,"size":250,"first":{"text":"The externalisation cost / specification cost distinction is not the first two-component decomposition proposed for AI-era knowledge work.","line":74,"cut":false}},{"id":"t1-2-4","tier":"t1-2","no":"2.4","title":"Applicability conditions","intro":false,"line_start":89,"line_end":96,"paras":2,"size":182,"first":{"text":"The substantial reduction in externalisation cost observed in domain-native development applies primarily to individual or small-team production in exploratory phases.","line":91,"cut":false}},{"id":"t1-3","tier":"t1-3","no":"3","title":"Case Study","intro":true,"line_start":97,"line_end":104,"paras":3,"size":228,"first":{"text":"The following case is positioned as a revelatory case study (Yin, 2018)—selected not for prevalence but for its capacity to make observable a phenomenon that the framework predicts but that has not been empirically documented at the level of individual design ","line":99,"cut":true}},{"id":"t1-3-1","tier":"t1-3","no":"3.1","title":"Specification cost as the determinant of design","intro":false,"line_start":105,"line_end":118,"paras":6,"size":483,"first":{"text":"Four categories of design decisions illustrate how domain knowledge, rather than prompt engineering skill, governed application quality.","line":107,"cut":false}},{"id":"t1-3-2","tier":"t1-3","no":"3.2","title":"Reversal of the translation direction","intro":false,"line_start":119,"line_end":126,"paras":3,"size":190,"first":{"text":"Conventional knowledge-to-product workflows follow a linear path: the domain expert writes natural-language requirements, which a software engineer interprets and implements.","line":121,"cut":false}},{"id":"t1-3-3","tier":"t1-3","no":"3.3","title":"Exploratory value of reduced externalisation cost","intro":false,"line_start":127,"line_end":138,"paras":5,"size":303,"first":{"text":"The primary value of reduced externalisation cost may not be the efficiency of producing finished products, but the increased number of exploratory attempts that become feasible when creation cost is low.","line":129,"cut":false}},{"id":"t1-3-4","tier":"t1-3","no":"3.4","title":"Two identification points","intro":false,"line_start":139,"line_end":148,"paras":3,"size":78,"first":{"text":"The case study yields two observations that the Discussion will generalise:","line":141,"cut":false}},{"id":"t1-4","tier":"t1-4","no":"4","title":"Methods","intro":true,"line_start":149,"line_end":152,"paras":1,"size":36,"first":{"text":"The preceding case narrative and the Discussion that follows draw on three categories of evidence: the dialogue logs generated during AI-assisted development, the outputs of a domain-ablation experiment, and the published dataset.","line":151,"cut":false}},{"id":"t1-4-1","tier":"t1-4","no":"4.1","title":"Dialogue logs as cognitive records","intro":false,"line_start":153,"line_end":160,"paras":3,"size":238,"first":{"text":"The methodological contribution of this study lies not in the application itself but in the dialogue logs generated during its development.","line":155,"cut":false}},{"id":"t1-4-2","tier":"t1-4","no":"4.2","title":"Domain-ablation experiment","intro":false,"line_start":161,"line_end":194,"paras":8,"size":606,"first":{"text":"To illustrate the framework's prediction that specification cost cannot be substituted by externalisation cost alone, a domain-ablation experiment was conducted.","line":163,"cut":false}},{"id":"t1-4-3","tier":"t1-4","no":"4.3","title":"Data availability","intro":false,"line_start":195,"line_end":198,"paras":1,"size":127,"first":{"text":"Three data layers are deposited on figshare (Nature Portfolio's recommended repository): the charging infrastructure dataset (583 × 21 CSV; one field—installation date, collected through independent research—is withheld from the public release), the ablation e","line":197,"cut":true}},{"id":"t1-4-4","tier":"t1-4","no":"4.4","title":"AI use disclosure","intro":false,"line_start":199,"line_end":206,"paras":2,"size":165,"first":{"text":"In accordance with Springer Nature's policy on AI-assisted writing, the following disclosure is provided.","line":201,"cut":false}},{"id":"t1-5-1","tier":"t1-5","no":"5.1","title":"Theoretical positioning: the visibility thesis","intro":false,"line_start":209,"line_end":226,"paras":8,"size":658,"first":{"text":"Section 3 demonstrated two identification points: that prototype-as-specification constitutes a structural mechanism for reducing externalisation cost (identification point 1), and that reduced externalisation cost increases the rate of exploratory attempts wh","line":211,"cut":true}},{"id":"t1-5-2","tier":"t1-5","no":"5.2","title":"Domain knowledge as the substance of specification cost","intro":false,"line_start":227,"line_end":238,"paras":5,"size":303,"first":{"text":"If externalisation cost is what AI reduces, specification cost is what determines output quality under the new cost structure.","line":229,"cut":false}},{"id":"t1-5-3","tier":"t1-5","no":"5.3","title":"Non-functional requirements and the responsibility boundary","intro":false,"line_start":239,"line_end":250,"paras":5,"size":402,"first":{"text":"Domain-native development reduces externalisation cost for domain-aligned functionality—the features and design decisions that directly reflect the expert's knowledge.","line":241,"cut":false}},{"id":"t1-5-4","tier":"t1-5","no":"5.4","title":"Methodological contribution of dialogue logs","intro":false,"line_start":251,"line_end":260,"paras":4,"size":215,"first":{"text":"The dialogue logs generated through AI-assisted development constitute a methodological contribution independent of the present framework.","line":253,"cut":false}},{"id":"t1-5-5","tier":"t1-5","no":"5.5","title":"Cumulative optimisation risk and educational implications","intro":false,"line_start":261,"line_end":280,"paras":10,"size":518,"first":{"text":"**Risk.** Extended use of a single AI system creates a risk of cognitive lock-in.","line":263,"cut":false}},{"id":"t1-5-6","tier":"t1-5","no":"5.6","title":"Safety considerations and limitations","intro":false,"line_start":281,"line_end":298,"paras":7,"size":876,"first":{"text":"The effectiveness of AI as a cognitive environment carries direct safety implications.","line":283,"cut":false}},{"id":"t1-6","tier":"t1-6","no":"6","title":"Conclusion","intro":true,"line_start":299,"line_end":302,"paras":1,"size":108,"first":{"text":"This paper introduced the mekiki framework, which identifies two conditions governing whether tacit knowledge can be successfully converted into formal artefacts: externalisation cost (the technical barriers to articulating and implementing knowledge, correspo","line":301,"cut":true}},{"id":"t1-the-phd-as-specification-training","tier":"t1-6","no":"","title":"The PhD as specification training","intro":false,"line_start":303,"line_end":310,"paras":3,"size":189,"first":{"text":"The framework permits a structural redescription of doctoral training.","line":305,"cut":false}},{"id":"t1-observed-diffusion-and-framework-derived-conjectures","tier":"t1-6","no":"","title":"Observed diffusion and framework-derived conjectures","intro":false,"line_start":311,"line_end":316,"paras":2,"size":247,"first":{"text":"The specification/externalisation dynamic is observable across domains at varying stages of AI integration.","line":313,"cut":false}},{"id":"t1-urgency","tier":"t1-6","no":"","title":"Urgency","intro":false,"line_start":317,"line_end":322,"paras":2,"size":186,"first":{"text":"The framework's practical value is proportional to the speed at which it reaches practitioners.","line":319,"cut":false}},{"id":"t1-closing","tier":"t1-6","no":"","title":"Closing","intro":false,"line_start":323,"line_end":332,"paras":3,"size":197,"first":{"text":"Naming a phenomenon is the precondition for managing it.","line":325,"cut":false}},{"id":"t1-postscript-a-general-form-of-domain-native-development","tier":"t1-postscript-a-general-form-of-domain-native-development","no":"","title":"Postscript: A general form of domain-native development","intro":false,"line_start":333,"line_end":344,"paras":4,"size":230,"first":{"text":"The case study presented in this paper documents a *special form* of domain-native development: one in which specification cost was not pre-existing but was acquired and refined through AI dialogue itself.","line":335,"cut":false}}],"refs":[{"from":"t1-2-1","to":"t1-5-6","to_no":"5.6","line":62,"text":"life experience, and the finite embodied perspective of the knower—structurally correspond to the dimension Polanyi bracketed and to what Nonaka and Takeuchi later termed Wisdom (see Section 5.6, Future directions).","cut":true,"dir":"fwd"},{"from":"t1-2-2","to":"t1-4","to_no":"4","line":68,"text":"Conversely, identical distillation conditions applied through different apparatus (different AI models) produce outputs that converge on the same structural features, as the ablation experiment in Section 4 demonstrates.","cut":false,"dir":"fwd"},{"from":"t1-2-3","to":"t1-4","to_no":"4","line":85,"text":"existing model, (b) connects to an established knowledge management tradition via Nonaka's SECI, and (c) generates directional predictions illustrated through domain-ablation experiment (Section 4).","cut":true,"dir":"fwd"},{"from":"t1-2-3","to":"t1-4","to_no":"4","line":87,"text":"Section 4 provides supporting evidence for this prediction.^[The pattern of independent discovery across disciplines is itself informative.","cut":false,"dir":"fwd"},{"from":"t1-2-4","to":"t1-5-1","to_no":"5.1","line":91,"text":"Social and psychological barriers to knowledge sharing (cf. Edmondson, 1999), while relevant to organisational knowledge flows, constitute a distinct phenomenon outside the present framework's scope—though their role as an identification condition is examined in Section 5.1.","cut":false,"dir":"fwd"},{"from":"t1-3-1","to":"t1-4","to_no":"4","line":109,"text":"In the domain-ablation experiment (Section 4), neither AI model operating without this domain knowledge included current-based fields.","cut":false,"dir":"fwd"},{"from":"t1-3-1","to":"t1-2-1","to_no":"2","line":117,"text":"They instantiate specification cost as defined in Section 2.","cut":false,"dir":"back"},{"from":"t1-3-3","to":"t1-5-3","to_no":"5.3","line":137,"text":"This asymmetry is examined in Section 5.3.","cut":false,"dir":"fwd"},{"from":"t1-5-1","to":"t1-3","to_no":"3","line":211,"text":"Section 3 demonstrated two identification points: that prototype-as-specification constitutes a","cut":true,"dir":"back"},{"from":"t1-5-1","to":"t1-3","to_no":"3","line":219,"text":"cost drops dramatically (eight-minute implementation episodes, zero-iteration specification transfer), while specification cost persists unchanged (the design decisions catalogued in Section 3 required the same domain knowledge regardless of the implementation medium).","cut":true,"dir":"back"},{"from":"t1-5-1","to":"t1-4-2","to_no":"4.2","line":221,"text":"The domain-ablation experiment (Section 4.2) provides the identification step.","cut":false,"dir":"back"},{"from":"t1-5-1","to":"t1-2-1","to_no":"2","line":223,"text":"economics (Agrawal et al., 2018), cognitive science (Subramonyam et al., 2024), interaction design (Terry et al., 2023), and knowledge management (Böhm & Durst, 2026), as documented in Section 2, constitutes convergent evidence for the universality of the underlying structure.","cut":true,"dir":"back"},{"from":"t1-5-1","to":"t1-5-6","to_no":"5.6","line":225,"text":"In the present case, both subcomponents were simultaneously reduced: technical conversion barriers by AI-mediated dialogue, and interpersonal risk perception by the author's low emotional responsiveness profile (Section 5.6).","cut":false,"dir":"fwd"},{"from":"t1-5-2","to":"t1-3-1","to_no":"3.1","line":229,"text":"The case study's design decisions (Section 3.1) provide direct evidence: each reflects domain knowledge that could not have been generated by prompt engineering technique, however sophisticated.","cut":false,"dir":"back"},{"from":"t1-5-3","to":"t1-3-3","to_no":"3.3","line":247,"text":"The asymmetry identified in Section 3.3 is structural.","cut":false,"dir":"back"},{"from":"t1-urgency","to":"t1-1","to_no":"1","line":319,"text":"The three researchers introduced in Section 1 exemplify this asymmetry: the retiring specialist's specification capacity is irreversibly depleting, while the junior researcher's externalisation cost reduction tools await specification that only the specialist can provide.","cut":false,"dir":"back"}],"figs":[{"kind":"table","no":1,"label":"Table 1","caption":"Table 1: Existing two-component frameworks and their relationship to the present model","line":76,"anchor":"t1-2-3","unit":"t1-2-3","omitted":false,"match":"exact"},{"kind":"table","no":2,"label":"Table 2","caption":"Table 2: Convergent deficiency patterns in domain-ablation experiment","line":170,"anchor":"t1-4-2","unit":"t1-4-2","omitted":false,"match":"exact"},{"kind":"figure","no":1,"label":"Figure 1","caption":"Figure 1. The mekiki framework as a pathway model within the SECI model.","line":421,"anchor":"t1-figure-1","unit":"t1-2-1","omitted":true,"match":"normalized"},{"kind":"figure","no":2,"label":"Figure 2","caption":"Figure 2. The distillation model of authorship under the mekiki framework.","line":427,"anchor":"t1-figure-2","unit":"t1-2-2","omitted":true,"match":"normalized"}],"parts":[{"id":"t1-abstract-p1","unit":"t1-abstract","k":1,"lines":[14,14],"label":"要旨","does":"まとめ","says":"退職で失われるのは手順ではなく、手順の当てはめ方を決める判断である。暗黙知を形にできるかを左右する二つの条件（外化のコストと仕様化のコスト）を挙げる。AI のもとで前者は大きく下がり、後者は変わらずに残ることを、一つの事例研究で示す。実験は、二つの成分が分けられることを支える証拠として置かれている。","quote":{"paper":"T1","text":"organisations lose not their documented procedures but the accumulated judgement that determines how those procedures are applied","line":14,"anchor":"t1-abstract","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-1-p1","unit":"t1-1","k":1,"lines":[26,26],"label":"失われるのは判断","does":"枠","says":"知識集約型の産業で退職が奪うのは、文書にできる手順ではなく、蓄積された判断である。","quote":{"paper":"T1","text":"What disappears is not procedural knowledge","line":26,"anchor":"t1-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-1-p2","unit":"t1-1","k":2,"lines":[28,36],"label":"三人の研究者","does":"例","says":"同じ研究所の三人を並べる。置かれた条件は同じで、違ったのは専門知と課題との関係だった。","quote":{"paper":"T1","text":"What differed was the relationship between their domain expertise and the task at hand.","line":36,"anchor":"t1-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-1-p3","unit":"t1-1","k":3,"lines":[38,38],"label":"まだ名前のない型","does":"位置づけ","says":"制約になるのは実装の技能ではなく分野の知識、という型は各分野で観察されている。ただし、体系的には特徴づけられていない。","quote":{"paper":"T1","text":"has been observed across multiple fields but has not been systematically characterised","line":38,"anchor":"t1-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-1-p4","unit":"t1-1","k":4,"lines":[40,40],"label":"この論文がすること","does":"枠","says":"専門家が AI を翻訳の媒体にして直接つくる開発（DND）を定義し、二成分の枠組みを一つの事例と実験で示す。","quote":{"paper":"T1","text":"as the direct production of functional artefacts by domain experts using AI as a translation medium","line":40,"anchor":"t1-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-1-p5","unit":"t1-1","k":5,"lines":[42,42],"label":"窓は閉じつつある","does":"含意","says":"退職する専門家が AI との対話で判断を外に出せる期間は有限で、そのための語彙が先に要る。","quote":{"paper":"T1","text":"is finite and closing","line":42,"anchor":"t1-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-1-p1","unit":"t1-2-1","k":1,"lines":[50,50],"label":"二つのコスト","does":"枠","says":"分野の知識を形のある成果物に変えるとき、二種類のコストがかかる。","quote":{"paper":"T1","text":"two categories of cost are incurred","line":50,"anchor":"t1-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-1-p2","unit":"t1-2-1","k":2,"lines":[52,52],"label":"外化のコスト","does":"定義","says":"外化のコストは、暗黙知を明示的な形に直すときの技術的な障壁。","quote":{"paper":"T1","text":"denotes the technical barriers to converting tacit knowledge into explicit, formal representations","line":52,"anchor":"t1-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-1-p3","unit":"t1-2-1","k":3,"lines":[54,54],"label":"仕様化のコスト","does":"定義","says":"仕様化のコストは、何を作るべきかを決めるのに要る専門知から生じる障壁。専門知は実践者が持つ資源で、コストは課題がそれをどれだけ要求するかの度合い。","quote":{"paper":"T1","text":"specification cost is the degree to which a task demands domain expertise","line":54,"anchor":"t1-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-1-p4","unit":"t1-2-1","k":4,"lines":[56,60],"label":"従来は分けられない","does":"主張","says":"従来の条件では、二つのコストは絡み合っていて分けられない。この分解を目利きの枠組みと名付ける。","quote":{"paper":"T1","text":"these two cost components are entangled and inseparable","line":56,"anchor":"t1-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-1-p5","unit":"t1-2-1","k":5,"lines":[62,62],"label":"系譜","does":"位置づけ","says":"Polanyi から野中へ続く系譜の中に、この枠組みを置く。野中の外化の中に、二つの条件を見分ける。","quote":{"paper":"T1","text":"The framework operates within a lineage that runs from Polanyi through Nonaka to the present analysis.","line":62,"anchor":"t1-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-2-p1","unit":"t1-2-2","k":1,"lines":[66,66],"label":"蒸留のモデル","does":"定義","says":"人と AI の関係を蒸留にたとえる。素材は集合知、装置は AI、蒸留の条件は専門家が決める。","quote":{"paper":"T1","text":"can be modelled as a distillation process","line":66,"anchor":"t1-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-2-p2","unit":"t1-2-2","k":2,"lines":[68,70],"label":"著者性は条件の設定","does":"主張","says":"このモデルでは、著者性は、装置を動かすことではなく、蒸留の条件を定めることにある。蒸留が一回で終わることは少なく、条件を直しながら繰り返す。","quote":{"paper":"T1","text":"authorship resides in the setting of distillation conditions, not in the operation of the apparatus","line":68,"anchor":"t1-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-3-p1","unit":"t1-2-3","k":1,"lines":[74,85],"label":"四つの独立した分解","does":"位置づけ","says":"二成分の分解はこれが最初ではない。経済学、認知科学、インタラクション設計、知識経営の四つと並べて、この枠組みの位置を示す。","quote":{"paper":"T1","text":"is not the first two-component decomposition proposed for AI-era knowledge work","line":74,"anchor":"t1-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-3-p2","unit":"t1-2-3","k":2,"lines":[87,87],"label":"方向つきの予測","does":"予測","says":"仕様化のコストが高い分野では、専門家が関わらずに AI を導入しても、AI の外化の力にかかわらず、分野に適した出力は作れない、と枠組みは予測する。","quote":{"paper":"T1","text":"AI deployment without domain expert involvement will fail to produce domain-appropriate outputs","line":87,"anchor":"t1-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-4-p1","unit":"t1-2-4","k":1,"lines":[91,91],"label":"当てはまる範囲","does":"限定","says":"外化のコストが大きく下がるのは、主に個人や小さなチームの、探索の段階での話である。組織の調整にかかるコストは別に残る。","quote":{"paper":"T1","text":"applies primarily to individual or small-team production in exploratory phases","line":91,"anchor":"t1-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-2-4-p2","unit":"t1-2-4","k":2,"lines":[93,93],"label":"単位は成分の比","does":"定義","says":"分析の単位は課題そのものではなく、一つの課題の中での二成分の比である。","quote":{"paper":"T1","text":"The appropriate unit of analysis is not the task but the","line":93,"anchor":"t1-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-p1","unit":"t1-3","k":1,"lines":[99,101],"label":"啓示的な一例","does":"手続き","says":"よくある例だからではなく、設計判断の水準で現象を観察できることを理由に選んだ一例。プログラミング経験のない研究者が、EV 充電の検索アプリを作って公開した。","quote":{"paper":"T1","text":"selected not for prevalence but for its capacity to make observable a phenomenon that the framework predicts","line":99,"anchor":"t1-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-p2","unit":"t1-3","k":2,"lines":[103,103],"label":"時間の配分","does":"根拠","says":"AI がコードを生成した時間は全体の約 5%。設計の議論と仕様の検討が約 40% を占めた。","quote":{"paper":"T1","text":"Actual AI code generation accounted for approximately 5% of total working time.","line":103,"anchor":"t1-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-1-p1","unit":"t1-3-1","k":1,"lines":[107,113],"label":"知識が決めた設計","does":"根拠","says":"電流を基準にしたデータの設計、条件つきの表示の抑制、事業者の区別。質を左右したのはプロンプトの技術ではなく、分野の知識だった。","quote":{"paper":"T1","text":"illustrate how domain knowledge, rather than prompt engineering skill, governed application quality","line":107,"anchor":"t1-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-1-p2","unit":"t1-3-1","k":2,"lines":[115,115],"label":"採らなかったもの","does":"根拠","says":"おそらく最も強い証拠は、意図して入れなかったものの側にある。","quote":{"paper":"T1","text":"lies in what the application deliberately excludes","line":115,"anchor":"t1-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-1-p3","unit":"t1-3-1","k":3,"lines":[117,117],"label":"定義の実例","does":"まとめ","says":"これらの判断は著者の分野の知識から出ている。§2 で定義した仕様化のコストの実例にあたる。","quote":{"paper":"T1","text":"They instantiate specification cost as defined in Section 2.","line":117,"anchor":"t1-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-2-p1","unit":"t1-3-2","k":1,"lines":[121,123],"label":"試作が仕様になる","does":"主張","says":"従来は専門家が要求を文章で書き、技術者が解釈して実装した。この事例では順序が逆になり、動く試作そのものが仕様になった。","quote":{"paper":"T1","text":"producing functional code that served as the specification itself","line":123,"anchor":"t1-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-2-p2","unit":"t1-3-2","k":2,"lines":[125,125],"label":"仕様が先の一場面","does":"根拠","says":"仕様書と試作を先に用意した場面では、実装は短い時間で終わった。ただし外化のコストの低下は自動ではなく、与える仕様の質による。","quote":{"paper":"T1","text":"it depends on the quality of specification provided","line":125,"anchor":"t1-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-3-p1","unit":"t1-3-3","k":1,"lines":[129,129],"label":"試せる回数が増える","does":"主張","says":"外化のコストが下がる価値は、完成品を速く作ることよりも、試せる回数が増えることにあるかもしれない。","quote":{"paper":"T1","text":"the increased number of exploratory attempts that become feasible when creation cost is low","line":129,"anchor":"t1-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-3-p2","unit":"t1-3-3","k":2,"lines":[131,133],"label":"却下した機能と捨てた案","does":"根拠","says":"提案して却下した機能が十二、作って捨てたデザインの案が二つあった。外注では、案を作って捨てること自体が高くつく。","quote":{"paper":"T1","text":"records twelve features that were explicitly proposed and rejected during development","line":131,"anchor":"t1-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-3-p3","unit":"t1-3-3","k":3,"lines":[135,135],"label":"却下も専門知の行使","does":"主張","says":"却下の一つ一つが専門知の行使で、何を作らないかの判断にあたる。","quote":{"paper":"T1","text":"each rejection was itself an exercise of domain expertise","line":135,"anchor":"t1-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-3-p4","unit":"t1-3-3","k":4,"lines":[137,137],"label":"組織では逆になる","does":"限定","says":"個人の探索では失敗のコストが小さい。組織の自動化では失敗がシステムと利用者に広がるので、外化のコストの低下が逆に働く。","quote":{"paper":"T1","text":"This dynamic reverses when externalisation cost reduction is applied to organisational automation rather than individual exploration.","line":137,"anchor":"t1-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-3-4-p1","unit":"t1-3-4","k":1,"lines":[141,145],"label":"二つの同定点","does":"まとめ","says":"試作が仕様になることは、外化のコストを下げる構造的な仕組み。試せる回数の増加はその二次的な効果で、制約は専門家の判断の側に移る。","quote":{"paper":"T1","text":"The case study yields two observations that the Discussion will generalise","line":141,"anchor":"t1-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-p1","unit":"t1-4","k":1,"lines":[151,151],"label":"三種の証拠","does":"手続き","says":"対話ログ、ドメイン・アブレーションの出力、公開するデータの三つを使う。","quote":{"paper":"T1","text":"draw on three categories of evidence","line":151,"anchor":"t1-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-1-p1","unit":"t1-4-1","k":1,"lines":[155,157],"label":"対話ログは判断の記録","does":"主張","says":"対話ログには、何を検討し、何を採り、何をどんな理由で却下したかが残る。作業しながら考えを声に出してもらう方法と違って、作業そのものが、考えを言葉にすることになる。","quote":{"paper":"T1","text":"Rejection rationale is a category of knowledge that typically survives in neither technical manuals nor project reports.","line":155,"anchor":"t1-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-1-p2","unit":"t1-4-1","k":2,"lines":[159,159],"label":"再現の条件","does":"限定","says":"この方法は、長い対話を保てる文脈の容量を前提にしている。再現の条件として記す。","quote":{"paper":"T1","text":"This technical parameter should be noted as a reproducibility condition.","line":159,"anchor":"t1-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-2-p1","unit":"t1-4-2","k":1,"lines":[163,165],"label":"実験の設計","does":"手続き","says":"外化の能力はあるが仕様がない、という条件を作る。加工していない同じデータを二つの AI に一度だけ渡し、著者の仕様が混ざらないようにした。","quote":{"paper":"T1","text":"it asks what happens when externalisation capability is present but specification is absent","line":163,"anchor":"t1-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-2-p2","unit":"t1-4-2","k":2,"lines":[167,191],"label":"収束する欠落","does":"根拠","says":"二つのモデルはどちらも、動くアプリを速く作った。しかしデータの解釈、画面、情報の構成の三つの層で、同じ型の欠落を示した。","quote":{"paper":"T1","text":"Both models independently exhibited structurally convergent deficiency patterns across all three layers","line":191,"anchor":"t1-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-2-p3","unit":"t1-4-2","k":3,"lines":[193,193],"label":"予測と整合する","does":"主張","says":"表の各行は分野の知識を要する設計判断で、プロンプトの工夫では代えられない。結果は枠組みの予測と整合する。","quote":{"paper":"T1","text":"is consistent with the framework's prediction","line":193,"anchor":"t1-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-3-p1","unit":"t1-4-3","k":1,"lines":[197,197],"label":"データの公開","does":"手続き","says":"充電設備のデータ、実験の入力と出力、対話ログの三層を figshare に置く。","quote":{"paper":"T1","text":"Three data layers are deposited on figshare","line":197,"anchor":"t1-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-4-4-p1","unit":"t1-4-4","k":1,"lines":[201,203],"label":"AI の使用の開示","does":"手続き","says":"三つの AI を使った。知識の提供、設計と分析の判断、評価基準の設定は著者が行い、内容の責任は著者だけが負う。","quote":{"paper":"T1","text":"bears sole responsibility for the content","line":203,"anchor":"t1-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-1-p1","unit":"t1-5-1","k":1,"lines":[211,211],"label":"同定点を受ける","does":"まとめ","says":"§3 の二つの同定点を受けて、その理論上の含意を検討する。","quote":{"paper":"T1","text":"Section 3 demonstrated two identification points","line":211,"anchor":"t1-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-1-p2","unit":"t1-5-1","k":2,"lines":[213,213],"label":"可視化テーゼ","does":"主張","says":"二つのコストの区別は、AI が作った構造ではなく、AI が見えるようにした構造である。","quote":{"paper":"T1","text":"The central claim of this paper is that the distinction between externalisation cost and specification cost is not a structure created by AI","line":213,"anchor":"t1-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-1-p3","unit":"t1-5-1","k":3,"lines":[215,219],"label":"準実験の論理","does":"根拠","says":"人から人への伝達では、上下関係や評価への不安などが重なり、二つのコストを別々に観察できない。AI との対話ではこれらが弱まり、外化のコストだけが下がるのが見える。","quote":{"paper":"T1","text":"Under these conditions, the two cost components cannot be independently observed.","line":215,"anchor":"t1-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-1-p4","unit":"t1-5-1","k":4,"lines":[221,221],"label":"同定の一歩","does":"根拠","says":"仕様を欠いた条件では、外化の能力だけで、技術的には整っているが分野としては不適切な成果物ができた。独立した二つのモデルで同じ型の欠落が出たことは、二つの成分が分けられ、AI の支援への応じ方が違うことを示唆する。論文はこれを、枠組みの予測と整合する、と位置づけている。","quote":{"paper":"T1","text":"The domain-ablation experiment (Section 4.2) provides the identification step.","line":221,"anchor":"t1-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-1-p5","unit":"t1-5-1","k":5,"lines":[223,223],"label":"独立の分解の収束","does":"根拠","says":"経済学、認知科学、インタラクション設計、知識経営で似た分解が独立に現れた。これを、構造が広く成り立つことの証拠として挙げる。","quote":{"paper":"T1","text":"constitutes convergent evidence for the universality of the underlying structure","line":223,"anchor":"t1-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-1-p6","unit":"t1-5-1","k":6,"lines":[225,225],"label":"存在と観察を分ける","does":"限定","says":"二成分の構造は、存在についての主張である。交絡が同時に弱まったことは観察を可能にした条件で、存在の条件ではない。","quote":{"paper":"T1","text":"it enabled observation, not existence","line":225,"anchor":"t1-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-2-p1","unit":"t1-5-2","k":1,"lines":[229,231],"label":"質を決めるもの","does":"主張","says":"AI が下げるのが外化のコストなら、新しいコストの構造のもとで出力の質を決めるのは仕様化のコストである。","quote":{"paper":"T1","text":"specification cost is what determines output quality under the new cost structure","line":229,"anchor":"t1-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-2-p2","unit":"t1-5-2","k":2,"lines":[233,233],"label":"持ち運べる","does":"根拠","says":"設計判断を書いた引き継ぎ文書を使うと、新しいセッションの外化のコストはほぼゼロになった。このことは、仕様が特定の AI の中ではなく、専門家の判断の側にあることを示唆する。","quote":{"paper":"T1","text":"suggests that it resides in the human domain expert's judgement rather than in any particular AI system's learned representations","line":233,"anchor":"t1-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-2-p3","unit":"t1-5-2","k":3,"lines":[235,237],"label":"AI に固有ではない","does":"主張","says":"AI を使わない自動車の例でも同じ説明が成り立つ。この専門知は、外化の障壁がなくなれば分野をまたいで働きうる、と枠組みは予測する。","quote":{"paper":"T1","text":"The framework is not AI-specific.","line":235,"anchor":"t1-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-3-p1","unit":"t1-5-3","k":1,"lines":[241,243],"label":"翻訳の層は関門だった","does":"限定","says":"非機能要件は別の専門の軸で、DND はそこを扱わない。なくなった翻訳の層は、情報が失われる場所であると同時に、品質の関門でもあった。","quote":{"paper":"T1","text":"The translation layer that DND eliminates served a dual function.","line":243,"anchor":"t1-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-3-p2","unit":"t1-5-3","k":2,"lines":[245,247],"label":"責任の境界を作り直す","does":"主張","says":"個人の探索は安全に進められる。組織に展開するときは、コードの審査や監査などで、責任の境界を明示して作り直す必要がある。","quote":{"paper":"T1","text":"requires that the responsibility boundary be explicitly reconstructed","line":247,"anchor":"t1-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-3-p3","unit":"t1-5-3","k":3,"lines":[249,249],"label":"下げれば良いとは限らない","does":"限定","says":"外化のコストの削減が、すべて利益になるわけではない。","quote":{"paper":"T1","text":"Not all externalisation cost reduction is beneficial.","line":249,"anchor":"t1-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-4-p1","unit":"t1-5-4","k":1,"lines":[253,255],"label":"方法としての対話ログ","does":"主張","says":"対話ログは、枠組みとは独立した、方法論上の貢献である。設計の理由、却下の理由、評価の基準が残り、組織の新しい種類の記憶になる。","quote":{"paper":"T1","text":"constitute a methodological contribution independent of the present framework","line":253,"anchor":"t1-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-4-p2","unit":"t1-5-4","k":2,"lines":[257,259],"label":"蓄積と引き継ぎ","does":"根拠","says":"文脈が蓄積すると、意図を伝える説明は短くて済むようになる。引き継ぎ文書にすれば、新しいセッションにも移せる。","quote":{"paper":"T1","text":"confirming that the valuable knowledge resided in the specification structure rather than in any particular dialogue history","line":259,"anchor":"t1-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-5-p1","unit":"t1-5-5","k":1,"lines":[263,265],"label":"一つの AI への最適化","does":"限定","says":"一つの AI を使い続けると、仕様の出し方がその AI の癖に寄る危険がある。対策は、二つのコストの区別を概念として理解しておくこと。","quote":{"paper":"T1","text":"Extended use of a single AI system creates a risk of cognitive lock-in.","line":263,"anchor":"t1-5-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-5-p2","unit":"t1-5-5","k":2,"lines":[267,273],"label":"習得の三層","does":"主張","says":"概念として知る、経験で見分ける、統合して使う、の三層を提案する。研修は一層目にあたり、後の経験に対する感度を上げる。","quote":{"paper":"T1","text":"a three-layer model is proposed","line":267,"anchor":"t1-5-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-5-p3","unit":"t1-5-5","k":3,"lines":[275,275],"label":"制約の取り違え","does":"含意","says":"「ベテランに AI を教える」は、どこが制約かを取り違えている。要るのは、ベテランの判断が自然に流れ込む対話の場を設計する人である。","quote":{"paper":"T1","text":"misidentifies the bottleneck","line":275,"anchor":"t1-5-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-5-p4","unit":"t1-5-5","k":4,"lines":[277,279],"label":"学ぶ段階と熟達の段階","does":"主張","says":"判断を育てている途中の人と、すでに判断を持っていて外化のコストだけ下げればよい人とを分けることが、教育の設計の土台になる。","quote":{"paper":"T1","text":"is foundational to educational design","line":279,"anchor":"t1-5-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-6-p1","unit":"t1-5-6","k":1,"lines":[283,285],"label":"効くものには副作用","does":"主張","says":"認知に効く環境には副作用がありうる。適切な対処は禁止ではなく、使い方の設計である。交絡を弱める同じ性質が、利用者と自分の知識との距離も縮める。","quote":{"paper":"T1","text":"the appropriate response is not prohibition but usage design","line":283,"anchor":"t1-5-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-6-p2","unit":"t1-5-6","k":2,"lines":[287,289],"label":"著者の経験と外部の例","does":"根拠","says":"著者自身が、外化が深まるにつれて、感情の関与が段階的に強まるのを観察した。外部の例として、AI に統計手法の推奨を求めて不適切な結果が出た研究を挙げる。","quote":{"paper":"T1","text":"Empirical grounding for this concern emerged from the author's own experience.","line":287,"anchor":"t1-5-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-6-p3","unit":"t1-5-6","k":3,"lines":[291,291],"label":"禁忌の開示がない","does":"含意","says":"薬の添付文書は禁忌を書く。AI を使う開発ツールには、それにあたる開示の枠組みがまだない。","quote":{"paper":"T1","text":"No equivalent disclosure framework currently exists for AI-assisted development tools.","line":291,"anchor":"t1-5-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-6-p4","unit":"t1-5-6","k":4,"lines":[293,293],"label":"限界","does":"限定","says":"限界は七つ挙げられている。事例は一つである。現象の存在と構造を示すためのもので、広がりを示すものではない。著者が研究者と研究の対象を兼ねている。非機能要件は系統的に評価していない。長期の保守性は未検証である。外化のコストの低下は一人の開発で観察したもので、組織での調整のコストは扱っていない。枠組みの範囲は、仕様が人の専門知から生じる分野に限られる。認知と感情の負荷は、振り返りの自己報告による。","quote":{"paper":"T1","text":"valuable for demonstrating the existence and structure of a phenomenon rather than for establishing prevalence","line":293,"anchor":"t1-5-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-5-6-p5","unit":"t1-5-6","k":5,"lines":[295,295],"label":"今後の方向","does":"予測","says":"他の分野の専門家による再現、仕様化のコストの内部の構造など、六つの方向を挙げる。","quote":{"paper":"T1","text":"Six avenues merit investigation","line":295,"anchor":"t1-5-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-6-p1","unit":"t1-6","k":1,"lines":[301,301],"label":"結論","does":"まとめ","says":"暗黙知を形のある成果物に変えられるかを左右する、二つの条件を示した。著者性は、仕様を定めることとして捉え直される。","quote":{"paper":"T1","text":"the framework redefines authorship in AI-assisted knowledge work as the exercise of specification","line":301,"anchor":"t1-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-the-phd-as-specification-training-p1","unit":"t1-the-phd-as-specification-training","k":1,"lines":[305,309],"label":"博士課程は仕様の訓練","does":"含意","says":"この分析のもとでは、博士課程は仕様を定める力を訓練する装置で、AI は外化のコストを下げる装置である。二つがそろうことが DND の条件になる。","quote":{"paper":"T1","text":"Doctoral training is, under this analysis, a specification training apparatus.","line":307,"anchor":"t1-the-phd-as-specification-training","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-observed-diffusion-and-framework-derived-conjectures-p1","unit":"t1-observed-diffusion-and-framework-derived-conjectures","k":1,"lines":[313,313],"label":"観察された広がり","does":"根拠","says":"戦略ゲームや翻訳など、AI の浸透の段階が違う分野で、同じ動きが観察できる。","quote":{"paper":"T1","text":"is observable across domains at varying stages of AI integration","line":313,"anchor":"t1-observed-diffusion-and-framework-derived-conjectures","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-observed-diffusion-and-framework-derived-conjectures-p2","unit":"t1-observed-diffusion-and-framework-derived-conjectures","k":2,"lines":[315,315],"label":"二つの推測","does":"予測","says":"枠組みから出てくるが、この研究の証拠を超える推測を二つ挙げる。","quote":{"paper":"T1","text":"Two conjectures follow from the framework but exceed the present study's evidence.","line":315,"anchor":"t1-observed-diffusion-and-framework-derived-conjectures","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-urgency-p1","unit":"t1-urgency","k":1,"lines":[319,321],"label":"急ぐ理由","does":"含意","says":"外化のコストは下がり続けるが、世代交代で失われた判断はデータだけからは作り直せない。何を AI に任せるかを分ける枠も、普及より前に要る。","quote":{"paper":"T1","text":"cannot be regenerated from data alone","line":319,"anchor":"t1-urgency","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-closing-p1","unit":"t1-closing","k":1,"lines":[325,329],"label":"名付けることが前提","does":"まとめ","says":"区別はもとからあった。足りなかったのは、それを組織で話し合え、研究で測れ、教育で教えられるようにする語彙だった。","quote":{"paper":"T1","text":"Naming a phenomenon is the precondition for managing it.","line":325,"anchor":"t1-closing","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-postscript-a-general-form-of-domain-native-development-p1","unit":"t1-postscript-a-general-form-of-domain-native-development","k":1,"lines":[335,335],"label":"この事例は特殊な形","does":"限定","says":"本文の事例は特殊な形である。仕様の側が先にあったのではなく、AI との対話の中で作られたので、時間がかかった。","quote":{"paper":"T1","text":"one in which specification cost was not pre-existing but was acquired and refined through AI dialogue itself","line":335,"anchor":"t1-postscript-a-general-form-of-domain-native-development","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-postscript-a-general-form-of-domain-native-development-p2","unit":"t1-postscript-a-general-form-of-domain-native-development","k":2,"lines":[337,339],"label":"先にあれば一日","does":"根拠","says":"十年ほどの蓄積がある三つの分野の文書は、どれも一日で仕上がった。同じ著者、同じ AI、同じ時期で、違いはそれだけだった。","quote":{"paper":"T1","text":"All three documents were completed within a single day.","line":337,"anchor":"t1-postscript-a-general-form-of-domain-native-development","match":"exact"},"basis":"reading","vis":"public"},{"id":"t1-postscript-a-general-form-of-domain-native-development-p3","unit":"t1-postscript-a-general-form-of-domain-native-development","k":3,"lines":[341,341],"label":"難しさの逆転","does":"主張","says":"この逆転も、二つのコストは分けられ、AI の支援にそれぞれ別に応じる、という中心の主張の証拠になる。","quote":{"paper":"T1","text":"The bottleneck was never the tool.","line":341,"anchor":"t1-postscript-a-general-form-of-domain-native-development","match":"exact"},"basis":"reading","vis":"public"}],"links":[{"id":"k-t1-1-p3--t1-2-3-p1","from":"t1-1-p3","to":"t1-2-3-p1","rel":"受ける","note":"序論で挙げた独立の分解を、表で一つずつ位置づける。","basis":"reading","vis":"public"},{"id":"k-t1-2-1-p4--t1-5-1-p3","from":"t1-2-1-p4","to":"t1-5-1-p3","rel":"支える","note":"分けられなかった理由（重なる交絡）を、考察で述べる。","basis":"reading","vis":"public"},{"id":"k-t1-2-3-p2--t1-4-2-p3","from":"t1-2-3-p2","to":"t1-4-2-p3","rel":"確かめる","note":"方向つきの予測を、実験の結果と照らす。","basis":"reading","vis":"public"},{"id":"k-t1-2-4-p2--t1-5-2-p1","from":"t1-2-4-p2","to":"t1-5-2-p1","rel":"言い換える","note":"分析の単位は成分の比、をもう一度述べる。","basis":"reading","vis":"public"},{"id":"k-t1-3-1-p1--t1-4-2-p2","from":"t1-3-1-p1","to":"t1-4-2-p2","rel":"使う","note":"著者の設計を、表 2 の対照の列に使う。","basis":"reading","vis":"public"},{"id":"k-t1-3-1-p2--t1-3-3-p3","from":"t1-3-1-p2","to":"t1-3-3-p3","rel":"受ける","note":"入れなかったものを、評価の側で働く専門知として捉え直す。","basis":"reading","vis":"public"},{"id":"k-t1-3-2-p1--t1-3-4-p1","from":"t1-3-2-p1","to":"t1-3-4-p1","rel":"まとめる","note":"同定点の一つ目になる。","basis":"reading","vis":"public"},{"id":"k-t1-3-3-p1--t1-3-4-p1","from":"t1-3-3-p1","to":"t1-3-4-p1","rel":"まとめる","note":"同定点の二つ目になる。","basis":"reading","vis":"public"},{"id":"k-t1-3-4-p1--t1-5-1-p1","from":"t1-3-4-p1","to":"t1-5-1-p1","rel":"受ける","note":"二つの同定点を、考察の出発点にする。","basis":"reading","vis":"public"},{"id":"k-t1-3-2-p1--t1-5-3-p1","from":"t1-3-2-p1","to":"t1-5-3-p1","rel":"限定する","note":"翻訳の層がなくなる利点に、関門もなくなるという限定を付ける。","basis":"reading","vis":"public"},{"id":"k-t1-3-3-p4--t1-5-3-p2","from":"t1-3-3-p4","to":"t1-5-3-p2","rel":"受ける","note":"個人と組織の非対称を、責任の境界の話として展開する。","basis":"reading","vis":"public"},{"id":"k-t1-3-3-p2--t1-4-1-p1","from":"t1-3-3-p2","to":"t1-4-1-p1","rel":"受ける","note":"却下の理由が、対話ログに残る記録の中身になる。","basis":"reading","vis":"public"},{"id":"k-t1-4-1-p1--t1-5-4-p1","from":"t1-4-1-p1","to":"t1-5-4-p1","rel":"受ける","note":"方法の記述を、方法上の貢献として述べ直す。","basis":"reading","vis":"public"},{"id":"k-t1-5-2-p2--t1-5-4-p2","from":"t1-5-2-p2","to":"t1-5-4-p2","rel":"言い換える","note":"引き継ぎ文書の同じ観察を、方法の側から述べる。","basis":"reading","vis":"public"},{"id":"k-t1-2-3-p1--t1-5-1-p5","from":"t1-2-3-p1","to":"t1-5-1-p5","rel":"使う","note":"表 1 の四つの分解を、収束の証拠として使う。","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p2--t1-5-1-p3","from":"t1-5-1-p2","to":"t1-5-1-p3","rel":"支える","note":"中心の主張を、準実験の論理で支える。","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p2--t1-5-1-p4","from":"t1-5-1-p2","to":"t1-5-1-p4","rel":"支える","note":"中心の主張を、実験による同定で支える。","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p2--t1-5-1-p5","from":"t1-5-1-p2","to":"t1-5-1-p5","rel":"支える","note":"中心の主張を、独立の分解の収束で支える。","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p2--t1-5-1-p6","from":"t1-5-1-p2","to":"t1-5-1-p6","rel":"限定する","note":"主張の種類（存在）と観察の条件を分けて、言い過ぎを防ぐ。","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p3--t1-5-6-p1","from":"t1-5-1-p3","to":"t1-5-6-p1","rel":"受ける","note":"交絡を弱める同じ性質の、危険の側を述べる。","basis":"reading","vis":"public"},{"id":"k-t1-4-2-p2--t1-5-6-p2","from":"t1-4-2-p2","to":"t1-5-6-p2","rel":"支える","note":"仕様を欠いた AI の外部の例を、実験の結果と並べる。","basis":"reading","vis":"public"},{"id":"k-t1-2-1-p5--t1-5-6-p5","from":"t1-2-1-p5","to":"t1-5-6-p5","rel":"受ける","note":"系譜で触れた深い層を、今後の課題として置く。","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p6--t1-5-6-p5","from":"t1-5-1-p6","to":"t1-5-6-p5","rel":"受ける","note":"外化のコストの内訳を、今後の課題として置く。","basis":"reading","vis":"public"},{"id":"k-t1-5-5-p4--t1-the-phd-as-specification-training-p1","from":"t1-5-5-p4","to":"t1-the-phd-as-specification-training-p1","rel":"受ける","note":"判断を育てる仕組みは何か、という問いを結論で受ける。本文は節の番号ではなく the Conclusion と名指している。","basis":"reading","vis":"public"},{"id":"k-t1-1-p2--t1-urgency-p1","from":"t1-1-p2","to":"t1-urgency-p1","rel":"受ける","note":"序論の三人を、非対称の例としてもう一度使う。","basis":"reading","vis":"public"},{"id":"k-t1-2-2-p2--t1-6-p1","from":"t1-2-2-p2","to":"t1-6-p1","rel":"言い換える","note":"著者性の主張を、結論で述べ直す。","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p2--t1-closing-p1","from":"t1-5-1-p2","to":"t1-closing-p1","rel":"言い換える","note":"見えるようにする、という主張で閉じる。","basis":"reading","vis":"public"},{"id":"k-t1-5-1-p4--t1-postscript-a-general-form-of-domain-native-development-p3","from":"t1-5-1-p4","to":"t1-postscript-a-general-form-of-domain-native-development-p3","rel":"支える","note":"分けられ、それぞれ別に応じる、という主張に、投稿後の観察を足す。","basis":"reading","vis":"public"}],"ok":1},"T2":{"tiers":[{"id":"t2-abstract","no":"","title":"Abstract","line":11,"units":["t2-abstract"]},{"id":"t2-1","no":"1","title":"Introduction","line":19,"units":["t2-1"]},{"id":"t2-2","no":"2","title":"The internal structure of specification: deriving the Sein/Sollen decomposition","line":33,"units":["t2-2-1","t2-2-2","t2-2-3","t2-2-4"]},{"id":"t2-3","no":"3","title":"Philosophy as cognitive assay: operationalization","line":73,"units":["t2-3-1","t2-3-2","t2-3-3","t2-3-4"]},{"id":"t2-4","no":"4","title":"First application: re-describing SECI through the assay","line":125,"units":["t2-4","t2-4-1","t2-4-2","t2-4-3","t2-4-4","t2-4-5"]},{"id":"t2-5","no":"5","title":"Convergent evidence","line":166,"units":["t2-5","t2-5-1","t2-5-2","t2-5-3","t2-5-4"]},{"id":"t2-6","no":"6","title":"Discussion","line":188,"units":["t2-6","t2-6-1","t2-6-2","t2-6-3","t2-6-4","t2-6-5"]},{"id":"t2-7","no":"7","title":"Conclusion","line":228,"units":["t2-7"]},{"id":"t2-postscript","no":"","title":"Postscript","line":242,"units":["t2-postscript"]}],"units":[{"id":"t2-abstract","tier":"t2-abstract","no":"","title":"Abstract","intro":false,"line_start":11,"line_end":18,"paras":2,"size":298,"first":{"text":"This article operationalizes the concept of a *delegation legitimacy boundary* — the structural line along which human judgment can and cannot be legitimately delegated to artificial intelligence — and proposes a minimal scoring protocol for locating it within","line":13,"cut":true}},{"id":"t2-1","tier":"t2-1","no":"1","title":"Introduction","intro":false,"line_start":19,"line_end":32,"paras":6,"size":1134,"first":{"text":"Something that could not previously be measured is becoming measurable.","line":21,"cut":false}},{"id":"t2-2-1","tier":"t2-2","no":"2.1","title":"Three concepts, not two","intro":false,"line_start":35,"line_end":38,"paras":1,"size":150,"first":{"text":"The Mekiki framework (Tomita 2026) distinguished three concepts that are routinely conflated in discussions of AI-assisted knowledge work. *Domain expertise* is a resource that a practitioner possesses — accumulated through training, practice, and exposure to ","line":37,"cut":true}},{"id":"t2-2-2","tier":"t2-2","no":"2.2","title":"Derivation from the Mekiki case study","intro":false,"line_start":39,"line_end":48,"paras":4,"size":354,"first":{"text":"The Mekiki article recorded, in granular detail, the specification judgments that a domain expert made during the development of an EV charging application.","line":41,"cut":false}},{"id":"t2-2-3","tier":"t2-2","no":"2.3","title":"Philosophical foundations","intro":false,"line_start":49,"line_end":64,"paras":8,"size":712,"first":{"text":"The distinction just derived from case-study evidence is not new.","line":51,"cut":false}},{"id":"t2-2-4","tier":"t2-2","no":"2.4","title":"Generalization beyond Externalization","intro":false,"line_start":65,"line_end":72,"paras":3,"size":362,"first":{"text":"One further step is required before the decomposition can serve as the axis of an assay.","line":67,"cut":false}},{"id":"t2-3-1","tier":"t2-3","no":"3.1","title":"Why the assay conditions are now met","intro":false,"line_start":75,"line_end":78,"paras":1,"size":209,"first":{"text":"In pharmacological assay design, a compound's activity can only be measured when background noise is sufficiently attenuated.","line":77,"cut":false}},{"id":"t2-3-2","tier":"t2-3","no":"3.2","title":"The scoring protocol","intro":false,"line_start":79,"line_end":104,"paras":11,"size":910,"first":{"text":"The unit of analysis is the individual *feature decision*: a single judgment recorded in the design process — a data structure choice, a display condition, a filter rule, a non-adoption decision.","line":81,"cut":false}},{"id":"t2-3-3","tier":"t2-3","no":"3.3","title":"Worked example: a minimal demonstration","intro":false,"line_start":105,"line_end":116,"paras":5,"size":267,"first":{"text":"To illustrate the protocol's separating power, two judgments from the Mekiki case study are scored here, selected as analytically clean representatives — one Sein-dominant, one Sollen-dominant — from the case study's larger inventory of feature decisions; the ","line":107,"cut":true}},{"id":"t2-3-4","tier":"t2-3","no":"3.4","title":"Philosophical frameworks as candidate assay axes","intro":false,"line_start":117,"line_end":124,"paras":3,"size":539,"first":{"text":"The Sein/Sollen distinction is the minimal axis required for the present assay, but it is not the only philosophical distinction that could serve as a measurement coordinate.","line":119,"cut":false}},{"id":"t2-4","tier":"t2-4","no":"4","title":"First application: re-describing SECI through the assay","intro":true,"line_start":125,"line_end":128,"paras":1,"size":93,"first":{"text":"The cognitive assay developed in Sections 2 and 3 was derived from the Externalization process.","line":127,"cut":false}},{"id":"t2-4-1","tier":"t2-4","no":"4.1","title":"Externalization: the Mekiki framework's direct domain","intro":false,"line_start":129,"line_end":132,"paras":1,"size":142,"first":{"text":"Externalization — converting tacit knowledge into explicit form — is the process where AI's impact is most immediately visible and where the Mekiki framework was originally derived.","line":131,"cut":false}},{"id":"t2-4-2","tier":"t2-4","no":"4.2","title":"Combination: AI's strongest domain","intro":false,"line_start":133,"line_end":136,"paras":1,"size":109,"first":{"text":"Combination — integrating, sorting, and recategorizing explicit knowledge — is the process most saturated with externalization cost and correspondingly most amenable to AI acceleration.","line":135,"cut":false}},{"id":"t2-4-3","tier":"t2-4","no":"4.3","title":"Socialization: the domain of Sollen-type specification","intro":false,"line_start":137,"line_end":140,"paras":1,"size":269,"first":{"text":"Socialization — the sharing of tacit knowledge through shared experience, co-practice, and what Nonaka and Takeuchi called \"intellectual combat\" — is the process where Sollen-type specification is most concentrated.","line":139,"cut":false}},{"id":"t2-4-4","tier":"t2-4","no":"4.4","title":"Internalization: AI as catalyst, not substitute","intro":false,"line_start":141,"line_end":144,"paras":1,"size":130,"first":{"text":"Internalization — absorbing explicit knowledge into individual tacit practice — is weighted toward Sein-type specification: the practitioner learns established facts, procedures, and patterns until they become second nature.","line":143,"cut":false}},{"id":"t2-4-5","tier":"t2-4","no":"4.5","title":"The rate-limiting shift: an analytic consequence","intro":false,"line_start":145,"line_end":165,"paras":6,"size":349,"first":{"text":"Table 1 summarizes the decomposition; Fig. 2 provides a visual representation of the rate-limiting shift.","line":147,"cut":false}},{"id":"t2-5","tier":"t2-5","no":"5","title":"Convergent evidence","intro":true,"line_start":166,"line_end":169,"paras":1,"size":49,"first":{"text":"The assay proposed in this article is a conceptual-operational contribution, not an empirical study.","line":168,"cut":false}},{"id":"t2-5-1","tier":"t2-5","no":"5.1","title":"Predictive validity","intro":false,"line_start":170,"line_end":173,"paras":1,"size":166,"first":{"text":"The assay predicts that specification quality determines output quality independently of externalization-cost quality.","line":172,"cut":false}},{"id":"t2-5-2","tier":"t2-5","no":"5.2","title":"Discriminant validity","intro":false,"line_start":174,"line_end":177,"paras":1,"size":151,"first":{"text":"The assay predicts that Sein-type and Sollen-type components vary independently — that improving one does not automatically improve the other.","line":176,"cut":false}},{"id":"t2-5-3","tier":"t2-5","no":"5.3","title":"Convergent and ecological validity","intro":false,"line_start":178,"line_end":183,"paras":2,"size":389,"first":{"text":"Two further studies provide convergent support from different disciplinary angles.","line":180,"cut":false}},{"id":"t2-5-4","tier":"t2-5","no":"5.4","title":"Failure modes","intro":false,"line_start":184,"line_end":187,"paras":1,"size":203,"first":{"text":"The assay's practical utility depends on acknowledging where it fails.","line":186,"cut":false}},{"id":"t2-6","tier":"t2-6","no":"6","title":"Discussion","intro":true,"line_start":188,"line_end":191,"paras":1,"size":84,"first":{"text":"Having specified the scoring protocol, this discussion turns to what the framework clarifies about legitimate delegation in AI-assisted knowledge work.","line":190,"cut":false}},{"id":"t2-6-1","tier":"t2-6","no":"6.1","title":"The assay structure in practice: convergent implementation and convergent failure","intro":false,"line_start":192,"line_end":201,"paras":4,"size":339,"first":{"text":"The scoring structure proposed in Section 3 — Sein-row evaluation by AI, Sollen-row evaluation by domain expert — is not merely a theoretical construct.","line":194,"cut":false}},{"id":"t2-6-2","tier":"t2-6","no":"6.2","title":"Implications for AGI discourse","intro":false,"line_start":202,"line_end":205,"paras":1,"size":112,"first":{"text":"Current large language models, viewed through the assay's lens, function as domain-general cognitive catalysts: they accelerate externalization-cost processing across all domains but depend on the user for specification — for the judgments about what matters, ","line":204,"cut":true}},{"id":"t2-6-3","tier":"t2-6","no":"6.3","title":"Agent-relative residues in LLM output","intro":false,"line_start":206,"line_end":209,"paras":1,"size":304,"first":{"text":"The delegation legitimacy boundary was derived for human judgment, but its structural logic extends to a governance question about LLM output itself.","line":208,"cut":false}},{"id":"t2-6-4","tier":"t2-6","no":"6.4","title":"Scope, limitations, and safeguards","intro":false,"line_start":210,"line_end":223,"paras":6,"size":469,"first":{"text":"The assay's scope is delimited by the SECI processes it re-describes.","line":212,"cut":false}},{"id":"t2-6-5","tier":"t2-6","no":"6.5","title":"Do-type as a heuristic extension","intro":false,"line_start":224,"line_end":227,"paras":1,"size":150,"first":{"text":"A final, more heuristic implication concerns the label Do-type introduced for practice-sustained Sollen-type specification.","line":226,"cut":false}},{"id":"t2-7","tier":"t2-7","no":"7","title":"Conclusion","intro":false,"line_start":228,"line_end":241,"paras":5,"size":430,"first":{"text":"This article derived a decomposition within the specification concept introduced by the Mekiki framework (Tomita 2026), grounding the distinction in the is–ought separation (Hume 1739; Kant 1781, 1785) and operationalizing it as the axes of a cognitive assay.","line":230,"cut":false}},{"id":"t2-postscript","tier":"t2-postscript","no":"","title":"Postscript","intro":false,"line_start":242,"line_end":247,"paras":1,"size":94,"first":{"text":"Mekiki — the Japanese term for expert discernment — names the vernacular practice that the present article operationalizes through philosophical decomposition and a measurement protocol.","line":244,"cut":false}}],"refs":[{"from":"t2-2-2","to":"t2-3-1","to_no":"3","line":47,"text":"The scoring protocol introduced in Section 3 operationalizes this question as a ratio profile rather than a binary classification.","cut":false,"dir":"fwd"},{"from":"t2-2-3","to":"t2-3-1","to_no":"3","line":53,"text":"This irreducibility provides the deepest philosophical justification for the scoring asymmetry introduced in Section 3: Sollen-type components require evaluation by an agent whose perspective is constitutively relevant to the judgment, not by a system that operates from a view from nowhere.","cut":false,"dir":"fwd"},{"from":"t2-2-3","to":"t2-1","to_no":"1","line":55,"text":"The delegation legitimacy boundary, introduced in Section 1, runs along this distinction.","cut":false,"dir":"back"},{"from":"t2-2-4","to":"t2-4","to_no":"4","line":69,"text":"Section 4 carries out this analysis.","cut":false,"dir":"fwd"},{"from":"t2-3-2","to":"t2-2-2","to_no":"2.2","line":81,"text":"The Mekiki case study contains approximately thirty such decisions; Section 2.2 showed that they contain separable Sein-type and Sollen-type components.","cut":false,"dir":"back"},{"from":"t2-3-2","to":"t2-2-1","to_no":"2","line":97,"text":"First, the scorer asymmetry — AI for Sein rows, domain expert for Sollen rows — is not a design preference but a consequence of the decomposition derived in Section 2.","cut":false,"dir":"back"},{"from":"t2-3-2","to":"t2-3-3","to_no":"3.3","line":103,"text":"Discriminant validity requires that Sein-type and Sollen-type scores vary independently; the domain-ablation experiment (Section 3.3 below) and Kusumegi et al.'s population-level data both confirm this independence.","cut":false,"dir":"fwd"},{"from":"t2-3-3","to":"t2-4","to_no":"4","line":113,"text":"Section 4 applies the assay at a larger scale, re-describing the full SECI model through the Sein/Sollen decomposition.","cut":false,"dir":"fwd"},{"from":"t2-3-4","to":"t2-6-5","to_no":"6.5","line":123,"text":"At the level relevant to delegation, agent-relative evaluative commitments sustained through practice and oriented toward ideals of excellence constitute a Do-type state of Sollen-type specification (from Japanese *dō*, practice-sustained engagement; elaborated in Section 6.5).","cut":false,"dir":"fwd"},{"from":"t2-4","to":"t2-2-1","to_no":"2","line":127,"text":"The cognitive assay developed in Sections 2 and 3 was derived from the Externalization process.","cut":false,"dir":"back"},{"from":"t2-4","to":"t2-3-1","to_no":"3","line":127,"text":"The cognitive assay developed in Sections 2 and 3 was derived from the Externalization process.","cut":false,"dir":"back"},{"from":"t2-4","to":"t2-2-4","to_no":"2.4","line":127,"text":"But as Section 2.4 established, the Sein/Sollen distinction is orthogonal to the SECI process distinction: it applies within any process, not between them.","cut":false,"dir":"back"},{"from":"t2-5-3","to":"t2-4-3","to_no":"4.3","line":180,"text":"Scharfmann, Marx, and Fleming (2025), whose cross-domain co-location findings were discussed in Section 4.3, provide ecological support from the opposite direction: the pattern they documented is","cut":true,"dir":"back"},{"from":"t2-5-4","to":"t2-5-1","to_no":"5.1","line":186,"text":"The same dataset that supports predictive validity (Section 5.1) also bears on failure-mode detection: Thorgeirsson et al.'s finding that LLM usage","cut":true,"dir":"back"},{"from":"t2-6","to":"t2-3-4","to_no":"3.4","line":190,"text":"As noted in Section 3.4, Sein-type components and Sin-type material can often be reproduced as textual regularities, whereas Do-type commitments and other agent-relative residues require renewed human evaluation.","cut":false,"dir":"back"},{"from":"t2-6-1","to":"t2-3-1","to_no":"3","line":194,"text":"The scoring structure proposed in Section 3 — Sein-row evaluation by AI, Sollen-row evaluation by domain expert — is not merely a theoretical construct.","cut":false,"dir":"back"},{"from":"t2-6-3","to":"t2-5-3","to_no":"5.3","line":208,"text":"The Klowden and Tao (2026) observation discussed in Section 5.3 points to the same structural tension from the user's side.","cut":false,"dir":"back"},{"from":"t2-6-4","to":"t2-6-3","to_no":"6.3","line":222,"text":"The agent-relative residues discussed in Section 6.3 suggest that the cognitive assay's analytical vocabulary may eventually find application","cut":true,"dir":"back"}],"figs":[{"kind":"table","no":1,"label":"Table 1","caption":"Table 1. SECI processes decomposed by the cognitive assay's three components.","line":149,"anchor":"t2-4-5","unit":"t2-4-5","omitted":false,"match":"exact"},{"kind":"figure","no":1,"label":"Fig. 1","caption":"Fig. 1. Positioning of the present article.","line":370,"anchor":"t2-figure-legends-images-omitted","unit":"t2-2-3","omitted":true,"match":"exact"},{"kind":"figure","no":2,"label":"Fig. 2","caption":"Fig. 2. First application of the cognitive assay to the SECI spiral.","line":372,"anchor":"t2-figure-legends-images-omitted","unit":"t2-4-5","omitted":true,"match":"exact"}],"parts":[{"id":"t2-abstract-p1","unit":"t2-abstract","k":1,"lines":[13,15],"label":"要旨","does":"まとめ","says":"委任の正統性の境界（人の判断を AI に正統に委ねられる所と、委ねられない所を分ける線）を測れる形にし、課題の中でその位置を見つける五段階の採点手順を示す。仕様の内側を事実の成分（Sein 型）と価値を含む成分（Sollen 型）に分ける。これを SECI に当てると、AI が外化と結合を速めたとき、律速段階は社会化と内面化へ移る、という分析上の帰結が出る。","quote":{"paper":"T2","text":"proposes a minimal scoring protocol for locating it within any knowledge-work task","line":13,"anchor":"t2-abstract","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-1-p1","unit":"t2-1","k":1,"lines":[21,21],"label":"見えてきた判断","does":"枠","says":"AI が専門知を形にするコストを圧縮した結果、専門知が担う判断（何を作り、何を除き、何を基準に質を測るか）が表に出た。先行の枠組みは仕様と外化のコストを分けたが、仕様の内側は調べていない。","quote":{"paper":"T2","text":"What the framework left unexamined was the internal structure of specification itself.","line":21,"anchor":"t2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-1-p2","unit":"t2-1","k":2,"lines":[23,23],"label":"正統性からの接近","does":"位置づけ","says":"AI を使う決定の基準は、説明できるかどうかから、正当化できるか、異議を唱えられるかどうかへ移ってきた。決定の一部が委ねられないのは、AI に計算の力がないからではなく、出力の根拠を、正統性が社会的に認められた源までたどれなければならないからである。","quote":{"paper":"T2","text":"the output's warrant must be traceable to a source whose legitimacy is socially recognized","line":23,"anchor":"t2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-1-p3","unit":"t2-1","k":3,"lines":[25,25],"label":"暗黙知の行方","does":"位置づけ","says":"暗黙知をめぐる議論（Gill、Collins、Ferdman）は、AI が、言葉にできる部分を速めながら、質を支える言葉にしにくい部分の条件を同時に損なっているのではないか、という懸念で一致する。","quote":{"paper":"T2","text":"These contributions converge on a shared concern","line":25,"anchor":"t2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-1-p4","unit":"t2-1","k":4,"lines":[27,27],"label":"欠けている中間層","does":"主張","says":"人の判断が大事だという議論は尽くされている。欠けているのは測る仕組みで、判断を成分に分け、どの成分がどの種類の重みを持つかを決め、それぞれを適切な採点者に割り当てる方法である。本稿は、手つかずの領域だとは主張せず、この中間層をまとめて示す。","quote":{"paper":"T2","text":"What is missing is not another argument for the importance of human judgment","line":27,"anchor":"t2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-1-p5","unit":"t2-1","k":5,"lines":[29,29],"label":"認知アッセイの提案","does":"枠","says":"仕様を Sein 型と Sollen 型に分け、哲学の区別を規範の処方としてではなく、測定の座標として使う。採点の非対称は設計上の選択ではなく、委任の正統性の境界から構造的に導かれる。境界は能力の主張ではなく、正統性の主張であり、価値判断を下す権限が制度の上で人に帰されているあいだ成り立つ。","quote":{"paper":"T2","text":"The boundary is not a capability claim; it is a legitimacy claim, and it holds as long as the authority to make value judgments remains institutionally attributed to human agents.","line":29,"anchor":"t2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-1-p6","unit":"t2-1","k":6,"lines":[31,31],"label":"SECI への適用","does":"含意","says":"最初の適用として、SECI の四つの過程をアッセイで読み直す。分析上の帰結は、AI が外化と結合を速めると、律速段階が社会化と内面化へ移る、というものである。どちらも、人の速さに限られた過程のままである。","quote":{"paper":"T2","text":"Both remain human-limited processes.","line":31,"anchor":"t2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-1-p1","unit":"t2-2-1","k":1,"lines":[37,37],"label":"三つの概念","does":"定義","says":"専門知は実践者が持つ資源。仕様化のコストは課題の性質で、課題がその資源を要求する度合い。仕様は、専門知をある課題に投じた結果としての具体的な判断。本稿が問うのは、この仕様の内側の構造である。","quote":{"paper":"T2","text":"is a property of the task: the degree to which the task demands that resource","line":37,"anchor":"t2-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-2-p1","unit":"t2-2-2","k":1,"lines":[41,43],"label":"事実の判断","does":"根拠","says":"先行論文の事例の記録を見直すと、二種類の判断が見分けられる。一つは事実の判断で、データ構造がどう振る舞うか、利用者が何を知覚するかに関わる。十分なデータと訓練があれば、AI も原理的には同じ判定に達しうる。","quote":{"paper":"T2","text":"Given sufficient data and domain-relevant training, an AI system could in principle arrive at the same determinations.","line":43,"anchor":"t2-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-2-p2","unit":"t2-2-2","k":2,"lines":[45,45],"label":"価値を含む判断","does":"根拠","says":"もう一つは価値を含む判断で、充電器の空き状況を表示しないと決めたことのように、どうあるべきかに関わる。AI はこうした出力を作れるが、その判断を正統にする根拠は出せない。","quote":{"paper":"T2","text":"An AI system can generate such outputs, but it cannot supply the warrant","line":45,"anchor":"t2-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-2-p3","unit":"t2-2-2","k":3,"lines":[47,47],"label":"最小の分解","does":"限定","says":"この二分は最小の分解で、どの判断もきれいに片方へ入るという主張ではない。実際の判断の多くは混成で、採点手順はこれを二値ではなく比率プロファイルとして扱う。","quote":{"paper":"T2","text":"Most judgments in practice are hybrid","line":47,"anchor":"t2-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-3-p1","unit":"t2-2-3","k":1,"lines":[51,51],"label":"Hume と Kant","does":"位置づけ","says":"この区別は新しくない。Hume は、「である」の前提だけからは「べきである」の結論が出ないと述べ、Kant はこれを Sein と Sollen として体系化した。本稿は Kant の語を採る。","quote":{"paper":"T2","text":"It is, in fact, among the oldest in Western philosophy.","line":51,"anchor":"t2-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-3-p2","unit":"t2-2-3","k":2,"lines":[53,53],"label":"還元できない価値","does":"根拠","says":"Williams は、純粋な Sein と Sollen にいつも分けられるわけではないと示した。Nagel は、価値は一つの尺度に還元できず、行為者に相対的な理由は、どの視点からでも手の届く、行為者に中立な理由には還元できないと論じた。本稿はこれを、採点の非対称のいちばん深い哲学的な根拠とする。","quote":{"paper":"T2","text":"This irreducibility provides the deepest philosophical justification for the scoring asymmetry introduced in Section 3","line":53,"anchor":"t2-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-3-p3","unit":"t2-2-3","k":3,"lines":[55,55],"label":"境界の走る場所","does":"主張","says":"委任の正統性の境界はこの区別に沿う。Sein 型の仕様は、原理的には少しずつ AI の処理に取り込まれうる。Sollen 型は、AI が出力を作れないからではなく、その出力の正統性をシステム自身に根拠づけることができないので、取り込まれない。主張は能力ではなく、根拠についてのものである。","quote":{"paper":"T2","text":"The claim is not about capability but about warrant.","line":55,"anchor":"t2-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-3-p4","unit":"t2-2-3","k":4,"lines":[57,61],"label":"三層の記述","does":"枠","says":"先行の二条件と合わせると三層になる。外化のコスト（AI が除くか大きく圧縮する）、Sein 型の仕様（少しずつ AI が学べる）、Sollen 型の仕様（境界はここにある）。","quote":{"paper":"T2","text":"yields a three-layer description of knowledge work under AI assistance","line":57,"anchor":"t2-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-3-p5","unit":"t2-2-3","k":5,"lines":[63,63],"label":"Sollen との区別","does":"限定","says":"Sollen 型の仕様は、価値判断を下す実践者の力で、制度の規範や規制のような、環境からの規範的な圧力（Sollen）とは別である。混同すると、取り除くべき外からの負担だと誤読される。","quote":{"paper":"T2","text":"should not be confused with Sollen as an environmental normative pressure","line":63,"anchor":"t2-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-4-p1","unit":"t2-2-4","k":1,"lines":[67,67],"label":"四過程への一般化","does":"主張","says":"仕様と外化のコストの区別も、Sein と Sollen の分解も、外化の過程に固有ではなく、SECI の四つの過程すべてを横切る。区別は過程と過程の間ではなく、一つの過程の中に当てはまる。","quote":{"paper":"T2","text":"The Sein/Sollen distinction is orthogonal to the SECI process distinction","line":67,"anchor":"t2-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-4-p2","unit":"t2-2-4","k":2,"lines":[69,69],"label":"直交するから使える","does":"根拠","says":"Sein と Sollen が過程の区別と直交するので、各過程を判断の種類で分ける行列の分析ができ、どちらか一方の枠組みだけでは見えない非対称が見える。","quote":{"paper":"T2","text":"This orthogonality is what makes the distinction usable as an assay axis.","line":69,"anchor":"t2-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-2-4-p3","unit":"t2-2-4","k":3,"lines":[71,71],"label":"分析の水準","does":"限定","says":"分析の水準は知識活動の構造（過程の水準）である。個人の認知、組織の設計、規制の政策については主張しない。","quote":{"paper":"T2","text":"The framework does not make claims about individual cognition","line":71,"anchor":"t2-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-1-p1","unit":"t2-3-1","k":1,"lines":[77,77],"label":"雑音が下がった","does":"根拠","says":"測定は、背景の雑音が十分に下がって初めて成り立つ。従来は仕様と外化のコストが絡み合っていた。AI が外化のコストを圧縮して雑音の水準（ノイズフロア）が下がり、仕様が変数として切り出せるようになった。","quote":{"paper":"T2","text":"AI's compression of externalization cost has substantially lowered this noise floor.","line":77,"anchor":"t2-3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p1","unit":"t2-3-2","k":1,"lines":[81,83],"label":"採点の単位","does":"定義","says":"分析の単位は、設計の過程に記録された一つひとつの判断（機能の決定）である。手順は五段階で進む。","quote":{"paper":"T2","text":"a single judgment recorded in the design process","line":81,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p2","unit":"t2-3-2","k":2,"lines":[85,87],"label":"抽出と、抜けの検出","does":"手続き","says":"段階 1 で、AI が設計の記録から個々の判断を取り出す。段階 1b で、専門家が AI の拾えなかった判断を足す。作らなかった機能のように、記録にないこと自体が判断である場合、AI には取り出せない。","quote":{"paper":"T2","text":"its absence from the record was itself the judgment","line":87,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p3","unit":"t2-3-2","k":3,"lines":[89,89],"label":"操作の種類","does":"手続き","says":"段階 2 で、各判断に操作の種類（検出、優先づけ、除外、正当化）の札を付ける。採点とは独立の記述で、四つとも Sein の行にも Sollen の行にも現れうる。","quote":{"paper":"T2","text":"All four types can appear in both the Sein and Sollen rows","line":89,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p4","unit":"t2-3-2","k":4,"lines":[91,93],"label":"二つの行の採点","does":"手続き","says":"段階 3 で AI が事実の成分を、段階 4 で専門家が価値を含む成分を、同じ三点の尺度で採点する。Sollen 型には自然な正解がないので、複数の専門家が独立に採点し、食い違いを裁定して信頼性を確かめる。","quote":{"paper":"T2","text":"Because Sollen-type judgments lack natural ground truth","line":93,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p5","unit":"t2-3-2","k":5,"lines":[95,95],"label":"足し合わせない","does":"主張","says":"段階 5 では、点を一つの指数に足し合わせない。Sein 型の質と Sollen 型の質は同じ尺度で測れない次元なので、行ごとの平均とばらつき、混成の判断の分布を、比率プロファイルとして報告する。","quote":{"paper":"T2","text":"Scores are not summed into a single index.","line":95,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p6","unit":"t2-3-2","k":6,"lines":[97,97],"label":"二つの構造上の特徴","does":"主張","says":"採点者の非対称は設計上の好みではなく、分解の帰結である。手順そのものも非対称を体現していて、専門家の決定的な介入は段階 1b と 4 にある。境界を測る手順そのものが丸ごと委ねられるものなら、自己矛盾になる。","quote":{"paper":"T2","text":"A protocol for measuring the delegation legitimacy boundary that was itself fully delegable would be self-defeating.","line":97,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p7","unit":"t2-3-2","k":7,"lines":[99,99],"label":"制度上の働き","does":"含意","says":"AI による Sein の行の採点は絶対的に中立ではないが、地位の防衛や面子、動機づけられた推論のような、人どうしの評価に入り込む歪みへの手続き上の歯止めになりうる。AI を権威として扱うのではなく、監査でき、異議を唱えられる暫定の採点者として使う。","quote":{"paper":"T2","text":"The point is not to treat AI as an authority","line":99,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p8","unit":"t2-3-2","k":8,"lines":[101,101],"label":"専門家の選び方","does":"手続き","says":"分野ごとの基準は各分野に任せる。採点者は、その種類の判断について責務を負い、評価する役割にある人であるべきで、できれば、独立に採点して、食い違いは裁定にかける。","quote":{"paper":"T2","text":"scorers should hold accountability for the relevant judgment type","line":101,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-2-p9","unit":"t2-3-2","k":9,"lines":[103,103],"label":"妥当性と失敗の型","does":"限定","says":"妥当性は、仕様の質が外化の質とは独立に出力の質を予測する、という証拠に拠る。失敗の型は二つある。外化の質の高さが仕様の欠如を隠す偽陽性と、外化の摩擦が本物の仕様を見えなくする偽陰性である。","quote":{"paper":"T2","text":"The assay admits two principal failure modes.","line":103,"anchor":"t2-3-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-3-p1","unit":"t2-3-3","k":1,"lines":[107,111],"label":"二つの判断の採点","does":"例","says":"事例から、Sein が優位の判断と Sollen が優位の判断を一つずつ採点してみせる。電流に基づくデータ構造の判断は、Sein の行が 2、Sollen の行が 0。空き状況を表示しない判断は、Sein の行が 1、Sollen の行が 2。","quote":{"paper":"T2","text":"one Sein-dominant, one Sollen-dominant","line":107,"anchor":"t2-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-3-p2","unit":"t2-3-3","k":2,"lines":[113,113],"label":"専門知を抜くと","does":"根拠","says":"専門知なしで同じアプリを作らせた条件では、Sein の行は一部が残り、Sollen の行は系統的にゼロへ近づいた。二つの成分は採点表の上で分かれる。","quote":{"paper":"T2","text":"the Sollen row dropped systematically toward zero","line":113,"anchor":"t2-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-3-p3","unit":"t2-3-3","k":3,"lines":[115,115],"label":"基準の混入","does":"限定","says":"この例は、理論を作った本人の事例から取っている。枠組みを知らない専門家による盲検の採点が、外的妥当性の検証として要る。ここで示せたのは、手順が適用でき、二つの成分を予測どおり分けることまでである。","quote":{"paper":"T2","text":"This worked example is drawn from the theory-builder's own case study.","line":115,"anchor":"t2-3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-4-p1","unit":"t2-3-4","k":1,"lines":[119,119],"label":"ほかの軸の候補","does":"位置づけ","says":"Sein と Sollen は最小の軸で、唯一の軸ではない。Aristotle の実践知や、Kant の規定的判断と反省的判断も、測定の座標の候補になる。","quote":{"paper":"T2","text":"it is not the only philosophical distinction that could serve as a measurement coordinate","line":119,"anchor":"t2-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-4-p2","unit":"t2-3-4","k":2,"lines":[121,121],"label":"Sollen の下位分類","does":"限定","says":"Nagel の分類は、Sollen 型の成分をさらに分けられることを示唆する。本稿の手順は Sollen 型を分けずに扱い、下位分類は先送りする。どう細かく分けても、Sein 型の評価には還元できない。","quote":{"paper":"T2","text":"sub-classification is deferred","line":121,"anchor":"t2-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-3-4-p3","unit":"t2-3-4","k":3,"lines":[123,123],"label":"Do 型と Sin 型","does":"含意","says":"評価の基準が社会の実践に定着することは、Sollen 型の仕様の中での状態の変化で、Sein 型への変換ではない。実践で保たれる状態（Do 型）は、規則や標準として成文化されると Sin 型になり、AI が文面の規則性として再現しやすくなる。ただし AI は、その取り決めが権威を得た正統性までは受け継がない。解釈上の拡張で、採点の次元ではない。","quote":{"paper":"T2","text":"This dynamic distinction is introduced as an interpretive extension, not as an additional scoring dimension in the present protocol.","line":123,"anchor":"t2-3-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-p1","unit":"t2-4","k":1,"lines":[127,127],"label":"行列の分析へ","does":"枠","says":"区別が過程と直交することを使い、SECI の四つの過程を、外化のコスト、Sein 型の仕様、Sollen 型の仕様の成分に分ける。原典の解釈ではなく、構成的な精緻化である。","quote":{"paper":"T2","text":"The re-description is not an exegesis of the original model but a constructive refinement","line":127,"anchor":"t2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-1-p1","unit":"t2-4-1","k":1,"lines":[131,131],"label":"外化：コストが支配","does":"主張","says":"外化は、外化のコストが支配的な過程で、AI はこれを大きく圧縮する。何を外に出すべきか、何を伏せるかという Sollen 型の仕様は、変換が楽になっても変わらない。","quote":{"paper":"T2","text":"does not change merely because the conversion has become easier","line":131,"anchor":"t2-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-2-p1","unit":"t2-4-2","k":1,"lines":[135,135],"label":"結合：AI が最も強い","does":"主張","says":"結合は、すでに形になった知識への操作で、外化のコストの比重がいちばん大きく、AI がいちばん速めやすい。どの組み合わせに意味があるかの判断は評価の段階でだけ入り、自動化されない。","quote":{"paper":"T2","text":"The Combination process itself is largely automatable","line":135,"anchor":"t2-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-3-p1","unit":"t2-4-3","k":1,"lines":[139,139],"label":"社会化：Sollen の場","does":"主張","says":"社会化は、Sollen 型の仕様がいちばん集まる過程で、価値判断が作られ、争われ、改められる。AI は別の見方を出して参加できるが、そこで生まれる規範的なコミットメントの正統性の源にはなれない。境界がいちばんよく見える場所である。","quote":{"paper":"T2","text":"The delegation legitimacy boundary is most visible here.","line":139,"anchor":"t2-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-4-p1","unit":"t2-4-4","k":1,"lines":[143,143],"label":"内面化：触媒として","does":"主張","says":"内面化は Sein 型の仕様に重みがあり、AI は成文化された知識の吸収を速める触媒になれる。ただし内面化には、何が大事かという評価の向きが実践を通じて育つ面があり、AI はその形成の代わりにはなれない。","quote":{"paper":"T2","text":"it cannot substitute for the experiential formation of evaluative judgment","line":143,"anchor":"t2-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-5-p1","unit":"t2-4-5","k":1,"lines":[147,158],"label":"表：四過程の分解","does":"まとめ","says":"表 1 が分解をまとめる。AI の効果が最大なのは、外化のコストが支配的な外化と結合。最小なのは、Sollen 型が支配的な社会化。内面化はその中間にある。","quote":{"paper":"T2","text":"The pattern is structural.","line":158,"anchor":"t2-4-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-5-p2","unit":"t2-4-5","k":2,"lines":[160,160],"label":"律速段階が移る","does":"主張","says":"順に進む循環で二つの過程だけが大きく速まると、全体の速さを決める段階は、速まらなかった過程へ移る。SECI では社会化と内面化である。経験的な発見ではなく、行列から出る分析的な帰結である。","quote":{"paper":"T2","text":"AI acceleration of E and C shifts the effective bottleneck to S and I","line":160,"anchor":"t2-4-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-5-p3","unit":"t2-4-5","k":3,"lines":[162,162],"label":"値は理論上のもの","does":"限定","says":"表の値は理論上の割り当てで、測った量ではない。行列が与えるのは測定ではなく、どの升目に AI が出せない仕様があるかを見えるようにすることである。","quote":{"paper":"T2","text":"The matrix values in Table 1 are theoretical assignments","line":162,"anchor":"t2-4-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-4-5-p4","unit":"t2-4-5","k":4,"lines":[164,164],"label":"Sein だけが移る","does":"主張","says":"Sein 型の仕様は、循環を重ねるうちに成文化され、決まった処理に取り込まれていく。Sollen 型はそうならず、制度の上で、人の評価の権威に結び付いたまま残る。","quote":{"paper":"T2","text":"Sollen-type specification does not undergo this transition.","line":164,"anchor":"t2-4-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-5-p1","unit":"t2-5","k":1,"lines":[168,168],"label":"証拠の位置づけ","does":"限定","says":"本稿は概念と操作の提案で、実証研究ではない。ただし分解は構造的な予測を生み、この枠組みを試すために設計されたのではない独立の証拠が、その予測と整合する型を示している。","quote":{"paper":"T2","text":"is a conceptual-operational contribution, not an empirical study","line":168,"anchor":"t2-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-5-1-p1","unit":"t2-5-1","k":1,"lines":[172,172],"label":"予測的妥当性","does":"根拠","says":"仕様の質が、外化の質とは独立に出力の質を決める、という予測と整合する観察を三つ挙げる。先行論文の事例、学生百人の実験、そして脆弱性の発見が飽和したあとで選別と優先づけが滞った産業規模の例である。","quote":{"paper":"T2","text":"The resulting bottleneck was not further vulnerability discovery but triage, remediation priority, and coordination among partner organizations","line":172,"anchor":"t2-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-5-2-p1","unit":"t2-5-2","k":1,"lines":[176,176],"label":"弁別的妥当性","does":"根拠","says":"成分は独立に動く、という予測と整合する観察を挙げる。二百万本の原稿では文章の質が上がっても採択率は変わらず、専門知を抜いた条件では Sollen の行がゼロに落ちて Sein の行は一部残った。","quote":{"paper":"T2","text":"a counterfactual demonstration that the two components can be dissociated","line":176,"anchor":"t2-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-5-3-p1","unit":"t2-5-3","k":1,"lines":[180,180],"label":"別分野からの支持","does":"根拠","says":"再現研究、分野をまたぐ共在、コンテンツの審査、数学の出力の分析が、別々の角度から同じ分解を指している。T
