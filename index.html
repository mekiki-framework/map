ao が smell test と呼ぶ、数学の議論を見分ける判断は、この枠組みの語では Sollen 型の仕様の判断にあたる。形式の正しさと数学的な洞察のずれは、同じ分解を、離れた分野で独立に観察したものである。","quote":{"paper":"T2","text":"unprecedented separation of form and thought","line":180,"anchor":"t2-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-5-3-p2","unit":"t2-5-3","k":2,"lines":[182,182],"label":"隣の語彙の三研究","does":"根拠","says":"組織科学、機械学習、評価理論の三つの研究は、アッセイを直接試してはいないが、同じ非対称を別の語彙で記録している。","quote":{"paper":"T2","text":"none tests the assay directly, but each registers the same asymmetry in a neighboring vocabulary","line":182,"anchor":"t2-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-5-4-p1","unit":"t2-5-4","k":1,"lines":[186,186],"label":"失敗の二つの型","does":"限定","says":"偽陽性は、外化の質の高さが仕様の欠如を隠すときに起きる。迎合的な AI の出力は、独立の根拠なしに利用者の規範的なコミットメントを強めうる。偽陰性は、外化の摩擦が本物の仕様を見えなくするときに起きる。","quote":{"paper":"T2","text":"In the assay's terms, sycophancy inflates the Sollen row without grounding it.","line":186,"anchor":"t2-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-p1","unit":"t2-6","k":1,"lines":[190,190],"label":"測定から境界へ","does":"枠","says":"含意の中心は、AI が判断に寄与できないということではなく、仕様の成分によって外に出しやすさが違うということである。ここから、正統な委任の実際の境界へ進む。","quote":{"paper":"T2","text":"different components of specification differ in their susceptibility to externalization","line":190,"anchor":"t2-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-1-p1","unit":"t2-6-1","k":1,"lines":[194,196],"label":"抗菌薬の処方の例","does":"例","says":"同じ構造の配置が、独立の分野で実装されている。抗菌薬の処方の試験では、AI が菌の感受性を予測し、臨床医が治療の選好を重みづけた。AI が事実の不確かさを除いたので、臨床医が前から持っていた価値の選好が処方に反映された、と本稿は読む。","quote":{"paper":"T2","text":"AI removed Sein-type uncertainty from the prescribing decision","line":196,"anchor":"t2-6-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-1-p2","unit":"t2-6-1","k":2,"lines":[198,198],"label":"COMPAS の例","does":"例","says":"刑事司法のリスク評価では、逆の型が記録された。再犯確率という事実の出力が、量刑を正当化する根拠として扱われ、技術的な理由が規範的な根拠にすり替えられた。","quote":{"paper":"T2","text":"technical rationales were laundered into normative warrants","line":198,"anchor":"t2-6-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-1-p3","unit":"t2-6-1","k":3,"lines":[200,200],"label":"二つの例の読み方","does":"限定","says":"枠組みは両方の例を構造として読めるようにするが、Sein と Sollen の分離が成否の唯一の原因だとは主張しない。うまくいった所と崩れた所を言い表す語彙を与える。","quote":{"paper":"T2","text":"without claiming that the Sein/Sollen separation was the sole cause of success or failure","line":200,"anchor":"t2-6-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-2-p1","unit":"t2-6-2","k":1,"lines":[204,204],"label":"AGI の議論へ","does":"含意","says":"いまの大規模言語モデルは、分野を問わない触媒として働く。外化のコストの処理は一般化したが、何が大事かという仕様の判断は利用者に依っている。処理の一般化と判断の一般化を混同すると、議論が混乱する。","quote":{"paper":"T2","text":"LLM externalization-cost processing has generalized; specification judgment has not.","line":204,"anchor":"t2-6-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-3-p1","unit":"t2-6-3","k":1,"lines":[208,208],"label":"出力に残るもの","does":"含意","says":"境界の論理は、言語モデルの出力そのものの統治にも及ぶ。出力には、評価の重みづけや暗黙の優先順位のような、行為者に相対的な成分が残りうる。それは除く対象ではなく、表示する対象になる。そうした応用の設計と検証は、本稿の範囲の外にある。","quote":{"paper":"T2","text":"components whose presence requires labeling rather than elimination","line":208,"anchor":"t2-6-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-4-p1","unit":"t2-6-4","k":1,"lines":[212,212],"label":"射程","does":"限定","says":"射程は、読み直した SECI の過程までである。空腹や痛みのように前もって共有されている身体の事実は、枠組みの外にある。表の値は理論上の割り当てで、個人の認知、組織の設計、政策への拡張は、それぞれの分野の専門家に属する。","quote":{"paper":"T2","text":"The assay's scope is delimited by the SECI processes it re-describes.","line":212,"anchor":"t2-6-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-4-p2","unit":"t2-6-4","k":2,"lines":[214,214],"label":"使う人による違い","does":"限定","says":"外化のコストがなくなる効果は一様ではなく、利用者の内なる評価の基準の強さに依る。基準が育っていれば表現の解放として働き、もろければ AI の出力が代わりの基準になりうる。","quote":{"paper":"T2","text":"The effect of externalization-cost removal is not uniform across users.","line":214,"anchor":"t2-6-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-4-p3","unit":"t2-6-4","k":3,"lines":[216,216],"label":"専門家の独裁ではない","does":"限定","says":"境界は、専門家の権威主義を許すものではない。正統性の源には異議を唱えることができ、監査で確かめられなければならない。境界は責任の境界でもなく、規範の権威を人に置いても、技術や制度の責務が自動的に移るわけではない。採点表が形だけの点検表になれば、道具の目的に反する。","quote":{"paper":"T2","text":"The delegation legitimacy boundary is not a warrant for expert authoritarianism.","line":216,"anchor":"t2-6-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-4-p4","unit":"t2-6-4","k":4,"lines":[218,220],"label":"代理指標の崩れ","does":"含意","says":"AI が外化のコストを下げると、流暢さ、長さ、仕上がりといった知的労働の代理指標は、仕様の質の指標として当てにしにくくなる。アッセイはこれへの一つの応答である。手順そのものも、区分や基準に異議を唱えられる状態を保たなければならない。","quote":{"paper":"T2","text":"The assay is one response to this proxy collapse","line":218,"anchor":"t2-6-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-4-p5","unit":"t2-6-4","k":5,"lines":[222,222],"label":"推測的な含意","does":"含意","says":"明示的に推測として述べる含意。アッセイの語彙は、人の判断を測るだけでなく、AI の内部の構造を記述することにも使えるかもしれない。本稿の範囲の外に置く。","quote":{"paper":"T2","text":"A final, explicitly speculative implication remains outside the present article","line":222,"anchor":"t2-6-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-6-5-p1","unit":"t2-6-5","k":1,"lines":[226,226],"label":"Do 型という名前","does":"位置づけ","says":"実践で保たれる Sollen 型の仕様を Do 型と呼ぶのは、発見的な使い方で、文化の本質を言うものではない。採点手順を日本文化から導くのではなく、隣り合う規範が制度化されても実践で保たれる形に名前を付ける。","quote":{"paper":"T2","text":"This use is heuristic, not essentialist","line":226,"anchor":"t2-6-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-7-p1","unit":"t2-7","k":1,"lines":[230,230],"label":"何をしたか","does":"まとめ","says":"仕様の内側の分解を導き、「である」と「べきである」の区別に基づけ、認知アッセイの軸として操作化した。人の判断が大事だという議論をもう一つ足したのではなく、判断を分ける道具を出した。","quote":{"paper":"T2","text":"but an instrument for decomposing it","line":230,"anchor":"t2-7","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-7-p2","unit":"t2-7","k":2,"lines":[232,232],"label":"詰まる所は人の過程","does":"まとめ","says":"AI が行き渡った知識創造では、詰まる所は専門知を形にすることではなく、出力に向きを与える評価的コミットメントを作り、更新することになる。AI への投資だけでは速められず、人の過程への投資が、構造上の補完として要る。","quote":{"paper":"T2","text":"AI investment alone cannot accelerate this bottleneck.","line":232,"anchor":"t2-7","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-7-p3","unit":"t2-7","k":3,"lines":[234,234],"label":"認知の再生産","does":"含意","says":"危険は正確さだけでなく、認知の再生産にもある。委任が、正統性を保つ学びと評価の代わりになると、成文化された知識に手が届く人は増えても、状況に根ざした判断を育てる営みは弱まりうる。採点手順は実際的な安全策として働く。","quote":{"paper":"T2","text":"as a problem not only of accuracy but of cognitive reproduction","line":234,"anchor":"t2-7","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-7-p4","unit":"t2-7","k":4,"lines":[236,238],"label":"次の問いと、守るもの","does":"まとめ","says":"アッセイが示したのは、人の判断のうち捨てるべきでない部分である。捨てるべき部分の構造的な記述が、次の問いになる。このアッセイが守る助けになるのは、人が自分の仕事を導く目的を定める権威を保つ領域である。","quote":{"paper":"T2","text":"The assay has shown which parts of human judgment ought not to be discarded.","line":236,"anchor":"t2-7","match":"exact"},"basis":"reading","vis":"public"},{"id":"t2-postscript-p1","unit":"t2-postscript","k":1,"lines":[244,244],"label":"後記：庭の比喩","does":"位置づけ","says":"目利きは、本稿が哲学の分解と測定の手順で操作化した実践の、日常の名前である。評価の権威の領域は、一度線を引けば済むものではなく、手入れを続けるものとして、庭にたとえられる。比喩は本文では展開しない。","quote":{"paper":"T2","text":"a region of evaluative authority that requires continuous cultivation rather than one-time demarcation","line":244,"anchor":"t2-postscript","match":"exact"},"basis":"reading","vis":"public"}],"links":[{"id":"k-t2-1-p1--t2-2-1-p1","from":"t2-1-p1","to":"t2-2-1-p1","rel":"受ける","note":"序論が残した問い（仕様の内側）を、三つの概念を分けたうえで立て直す。","basis":"reading","vis":"public"},{"id":"k-t2-1-p2--t2-2-3-p3","from":"t2-1-p2","to":"t2-2-3-p3","rel":"言い換える","note":"根拠を正統な源までたどれなければならない、という論点を、境界の述べ方として言い直す。","basis":"reading","vis":"public"},{"id":"k-t2-1-p3--t2-7-p3","from":"t2-1-p3","to":"t2-7-p3","rel":"受ける","note":"序論で引いた暗黙知への懸念を、認知の再生産の問題として受け直す。","basis":"reading","vis":"public"},{"id":"k-t2-1-p4--t2-3-2-p1","from":"t2-1-p4","to":"t2-3-2-p1","rel":"受ける","note":"欠けているとした測る仕組みを、五段階の手順として示す。","basis":"reading","vis":"public"},{"id":"k-t2-1-p5--t2-6-2-p1","from":"t2-1-p5","to":"t2-6-2-p1","rel":"使う","note":"境界は能力の主張ではないという点を使って、処理の一般化と判断の一般化を分ける。","basis":"reading","vis":"public"},{"id":"k-t2-2-2-p1--t2-3-3-p1","from":"t2-2-2-p1","to":"t2-3-3-p1","rel":"使う","note":"事例から取り出した二種類の判断を、実際に採点してみせる。","basis":"reading","vis":"public"},{"id":"k-t2-2-2-p2--t2-3-2-p2","from":"t2-2-2-p2","to":"t2-3-2-p2","rel":"使う","note":"表示しないと決めた判断を、AI が取り出せない判断の例として使う。","basis":"reading","vis":"public"},{"id":"k-t2-2-2-p3--t2-3-2-p5","from":"t2-2-2-p3","to":"t2-3-2-p5","rel":"使う","note":"混成を二値にしないという限定を、比率プロファイルの報告として手順にする。","basis":"reading","vis":"public"},{"id":"k-t2-2-3-p2--t2-3-2-p6","from":"t2-2-3-p2","to":"t2-3-2-p6","rel":"使う","note":"行為者に相対的な理由は還元できない、という論拠を使って、採点者の非対称を構造の帰結とする。","basis":"reading","vis":"public"},{"id":"k-t2-2-3-p3--t2-4-5-p4","from":"t2-2-3-p3","to":"t2-4-5-p4","rel":"言い換える","note":"Sein の側だけが処理に取り込まれうるという点を、SECI の循環の中の移り変わりとして述べ直す。","basis":"reading","vis":"public"},{"id":"k-t2-2-3-p5--t2-3-4-p3","from":"t2-2-3-p5","to":"t2-3-4-p3","rel":"受ける","note":"実践者の力と環境の規範を分けたうえで、力の側の規範が制度に定着するときの状態の変化を述べる。","basis":"reading","vis":"public"},{"id":"k-t2-2-4-p1--t2-4-p1","from":"t2-2-4-p1","to":"t2-4-p1","rel":"使う","note":"過程と直交するという主張を使って、四つの過程を成分に分ける。","basis":"reading","vis":"public"},{"id":"k-t2-2-4-p3--t2-6-4-p1","from":"t2-2-4-p3","to":"t2-6-4-p1","rel":"言い換える","note":"分析の水準の限定を、射程としてもう一度述べる。","basis":"reading","vis":"public"},{"id":"k-t2-3-1-p1--t2-5-2-p1","from":"t2-3-1-p1","to":"t2-5-2-p1","rel":"支える","note":"二つの成分が独立に動くという前提を、大規模な観察で支える。","basis":"reading","vis":"public"},{"id":"k-t2-3-2-p6--t2-6-1-p1","from":"t2-3-2-p6","to":"t2-6-1-p1","rel":"支える","note":"採点者の非対称と同じ配置が、独立の分野で実装されている例を示す。","basis":"reading","vis":"public"},{"id":"k-t2-3-2-p9--t2-5-4-p1","from":"t2-3-2-p9","to":"t2-5-4-p1","rel":"言い換える","note":"手順の節で挙げた二つの失敗の型を、証拠と合わせて詳しく述べる。","basis":"reading","vis":"public"},{"id":"k-t2-3-3-p3--t2-5-p1","from":"t2-3-3-p3","to":"t2-5-p1","rel":"受ける","note":"著者自身の事例に拠る限界を受けて、独立の証拠を妥当性の種類ごとに並べる。","basis":"reading","vis":"public"},{"id":"k-t2-3-4-p3--t2-6-p1","from":"t2-3-4-p3","to":"t2-6-p1","rel":"使う","note":"Do 型と Sin 型の区別を使って、どの成分が外に出しやすいかを述べる。","basis":"reading","vis":"public"},{"id":"k-t2-3-4-p3--t2-6-5-p1","from":"t2-3-4-p3","to":"t2-6-5-p1","rel":"限定する","note":"Do 型という名前が発見的な使い方であることを断る。","basis":"reading","vis":"public"},{"id":"k-t2-4-1-p1--t2-4-5-p1","from":"t2-4-1-p1","to":"t2-4-5-p1","rel":"まとめる","note":"四つの過程の分解を、表にまとめる。","basis":"reading","vis":"public"},{"id":"k-t2-4-5-p2--t2-5-1-p1","from":"t2-4-5-p2","to":"t2-5-1-p1","rel":"支える","note":"外化が飽和したあとで選別と調整が滞った例が、律速段階が移るという帰結と整合する。","basis":"reading","vis":"public"},{"id":"k-t2-4-5-p2--t2-7-p2","from":"t2-4-5-p2","to":"t2-7-p2","rel":"まとめる","note":"律速段階の移りを、何に投資するかの含意として結ぶ。","basis":"reading","vis":"public"},{"id":"k-t2-4-5-p3--t2-6-4-p1","from":"t2-4-5-p3","to":"t2-6-4-p1","rel":"言い換える","note":"表の値が理論上の割り当てであることを、限界としてもう一度述べる。","basis":"reading","vis":"public"},{"id":"k-t2-5-3-p1--t2-6-3-p1","from":"t2-5-3-p1","to":"t2-6-3-p1","rel":"使う","note":"形式と思考の分離という観察を、出力に残る成分の話に使う。","basis":"reading","vis":"public"},{"id":"k-t2-5-4-p1--t2-6-4-p2","from":"t2-5-4-p1","to":"t2-6-4-p2","rel":"受ける","note":"迎合による偽陽性を受けて、利用者の内なる基準の強さで効果が分かれることを述べる。","basis":"reading","vis":"public"}],"ok":1},"T3":{"tiers":[{"id":"t3-abstract","no":"","title":"Abstract","line":9,"units":["t3-abstract"]},{"id":"t3-1","no":"1","title":"Introduction","line":13,"units":["t3-1"]},{"id":"t3-2","no":"2","title":"Decomposing learner agency by delegability","line":31,"units":["t3-2-1","t3-2-2","t3-2-3","t3-2-4","t3-2-5"]},{"id":"t3-3","no":"3","title":"A design conjecture: encounter, crystallization, conversion","line":76,"units":["t3-3"]},{"id":"t3-4","no":"4","title":"What the decomposition isolates","line":86,"units":["t3-4-1","t3-4-2","t3-4-3","t3-4-4"]},{"id":"t3-5","no":"5","title":"The two-layer prescription","line":118,"units":["t3-5","t3-5-1","t3-5-2","t3-5-3","t3-5-4"]},{"id":"t3-6","no":"6","title":"Boundary conditions and research agenda","line":156,"units":["t3-6"]},{"id":"t3-7","no":"7","title":"Conclusion","line":160,"units":["t3-7"]},{"id":"t3-practitioner-notes","no":"","title":"Practitioner Notes","line":164,"units":["t3-practitioner-notes"]}],"units":[{"id":"t3-abstract","tier":"t3-abstract","no":"","title":"Abstract","intro":false,"line_start":9,"line_end":12,"paras":1,"size":222,"first":{"text":"When AI can plan, draft, and revise, what remains for the learner? This article argues that the question cannot be answered while *agency* is treated as monolithic, and decomposes learner agency by delegability — jointly with its educational companions, traina","line":11,"cut":true}},{"id":"t3-1","tier":"t3-1","no":"1","title":"Introduction","intro":false,"line_start":13,"line_end":30,"paras":8,"size":1199,"first":{"text":"Generative AI has made learner agency the contested center of educational technology.","line":15,"cut":false}},{"id":"t3-2-1","tier":"t3-2","no":"2.1","title":"The choice of axis","intro":false,"line_start":33,"line_end":38,"paras":2,"size":199,"first":{"text":"Decompositions serve questions.","line":35,"cut":false}},{"id":"t3-2-2","tier":"t3-2","no":"2.2","title":"Three components","intro":false,"line_start":39,"line_end":42,"paras":1,"size":282,"first":{"text":"Cut this way, learner agency can be provisionally distinguished into three analytic dimensions — a working schema warranted by intervention divergence rather than claimed as a psychologically exhaustive taxonomy. *Direction* is what the learner is oriented tow","line":41,"cut":true}},{"id":"t3-2-3","tier":"t3-2","no":"2.3","title":"Two forms of magnitude","intro":false,"line_start":43,"line_end":46,"paras":1,"size":190,"first":{"text":"Magnitude is not a single quantity.","line":45,"cut":false}},{"id":"t3-2-4","tier":"t3-2","no":"2.4","title":"The sort","intro":false,"line_start":47,"line_end":71,"paras":6,"size":439,"first":{"text":"Delegability is applied here jointly with its educational companions — trainability (can deliberate practice develop it?) and measurability (can its current state be observed?).","line":49,"cut":false}},{"id":"t3-2-5","tier":"t3-2","no":"2.5","title":"What the sort shows about distribution","intro":false,"line_start":72,"line_end":75,"paras":1,"size":192,"first":{"text":"Set this result against the distribution account of agency.","line":74,"cut":false}},{"id":"t3-3","tier":"t3-3","no":"3","title":"A design conjecture: encounter, crystallization, conversion","intro":false,"line_start":76,"line_end":85,"paras":4,"size":547,"first":{"text":"If direction cannot be installed, where does it come from? We propose a design conjecture in three movements: embodied encounter with a problem-holder may contribute to the crystallization of evaluative commitment, and an endorsed direction may then anchor ava","line":78,"cut":true}},{"id":"t3-4-1","tier":"t3-4","no":"4.1","title":"A different kind of remainder","intro":false,"line_start":88,"line_end":93,"paras":2,"size":298,"first":{"text":"Direction resisted distribution, but it remained a component — something a learner comes to have.","line":90,"cut":false}},{"id":"t3-4-2","tier":"t3-4","no":"4.2","title":"Not an artifact of the axis","intro":false,"line_start":94,"line_end":97,"paras":1,"size":228,"first":{"text":"An objection should be met before anything is built on the claim: that the delegability axis was constructed to exclude answerability, so its isolation is trivial — true by definition.","line":96,"cut":false}},{"id":"t3-4-3","tier":"t3-4","no":"4.3","title":"The second-personal ground","intro":false,"line_start":98,"line_end":105,"paras":3,"size":507,"first":{"text":"What kind of fact is answerability, if not a capacity? Here the paper borrows, and the borrowing must be marked precisely.","line":100,"cut":false}},{"id":"t3-4-4","tier":"t3-4","no":"4.4","title":"What the relation grounds","intro":false,"line_start":106,"line_end":117,"paras":5,"size":643,"first":{"text":"Three matters must not be conflated: answerability as a relational standing; answer-giving competence as a developable capacity; and answerable practice as the observable enactment of that standing.","line":108,"cut":false}},{"id":"t3-5","tier":"t3-5","no":"5","title":"The two-layer prescription","intro":true,"line_start":118,"line_end":121,"paras":1,"size":108,"first":{"text":"The two-layer structure yields a two-layer prescription, and the layers — though pedagogically concurrent — must not be conflated.","line":120,"cut":false}},{"id":"t3-5-1","tier":"t3-5","no":"5.1","title":"Layer one: an analytic compass","intro":false,"line_start":122,"line_end":129,"paras":3,"size":394,"first":{"text":"*Principle.* The OECD's Learning Compass 2030 placed agency at the center of a framework for how learners navigate an uncertain world, but it is a compass that points a direction to travel, not one that resolves that direction into components an educator can r","line":124,"cut":true}},{"id":"t3-5-2","tier":"t3-5","no":"5.2","title":"Layer one: encounter engineering","intro":false,"line_start":130,"line_end":139,"paras":4,"size":413,"first":{"text":"*Principle.* If encounter can contribute to direction formation (Section 3), then curricula can be designed for encounter density: structured contact with problem-holders, early and embodied, before competence would conventionally \"justify\" it.","line":132,"cut":false}},{"id":"t3-5-3","tier":"t3-5","no":"5.3","title":"Layer one: AI guardrails","intro":false,"line_start":140,"line_end":147,"paras":3,"size":268,"first":{"text":"*A prior distinction.* Performance delegation and developmental delegation are different objects: offloading production can raise artifact quality while leaving knowledge and transfer unchanged (Fan et al., 2025).","line":142,"cut":false}},{"id":"t3-5-4","tier":"t3-5","no":"5.4","title":"Layer two: the second person","intro":false,"line_start":148,"line_end":155,"paras":3,"size":459,"first":{"text":"*Principle.* The standing of answerability is conferred by the relation itself; what grows is the learner's competence to answer well, and that competence, however rehearsed, is normatively tested and sustained only in second-personal exchange: being questione","line":150,"cut":true}},{"id":"t3-6","tier":"t3-6","no":"6","title":"Boundary conditions and research agenda","intro":false,"line_start":156,"line_end":159,"paras":1,"size":359,"first":{"text":"What this article leaves to others is collected here as testable commitments rather than scattered disclaimers.","line":158,"cut":false}},{"id":"t3-7","tier":"t3-7","no":"7","title":"Conclusion","intro":false,"line_start":160,"line_end":163,"paras":1,"size":206,"first":{"text":"What remains for the learner when AI can do the work? The question dissolves once agency is decomposed along the axis the question itself supplies.","line":162,"cut":false}},{"id":"t3-practitioner-notes","tier":"t3-practitioner-notes","no":"","title":"Practitioner Notes","intro":false,"line_start":164,"line_end":181,"paras":10,"size":210,"first":{"text":"- Generative AI systems now plan, draft, and revise, making learner agency a central contested concept in educational technology.","line":167,"cut":false}}],"refs":[{"from":"t3-1","to":"t3-4-1","to_no":"4","line":19,"text":"What it does not ask is whether everything gathered under agency migrates — and, as Section 4 argues, what appears at the summit of that account (whose judgment it remains, who must answer for it) is what a finer distribution analysis isolates rather than distributes.","cut":false,"dir":"fwd"},{"from":"t3-1","to":"t3-2-1","to_no":"2","line":25,"text":"Section 2 performs the decomposition and the sort.","cut":false,"dir":"fwd"},{"from":"t3-1","to":"t3-3","to_no":"3","line":25,"text":"Section 3 proposes a design conjecture for the component that resists installation.","cut":false,"dir":"fwd"},{"from":"t3-1","to":"t3-4-1","to_no":"4","line":25,"text":"Section 4 establishes what the decomposition isolates, and grounds it second-personally.","cut":false,"dir":"fwd"},{"from":"t3-1","to":"t3-5","to_no":"5","line":25,"text":"Section 5 derives a prescription across two pedagogically concurrent layers, stating in each case what is deliberately left to those who must answer for it.","cut":false,"dir":"fwd"},{"from":"t3-1","to":"t3-2-1","to_no":"2","line":29,"text":"The decomposition in §2 works entirely on the first layer; §4 shows what it exposes on the second.","cut":false,"dir":"fwd"},{"from":"t3-1","to":"t3-4-1","to_no":"4","line":29,"text":"The decomposition in §2 works entirely on the first layer; §4 shows what it exposes on the second.","cut":false,"dir":"fwd"},{"from":"t3-2-3","to":"t3-3","to_no":"3","line":45,"text":"How that capture happens is the subject of Section 3.","cut":false,"dir":"fwd"},{"from":"t3-2-4","to":"t3-3","to_no":"3","line":55,"text":"The conditions under which this conversion may occur are addressed by the design conjecture in Section 3.","cut":false,"dir":"fwd"},{"from":"t3-2-4","to":"t3-5","to_no":"5","line":57,"text":"become integrated, rather than merely complied with, only under conditions that are relational as much as informational (Ryan & Deci, 2000) — a finding whose second-personal undertone Section 5 returns to.","cut":true,"dir":"fwd"},{"from":"t3-2-4","to":"t3-4-1","to_no":"4","line":70,"text":"Section 4 establishes this standing.","cut":false,"dir":"fwd"},{"from":"t3-3","to":"t3-2-1","to_no":"2","line":80,"text":"Crystallization needs a supersaturated solution and a nucleation site: the available activation of Section 2 is the supersaturation — energy without an object — and the embodied encounter supplies the site.","cut":false,"dir":"back"},{"from":"t3-3","to":"t3-5","to_no":"5","line":84,"text":"What such design looks like in practice, and what it deliberately leaves alone, is the work of Section 5.","cut":false,"dir":"fwd"},{"from":"t3-4-4","to":"t3-2-1","to_no":"2","line":110,"text":"The difference is not one of degree along any of Section 2's dimensions; it is the difference between refusing a relation and being unable to stand in one.","cut":false,"dir":"back"},{"from":"t3-5","to":"t3-6","to_no":"6","line":120,"text":"For each prescription we state a principle and one worked example, and we say explicitly what is left to others (these residues are collected as a research agenda in Section 6); the restraint is not modesty for its own sake but the framework's own discipline — a","cut":true,"dir":"fwd"},{"from":"t3-5-2","to":"t3-3","to_no":"3","line":132,"text":"If encounter can contribute to direction formation (Section 3), then curricula can be designed for encounter density: structured contact with problem-holders, early and embodied, before competence would conventionally \"justify\" it.","cut":false,"dir":"back"},{"from":"t3-7","to":"t3-2-1","to_no":"2","line":162,"text":"Many functions gathered under agency may be supported or partially offloaded when the design preserves development, transfer, error detection, and independent judgment — the sort in Section 2 says where, and layer one of the prescription says how.","cut":false,"dir":"back"}],"figs":[{"kind":"table","no":1,"label":"Table 1","caption":"Table 1. Learner agency under the delegability axis.","line":61,"anchor":"t3-2-4","unit":"t3-2-4","omitted":false,"match":"normalized"},{"kind":"figure","no":1,"label":"Figure 1","caption":"Figure 1 (image omitted). Direction, drive (available activation and motivational drive), and mode are properties the learner has, shown as boxes within the dashed component region.","line":92,"anchor":"t3-4-1","unit":"t3-4-1","omitted":true,"match":"normalized"}],"parts":[{"id":"t3-abstract-p1","unit":"t3-abstract","k":1,"lines":[11,11],"label":"要旨","does":"まとめ","says":"学習者の主体性を、心理の機能ではなく、委ねられるかどうかで分ける。多くの成分は、支援し、訓練し、転換することができる。分解は、能力の分析では答えられない問い（その判断について誰が答えなければならないか）を露わにする。この問いが取り出すのが、答える立場である。","quote":{"paper":"T3","text":"decomposes learner agency by delegability","line":11,"anchor":"t3-abstract","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-1-p1","unit":"t3-1","k":1,"lines":[15,15],"label":"一つの量という前提","does":"枠","says":"禁止も放任も、主体性を、AI が脅かすか脅かさないかの一つの量として扱っている。本稿が調べるのはこの前提である。","quote":{"paper":"T3","text":"Both responses treat agency as a single quantity that AI either threatens or does not.","line":15,"anchor":"t3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-1-p2","unit":"t3-1","k":2,"lines":[17,21],"label":"三つの流れ","does":"位置づけ","says":"主体性を分ける流れは三つある（機械の行為者性、人と AI の配置への分散、育てるべき個人の力）。それぞれの問いのために分けていて、教育の流れも、何を手渡してよいかは言わない。","quote":{"paper":"T3","text":"They say what agency is made of, not what may be handed over.","line":21,"anchor":"t3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-1-p3","unit":"t3-1","k":3,"lines":[23,23],"label":"問われていない問い","does":"主張","says":"どの成分が委ねられ、訓練でき、支援でき、何ができないのか、という問いを、三つの流れのどれも立てていない。関係の側でも、理論が足りないのは、その関係の規範的な構造である。","quote":{"paper":"T3","text":"What is under-theorized is not that something relational matters, but the normative structure of the relation itself.","line":23,"anchor":"t3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-1-p4","unit":"t3-1","k":4,"lines":[25,25],"label":"本稿の寄与","does":"枠","says":"主体性を委ねられるかどうかで分け、その分解が、能力の目録では答えられない問いを取り出すことを示す。答えは答える立場で、成分ではなく関係である。先行の二つの論文と操作は同じで、対象の概念が変わる。","quote":{"paper":"T3","text":"whose answer is answerability, a relation rather than a component","line":25,"anchor":"t3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-1-p5","unit":"t3-1","k":5,"lines":[27,27],"label":"隣の研究との違い","does":"位置づけ","says":"自己決定理論、興味の発達、自己調整学習、知識構築と、軸の違いを述べる。寄与は、教育の関係が大事だという発見ではなく、その中に、委ねられるかどうかの区別を示したことである。","quote":{"paper":"T3","text":"between distributed performance and the identifiable bearer of a judgment's warrant","line":27,"anchor":"t3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-1-p6","unit":"t3-1","k":6,"lines":[29,29],"label":"二つの層","does":"枠","says":"議論は、混ぜてはいけない二つの層で進む。成分を、定めた条件のもとで支援し、訓練し、転換できる能力の層（AI も正統に加われる）と、学習者が特定の他者に答える関係の層である。","quote":{"paper":"T3","text":"The argument proceeds on two layers that must not be conflated","line":29,"anchor":"t3-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-1-p1","unit":"t3-2-1","k":1,"lines":[35,35],"label":"分解は問いに仕える","does":"位置づけ","says":"既存の分解（心理の機能、時間の向き）はそれぞれの問いにはよく答えるが、何を手渡せて何を手渡せないか、という問いのために作られてはいない。","quote":{"paper":"T3","text":"Decompositions serve questions.","line":35,"anchor":"t3-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-1-p2","unit":"t3-2-1","k":2,"lines":[37,37],"label":"委ねられるかで切る","does":"枠","says":"委ねられるかという軸（訓練できるか、測れるかと合わせて）で切る。既存の構成概念との重なりは見込まれていて、寄与ではない。寄与は、新しい面が切り分けるものにある。","quote":{"paper":"T3","text":"We decompose learner agency by delegability","line":37,"anchor":"t3-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-2-p1","unit":"t3-2-2","k":1,"lines":[41,41],"label":"三つの成分","does":"定義","says":"方向（候補の状態と、是認した状態）、大きさ（駆動）、様式の三つに暫定的に分ける。粗い仕分けの箱で、心理学として網羅的だとは主張しない。分ける根拠は、介入の仕方が分かれることにある。","quote":{"paper":"T3","text":"The warrant for the triad is not psychological exhaustiveness but intervention divergence","line":41,"anchor":"t3-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-3-p1","unit":"t3-2-3","k":1,"lines":[45,45],"label":"駆動の二つの形","does":"定義","says":"大きさは一つの量ではない。いま力を動員できる度合い（使える活性。固定した特性としては扱わない）と、特定の方向に結びついて初めて成り立つ推進（動機的駆動）を分ける。前者は守れるが、説いて生み出すことはできない。","quote":{"paper":"T3","text":"Available activation can be protected, provisioned, and depleted, but not lectured into existence.","line":45,"anchor":"t3-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-4-p1","unit":"t3-2-4","k":1,"lines":[49,49],"label":"仕分けの三つの操作","does":"手続き","says":"委ねられるかに、訓練できるか、測れるかを合わせて当てる。三つは別々の操作で、一つの尺度の上の値ではない。","quote":{"paper":"T3","text":"These are distinct operations, not values on a single scale","line":49,"anchor":"t3-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-4-p2","unit":"t3-2-4","k":2,"lines":[51,55],"label":"支える・鍛える・転じる","does":"主張","says":"使える活性は、支えることも守ることもできる。様式は訓練できる。動機的駆動は、方向が定まったときに使える活性から転じる。この分析は、入学、選抜、欠陥の分類の根拠として出すものではない。","quote":{"paper":"T3","text":"this analysis is not proposed as a basis for admissions, selection, or deficit classification","line":51,"anchor":"t3-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-4-p3","unit":"t3-2-4","k":3,"lines":[57,57],"label":"方向だけが抵抗する","does":"主張","says":"抵抗するのは方向の候補の供給ではない。提案は教師にも AI にもできる。手渡せないのは、自分のものにすることである。方向は、外から注入できるものではない。","quote":{"paper":"T3","text":"Direction is not installed.","line":57,"anchor":"t3-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-4-p4","unit":"t3-2-4","k":4,"lines":[59,70],"label":"表：仕分けの結果","does":"まとめ","says":"表 1 が仕分けをまとめる。答える立場は表にない。学習者の成分ではなく、関係の上の地位だからである。判断が学習者のものである間は、代わりの者が答えることはできない。","quote":{"paper":"T3","text":"Answerability is omitted because it is a relational status rather than a learner component.","line":70,"anchor":"t3-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-2-5-p1","unit":"t3-2-5","k":1,"lines":[74,74],"label":"分け持つ説の射程","does":"限定","says":"主体性を人と AI のシステムの性質と読む説は、表の大半について正しい。仕分けが足すのは、その説が黙っている場所である。本稿は、分け持つ主体性（分散した主体性）の否定ではなく、成分の水準での限定である。","quote":{"paper":"T3","text":"silent about what does not","line":74,"anchor":"t3-2-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-3-p1","unit":"t3-3","k":1,"lines":[78,78],"label":"設計の推測","does":"予測","says":"設計上の推測を置く。問題を抱える人との直接の遭遇が、評価的コミットメントの結晶化を支えうる。是認された方向が、使える活性を動機的駆動として結びつけうる。どの動きも条件で、保証ではない。","quote":{"paper":"T3","text":"each movement names a condition, not a guarantee","line":78,"anchor":"t3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-3-p2","unit":"t3-3","k":2,"lines":[80,80],"label":"結晶のたとえ","does":"含意","says":"結晶には、過飽和の溶液と核になる場所が要る。使える活性が過飽和で、遭遇が核になる。遭遇のない励ましも、そのあとが守られない遭遇も失敗するが、どちらも動機の不足ではない。","quote":{"paper":"T3","text":"Neither failure is a motivation deficit","line":80,"anchor":"t3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-3-p3","unit":"t3-3","k":3,"lines":[82,82],"label":"三つの例示","does":"例","says":"この推測と合う経過を示す資料を、三つ挙げる。例示で、仮説を生むためのもので、確証ではない。三つ目は著者自身の研究で、独立の収束には数えられない。","quote":{"paper":"T3","text":"These sources are illustrative and hypothesis-generating rather than confirmatory","line":82,"anchor":"t3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-3-p4","unit":"t3-3","k":4,"lines":[84,84],"label":"推測の位置づけ","does":"限定","says":"設計上の推測で、実証された機構ではない。本稿には、遭遇を原因として取り出した対照研究はない。教育が保証できるのは、遭遇に触れる機会までで、結晶化ではない。","quote":{"paper":"T3","text":"it can guarantee exposure, never crystallization","line":84,"anchor":"t3-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-1-p1","unit":"t3-4-1","k":1,"lines":[90,92],"label":"別の種類の残り","does":"主張","says":"仕分けを最後まで進めて出てくるのは、もう一つの成分ではなく、成分の表に初めからなかった関係、答える立場である。方向は持つもので、答える立場は立つものである。","quote":{"paper":"T3","text":"It is a relation between the learner and those entitled to ask","line":90,"anchor":"t3-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-2-p1","unit":"t3-4-2","k":1,"lines":[96,96],"label":"軸の作り物ではない","does":"根拠","says":"答える立場を除くように軸が作られた、という反論に答える。仕分けの規則は、ふつう主体性に数えられる能力にだけ当てた。機械の主体性の詳しい説明の一つにこの語が出てこないが、それはその説明の欠落で、分野全体の不在ではない。","quote":{"paper":"T3","text":"answerability nowhere figures in the rule","line":96,"anchor":"t3-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-3-p1","unit":"t3-4-3","k":1,"lines":[100,100],"label":"二人称の根拠","does":"根拠","says":"Darwall から借りるのは、二人称の呼びかけの構造である。行為だけでなく判断の根拠にも、問われて答える担い手が要る、という拡張は本稿のもので、Darwall の本文と調和するが、そこに書かれてはいない。","quote":{"paper":"T3","text":"consonant with his text, but not stated in it","line":100,"anchor":"t3-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-3-p2","unit":"t3-4-3","k":2,"lines":[102,102],"label":"代わりに答えられない","does":"主張","says":"Darwall は、求める側の代理は認めるが、答える側は代理で現れない。責務（accountability）は制度の中で割り当て直せるが、答える立場（answerability）は移せない。AI に権威を多く与えても、立場は生じない。","quote":{"paper":"T3","text":"what cannot be done on one's behalf is precisely to answer","line":102,"anchor":"t3-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-3-p3","unit":"t3-4-3","k":3,"lines":[104,104],"label":"AI の側からの議論","does":"位置づけ","says":"AI の認知の限界から論じる研究と、分業になる。いまの限界からの議論は能力が動くたびに作り直しになるが、呼びかけの構造からの議論はそうならない。","quote":{"paper":"T3","text":"an argument from the structure of address does not","line":104,"anchor":"t3-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-4-p1","unit":"t3-4-4","k":1,"lines":[108,108],"label":"三つを混ぜない","does":"定義","says":"三つを混ぜない。関係の上の地位としての答える立場、育てられる力としての答える力量、その地位を実際に果たすふるまいとしての答える実践。","quote":{"paper":"T3","text":"Three matters must not be conflated","line":108,"anchor":"t3-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-4-p2","unit":"t3-4-4","k":2,"lines":[110,110],"label":"第二の層が支える","does":"主張","says":"第二の層は、第一の層が能力の教育に崩れるのを防ぐ。人の詐欺師には答えさせることができるが、いまの AI にはこの意味で答えさせることができない。違いは程度ではなく、関係を拒むことと、関係に立てないことの違いである。","quote":{"paper":"T3","text":"it is the difference between refusing a relation and being unable to stand in one","line":110,"anchor":"t3-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-4-p3","unit":"t3-4-4","k":3,"lines":[112,112],"label":"形而上の判定ではない","does":"限定","says":"この境界は、機械についての形而上の判定に拠らず、教育の制度がいま立場に使っている基準に関わる。学習者が AI を相手と感じることと、AI が答える立場の正統な相手であることは別である。","quote":{"paper":"T3","text":"The boundary this draws does not turn on a metaphysical verdict about machines.","line":112,"anchor":"t3-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-4-p4","unit":"t3-4-4","k":4,"lines":[114,114],"label":"外から入れない輪","does":"根拠","says":"本稿の拡張の上で、Darwall の構造上の論点を使う。二人称の概念は互いに定義し合う輪をなし、外からは入れない。だから、第一の層の能力をいくら並べても、輪に入ることにはならない。","quote":{"paper":"T3","text":"form an interdefinable circle that cannot be entered from outside it","line":114,"anchor":"t3-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-4-4-p5","unit":"t3-4-4","k":5,"lines":[116,116],"label":"条件に構造を与える","does":"主張","says":"先行論文が条件の形で述べた境界に、構造の裏づけを与える。立場は関係と制度によって割り当てられ、果たすには二人称の力量が要る。将来のシステムが力量を得る可能性は閉ざさないが、能力だけを根拠に割り当てを飛び越える道は閉ざす。","quote":{"paper":"T3","text":"what the argument forecloses is shortcutting that assignment by capability alone","line":116,"anchor":"t3-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-p1","unit":"t3-5","k":1,"lines":[120,120],"label":"二層の処方","does":"枠","says":"二つの層から二層の処方が出る。処方ごとに、原則と例を一つずつ示し、他者に残すものを明示する。委ねられない判断についての論文が、制度に属する判断を下すべきではないからである。","quote":{"paper":"T3","text":"a paper about non-delegable judgment should not deliver judgments that belong to institutions","line":120,"anchor":"t3-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-1-p1","unit":"t3-5-1","k":1,"lines":[124,124],"label":"分析の羅針盤","does":"主張","says":"学習者の主体性の成分を、一つの量として当て推量せず、別々に読む。答える立場は、個人の特性を示す得点として表すべきではない。割り当てと実際のふるまいは調べられるが、心からの是認は直接には測れない。","quote":{"paper":"T3","text":"Answerability should not be represented as an individual trait score","line":124,"anchor":"t3-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-1-p2","unit":"t3-5-1","k":2,"lines":[126,126],"label":"例：やる気がない","does":"例","says":"やる気がないように見える学習者を成分で読むと、使える活性は高く、方向がない。動機の不足ではなく結晶化する前の状態で、示される手立ては励ましではなく遭遇である。","quote":{"paper":"T3","text":"The reading is not a motivation deficit but a pre-crystallization state","line":126,"anchor":"t3-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-1-p3","unit":"t3-5-1","k":3,"lines":[128,128],"label":"残す：測定の選択","does":"限定","says":"どの測定を、どの重みで使うかの判断は、各機関に残す。自分の学習者をどう読むかも、誰かが答えなければならない判断である。","quote":{"paper":"T3","text":"whose reading of its own learners is itself a judgment someone must answer for","line":128,"anchor":"t3-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-2-p1","unit":"t3-5-2","k":1,"lines":[132,132],"label":"遭遇の設計","does":"主張","says":"遭遇が方向の形成を支えうるなら、教育課程を遭遇の密度で設計できる（遭遇工学）。臨床実習は同じ型だが、その前提は実践で制度化されたもので、本稿の意味で因果が確かめられたものではない。","quote":{"paper":"T3","text":"a premise institutionalized by practice, not causally verified in this article's terms","line":132,"anchor":"t3-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-2-p2","unit":"t3-5-2","k":2,"lines":[134,134],"label":"違和感の棚卸し","does":"例","says":"病棟のない分野では、課題を丸ごと AI に任せ、出力への違和感をすべて書き出す。流暢な出力と正しい出力の差を感じる所で、言葉になっていない評価的コミットメントが表に出る。この命題は、まだ検証されていない。","quote":{"paper":"T3","text":"the proposition remains untested","line":134,"anchor":"t3-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-2-p3","unit":"t3-5-2","k":3,"lines":[136,136],"label":"倫理上の境界","does":"限定","says":"遭遇する相手を道具にしてはならない。同意、利益の互恵性、繰り返される感情労働からの保護、振り返りは、設計の要件である。","quote":{"paper":"T3","text":"Problem-holders are not teaching materials","line":136,"anchor":"t3-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-2-p4","unit":"t3-5-2","k":4,"lines":[138,138],"label":"残す：相手と場","does":"限定","says":"どの相手と、どの場で、どんな保護のもとで遭遇するかは、分野を知る人に残す。設計が保証するのは遭遇に触れる機会までで、結晶化は保証しない。","quote":{"paper":"T3","text":"The design guarantees exposure, never crystallization, and an honest program says so.","line":138,"anchor":"t3-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-3-p1","unit":"t3-5-3","k":1,"lines":[142,142],"label":"AI のガードレール","does":"主張","says":"ガードレール（guardrails）が守るのは成果物ではなく、学習者が自分の判断について答える場面である。学習者の仕様を含む依頼と、仕様が空の依頼を見分け、空の依頼は対話へ戻す。仕様を含む依頼でも、完成させてよいかは、学習の目的、発達の段階、支援を外す計画、支援なしでの転移の基準による。","quote":{"paper":"T3","text":"Performance delegation and developmental delegation are different objects","line":142,"anchor":"t3-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-3-p2","unit":"t3-5-3","k":2,"lines":[144,144],"label":"例：作文の補助","does":"例","says":"作文の補助をする AI は、作文を頼まれると、文章を出す代わりに、通説のどこがおかしいと思うかなどを尋ね、その答えから下書きする。同じモデル、同じ能力で、既定の動きだけが違う。","quote":{"paper":"T3","text":"The same model, the same capability, a different default.","line":144,"anchor":"t3-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-3-p3","unit":"t3-5-3","k":3,"lines":[146,146],"label":"残す：二つの限界","does":"限定","says":"仕様があるかどうかの見分けは、借りた意見ですり抜けることができ、ガードレールは結果を保証しない。そして AI との対話は、答える立場を育てない。AI は学習者のコミットメントを引き出せるが、学習者が答える相手にはなれない。","quote":{"paper":"T3","text":"They do not substitute for layer two.","line":146,"anchor":"t3-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-4-p1","unit":"t3-5-4","k":1,"lines":[150,150],"label":"二人称の相手","does":"主張","says":"答える立場は関係そのものによって与えられ、育つのはうまく答える力量である。どれだけ稽古を積んでも、その力量が規範の上で試され保たれるのは、問われ、答え、その答えを引き受ける二人称のやりとりの中だけである。教育者の、代えのきかない働きは、問い、答えを引き受けさせる相手であることにある。AI は答える稽古を助け、やりとりを仲立ちできるが、答えが向けられる最後の相手の位置には立てない。問う側も、問いと基準と決定について答えなければならない。答える形は、すばやい口頭のやりとりに限らない。","quote":{"paper":"T3","text":"The educator who asks must also be answerable","line":150,"anchor":"t3-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-4-p2","unit":"t3-5-4","k":2,"lines":[152,152],"label":"懐古ではない","does":"根拠","says":"この処方は懐古ではなく構造に基づく。AI が外化と結合を速めると、律速の過程は社会化と内面化へ移る。どの配置の中でも、答える側は配置ではなく、その中の人である。","quote":{"paper":"T3","text":"the answerable party is the human in it, not the configuration","line":152,"anchor":"t3-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-5-4-p3","unit":"t3-5-4","k":3,"lines":[154,154],"label":"残す：制度の設計","does":"限定","says":"このやりとりを制度にするための、教師の育成と評価の仕組みは、含意として述べるにとどめ、それについて答える人に設計を残す。","quote":{"paper":"T3","text":"designed by those who will answer for them","line":154,"anchor":"t3-5-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-6-p1","unit":"t3-6","k":1,"lines":[158,158],"label":"検証できる命題","does":"予測","says":"他者に残したものを、検証できる四つの命題として集める（支援つきの成果と支援なしの転移の差、遭遇の多い課程の効果、実際に答える場面の効果、割り当てと実行の観察）。境界条件も同じ段落に置かれている。枠組みは、特定できる教育者がいる正規の教育のために作られている。非公式の場、大規模な場、全自動の場への拡張、言語や神経の型（ニューロタイプ）の違いをまたいで理由を示せる形式、実際に問題を抱える人が関わる遭遇の設計の倫理は、開いたままである。","quote":{"paper":"T3","text":"collected here as testable commitments rather than scattered disclaimers","line":158,"anchor":"t3-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-7-p1","unit":"t3-7","k":1,"lines":[162,162],"label":"結論","does":"まとめ","says":"手渡せないものは二種類ある。本人の是認をほかの誰も代われない成分である方向と、成分ではない、答える立場である。AI は周りのコストを変えるが、誰が誰に答えるかという関係は変えない。","quote":{"paper":"T3","text":"It is the cultivation of what was never a task.","line":162,"anchor":"t3-7","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-practitioner-notes-p1","unit":"t3-practitioner-notes","k":1,"lines":[167,168],"label":"既に知られていること","does":"位置づけ","says":"学習者の主体性が争点になっている。分け持つ説と、個人の力とする説が並行している。","quote":{"paper":"T3","text":"The two run in parallel.","line":168,"anchor":"t3-practitioner-notes","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-practitioner-notes-p2","unit":"t3-practitioner-notes","k":2,"lines":[171,174],"label":"この論文が足すもの","does":"まとめ","says":"委ねられるかによる分解、方向の形成についての推測、分解が取り出す関係としての答える立場、二つの層に合わせた処方の四つ。","quote":{"paper":"T3","text":"Answerability identified as a relation isolated, not contained, by the decomposition","line":173,"anchor":"t3-practitioner-notes","match":"exact"},"basis":"reading","vis":"public"},{"id":"t3-practitioner-notes-p3","unit":"t3-practitioner-notes","k":3,"lines":[177,180],"label":"実践への含意","does":"含意","says":"成分を別々に読む（影響の大きい診断の区分としてではなく、分析の地図として）。倫理に配慮した遭遇を入れる。仕様が空の依頼は対話へ戻す。問われ、答え、引き受けるやりとりを守る。","quote":{"paper":"T3","text":"as an analytic map rather than a high-stakes diagnostic classification","line":177,"anchor":"t3-practitioner-notes","match":"exact"},"basis":"reading","vis":"public"}],"links":[{"id":"k-t3-1-p2--t3-2-5-p1","from":"t3-1-p2","to":"t3-2-5-p1","rel":"限定する","note":"分け持つ説が当てはまる範囲を、成分の水準で限る。","basis":"reading","vis":"public"},{"id":"k-t3-1-p2--t3-4-2-p1","from":"t3-1-p2","to":"t3-4-2-p1","rel":"使う","note":"序論で見た、機械の主体性の説明に答える立場の語がないことを、反論への答えに使う。","basis":"reading","vis":"public"},{"id":"k-t3-1-p3--t3-2-1-p2","from":"t3-1-p3","to":"t3-2-1-p2","rel":"受ける","note":"誰も立てていない問いを、切る軸として採る。","basis":"reading","vis":"public"},{"id":"k-t3-1-p4--t3-7-p1","from":"t3-1-p4","to":"t3-7-p1","rel":"まとめる","note":"寄与として挙げた二つ（成分の仕分けと、関係の取り出し）を、手渡せないものの二種類として結ぶ。","basis":"reading","vis":"public"},{"id":"k-t3-1-p6--t3-5-p1","from":"t3-1-p6","to":"t3-5-p1","rel":"使う","note":"序論で示した二つの層を、処方の二つの層に使う。","basis":"reading","vis":"public"},{"id":"k-t3-2-2-p1--t3-5-1-p1","from":"t3-2-2-p1","to":"t3-5-1-p1","rel":"使う","note":"三つの成分を、学習者を読む枠として使う。","basis":"reading","vis":"public"},{"id":"k-t3-2-3-p1--t3-3-p2","from":"t3-2-3-p1","to":"t3-3-p2","rel":"使う","note":"使える活性を、結晶のたとえの過飽和にあてる。","basis":"reading","vis":"public"},{"id":"k-t3-2-4-p2--t3-practitioner-notes-p3","from":"t3-2-4-p2","to":"t3-practitioner-notes-p3","rel":"言い換える","note":"選抜や欠陥の分類に使わない、という断りを、実践への含意でもう一度述べる。","basis":"reading","vis":"public"},{"id":"k-t3-2-4-p3--t3-3-p1","from":"t3-2-4-p3","to":"t3-3-p1","rel":"受ける","note":"外から注入できない方向がどこから来るか、という問いを受ける。","basis":"reading","vis":"public"},{"id":"k-t3-2-4-p4--t3-4-1-p1","from":"t3-2-4-p4","to":"t3-4-1-p1","rel":"受ける","note":"表に載らなかった答える立場を、成分ではなく関係として取り出す。","basis":"reading","vis":"public"},{"id":"k-t3-2-4-p4--t3-4-3-p2","from":"t3-2-4-p4","to":"t3-4-3-p2","rel":"支える","note":"表の注の、代わりの者は答えられない、という点を、Darwall の非対称で支える。","basis":"reading","vis":"public"},{"id":"k-t3-2-5-p1--t3-5-4-p2","from":"t3-2-5-p1","to":"t3-5-4-p2","rel":"言い換える","note":"分け持たれないものがある、という限定を、配置の中で答えるのは人だ、と言い直す。","basis":"reading","vis":"public"},{"id":"k-t3-3-p2--t3-5-1-p2","from":"t3-3-p2","to":"t3-5-1-p2","rel":"使う","note":"結晶化する前の状態、という読みを例に使う。","basis":"reading","vis":"public"},{"id":"k-t3-3-p4--t3-5-2-p1","from":"t3-3-p4","to":"t3-5-2-p1","rel":"使う","note":"保証できるのは遭遇に触れる機会まで、という限定のもとで、課程の設計に使う。","basis":"reading","vis":"public"},{"id":"k-t3-3-p4--t3-6-p1","from":"t3-3-p4","to":"t3-6-p1","rel":"受ける","note":"推測を、検証できる命題に直す。","basis":"reading","vis":"public"},{"id":"k-t3-4-3-p1--t3-4-4-p4","from":"t3-4-3-p1","to":"t3-4-4-p4","rel":"使う","note":"判断の根拠への拡張を前提に、Darwall の構造上の点を使う。","basis":"reading","vis":"public"},{"id":"k-t3-4-4-p1--t3-5-4-p1","from":"t3-4-4-p1","to":"t3-5-4-p1","rel":"使う","note":"地位と力量の区別を使って、与えられるのは立場で、育つのは力量だと述べる。","basis":"reading","vis":"public"},{"id":"k-t3-4-4-p2--t3-4-4-p4","from":"t3-4-4-p2","to":"t3-4-4-p4","rel":"支える","note":"二人称の概念が閉じた輪をなすことが、違いは程度ではない、という主張を支える。","basis":"reading","vis":"public"},{"id":"k-t3-4-4-p2--t3-5-3-p1","from":"t3-4-4-p2","to":"t3-5-3-p1","rel":"受ける","note":"無批判な委任への懸念を受けて、委任を形づくるガードレールを述べる。","basis":"reading","vis":"public"},{"id":"k-t3-4-4-p3--t3-5-3-p3","from":"t3-4-4-p3","to":"t3-5-3-p3","rel":"使う","note":"AI を相手と感じることと正統な相手であることの区別を使って、ガードレールの限界を述べる。","basis":"reading","vis":"public"},{"id":"k-t3-5-4-p1--t3-6-p1","from":"t3-5-4-p1","to":"t3-6-p1","rel":"受ける","note":"答える場面の効果を、検証できる命題（P3）にする。","basis":"reading","vis":"public"}],"ok":1},"T4":{"tiers":[{"id":"t4-1","no":"1","title":"問題の所在","line":25,"units":["t4-1-1","t4-1-2","t4-1-3","t4-1-4","t4-1-5"]},{"id":"t4-2","no":"2","title":"概念枠組み：アドヒアランスと引き受けの構造","line":47,"units":["t4-2-1","t4-2-2","t4-2-3","t4-2-4"]},{"id":"t4-3","no":"3","title":"事例分析","line":98,"units":["t4-3"]},{"id":"t4-4","no":"4","title":"考察：非対称の経路依存と二経路モデル","line":110,"units":["t4-4-1","t4-4-2","t4-4-3","t4-4-4"]},{"id":"t4-5","no":"5","title":"失敗と成功の様式：形骸化と3M","line":152,"units":["t4-5","t4-5-1","t4-5-2","t4-5-3"]},{"id":"t4-6","no":"6","title":"結論","line":203,"units":["t4-6"]}],"units":[{"id":"t4-1-1","tier":"t4-1","no":"1.1","title":"「自分ごと化」という未成熟な要請","intro":false,"line_start":27,"line_end":30,"paras":1,"size":550,"first":{"text":"日本の組織では，「自分ごと化」という言葉が領域を問わず要請される。","line":29,"cut":false}},{"id":"t4-1-2","tier":"t4-1","no":"1.2","title":"医療が一度通過した同型の問題","intro":false,"line_start":31,"line_end":34,"paras":1,"size":377,"first":{"text":"ここで本稿が手がかりとするのは，医療が一度通過した転換である。","line":33,"cut":false}},{"id":"t4-1-3","tier":"t4-1","no":"1.3","title":"説明言語の不在という横断的な構造","intro":false,"line_start":35,"line_end":38,"paras":1,"size":313,"first":{"text":"説明言語の不在が浸透を妨げるという構造は，個別の領域でそれぞれに指摘されてきた。","line":37,"cut":false}},{"id":"t4-1-4","tier":"t4-1","no":"1.4","title":"なぜ今この再記述が必要か","intro":false,"line_start":39,"line_end":42,"paras":1,"size":329,"first":{"text":"自分ごと化の難しさは，昔からあった。","line":41,"cut":false}},{"id":"t4-1-5","tier":"t4-1","no":"1.5","title":"本稿の貢献","intro":false,"line_start":43,"line_end":46,"paras":1,"size":286,"first":{"text":"本稿の貢献は五つである。","line":45,"cut":false}},{"id":"t4-2-1","tier":"t4-2","no":"2.1","title":"医療アドヒアランスの核心：正統性の所在","intro":false,"line_start":49,"line_end":56,"paras":3,"size":968,"first":{"text":"医療において「コンプライアンス」から「アドヒアランス」への転換が指してきたのは，患者がどれだけ忠実に従うかという服従の度合いの問題ではない。","line":51,"cut":false}},{"id":"t4-2-2","tier":"t4-2","no":"2.2","title":"Mekikiによる翻訳：二つの区別の輸入","intro":false,"line_start":57,"line_end":64,"paras":3,"size":631,"first":{"text":"医療のアドヒアランス論を組織に持ち込もうとする試みは従来も散発的にあったが，共通の語彙がなかったために，類比は表面的な比喩にとどまってきた。","line":59,"cut":false}},{"id":"t4-2-3","tier":"t4-2","no":"2.3","title":"中核命題：自分ごと化とは何か","intro":false,"line_start":65,"line_end":72,"paras":3,"size":574,"first":{"text":"ここで本稿の中核命題を述べる。","line":67,"cut":false}},{"id":"t4-2-4","tier":"t4-2","no":"2.4","title":"引き受けの核：応答可能性（answerability）","intro":false,"line_start":73,"line_end":97,"paras":4,"size":1052,"first":{"text":"引き受けの中心には，能力とは独立の，ある関係が座っている。","line":75,"cut":false}},{"id":"t4-3","tier":"t4-3","no":"3","title":"事例分析","intro":false,"line_start":98,"line_end":109,"paras":4,"size":758,"first":{"text":"ここまでの枠組みを，一つの事例に当てて深く読む。","line":100,"cut":false}},{"id":"t4-4-1","tier":"t4-4","no":"4.1","title":"なぜ医療で成立しやすく組織で難しいのか","intro":false,"line_start":112,"line_end":117,"paras":2,"size":387,"first":{"text":"前節の事例は，手動の測定の反復と身体的な習得が併存した過程と，説明言語があればその効果を設計段階で意図できたこととを示した。","line":114,"cut":false}},{"id":"t4-4-2","tier":"t4-4","no":"4.2","title":"非対称の正体は経路にある","intro":false,"line_start":118,"line_end":127,"paras":4,"size":1214,"first":{"text":"しかしこの説明は，まだ医療を特別扱いしている。","line":120,"cut":false}},{"id":"t4-4-3","tier":"t4-4","no":"4.3","title":"組織アドヒアランスの二経路モデル","intro":false,"line_start":128,"line_end":145,"paras":7,"size":2052,"first":{"text":"経路1は順方向である。","line":132,"cut":false}},{"id":"t4-4-4","tier":"t4-4","no":"4.4","title":"射程の限定とその反転","intro":false,"line_start":146,"line_end":151,"paras":2,"size":634,"first":{"text":"ここで一つ，重要な限定を置く。","line":148,"cut":false}},{"id":"t4-5","tier":"t4-5","no":"5","title":"失敗と成功の様式：形骸化と3M","intro":true,"line_start":152,"line_end":155,"paras":1,"size":69,"first":{"text":"引き受けには，対になる失敗の様式と成功の様式がある。","line":154,"cut":false}},{"id":"t4-5-1","tier":"t4-5","no":"5.1","title":"失敗の様式：形骸化と自惚れ","intro":false,"line_start":156,"line_end":165,"paras":4,"size":947,"first":{"text":"自分ごと化の要請が，ある条件下で逆機能に転じることがある。","line":158,"cut":false}},{"id":"t4-5-2","tier":"t4-5","no":"5.2","title":"成功の様式：3Mの三操作","intro":false,"line_start":166,"line_end":181,"paras":7,"size":2471,"first":{"text":"反対の極に，引き受けを育てることに成功してきた設計がある。","line":168,"cut":false}},{"id":"t4-5-3","tier":"t4-5","no":"5.3","title":"先行指標による観測","intro":false,"line_start":182,"line_end":202,"paras":4,"size":710,"first":{"text":"失敗と成功の様式を分けたうえで，組織はイノベーションの管理を，遅れて出てくる指標（売上）から，先行する指標へと移すことができる。","line":184,"cut":false}},{"id":"t4-6","tier":"t4-6","no":"6","title":"結論","intro":false,"line_start":203,"line_end":214,"paras":4,"size":905,"first":{"text":"自分ごと化は，命令で直接生み出すことも，研修で直接植え付けることもできない。","line":205,"cut":false}}],"refs":[{"from":"t4-2-1","to":"t4-4-1","to_no":"4.1","line":55,"text":"この差そのものは4.1節と4.2節で正面から扱う。","cut":false,"dir":"fwd"},{"from":"t4-2-1","to":"t4-4-2","to_no":"4.2","line":55,"text":"この差そのものは4.1節と4.2節で正面から扱う。","cut":false,"dir":"fwd"},{"from":"t4-2-3","to":"t4-1-4","to_no":"1.4","line":69,"text":"前節でいえば，変換障壁のうち最も内側の，実践に染み込ませる障壁を本人が越える過程に当たり，1.4節の語でいえば内面化に相当する。","cut":false,"dir":"back"},{"from":"t4-2-4","to":"t4-2-3","to_no":"2.3","line":77,"text":"ここで，2.3節で述べた内的な更新（意図を自らの価値判断として承認すること）と，この応答可能性の関係を明確にしておく。","cut":false,"dir":"back"},{"from":"t4-2-4","to":"t4-5-1","to_no":"5.1","line":77,"text":"更新を欠いたまま応答の義務だけがある状態は5.1節で扱う形骸化の入口であり，答える相手を欠いたままの更新は，私的な決意にとどまる。","cut":false,"dir":"fwd"},{"from":"t4-2-4","to":"t4-4-1","to_no":"4","line":79,"text":"この相互性が組織の設計に何を課すかは，第4節と第5節で展開する。","cut":false,"dir":"fwd"},{"from":"t4-2-4","to":"t4-5","to_no":"5","line":79,"text":"この相互性が組織の設計に何を課すかは，第4節と第5節で展開する。","cut":false,"dir":"fwd"},{"from":"t4-3","to":"t4-5","to_no":"5","line":100,"text":"検証の経路は第5節の先行指標（表2）が開き，本節が担うのは適用の実演である。","cut":false,"dir":"fwd"},{"from":"t4-4-2","to":"t4-4-1","to_no":"4.1","line":122,"text":"ただし4.1節が述べたのは，診療が始まる時点での配置であって，その目的がどこから来たかという前史ではない。","cut":false,"dir":"back"},{"from":"t4-4-3","to":"t4-2-3","to_no":"2.3","line":132,"text":"これは2.3節で述べた自分ごと化の標準的な像であり，多くの浸透施策が暗黙に想定している経路でもある。","cut":false,"dir":"back"},{"from":"t4-4-3","to":"t4-4-1","to_no":"4.1","line":132,"text":"だがこの経路は，目的が従業員に内在しないという4.1節の事情のために，構造的に難しい。","cut":false,"dir":"back"},{"from":"t4-4-3","to":"t4-5","to_no":"5","line":132,"text":"この設計は第5節で扱う。","cut":false,"dir":"fwd"},{"from":"t4-4-3","to":"t4-1-2","to_no":"1.2","line":134,"text":"1.2節で述べた周知は，この型の施策が制度としてとる典型の形である。","cut":false,"dir":"back"},{"from":"t4-4-3","to":"t4-4-2","to_no":"4.2","line":136,"text":"4.2節の末尾で触れた趣味と同じく，組織の外の遭遇から結晶化した向きもまた，経路2が正式な検討と応答の対象とする資源のうちにある。","cut":false,"dir":"back"},{"from":"t4-4-3","to":"t4-2-4","to_no":"2.4","line":138,"text":"この二経路の対は，2.4節で置いた相互性を，組織の規模に写したものでもある。","cut":false,"dir":"back"},{"from":"t4-4-3","to":"t4-5","to_no":"5","line":138,"text":"これは，第5節で自惚れとして取り上げる歪みの，組織の規模での現れである。","cut":false,"dir":"fwd"},{"from":"t4-4-3","to":"t4-5","to_no":"5","line":140,"text":"第5節で扱う運用原則は，この媒介を人から設計へ移す試みである。","cut":false,"dir":"fwd"},{"from":"t4-4-3","to":"t4-1-4","to_no":"1.4","line":142,"text":"1.4節の律速段階の移動を管理の側から言い直せば，経験知だけで運営できていた構造が，意識して設計しなければ回らない対象に変わる，ということである。","cut":false,"dir":"back"},{"from":"t4-5-1","to":"t4-2-4","to_no":"2.4","line":162,"text":"ここで決定的なのは，2.4節で置いた区別である。","cut":false,"dir":"back"},{"from":"t4-5-1","to":"t4-2-4","to_no":"2.4","line":162,"text":"だからこそ，それが個人の能力ではなく関係の事実だという2.4節の規定が，この失敗を見抜く足場になる。","cut":false,"dir":"back"},{"from":"t4-5-1","to":"t4-2-4","to_no":"2.4","line":164,"text":"リーダーが部下に自分ごと化を求めながら，部下の判断を対等な判断として受け止めないとき，2.4節で見た相互性が欠ける。","cut":false,"dir":"back"},{"from":"t4-5-2","to":"t4-4-3","to_no":"4.3","line":168,"text":"4.3節で見た野中のミドルが人格の力で少数の向きを深く増幅する媒介だとすれば，3Mの制度化された運用は人を選ばずに広い口径で結晶化を保護する装置であり，両者は補完する。","cut":false,"dir":"back"},{"from":"t4-5-2","to":"t4-4-2","to_no":"4.2","line":168,"text":"4.2節で見たとおり，それはできない。","cut":false,"dir":"back"},{"from":"t4-5-2","to":"t4-2-4","to_no":"2.4","line":172,"text":"この第二の操作は，2.4節の相互性を制度に写した形にあたる。","cut":false,"dir":"back"},{"from":"t4-5-2","to":"t4-2-4","to_no":"2.4","line":172,"text":"なお，ここでいう説明責任は，2.4節の区別でいえば制度の層（accountability）の配置である。","cut":false,"dir":"back"},{"from":"t4-5-3","to":"t4-2-4","to_no":"2.4","line":188,"text":"既存の業務の品質や安全を自らの判断理由として保持し，その判断について日々答える立場に立ち続けること，すなわち維持を担うことも，2.4節の定義を満たす引き受けである。","cut":false,"dir":"back"}],"figs":[{"kind":"table","no":1,"label":"表1","caption":"表1　医療アドヒアランスと組織の「自分ごと化」の対応","line":83,"anchor":"t4-2-4","unit":"t4-2-4","omitted":false,"match":"exact"},{"kind":"table","no":2,"label":"表2","caption":"表2　引き受けの先行指標（候補）","line":190,"anchor":"t4-5-3","unit":"t4-5-3","omitted":false,"match":"exact"}],"parts":[{"id":"t4-1-1-p1","unit":"t4-1-1","k":1,"lines":[29,29],"label":"未成熟な要請","does":"枠","says":"自分ごと化は領域を問わず要請されるが、概念は未成熟である。目的の承認、特定の他者に答える立場、実践への身体化、従業員の向きへ組織が理由を返す経路の四つを同時に位置づける枠組みは、十分な形では示されていない。","quote":{"paper":"T4","text":"要請は強いが，要請される当のものが何であるかは，はっきりしていない。","line":29,"anchor":"t4-1-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-1-2-p1","unit":"t4-1-2","k":1,"lines":[33,33],"label":"医療が通った転換","does":"位置づけ","says":"医療は、指示への服従（コンプライアンス）から、意味を理解した主体的な参加（アドヒアランス）へ概念を転換した。組織の自分ごと化は同型の転換を暗黙に求めているが、手元の道具は多くの場合、周知までである。","quote":{"paper":"T4","text":"周知に閉じた施策は，転換前の側，すなわち服従を求めるコンプライアンスの道具立てにとどまる。","line":33,"anchor":"t4-1-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-1-3-p1","unit":"t4-1-3","k":1,"lines":[37,37],"label":"説明言語の不在","does":"主張","says":"説明言語の不在が浸透を妨げる、という指摘は複数の領域にある。不在とは、説明が皆無だということではなく、なぜやるのかを構造として渡す言語が、制度として十分に体系化されていないことを指す。","quote":{"paper":"T4","text":"なぜやるのかの説明言語が体系化されていないから浸透しない","line":37,"anchor":"t4-1-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-1-4-p1","unit":"t4-1-4","k":1,"lines":[41,41],"label":"なぜ今か","does":"主張","says":"生成 AI が速めるのは外化と結合である。律速段階は社会化と内面化の側に移り、引き受けと身体化を回せない組織がそこで詰まる。アドヒアランスの不良は以前からあったが、AI の時代に前面に出る。","quote":{"paper":"T4","text":"アドヒアランスの不良は以前から組織にあったが，AIの時代には，それが組織の速さを決める律速段階として前面に出てくる。","line":41,"anchor":"t4-1-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-1-5-p1","unit":"t4-1-5","k":1,"lines":[45,45],"label":"五つの貢献","does":"枠","says":"貢献は五つ。医療アドヒアランスの転用、引き受けと身体化による再定義、相互性という成立条件、遭遇の経路と二経路モデル、運用原則（発現条件の設計、停止判断への説明責任、先行指標による観測）。","quote":{"paper":"T4","text":"本稿の貢献は五つである。","line":45,"anchor":"t4-1-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-2-1-p1","unit":"t4-2-1","k":1,"lines":[51,51],"label":"正統性の所在が動く","does":"主張","says":"転換の核心は、服従の度合いではなく、正統性の所在が動いたことにある。医師の権限から、患者と医療者の合意へ。鍵は一致の率ではなく、一致の前にある合意である。","quote":{"paper":"T4","text":"転換の核心は，正統性の所在が動いたことにある。","line":51,"anchor":"t4-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-2-1-p2","unit":"t4-2-1","k":2,"lines":[53,53],"label":"服薬指導と DOTS","does":"例","says":"服薬指導は、命令ではなく「なぜ」を渡す行為である。説明だけでは足りない局面の設計（DOTS）から、代理ができない、その場で確認する、複数の要素を束ねる、の三つの特徴を取り出す。この三分は本稿の抽象化である。","quote":{"paper":"T4","text":"この三分は世界保健機関の公式の整理ではなく，組織への転用のために本稿が行う抽象化である。","line":53,"anchor":"t4-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-2-1-p3","unit":"t4-2-1","k":3,"lines":[55,55],"label":"転用の範囲","does":"限定","says":"組織へ移すのは三つの構造（正統性の所在の移動、なぜを渡す説明、代理できない過程を守る設計）で、当事者の条件は同型ではない。医療を先行例とするのは達成度においてではなく、捉え方の転換と研究の回路においてである。","quote":{"paper":"T4","text":"同型なのは転換の構造であって，当事者の置かれた条件ではない。","line":55,"anchor":"t4-2-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-2-2-p1","unit":"t4-2-2","k":1,"lines":[59,61],"label":"二つの区別の輸入","does":"定義","says":"先行の二つの論文から二つの区別を輸入する。専門性の基質（手順をどう使うかを定める当人の判断）と、それを成果物に変える障壁の分離。事実認識（Sein）と価値判断（Sollen）の分離。生成 AI が下げたのは主に変換の側の障壁で、基質そのものではない。","quote":{"paper":"T4","text":"生成AIが劇的に下げたのは主にこの変換側の障壁であって，基質そのものではない","line":61,"anchor":"t4-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-2-2-p2","unit":"t4-2-2","k":2,"lines":[63,63],"label":"服薬指導の書き直し","does":"含意","says":"服薬指導は、基質と判断の所在を言葉にして患者に渡す説明である。組織の「なぜこの業務が必要か」の説明も同じ構造を持ちうるが、その言語が十分に体系化されていない。","quote":{"paper":"T4","text":"服薬指導とは，基質と判断の所在を言語化して患者に手渡す説明にほかならない。","line":63,"anchor":"t4-2-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-2-3-p1","unit":"t4-2-3","k":1,"lines":[67,67],"label":"中核命題","does":"主張","says":"自分ごと化とは、経営の意図を知っている状態でも、それに従っている状態でもない。引き受けと身体化の複合である。","quote":{"paper":"T4","text":"それは，引き受けと身体化の複合である。","line":67,"anchor":"t4-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-2-3-p2","unit":"t4-2-3","k":2,"lines":[69,69],"label":"引き受けと身体化","does":"定義","says":"引き受けの内的な側は、外から来た意図を自分の判断理由として承認することである（この価値判断の方向を、向きと呼ぶ）。与えられた目標でも、引き受ければ、答えるのは自分になる。身体化は、本人が実際にやることでしか起きない。","quote":{"paper":"T4","text":"由来が外にあることと，引き受けによって自分が答える立場になることは，無関係である。","line":69,"anchor":"t4-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-2-3-p3","unit":"t4-2-3","k":3,"lines":[71,71],"label":"どちらか一方では","does":"限定","says":"向きを引き受けても身体が動かなければ言葉だけに終わり、身体が動いても向きを引き受けていなければ、言われたから動いているだけになる。","quote":{"paper":"T4","text":"引き受けと身体化は，どちらか一方では自分ごと化にならない。","line":71,"anchor":"t4-2-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-2-4-p1","unit":"t4-2-4","k":1,"lines":[75,75],"label":"答える立場","does":"定義","says":"引き受けの中心には、能力とは独立の関係がある。ある判断について、問う資格のある他者に答えなければならない立場（本文の語は応答可能性、answerability）で、能力のように他者へ移すことができない。","quote":{"paper":"T4","text":"能力のように他者へ移すことができない","line":75,"anchor":"t4-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-2-4-p2","unit":"t4-2-4","k":2,"lines":[77,77],"label":"制度の層と関係の層","does":"定義","says":"割り当て直せる制度の層を説明責任（accountability）と呼び、移転できない引き受けの立場と分ける。引き受けとは、目的を自分の判断理由として承認する内的な側が、特定の他者に理由を示す関係の中で保たれている状態を指す。","quote":{"paper":"T4","text":"本稿でいう引き受けとは，前者が後者の関係の中で保持されている状態を指す。","line":77,"anchor":"t4-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-2-4-p3","unit":"t4-2-4","k":3,"lines":[79,79],"label":"相互性","does":"主張","says":"この立場は相互的な構造を要求する。問う側が相手を対等な判断の主体として遇し、自分も答える側に立つのでなければ、一方的な要求にすぎない。経営が引き受けを求めるなら、経営の側も、従業員の判断に答える立場に立たなければならない。","quote":{"paper":"T4","text":"応答可能性の立つ場は，相互性の上にしか成立しない。","line":79,"anchor":"t4-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-2-4-p4","unit":"t4-2-4","k":4,"lines":[81,96],"label":"表：医療と組織の対応","does":"まとめ","says":"表 1 が医療と組織の対応を整理する。制度の層と関係の層の区別は、ほかの観点と同列の一項目ではなく、表の全体を貫く分析の軸である。","quote":{"paper":"T4","text":"この区別は他の観点と同列の一項目ではなく，表の全体を貫く分析の軸である。","line":96,"anchor":"t4-2-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-3-p1","unit":"t4-3","k":1,"lines":[100,100],"label":"事例の役割","does":"限定","says":"枠組みを一つの事例に当てて読む。目的は、現象を本稿の語彙へ写す手順を示すことにある。この例が示すのは主に身体化の側で、引き受けと二経路モデルの全体を実証するものではない。","quote":{"paper":"T4","text":"引き受けと二経路モデルの全体を実証するものではない","line":100,"anchor":"t4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-3-p2","unit":"t4-3","k":2,"lines":[102,104],"label":"検知管の手動測定","does":"例","says":"現場でアンモニア濃度を週に一度、手動の検知管で測る作業を若い係員に頼んだ。繰り返すうちに、色と数値と体感の対応が身体に定着した。教育的な効果は事後に認識された。","quote":{"paper":"T4","text":"色と数値と体感の対応が，係員の身体に定着していった。","line":104,"anchor":"t4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-3-p3","unit":"t4-3","k":3,"lines":[106,106],"label":"障壁を残した効果","does":"含意","says":"自動センサーに替えていたら、同じ学習は生じにくかった可能性が高い。実践に染み込ませる障壁を意図せず残したことが、測定を基質の蓄積の経路に変えた。枠組みがあれば、設計の段階で意図できた。","quote":{"paper":"T4","text":"測定という行為そのものを基質の蓄積の経路に変えた","line":106,"anchor":"t4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-3-p4","unit":"t4-3","k":4,"lines":[108,108],"label":"設計として持てるか","does":"主張","says":"説明言語の不在は、効果が生じないことを意味しない。意味するのは、効果を再現できる設計として組織が持てないことである。読者が自分の経験にこの写像を反復することが、枠組みの使い方である。","quote":{"paper":"T4","text":"だがそれは，効果を再現可能な設計として組織が持てないことを意味する。","line":108,"anchor":"t4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-4-1-p1","unit":"t4-4-1","k":1,"lines":[114,116],"label":"目的が外から降りる","does":"主張","says":"第一の説明は、診療や職務が始まる時点での、目的の所在の差である。医療では多くの場合、その時点で、患者の中に治りたいという意図が既にある。企業では目標は階層の上位から降りてくる。それを目指すべきだとする選択は経営層の価値判断で、従業員の中に対応する意図が自動的にあるわけではない。","quote":{"paper":"T4","text":"自分ごと化が組織で難しいのは，根のところで，目的が外から降りてくるからである。","line":116,"anchor":"t4-4-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-4-2-p1","unit":"t4-4-2","k":1,"lines":[120,122],"label":"分野ではなく経路","does":"主張","says":"非対称は分野に固有なのではなく、経路に固有である。医療の構造は、患者も医療者も、問題との身体的な遭遇へ接続している。目的は最初から内在していたのではなく、遭遇を通じて内在化した。","quote":{"paper":"T4","text":"非対称はドメインに固有なのではなく，経路に固有である。","line":120,"anchor":"t4-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-4-2-p2","unit":"t4-4-2","k":2,"lines":[124,124],"label":"四つの観察","does":"根拠","says":"性質の異なる四つの観察が、遭遇が先で向きが後という順序の形を共有する。これらは因果の証明ではなく、仮説と整合する異質な観察である。","quote":{"paper":"T4","text":"これらはこの機序の因果的な証明ではなく，仮説と整合する異質な観察である。","line":124,"anchor":"t4-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-4-2-p3","unit":"t4-4-2","k":3,"lines":[126,126],"label":"注入ではなく条件","does":"含意","says":"目的そのものは注入できない。しかし、従業員が身体で何に出会うかは設計できる。組織にできるのは、遭遇をはじめとする発現条件の設計である。趣味は、まだ社内の課題に接続されていないエネルギーの蓄えである。","quote":{"paper":"T4","text":"組織にできるのは目的の注入ではなく，遭遇をはじめとする発現条件の設計である。","line":126,"anchor":"t4-4-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-4-3-p1","unit":"t4-4-3","k":1,"lines":[130,132],"label":"二つの経路","does":"定義","says":"経路 1 は順方向で、経営層が意図を伝え、従業員が引き受ける。経路 2 は逆方向で、従業員が遭遇から結晶化させた向きを正式な検討に入れ、権限を持つ特定の主体が、採択・保留・停止のどれにも理由を返す。組織が必ず引き受けるのは、向きそのものではなく、それをどう扱うかという自らの判断である。","quote":{"paper":"T4","text":"組織がここで必ず引き受けるのは，向きそのものではなく，その向きをどう扱うかという自らの判断である。","line":132,"anchor":"t4-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-4-3-p2","unit":"t4-4-3","k":2,"lines":[134,134],"label":"慢性的な失敗の説明","does":"主張","says":"失敗する施策の多くは経路 1 を強く押している。しかし拘束条件は、経路 2 の不在の側にあることが多い。押している経路と、詰まっている経路が違う。","quote":{"paper":"T4","text":"押している経路と，詰まっている経路が違う。","line":134,"anchor":"t4-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-4-3-p3","unit":"t4-4-3","k":3,"lines":[136,136],"label":"組織の外の遭遇","does":"定義","says":"経路 2 の起点となる遭遇は、組織の内部に限らない。組織の外の遭遇から結晶化した向きも、正式な検討と応答の対象に含まれる。","quote":{"paper":"T4","text":"経路2の起点となる遭遇は，組織の内部に限らない。","line":136,"anchor":"t4-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-4-3-p4","unit":"t4-4-3","k":4,"lines":[138,138],"label":"相互性を組織に写す","does":"含意","says":"二経路の対は、相互性を組織の規模に写したものでもある。経路 2 を欠いて順方向だけを押す施策は、求めるが応答しないという一方的な関係の形をとる。","quote":{"paper":"T4","text":"求めるが応答しないという一方的な関係の形をとる","line":138,"anchor":"t4-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-4-3-p5","unit":"t4-4-3","k":5,"lines":[140,140],"label":"ミドルという先行例","does":"位置づけ","says":"野中らのミドル・アップダウン・マネジメントは、二つの経路を、役職という人が媒介した先行例である。本稿は野中の理論の置き換えではなく、媒介の機能を二経路に分け、設計と観測の語彙へ写す試みである。","quote":{"paper":"T4","text":"本稿は野中理論の置き換えを試みているのではない。","line":140,"anchor":"t4-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-4-3-p6","unit":"t4-4-3","k":6,"lines":[142,142],"label":"暗黙から設計へ","does":"主張","says":"二経路は、経験の豊富な管理者が名前を与えないまま回してきた。AI が外化と結合を吸収するほど、意識して設計しなければ回らない対象に変わる。","quote":{"paper":"T4","text":"意識して設計しなければ回らない対象に変わる","line":142,"anchor":"t4-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-4-3-p7","unit":"t4-4-3","k":7,"lines":[144,144],"label":"逆転の仮説","does":"予測","says":"組織と AI は判断の所在を拡散させる、という古典的な診断に対し、逆向きの可能性を示す。Sein と Sollen の分解を明示した委譲は、線引きの記録を求める。この逆転は明示を伴う場合に限られ、観測にかけるべき仮説である。","quote":{"paper":"T4","text":"ただし，この逆転はAIの導入一般に成り立つ主張ではない。","line":144,"anchor":"t4-4-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-4-4-p1","unit":"t4-4-4","k":1,"lines":[148,148],"label":"射程の限定","does":"限定","says":"この問題は普遍的ではないかもしれない。職務の範囲を契約で区切らずに範囲を超えた引き受けを求める日本型の構造で、特に顕在化しやすいと考えられる。","quote":{"paper":"T4","text":"本稿の問題設定は，契約で範囲を区切らずに自分ごと化を求める，この日本型の構造において特に顕在化しやすいと考えられる。","line":148,"anchor":"t4-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-4-4-p2","unit":"t4-4-4","k":2,"lines":[150,150],"label":"限定の反転","does":"予測","says":"限定は逆向きにも読める。生成 AI が吸収していくのは、契約に明文化できる職務の部分である。契約に書けない判断と引き受けの比重が高まれば、この問題は契約型の雇用にも合流してくる。","quote":{"paper":"T4","text":"契約で範囲を区切るという回避策そのものが効かなくなる","line":150,"anchor":"t4-4-4","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-p1","unit":"t4-5","k":1,"lines":[154,154],"label":"二つの様式","does":"枠","says":"失敗の様式と成功の様式は、引き受けという同じ過程が、条件によって反対の方向に転ぶ姿である。","quote":{"paper":"T4","text":"引き受けという同じ過程が，条件によって反対の方向に転ぶ姿である","line":154,"anchor":"t4-5","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-1-p1","unit":"t4-5-1","k":1,"lines":[158,160],"label":"形骸化","does":"主張","says":"引き受けの中身が抜け、要請の形だけが回り続ける状態を、形骸化と呼ぶ。自分ごと化が疑ってはならない価値として扱われると、人々は内容の妥当性ではなく、忠誠を表明する振る舞いを競い、学習が止まる。","quote":{"paper":"T4","text":"引き受けの中身が抜け落ち，要請の形だけが回り続ける状態である。","line":158,"anchor":"t4-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-1-p2","unit":"t4-5-1","k":2,"lines":[162,162],"label":"座に収まる代理物","does":"含意","says":"形骸化した組織では、答える立場の座に、忠誠の表明という代理物が収まっている。答える立場は個人の能力ではなく関係の事実だ、という規定が、この失敗を見抜く足場になる。","quote":{"paper":"T4","text":"応答可能性の座に，忠誠の表明という代理物が収まっている","line":162,"anchor":"t4-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-1-p3","unit":"t4-5-1","k":3,"lines":[164,164],"label":"自惚れ","does":"主張","says":"もう一つの失敗は自惚れで、相手には答えることを求めながら、自分は答える側に立たない。形骸化は集団の力学として引き受けを代理物に置き換え、自惚れは関係の構造として、引き受けが成り立つ条件を先に壊す。","quote":{"paper":"T4","text":"自惚れは関係の構造として，引き受けが成立する条件を先に壊す","line":164,"anchor":"t4-5-1","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-2-p1","unit":"t4-5-2","k":1,"lines":[168,168],"label":"3M を読み直す","does":"位置づけ","says":"3M の制度を、個人の突破力への依存を組織の側に肩代わりさせた設計として読む。設計者の意図についての歴史の主張ではなく、制度の機能の再記述である。3M がしているのは意図の製造ではなく、発現する条件を整える三つの操作である。","quote":{"paper":"T4","text":"3Mが意図そのものを製造しているのではない","line":168,"anchor":"t4-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-2-p2","unit":"t4-5-2","k":2,"lines":[170,170],"label":"止める者が答えよ","does":"主張","says":"第一の操作は、発現の阻害を除去することである。第二は説明責任の配置を変えることで、継続を既定の側に置き、説明の要求を停止の側に移す。その正体は放任ではなく、止める者が答えよ、という配置である。","quote":{"paper":"T4","text":"この停止側の設計の正体は「止めるな」という放任ではなく，「止める者が答えよ」という配置である。","line":170,"anchor":"t4-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-2-p3","unit":"t4-5-2","k":3,"lines":[172,172],"label":"相互性の制度化","does":"含意","says":"第二の操作は、相互性を制度に写した形にあたる。守られるのは実績のある個人の特権ではなく、まだ実績のない結晶化である。免責でもない。制度は移せない答える立場を作れないが、それが立つ場は用意できる。","quote":{"paper":"T4","text":"制度は移転できない応答可能性を作れないが，その立つ場を用意することはできる。","line":172,"anchor":"t4-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-2-p4","unit":"t4-5-2","k":4,"lines":[174,174],"label":"問う義務と答える義務","does":"根拠","says":"医療には、問う義務と答える義務を条文が対にして固めた、先行する同型がある。本稿はここから、制度として反復される義務がやがて構えの形成を支えうる、という仮説を置く。その制度は法である必要はなく、社内の制度化された運用でも足りうることを、3M の例は示唆する。","quote":{"paper":"T4","text":"制度として反復される義務がやがて構えの形成を支えうる，という仮説を置く","line":174,"anchor":"t4-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-2-p5","unit":"t4-5-2","k":5,"lines":[176,176],"label":"インセンティブの整合","does":"例","says":"第三の操作はインセンティブをそろえることである。途中の試行を許すことが、管理者の徳に依存せず、組織の自己利益と整合する。","quote":{"paper":"T4","text":"管理者の徳に依存せず，組織の自己利益と整合する","line":176,"anchor":"t4-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-2-p6","unit":"t4-5-2","k":6,"lines":[178,178],"label":"設計が保証する範囲","does":"限定","says":"三つを束ねた設計が保証するのは、試行の量と、結晶化した向きが殺されないことまでで、個々の試行の成功ではない。","quote":{"paper":"T4","text":"個々の試行の成功ではない","line":178,"anchor":"t4-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-2-p7","unit":"t4-5-2","k":7,"lines":[180,180],"label":"なぜ制度か","does":"根拠","says":"口頭の奨励は制度の代わりにならない。自発性は順方向の伝達には載らない。口頭の許可だけでは、誰が答えるかが固定されない。試行を言葉で守ることは、守る側の徳と勇気を消費する。説明言語と制度は、代替ではなく補完の関係にある。","quote":{"paper":"T4","text":"言語と制度は代替ではなく補完の関係にある","line":180,"anchor":"t4-5-2","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-3-p1","unit":"t4-5-3","k":1,"lines":[184,184],"label":"先行指標へ","does":"主張","says":"管理を、遅れて出る指標（売上）から、先行する指標へ移せる。観測の対象は、誰の向きがどこで結晶化しているかと、その向きが実際に動いているかである。","quote":{"paper":"T4","text":"遅れて出てくる指標（売上）から，先行する指標へと移すことができる","line":184,"anchor":"t4-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-3-p2","unit":"t4-5-3","k":2,"lines":[186,186],"label":"何を測ってよいか","does":"限定","says":"測るのは価値の中身ではなく、発現の条件と、行動に現れる相関物である。意図の更新が本当に起きたかは直接には測れない。誰が誰に理由を求め、誰が答えたかという関係の配置は、観測できる。","quote":{"paper":"T4","text":"測るのは価値の中身ではなく，発現の条件と，行動に現れる相関物である。","line":186,"anchor":"t4-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-3-p3","unit":"t4-5-3","k":3,"lines":[188,188],"label":"観測の偏り","does":"限定","says":"表 2 の指標は、結晶化と挑戦の側の引き受けを捉える。既存の業務の品質や安全を保ち、日々答える立場に立ち続ける維持も、引き受けである。指標の不在を、引き受けの不在と読み替えてはならない。","quote":{"paper":"T4","text":"表2における指標の不在を，引き受けの不在と読み替えてはならない","line":188,"anchor":"t4-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-5-3-p4","unit":"t4-5-3","k":4,"lines":[190,201],"label":"表：先行指標の候補","does":"まとめ","says":"表 2 が先行指標の候補を並べる。意図の更新そのものを測る行はない。答える立場の関係の配置は、停止の質と判断所在の明示の行で観測される。","quote":{"paper":"T4","text":"この表に，意図の更新そのもの（引き受けの内的な側）を測る行はない。","line":201,"anchor":"t4-5-3","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-6-p1","unit":"t4-6","k":1,"lines":[205,205],"label":"運用原則","does":"まとめ","says":"組織は意図を注入できないが、遭遇を設計できる。結晶化しかけた向きを理由なく止めず、止めるなら止める側が答える。内的な成立は直接には測れないと知ったうえで、関係の配置と発現の条件を観測する。","quote":{"paper":"T4","text":"止めるのであれば止める側が答える","line":205,"anchor":"t4-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-6-p2","unit":"t4-6","k":2,"lines":[207,207],"label":"AI の時代に","does":"含意","says":"生成 AI は外化と結合を速めるが、引き受ける主体と、引き受けが育つ場は、同じ仕方では速まらない。引き受けと身体化を回せるかが、組織の速さを決めるようになる。","quote":{"paper":"T4","text":"引き受けと身体化を回せるかどうかが組織の速さを決めるようになる","line":207,"anchor":"t4-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-6-p3","unit":"t4-6","k":3,"lines":[209,209],"label":"限定を逆向きに","does":"限定","says":"射程の限定を、もう一度逆向きに置く。日本型の組織がこの問題を長く抱えてきたことは、弱みであると同時に、多くの組織がこれから向き合う問題を先に経験しているということでもある。","quote":{"paper":"T4","text":"弱みであると同時に，これから多くの組織が向き合う問題を先に経験しているということでもある","line":209,"anchor":"t4-6","match":"exact"},"basis":"reading","vis":"public"},{"id":"t4-6-p4","unit":"t4-6","k":4,"lines":[211,211],"label":"知・好・楽","does":"位置づけ","says":"論語の言葉（知る者は好む者に及ばず、好む者は楽しむ者に及ばない）を引く。周知が渡せるのは、知るまでである。二経路モデルはこの言葉と響き合う。欠けていたのは教えではなく、教えを組織の設計に写す語彙である。","quote":{"paper":"T4","text":"欠けていたのは教えではなく，教えを組織の設計に写す語彙である。","line":211,"anchor":"t4-6","match":"exact"},"basis":"reading","vis":"public"}],"links":[{"id":"k-t4-1-2-p1--t4-2-1-p1","from":"t4-1-2-p1","to":"t4-2-1-p1","rel":"受ける","note":"医療の転換を、正統性の所在の移動として捉え直す。","basis":"reading","vis":"public"},{"id":"k-t4-1-3-p1--t4-3-p4","from":"t4-1-3-p1","to":"t4-3-p4","rel":"使う","note":"説明言語の不在が何を意味するかを、事例で述べる（効果が生じないことではなく、設計として持てないこと）。","basis":"reading","vis":"public"},{"id":"k-t4-1-4-p1--t4-4-3-p6","from":"t4-1-4-p1","to":"t4-4-3-p6","rel":"言い換える","note":"律速段階の移動を、管理の側から言い直す。","basis":"reading","vis":"public"},{"id":"k-t4-1-5-p1--t4-6-p1","from":"t4-1-5-p1","to":"t4-6-p1","rel":"まとめる","note":"挙げた貢献を、運用原則と二経路モデルとして結ぶ。","basis":"reading","vis":"public"},{"id":"k-t4-2-1-p3--t4-4-1-p1","from":"t4-2-1-p3","to":"t4-4-1-p1","rel":"受ける","note":"患者と従業員の条件の差を扱う。","basis":"reading","vis":"public"},{"id":"k-t4-2-2-p1--t4-3-p3","from":"t4-2-2-p1","to":"t4-3-p3","rel":"使う","note":"変換の障壁のうち最も内側のもの（実践への浸透）を、事例の読みに使う。","basis":"reading","vis":"public"},{"id":"k-t4-2-2-p1--t4-4-3-p7","from":"t4-2-2-p1","to":"t4-4-3-p7","rel":"使う","note":"Sein と Sollen の分離を、委譲の線引きの記録に使う。","basis":"reading","vis":"public"},{"id":"k-t4-2-4-p1--t4-5-1-p2","from":"t4-2-4-p1","to":"t4-5-1-p2","rel":"使う","note":"答える立場は能力ではなく関係の事実だ、という規定を、形骸化を見抜く足場に使う。","basis":"reading","vis":"public"},{"id":"k-t4-2-4-p2--t4-5-1-p1","from":"t4-2-4-p2","to":"t4-5-1-p1","rel":"受ける","note":"更新を欠いたまま応答の義務だけがある状態（形骸化の入口）を、形骸化の節で扱う。","basis":"reading","vis":"public"},{"id":"k-t4-2-4-p3--t4-4-3-p4","from":"t4-2-4-p3","to":"t4-4-3-p4","rel":"使う","note":"相互性を、組織の規模に写す。","basis":"reading","vis":"public"},{"id":"k-t4-2-4-p3--t4-5-1-p3","from":"t4-2-4-p3","to":"t4-5-1-p3","rel":"使う","note":"相互性が欠けた形として、自惚れを述べる。","basis":"reading","vis":"public"},{"id":"k-t4-2-4-p3--t4-5-2-p3","from":"t4-2-4-p3","to":"t4-5-2-p3","rel":"使う","note":"相互性を、制度に写す。","basis":"reading","vis":"public"},{"id":"k-t4-3-p1--t4-5-3-p4","from":"t4-3-p1","to":"t4-5-3-p4","rel":"確かめる","note":"事例は適用の実演で、検証の経路は先行指標の表が開く、と本文が述べている。","basis":"reading","vis":"public"},{"id":"k-t4-4-1-p1--t4-4-2-p1","from":"t4-4-1-p1","to":"t4-4-2-p1","rel":"限定する","note":"目的の所在の差という説明を、分野の差ではなく経路の差として置き直す。","basis":"reading","vis":"public"},{"id":"k-t4-4-2-p1--t4-4-2-p2","from":"t4-4-2-p1","to":"t4-4-2-p2","rel":"支える","note":"四つの観察が、目的は遭遇を通じて内在化した、という読みと整合する（因果の証明ではない）。","basis":"reading","vis":"public"},{"id":"k-t4-4-2-p3--t4-4-3-p3","from":"t4-4-2-p3","to":"t4-4-3-p3","rel":"使う","note":"趣味と同じく、組織の外の遭遇も資源に含める。","basis":"reading","vis":"public"},{"id":"k-t4-4-2-p3--t4-5-2-p1","from":"t4-4-2-p3","to":"t4-5-2-p1","rel":"使う","note":"意図は製造できない、という点を、3M の読みに使う。","basis":"reading","vis":"public"},{"id":"k-t4-4-3-p1--t4-5-2-p2","from":"t4-4-3-p1","to":"t4-5-2-p2","rel":"受ける","note":"経路 2 に残る設計課題（止めるなら誰が答えるか）を、停止側の説明責任として扱う。","basis":"reading","vis":"public"},{"id":"k-t4-4-3-p3--t4-5-3-p4","from":"t4-4-3-p3","to":"t4-5-3-p4","rel":"使う","note":"遭遇の定義域（業務の内外）を、指標の区分に写す。","basis":"reading","vis":"public"},{"id":"k-t4-4-3-p4--t4-5-1-p3","from":"t4-4-3-p4","to":"t4-5-1-p3","rel":"受ける","note":"求めるが応答しない関係を、自惚れとして取り上げる。","basis":"reading","vis":"public"},{"id":"k-t4-4-3-p5--t4-5-2-p1","from":"t4-4-3-p5","to":"t4-5-2-p1","rel":"受ける","note":"人による媒介（ミドル）と、制度による保護（3M）を、補い合うものとして読む。","basis":"reading","vis":"public"},{"id":"k-t4-4-3-p7--t4-5-3-p4","from":"t4-4-3-p7","to":"t4-5-3-p4","rel":"確かめる","note":"逆転の仮説を、判断所在の明示の行で観測できる形にする。","basis":"reading","vis":"public"},{"id":"k-t4-4-4-p2--t4-6-p3","from":"t4-4-4-p2","to":"t4-6-p3","rel":"言い換える","note":"限定の反転を、結論でもう一度示す。","basis":"reading","vis":"public"},{"id":"k-t4-5-3-p2--t4-6-p1","from":"t4-5-3-p2","to":"t4-6-p1","rel":"まとめる","note":"測れるものと測れないものの線を、運用原則に結ぶ。","basis":"reading","vis":"public"}],"ok":1},"T5":{"tiers":[{"id":"t5-abstract","no":"","title":"Abstract","line":11,"units":["t5-abstract"]},{"id":"t5-1","no":"1","title":"Introduction","line":21,"units":["t5-1"]},{"id":"t5-2","no":"2","title":"The Separation: Achieved State and Participation","line":47,"units":["t5-2-1","t5-2-2","t5-2-3"]},{"id":"t5-3","no":"3","title":"The Non-Transferability Theorem","line":75,"units":["t5-3-1","t5-3-2","t5-3-3","t5-3-4","t5-3-5"]},{"id":"t5-4","no":"4","title":"The Conditions of Acceptance","line":127,"units":["t5-4-1","t5-4-2","t5-4-3","t5-4-4","t5-4-5","t5-4-6"]},{"id":"t5-5","no":"5","title":"A Completed Historical Case","line":195,"units":["t5-5-1","t5-5-2","t5-5-3","t5-5-4"]},{"id":"t5-postscript","no":"","title":"Postscript","line":225,"units":["t5-postscript"]}],"units":[{"id":"t5-abstract","tier":"t5-abstract","no":"","title":"Abstract","intro":false,"line_start":11,"line_end":14,"paras":1,"size":227,"first":{"text":"Knowledge work is learning to hand itself over.","line":13,"cut":false}},{"id":"t5-1","tier":"t5-1","no":"1","title":"Introduction","intro":false,"line_start":21,"line_end":46,"paras":12,"size":2287,"first":{"text":"In November 2019, Lee Sedol retired from professional Go.","line":23,"cut":false}},{"id":"t5-2-1","tier":"t5-2","no":"2.1","title":"The apparatus","intro":false,"line_start":49,"line_end":58,"paras":4,"size":510,"first":{"text":"Two traditions have tried to say what play is.","line":51,"cut":false}},{"id":"t5-2-2","tier":"t5-2","no":"2.2","title":"What delegation delivers, and what it dissolves","intro":false,"line_start":59,"line_end":68,"paras":4,"size":369,"first":{"text":"With the apparatus in hand, delegation can be defined without leaving Suits's vocabulary.","line":61,"cut":false}},{"id":"t5-2-3","tier":"t5-2","no":"2.3","title":"Two clarifications","intro":false,"line_start":69,"line_end":74,"paras":2,"size":410,"first":{"text":"*Professionals.* An objection arises at the definitional stage and, if sound, would wreck Section 5 before it begins: professional players play for money, and an activity pursued for money is not pursued for its own sake, so on this definition professionals ar","line":71,"cut":true}},{"id":"t5-3-1","tier":"t5-3","no":"3.1","title":"Statement and scope","intro":false,"line_start":77,"line_end":88,"paras":5,"size":496,"first":{"text":"The theorem can now be stated.","line":79,"cut":false}},{"id":"t5-3-2","tier":"t5-3","no":"3.2","title":"The criterion: undertaking, not provenance","intro":false,"line_start":89,"line_end":96,"paras":3,"size":473,"first":{"text":"What separates the player from the agent that merely realises p? A tempting first answer is the causal provenance of the goal: the machine's objective was written by its designers, whereas the player's is his own.","line":91,"cut":false}},{"id":"t5-3-3","tier":"t5-3","no":"3.3","title":"Independence from the status of AI","intro":false,"line_start":97,"line_end":106,"paras":4,"size":439,"first":{"text":"Behavioural indiscernibility invites a behaviourist reply, and the strongest version belongs to Danaher (2020): if an entity is behaviourally equivalent to one that merits a given treatment, it merits that treatment — no inspection of inner lives required.","line":99,"cut":false}},{"id":"t5-3-4","tier":"t5-3","no":"3.4","title":"Two roots and two world-images","intro":false,"line_start":107,"line_end":120,"paras":6,"size":884,"first":{"text":"The theorem, so defended, has a deeper basis, and stating it pays two debts at once: it connects this paper to the series it closes, and it gives Kawatani (2012) the theoretical seat promised in Section 1.","line":109,"cut":false}},{"id":"t5-3-5","tier":"t5-3","no":"3.5","title":"A first-person corollary","intro":false,"line_start":121,"line_end":126,"paras":2,"size":264,"first":{"text":"The theorem has an operational form that any reader can apply without instruments, and it is worth stating because it translates the lusory attitude into the vocabulary of delegation.","line":123,"cut":false}},{"id":"t5-4-1","tier":"t5-4","no":"4.1","title":"The vision of collapse and its heirs","intro":false,"line_start":129,"line_end":140,"paras":5,"size":923,"first":{"text":"The strongest objection to everything so far is Suits's own.","line":131,"cut":false}},{"id":"t5-4-2","tier":"t5-4","no":"4.2","title":"Diagnosis and the third response","intro":false,"line_start":141,"line_end":148,"paras":3,"size":535,"first":{"text":"The dropping-out mechanism has a hidden premise, and the premise is false.","line":143,"cut":false}},{"id":"t5-4-3","tier":"t5-4","no":"4.3","title":"Dignity apparatuses","intro":false,"line_start":149,"line_end":164,"paras":7,"size":560,"first":{"text":"A dignity apparatus is a cultural form that makes autotelic activity socially recognisable as worth taking seriously — that blocks the default downgrade of such activity to \"mere\" play.","line":151,"cut":false}},{"id":"t5-4-4","tier":"t5-4","no":"4.4","title":"Price and dignity: what the apparatus protects","intro":false,"line_start":165,"line_end":182,"paras":8,"size":1560,"first":{"text":"It remains to say, in one vocabulary, what the apparatus protects.","line":167,"cut":false}},{"id":"t5-4-5","tier":"t5-4","no":"4.5","title":"Two further pillars","intro":false,"line_start":183,"line_end":190,"paras":3,"size":439,"first":{"text":"Two further observations bear on the vision's empirical weight; neither is a proof, and the first is offered explicitly as an analogue rather than a counterexample.","line":185,"cut":false}},{"id":"t5-4-6","tier":"t5-4","no":"4.6","title":"What this account does not license","intro":false,"line_start":191,"line_end":194,"paras":1,"size":260,"first":{"text":"Two prohibitions bound the account, and
